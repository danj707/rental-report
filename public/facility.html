  // read-only surface (see CLAUDE.md) — the fix is the same shape: keep a flag
  // that is true only when the feed actually ANSWERED.
  const [permitsOk, setPermitsOk] = useState(null);   // null = still asking
  const [permitLoading, setPermitLoading] = useState(false);
  const [showPaid, setShowPaid] = useState(() => {
    try { return localStorage.getItem('col_paid') !== 'false'; } catch { return true; }
  });
  const [showNotes, setShowNotes] = useState(() => {
    try { return localStorage.getItem('col_notes') !== 'false'; } catch { return true; }
  });
  const [showPermit, setShowPermit] = useState(() => {
    try { return localStorage.getItem('col_permit') !== 'false'; } catch { return true; }
  });
  // AN ORG CAN TAKE PII OFF THE SCHEDULE (Dan, 2026-09-09: "we don't want to
  // include PII here unless the org wants it", then "phone and email should be
  // checked by default"). They start ON, as they always have, so nobody loses a
  // column they were using - what is new is that they can be switched off, and
  // that switching them off reaches the printed page and the spreadsheet.
  //
  // These two are unlike every other column toggle here: the rest are display
  // preferences, these decide whether a resident's phone number and email leave
  // the building on a document somebody emails around.
  //
  // PRECEDENCE IS URL -> THIS BROWSER'S PREFERENCE -> ON. The `pii` parameter
  // exists for the PDF: the print page is this page under ?_print=1 rendered by
  // Puppeteer with an EMPTY localStorage, so without it the PDF could only ever
  // show the default whatever was on screen - the exact trap the GL refund view
  // hit. With the default now ON, that trap is no longer the safe direction: a
  // reader who switched PII off would still get a PDF carrying it. So the
  // toggles ride the URL, and downloadPdf sets the parameter unconditionally.
  const [showPhone, setShowPhone] = useState(() => piiInitial('phone'));
  const [showEmail, setShowEmail] = useState(() => piiInitial('email'));

  const [showLink, setShowLink] = useState(() => {
    try { return localStorage.getItem('col_link') === 'true'; } catch { return false; }
  });
  const [showResident, setShowResident] = useState(() => {
    try { return localStorage.getItem('col_resident') !== 'false'; } catch { return true; }
  });
  const [showBookType, setShowBookType] = useState(() => {
    try { return localStorage.getItem('col_booktype') !== 'false'; } catch { return true; }
  });
  const [showLighting, setShowLighting] = useState(() => {
    try { return localStorage.getItem('col_lighting') === 'true'; } catch { return false; }
  });
  // OPT-IN: this column is new to a report every org already prints, and
  // defaulting it ON would widen all of their PDFs without anyone asking.
  //
  // URL FIRST, then this browser, then off — the piiInitial rule, and it is the
  // reason the column can reach the PDF at all. The server-rendered PDF is this
  // page under ?_print=1 in a browser with an EMPTY localStorage, so a column
  // kept only in storage has no channel to it: the reader ticks Site Type, hits
  // PDF, and the column is silently absent. Every other opt-in column on this
  // page still has that gap; `pii` is the one that was fixed, and this follows
  // it rather than widening the fix into columns nobody asked about.
  const [showSiteType, setShowSiteType] = useState(() => {
    const fromUrl = new URLSearchParams(window.location.search).get('sitetype');
    if (fromUrl !== null) return fromUrl === '1';
    try { return localStorage.getItem('col_sitetype') === 'true'; } catch { return false; }
  });
  const [filterLighting, setFilterLighting] = useState(false);
  const [bookTypeFilter, setBookTypeFilter] = useState(params.book_type || 'all');
  const [showMetrics, setShowMetrics] = useState(() => {
    try { return localStorage.getItem('facility_metrics') === 'true'; } catch { return false; }
  });
  useEffect(() => { try { localStorage.setItem('facility_metrics', showMetrics); } catch {} }, [showMetrics]);
  const [showHeatmap, setShowHeatmap] = useState(() => {
    try { return localStorage.getItem('facility_heatmap') === 'true'; } catch { return false; }
  });
  useEffect(() => { try { localStorage.setItem('facility_heatmap', showHeatmap); } catch {} }, [showHeatmap]);

  useEffect(() => { try { localStorage.setItem('col_headcount', showHeadCount); } catch {} }, [showHeadCount]);
  useEffect(() => { try { localStorage.setItem('col_total',     showTotal);     } catch {} }, [showTotal]);
  useEffect(() => { try { localStorage.setItem('col_addon_fees', showAddons); } catch {} }, [showAddons]);
  useEffect(() => { try { localStorage.setItem('col_forms', showFormsCol); } catch {} }, [showFormsCol]);
  useEffect(() => { try { localStorage.setItem('col_paid',       showPaid);       } catch {} }, [showPaid]);

  // One request per view of the schedule. Soft-fails to no chips rather than
  // surfacing an error: a missing permit link must not look like a broken report.
  useEffect(() => {
    const parts = window.location.pathname.split('/').filter(Boolean);
    if (!parts.length) return;
    fetch(withToken(`/${parts[0]}/facility/api/permits`))
      .then(r => r.json())
      .then(d => {
        setPermits(d && d.permits ? d.permits : {});
        // A soft-failed route answers 200 with { error: true } — that is a
        // failure, not an org without permits.
        setPermitsOk(!(d && d.error));
      })
      .catch(() => { setPermits({}); setPermitsOk(false); });
  }, []);

  // Same contract as permits: one request per view, soft-failing to no column.
  // An org with no forms card configured gets `disabled` and never sees the
  // column — nothing to switch on per org.
  useEffect(() => {
    const parts = window.location.pathname.split('/').filter(Boolean);
    if (!parts.length) return;
    fetch(withToken(`/${parts[0]}/facility/api/forms`))
      .then(r => r.json())
      .then(d => { setFormCounts(d && d.forms ? d.forms : {}); setFormsOk(!(d && d.error)); })
      .catch(() => { setFormCounts({}); setFormsOk(false); });
  }, []);
  useEffect(() => { try { localStorage.setItem('col_notes',     showNotes);     } catch {} }, [showNotes]);
  useEffect(() => { try { localStorage.setItem('col_permit',    showPermit);    } catch {} }, [showPermit]);
  // GATED ON THE URL NOT CARRYING `pii`. Opening somebody's shared link, or the
  // print page, must not quietly rewrite the reader's own default - a link that
  // reveals a phone number once would otherwise turn the column on for them
  // permanently. Same rule as the GL refund view's persist gate.
  useEffect(() => {
    if (params.pii != null) return;
    try { localStorage.setItem('col_phone', showPhone); } catch {}
  }, [showPhone, params.pii]);
  useEffect(() => {
    if (params.pii != null) return;
    try { localStorage.setItem('col_email', showEmail); } catch {}
  }, [showEmail, params.pii]);
  useEffect(() => { try { localStorage.setItem('col_link',      showLink);      } catch {} }, [showLink]);
  // Gated like `pii`: opening somebody's shared link, or the print page, must
  // not quietly rewrite this reader's own default.
  useEffect(() => {
    if (params.sitetype != null) return;
    try { localStorage.setItem('col_sitetype', showSiteType); } catch {}
  }, [showSiteType, params.sitetype]);
  useEffect(() => { try { localStorage.setItem('col_resident',  showResident);  } catch {} }, [showResident]);
  useEffect(() => { try { localStorage.setItem('col_booktype',  showBookType);  } catch {} }, [showBookType]);
  useEffect(() => { try { localStorage.setItem('col_lighting',   showLighting);   } catch {} }, [showLighting]);

  // ── Location filter state ────────────────────────────────────────
  const [allLocations,      setAllLocations]      = useState([]);
  const [allSites,          setAllSites]          = useState([]);
  const [showEmailModal, setShowEmailModal] = useState(false);
  const [emailAddr, setEmailAddr] = useState('');
  const [emailCadence, setEmailCadence] = useState('weekly');
  const [emailDateRange, setEmailDateRange] = useState('next7');
  const [emailStatus, setEmailStatus] = useState(null);
  const [selectedLocations, setSelectedLocations] = useState(null);
  const [selectedSites,     setSelectedSites]     = useState(null);
  const [selectedAddOns,    setSelectedAddOns]    = useState(null);
  const [selectedSiteTypes, setSelectedSiteTypes] = useState(null);
  const [allSiteTypes,      setAllSiteTypes]      = useState([]);

  // ── Saved views ──────────────────────────────────────────────────
  // Shared per org, like the Fast Track pins: auth is one token per org, so
  // there is no per-user list to build yet.
  const [views, setViews]               = useState([]);
  const [activeViewId, setActiveViewId] = useState(null);
  const [pickerOpen, setPickerOpen]     = useState(false);
  const [rowMenu, setRowMenu]           = useState(null);   // id of the view whose ⋯ menu is open
  const [saveForm, setSaveForm]         = useState(null);   // open save/rename dialog
  const [viewBusy, setViewBusy]         = useState(false);
  const [undoView, setUndoView]         = useState(null);   // { id, name } behind the Undo toast
  const [viewWarn, setViewWarn]         = useState(null);   // a view named filters this window has no rows for
  const [viewsRestored, setViewsRestored] = useState(false);
  const pickerRef = useRef(null);

  // ── AI Insights state ────────────────────────────────────────────

  // Share Link: expose the live applied filter state so the floating Share

  function EmailSubscribeModal() {
    if (!showEmailModal) return null;
    const activeFilters = [];
    if (selectedLocations && allLocations.length > 0 && selectedLocations.size < allLocations.length) {
      activeFilters.push([...selectedLocations].length + ' of ' + allLocations.length + ' locations');
    }
    if (selectedSites && allSites.length > 0 && selectedSites.size < allSites.length) {
      activeFilters.push([...selectedSites].length + ' of ' + allSites.length + ' site types');
    }
    if (selectedAddOns && allAddOns.length > 0 && selectedAddOns.size < allAddOns.length) {
      activeFilters.push([...selectedAddOns].length + ' of ' + allAddOns.length + ' add-ons');
    }
    if (bookTypeFilter !== 'all') activeFilters.push('Booking: ' + bookTypeFilter);

    // ONE definition of "what is filtered right now", shared with the saved
    // views. This used to build its own string and had already drifted: it
    // predated the site-type filter and omitted it, so a subscriber's emailed
    // PDF carried site types the reader had excluded from the screen.
    function buildFilterParams() { return currentFilterParams; }

    // Send Test and Subscribe build ONE payload. If they built two, the test
    // email could be scoped differently from the subscription it is meant to
    // preview — a test that passes without testing the thing.
    function subscribePayload() {
      const filterStr = buildFilterParams();
      const body = {
        email: emailAddr.trim(),
        reports: ['facility'],
        schedule: emailCadence,
        reportDateRanges: { facility: emailDateRange },
      };
      if (filterStr) body.reportParams = { facility: filterStr };
      return body;
    }
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((emailAddr || '').trim());

    async function handleSendTest() {
      if (!emailValid) return;
      setEmailStatus('testing');
      try {
        const segs = window.location.pathname.split('/').filter(Boolean);
        const org = segs[0];
        const token = new URLSearchParams(window.location.search).get('token') || '';
        const body = subscribePayload();
        const resp = await fetch('/' + org + '/admin/test-send?token=' + token, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: body.email, report: 'facility', schedule: body.schedule,
            dateRange: emailDateRange,
            reportParams: (body.reportParams && body.reportParams.facility) || '',
          }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed');
        setEmailStatus('tested');
      } catch (e) {
        setEmailStatus('error: ' + e.message);
      }
    }

    async function handleSubscribe() {
      if (!emailValid) return;
      setEmailStatus('sending');
      try {
        const segs = window.location.pathname.split('/').filter(Boolean);
        const org = segs[0];
        const token = new URLSearchParams(window.location.search).get('token') || '';
        const body = subscribePayload();
        const resp = await fetch('/' + org + '/admin/subscribe?token=' + token, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Failed');
        setEmailStatus('success');
      } catch (e) {
        setEmailStatus('error: ' + e.message);
      }
    }

    const cadenceOptions = [['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']];
    const rangeOptions = [['next7','Next 7 days'],['next30','Next 30 days'],['last7','Last 7 days'],['lastMonth','Last month']];

    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center'}}
           onClick={e => { if (e.target === e.currentTarget) setShowEmailModal(false); }}>
        <div style={{background:'#fff',borderRadius:12,padding:'28px 32px',width:420,maxWidth:'90vw',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
          <h3 style={{margin:'0 0 6px',fontSize:18,color:'#111'}}>Subscribe to Facility Report</h3>
          {activeFilters.length > 0 && (
            <div style={{background:'#fefce8',border:'1px solid #fde68a',borderRadius:6,padding:'8px 12px',margin:'8px 0 16px',fontSize:12,color:'#92400e'}}>
              <strong>Active filters will be saved:</strong><br/>
              {activeFilters.join(' | ')}
            </div>
          )}
          {activeFilters.length === 0 && (
            <p style={{color:'#888',fontSize:13,margin:'4px 0 8px'}}>No filters active. You will receive the full report.</p>
          )}
          <p style={{color:'#666',fontSize:12,margin:'0 0 16px',lineHeight:1.5}}>
            Send yourself a test first, check it lands the way you want, then subscribe.
            The test uses the filters and date range set right here.
          </p>

          {emailStatus === 'success' ? (
            <div style={{textAlign:'center',padding:'20px 0'}}>
              <div style={{fontSize:32,marginBottom:8}}>✅</div>
              <div style={{fontSize:15,fontWeight:600,color:'#16a34a',marginBottom:4}}>Subscribed!</div>
              <div style={{fontSize:13,color:'#666'}}>You will receive {emailCadence} emails at 7am ET.</div>
              <button onClick={() => { setShowEmailModal(false); setEmailStatus(null); }}
                style={{marginTop:16,padding:'8px 20px',background:'#16a34a',color:'#fff',border:'none',borderRadius:6,cursor:'pointer',fontWeight:600}}>
                Done
              </button>
            </div>
          ) : (
            <div>
              <label style={{display:'block',fontSize:11,color:'#999',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4,fontWeight:500}}>Email</label>
              <input value={emailAddr} onChange={e => setEmailAddr(e.target.value)}
                placeholder="you@example.gov" style={{width:'100%',padding:'8px 10px',border:'1px solid #ddd',borderRadius:6,fontSize:13,marginBottom:14,boxSizing:'border-box'}} />

              <label style={{display:'block',fontSize:11,color:'#999',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6,fontWeight:500}}>Date Range</label>
              <div style={{display:'flex',gap:6,marginBottom:14,flexWrap:'wrap'}}>
                {rangeOptions.map(([val,lbl]) => (
                  <button key={val} onClick={() => setEmailDateRange(val)}
                    style={{padding:'5px 12px',borderRadius:16,border: emailDateRange===val ? '2px solid #16a34a' : '1px solid #ddd',
                    background: emailDateRange===val ? '#f0fdf4' : '#fff', fontSize:12,cursor:'pointer',fontWeight: emailDateRange===val ? 600 : 400}}>
                    {lbl}
                  </button>
                ))}
              </div>

              <label style={{display:'block',fontSize:11,color:'#999',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:6,fontWeight:500}}>Cadence</label>
              <div style={{display:'flex',gap:6,marginBottom:18}}>
                {cadenceOptions.map(([val,lbl]) => (
                  <button key={val} onClick={() => setEmailCadence(val)}
                    style={{padding:'5px 14px',borderRadius:16,border: emailCadence===val ? '2px solid #16a34a' : '1px solid #ddd',
                    background: emailCadence===val ? '#f0fdf4' : '#fff', fontSize:12,cursor:'pointer',fontWeight: emailCadence===val ? 600 : 400}}>
                    {lbl}
                  </button>
                ))}
              </div>

              <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
                <button onClick={() => { setShowEmailModal(false); setEmailStatus(null); }}
                  style={{padding:'8px 16px',background:'#f3f4f6',border:'none',borderRadius:6,cursor:'pointer',fontSize:13}}>Cancel</button>
                <button data-send-test onClick={handleSendTest} disabled={!emailValid || emailStatus === 'testing' || emailStatus === 'sending'}
                  title={emailValid ? 'Send this exact report to that address now' : 'Enter an email address first'}
                  style={{padding:'8px 16px',background:'#fff',color:'#166534',border:'1px solid #86efac',borderRadius:6,fontSize:13,fontWeight:600,
                  cursor: emailValid ? 'pointer' : 'not-allowed', opacity: (!emailValid || emailStatus === 'testing') ? 0.5 : 1}}>
                  {emailStatus === 'testing' ? 'Sending…' : '📨 Send Test'}
                </button>
                <button onClick={handleSubscribe} disabled={!emailValid || emailStatus === 'sending' || emailStatus === 'testing'}
                  style={{padding:'8px 20px',background:'#16a34a',color:'#fff',border:'none',borderRadius:6,fontWeight:600,fontSize:13,
                  cursor: emailValid ? 'pointer' : 'not-allowed',
                  opacity: (!emailValid || emailStatus === 'sending') ? 0.5 : 1}}>
                  {emailStatus === 'sending' ? 'Subscribing...' : 'Subscribe'}
                </button>
              </div>
              {emailStatus === 'tested' && (
                <div style={{color:'#166534',background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:6,padding:'8px 10px',fontSize:12,marginTop:10}}>
                  Test sent to <b>{emailAddr.trim()}</b> — it takes a moment to build. Check it, then subscribe.
                </div>
              )}
              {emailStatus && emailStatus.startsWith('error') && (
                <div style={{color:'#ef4444',fontSize:12,marginTop:8}}>{emailStatus.replace('error: ','')}</div>
              )}
            </div>
          )}
        </div>
      </div>
    );
  }

  // widget copies a URL that reproduces the on-screen view (mirrors the PDF).
  useEffect(() => {
    window.recShareLink = () => {
      const qs = new URLSearchParams();
      qs.set('start_date', loadedStart || startDate);
      qs.set('end_date',   loadedEnd   || endDate);
      if (selectedLocations) { const a = [...selectedLocations]; if (a.length) qs.set('locations', a.join(',')); }
      if (selectedSites)     { const a = [...selectedSites];     if (a.length) qs.set('sites',     a.join(',')); }
      if (bookTypeFilter && bookTypeFilter !== 'all') qs.set('book_type', bookTypeFilter);
      if (selectedAddOns)    { const a = [...selectedAddOns];    if (a.length) qs.set('addons',    a.join(',')); }
      // Same condition and same empty-is-real rule as downloadPdf, so Copy Link
      // and PDF cannot disagree about what the reader was looking at.
      if (selectedSiteTypes && allSiteTypes.length > 0 && selectedSiteTypes.size < allSiteTypes.length) {
        qs.set('site_types', [...selectedSiteTypes].join(','));
      }
      qs.set('sitetype', showSiteType ? '1' : '0');
      qs.set('pii', piiParam(showPhone, showEmail));
      if (URL_TOKEN) qs.set('token', URL_TOKEN);
      return `${window.location.pathname}?${qs.toString()}`;
    };
    return () => { try { delete window.recShareLink; } catch (e) { window.recShareLink = undefined; } };
  }, [loadedStart, loadedEnd, startDate, endDate, selectedLocations, selectedSites, selectedAddOns,
      selectedSiteTypes, allSiteTypes, bookTypeFilter, showSiteType, showPhone, showEmail]);

  useEffect(() => {
    if (params._print === '1') document.body.classList.add('print-mode');
  }, [params._print]);

  // ── Fetch ────────────────────────────────────────────────────────
  const fetchData = useCallback((sd, ed) => {
    setLoading(true);
    setError(null);

    const qs = new URLSearchParams();
    if (sd) qs.set('start_date', sd);
    if (ed) qs.set('end_date',   ed);
    if (params.location_name) qs.set('location_name', params.location_name);
    if (params.site_type)     qs.set('site_type',     params.site_type);
    if (params._nocache === '1' || params._refresh === '1') qs.set('_nocache', '1');

    const pathParts = window.location.pathname.replace(/\/$/, '').split('/');
    const apiBase = pathParts.length >= 3
      ? `/${pathParts[1]}/${pathParts[2]}/api/data`
      : '/api/data';

    fetch(withToken(`${apiBase}?${qs.toString()}`))
      .then(async r => {
        if (!r.ok) throw await reportFetchError(r);
        return r.json();
      })
      .then(json => {
        const normalized = json.rows.map(normalizeRow);
        setRows(normalized);
        setMeta(json.meta || {});
        setLoadedStart(sd);
        setLoadedEnd(ed);

        // Assign colors to any new locations
        const locs = [...new Set(normalized.map(r => r.location).filter(Boolean))].sort();
        setLocationColors(prev => {
          const next = assignColors(locs, prev);
          saveLocationColors(orgSlug, next);
          return next;
        });

        // Accumulate all known locations (never remove historical ones)
        setAllLocations(prev => {
          const merged = new Set(prev);
          locs.forEach(l => merged.add(l));
          return [...merged].sort();
        });

        setSelectedLocations(prev => {
          if (prev === null) {
            // Respect shared URL locations param
            if (params.locations) {
              const shared = params.locations.split(',').map(l => l.trim()).filter(l => locs.includes(l));
              if (shared.length > 0) return new Set(shared);
            }
            const defaultLoc = window.ORG_CONFIG?.defaultLocationFilter;
            if (defaultLoc && locs.includes(defaultLoc)) return new Set([defaultLoc]);
            return new Set(locs);
          }
          const next = new Set(prev);
          locs.forEach(l => { if (!next.has(l)) next.add(l); });
          return next;
        });

        // Accumulate all known site types (never remove historical ones)
        {
          const sites = [...new Set(normalized.map(r => r.site).filter(Boolean))].sort();
          setAllSites(prev => {
            const merged = new Set(prev);
            sites.forEach(s => merged.add(s));
            return [...merged].sort();
          });
        }

        setSelectedSites(prev => {
          if (prev === null) {
            const sites = [...new Set(normalized.map(r => r.site).filter(Boolean))].sort();
            // Respect shared URL sites param
            if (params.sites) {
              const shared = params.sites.split(',').map(s => s.trim()).filter(s => sites.includes(s));
              if (shared.length > 0) return new Set(shared);
            }
            return new Set(sites);
          }
          const sites = [...new Set(normalized.map(r => r.site).filter(Boolean))].sort();
          const next = new Set(prev);
          sites.forEach(s => { if (!next.has(s)) next.add(s); });
          return next;
        });

        // Accumulate every site type seen, and never drop a historical one —
        // the same rule as locations and sites above. Untyped sites carry the
        // SITE_TYPE_NONE key, so they are tickable rather than unreachable.
        {
          const types = [...new Set(normalized.map(siteTypeKey))].sort();
          setAllSiteTypes(prev => {
            const merged = new Set(prev);
            types.forEach(t => merged.add(t));
            return [...merged].sort();
          });
        }

        setSelectedSiteTypes(prev => {
          const types = [...new Set(normalized.map(siteTypeKey))].sort();
          if (prev === null) {
            // PRESENCE, not truthiness. An EMPTY `site_types` is a real answer
            // — the reader ticked None — and reading it as "no opinion" is how
            // a PDF comes back carrying every type while the screen showed no
            // rows. A parameter naming only types this window does not have is
            // a different thing: that is a stale link, and blanking the report
            // over it is the confusing way to say so, so it falls back to all.
            if (params.site_types != null) {
              if (params.site_types === '') return new Set();
              const shared = params.site_types.split(',').map(t => t.trim()).filter(t => types.includes(t));
              if (shared.length > 0) return new Set(shared);
            }
            return new Set(types);
          }
          const next = new Set(prev);
          types.forEach(t => { if (!next.has(t)) next.add(t); });
          return next;
        });

        setSelectedAddOns(prev => {
          const items = new Set();
          normalized.forEach(r => {
            parseAddOnItems(r.addons).forEach(p => items.add(stripAddonPrice(p)));
          });
          const all = [...items].sort();
          if (prev === null) {
            // Respect shared URL addons param
            if (params.addons) {
              const shared = params.addons.split(',').map(s => s.trim()).filter(s => all.includes(s));
              if (shared.length > 0) return new Set(shared);
            }
            return new Set(all);
          }
          const next = new Set(prev);
          all.forEach(a => { if (!next.has(a)) next.add(a); });
          return next;
        });
      })
      .catch(err => setError(err.message))
      .finally(() => setLoading(false));
  }, [params.location_name, params.site_type, orgSlug]);

  useEffect(() => { fetchData(startDate, endDate); }, []);

  // ── Seed all locations/sites — delayed to avoid competing with main fetch ──
  useEffect(() => {
    const timer = setTimeout(() => {
    const pathParts = window.location.pathname.replace(/\/$/, '').split('/');
    const apiBase = pathParts.length >= 3
      ? '/' + pathParts[1] + '/' + pathParts[2] + '/api/data'
      : '/api/data';
    const now = new Date();
    const seedStart = new Date(now.getTime() - 30 * 86400000);  // 30 days back
    const seedEnd   = new Date(now.getTime() + 7 * 86400000);   // 7 days ahead
    const toISO = d => d.toISOString().split('T')[0];
    const qs = new URLSearchParams();
    qs.set('start_date', toISO(seedStart));
    qs.set('end_date',   toISO(seedEnd));
    if (params.location_name) qs.set('location_name', params.location_name);
    if (params.site_type)     qs.set('site_type',     params.site_type);
    fetch(withToken(apiBase + '?' + qs.toString()))
      .then(r => r.ok ? r.json() : null)
      .then(json => {
        if (!json || !json.rows) return;
        const normalized = json.rows.map(normalizeRow);
        const locs  = [...new Set(normalized.map(r => r.location).filter(Boolean))].sort();
        const sites = [...new Set(normalized.map(r => r.site).filter(Boolean))].sort();
        setLocationColors(prev => {
          const next = assignColors(locs, prev);
          saveLocationColors(orgSlug, next);
          return next;
        });
        setAllLocations(prev => {
          const merged = new Set(prev);
          locs.forEach(l => merged.add(l));
          return [...merged].sort();
        });
        setAllSites(prev => {
          const merged = new Set(prev);
          sites.forEach(s => merged.add(s));
          return [...merged].sort();
        });
        // Also add to selected sets so they're checked by default
        setSelectedLocations(prev => {
          if (!prev) return new Set(locs);
          const next = new Set(prev);
          locs.forEach(l => next.add(l));
          return next;
        });
        setSelectedSites(prev => {
          if (!prev) return new Set(sites);
          const next = new Set(prev);
          sites.forEach(s => next.add(s));
          return next;
        });
      })
      .catch(() => {}); // silent — don't block anything
    }, 3000); // 3s delay so main fetch gets a head start
    return () => clearTimeout(timer);
  }, []);

  function handleRunReport() { fetchData(startDate, endDate); }

  const datesChanged = startDate !== loadedStart || endDate !== loadedEnd;

  // allLocations / allSites are now STATE that accumulates across fetches
  // so historical locations always remain visible in the filter dropdowns.
  // They are updated in the fetch callback below (setAllLocations / setAllSites).

  const allAddOns = useMemo(() => {
    if (!rows) return [];
    const items = new Set();
    rows.forEach(r => {
      parseAddOnItems(r.addons).forEach(p => items.add(stripAddonPrice(p)));
    });
    return [...items].sort();
  }, [rows]);

  // ── Saved views: what a view STORES, and what it does when applied ─────────
  // ONE definition of "what is filtered right now", read by the view machinery
  // AND by the email subscription. Two copies is how they drift, and they had:
  // the subscription's own builder predated the site-type filter and omitted
  // it, so an emailed PDF carried site types the reader had excluded.
  //
  // The tests are the FUNNEL'S own (`size < all.length`), so a view stores
  // exactly what actually narrows the report. Anything else and an unfiltered
  // view reads back as filtered — "locations=" with every location in it.
  //
  // KEY ORDER MIRRORS SAVED_VIEW_PARAMS.facility in server.js. cleanViewParams
  // emits in the server's order and this builds in the same one, because the
  // "edited" marker is a string comparison between the two: a different order
  // makes every freshly-saved view read as dirty the instant it is applied.
  const currentFilterParams = useMemo(() => {
    const qs = new URLSearchParams();
    if (selectedLocations && allLocations.length > 0 && selectedLocations.size < allLocations.length) {
      qs.set('locations', [...selectedLocations].join(','));
    }
    if (selectedSites && allSites.length > 0 && selectedSites.size < allSites.length) {
      qs.set('sites', [...selectedSites].join(','));
    }
    if (selectedSiteTypes && allSiteTypes.length > 0 && selectedSiteTypes.size < allSiteTypes.length) {
      qs.set('site_types', [...selectedSiteTypes].join(','));
    }
    if (bookTypeFilter && bookTypeFilter !== 'all') qs.set('book_type', bookTypeFilter);
    if (selectedAddOns && allAddOns.length > 0 && selectedAddOns.size < allAddOns.length) {
      qs.set('addons', [...selectedAddOns].join(','));
    }
    return qs.toString();
  }, [selectedLocations, allLocations, selectedSites, allSites, selectedSiteTypes,
      allSiteTypes, bookTypeFilter, selectedAddOns, allAddOns]);

  const activeView = useMemo(
    () => views.find(v => v.id === activeViewId) || null,
    [views, activeViewId]
  );

  // "Edited" = the filters, or the range for a view that carries one, have
  // moved off what the view stores. The column toggles are deliberately
  // excluded: ticking Site Type must not light up Save.
  const viewDirty = useMemo(() => {
    if (!activeView) return false;
    if (activeView.params !== currentFilterParams) return true;
    if (activeView.dateMode === 'fixed') {
      return startDate !== activeView.fixedStart || endDate !== activeView.fixedEnd;
    }
    if (activeView.dateMode === 'relative') {
      const r = resolveSavedRange(activeView.relativeRange);
      return startDate !== r.start || endDate !== r.end;
    }
    return false;
  }, [activeView, currentFilterParams, startDate, endDate]);

  const viewsUrl = suffix => withToken('/' + orgSlug + '/facility/api/views' + (suffix || ''));

  const loadViews = useCallback(() => {
    return fetch(viewsUrl())
      .then(r => (r.ok ? r.json() : null))
      .then(j => { if (j) setViews(j.views || []); return j; })
      .catch(() => null);
  }, [orgSlug]);

  // Put the view's filters on screen. `announce` is false for the automatic
  // restore on page load — that is not a user action worth logging.
  function applyView(v, announce) {
    const f = parseViewParams(v.params);
    setSelectedLocations(facViewSelection(allLocations, f.locations));
    setSelectedSites(facViewSelection(allSites, f.sites));
    setSelectedSiteTypes(facViewSelection(allSiteTypes, f.siteTypes));
    setSelectedAddOns(facViewSelection(allAddOns, f.addons));
    // Unconditional, like the multi-selects above: a view that could only turn
    // a filter ON could never turn it off, so opening an unfiltered view after
    // an instant-book one would silently keep the old narrowing.
    setBookTypeFilter(f.bookType || 'all');

    // EXCLUDED, NEVER HIDDEN. A view naming values this window has no rows for
    // falls back to everything rather than blanking the report — and then says
    // so, because a stale view showing every row reads as "the filter broke"
    // and a stale view showing none reads as "this week is empty".
    const missed = []
      .concat(facViewMisses(allLocations, f.locations))
      .concat(facViewMisses(allSites, f.sites))
      .concat(facViewMisses(allSiteTypes, f.siteTypes).map(siteTypeLabel))
      .concat(facViewMisses(allAddOns, f.addons));
    setViewWarn(missed.length
      ? '“' + v.name + '” names ' + (missed.length === 1 ? '' : missed.length + ' things ')
        + 'this window has no bookings for' + (missed.length === 1 ? ' (' + missed[0] + ')' : '')
        + ', so those filters were left off.'
      : null);

    setActiveViewId(v.id);
    try { localStorage.setItem(LS_LAST_VIEW + orgSlug, v.id); } catch (_) {}

    // Dates: a view either pins them, resolves a relative range, or leaves
    // whatever range you are already on entirely alone. Every filter above is
    // client-side over rows already loaded, so the RANGE is the only thing that
    // needs the network — the same split as the GL report.
    let range = null;
    if (v.dateMode === 'fixed')    range = { start: v.fixedStart, end: v.fixedEnd };
    if (v.dateMode === 'relative') range = resolveSavedRange(v.relativeRange);
    if (range) {
      setStartDate(range.start);
      setEndDate(range.end);
      if (range.start !== loadedStart || range.end !== loadedEnd) fetchData(range.start, range.end);
    }

    // Keep the URL honest: it reproduces the filters AND names the view.
    try {
      const qs = new URLSearchParams(window.location.search);
      FACILITY_VIEW_PARAMS.forEach(k => qs.delete(k));
      new URLSearchParams(v.params).forEach((val, k) => qs.set(k, val));
      qs.set('view', v.id);
      if (range) { qs.set('start_date', range.start); qs.set('end_date', range.end); }
      window.history.replaceState(null, '', window.location.pathname + '?' + qs);
    } catch (_) {}

    if (announce) logClientEvent('view-apply', '&view=' + encodeURIComponent(v.name.slice(0, 60)));
    setPickerOpen(false);
    setRowMenu(null);
  }

  // "Default view" is the absence of a saved view: no filters at all. The date
  // range is deliberately left alone — clearing a filter is not a request to
  // jump back to the default week.
  function clearView() {
    setSelectedLocations(new Set(allLocations));
    setSelectedSites(new Set(allSites));
    setSelectedSiteTypes(new Set(allSiteTypes));
    setSelectedAddOns(new Set(allAddOns));
    setBookTypeFilter('all');
    setActiveViewId(null);
    setViewWarn(null);
    try { localStorage.removeItem(LS_LAST_VIEW + orgSlug); } catch (_) {}
    try {
      const qs = new URLSearchParams(window.location.search);
      FACILITY_VIEW_PARAMS.concat(['view']).forEach(k => qs.delete(k));
      const q = qs.toString();
      window.history.replaceState(null, '', window.location.pathname + (q ? '?' + q : ''));
    } catch (_) {}
    setPickerOpen(false);
    setRowMenu(null);
  }

  async function submitView(form) {
    setViewBusy(true);
    try {
      const payload = {
        name: form.name.trim(),
        dateMode: form.dateMode,
        relativeRange: form.dateMode === 'relative' ? form.relativeRange : null,
        fixedStart: form.dateMode === 'fixed' ? startDate : null,
        fixedEnd:   form.dateMode === 'fixed' ? endDate   : null,
      };
      if (!form.renameOnly) payload.params = currentFilterParams;
      const isPatch = !!form.targetId;
      if (!isPatch) payload.replace = !!form.replace;
      const resp = await fetch(viewsUrl(isPatch ? '/' + form.targetId : ''), {
        method: isPatch ? 'PATCH' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.status === 409 && data.existingId) {
        // Same name, different view: ask before overwriting a colleague's.
        if (!window.confirm('A view named "' + payload.name + '" already exists. Replace it?')) return;
        return submitView(Object.assign({}, form, { replace: true }));
      }
      if (!resp.ok) { alert(data.error || 'Could not save the view.'); return; }
      await loadViews();
      setActiveViewId(data.view.id);
      try { localStorage.setItem(LS_LAST_VIEW + orgSlug, data.view.id); } catch (_) {}
      setSaveForm(null);
    } catch (e) {
      alert('Could not save the view: ' + e.message);
    } finally {
      setViewBusy(false);
    }
  }

  // Soft delete on the server, so the Undo below is a restore rather than a
  // re-save. The list is shared by the whole org — a mis-click has to be cheap.
  async function deleteView(v) {
    setRowMenu(null);
    try {
      const resp = await fetch(viewsUrl('/' + v.id), { method: 'DELETE', headers: { 'x-token': URL_TOKEN || '' } });
      if (!resp.ok) { const d = await resp.json().catch(() => ({})); alert(d.error || 'Could not delete the view.'); return; }
      if (activeViewId === v.id) setActiveViewId(null);
      await loadViews();
      setUndoView({ id: v.id, name: v.name });
    } catch (e) {
      alert('Could not delete the view: ' + e.message);
    }
  }

  async function restoreView(id) {
    setUndoView(null);
    try {
      const resp = await fetch(viewsUrl('/' + id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ restore: true }),
      });
      const d = await resp.json().catch(() => ({}));
      if (!resp.ok) { alert(d.error || 'Could not restore the view.'); return; }
      await loadViews();
    } catch (e) {
      alert('Could not restore the view: ' + e.message);
    }
  }

  // The LIST loads at mount, so the picker is populated while the report is
  // still fetching.
  useEffect(() => { if (!isPrint) loadViews(); }, []);

  // APPLYING waits for the feed, and that is not a nicety. Every filter here is
  // a set of values taken FROM the rows — locations, sites, types, add-ons — so
  // before the first response there is nothing to intersect a view against, and
  // facViewSelection would correctly fall back to "everything" and leave the
  // view looking as though it had done nothing. Same lesson as the roster's
  // `loaded` argument: a feed that has not answered is not an empty answer.
  //
  // The print page is skipped entirely — generatePdf forwards the FILTERS, not
  // the view id, so the PDF never needs to resolve one.
  useEffect(() => {
    if (isPrint || viewsRestored || !rows) return;
    setViewsRestored(true);
    loadViews().then(j => {
      if (!j || !Array.isArray(j.views)) return;
      const urlQs = new URLSearchParams(window.location.search);
      const named = urlQs.get('view');
      const hit = named && j.views.find(v => v.id === named);
      if (hit) { applyView(hit, false); return; }
      // A URL carrying its own filters is a deliberate link; it must not be
      // overridden by whatever this browser last looked at.
      if (FACILITY_VIEW_PARAMS.some(k => urlQs.get(k))) return;
      let lastId = null;
      try { lastId = localStorage.getItem(LS_LAST_VIEW + orgSlug); } catch (_) {}
      const last = lastId && j.views.find(v => v.id === lastId);
      if (last) applyView(last, false);
    });
  }, [rows, viewsRestored]);

  // The Undo window is short on purpose — it is an undo, not a trash can.
  useEffect(() => {
    if (!undoView) return;
    const t = setTimeout(() => setUndoView(null), 10000);
    return () => clearTimeout(t);
  }, [undoView]);

  useEffect(() => {
    if (!pickerOpen) return;
    function onDown(e) {
      if (pickerRef.current && !pickerRef.current.contains(e.target)) { setPickerOpen(false); setRowMenu(null); }
    }
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [pickerOpen]);

  // Something is worth saving when a filter is active, or when the applied view
  // has drifted off what it stores. Otherwise Save stays greyed out.
  const canSaveView = !!currentFilterParams || (activeView && viewDirty);

  function openSaveDialog() {
    setPickerOpen(false);
    setRowMenu(null);
    setSaveForm(activeView && viewDirty
      ? { name: activeView.name, targetId: activeView.id, dateMode: activeView.dateMode,
          relativeRange: activeView.relativeRange || defaultSavedRange() }
      : { name: '', targetId: null, dateMode: 'current', relativeRange: defaultSavedRange() });
  }

  const hasLighting = useMemo(() => rows && rows.some(muscoLit), [rows]);

  // The column only exists where forms do, so an org that collects none never
  // sees an empty column and nothing has to be switched on per org.
  const hasAnyForms = formCounts === null || formsOk === false
    ? true                       // still asking, or failed: keep the column so
                                 // the pending/failed marker has somewhere to go
    : Object.keys(formCounts).length > 0;

  // Standing rule: a new surface pings the activity feed. Keyed by rental, so
  // staff opening three bookings' forms reads as three looks rather than one.
  function logFormOpen(r, nForms) {
    const parts = window.location.pathname.split('/').filter(Boolean);
    try {
      fetch(withToken(`/${parts[0]}/facility/api/log?event=form-open`
        + `&rental=${encodeURIComponent((r.resName || r.site || '').slice(0, 60))}`
        + `&n=${nForms}`), { method: 'POST', keepalive: true });
    } catch {}
  }

  const filteredRows = useMemo(() => {
    if (!rows) return null;
    let result = rows.filter(r => !r.status || !/cancel/i.test(r.status));
    if (selectedLocations && selectedLocations.size < allLocations.length) {
      result = result.filter(r => selectedLocations.has(r.location));
    }
    if (selectedSites && selectedSites.size < allSites.length) {
      result = result.filter(r => selectedSites.has(r.site));
    }
    if (selectedSiteTypes && allSiteTypes.length > 0 && selectedSiteTypes.size < allSiteTypes.length) {
      result = result.filter(r => selectedSiteTypes.has(siteTypeKey(r)));
    }
    if (bookTypeFilter !== 'all') {
      result = result.filter(r => (r.bookingType || '').trim().toLowerCase() === bookTypeFilter);
    }
    if (selectedAddOns && allAddOns.length > 0 && selectedAddOns.size < allAddOns.length) {
      result = result.filter(r => {
        const parts = parseAddOnItems(r.addons).map(p => stripAddonPrice(p));
        return parts.some(p => selectedAddOns.has(p));
      });
    }
    if (filterLighting) {
      // DELIBERATELY "has a Musco schedule", not "will be lit". I proposed the
      // narrower reading first and it is the wrong one: a schedule Musco
      // rejected is the row most worth finding, and a filter that hides the
      // broken ones is how a broken one goes unnoticed. Same failure direction
      // as the card's own denylist. The ⚠ makes the state visible INSIDE the
      // filter instead.
      result = result.filter(muscoLit);
    }
    return result;
  }, [rows, selectedLocations, allLocations, selectedSites, allSites, selectedSiteTypes, allSiteTypes,
      bookTypeFilter, selectedAddOns, allAddOns, filterLighting]);

  const grouped = useMemo(() => {
    if (!filteredRows) return null;
    // Belt-and-suspenders: in print mode, re-apply URL location filter directly
    // to guard against React state timing issues
    let finalRows = filteredRows;
    if (params._print === '1' && params.locations) {
      const allowed = new Set(params.locations.split(',').map(l => l.trim()));
      finalRows = filteredRows.filter(r => allowed.has(r.location));
    }
    const byDate = {};
    finalRows.forEach(row => {
      const dk = row.date;
      if (!byDate[dk]) byDate[dk] = { locations: {} };
      const lk = row.location || 'Unknown';
      if (!byDate[dk].locations[lk]) byDate[dk].locations[lk] = [];
      byDate[dk].locations[lk].push(row);
    });
    Object.values(byDate).forEach(dg => {
      Object.values(dg.locations).forEach(locRows => {
        locRows.sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
      });
    });
    return byDate;
  }, [filteredRows]);

  const sortedDates = grouped ? Object.keys(grouped).sort() : [];

  // ── AI Insights (MUST be after computed values — Babel compiles const→var,
  //    so earlier useCallback deps would always see undefined) ─────────────
  function setMonth(offset) {
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    const last   = new Date(target.getFullYear(), target.getMonth() + 1, 0);
    setStartDate(toISO(target));
    setEndDate(toISO(last));
    setActiveRange(offset === -1 ? 'last-month' : offset === 0 ? 'this-month' : 'next-month');
  }

  function setWeek(offsetWeeks) {
    const now = new Date();
    const start = new Date(now);
    start.setDate(now.getDate() + (offsetWeeks * 7));
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    setStartDate(toISO(start));
    setEndDate(toISO(end));
    setActiveRange(offsetWeeks === 0 ? 'this-week' : 'next-week');
  }

  function downloadPdf() {
    const qs = new URLSearchParams();
    if (loadedStart) qs.set('start_date', loadedStart);
    if (loadedEnd)   qs.set('end_date',   loadedEnd);
    if (params.location_name) qs.set('location_name', params.location_name);
    if (params.site_type)     qs.set('site_type',     params.site_type);
    // Respect the current on-screen filter selections so the PDF matches exactly
    // what's shown. Mirrors the share-URL serialization; the print page reads
    // these back into selectedLocations/selectedSites on load.
    if (selectedLocations && selectedLocations.size < allLocations.length) { qs.set('locations', [...selectedLocations].join(',')); }
    if (selectedSites && selectedSites.size < allSites.length) { qs.set('sites', [...selectedSites].join(',')); }
    if (selectedSiteTypes && allSiteTypes.length > 0 && selectedSiteTypes.size < allSiteTypes.length) {
      qs.set('site_types', [...selectedSiteTypes].join(','));
    }
    if (bookTypeFilter && bookTypeFilter !== 'all') qs.set('book_type', bookTypeFilter);
    if (selectedAddOns)    { const a = [...selectedAddOns];    if (a.length) qs.set('addons',    a.join(',')); }
    // ALWAYS SET, even when neither is on. The print page has no localStorage,
    // so an omitted parameter there resolves to the default - which is ON. An
    // explicit empty value is therefore the ONLY way a reader who switched both
    // columns off gets a PDF that agrees with their screen.
    qs.set('pii', piiParam(showPhone, showEmail));
    // Same reason, and it is the ONLY channel the Site Type column has: the
    // print page's localStorage is empty, so an omitted parameter resolves to
    // the default (off) and a reader who ticked the column gets a PDF without
    // it. '0' is a real answer here, not an absent one.
    qs.set('sitetype', showSiteType ? '1' : '0');

    const pathParts = window.location.pathname.replace(/\/$/, '').split('/');
    const pdfBase = pathParts.length >= 3
      ? `/${pathParts[1]}/${pathParts[2]}/api/pdf`
      : '/api/pdf';

    // Opened in its own window rather than downloaded — a download started by a
    // sandboxed iframe is silently dropped. See open-pdf.js.
    openReportPdf(withToken(`${pdfBase}?${qs.toString()}`), { label: 'Facility Rental Schedule' });
  }

  // ── Export Permits ──────────────────────────────────────────────────
  // Posts the rows currently on screen so the sheets honour the active filters,
  // and lets the server re-check each permit live before printing it.
  //
  // FIELD NAMES COME FROM normalizeRow, NOT FROM THE CARD. Three of these were
  // wrong and each failed silently, because every one of them has a server-side
  // fallback or an empty-string default:
  //   r.begin    -> r.start    the sheet printed "9:00pm" instead of
  //                            "8:00pm - 9:00pm" (timeRange drops a blank end)
  //   r.facility -> r.site     the big LOCATION line was blank, and multi-date
  //                            sheets could not scope their dates to the site
  //   r.purpose  -> r.resName  masked by the server falling back to Rental Name
  function permitRowPayload(r) {
    return {
      resId: r.resId, title: r.resName || '', reservee: r.reservee || '',
      site: r.site || '', location: r.location || '',
      date: r.date, begin: r.start, end: r.end, headcount: r.headCount || '',
    };
  }

  // How many SHEETS a set of rows will produce — which is not how many rows it
  // contains. A multi-day permit shows one row per calendar day but prints a
  // single sheet covering the whole run, so counting rows promised "Export
  // Permits (7)" and delivered 3. This mirrors the collapse in the
  // permits.pdf route (permit + site, multi-day only); change one, change both.
  function permitSheetCount(rows) {
    if (!rows || !permits) return 0;
    const seen = new Set();
    let n = 0;
    for (const r of rows) {
      const p = r.resId && permits[r.resId];
      if (!p) continue;
      if (p.multi) {
        const key = (p.id || p.code) + '|' + String(r.site || '').replace(/\s+/g, ' ').trim().toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
      }
      n++;
    }
    return n;
  }

  // `rows` omitted → the whole filtered view (toolbar button). Passed a single
  // row → that one rental's sheet (the row chip), which is what someone wants
  // when they are about to walk one permit out to a pavilion. Clicking the chip
  // on day 2 of a stay is fine: the server prints the same one sheet for the
  // whole run, not a sheet for that day.
  function exportPermits(rows) {
    const src = Array.isArray(rows) ? rows : (filteredRows || []);
    setPermitLoading(Array.isArray(rows) && rows[0] ? rows[0].resId : 'all');
    const parts = window.location.pathname.split('/').filter(Boolean);
    const payload = { rows: src.filter(r => r.resId && permits && permits[r.resId]).map(permitRowPayload) };
    fetch(withToken(`/${parts[0]}/facility/permits.pdf`), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
    })
      .then(r => { if (!r.ok) return r.text().then(t => { throw new Error(t || ('HTTP ' + r.status)); }); return r.blob(); })
      .then(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (payload.rows.length === 1
          ? `permit-${(payload.rows[0].title || 'rental').replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 40)}-${payload.rows[0].date || ''}`
          : `permits-${loadedStart || 'export'}`) + '.pdf';
        a.click(); URL.revokeObjectURL(a.href);
      })
      .catch(err => alert('Permit export failed: ' + err.message))
      .finally(() => setPermitLoading(false));
  }

  function downloadExcel() {
    if (!filteredRows || filteredRows.length === 0) return;
    const headers = [
      'Org Name', 'Date', 'Day', 'Location', 'Facility/Site',
      'Begin', 'End', 'Purpose', 'Reservee',
    ];
    if (showPhone) headers.push('Phone');
    if (showEmail) headers.push('Email');
    if (showHeadCount) headers.push('Head Cnt');
    if (showTotal)     headers.push('Total');
    if (showAddons) headers.push('Add-On Fees');
    if (showPaid)      headers.push('Paid?');
    if (showNotes)     headers.push('Instructions', 'Notes', 'Add-ons');
    if (showSiteType)  headers.push('Site Type');
    if (showResident)  headers.push('Resident?');
    if (showBookType)  headers.push('Booking Type');
    if (showLighting)  headers.push('Lighting', 'Musco Sync', 'Lit Window', 'Lit From', 'Lit Until');

    const dataRows = filteredRows.map(r => {
      const dp = (r.date || '').split('T')[0].split('-');
      const dateVal = dp.length === 3 ? new Date(+dp[0], +dp[1]-1, +dp[2]) : r.date;
      const row = [
        r.orgName, dateVal, (r.day || '').trim(), r.location, r.site,
        formatTime(r.start), formatTime(r.end), r.resName, r.reservee,
      ];
      if (showPhone) row.push(formatPhone(r.phone));
      if (showEmail) row.push(r.email);
      if (showHeadCount) row.push(r.headCount !== '' ? Number(r.headCount) || r.headCount : '');
      if (showTotal) { const n = parseFloat(r.total); row.push(!isNaN(n) && n !== 0 ? n : ''); }
      if (showAddons) { const n = parseFloat(r.addonFees); row.push(!isNaN(n) && n !== 0 ? n : ''); }
      if (showPaid) row.push(r.paid || '');
      if (showNotes) { row.push(r.instructions || ''); row.push(r.notes || ''); row.push(r.addons || ''); }
      if (showSiteType) row.push(siteTypeLabel(siteTypeKey(r)));
      if (showResident) row.push(r.resident || '');
      if (showBookType) row.push(r.bookingType || '');
      // Through muscoLit, not r.lighting, or a stale pre-card feed exports a
      // removed schedule as lit — the export has to agree with the screen.
      if (showLighting) { row.push(muscoLit(r) ? 'Yes' : ''); row.push(muscoLit(r) ? lightingSyncState(r).status : ''); row.push(litWindowLabel(r)); row.push(r.litFrom || ''); row.push(r.litUntil || ''); }
      return row;
    });

    const wsData = [headers, ...dataRows];
    const ws = XLSX.utils.aoa_to_sheet(wsData, { cellDates: true });
    // Format date column as MM/DD/YY
    for (let rowIdx = 1; rowIdx <= dataRows.length; rowIdx++) {
      const cellAddr = XLSX.utils.encode_cell({ r: rowIdx, c: 1 });
      if (ws[cellAddr] && ws[cellAddr].t === 'd') ws[cellAddr].z = 'MM/DD/YY';
    }
    ws['!cols'] = [
      {wch:28},{wch:12},{wch:10},{wch:22},{wch:22},{wch:9},{wch:9},
      {wch:20},{wch:20},
      ...(showPhone?[{wch:14}]:[]),
      ...(showEmail?[{wch:28}]:[]),
      ...(showHeadCount?[{wch:8}]:[]),
      ...(showTotal?[{wch:10}]:[]),
      ...(showAddons?[{wch:12}]:[]),
      ...(showPaid?[{wch:8}]:[]),
      ...(showNotes?[{wch:30},{wch:30},{wch:30}]:[]),
      ...(showSiteType?[{wch:14}]:[]),
      ...(showResident?[{wch:10}]:[]),
      ...(showBookType?[{wch:14}]:[]),
      ...(showLighting?[{wch:8},{wch:11},{wch:20},{wch:14},{wch:14}]:[]),
    ];
    if (showTotal) {
      const totalColIdx = headers.indexOf('Total');
      for (let rowIdx = 1; rowIdx <= dataRows.length; rowIdx++) {
        const cellAddr = XLSX.utils.encode_cell({ r: rowIdx, c: totalColIdx });
        if (ws[cellAddr] && typeof ws[cellAddr].v === 'number') ws[cellAddr].z = '"$"#,##0.00';
      }
    }
    if (showAddons) {
      const afColIdx = headers.indexOf('Add-On Fees');
      for (let rowIdx = 1; rowIdx <= dataRows.length; rowIdx++) {
        const cellAddr = XLSX.utils.encode_cell({ r: rowIdx, c: afColIdx });
        if (ws[cellAddr] && typeof ws[cellAddr].v === 'number') ws[cellAddr].z = '"$"#,##0.00';
      }
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Rental Schedule');
    const slug = (filteredRows[0]?.orgName || 'report').replace(/\s+/g, '-').toLowerCase();
    // Handed to a popup to save rather than written straight from here — a
    // download started by a sandboxed iframe is silently dropped. See open-pdf.js.
    saveWorkbookViaPopup(XLSX, wb, `rental-schedule-${slug}-${loadedStart || 'report'}.xlsx`);
    logClientEvent('excel');
  }

  // `extra` is an already-encoded query tail ("&view=Main%20pools"). The
  // convention on this platform is ?event=<name> in the QUERY STRING — a JSON
  // body is read by nothing on the server, comes back 400, and a
  // fire-and-forget beacon never complains. That has now bitten this repo four
  // times.
  function logClientEvent(event, extra) {
    try {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length >= 2) fetch(withToken(`/${parts[0]}/${parts[1]}/api/log?event=${event}${extra || ''}`), { method: 'POST' }).catch(() => {});
    } catch {}
  }

        <div className="page">
          <div className="error" style={{textAlign:'center',padding:'3rem 1rem'}}>
            <p style={{fontSize:'2.5rem',marginBottom:'0.5rem'}}>😔</p>
            <p style={{fontSize:'1.1rem',color:'#666'}}>Looks like reporting has encountered an issue — try loading this report again later.</p>
            <p style={{fontSize:'0.8rem',color:'#b91c1c',marginTop:'0.75rem',fontFamily:'monospace',background:'#fef2f2',padding:'8px 14px',borderRadius:6,display:'inline-block',maxWidth:500,wordBreak:'break-word'}}>{error}</p>
          </div>
        </div>
      </div>
    );
  }

  if (!rows) {
    return (
      <div>
        {renderToolbar()}
        {renderSaveDialog()}
        {renderUndoToast()}
        <div className="page">
          <ReportLoader />
        </div>
      </div>
    );
  }

  const now = new Date();
  const runDate = `${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')}/${now.getFullYear()} @ ${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()}`;

  const orgName = (rows.length > 0 && rows[0].orgName) ? rows[0].orgName : (meta.org_name || orgSlug);
  const logoUrl = meta.logo_url || null;

  const dateRangeLabel = [
    loadedStart ? formatDisplayDate(loadedStart) : null,
    loadedEnd   ? formatDisplayDate(loadedEnd)   : null,
  ].filter(Boolean).join(' – ') || 'Current Month';

  return (
    <div>
      {renderToolbar()}
      {renderSaveDialog()}
      {renderUndoToast()}

      {showEmailModal && EmailSubscribeModal()}

      {showHeatmap && filteredRows && filteredRows.length > 0 && !isPrint && (
        <HeatmapStrip filteredRows={filteredRows} locationColors={locationColors} />
      )}


      <div className="page" style={loading ? {opacity:0.5,pointerEvents:'none'} : {}}>
        {!isPrint && renderViewWarn()}
        {/* Report header */}
        <div className="report-header">
          <div className="report-header-left">
            {logoUrl && <img src={logoUrl} alt="" className="report-header-logo" onError={e => e.target.style.display='none'} />}
            <div>
              <div className="org-label">{orgName}</div>
              <div className="title">Weekly Rental Schedule</div>
            </div>
          </div>
          <div className="report-header-right">
            <div className="rh-meta" style={{fontWeight:600,marginBottom:2}}>{dateRangeLabel}</div>
          </div>
        </div>

      {showMetrics && filteredRows && filteredRows.length > 0 && !isPrint && (() => {
        var fmt = function(n) { return '$' + (n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); };
        // Residency breakdown
        var hasRes = filteredRows.some(function(r){ return r.resident === 'Yes' || r.resident === 'No'; });
        var resRows = filteredRows.filter(function(r){ return r.resident === 'Yes'; });
        var nonResRows = filteredRows.filter(function(r){ return r.resident === 'No'; });
        var resRev = resRows.reduce(function(s,r){ return s + (parseFloat(r.total)||0); }, 0);
        var nonResRev = nonResRows.reduce(function(s,r){ return s + (parseFloat(r.total)||0); }, 0);
        var totalRev = filteredRows.reduce(function(s,r){ return s + (parseFloat(r.total)||0); }, 0);
        var resPct = totalRev > 0 ? (resRev / totalRev * 100).toFixed(1) : '0';
        // Booking channel breakdown
        var instantRows = filteredRows.filter(function(r){ return (r.bookingType||'').toLowerCase() === 'instant'; });
        var managedRows = filteredRows.filter(function(r){ return (r.bookingType||'').toLowerCase() === 'managed'; });
        var instantRev = instantRows.reduce(function(s,r){ return s + (parseFloat(r.total)||0); }, 0);
        var managedRev = managedRows.reduce(function(s,r){ return s + (parseFloat(r.total)||0); }, 0);
        var instantAvg = instantRows.length > 0 ? instantRev / instantRows.length : 0;
        var managedAvg = managedRows.length > 0 ? managedRev / managedRows.length : 0;
        // Location breakdown for residency
        var locMap = {};
        filteredRows.forEach(function(r) {
          var loc = r.location || 'Unknown';
          if (!locMap[loc]) locMap[loc] = { res: 0, nonRes: 0, total: 0 };
          var v = parseFloat(r.total) || 0;
          locMap[loc].total += v;
          if (r.resident === 'Yes') locMap[loc].res += v;
          else if (r.resident === 'No') locMap[loc].nonRes += v;
        });
        var locEntries = Object.entries(locMap).sort(function(a,b){ return b[1].total - a[1].total; });
        var maxLoc = locEntries.length > 0 ? locEntries[0][1].total : 1;
        return (
          <div className="residency-strip">
            {hasRes && (
              <div style={{marginBottom: 20}}>
                <div style={{fontSize:11,fontWeight:700,color:'#666',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:10}}>Residency Revenue Analysis</div>
                <div className="residency-cards">
                  <div className="res-card total-card">
                    <div className="rc-label">Total Revenue</div>
                    <div className="rc-value">{fmt(totalRev)}</div>
                    <div className="rc-sub">{filteredRows.length} bookings</div>
                  </div>
                  <div className="res-card resident">
                    <div className="rc-label">Resident Revenue</div>
                    <div className="rc-value">{fmt(resRev)}</div>
                    <div className="rc-sub">{resRows.length} bookings</div>
                  </div>
                  <div className="res-card nonresident">
                    <div className="rc-label">Non-Resident Revenue</div>
                    <div className="rc-value">{fmt(nonResRev)}</div>
                    <div className="rc-sub">{nonResRows.length} bookings</div>
                  </div>
                  <div className="res-card pct-card">
                    <div className="rc-label">Resident Share</div>
                    <div className="rc-value">{resPct}%</div>
                    <div className="rc-sub">of total revenue</div>
                  </div>
                </div>
                {locEntries.length > 0 && (
                  <div style={{marginTop:8}}>
                    {locEntries.map(function(e) {
                      var loc = e[0], d = e[1];
                      var rW = maxLoc > 0 ? (d.res / maxLoc * 100) : 0;
                      var nW = maxLoc > 0 ? (d.nonRes / maxLoc * 100) : 0;
                      return (
                        <div key={loc} style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,fontSize:11}}>
                          <span style={{width:140,textAlign:'right',color:'#555',flexShrink:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{loc}</span>
                          <div style={{flex:1,display:'flex',height:16,background:'#f3f2ee',borderRadius:3,overflow:'hidden'}}>
                            <div style={{width:rW+'%',background:'#10b981',transition:'width .3s'}} title={'Resident: ' + fmt(d.res)} />
                            <div style={{width:nW+'%',background:'#f59e0b',transition:'width .3s'}} title={'Non-Resident: ' + fmt(d.nonRes)} />
                          </div>
                          <span style={{width:70,textAlign:'right',fontWeight:600,color:'#333',fontSize:10}}>{fmt(d.total)}</span>
                        </div>
                      );
                    })}
                    <div style={{display:'flex',gap:16,marginTop:6,fontSize:9,color:'#888'}}>
                      <span>{'\u25A0'} <span style={{color:'#10b981'}}>Resident</span></span>
                      <span>{'\u25A0'} <span style={{color:'#f59e0b'}}>Non-Resident</span></span>
                    </div>
                  </div>
                )}
              </div>
            )}
            <div style={{marginBottom: 12}}>
              <div style={{fontSize:11,fontWeight:700,color:'#666',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:10}}>Booking Channel Analysis</div>
              <div className="residency-cards">
                <div className="res-card" style={{borderLeft:'3px solid #3b82f6'}}>
                  <div className="rc-label">Instant Book</div>
                  <div className="rc-value">{fmt(instantRev)}</div>
                  <div className="rc-sub">{instantRows.length} bookings {instantRows.length > 0 ? '\u00b7 avg ' + fmt(instantAvg) : ''}</div>
                </div>
                <div className="res-card" style={{borderLeft:'3px solid #8b5cf6'}}>
                  <div className="rc-label">Managed / Admin</div>
                  <div className="rc-value">{fmt(managedRev)}</div>
                  <div className="rc-sub">{managedRows.length} bookings {managedRows.length > 0 ? '\u00b7 avg ' + fmt(managedAvg) : ''}</div>
                </div>
                <div className="res-card" style={{borderLeft:'3px solid #6b7280'}}>
                  <div className="rc-label">Channel Split</div>
                  <div className="rc-value">{instantRows.length > 0 || managedRows.length > 0 ? Math.round(instantRows.length / (instantRows.length + managedRows.length) * 100) + '% / ' + Math.round(managedRows.length / (instantRows.length + managedRows.length) * 100) + '%' : 'N/A'}</div>
                  <div className="rc-sub">instant / managed</div>
                </div>
              </div>
            </div>
          </div>
        );
      })()}


        

        {/* ── Table View ── */}
        {(
          <>
            {sortedDates.map(dateKey => {
              const dateGroup = grouped[dateKey];
              const sortedLocs = Object.keys(dateGroup.locations).sort();
              return (
                <div key={dateKey}>
                  {sortedLocs.map(locName => {
                    const locRows = dateGroup.locations[locName];
                    return (
                      <div key={locName} className="loc-section">
                        <div className="section-header">
                          <span className="date-label">{formatDateHeader(dateKey)}</span>
                          <span className="loc-label">—  {locName}</span>
                        </div>
                        <div className="col-header-row">
                          <span className="col-start">Begin</span>
                          <span className="col-end">End</span>
                          <span className="col-site">Facility / Site</span>
                          <span className="col-reservee">Reservee</span>
                          {showPhone && <span className="col-phone">Phone #</span>}
                          {showEmail && <span className="col-email">Email</span>}
                          <span className="col-purpose">Purpose</span>
                          {showSiteType  && <span className="col-sitetype">Type</span>}
                          {showResident  && <span className="col-resident">Resident?</span>}
                          {showBookType  && <span className="col-booktype">Book Type</span>}
                          {showHeadCount && <span className="col-hcnt">Cnt</span>}
                          {showTotal     && <span className="col-total">Total</span>}
                          {showFormsCol && hasAnyForms && <span className="col-forms" title="Required Information">Forms</span>}
                          {showPaid && <span className="col-paid">Paid?</span>}
                          {showPermit && <span className="col-permit" title="Posting sheet">📋</span>}
                          {showLink && <span className="col-rec-link">↗</span>}
                        </div>
                        {locRows.map((r, i) => (
                          <div key={i}>
                            <div className={'data-row' + (muscoLit(r) ? ' musco-lit' : '')}
                              data-musco-lit={muscoLit(r) ? lightingSyncState(r).tone : undefined}>
                              <span className="cell col-start">{r.multiDayDays && !r.start && !r.end ? 'All Day' : formatTime(r.start)}</span>
                              <span className="cell col-end">{formatTime(r.end)}</span>
                              <span className="cell col-site">
                                {r.site}
                                {/* The multi-day callout goes on EVERY day of the run, not just the
                                    first. Day 2 used to drop to grey "Day 2 of 3" text, so scrolling
                                    to a Wednesday gave no hint the site was booked either side of it
                                    — and the run's dates are the thing someone scanning the schedule
                                    is looking for. Day 1 reads exactly as before; later days append
                                    their position. */}
                                {r.multiDayDays && <span style={{display:'block',fontSize:'10px',fontWeight:700,color:'#d97706',marginTop:2}}>
                                  Multi-Day Rental ({r.multiDayDays} days){multiDayRange(r) ? ` ${multiDayRange(r)}` : ''}
                                  {r.multiDayNum > 1 ? ` \u00b7 Day ${r.multiDayNum} of ${r.multiDayDays}` : ''}
                                </span>}
                              </span>
                              <span className="cell col-reservee">{r.reservee}</span>
                              {showPhone && <span className="cell col-phone">{formatPhone(r.phone)}</span>}
                              {showEmail && <span className="cell col-email">
                                {r.email
                                  ? <a href={`mailto:${r.email}`} style={{color:'inherit',textDecoration:'none'}}>{r.email}</a>
                                  : ''}
                              </span>}
                              <span className="cell col-purpose">{r.resName}</span>
                              {showSiteType  && <span className="cell col-sitetype" data-sitetype={siteTypeKey(r)}>{siteTypeLabel(siteTypeKey(r))}</span>}
                              {showResident  && <span className="cell col-resident">{r.resident}</span>}
                              {showBookType  && <span className="cell col-booktype">{r.bookingType}</span>}
                              {showHeadCount && <span className="cell col-hcnt">{r.headCount}</span>}
                              {showTotal     && <span className="cell col-total">{formatMoney(r.total)}</span>}
                              {showFormsCol && hasAnyForms && <span className="cell col-forms">{(() => {
                                if (formCounts === null) return <span className="feed-pending" title="Loading forms…">·</span>;
                                if (formsOk === false) return <span className="feed-failed"
                                  title="The form list could not be loaded, so this column is blank for every row — it does not mean these rentals have no forms. Reload to try again.">⚠</span>;
                                const nForms = (r.resId && formCounts[r.resId]) || 0;
                                // No form was ever requested of this rental —
                                // 62% of a typical week. A link to an empty
                                // Required Information tab is a dead end, so
                                // there is deliberately nothing here.
                                if (!nForms) return <span data-forms-empty="1" />;
                                return <a
                                  href={`https://www.rec.us/admin/o/${meta.org_id}/facility-rentals/${r.resId}?tab=requiredInformation`}
                                  target="_blank" rel="noopener noreferrer"
                                  onClick={() => logFormOpen(r, nForms)}
                                  title={`${nForms} form${nForms === 1 ? '' : 's'} on file — open Required Information in Rec`}
                                  style={{color:'#2563eb',textDecoration:'none',fontSize:11,whiteSpace:'nowrap'}}
                                >📄 {nForms}</a>;
                              })()}</span>}
                              {showPaid && <span className="cell col-paid">{paidMark(r.paid)}</span>}
                              {showPermit && <span className="cell col-permit">{
                                permits === null
                                  ? <span className="feed-pending" title="Loading permits…">·</span>
                                : permitsOk === false
                                  ? <span className="feed-failed"
                                      title="The permit list could not be loaded, so this column is blank for every row — it does not mean these rentals have no permits. Reload to try again.">⚠</span>
                                : r.resId && permits[r.resId]
                                ? <button onClick={() => exportPermits([r])}
                                     disabled={permitLoading === r.resId}
                                     title={'Print the posting sheet for permit ' + permits[r.resId].code}
                                     style={{background:'none',border:'none',padding:0,cursor:'pointer',fontSize:13,lineHeight:1,color:'#7c3aed'}}
                                  >{permitLoading === r.resId ? '…' : '📋'}</button>
                                : ''}</span>}
                              {showLink && <span className="cell col-rec-link">{r.resId ? <a href={`https://www.rec.us/admin/o/${meta.org_id}/facility-rentals/${r.resId}`} target="_blank" rel="noopener noreferrer" title="Open in Rec" style={{color:'#2563eb',textDecoration:'none',fontSize:13}}>↗️</a> : ''}</span>}
                            </div>
                            {/* Notes and add-ons share one line under the row, but they are
                                gated SEPARATELY: add-ons used to ride on the Notes checkbox,
                                which meant turning notes off silently took the add-on money
                                with it. Either checkbox alone can now produce this line. */}
                            {(showNotes || showAddons) && (() => {
                              var parts = [];
                              if (showNotes) {
                                var litStr = '';
                                if (muscoLit(r)) {
                                  var litWin = litWindowLabel(r);
                                  var ls = lightingSyncState(r);
                                  // The ICON carries the sync state, so a
                                  // schedule Musco rejected cannot read as a
                                  // lit field. renderNotes escapes this, so
                                  // the title is plain text by the time it
                                  // lands.
                                  litStr = (ls.icon || '💡') + ' Lit'
                                    + (litWin ? ': ' + litWin : '')
                                    + (ls.tone === 'ok' ? '' : ' (' + ls.label + ')');
                                }
                                if (litStr) parts.push(litStr);
                                if (r.instructions) parts.push("📝 " + r.instructions);
                                if (r.notes) parts.push(r.notes);
                              }
                              var addonItems = showAddons
                                ? visibleAddonItems(r.addons, selectedAddOns, allAddOns.length)
                                : [];
                              if (addonItems.length) {
                                var frag = addonNoteFragment(addonItems);
                                if (frag) parts.push(frag);
                              }
                              if (!parts.length) return null;
                              return (
                                <div className={'sub-row' + (muscoLit(r) ? ' musco-lit' : '')}
                                  data-addon-icons={addonItems.length ? String(addonItems.length) : undefined}
                                  data-addon-total={addonItems.length ? addonItemsTotalLabel(addonItems) : undefined}
                                  dangerouslySetInnerHTML={{__html: renderNotes(parts.join(' | '))}} />
                              );
                            })()}
                          </div>
                        ))}
                      </div>
                    );
                  })}
                </div>
              );
            })}

            {filteredRows && filteredRows.length === 0 && (
              <div style={{textAlign:'center',padding:'40px 0',color:'#888'}}>
                {rows.length > 0
                  ? 'No rentals match the current location filter.'
                  : 'No rentals found for the selected date range.'}
              </div>
            )}
          </>
        )}

        {/* Footer */}
        <div className="report-footer">
          <span>{orgName}</span>
          <span>Run Date/Time: {runDate}</span>
        </div>

        {filteredRows && !loading && <div id="report-ready" data-ready="true" style={{display:'none'}} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
    <script src="/share-widget.js" defer></script>
    <script src="/feedback-widget.js" defer></script>
      <script src="/nav-breadcrumb.js" defer></script>
  </body>
</html>
