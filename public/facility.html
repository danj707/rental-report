<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Rental Schedule</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #1a1a1a;
      background: #f5f4f1;
      line-height: 1.35;
    }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky;
      top: var(--rec-banner-h, 0px);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: #2c2c2c;
      color: #eee;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .toolbar-title { font-weight: 600; margin-right: 8px; }
    .toolbar-spacer { flex: 1; }

    .toolbar label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toolbar input[type="date"] {
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 4px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .toolbar input[type="date"]:focus { border-color: #3b82f6; }
    .toolbar input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .toolbar button {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    .toolbar button:hover { background: rgba(255,255,255,.18); }
    .toolbar .btn-run {
      background: #16a34a;
      border-color: #16a34a;
      font-weight: 600;
    }
    .toolbar .btn-run:hover { background: #15803d; }
    .toolbar .btn-run:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-pdf {
      background: #3b82f6;
      border-color: #3b82f6;
      font-weight: 600;
    }
    .toolbar .btn-pdf:hover { background: #2563eb; }
    .toolbar .btn-pdf:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-excel {
      background: #16803c;
      border-color: #16803c;
      font-weight: 600;
    }
    .toolbar .btn-excel:hover { background: #15692f; }
    .toolbar .btn-excel:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-email {
      background: #7c3aed;
      border-color: #7c3aed;
      font-weight: 600;
    }
    .toolbar .btn-email:hover { background: #6d28d9; }
    .toolbar .btn-email:disabled { opacity: .5; cursor: not-allowed; }

    /* ── View toggle ── */
    .view-toggle {
      display: flex;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px;
      overflow: hidden;
    }
    .view-toggle button {
      border: none;
      border-radius: 0;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
    }
    .view-toggle button + button {
      border-left: 1px solid rgba(255,255,255,.2);
    }
    .view-toggle button.active {
      background: #3b82f6;
      border-color: #3b82f6;
    }

    .toolbar .row-count {
      font-size: 11px;
      color: #aaa;
      margin-left: 4px;
    }

    .toolbar .divider {
      width: 1px;
      height: 28px;
      background: rgba(255,255,255,.15);
      margin: 0 4px;
    }

    /* ── Location filter dropdown ── */
    .loc-filter-wrap {
      position: relative;
    }

    .btn-loc-filter {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn-loc-filter .badge {
      background: #f59e0b;
      color: #1a1a1a;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      line-height: 1.4;
    }

    .loc-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 200;
      background: #1e1e1e;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 6px;
      min-width: 220px;
      max-height: 360px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }

    .loc-dropdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      flex-shrink: 0;
    }

    .loc-dropdown-header-actions {
      display: flex;
      gap: 8px;
    }

    .loc-dropdown-header button {
      padding: 2px 6px;
      font-size: 10px;
      border-color: rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
    }

    .loc-dropdown-search {
      padding: 6px 10px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      flex-shrink: 0;
    }

    .loc-dropdown-search input {
      width: 100%;
      padding: 4px 8px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 4px;
      color: #fff;
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }
    .loc-dropdown-search input::placeholder { color: #777; }
    .loc-dropdown-search input:focus { border-color: #3b82f6; }

    .loc-dropdown-list {
      overflow-y: auto;
      flex: 1;
      padding: 4px 0;
    }

    .loc-dropdown-list::-webkit-scrollbar { width: 4px; }
    .loc-dropdown-list::-webkit-scrollbar-track { background: transparent; }
    .loc-dropdown-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 2px; }

    .loc-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      cursor: pointer;
      transition: background .1s;
      font-size: 12px;
      color: #ddd;
    }
    .loc-item:hover { background: rgba(255,255,255,.07); }

    .loc-item input[type="checkbox"] {
      accent-color: #3b82f6;
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .loc-item span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    /* ── Color swatch for location items ── */
    .loc-color-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      flex-shrink: 0;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,.25);
      position: relative;
    }
    .loc-color-swatch:hover {
      transform: scale(1.2);
      border-color: rgba(255,255,255,.6);
    }
    .loc-color-picker-pop {
      position: fixed;
      z-index: 9500;
      background: #1e1e1e;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 6px;
      padding: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,.6);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .loc-color-picker-pop .swatch-grid {
      display: grid;
      grid-template-columns: repeat(6, 18px);
      gap: 4px;
    }
    .loc-color-picker-pop .swatch-opt {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .1s;
    }
    .loc-color-picker-pop .swatch-opt:hover { transform: scale(1.15); border-color: rgba(255,255,255,.5); }
    .loc-color-picker-pop .swatch-opt.selected { border-color: #fff; }
    .loc-color-picker-pop .custom-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #aaa;
    }
    .loc-color-picker-pop input[type="color"] {
      width: 24px;
      height: 20px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* ── Column visibility checkboxes ── */
    .col-toggles {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #ccc;
    }
    .col-toggles label {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      font-size: 11px;
      text-transform: none;
      letter-spacing: 0;
      color: #ccc;
    }
    .col-toggles input[type="checkbox"] {
      accent-color: #3b82f6;
      cursor: pointer;
    }

    /* ── Report page ── */
    .page {
      max-width: 1400px;
      margin: 16px auto;
      padding: 24px 28px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* ── Header ── */
    .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:18px; gap:16px; }
    .report-header-left { display:flex; align-items:center; gap:14px; }
    .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
    .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
    .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
    .report-header-right { text-align:right; }
    .report-header .rh-meta { font-size:11px; color:#666; }

    /* ── Column header row ── */
    .col-header-row {
      display: flex;
      gap: 6px;
      padding: 5px 8px;
      background: #e4e4e4;
      border-top: 1px solid #bbb;
      border-bottom: 1px solid #bbb;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #333;
    }

    /* Keep section + column headers together across page breaks */
    .loc-section { break-inside: avoid-column; }
    .section-header + .col-header-row { border-top: none; }

    /* ── Date + Location section header ── */
    .section-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 7px 8px 4px;
      margin-top: 8px;
      background: #edeae4;
      border-bottom: 1px solid #ccc;
    }
    .section-header .date-label { font-weight: 700; font-size: 12.5px; }
    .section-header .loc-label { font-weight: 600; font-size: 11.5px; color: #444; }

    /* ── Data rows ── */
    .data-row {
      display: flex;
      gap: 6px;
      padding: 4px 8px;
      border-bottom: 1px solid #eee;
      align-items: baseline;
      font-size: 11.5px;
    }
    .data-row:nth-child(even) { background: #fafaf8; }

    /* A rental that actually drives a Musco lighting schedule. Dan asked for a
       yellow bar so these are pickable out of a full day at a glance — Midland
       was wired for Musco on 2026-09-09/10 (73 sites, 6 locations) and 87% of
       their next month's reservations sit on a lit site, so this goes from
       never firing to being the thing staff scan for.

       IT KEYS ON THE SCHEDULE, NOT ON AN ADD-ON. An add-on called "Field
       Lights" is a $25 line item that turns nothing on; 409 rentals carry one.
       The class comes from muscoLit(), which never reads r.addons.

       print-color-adjust because the PDF is the surface a grounds crew
       actually holds, and a highlight the printer drops is not a highlight.
       Declared after the nth-child rule: both are (0,2,0), so source order is
       what makes this win. */
    .data-row.musco-lit,
    .sub-row.musco-lit {
      background: #fffbeb;
      box-shadow: inset 3px 0 0 0 #f59e0b;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .data-row .cell {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Sub-row for notes/add-ons ── */
    .sub-row {
      padding: 0 8px 3px;
      font-size: 10px;
      color: #888;
      font-family: 'IBM Plex Mono', monospace;
      padding-left: 160px;
    }

    /* ── Footer ── */
    .report-footer {
      display: flex;
      justify-content: space-between;
      border-top: 2.5px solid #111;
      margin-top: 14px;
      padding-top: 6px;
      font-size: 10px;
      color: #777;
    }

    /* ── Loading / Error ── */
    .loading {
      text-align: center;
      padding: 80px 20px;
      color: #888;
      font-size: 14px;
    }
    .loading .spinner {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 44px;
      margin: 0 auto;
      box-sizing: border-box;
      border: 2px solid #e07b1a;
      border-top-color: #f7b96b;
      border-radius: 4px 4px 14px 14px;
      background: rgba(255, 248, 240, 0.5);
      overflow: hidden;
      box-shadow: inset -4px 0 0 rgba(255, 255, 255, 0.35);
    }
    .loading .spinner::before {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 60%;
      background: linear-gradient(180deg, #ffb24d 0%, #ff8c1f 55%, #f2710a 100%);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45);
    }
    .loading .spinner::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 6px;
      width: 3px; height: 3px;
      margin-left: -1.5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: -5px 7px 0 0 rgba(255, 255, 255, 0.65), 5px 12px 0 -0.5px rgba(255, 255, 255, 0.5);
    }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }

    .error {
      text-align: center;
      padding: 60px 20px;
      color: #b91c1c;
      font-size: 14px;
    }

    /* ── Column widths ── */
    .col-start   { width: 68px; }
    .col-end     { width: 68px; }
    .col-site    { width: 170px; font-weight: 500; white-space: normal !important; overflow: visible !important; text-overflow: clip !important; line-height: 1.3; }
    .col-name    { flex: 1; }
    .col-hcnt    { width: 46px; text-align: center; }
    .col-reservee{ width: 150px; }
    .col-phone   { width: 120px; white-space: normal !important; overflow: visible !important; text-overflow: clip !important; word-break: break-word; }
    .col-email   { width: 190px; font-size: 10.5px; white-space: normal !important; overflow: visible !important; text-overflow: clip !important; word-break: break-word; }
    .col-purpose { width: 160px; white-space: normal; word-break: break-word; }
    .col-sitetype{ width: 84px; text-align: center; font-size: 10px; }
    .col-resident{ width: 72px; text-align: center; }
    .col-booktype{ width: 72px; text-align: center; font-size: 10px; }
    .col-total   { width: 62px; text-align: right; }
    /* Add-ons moved into the note line; Forms took the column. */
    .col-forms { width: 62px; text-align: center; }
    /* "Still loading" and "could not load" must not look like "nothing here". */
    .feed-pending { color: #c8ccd2; font-size: 13px; }
    .feed-failed  { color: #d97706; font-size: 11px; cursor: help; }
    @media print { .feed-pending { visibility: hidden; } }
    .col-paid { width: 50px; text-align: center; }
    .cell.col-paid { font-size: 12px; }
    .col-permit { width: 26px; text-align: center; }
    .col-rec-link { width: 28px; text-align: center; }

    /* ═══════════════════════════════════════════════════════════════
       CALENDAR VIEW
    ═══════════════════════════════════════════════════════════════ */

    .cal-wrapper {
      padding: 0;
    }

    /* Month nav bar */
    .cal-month-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .cal-month-nav .cal-month-label {
      font-size: 18px;
      font-weight: 700;
      min-width: 200px;
      text-align: center;
    }
    .cal-nav-btn {
      background: none;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 5px 12px;
      font-size: 16px;
      cursor: pointer;
      color: #333;
      line-height: 1;
      transition: background .12s;
    }
    .cal-nav-btn:hover { background: #f0f0f0; }
    .cal-nav-btn:disabled { opacity: .3; cursor: default; }

    /* Day-of-week header */
    .cal-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      margin-bottom: 2px;
    }
    .cal-dow-cell {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #888;
      padding: 4px 0;
    }

    /* Calendar grid */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .cal-day {
      min-height: 100px;
      border: 1px solid #e0deda;
      border-radius: 4px;
      background: #fff;
      padding: 4px;
      vertical-align: top;
      overflow: hidden;
      position: relative;
    }
    .cal-day.other-month {
      background: #faf9f7;
      opacity: 0.5;
    }
    .cal-day.today {
      border-color: #3b82f6;
      border-width: 2px;
    }
    .cal-day.has-events {
      background: #fff;
    }

    .cal-day-num {
      font-size: 11px;
      font-weight: 700;
      color: #555;
      margin-bottom: 3px;
      line-height: 1;
    }
    .cal-day.today .cal-day-num {
      color: #3b82f6;
    }

    /* Reservation chip */
    .cal-chip {
      display: block;
      border-radius: 3px;
      padding: 2px 5px;
      margin-bottom: 2px;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      line-height: 1.4;
      color: #fff;
      position: relative;
      transition: filter .1s, transform .1s;
    }
    .cal-chip:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
      z-index: 2;
    }

    .cal-more {
      font-size: 9px;
      color: #999;
      padding: 1px 3px;
      cursor: pointer;
    }
    .cal-more:hover { color: #3b82f6; }

    /* ── Hover card ── */
    .cal-hover-card {
      position: fixed;
      z-index: 9999;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      padding: 12px 14px;
      min-width: 220px;
      max-width: 300px;
      pointer-events: none;
    }
    .cal-hover-card .hc-loc {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cal-hover-card .hc-loc-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cal-hover-card .hc-site {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .cal-hover-card .hc-time {
      font-size: 12px;
      color: #444;
      margin-bottom: 6px;
    }
    .cal-hover-card .hc-divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 6px 0;
    }
    .cal-hover-card .hc-row {
      display: flex;
      gap: 6px;
      font-size: 11px;
      margin-bottom: 3px;
      align-items: baseline;
    }
    .cal-hover-card .hc-label {
      color: #999;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      width: 62px;
      flex-shrink: 0;
    }
    .cal-hover-card .hc-val {
      color: #222;
      flex: 1;
      word-break: break-word;
    }
    .cal-hover-card .hc-notes {
      margin-top: 5px;
      padding: 5px 7px;
      background: #f9f9f7;
      border-radius: 4px;
      font-size: 10px;
      color: #666;
      font-family: 'IBM Plex Mono', monospace;
    }


    /* ── Heatmap strip ── */
    .heatmap-strip {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 0;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .heatmap-panel {
      flex: 1;
      min-width: 320px;
      background: #fff;
      border: 1px solid #e8e6e0;
      border-radius: 6px;
      padding: 12px 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .heatmap-panel .hm-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: #888;
      margin-bottom: 10px;
    }
    .hm-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      font-size: 9px;
      color: #aaa;
    }
    .hm-legend-bar { display: flex; gap: 1px; flex: 1; }
    .hm-legend-cell { height: 6px; flex: 1; border-radius: 1px; }

    /* ── Residency Analysis Panel ── */
    .residency-strip {
      padding: 0 0 12px;
      margin-top: 8px;
    }
    .residency-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid #e0ddd6;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      letter-spacing: 0.3px;
    }

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ── Default location color palette ──────────────────────────────────
const DEFAULT_PALETTE = [
  '#e63946','#457b9d','#2a9d8f','#e9c46a','#f4a261','#a8dadc',
  '#6a4c93','#f77f00','#4cc9f0','#80b918','#e07a5f','#3d405b',
  '#81b29a','#9b5de5','#f15bb5','#00bbf9','#00f5d4','#fee440',
];

// ── Read query params ────────────────────────────────────────────────
function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    start_date:    p.get('start_date'),
    end_date:      p.get('end_date'),
    location_name: p.get('location_name'),
    site_type:     p.get('site_type'),
    _print:        p.get('_print'),
    locations:     p.get('locations'),  // comma-separated, from share URL
    sites:         p.get('sites'),      // comma-separated, from share URL
    book_type:     p.get('book_type'),  // instant | managed | all
    addons:        p.get('addons'),     // comma-separated, from share/PDF URL
    // PLURAL, because `site_type` above is the LEGACY single-value Metabase
    // filter and still forwards to the card. This one is the client-side
    // multi-select over rows already loaded, like locations/sites/addons.
    site_types:    p.get('site_types'), // comma-separated, from share/PDF URL
    sitetype:      p.get('sitetype'),   // 1|0 - whether the Site Type COLUMN shows
    pii:           p.get('pii'),        // phone,email - which PII columns to show
  };
}

// Reads one PII column's initial state. URL first (the PDF's and the share
// link's only channel), then this browser's own preference, then ON.
//
// ON IS THE DEFAULT (Dan, 2026-09-09: "phone and email should be checked by
// default"), which is what these columns already did before the toggles
// existed - so no org loses a column it was using. The feature is that the
// columns can now be switched OFF, and that the choice reaches the PDF and the
// spreadsheet rather than stopping at the screen.
//
// A MISSING `pii` parameter is not "neither" on a normal load - it means the
// URL is not speaking about PII and the reader's own setting stands. On the
// print page localStorage is empty, so a missing parameter resolves to ON
// there, which is why downloadPdf ALWAYS sets it: an explicit empty value is
// the only way a reader who switched both off gets a PDF that agrees.
// One writer for the parameter both the PDF and the share link send, so the two
// cannot disagree about how it is spelled.
function piiParam(phone, email) {
  return [phone && 'phone', email && 'email'].filter(Boolean).join(',');
}

function piiInitial(which) {
  const p = new URLSearchParams(window.location.search);
  const fromUrl = p.get('pii');
  if (fromUrl !== null) return fromUrl.split(',').indexOf(which) !== -1;
  try { return localStorage.getItem('col_' + which) !== 'false'; } catch { return true; }
}

function getCurrentMonthRange() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  return { start: toISO(new Date(y, m, 1)), end: toISO(new Date(y, m + 1, 0)) };
}

function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDisplayDate(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr + 'T12:00:00');
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function formatTime(t) {
  if (!t) return '';
  const s = t.trim().toLowerCase();
  const ampmMatch = s.match(/^(\d{1,2}):(\d{2})\s*(am|pm)$/);
  if (ampmMatch) {
    const hr = parseInt(ampmMatch[1], 10);
    return `${hr}:${ampmMatch[2]}${ampmMatch[3]}`;
  }
  const parts = s.match(/^(\d{1,2}):(\d{2})/);
  if (!parts) return t;
  const h = parseInt(parts[1], 10);
  const ampm = h >= 12 ? 'pm' : 'am';
  const hr = h % 12 || 12;
  return `${hr}:${parts[2]}${ampm}`;
}

function parseHour(t) {
  if (!t) return null;
  const s = t.trim().toLowerCase();
  const ampm = s.match(/^(\d{1,2}):(\d{2})\s*(am|pm)$/);
  if (ampm) {
    let h = parseInt(ampm[1], 10);
    const p = ampm[3];
    if (p === 'am' && h === 12) h = 0;
    else if (p === 'pm' && h !== 12) h += 12;
    return h;
  }
  const parts = s.match(/^(\d{1,2}):/);
  return parts ? parseInt(parts[1], 10) : null;
}

function formatDateHeader(dateStr) {
  const d = new Date(dateStr + (dateStr.includes('T') ? '' : 'T12:00:00'));
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

function multiDayRange(r) {
  const days = parseInt(r.multiDayDays, 10);
  const num  = parseInt(r.multiDayNum, 10) || 1;
  if (!days || days < 2 || !r.date) return '';
  const dateStr = String(r.date);
  const d = new Date(dateStr + (dateStr.includes('T') ? '' : 'T12:00:00'));
  if (isNaN(d.getTime())) return '';
  const start = new Date(d);
  start.setDate(start.getDate() - (num - 1));
  const end = new Date(start);
  end.setDate(end.getDate() + (days - 1));
  const fmt = x => `${x.getMonth() + 1}/${x.getDate()}`;
  return `${fmt(start)}-${fmt(end)}`;
}

function formatMoney(v) {
  if (v == null || v === '') return '';
  const n = typeof v === 'string' ? parseFloat(v) : v;
  if (isNaN(n) || n === 0) return '';
  return '$' + n.toFixed(2);
}

function formatPhone(p) {
  if (!p) return '';
  const digits = String(p).replace(/\D/g, '');
  if (digits.length === 10) return `(${digits.slice(0,3)})${digits.slice(3,6)}-${digits.slice(6)}`;
  if (digits.length === 11 && digits[0] === '1') return `(${digits.slice(1,4)})${digits.slice(4,7)}-${digits.slice(7)}`;
  return p;
}

function StaleCacheBanner({ meta }) {
  if (!meta?.stale_cache) return null;
  const when = meta.cached_at ? new Date(meta.cached_at).toLocaleString() : 'recently';
  return (
    <div style={{background:'#fef3c7',borderBottom:'1px solid #f59e0b',padding:'8px 16px',textAlign:'center',fontSize:13,color:'#92400e'}}>
      ⚠️ Showing cached data from {when} — live data is temporarily unavailable
    </div>
  );
}

function timeToMinutes(t) {
  if (!t) return 9999;
  const s = t.trim().toLowerCase();
  const m = s.match(/^(\d{1,2}):(\d{2})\s*(am|pm)?$/);
  if (!m) return 9999;
  let h = parseInt(m[1], 10);
  const min = parseInt(m[2], 10);
  const ap = m[3];
  if (ap) {
    if (ap === 'am' && h === 12) h = 0;
    if (ap === 'pm' && h !== 12) h += 12;
  }
  return h * 60 + min;
}

function normalizeRow(raw) {
  return {
    orgName:   raw['Org Name']  || raw['org_name']  || '',
    date:      raw['Date']      || raw['date']       || '',
    day:       raw['Day']       || raw['day']        || '',
    start:     raw['Start']     || raw['start']      || raw['Begin'] || '',
    end:       raw['End']       || raw['end']        || '',
    location:  raw['Location']  || raw['location']   || '',
    site:      raw['Site/Room'] || raw['Site']      || raw['site']       || raw['Facility'] || '',
    siteType:  raw['Type']      || raw['Site Type'] || raw['site_type']  || '',
    resName:   raw['Name']      || raw['Res Name']  || raw['res_name']   || raw['Purpose'] || '',
    headCount: raw['Attendees'] || raw["H'Cnt"]     || raw['Head Cnt']   || raw['headcount'] || raw['attendee_count'] || '',
    reservee:  raw['Reservee']  || raw['reservee']   || '',
    email:     raw['Email']     || raw['email']      || '',
    phone:     raw['Phone']     || raw['phone']      || '',
    notes:     raw['Notes']     || raw['notes']      || '',
    instructions: raw['Instructions'] || raw['instructions'] || raw['admin_instructions_md'] || '',
    addons:    raw['Add Ons?']  || raw['Add Ons']   || raw['addons']     || '',
    addonFees: raw['Add-On Fees'] || raw['addon_fees'] || raw['addonFees'] || null,
    // 'Yes' / 'No' from the card; '' when the card predates the column or the
    // booking has no order item to pay for, which renders as neither tick nor cross.
    paid:      raw['Paid?']     || raw['Paid']      || raw['paid']       || '',
    resident:  raw['Resident?'] || raw['Resident']  || raw['resident']   || '',
    bookingType: raw['Booking Type'] || raw['booking_type'] || raw['bookingType'] || '',
    total:     raw['Total']     || raw['total']      || null,
    status:    raw['Status']    || raw['status']     || '',
    resId:     raw['Reservation ID'] || raw['reservation_id'] || raw['res_id'] || raw['id'] || '',
    lighting:     raw['Lighting']      || '',
    litFrom:      raw['Lit From']       || '',
    litUntil:     raw['Lit Until']      || '',
    lightingSync: raw['Lighting Sync']  || '',
    litWindow:    raw['Lit Window']     || '',
    // The schedule's RULE, not just its clock. A sunset-anchored schedule has
    // no lit_from at all, so "Lit Window" arrives as a bare end time.
    litStartSource: raw['Lit Start Source'] || '',
    litEndSource:   raw['Lit End Source']   || '',
    lightingError:  raw['Lighting Error']   || '',
    multiDayDays: raw['Multi-Day Days'] || null,
    multiDayNum:  raw['Multi-Day Day#'] || null,
  };
}

// Paid in full, part paid, or nothing taken. A blank (rather than a cross)
// when the card doesn't say — an older card without the column, or a
// reservation with no order item to pay for. Comped $0 bookings come back as
// paid, so they get the tick. Partial covers a booking whose add-ons are still
// outstanding while the room itself is settled, which is the common shape.
function paidMark(paid) {
  const v = String(paid || '').trim().toLowerCase();
  if (v === 'yes' || v === 'true' || v === 'y') {
    return <span title="Paid in full">✅</span>;
  }
  if (v === 'partial' || v === 'part') {
    return <span title="Part paid — a balance is still outstanding">🟡</span>;
  }
  if (v === 'no' || v === 'false' || v === 'n') {
    return <span title="Not paid">❌</span>;
  }
  return '';
}

// ── Location color helpers ───────────────────────────────────────────
function loadLocationColors(orgSlug) {
  try {
    const stored = localStorage.getItem(`locationColors_${orgSlug}`);
    return stored ? JSON.parse(stored) : {};
  } catch { return {}; }
}
function saveLocationColors(orgSlug, colors) {
  try { localStorage.setItem(`locationColors_${orgSlug}`, JSON.stringify(colors)); } catch {}
}
function assignColors(locations, existing) {
  const result = { ...existing };
  let paletteIdx = Object.keys(result).length;
  locations.forEach(loc => {
    if (!result[loc]) {
      result[loc] = DEFAULT_PALETTE[paletteIdx % DEFAULT_PALETTE.length];
      paletteIdx++;
    }
  });
  return result;
}

// ── Location Filter Dropdown component ──────────────────────────────
function LocationFilter({ allLocations, selectedLocations, onChange }) {
  const [open, setOpen]     = useState(false);
  const [search, setSearch] = useState('');
  const wrapRef             = useRef(null);

  useEffect(() => {
    function handleClick(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', handleClick);
    return () => document.removeEventListener('mousedown', handleClick);
  }, []);

  const filtered = allLocations.filter(l =>
    l.toLowerCase().includes(search.toLowerCase())
  );

  const allSelected  = selectedLocations.size === allLocations.length;
  const noneSelected = selectedLocations.size === 0;

  function toggle(loc) {
    const next = new Set(selectedLocations);
    next.has(loc) ? next.delete(loc) : next.add(loc);
    onChange(next);
  }

  function selectAll()  { onChange(new Set(allLocations)); }
  function clearAll()   { onChange(new Set()); }

  const badgeCount = allSelected ? null : selectedLocations.size;

  return (
    <div className="loc-filter-wrap" ref={wrapRef}>
      <button
        className="btn-loc-filter"
        onClick={() => setOpen(o => !o)}
        style={!allSelected ? { borderColor: '#f59e0b', color: '#fde68a' } : {}}
      >
        📍 Locations
        {badgeCount !== null && (
          <span className="badge">{badgeCount}/{allLocations.length}</span>
        )}
      </button>

      {open && (
        <div className="loc-dropdown">
          <div className="loc-dropdown-header">
            <span>Filter Locations</span>
            <div className="loc-dropdown-header-actions">
              <button onClick={selectAll} disabled={allSelected}>All</button>
              <button onClick={clearAll}  disabled={noneSelected}>None</button>
            </div>
          </div>

          {allLocations.length > 5 && (
            <div className="loc-dropdown-search">
              <input
                type="text"
                placeholder="Search locations…"
                value={search}
                onChange={e => setSearch(e.target.value)}
                autoFocus
              />
            </div>
          )}

          <div className="loc-dropdown-list">
            {filtered.length === 0 && (
              <div style={{padding:'10px 12px', color:'#666', fontSize:11}}>No matches</div>
            )}
            {filtered.map(loc => (
              <label key={loc} className="loc-item">
                <input type="checkbox" checked={selectedLocations.has(loc)} onChange={() => toggle(loc)} />
                <span title={loc}>{loc}</span>
              </label>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Site Filter Dropdown component ───────────────────────────────────
/* ── SITE TYPE ────────────────────────────────────────────────────────────
   Card 17294 has emitted "Site Type" all along and `normalizeRow` has mapped
   it all along; NO surface read it. Fifth instance of the mapped-and-rendered-
   nowhere pattern in this repo, so the render case keys on the CELL.

   THE UNTYPED ROWS ARE THE WHOLE REASON THERE IS A KEY FUNCTION.
   `court.type` is NULL on 40,718 reservations across 59 orgs in the last year
   — the fourth largest bucket, ahead of pool. The mapper turns that into '',
   so a naive `.filter(Boolean)` over the options would leave those rows with
   no tickable option, and the funnel would then drop every one of them the
   moment anybody narrows the filter, with nothing on screen saying so. That is
   the LOC_NONE lesson from the Programs location filter, one report over.
   So untyped gets its OWN option, and `siteTypeKey` is the single definition
   read by the options builder, the funnel, the cell and the spreadsheet —
   three copies is how a checkbox stops matching the word beside it.

   Measured 2026-09-10 over 365 days of live reservations: 12 real types plus
   NULL; 126 orgs have facility traffic and 26 of them run a single type.
   court 381,021 · room 115,355 · field 68,697 · (none) 40,718 · pool 28,472 ·
   gym 22,352 · outdoor-event-space 15,325 · picnic-table 11,844 · other 7,862 ·
   rink 1,930 · bounce-house 1,056 · golf 668 · campsite 654 */
const SITE_TYPE_NONE = '(no type)';

function siteTypeKey(r) {
  const v = String(r && r.siteType != null ? r.siteType : '').trim();
  return v || SITE_TYPE_NONE;
}

/* NO LOOKUP TABLE, deliberately. Every one of the twelve live types title-cases
   correctly ('outdoor-event-space' -> Outdoor Event Space, 'picnic-table' ->
   Picnic Table), so a map would agree with this fallback on every input it has
   and go stale the day a thirteenth type ships. Note 'other' is a REAL type
   with 7,862 reservations and is not the same fact as no type at all. */
function siteTypeLabel(t) {
  if (t === SITE_TYPE_NONE) return 'No type on file';
  const v = String(t == null ? '' : t).trim();
  if (!v) return 'No type on file';
  return v.split(/[-_\s]+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

/* The site-type picker. Deliberately NOT SiteFilter with different props: that
   one carries a search box and a "12/340" badge because an org can have
   hundreds of sites, where the most any org runs is twelve types. A search box
   over twelve checkboxes is furniture. It reuses SiteFilter's own CSS classes,
   so the two read as one control family rather than two features. */
function SiteTypeFilter({ allTypes, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const away = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const esc  = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', away);
    document.addEventListener('keydown', esc);
    return () => { document.removeEventListener('mousedown', away); document.removeEventListener('keydown', esc); };
  }, [open]);
  // ONE TYPE IS NOT A FILTER. 26 of the 126 orgs with facility traffic in the
  // last year run a single site type, and a control that can only return
  // everything or nothing is the dead end this repo keeps writing down.
  if (!allTypes || allTypes.length < 2) return null;
  const sel = selected || new Set();
  const allSelected  = sel.size === allTypes.length;
  const noneSelected = sel.size === 0;
  const badgeCount   = allSelected ? null : sel.size;
  function toggle(t) {
    const next = new Set(sel);
    next.has(t) ? next.delete(t) : next.add(t);
    onChange(next);
  }
  return (
    <div className="loc-filter-wrap" ref={wrapRef} data-sitetype-filter>
      <button
        className="btn-loc-filter"
        data-sitetype-btn
        onClick={() => setOpen(o => !o)}
        style={!allSelected ? { borderColor: '#f59e0b', color: '#fde68a' } : {}}
      >
        🏷️ Type
        {badgeCount !== null && (
          <span className="badge">{badgeCount}/{allTypes.length}</span>
        )}
      </button>
      {open && (
        <div className="loc-dropdown" data-sitetype-menu>
          <div className="loc-dropdown-header">
            <span>Filter Site Types</span>
            <div className="loc-dropdown-header-actions">
              <button onClick={() => onChange(new Set(allTypes))} disabled={allSelected}>All</button>
              <button onClick={() => onChange(new Set())} disabled={noneSelected}>None</button>
            </div>
          </div>
          <div className="loc-dropdown-list">
            {allTypes.map(t => (
              <label key={t} className="loc-item" data-sitetype-opt={t}>
                <input type="checkbox" checked={sel.has(t)} onChange={() => toggle(t)} />
                <span>{siteTypeLabel(t)}</span>
              </label>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Add-On Filter component ───────────────────────────────────────
// Parses comma-separated add-on strings into individual items.
// Mirrors SiteFilter UX: all selected = show everything; deselect = hide.
// Special "(No add-ons)" entry controls rows with empty addons field.
function stripAddonPrice(s) {
  return s.replace(/\s*\(\$[\d,.]+\)$/, '').trim();
}

/* The price card 17294 appends to each add-on name, as a number.
   Add-ons moved out of their own column and into the note line under the row,
   which means this line is now the ONLY place their money appears on screen:
   card 17294's "Total" is the reservation's own order_item, and add-on fees are
   a separate sum, so they are not folded into it. Dropping the column without
   carrying the money would quietly remove revenue from the page. */
function addonItemPrice(s) {
  var m = /\(\$([\d,]+(?:\.\d+)?)\)\s*$/.exec(String(s == null ? '' : s).trim());
  return m ? parseFloat(m[1].replace(/,/g, '')) : null;
}

/* The add-on items a row should show, honouring the toolbar's add-on filter.
   Returns the raw item strings so the caller keeps the card's own
   "Name ($0.00)" structure rather than rebuilding it. */
function visibleAddonItems(addonsStr, allowed, allCount) {
  var items = parseAddOnItems(addonsStr);
  if (!items.length) return [];
  // A filter that selects everything is not a filter.
  if (!allowed || (allCount != null && allowed.size >= allCount)) return items;
  return items.filter(function (s) { return allowed.has(stripAddonPrice(s)); });
}

/* One note-line fragment for a row's add-ons: a total, then the itemised list
   with its icons.

   THE TOTAL IS SUMMED FROM THE VISIBLE ITEMS, not read off the row. Filtering
   to "Alcohol Permit" and then printing the row's whole add-on fee would put a
   number next to a list that does not add up to it — the same disagreement that
   made the facility Summary's chips untrustworthy for a week. */
/* The same total the note line prints, as a bare label. Exposed so a render
   check can assert the money survived the column's removal, and so the
   attribute can never disagree with the text beside it. */
function addonItemsTotalLabel(items) {
  var total = null;
  (items || []).forEach(function (s) {
    var p = addonItemPrice(s);
    if (p != null) total = (total == null ? 0 : total) + p;
  });
  return total == null ? undefined : formatMoney(total);
}

/* The lit window, in the FACILITY'S timezone rather than the reader's.

   Card 17294 emits "Lit Window" pre-formatted (2026-09-10), the same way it
   already emits Begin/End, so the common path does no date arithmetic at all.
   That is the whole fix: `Lit From`/`Lit Until` are timestamptz, and the old
   `new Date(s).getHours()` rendered them in whatever zone the BROWSER sits in
   — Dan read Midland's 6:00pm Central as 7:00pm Eastern, on a row whose Begin
   and End two columns over were correctly Central.

   The legacy path is kept as a FALLBACK and nothing more. Feeds cache four
   hours, so a pre-push response is still live after the card changes and its
   rows carry no "Lit Window"; falling back to the reader's clock is wrong by
   an offset, where rendering nothing would look like a rental that has no
   lighting at all. It ages out on its own within one TTL. */
/* Musco can anchor an end of the window to a RULE rather than a clock:
   start_source 'sunset' means the field comes on at dusk, which moves every
   day of a recurring rental, so nothing is stored in lit_from — measured,
   NULL on both such rows of the 9 schedules on the platform, and the card's
   CONCAT_WS then yields the END ALONE. Printing that raw gives "Lit: 11:00pm"
   for a field that comes on at dusk and goes off at 11, which is the opposite
   of what it says. Only a rule gets a word; a real clock always renders as a
   clock, so 'reservation' and 'set_time' are deliberately absent here. */
var LIT_SOURCE_WORDS = { sunset: 'Sunset', sunrise: 'Sunrise' };
function litSourceWord(src) {
  return LIT_SOURCE_WORDS[String(src || '').trim().toLowerCase()] || '';
}

function litWindowLabel(r) {
  if (!r) return '';
  // ONE display rule for a time on this page. formatTime is what every Begin
  // and End cell already goes through, and the card emits Lit Window in the
  // same 'HH12:MIam' shape it emits those in — so without this the note would
  // read "06:00pm" beside a Begin cell reading "6:00pm", on the same row. It
  // also folds the fallback's "6:00 PM" into the same shape, so the two paths
  // cannot render one booking two ways.
  var a, b;
  var aWord = litSourceWord(r.litStartSource);
  var bWord = litSourceWord(r.litEndSource);
  if (r.litWindow) {
    // CLOCKS ARE ASSIGNED TO THE ENDS THAT ARE NOT RULE-DRIVEN, in order,
    // rather than read positionally out of the string. A rule-driven end
    // contributes no clock at all, so a one-sided "11:00pm" is the END when
    // the start is sunset and the START when the end is — and splitting on
    // position cannot tell those apart. With no source columns at all (a feed
    // cached before the card carried them) both words are empty and this is
    // byte-for-byte the old behaviour, which ages out within one TTL.
    var clocks = String(r.litWindow).split(' - ')
      .map(function (x) { return x.trim(); })
      .filter(Boolean);
    if (clocks.length === 2) {
      // Both ends resolved, so position is unambiguous and a rule simply
      // overrides the clock it produced: the stored instant is ONE day's
      // sunset and a recurring rental moves, so the rule is the true
      // statement about the booking.
      a = aWord || formatTime(clocks[0]);
      b = bWord || formatTime(clocks[1]);
    } else {
      a = aWord || formatTime(clocks.shift() || '');
      b = bWord || formatTime(clocks.shift() || '');
    }
  } else {
    var raw = function (s) {
      if (!s) return '';
      try {
        var d = new Date(s);
        if (isNaN(d.getTime())) return '';
        var h = d.getHours(), m = d.getMinutes();
        var ap = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        return h + ':' + String(m).padStart(2, '0') + ap;
      } catch (e) { return ''; }
    };
    a = aWord || formatTime(raw(r.litFrom));
    b = bWord || formatTime(raw(r.litUntil));
  }
  if (a && b) return a + ' - ' + b;
  return a || b || '';
}

/* DOES THIS RENTAL ACTUALLY DRIVE A MUSCO SCHEDULE?
   One predicate, read by the note, the "Lit Only" filter, the row highlight
   and the Excel export — four surfaces that must not disagree about whether a
   field's floodlights are on this booking.

   IT KEYS ON THE SCHEDULE AND NEVER ON AN ADD-ON. An add-on called "Field
   Lights" is money: it bills someone for lighting and turns nothing on, and
   409 rentals on the platform carry one. Nothing here reads r.addons.

   The 'removed' test is belt-and-braces for the four-hour feed cache. Card
   17294 drops removed schedules in its own join now, but a response fetched
   before that change still says Lighting = 'Yes' with a sync status of
   'removed' — so this keeps the page honest for the one TTL where both shapes
   are live. Denylist on the one bad status, like the card's join: a status we
   cannot classify is more likely live than removed, and the failure direction
   has to be "tell someone" rather than "hide it". */
function muscoLit(r) {
  if (!r || r.lighting !== 'Yes') return false;
  return String(r.lightingSync || '').trim().toLowerCase() !== 'removed';
}

/* WILL THE LIGHTS ACTUALLY COME ON? "Lighting Sync" has been on card 17294
   all along and was read by NO surface, so an errored push drew exactly the
   same confident 💡 as a healthy one — a booked team at a dark field.

   THE VOCABULARY IS THE PLATFORM'S, NOT MEASURED, and that is worth knowing
   before trusting it: the staff MCP tool documents 'error' (carrying the
   vendor message in lastError) and 'synced' (Musco holds the schedule), but
   sync_status has only ever held 'removed' in data, synced_at is NULL on all
   9 schedules ever written and last_error is NULL on all 9. So this map is
   the place to correct once a live one exists.

   ONLY 'synced' IS A CONFIRMATION. Anything unrecognised — including a blank
   — reports as unconfirmed rather than drawing the confident lamp, because
   the two ways to be wrong are not symmetric: a healthy row shown as
   unconfirmed is noise, and an unhealthy row shown as confident is the dark
   field this column exists to prevent. */
var LIGHTING_SYNC_STATES = {
  synced:  { icon: '💡', tone: 'ok',
             label: 'Musco has this schedule — the lights are set' },
  error:   { icon: '⚠', tone: 'bad',
             label: 'Musco rejected this schedule — the lights will NOT come on' },
  pending: { icon: '🕓', tone: 'warn',
             label: 'Queued for Musco — not confirmed yet' },
  removed: { icon: '', tone: 'off',
             label: 'Lighting was taken off this rental' },
};
function lightingSyncState(r) {
  var status = String((r && r.lightingSync) || '').trim().toLowerCase();
  var known = LIGHTING_SYNC_STATES[status];
  if (known) {
    var out = { status: status, icon: known.icon, tone: known.tone, label: known.label };
    // The vendor's own message is the difference between "something failed"
    // and "Musco rejected this field id", so it rides along where there is one.
    if (status === 'error' && r && r.lightingError) out.label += ' — ' + r.lightingError;
    return out;
  }
  return {
    status: status,
    icon: '🕓',
    tone: 'warn',
    label: status
      ? 'Musco sync state "' + status + '" is not recognised — treat as unconfirmed'
      : 'Musco has not confirmed this schedule',
  };
}

function AddOnFilter({ allAddOns, selectedAddOns, onChange }) {
  const [open, setOpen]     = useState(false);
  const [search, setSearch] = useState('');
  const wrapRef             = useRef(null);

  useEffect(() => {
    function handleClick(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', handleClick);
    return () => document.removeEventListener('mousedown', handleClick);
  }, []);

  const filtered    = allAddOns.filter(s => s.toLowerCase().includes(search.toLowerCase()));
  const allSelected = selectedAddOns.size === allAddOns.length;
  const noneSelected = selectedAddOns.size === 0;

  function toggle(item) {
    const next = new Set(selectedAddOns);
    next.has(item) ? next.delete(item) : next.add(item);
    onChange(next);
  }

  function selectAll() { onChange(new Set(allAddOns)); }
  function clearAll()  { onChange(new Set()); }

  const badgeCount = allSelected ? null : selectedAddOns.size;

  return (
    <div className="loc-filter-wrap" ref={wrapRef}>
      <button
        className="btn-loc-filter"
        onClick={() => setOpen(o => !o)}
        style={!allSelected ? { borderColor: '#f59e0b', color: '#fde68a' } : {}}
      >
        ➕ Add Ons
        {badgeCount !== null && (
          <span className="badge">{badgeCount}/{allAddOns.length}</span>
        )}
      </button>

      {open && (
        <div className="loc-dropdown">
          <div className="loc-dropdown-header">
            <span>Filter Add-Ons</span>
            <div className="loc-dropdown-header-actions">
              <button onClick={selectAll} disabled={allSelected}>All</button>
              <button onClick={clearAll}  disabled={noneSelected}>None</button>
            </div>
          </div>

          {allAddOns.length > 5 && (
            <div className="loc-dropdown-search">
              <input
                type="text"
                placeholder="Search add-ons\u2026"
                value={search}
                onChange={e => setSearch(e.target.value)}
                autoFocus
              />
            </div>
          )}

          <div className="loc-dropdown-list">
            {filtered.length === 0 && (
              <div style={{padding:'10px 12px', color:'#666', fontSize:11}}>No matches</div>
            )}
            {filtered.map(item => (
              <label key={item} className="loc-item">
                <input
                  type="checkbox"
                  checked={selectedAddOns.has(item)}
                  onChange={() => toggle(item)}
                />
                <span title={item}>{getAddOnEmoji(item) + ' '}{item}</span>
              </label>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function heatColor(count, max) {
  if (!count || !max) return '#f0ede8';
  const t = Math.min(count / max, 1);
  const r = Math.round(240 - t * 171);
  const g = Math.round(237 - t * 114);
  const b = Math.round(232 - t * 75);
  return `rgb(${r},${g},${b})`;
}

function HeatmapStrip({ filteredRows, locationColors }) {
  const HOURS = Array.from({length:15}, (_,i) => i+7);
  const HOUR_LABELS = HOURS.map(h => h<=12 ? `${h}${h===12?'p':'a'}` : `${h-12}p`);
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const CELL_H = 14;
  const LEGEND_STEPS = 5;

  const dowHourGrid = useMemo(() => {
    const grid = Array.from({length:7}, () => new Array(HOURS.length).fill(0));
    filteredRows.forEach(r => {
      if (!r.date || !r.start) return;
      const dow = new Date(r.date + 'T12:00:00').getDay();
      const h = parseHour(r.start);
      const hi = h != null ? HOURS.indexOf(h) : -1;
      if (hi >= 0) grid[dow][hi]++;
    });
    return grid;
  }, [filteredRows]);

  const dowHourMax = useMemo(() => Math.max(1, ...dowHourGrid.flat()), [dowHourGrid]);

  const datLocData = useMemo(() => {
    const locations = [...new Set(filteredRows.map(r => r.location).filter(Boolean))].sort();
    const dates = [...new Set(filteredRows.map(r => r.date).filter(Boolean))].sort().slice(-31);
    const grid = {};
    filteredRows.forEach(r => {
      if (!dates.includes(r.date) || !r.location) return;
      if (!grid[r.date]) grid[r.date] = {};
      grid[r.date][r.location] = (grid[r.date][r.location] || 0) + 1;
    });
    return { locations, dates, grid };
  }, [filteredRows]);

  const datLocMax = useMemo(() => {
    let max = 1;
    Object.values(datLocData.grid).forEach(row => Object.values(row).forEach(v => { if (v > max) max = v; }));
    return max;
  }, [datLocData]);

  if (!filteredRows || filteredRows.length === 0) return null;

  return (
    <div className="heatmap-strip">

      {/* Panel 1: Day of week x Hour */}
      <div className="heatmap-panel">
        <div className="hm-title">Busiest Times — Day of Week x Hour</div>
        <div style={{display:'grid', gridTemplateColumns:`32px repeat(${HOURS.length},1fr)`, gap:'2px', marginBottom:'2px'}}>
          <div/>
          {HOUR_LABELS.map(l => <div key={l} style={{fontSize:8,color:'#bbb',textAlign:'center',lineHeight:1}}>{l}</div>)}
        </div>
        {DAYS.map((day, dow) => (
          <div key={day} style={{display:'grid', gridTemplateColumns:`32px repeat(${HOURS.length},1fr)`, gap:'2px', marginBottom:'2px'}}>
            <div style={{fontSize:9,color:'#999',display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:4}}>{day}</div>
            {HOURS.map((h, hi) => {
              const count = dowHourGrid[dow][hi];
              return <div key={h} style={{height:CELL_H, background:heatColor(count,dowHourMax), borderRadius:2}}
                title={count > 0 ? `${day} ${HOUR_LABELS[hi]}: ${count} rental${count!==1?'s':''}` : ''} />;
            })}
          </div>
        ))}
        <div className="hm-legend">
          <span>0</span>
          <div className="hm-legend-bar">
            {Array.from({length:LEGEND_STEPS},(_,i) => <div key={i} className="hm-legend-cell" style={{background:heatColor(i+1,LEGEND_STEPS)}} />)}
          </div>
          <span>{dowHourMax}</span>
        </div>
      </div>

      {/* Panel 2: Date x Location */}
      {datLocData.locations.length > 0 && datLocData.dates.length > 0 && (
        <div className="heatmap-panel">
          <div className="hm-title">Bookings by Date x Location</div>
          {(() => {
            const step = Math.max(1, Math.ceil(datLocData.dates.length / 8));
            return (
              <div style={{display:'grid', gridTemplateColumns:`80px repeat(${datLocData.dates.length},1fr)`, gap:'2px', marginBottom:'2px'}}>
                <div/>
                {datLocData.dates.map((d,i) => {
                  const dt = new Date(d + 'T12:00:00');
                  return <div key={d} style={{fontSize:7,color:'#bbb',textAlign:'center',lineHeight:1,overflow:'hidden'}}>
                    {i % step === 0 ? `${dt.getMonth()+1}/${dt.getDate()}` : ''}
                  </div>;
                })}
              </div>
            );
          })()}
          {datLocData.locations.map(loc => (
            <div key={loc} style={{display:'grid', gridTemplateColumns:`80px repeat(${datLocData.dates.length},1fr)`, gap:'2px', marginBottom:'2px'}}>
              <div style={{fontSize:9,color:'#666',display:'flex',alignItems:'center',overflow:'hidden',paddingRight:4}}>
                <div style={{width:6,height:6,borderRadius:1,background:locationColors[loc]||'#888',flexShrink:0,marginRight:4}} />
                <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{loc}</span>
              </div>
              {datLocData.dates.map(d => {
                const count = (datLocData.grid[d] && datLocData.grid[d][loc]) || 0;
                return <div key={d} style={{
                  height: CELL_H,
                  background: count > 0 ? (locationColors[loc] || '#888') : '#f0ede8',
                  borderRadius: 2,
                  opacity: count > 0 ? Math.max(0.18, count / datLocMax) : 1,
                }} title={count > 0 ? `${loc} ${d}: ${count} rental${count!==1?'s':''}` : ''} />;
              })}
            </div>
          ))}
          <div className="hm-legend">
            <span>0</span>
            <div className="hm-legend-bar">
              {Array.from({length:LEGEND_STEPS},(_,i) => <div key={i} className="hm-legend-cell" style={{background:'#457b9d',opacity:(i+1)/LEGEND_STEPS}} />)}
            </div>
            <span>{datLocMax}</span>
          </div>
        </div>
      )}

    </div>
  );
}

function renderNotes(text) {
  if (!text) return "";
  // Escape HTML entities first for safety
  var s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Markdown links [text](url) -> clickable links
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, function(m, label, url) {
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;font-weight:500">' + label + '</a>';
  });
  // Bold **text** or __text__
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  // Italic *text* or _text_ (but not inside URLs/tags)
  s = s.replace(/(?<![\/\w])\*([^*]+)\*(?!\w)/g, '<em>$1</em>');
  s = s.replace(/(?<![\/\w])_([^_]+)_(?!\w)/g, '<em>$1</em>');
  // Bullet points: lines starting with - or *
  s = s.replace(/(?:^|\\n|\n)\s*[-*]\s+/g, ' &bull; ');
  // Trailing backslashes (line break artifacts)
  s = s.replace(/\\\s*/g, ' ');
  // Bare URLs not already inside an href
  s = s.replace(/(?<!href=")(?<!">)(https?:\/\/[^\s,;<]+)/g, function(url) {
    var label = "\uD83D\uDD17 View";
    var lower = url.toLowerCase();
    if (lower.indexOf("contract") !== -1) label = "\uD83D\uDCCE Contract";
    else if (lower.indexOf("insurance") !== -1) label = "\uD83D\uDCCB Insurance";
    else if (lower.indexOf("invoice") !== -1) label = "\uD83D\uDCC4 Invoice";
    else if (lower.indexOf("permit") !== -1) label = "\uD83D\uDCDD Permit";
    return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" style="color:#2563eb;text-decoration:underline;font-weight:500">' + label + '</a>';
  });
  // Clean up multiple spaces
  s = s.replace(/\s{2,}/g, ' ').trim();
  return s;
}

// ── Saved views ──────────────────────────────────────────────────────────────
// A saved view is a NAME + a validated filter query string + a date intent —
// never a snapshot of rows. Applying one sets the same filter state a person
// could set by hand, so the PDF, print, Excel and email paths inherit it
// without needing to know saved views exist.
//
// WHAT A RENTAL-SCHEDULE VIEW CARRIES: the five toolbar filters, and only
// those. The column toggles are NOT saved. They are display state, they
// already persist per browser, and a shared view that overwrote them would
// take a colleague's chosen columns away the moment they opened somebody
// else's filter — the roster's rule, and it is sharper here because one of
// those columns is contact details.
//
// Note `site_types` (the site-type FILTER) is carried while `sitetype` (the
// site-type COLUMN) is not. Same line, one field apart.
const LS_LAST_VIEW = 'facility_saved_view_last_v1_';

// The date half lives in /saved-views.js, shared with the GL report and the
// Class Roster: ONE mirror of the server's getDateRange(), because a resolver
// that disagrees with the server is silent — a view named "Next 7 days" would
// open on one week on screen and report another in the emailed PDF. Thin
// wrappers so the reference resolves at CALL time; a deferred script has loaded
// by the time Babel runs this block, but reading it at module scope would make
// that an assumption rather than a fact.
function resolveSavedRange(token) { return RecSavedViews.resolveSavedRange(token); }
function fmtShortDate(iso)        { return RecSavedViews.fmtShortDate(iso); }
function viewDateLabel(v)         { return RecSavedViews.viewDateLabel(v); }

// Which ranges THIS report offers is the server's call — the rental schedule
// reads FORWARD, a GL rollup only looks backwards — and it arrives as
// ORG_CONFIG.savedViewRanges. A hardcoded list here is how gl.html came to
// offer "Today", which the server has always refused to store.
function savedViewRanges() {
  const r = (window.ORG_CONFIG || {}).savedViewRanges;
  return Array.isArray(r) ? r : [];
}
// The dialog's pre-selected range, taken from the offered list rather than
// named here, so the default can never be a token this report does not offer.
function defaultSavedRange() {
  const r = savedViewRanges();
  return r.length ? r[0][0] : '';
}

// The URL params a view owns. Mirrors SAVED_VIEW_PARAMS.facility in server.js,
// IN THAT ORDER — cleanViewParams emits in the server's order and
// currentFilterParams builds in this one, and the "edited" marker is a string
// comparison between the two. A different order makes every freshly-saved view
// read as dirty the instant it is applied.
const FACILITY_VIEW_PARAMS = ['locations', 'sites', 'site_types', 'book_type', 'addons'];

function parseViewParams(params) {
  const p = new URLSearchParams(params || '');
  const csv = k => { const v = p.get(k); return v ? v.split(',').map(x => x.trim()).filter(Boolean) : null; };
  return { locations: csv('locations'), sites: csv('sites'), siteTypes: csv('site_types'),
           bookType: p.get('book_type') || '', addons: csv('addons') };
}

const FAC_BOOK_TYPE_LABELS = { instant: 'Instant book only', managed: 'Staff-booked only' };

function viewFilterSummary(v) {
  const f = parseViewParams(v.params);
  const bits = [];
  const many = (list, one, plural) =>
    list.length === 1 ? one(list[0]) : list.length + ' ' + plural;
  if (f.locations)  bits.push(many(f.locations,  x => x, 'locations'));
  if (f.sites)      bits.push(many(f.sites,      x => x, 'sites'));
  if (f.siteTypes)  bits.push(many(f.siteTypes,  x => siteTypeLabel(x), 'site types'));
  // `all` is the ABSENCE of a booking-type filter, so naming it would read as a
  // filter where there is none and every unfiltered view would say "All".
  if (f.bookType && f.bookType !== 'all') bits.push(FAC_BOOK_TYPE_LABELS[f.bookType] || f.bookType);
  if (f.addons)     bits.push(many(f.addons,     x => x, 'add-ons'));
  return bits.length ? bits.join(' · ') : 'no filters';
}

// Resolve ONE dimension of a view against what this window actually offers.
// Pure, and at module scope, so a spec can RUN it — a regex over a reconciler
// passes on an inverted comparison.
//
// TWO BRANCHES, and both are load-bearing:
//
//   - A view that names NOTHING for a dimension RESETS that dimension to
//     everything. A view that could only narrow could never widen, so opening
//     an unfiltered view after a filtered one would silently keep the old
//     narrowing — the same reason gl.html sets its refund mode unconditionally.
//   - A view naming only values this window has no rows for falls back to
//     EVERYTHING rather than blanking the report. The caller says so on screen;
//     it must not be silent, or a stale view reads as "this week is empty".
function facViewSelection(available, requested) {
  const all = Array.isArray(available) ? available : [];
  if (!requested) return new Set(all);
  const want = new Set(requested);
  const valid = all.filter(v => want.has(v));
  return new Set(valid.length ? valid : all);
}

// Whether a dimension of a view is unusable in this window — the input to the
// warning above. Kept separate from facViewSelection so the message can name
// which dimensions were dropped rather than saying something vague.
function facViewMisses(available, requested) {
  if (!requested) return [];
  const have = new Set(Array.isArray(available) ? available : []);
  return requested.filter(v => !have.has(v));
}

  const params   = useMemo(() => getParams(), []);

    const range = window.ORG_CONFIG?.defaultDateRange;
    if (typeof range === 'number') {
      const today = new Date();
      const end   = new Date(today);
      end.setDate(today.getDate() + range - 1);
      return { start: toISO(today), end: toISO(end) };
    }
    // Default to this week (today + 6 days)
    const today = new Date();
    const end   = new Date(today);
    end.setDate(today.getDate() + 6);
    return { start: toISO(today), end: toISO(end) };
  }, []);

  const orgSlug = useMemo(() => {
