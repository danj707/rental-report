<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Director's Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { background: #faf9f7; color: #1c1917; margin: 0; padding: 0 0 60px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* ── Standard dark report toolbar ── */
  .toolbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: #2c2c2c; color: #eee; font-size: 13px; flex-wrap: wrap; }
  .toolbar-title { font-weight: 600; margin-right: 4px; }
  .toolbar-back { color: #9ca3af; text-decoration: none; font-size: 12px; }
  .toolbar-back:hover { color: #fff; }
  .toolbar-spacer { flex: 1; }
  .toolbar label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; display: flex; flex-direction: column; gap: 2px; }
  .toolbar select { padding: 5px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: #3a3a3a; color: #fff; font-size: 12px; font-family: inherit; }
  .toolbar button { padding: 6px 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: rgba(255,255,255,.08); color: #fff; font-size: 12px; font-family: inherit; cursor: pointer; white-space: nowrap; }
  .toolbar button:hover { background: rgba(255,255,255,.18); }
  .toolbar .btn-pdf { background: #374151; border-color: #4b5563; font-weight: 600; }

  /* ── Page + banner + standard report header ── */
  .page { max-width: 1400px; margin: 16px auto; padding: 24px 28px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .banner { margin: -24px -28px 18px; height: 170px; overflow: hidden; position: relative; background: #e8e6e0; }
  .banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .banner .banner-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.38)); }
  .banner .banner-cap { position: absolute; left: 22px; bottom: 12px; color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.55); }
  .banner .banner-cap .bc-org { font-size: 11px; letter-spacing: 1.8px; text-transform: uppercase; font-weight: 700; opacity: .92; }
  .banner .banner-cap .bc-title { font-size: 21px; font-weight: 800; margin-top: 1px; }
  .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:14px; gap:16px; }
  .report-header-left { display:flex; align-items:center; gap:14px; }
  .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
  .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
  .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
  .report-header-right { text-align:right; }
  .report-header .rh-meta { font-size:11px; color:#666; }
  .report-header .rh-period { font-size:13px; font-weight:700; color:#111827; }

  .partial-ribbon { background: #fffbeb; border: 1px solid #fde68a; border-left: 3px solid #f59e0b; color: #92400e; padding: 9px 14px; margin-bottom: 16px; border-radius: 4px; font-size: 12.5px; line-height: 1.55; }

  /* KPI cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #e8e6e0; border-radius: 9px; padding: 12px 14px; }
  .card .lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: #a8a29e; font-weight: 700; margin-bottom: 4px; }
  .card .val { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .card .sub { font-size: 10.5px; color: #a8a29e; margin-top: 3px; }
  .delta-up { color:#15803d; font-weight:700; }
  .delta-down { color:#b91c1c; font-weight:700; }

  /* Rec Insights */
  .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .insight-card { border: 1px solid #e5e7eb; border-left-width: 4px; border-radius: 8px; padding: 13px 15px; background: #fff; }
  .insight-opportunity { border-left-color: #10b981; } .insight-opportunity .insight-type { color: #059669; }
  .insight-risk { border-left-color: #ef4444; } .insight-risk .insight-type { color: #dc2626; }
  .insight-signal { border-left-color: #3b82f6; } .insight-signal .insight-type { color: #2563eb; }
  .insight-type { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
  .insight-title { font-size: 13.5px; font-weight: 700; color: #111827; margin-bottom: 5px; line-height: 1.3; }
  .insight-detail { font-size: 12.5px; color: #4b5563; line-height: 1.5; }
  .insight-action { font-size: 11.5px; color: #6b7280; margin-top: 7px; font-weight: 600; }
  .insights-head { display:flex; align-items:baseline; gap:9px; margin-bottom:9px; }
  .insights-head .t { font-size: 12px; font-weight: 800; color:#4338ca; }
  .insights-head .d { font-size: 11px; color:#a8a29e; }

  /* Sections */
  .vsec { margin: 24px 0 10px; }
  .vsec-t { font-size: 13.5px; font-weight: 800; color: #111827; display:flex; align-items:center; gap:8px; }
  .vsec-s { font-size: 11px; color: #9ca3af; margin-top:1px; margin-bottom: 10px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .two-col.w { grid-template-columns: 1.25fr .75fr; }
  @media (max-width: 950px) { .two-col, .two-col.w { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #e8e6e0; border-radius: 12px; padding: 14px 17px 13px; }
  .panel-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color:#57534e; margin-bottom: 10px; display:flex; align-items:center; gap:7px; }
  .panel-note { font-size: 11px; color: #9ca3af; margin-top: 9px; line-height:1.5; }

  /* Tables */
  table.mini { width:100%; border-collapse:collapse; font-size:12px; }
  table.mini thead th { text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:.05em; color:#a8a29e; font-weight:700; padding:4px 7px; border-bottom:1px solid #e8e6e0; }
  table.mini thead th.r, table.mini td.r { text-align:right; font-variant-numeric: tabular-nums; }
  table.mini tbody td { padding:6px 7px; border-bottom:1px solid #f5f4f1; vertical-align:middle; }
  table.mini tbody tr:hover { background:#faf9f7; }
  table.mini td.b { font-weight:600; color:#1c1917; }
  .tiny { font-size:10.5px; color:#a8a29e; }

  /* Bar lists + stacks */
  .bar-row { display:grid; grid-template-columns: 170px 1fr 92px; gap:9px; align-items:center; padding:4px 0; border-radius:5px; }
  .bar-row:hover { background:#faf9f7; }
  .bar-row .bl { font-size:12px; color:#1c1917; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-row .bv { font-size:12px; text-align:right; font-variant-numeric: tabular-nums; color:#1c1917; font-weight:600; }
  .bar-row .bv .bd { font-size:10.5px; font-weight:700; display:block; }
  .track { height:14px; background:#f5f4f1; border-radius:4px; position:relative; overflow:hidden; }
  .fill { position:absolute; left:0; top:0; bottom:0; background:#2a78d6; border-radius:0 4px 4px 0; min-width:2px; }
  .stack { display:flex; height:22px; border-radius:5px; overflow:hidden; }
  .stack .seg { min-width:2px; }
  .stack .seg + .seg { margin-left:2px; }
  .seg-1 { background:#2a78d6; } .seg-2 { background:#eb6834; } .seg-3 { background:#1baf7a; } .seg-4 { background:#eda100; }
  .legend { display:flex; gap:5px 16px; margin-top:8px; font-size:11px; color:#57534e; flex-wrap:wrap; }
  .legend b { color:#1c1917; }
  .dot { width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:-1px; }
  .mrow { display:grid; grid-template-columns: 42px 1fr 130px; gap:10px; align-items:center; padding:5px 0; }
  .mrow .ml { font-size:11px; font-weight:700; color:#57534e; text-transform:uppercase; letter-spacing:.04em; }
  .mrow .mv { font-size:11px; text-align:right; color:#57534e; font-variant-numeric: tabular-nums; }
  .mrow .mv b { color:#1c1917; }
  .press-row { display:grid; grid-template-columns: 1fr 120px 64px; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid #f5f4f1; }
  .press-row:hover { background:#faf9f7; }
  .press-row .pl { font-size:12px; font-weight:600; color:#1c1917; }
  .press-row .pl .tiny { display:block; font-weight:400; }
  .press-row .pv { font-size:12px; font-weight:800; text-align:right; font-variant-numeric: tabular-nums; }
  .press-amber { color:#92400e; } .press-red { color:#b91c1c; }
  .meter-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; }
  .meter .mh { display:flex; justify-content:space-between; font-size:11px; color:#57534e; margin-bottom:4px; }
  .meter .mh b { font-variant-numeric: tabular-nums; }

  .report-footer { border-top:1px solid #e8e6e0; margin-top:24px; padding-top:10px; display:flex; justify-content:space-between; font-size:10.5px; color:#a8a29e; }
  .gen-wrapper { max-width: 680px; margin: 60px auto; text-align: center; padding: 0 20px; }

  @media print {
    .toolbar, .no-print, .rec-banner, .fb-overlay { display: none !important; }
    body { background: #fff; }
    .page { margin: 0; box-shadow: none; padding: 0 10px; max-width: none; }
    .banner { margin: 0 -10px 18px; }
    .panel, .card, .insight-card, .vsec { break-inside: avoid; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useMemo } = React;

const fmtMoney = (n) => "$" + Math.round(n || 0).toLocaleString();
const fmtNum = (n) => (n == null ? "—" : Math.round(n).toLocaleString());

function Delta({ cur, prev, hidden, downIsGood }) {
  if (hidden || prev == null || cur == null || prev <= 0) return null;
  const p = Math.round((cur - prev) / Math.abs(prev) * 100);
  if (!isFinite(p)) return null;
  const up = p >= 0;
  const good = downIsGood ? !up : up;
  // Seasonal explosions read better as a multiplier than "▲ 1310%"
  const label = p > 400 ? (Math.round(cur / prev * 10) / 10) + "×" : Math.abs(p) + "%";
  return (
    <span className={good ? "delta-up" : "delta-down"}>
      {up ? "▲" : "▼"} {label}
    </span>
  );
}

function BarList({ rows, money }) {
  const max = Math.max(1, ...rows.map(r => Math.abs(r.value)));
  return (
    <div>
      {rows.map((r, i) => (
        <div className="bar-row" key={i} title={r.title || r.label}>
          <div className="bl">{r.label}</div>
          <div className="track"><div className="fill" style={{ width: Math.max(2, Math.abs(r.value) / max * 100) + "%" }} /></div>
          <div className="bv">
            {money ? fmtMoney(r.value) : fmtNum(r.value)}
            {r.delta != null && <span className={"bd " + (r.delta >= 0 ? "delta-up" : "delta-down")}>{r.delta >= 0 ? "▲" : "▼"} {Math.abs(r.delta)}%</span>}
          </div>
        </div>
      ))}
    </div>
  );
}

function App() {
  const cfg = window.ORG_CONFIG || {};
  const slug = cfg.slug || "";
  const orgName = cfg.displayName || slug;
  const token = cfg.token || "";

  const [quarters, setQuarters] = useState([]);
  const [sel, setSel] = useState("");       // "YYYY-Qn"
  const [data, setData] = useState(null);
  const [state, setState] = useState("loading"); // loading | done | error
  const [errMsg, setErrMsg] = useState("");
  const [pdfLoading, setPdfLoading] = useState(false);

  function downloadPdf() {
    setPdfLoading(true);
    fetch(withToken("/" + slug + "/directors-report/api/pdf?quarter=" + encodeURIComponent(sel)))
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.blob(); })
      .then(blob => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "directors-report-" + slug + "-" + sel + ".pdf";
        a.click();
        URL.revokeObjectURL(a.href);
      })
      .catch(e => alert("PDF failed: " + e.message))
      .finally(() => setPdfLoading(false));
  }

  function withToken(url) {
    return token ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : url;
  }

  // In-progress quarter (selectable "to date" view)
  const inProgress = useMemo(() => {
    const now = new Date();
    const q = Math.floor(now.getMonth() / 3) + 1;
    return { year: now.getFullYear(), q, key: now.getFullYear() + "-Q" + q, label: "Q" + q + " " + now.getFullYear() + " (in progress)" };
  }, []);

  useEffect(() => {
    fetch(withToken("/" + slug + "/directors-report/api/quarters"))
      .then(r => r.json())
      .then(j => {
        if (j.ok) {
          setQuarters(j.quarters || []);
          const def = (j.quarters && j.quarters[0]) ? j.quarters[0].key : inProgress.key;
          const fromUrl = new URLSearchParams(window.location.search).get("quarter");
          setSel(fromUrl && /^\d{4}-Q[1-4]$/.test(fromUrl) ? fromUrl : def);
        } else { setSel(inProgress.key); }
      })
      .catch(() => setSel(inProgress.key));
  }, []);

  useEffect(() => {
    if (!sel) return;
    const m = sel.match(/^(\d{4})-Q([1-4])$/);
    if (!m) return;
    setState("loading");
    fetch(withToken("/" + slug + "/directors-report/api/quarter?year=" + m[1] + "&q=" + m[2]))
      .then(r => r.json())
      .then(j => {
        if (!j.ok) throw new Error(j.error || "Failed to load");
        setData(j); setState("done");
      })
      .catch(e => { setErrMsg(e.message); setState("error"); });
  }, [sel]);

  const d = data;
  const partial = d && d.quarter && d.quarter.partial;
  const ssTotal = d && d.selfservice ? d.selfservice.self.orders + d.selfservice.staff.orders : 0;
  const ssPct = ssTotal > 0 ? Math.round(d.selfservice.self.orders / ssTotal * 1000) / 10 : null;
  const revMixTotal = d && d.users ? d.users.revMix.program + d.users.revMix.facility + d.users.revMix.fee + d.users.revMix.product : 0;

  return (
    <div>
      <div className="toolbar no-print">
        <a className="toolbar-back" href={withToken("/" + slug)}>&larr; Reports</a>
        <span className="toolbar-title">Director's Report</span>
        <div className="toolbar-spacer"></div>
        <label>Quarter
          <select value={sel} onChange={e => setSel(e.target.value)}>
            {!quarters.some(x => x.key === inProgress.key) && <option value={inProgress.key}>{inProgress.label}</option>}
            {quarters.map(x => <option key={x.key} value={x.key}>{x.label}{x.stored ? " · archived" : ""}</option>)}
          </select>
        </label>
        <button onClick={() => window.print()} title="Print this view">&#128424;&#65039; Print</button>
        <button className="btn-pdf" onClick={downloadPdf} disabled={state !== "done" || pdfLoading} title="Download this quarter as a PDF">
          {pdfLoading ? "Generating…" : "\u{1F4C4} PDF"}
        </button>
      </div>

      {state === "loading" && <div style={{ paddingTop: 80 }}><JuiceLoader /></div>}
      {state === "error" && (
        <div className="gen-wrapper">
          <div style={{ color: "#dc2626", marginBottom: 16 }}>Error: {errMsg}</div>
          <button className="btn-pdf" style={{ background: "#374151", color: "#fff", border: "none", borderRadius: 6, padding: "8px 20px", cursor: "pointer" }}
            onClick={() => setSel(s => s)}>Retry</button>
        </div>
      )}

      {state === "done" && d && (
        <div className="page">
          {cfg.bannerUrl && (
            <div className="banner">
              <img src={cfg.bannerUrl} alt="" onError={e => { e.target.closest(".banner").style.display = "none"; }} />
              <div className="banner-shade"></div>
              <div className="banner-cap">
                <div className="bc-org">{orgName}</div>
                <div className="bc-title">Director's Report &mdash; {d.quarter.label}</div>
              </div>
            </div>
          )}

          <div className="report-header">
            <div className="report-header-left">
              {cfg.logoUrl && <img className="report-header-logo" src={cfg.logoUrl} alt="" onError={e => { e.target.style.display = "none"; }} />}
              <div>
                <div className="org-label">{orgName}</div>
                <div className="title">Director's Report &mdash; Quarterly Executive Summary</div>
              </div>
            </div>
            <div className="report-header-right">
              <div className="rh-period">{d.quarter.label} &middot; {d.quarter.start} &ndash; {d.quarter.end}</div>
              <div className="rh-meta">
                Generated {new Date(d.generatedAt).toLocaleDateString()}
                {d.fromSnapshot ? " · archived snapshot" : ""}
                {!partial && d.prevLabel ? " · compared against " + d.prevLabel : ""}
              </div>
            </div>
          </div>

          {partial && (
            <div className="partial-ribbon">
              <strong>Quarter in progress</strong> &mdash; figures run through today. Quarter-over-quarter deltas are hidden until the quarter completes; the final report is generated automatically at quarter end.
            </div>
          )}

          {/* ── Executive KPI strip ── */}
          <div className="cards">
            {d.gl && (
              <div className="card">
                <div className="lbl">Net Revenue</div>
                <div className="val">{fmtMoney(d.gl.net)}</div>
                <div className="sub"><Delta cur={d.gl.net} prev={d.gl.prev && d.gl.prev.net} hidden={partial} />{!partial && d.gl.prev ? " vs " + d.prevLabel : "gross " + fmtMoney(d.gl.gross)}</div>
              </div>
            )}
            {d.transactions && d.transactions.cur != null && (
              <div className="card">
                <div className="lbl">Transactions</div>
                <div className="val">{fmtNum(d.transactions.cur)}</div>
                <div className="sub"><Delta cur={d.transactions.cur} prev={d.transactions.prev} hidden={partial} />{!partial && d.transactions.prev != null ? " vs " + fmtNum(d.transactions.prev) : ""}</div>
              </div>
            )}
            {d.programs && (
              <div className="card">
                <div className="lbl">Program Enrollments</div>
                <div className="val">{fmtNum(d.programs.enroll)}</div>
                <div className="sub"><Delta cur={d.programs.enroll} prev={d.programs.prevEnroll} hidden={partial} /> {d.programs.count} programs</div>
              </div>
            )}
            {d.facility && (
              <div className="card">
                <div className="lbl">Facility Reservations</div>
                <div className="val">{fmtNum(d.facility.n)}</div>
                <div className="sub"><Delta cur={d.facility.n} prev={d.facility.prevN} hidden={partial} /> {fmtMoney(d.facility.rev)} rental revenue</div>
              </div>
            )}
            {d.users && (
              <div className="card">
                <div className="lbl">New Households</div>
                <div className="val">+{fmtNum(d.users.newHH)}</div>
                <div className="sub">{fmtNum(d.users.newPeople)} new people this quarter</div>
              </div>
            )}
            {ssPct != null && (
              <div className="card">
                <div className="lbl">Self-Service Orders</div>
                <div className="val">{ssPct}%</div>
                <div className="sub">{fmtNum(d.selfservice.self.orders)} of {fmtNum(ssTotal)} orders placed online</div>
              </div>
            )}
          </div>

          {/* ── Rec Insights (baked into the snapshot) ── */}
          {d.insights && d.insights.length > 0 && (
            <div>
              <div className="insights-head">
                <span className="t">&#10024; Rec Insights</span>
                <span className="d">generated {new Date(d.generatedAt).toLocaleDateString()} from this quarter's data</span>
              </div>
              <div className="insights-grid">
                {d.insights.map((ins, i) => (
                  <div key={i} className={"insight-card insight-" + (ins.type || "signal")}>
                    <div className="insight-type">{ins.type}</div>
                    <div className="insight-title">{ins.title}</div>
                    <div className="insight-detail">{ins.detail || ins.body}</div>
                    {ins.action && <div className="insight-action">&rarr; {ins.action}</div>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ── Revenue ── */}
          {d.gl && (
            <div>
              <div className="vsec">
                <div className="vsec-t"><span>&#128202;</span> Revenue &amp; Financial</div>
                <div className="vsec-s">GL Code Rollup &middot; gross {fmtMoney(d.gl.gross)} &middot; refunds {fmtMoney(d.gl.refunds)} ({d.gl.gross > 0 ? (d.gl.refunds / d.gl.gross * 100).toFixed(1) : 0}% of gross, {fmtNum(d.gl.refundCount)} refunds)</div>
              </div>
              <div className="two-col w">
                <div className="panel">
                  <div className="panel-h">Net revenue by GL account</div>
                  <BarList money rows={d.gl.accounts.map(a => ({
                    label: a.name, value: a.net,
                    title: a.name + " — " + fmtMoney(a.net) + " net" + (a.prevNet != null && !partial ? " (prior quarter: " + fmtMoney(a.prevNet) + ")" : ""),
                    delta: (!partial && a.prevNet != null && a.prevNet > 0) ? Math.round((a.net - a.prevNet) / Math.abs(a.prevNet) * 100) : null,
                  }))} />
                  <div className="panel-note">Bars scaled to the largest account. Payments with no GL code appear as &ldquo;Unassigned&rdquo;.</div>
                </div>
                <div className="panel">
                  <div className="panel-h">Quarter at a glance</div>
                  <table className="mini">
                    <thead><tr><th></th><th className="r">{d.quarter.label}</th>{!partial && d.gl.prev && <th className="r">{d.prevLabel}</th>}{!partial && d.gl.prev && <th className="r">&Delta;</th>}</tr></thead>
                    <tbody>
                      <tr><td className="b">Gross payments</td><td className="r">{fmtMoney(d.gl.gross)}</td>{!partial && d.gl.prev && <td className="r">{fmtMoney(d.gl.prev.gross)}</td>}{!partial && d.gl.prev && <td className="r"><Delta cur={d.gl.gross} prev={d.gl.prev.gross} /></td>}</tr>
                      <tr><td className="b">Refunds</td><td className="r">{fmtMoney(d.gl.refunds)}</td>{!partial && d.gl.prev && <td className="r">{fmtMoney(d.gl.prev.refunds)}</td>}{!partial && d.gl.prev && <td className="r"><Delta cur={d.gl.refunds} prev={d.gl.prev.refunds} downIsGood /></td>}</tr>
                      <tr><td className="b">Net revenue</td><td className="r">{fmtMoney(d.gl.net)}</td>{!partial && d.gl.prev && <td className="r">{fmtMoney(d.gl.prev.net)}</td>}{!partial && d.gl.prev && <td className="r"><Delta cur={d.gl.net} prev={d.gl.prev.net} /></td>}</tr>
                      {d.transactions.cur != null && <tr><td className="b">Transactions</td><td className="r">{fmtNum(d.transactions.cur)}</td>{!partial && d.gl.prev && <td className="r">{fmtNum(d.transactions.prev)}</td>}{!partial && d.gl.prev && <td className="r"><Delta cur={d.transactions.cur} prev={d.transactions.prev} /></td>}</tr>}
                      <tr><td className="b">Payments recorded</td><td className="r">{fmtNum(d.gl.payments)}</td>{!partial && d.gl.prev && <td className="r">{fmtNum(d.gl.prev.payments)}</td>}{!partial && d.gl.prev && <td className="r"><Delta cur={d.gl.payments} prev={d.gl.prev.payments} /></td>}</tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ── Programs ── */}
          {d.programs && (
            <div>
              <div className="vsec">
                <div className="vsec-t"><span>&#127919;</span> Programs &amp; Enrollment</div>
                <div className="vsec-s">{d.programs.sections} sections &middot; {d.programs.count} programs with sessions this quarter &middot; {fmtNum(d.programs.enroll)} enrollments on {fmtNum(d.programs.cap)} capacity ({d.programs.cap > 0 ? Math.round(d.programs.enroll / d.programs.cap * 100) : 0}% overall fill) &middot; {fmtMoney(d.programs.periodNet)} collected in-period</div>
              </div>
              <div className="two-col w">
                <div className="panel">
                  <div className="panel-h">Top programs by enrollment</div>
                  <table className="mini">
                    <thead><tr><th>Program</th><th className="r">Enrolled</th><th className="r">Fill</th><th className="r">Waitlist</th><th className="r">Net (qtr)</th></tr></thead>
                    <tbody>
                      {d.programs.top.map((p, i) => (
                        <tr key={i}>
                          <td className="b">{p.name} <span className="tiny">{p.sections} section{p.sections !== 1 ? "s" : ""}</span></td>
                          <td className="r">{fmtNum(p.enrolled)}</td>
                          <td className={"r" + (p.fill != null && p.fill >= 90 ? " press-amber" : "")}>{p.fill != null ? p.fill + "%" : "—"}</td>
                          <td className={"r" + (p.wl > 10 ? " press-amber" : "")}>{p.wl > 0 ? fmtNum(p.wl) : "—"}</td>
                          <td className="r">{fmtMoney(p.net)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="panel-note">&ldquo;Net (qtr)&rdquo; is money received in-quarter on these sections &mdash; programs collecting across quarters show partial revenue here.</div>
                </div>
                {d.programs.low.length > 0 && (
                  <div className="panel">
                    <div className="panel-h">&#9888;&#65039; Filling slowest <span className="tiny" style={{ textTransform: "none", letterSpacing: 0 }}>capacity &gt; 10, lowest fill</span></div>
                    <table className="mini">
                      <thead><tr><th>Program</th><th className="r">Enrolled / Cap</th><th className="r">Fill</th></tr></thead>
                      <tbody>
                        {d.programs.low.map((p, i) => (
                          <tr key={i}>
                            <td className="b">{p.name}</td>
                            <td className="r">{fmtNum(p.enrolled)} / {fmtNum(p.capacity)}</td>
                            <td className={"r " + (p.fill < 10 ? "press-red" : "press-amber")}>{p.fill}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                    <div className="panel-note">Marketing candidates &mdash; or capacities worth right-sizing so fill rates stay meaningful.</div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── Waitlist ── */}
          {d.waitlist && d.waitlist.waiting > 0 && (
            <div>
              <div className="vsec">
                <div className="vsec-t"><span>&#8987;</span> Waitlist &amp; Unmet Demand</div>
                <div className="vsec-s">Sections with sessions this quarter &middot; full offer lifecycle from the Waitlist Demand report</div>
              </div>
              <div className="two-col">
                <div className="panel">
                  <div className="panel-h">Offer funnel</div>
                  <div className="cards" style={{ marginBottom: 8, gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))" }}>
                    <div className="card"><div className="lbl">Waiting now</div><div className="val" style={{ fontSize: 19 }}>{fmtNum(d.waitlist.waiting)}</div><div className="sub">across {d.waitlist.sections} sections</div></div>
                    <div className="card"><div className="lbl">Offers sent</div><div className="val" style={{ fontSize: 19 }}>{fmtNum(d.waitlist.offers)}</div><div className="sub">to {fmtNum(d.waitlist.people)} people</div></div>
                    <div className="card"><div className="lbl">Claimed</div><div className="val" style={{ fontSize: 19 }}>{fmtNum(d.waitlist.claimed)}</div><div className="sub">{d.waitlist.claimRate != null ? d.waitlist.claimRate + "% claim rate" : "—"}</div></div>
                    <div className="card"><div className="lbl">Median claim</div><div className="val" style={{ fontSize: 19 }}>{d.waitlist.medianClaimH != null ? d.waitlist.medianClaimH + "h" : "—"}</div><div className="sub">{fmtNum(d.waitlist.expired)} offers expired</div></div>
                  </div>
                  <div className="panel-note">People queued with no offer possible until capacity opens. See the Waitlist Demand report for section-level detail.</div>
                  {d.fasttrack && (
                    <div style={{ borderTop: "1px solid #f5f4f1", marginTop: 12, paddingTop: 12 }}>
                      <div className="panel-h">&#9889; Fast Track pre-registration <span className="tiny" style={{ textTransform: "none", letterSpacing: 0 }}>all-time demand signal</span></div>
                      <div className="cards" style={{ marginBottom: 0, gridTemplateColumns: "repeat(auto-fit,minmax(120px,1fr))" }}>
                        <div className="card"><div className="lbl">Signups</div><div className="val" style={{ fontSize: 19 }}>{fmtNum(d.fasttrack.total)}</div><div className="sub">pre-registered interest</div></div>
                        <div className="card"><div className="lbl">Converted</div><div className="val" style={{ fontSize: 19 }}>{fmtNum(d.fasttrack.converted)}</div><div className="sub">became enrollments</div></div>
                        <div className="card"><div className="lbl">Conversion</div><div className="val" style={{ fontSize: 19 }}>{d.fasttrack.rate}%</div><div className="sub">signup &rarr; enrolled</div></div>
                        {d.fasttrack.revenue > 0 && <div className="card"><div className="lbl">FT Revenue</div><div className="val" style={{ fontSize: 19 }}>{fmtMoney(d.fasttrack.revenue)}</div><div className="sub">from converted signups</div></div>}
                      </div>
                    </div>
                  )}
                </div>
                {d.waitlist.top.length > 0 && (
                  <div className="panel">
                    <div className="panel-h">Highest-pressure sections <span className="tiny" style={{ textTransform: "none", letterSpacing: 0 }}>waiting &divide; capacity</span></div>
                    {(() => {
                      const maxP = Math.max(1, ...d.waitlist.top.map(t => t.pressure || 0));
                      return d.waitlist.top.map((t, i) => (
                        <div className="press-row" key={i} style={i === d.waitlist.top.length - 1 ? { borderBottom: "none" } : null}
                          title={t.program + " — " + t.waitlisted + " waiting, " + t.enrolled + "/" + t.capacity + " enrolled"}>
                          <div className="pl">{t.section || t.program} <span className="tiny">{fmtNum(t.enrolled)}/{fmtNum(t.capacity)} enrolled &middot; {fmtNum(t.waitlisted)} waiting</span></div>
                          <div className="track"><div className="fill" style={{ width: Math.max(4, (t.pressure || 0) / maxP * 100) + "%", background: (t.pressure || 0) >= 100 ? "#b91c1c" : "#d97706" }} /></div>
                          <div className={"pv " + ((t.pressure || 0) >= 100 ? "press-red" : "press-amber")}>{t.pressure != null ? t.pressure + "%" : "—"}</div>
                        </div>
                      ));
                    })()}
                    <div className="panel-note">Pressure &gt;100% means more people are waiting than the section could hold even if it emptied.</div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── Facilities ── */}
          {d.facility && (
            <div>
              <div className="vsec">
                <div className="vsec-t"><span>&#127966;&#65039;</span> Facilities &amp; Rentals</div>
                <div className="vsec-s">{fmtNum(d.facility.n)} reservations &middot; {fmtMoney(d.facility.rev)} rental revenue &middot; {d.facility.residentPct}% by verified residents{!partial && d.facility.prevN != null ? " · " + d.prevLabel + " was " + fmtNum(d.facility.prevN) + " / " + fmtMoney(d.facility.prevRev || 0) : ""}</div>
              </div>
              <div className="two-col">
                <div className="panel">
                  <div className="panel-h">Rental revenue by location</div>
                  <BarList money rows={d.facility.topLocs.map(l => ({ label: l.name, value: l.rev, title: l.name + " — " + fmtMoney(l.rev) + " across " + fmtNum(l.n) + " reservations" }))} />
                </div>
                <div className="panel">
                  <div className="panel-h">How bookings arrive{d.court ? " · court usage" : ""}</div>
                  {(d.facility.managed + d.facility.instant) > 0 && (
                    <div>
                      <div className="stack" title={"Managed (staff-scheduled): " + fmtNum(d.facility.managed) + " · Instant (self-serve): " + fmtNum(d.facility.instant)}>
                        <div className="seg seg-1" style={{ width: (d.facility.managed / (d.facility.managed + d.facility.instant) * 100) + "%" }} />
                        <div className="seg seg-2" style={{ width: (d.facility.instant / (d.facility.managed + d.facility.instant) * 100) + "%" }} />
                      </div>
                      <div className="legend">
                        <span><span className="dot" style={{ background: "#2a78d6" }}></span>Managed <b>{fmtNum(d.facility.managed)}</b></span>
                        <span><span className="dot" style={{ background: "#eb6834" }}></span>Instant self-serve <b>{fmtNum(d.facility.instant)}</b></span>
                      </div>
                    </div>
                  )}
                  <table className="mini" style={{ marginTop: 12 }}>
                    <tbody>
                      {d.court && <tr><td className="b">Court hours booked ({d.court.courts} courts)</td><td className="r">{fmtNum(d.court.hours)} hrs</td></tr>}
                      {d.court && d.court.util != null && <tr><td className="b">Share of open court time <span className="tiny">est. {d.court.hrsPerDay} hrs/day</span></td><td className="r">~{d.court.util}%</td></tr>}
                      <tr><td className="b">Resident share of reservations</td><td className="r">{d.facility.residentPct}%</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ── Community ── */}
          {d.users && (
            <div>
              <div className="vsec">
                <div className="vsec-t"><span>&#128101;</span> Community</div>
                <div className="vsec-s">Community Intel &middot; all-time platform base with this quarter's growth</div>
              </div>
              <div className="two-col">
                <div className="panel">
                  <div className="panel-h">Who we serve</div>
                  <table className="mini">
                    <tbody>
                      <tr><td className="b">People on platform</td><td className="r">{fmtNum(d.users.people)}</td><td className="tiny r">in {fmtNum(d.users.households)} households</td></tr>
                      <tr><td className="b">New this quarter</td><td className="r delta-up">+{fmtNum(d.users.newPeople)} people</td><td className="tiny r">+{fmtNum(d.users.newHH)} households</td></tr>
                      <tr><td className="b">Verified residents</td><td className="r">{d.users.resPct}%</td><td className="tiny r">{d.users.topCities.length ? "top cities: " + d.users.topCities.map(c => c.name).join(", ") : ""}</td></tr>
                      {d.users.medianAge != null && <tr><td className="b">Median participant age</td><td className="r">{d.users.medianAge}</td><td className="tiny r"></td></tr>}
                      {d.users.avgHHSpend > 0 && <tr><td className="b">Avg household spend</td><td className="r">{fmtMoney(d.users.avgHHSpend)}</td><td className="tiny r">all-time, spending households</td></tr>}
                      {d.retention && <tr><td className="b">Returning participants (2+ programs)</td><td className="r">{d.retention.rate}%</td><td className="tiny r">{fmtNum(d.retention.loyal)} in 3+ programs</td></tr>}
                    </tbody>
                  </table>
                </div>
                <div className="panel">
                  {revMixTotal > 0 && (
                    <div>
                      <div className="panel-h">Where household dollars go <span className="tiny" style={{ textTransform: "none", letterSpacing: 0 }}>all-time</span></div>
                      <div className="stack" title={"Programs " + fmtMoney(d.users.revMix.program) + " · Facility " + fmtMoney(d.users.revMix.facility) + " · Fees " + fmtMoney(d.users.revMix.fee) + " · Products " + fmtMoney(d.users.revMix.product)}>
                        {[["program", "seg-1"], ["facility", "seg-2"], ["fee", "seg-3"], ["product", "seg-4"]].map(([k, cls]) =>
                          d.users.revMix[k] > 0 ? <div key={k} className={"seg " + cls} style={{ width: (d.users.revMix[k] / revMixTotal * 100) + "%" }} /> : null)}
                      </div>
                      <div className="legend">
                        {d.users.revMix.program > 0 && <span><span className="dot" style={{ background: "#2a78d6" }}></span>Programs <b>{fmtMoney(d.users.revMix.program)}</b></span>}
                        {d.users.revMix.facility > 0 && <span><span className="dot" style={{ background: "#eb6834" }}></span>Facility <b>{fmtMoney(d.users.revMix.facility)}</b></span>}
                        {d.users.revMix.fee > 0 && <span><span className="dot" style={{ background: "#1baf7a" }}></span>Fees <b>{fmtMoney(d.users.revMix.fee)}</b></span>}
                        {d.users.revMix.product > 0 && <span><span className="dot" style={{ background: "#eda100" }}></span>Products <b>{fmtMoney(d.users.revMix.product)}</b></span>}
                      </div>
                    </div>
                  )}
                  <div className="panel-h" style={{ marginTop: revMixTotal > 0 ? 14 : 0 }}>Data completeness</div>
                  <div className="meter-grid">
                    {[["Age / DOB", d.users.comp.age], ["Gender", d.users.comp.gender], ["Phone", d.users.comp.phone]].map(([label, pct], i) => (
                      <div className="meter" key={i}>
                        <div className="mh"><span>{label}</span><b>{pct}%</b></div>
                        <div className="track"><div className="fill" style={{ width: pct + "%", background: pct >= 80 ? "#15803d" : "#d97706" }} /></div>
                      </div>
                    ))}
                  </div>
                  {d.users.missingAge > 0 && d.users.comp.age < 60 && (
                    <div className="panel-note">{fmtNum(d.users.missingAge)} people are missing age data &mdash; prompting for DOB at registration strengthens reporting and program targeting.</div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* ── Operations ── */}
          {(d.selfservice || d.payout) && (
            <div>
              <div className="vsec">
                <div className="vsec-t"><span>&#9881;&#65039;</span> Operations &amp; Staff Workload</div>
                <div className="vsec-s">Self-service order mix and instructor-led programming</div>
              </div>
              <div className="two-col">
                {d.selfservice && (
                  <div className="panel">
                    <div className="panel-h">Orders by channel, monthly</div>
                    {d.selfservice.months.map((m, i) => {
                      const tot = m.selfOrders + m.staffOrders;
                      const monthName = new Date(m.month + "-15").toLocaleString("default", { month: "short" });
                      return tot > 0 ? (
                        <div className="mrow" key={i} title={monthName + " — self " + fmtNum(m.selfOrders) + " (" + fmtMoney(m.selfDollars) + ") · staff " + fmtNum(m.staffOrders) + " (" + fmtMoney(m.staffDollars) + ")"}>
                          <div className="ml">{monthName}</div>
                          <div className="stack" style={{ height: 18 }}>
                            <div className="seg seg-1" style={{ width: (m.selfOrders / tot * 100) + "%" }} />
                            <div className="seg seg-2" style={{ width: (m.staffOrders / tot * 100) + "%" }} />
                          </div>
                          <div className="mv"><b>{fmtNum(tot)}</b> orders &middot; {Math.round(m.selfOrders / tot * 100)}% self</div>
                        </div>
                      ) : null;
                    })}
                    <div className="legend">
                      <span><span className="dot" style={{ background: "#2a78d6" }}></span>Self-service <b>{fmtNum(d.selfservice.self.orders)}</b> orders / {fmtMoney(d.selfservice.self.dollars)}</span>
                      <span><span className="dot" style={{ background: "#eb6834" }}></span>Staff-entered <b>{fmtNum(d.selfservice.staff.orders)}</b> orders / {fmtMoney(d.selfservice.staff.dollars)}</span>
                    </div>
                  </div>
                )}
                {d.payout && (
                  <div className="panel">
                    {d.payout && (
                      <div>
                        <div className="panel-h">Instructor-led programs</div>
                        <table className="mini">
                          <thead><tr><th>Instructor</th><th className="r">Sections</th><th className="r">Registrations</th><th className="r">Collected</th></tr></thead>
                          <tbody>
                            {d.payout.top.map((p, i) => (
                              <tr key={i}><td className="b">{p.name}</td><td className="r">{fmtNum(p.sections)}</td><td className="r">{fmtNum(p.regs)}</td><td className="r">{fmtMoney(p.paid)}</td></tr>
                            ))}
                          </tbody>
                        </table>
                        <div className="panel-note">{d.payout.instructors} instructors led paid programming this quarter, collecting {fmtMoney(d.payout.paid)} across {fmtNum(d.payout.regs)} registrations. &ldquo;Collected&rdquo; is participant payments on instructor-led sections, not instructor compensation.</div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ── Data notes ── */}
          <div className="panel" style={{ marginTop: 20, background: "#faf9f7" }}>
            <div className="panel-h">&#128203; Data notes</div>
            <div className="panel-note" style={{ marginTop: 0 }}>
              Revenue and transactions from GL Code Rollup (payment-date basis). Enrollment counts sections with sessions in the quarter; program revenue is in-period receipts. Waitlist funnel covers offers sent in the quarter. Facility figures exclude canceled reservations; court utilization assumes {d.court ? d.court.hrsPerDay : 11} open hrs/day per court. Community demographics are all-time; &ldquo;new&rdquo; means accounts created inside the quarter. Fast Track and retention are all-time cumulative.
              {d.fromSnapshot ? " This report is an archived snapshot generated at quarter close." : ""}
            </div>
          </div>

          <div className="report-footer">
            <span>Powered by Rec Technologies &middot; rec.us</span>
            <span>Confidential &mdash; {orgName} &middot; {d.quarter.label} Director's Report</span>
          </div>

          <div id="report-ready" style={{ display: "none" }} />
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script src="/juice-loader.js" defer></script>
  <script src="/nav-breadcrumb.js" defer></script>
  <script src="/feedback-widget.js" defer></script>
</body>
</html>
