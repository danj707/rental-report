<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Waitlist Demand</title>
<style>
  * { box-sizing: border-box; }
  body { background: #faf9f7; color: #1c1917; margin: 0; padding: 0 0 60px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* ── Toolbar — standard dark report toolbar ── */
  .toolbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: #2c2c2c; color: #eee; font-size: 13px; flex-wrap: wrap; }
  .toolbar-title { font-weight: 600; margin-right: 4px; }
  .toolbar-back { color: #9ca3af; text-decoration: none; font-size: 12px; }
  .toolbar-back:hover { color: #fff; }
  .toolbar-spacer { flex: 1; }
  .toolbar label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; display: flex; flex-direction: column; gap: 2px; }
  .toolbar input[type="search"] { padding: 5px 9px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: rgba(255,255,255,.1); color: #fff; font-size: 12px; font-family: inherit; outline: none; min-width: 190px; }
  .toolbar input[type="search"]:focus { border-color: #3b82f6; }
  .toolbar select { padding: 5px 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: #3a3a3a; color: #fff; font-size: 12px; font-family: inherit; }
  .toolbar input[type="date"] { padding: 4px 6px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: #3a3a3a; color: #fff; font-size: 11.5px; font-family: inherit; color-scheme: dark; }
  .toolbar .date-row { display: flex; gap: 4px; align-items: center; }
  .toolbar .date-clear { padding: 3px 7px !important; font-size: 11px !important; }
  .toolbar button { padding: 6px 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: rgba(255,255,255,.08); color: #fff; font-size: 12px; font-family: inherit; cursor: pointer; transition: background .15s; white-space: nowrap; }
  .toolbar button:hover { background: rgba(255,255,255,.18); }
  .toolbar .btn-excel { background: #16803c; border-color: #16803c; font-weight: 600; }
  .toolbar .btn-excel:hover { background: #15692f; }
  .toolbar .btn-excel:disabled { opacity: .5; cursor: not-allowed; }
  .toolbar .row-count { font-size: 11px; color: #aaa; }
  .toolbar .divider { width: 1px; height: 28px; background: rgba(255,255,255,.15); margin: 0 2px; }

  /* ── Page + standard report header ── */
  .page { max-width: 1400px; margin: 16px auto; padding: 24px 28px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:18px; gap:16px; }
  .report-header-left { display:flex; align-items:center; gap:14px; }
  .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
  .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
  .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
  .report-header-right { text-align:right; }
  .report-header .rh-meta { font-size:11px; color:#666; }

  /* ── AI Insights ── */
  .insights-section { margin: 0 0 16px; padding: 4px 0 0; }
  .insights-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .insights-btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    position: relative; overflow: visible;
    box-shadow: 0 2px 12px rgba(99,102,241,.3);
  }
  .insights-btn:hover { filter: brightness(1.08); }
  .insights-btn:disabled { opacity: .6; cursor: wait; }
  .insights-btn .sparkle { position: absolute; pointer-events: none; font-size: 10px; opacity: 0; animation: sparkle-float 2.5s ease-in-out infinite; }
  .insights-btn .sparkle:nth-child(1) { top: -8px; left: 8%; animation-delay: 0s; }
  .insights-btn .sparkle:nth-child(2) { top: -6px; right: 12%; animation-delay: 0.7s; font-size: 8px; }
  .insights-btn .sparkle:nth-child(3) { bottom: -7px; left: 25%; animation-delay: 1.4s; font-size: 7px; }
  .insights-btn .sparkle:nth-child(4) { top: -5px; left: 50%; animation-delay: 0.3s; font-size: 6px; }
  .insights-btn .sparkle:nth-child(5) { bottom: -6px; right: 20%; animation-delay: 1.1s; font-size: 9px; }
  .insights-btn .sparkle:nth-child(6) { top: -9px; right: 3%; animation-delay: 1.9s; font-size: 7px; }
  @keyframes sparkle-float {
    0%,100% { opacity: 0; transform: translateY(0) scale(0.5); }
    15% { opacity: 1; transform: translateY(-3px) scale(1.1); }
    30% { opacity: 0.7; transform: translateY(-7px) scale(0.9); }
    50% { opacity: 0.3; transform: translateY(-11px) scale(0.6); }
    70% { opacity: 0; transform: translateY(-15px) scale(0.3); }
  }
  .insights-sub { font-size: 12px; color: #888; }
  .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
  .insight-card { border: 1px solid #e5e7eb; border-left-width: 4px; border-radius: 8px; padding: 14px 16px; background: #fff; }
  .insight-opportunity { border-left-color: #10b981; } .insight-opportunity .insight-type { color: #059669; }
  .insight-risk { border-left-color: #ef4444; } .insight-risk .insight-type { color: #dc2626; }
  .insight-signal { border-left-color: #3b82f6; } .insight-signal .insight-type { color: #2563eb; }
  .insight-type { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
  .insight-title { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 5px; line-height: 1.3; }
  .insight-detail { font-size: 13px; color: #4b5563; line-height: 1.5; }
  .insight-action { font-size: 12px; color: #6b7280; margin-top: 8px; font-weight: 500; }
  .insights-feedback { display:flex; align-items:center; gap:8px; margin-top:12px; padding:8px 4px; font-size:13px; color:#666; }
  .insights-feedback button { background:none; border:1px solid #e5e7eb; border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px; transition:all .15s; }
  .insights-feedback button:hover { background:#f3f4f6; border-color:#d1d5db; }
  .insights-feedback .fb-label { color:#888; font-size:12px; }
  .insights-feedback .fb-thanks { color:#10b981; font-weight:600; font-size:13px; }
  .insights-feedback .fb-down-form { display:flex; align-items:center; gap:6px; flex:1; }
  .insights-feedback .fb-down-form input { flex:1; border:1px solid #d1d5db; border-radius:6px; padding:5px 10px; font-size:13px; font-family:inherit; outline:none; }
  .insights-feedback .fb-down-form input:focus { border-color:#6366f1; box-shadow:0 0 0 2px rgba(99,102,241,.15); }
  .insights-feedback .fb-send { background:#6366f1!important; color:#fff!important; border-color:#6366f1!important; font-weight:600; }

  @media print {
    .toolbar, .rec-banner, .fb-overlay, .no-print { display: none !important; }
    body { background: #fff; }
    .page { margin: 0; box-shadow: none; padding: 0; }
    .card, .panel, .band { break-inside: avoid; }
  }

  .report-blurb { background: #fff; border: 1px solid #e8e6e0; border-radius: 8px; padding: 10px 14px;
    font-size: 12px; color: #57534e; margin-bottom: 16px; }
  .report-blurb strong { color: #1c1917; }
  .glossary { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 22px; margin: 10px 0 2px; }
  @media (max-width: 860px) { .glossary { grid-template-columns: 1fr; } }
  .glossary .g { font-size: 11.5px; color: #57534e; line-height: 1.45; }
  .glossary .g b { color: #1c1917; }

  /* summary cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #e8e6e0; border-radius: 9px; padding: 12px 14px; position: relative; }
  .card.planned { border-style: dashed; }
  .card .lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: #a8a29e; font-weight: 700; margin-bottom: 4px; }
  .card .val { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .card .val.amber { color: #92400e; }
  .card .val.green { color: #15803d; }
  .card .val.muted { color: #a8a29e; }
  .card .sub { font-size: 10.5px; color: #a8a29e; margin-top: 3px; }

  /* bands + panels */
  .band { background: linear-gradient(135deg, #fffbeb, #ffffff); border: 1px solid #fde68a; border-radius: 12px;
    padding: 15px 18px 17px; margin-bottom: 16px; }
  .band-h { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-bottom: 13px; }
  .band-h .t { font-size: 12px; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: .05em; }
  .band-h .d { font-size: 11px; color: #a8a29e; }
  .panel { background: #fff; border: 1px solid #e8e6e0; border-radius: 12px; padding: 15px 18px 14px; }
  .panel-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .panel-h .t { font-size: 13px; font-weight: 700; }
  .panel-h .d { font-size: 11px; color: #a8a29e; }
  .twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 860px) { .twocol { grid-template-columns: 1fr; } }

  /* funnel */
  .funnel { display: flex; flex-direction: column; gap: 8px; }
  .fstage { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; }
  .fstage .fl { text-align: right; }
  .fstage .fl .n { font-weight: 700; font-size: 12.5px; }
  .fstage .fl .s { font-size: 10.5px; color: #a8a29e; }
  .fbar { height: 26px; border-radius: 4px; min-width: 2px; max-width: 100%; display: flex; align-items: center; }
  .fbar .fv { font-weight: 800; font-size: 12px; font-variant-numeric: tabular-nums; padding-left: 9px; color: #1c1917; white-space: nowrap; }
  .fbar.ghost { border: 1.5px dashed #92400e; background: transparent; }
  .fbar.ghost .fv { color: #92400e; font-weight: 700; }

  /* histogram */
  .hist { display: flex; align-items: flex-end; gap: 6px; height: 118px; margin-top: 14px; position: relative; }
  .hcol { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .hbar { width: 100%; max-width: 52px; background: #d97706; border-radius: 4px 4px 0 0; }
  .hnum { font-size: 10px; font-weight: 700; color: #57534e; margin-bottom: 3px; font-variant-numeric: tabular-nums; }
  .hlbl { font-size: 9.5px; color: #a8a29e; margin-top: 5px; white-space: nowrap; }
  .expiry-rule { position: absolute; top: -4px; bottom: 16px; left: 49.6%; border-left: 2px dashed #b91c1c; opacity: .6; }
  .expiry-tag { position: absolute; top: -7px; left: calc(49.6% + 6px); font-size: 9.5px; color: #b91c1c; font-weight: 700; }
  .insight { margin-top: 12px; font-size: 11.5px; color: #57534e; border-top: 1px solid #e8e6e0; padding-top: 9px; }
  .insight b { color: #92400e; }

  /* mode mix */
  .mix { display: flex; height: 18px; border-radius: 5px; overflow: hidden; margin: 16px 0 8px; }
  .mix div + div { margin-left: 2px; }
  .mixleg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: #57534e; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

  /* table */
  .tablecard { background: #fff; border: 1px solid #e8e6e0; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .tablecard .cap { padding: 13px 18px 0; }
  .tablecard .cap .t { font-size: 13px; font-weight: 700; }
  .tablecard .cap .d { font-size: 11px; color: #a8a29e; margin-top: 2px; }
  .tbl-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-variant-numeric: tabular-nums; }
  th { font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: #a8a29e; font-weight: 700;
    text-align: left; padding: 7px 10px; border-bottom: 1px solid #e8e6e0; background: #faf9f7; white-space: nowrap; cursor: pointer; user-select: none; }
  th.r, td.r { text-align: right; }
  th.sorted { color: #92400e; }
  td { padding: 8px 10px; border-bottom: 1px solid #f0eee8; font-size: 12.5px; white-space: nowrap; }
  td.name { white-space: normal; min-width: 220px; }
  td.name .prog { font-weight: 600; }
  td.name .sec { font-size: 11px; color: #a8a29e; }
  tr:hover td { background: #fafaf9; }
  .press { font-weight: 800; }
  .press.hot { color: #b91c1c; }
  .press.warm { color: #92400e; }
  .pressbar { display: inline-block; height: 7px; border-radius: 3px; background: #d97706; vertical-align: middle; margin-right: 7px; }
  .pressbar.hot { background: #b91c1c; }
  .modepill { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: #dcfce7; color: #166534; white-space: nowrap; }
  .modepill.mute { background: #faf9f7; color: #a8a29e; border: 1px solid #e8e6e0; font-weight: 600; }
  .modepill.off { background: #fee2e2; color: #b91c1c; }
  .statuspill { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
  .st-prog { background: #dcfce7; color: #166534; }
  .st-up   { background: #fef3c7; color: #92400e; }
  .st-past { background: #f5f5f4; color: #78716c; }
  .totals-row td { font-weight: 700; background: #faf9f7; border-top: 2px solid #e8e6e0; }

  .method { border: 1px solid #e8e6e0; border-radius: 12px; padding: 14px 18px; background: #fff; font-size: 11.5px; color: #57534e; }
  .method .t { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #a8a29e; margin-bottom: 8px; }
  .method ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 5px; }

  .err { background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; border-radius: 8px; padding: 12px 16px; margin: 20px 0; }
  .loading-wrap { padding: 40px 0; }
</style>
</head>
<body>

<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

/* ── Helpers ── */
const SP = new URLSearchParams(window.location.search);
const URL_TOKEN = SP.get('token') || '';
function withToken(url) { if (!URL_TOKEN) return url; const sep = url.includes('?') ? '&' : '?'; return url + sep + 'token=' + encodeURIComponent(URL_TOKEN); }

const parts = window.location.pathname.split('/').filter(Boolean);
const orgSlug = parts[0] || '';
const basePath = '/' + parts.slice(0, 2).join('/');

function fmtN(v) { const n = Number(v); return isNaN(n) ? 0 : n; }
function fmtInt(v) { return fmtN(v).toLocaleString(); }
function fmt$(v) { return '$' + Math.round(fmtN(v)).toLocaleString(); }
function fmtD(d) { if (!d || String(d).length < 8) return ''; try { const s = new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); return s === 'Invalid Date' ? '' : s; } catch { return ''; } }

// Rec's waitlist_config "mode" values, translated to plain English. The raw
// value describes what happens when a seat opens up in a full section.
const MODE_LABELS = {
  'remain-active': 'offers go to the list',
  'reopen-registration': 'reopens to everyone',
  'off': 'waitlist off',
};
const MODE_HELP = {
  'remain-active': 'When a seat opens up, people on the waitlist get a claim link to take it. (Rec setting: remain-active)',
  'reopen-registration': 'When a seat opens up, registration reopens to the public — first come, first served; the waitlist does not hold your place. (Rec setting: reopen-registration)',
  'off': 'Waitlist is turned off — a full section just shows "Full". (Rec setting: off)',
};
const MODE_NONE_HELP = 'No waitlist behavior configured — a full section just shows "Full" and interest goes uncounted.';

function normalizeRow(raw) {
  return {
    program:        raw['Program'] ?? '',
    sectionId:      raw['Section Id'] ?? '',
    section:        raw['Section'] ?? '',
    season:         raw['Season'] ?? 'No Season',
    status:         raw['Section Status'] ?? '',
    startDate:      raw['Start Date'] ?? '',
    endDate:        raw['End Date'] ?? '',
    activity:       raw['Activity'] ?? 'Uncategorized',
    mode:           raw['Waitlist Mode'] ?? null,
    modeSource:     raw['Mode Source'] ?? 'none',
    linkMin:        raw['Link Expiration Min'] != null ? fmtN(raw['Link Expiration Min']) : null,
    capacity:       raw['Capacity'] != null ? fmtN(raw['Capacity']) : null,
    enrolled:       fmtN(raw['Enrolled']),
    price:          fmtN(raw['Price']),
    waitlisted:     fmtN(raw['Waitlisted']),
    wlAllTime:      fmtN(raw['Waitlist All-Time']),
    wlConverted:    fmtN(raw['Waitlist Converted']),
    demand:         fmtN(raw['Est Demand']),
    pressure:       raw['Pressure %'] != null ? fmtN(raw['Pressure %']) : null,
    oldestJoin:     raw['Oldest Active Join'] ?? '',
    offersClaimed:  fmtN(raw['Offers Claimed']),
    claimants:      fmtN(raw['Claimants'] ?? raw['Offers Claimed']), // Claimants added in card v2; fall back on stale cache
    offersSent:        fmtN(raw['Offers Sent']),        // v3 offer lifecycle columns —
    peopleOffered:     fmtN(raw['People Offered']),     // zero until cached rows refresh
    offersExpired:     fmtN(raw['Offers Expired']),
    offersOutstanding: fmtN(raw['Offers Outstanding']),

    c1h:            fmtN(raw['Claim 1h']),
    c4h:            fmtN(raw['Claim 4h']),
    c8h:            fmtN(raw['Claim 8h']),
    c24h:           fmtN(raw['Claim 24h']),
    c48h:           fmtN(raw['Claim 48h']),
    cMore:          fmtN(raw['Claim 48h Plus']),
    orgName:        raw['Org Name'] ?? '',
  };
}

const SORTS = {
  waitlisted: (a, b) => b.waitlisted - a.waitlisted,
  pressure:   (a, b) => (b.pressure ?? -1) - (a.pressure ?? -1),
  demand:     (a, b) => b.demand - a.demand,
  program:    (a, b) => (a.program + a.section).localeCompare(b.program + b.section),
  enrolled:   (a, b) => b.enrolled - a.enrolled,
};

function App() {
  const [rows, setRows]       = useState(null);
  const [meta, setMeta]       = useState({});
  const [error, setError]     = useState(null);
  const [loading, setLoading] = useState(true);
  const [search, setSearch]   = useState('');
  const [season, setSeason]   = useState('');
  const [status, setStatus]   = useState('active'); // active = In Progress + Upcoming
  const [sortKey, setSortKey] = useState('waitlisted');
  const [startDate, setStartDate] = useState(SP.get('start_date') || '');
  const [endDate, setEndDate]     = useState(SP.get('end_date') || '');

  // AI Insights
  const [insights,        setInsights]        = useState(null);
  const [insightsMeta,    setInsightsMeta]    = useState(null); // { sectionCount, key }
  const [insightsLoading, setInsightsLoading] = useState(false);
  const [insightsError,   setInsightsError]   = useState(null);
  const [insightsTraceId, setInsightsTraceId] = useState(null);
  const [fbSent, setFbSent] = useState(false);
  const [fbMode, setFbMode] = useState(null);
  const [fbComment, setFbComment] = useState('');

  useEffect(() => {
    setLoading(true); setError(null);
    const qs = new URLSearchParams();
    if (SP.get('_nocache') === '1' || SP.get('_refresh') === '1') qs.set('_nocache', '1');
    if (startDate) qs.set('start_date', startDate);
    if (endDate) qs.set('end_date', endDate);
    const q = qs.toString();
    fetch(withToken(basePath + '/api/data' + (q ? '?' + q : '')))
      .then(r => { if (!r.ok) throw new Error('Server returned ' + r.status); return r.json(); })
      .then(json => { setRows((json.rows || []).map(normalizeRow)); setMeta(json.meta || {}); })
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
  }, [startDate, endDate]);

  const seasons = useMemo(() => {
    if (!rows) return [];
    const s = new Set(rows.map(r => r.season).filter(Boolean));
    return Array.from(s).sort();
  }, [rows]);

  // Filtered rows drive everything on the page
  const fRows = useMemo(() => {
    if (!rows) return [];
    const q = search.trim().toLowerCase();
    return rows.filter(r => {
      if (season && r.season !== season) return false;
      if (status === 'active' && r.status === 'Past') return false;
      if (status === 'inprogress' && r.status !== 'In Progress') return false;
      if (status === 'upcoming' && r.status !== 'Upcoming') return false;
      if (q && !(r.program.toLowerCase().includes(q) || r.section.toLowerCase().includes(q) || r.activity.toLowerCase().includes(q))) return false;
      return true;
    });
  }, [rows, search, season, status]);

  const agg = useMemo(() => {
    const a = { waitlisted: 0, allTime: 0, converted: 0, demand: 0, offersClaimed: 0, claimants: 0,
                offersSent: 0, peopleOffered: 0, offersExpired: 0, offersOutstanding: 0,
                c1h: 0, c4h: 0, c8h: 0, c24h: 0, c48h: 0, cMore: 0,
                modes: { 'remain-active': 0, 'reopen-registration': 0, off: 0, none: 0 },
                sections: fRows.length };
    fRows.forEach(r => {
      a.waitlisted += r.waitlisted; a.allTime += r.wlAllTime; a.converted += r.wlConverted;
      a.demand += r.demand; a.offersClaimed += r.offersClaimed; a.claimants += r.claimants;
      a.offersSent += r.offersSent; a.peopleOffered += r.peopleOffered;
      a.offersExpired += r.offersExpired; a.offersOutstanding += r.offersOutstanding;
      a.c1h += r.c1h; a.c4h += r.c4h; a.c8h += r.c8h; a.c24h += r.c24h; a.c48h += r.c48h; a.cMore += r.cMore;
      const m = r.mode || 'none';
      if (a.modes[m] == null) a.modes[m] = 0;
      a.modes[m] += 1;
    });
    a.convPct = a.allTime > 0 ? Math.round(a.converted / a.allTime * 1000) / 10 : null;
    const within8 = a.c1h + a.c4h + a.c8h;
    a.claimWithin8Pct = a.offersClaimed > 0 ? Math.round(within8 / a.offersClaimed * 100) : null;
    return a;
  }, [fRows]);

  const tableRows = useMemo(() => {
    const withWl = fRows.filter(r => r.waitlisted > 0 || r.wlAllTime > 0);
    return withWl.sort(SORTS[sortKey] || SORTS.waitlisted);
  }, [fRows, sortKey]);

  // ── AI Insights ──
  const buildInsightsBlob = useCallback(() => {
    const sectionNames = tableRows.slice(0, 30).map(r => r.program + ' — ' + r.section);
    return {
      filters: { season: season || 'all', status, search: search.trim() || null,
                 sessionStart: startDate || null, sessionEnd: endDate || null },
      summary: {
        sectionsInView: agg.sections,
        waitlistedNow: agg.waitlisted,
        waitlistJoinersAllTime: agg.allTime,
        convertedToEnrolled: agg.converted,
        conversionPct: agg.convPct,
        unmetDemandUsd: Math.round(agg.demand),
        offersSent: agg.offersSent,
        distinctPeopleOffered: agg.peopleOffered,
        offersClaimed: agg.offersClaimed,
        distinctPeopleWhoClaimed: agg.claimants,
        offersExpiredUnclaimed: agg.offersExpired,
        offersStillOpen: agg.offersOutstanding,
        claimWithin8hPct: agg.claimWithin8Pct,
        timeToClaimBuckets: { within1h: agg.c1h, h1to4: agg.c4h, h4to8: agg.c8h, h8to24: agg.c24h, h24to48: agg.c48h, over48h: agg.cMore },
        waitlistModeMix: agg.modes,
      },
      sectionNames,
      topPressureSections: tableRows.slice(0, 30).map(r => ({
        program: r.program, section: r.section, season: r.season, status: r.status,
        mode: r.mode || 'not configured', capacity: r.capacity, enrolled: r.enrolled,
        waitlisted: r.waitlisted, joinersAllTime: r.wlAllTime, converted: r.wlConverted,
        pressurePct: r.pressure, estDemandUsd: Math.round(r.demand),
      })),
    };
  }, [tableRows, agg, season, status, search, startDate, endDate]);

  const sendInsightsFeedback = useCallback((score) => {
    if (!insightsTraceId) return;
    fetch(withToken(basePath + '/api/insights/score'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ traceId: insightsTraceId, score, comment: score === 0 ? fbComment : '' }),
    }).catch(() => {});
    setFbSent(true); setFbMode(null);
  }, [insightsTraceId, fbComment]);

  // Fingerprint of the visible data — drives insights invalidation on any filter change.
  const filteredKey = useMemo(
    () => [season, status, search.trim(), startDate, endDate, fRows.length, agg.waitlisted].join('|'),
    [season, status, search, startDate, endDate, fRows, agg]
  );

  const getInsights = useCallback(async () => {
    setInsightsLoading(true);
    setInsightsError(null);
    setInsights(null);
    setInsightsMeta(null);
    try {
      const blob = buildInsightsBlob();
      const resp = await fetch(withToken(basePath + '/api/insights'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(blob),
      });
      const json = await resp.json().catch(() => ({}));
      if (!resp.ok || !json.ok) throw new Error(json.error || ('Request failed (' + resp.status + ')'));
      setInsights(json.insights || []);
      setInsightsTraceId(json.traceId || null);
      setFbSent(false); setFbMode(null); setFbComment('');
      setInsightsMeta({ sectionCount: tableRows.length, key: filteredKey });
    } catch (err) {
      setInsightsError(err.message || 'Could not generate insights');
    } finally {
      setInsightsLoading(false);
    }
  }, [buildInsightsBlob, tableRows, filteredKey]);

  // Invalidate insights whenever the visible data changes.
  useEffect(() => { setInsights(null); setInsightsMeta(null); setInsightsError(null); }, [filteredKey]);

  // Never render insights generated for a different view.
  const activeInsights = useMemo(() => {
    if (!insights || !insightsMeta) return insights;
    if (insightsMeta.key !== filteredKey) return null;
    return insights;
  }, [insights, insightsMeta, filteredKey]);

  function exportXlsx() {
    const data = tableRows.map(r => ({
      Program: r.program, Section: r.section, Season: r.season, Status: r.status,
      Activity: r.activity, 'When a Seat Opens': r.mode ? (MODE_LABELS[r.mode] || r.mode) : 'no waitlist set up',
      Capacity: r.capacity, Enrolled: r.enrolled, Waitlisted: r.waitlisted,
      'Waitlist All-Time': r.wlAllTime, Converted: r.wlConverted,
      'Pressure %': r.pressure, 'Est Demand $': r.demand, Price: r.price,
      'Offers Sent': r.offersSent, 'Seats Claimed': r.offersClaimed, 'People Who Claimed': r.claimants,
      'Offers Expired Unclaimed': r.offersExpired, 'Oldest Active Join': r.oldestJoin,
      'Start Date': r.startDate, 'End Date': r.endDate,
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [{wch:28},{wch:28},{wch:14},{wch:11},{wch:16},{wch:20},{wch:8},{wch:8},{wch:10},{wch:14},{wch:10},{wch:10},{wch:12},{wch:8},{wch:12},{wch:13},{wch:16},{wch:20},{wch:16},{wch:11},{wch:11}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Waitlist Demand');
    XLSX.writeFile(wb, orgSlug + '-waitlist-demand.xlsx');
  }

  const orgName = (rows && rows.length > 0 && rows[0].orgName) || orgSlug;
  const logoUrl = meta.logo_url || '';
  const updatedAt = meta.generated_at ? new Date(meta.generated_at).toLocaleString() : 'live';

  const backHref = '/' + orgSlug + (URL_TOKEN ? '?token=' + encodeURIComponent(URL_TOKEN) : '');
  const bodyState = loading ? 'loading' : error ? 'error' : (!rows || rows.length === 0) ? 'empty' : 'ready';

  const histMax = Math.max(agg.c1h, agg.c4h, agg.c8h, agg.c24h, agg.c48h, agg.cMore, 1);
  const buckets = [
    { k: '≤1h', v: agg.c1h }, { k: '1–4h', v: agg.c4h }, { k: '4–8h', v: agg.c8h },
    { k: '8–24h', v: agg.c24h }, { k: '24–48h', v: agg.c48h }, { k: '48h+', v: agg.cMore },
  ];
  const after8 = agg.c24h + agg.c48h + agg.cMore;
  const after8Pct = agg.offersClaimed > 0 ? Math.round(after8 / agg.offersClaimed * 100) : null;
  const totalModes = Math.max(agg.sections, 1);
  const funnelMax = Math.max(agg.allTime, agg.peopleOffered, agg.claimants, agg.converted, 1);
  const pressToBar = p => Math.min(70, Math.max(8, Math.round((p || 0) / 12)));

  const Th = ({ id, children, right }) => (
    <th className={(right ? 'r ' : '') + (sortKey === id ? 'sorted' : '')}
        title="Click to sort" onClick={() => SORTS[id] && setSortKey(id)}>{children}{sortKey === id ? ' ↓' : ''}</th>
  );

  return (
    <div>
      <div className="toolbar">
        <a className="toolbar-back" href={backHref}>←</a>
        <span className="toolbar-title">Waitlist Demand</span>
        <span className="divider" />
        <label>
          Search
          <input type="search" placeholder="Section or program…" value={search} onChange={e => setSearch(e.target.value)} />
        </label>
        <label>
          Season
          <select value={season} onChange={e => setSeason(e.target.value)}>
            <option value="">All seasons</option>
            {seasons.map(s => <option key={s} value={s}>{s}</option>)}
          </select>
        </label>
        <label>
          Status
          <select value={status} onChange={e => setStatus(e.target.value)}>
            <option value="active">Active (In Progress + Upcoming)</option>
            <option value="inprogress">In Progress only</option>
            <option value="upcoming">Upcoming only</option>
            <option value="all">All (incl. Past)</option>
          </select>
        </label>
        <label>
          Sessions between
          <span className="date-row">
            <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
            <span style={{ color: '#777' }}>–</span>
            <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
            {(startDate || endDate) && (
              <button type="button" className="date-clear" title="Clear dates — back to all-time"
                      onClick={() => { setStartDate(''); setEndDate(''); }}>✕</button>
            )}
          </span>
        </label>
        <span className="toolbar-spacer" />
        <span className="row-count">{bodyState !== 'ready' ? '…' : tableRows.length.toLocaleString() + ' section' + (tableRows.length !== 1 ? 's' : '') + ' · ' + fmtInt(agg.waitlisted) + ' waitlisted'}</span>
        <button onClick={() => window.print()} title="Print this view">🖨️ Print</button>
        <button className="btn-excel" onClick={exportXlsx} disabled={tableRows.length === 0} title="Download the sections in view as Excel">📊 Excel</button>
      </div>

      <div className="page">
      <div className="report-header">
        <div className="report-header-left">
          {logoUrl ? <img src={logoUrl} alt="" className="report-header-logo" onError={e => e.target.style.display='none'} /> : null}
          <div>
            <div className="org-label">{orgName}</div>
            <div className="title">Waitlist Demand Report</div>
          </div>
        </div>
        <div className="report-header-right">
          {bodyState === 'ready' && (
            <div className="rh-meta" style={{fontWeight:600,marginBottom:2}}>{fmtInt(agg.waitlisted)} waitlisted · {fmt$(agg.demand)} est. demand</div>
          )}
          {(startDate || endDate) && (
            <div className="rh-meta">sessions {startDate ? fmtD(startDate) : '…'} – {endDate ? fmtD(endDate) : '…'}</div>
          )}
          <div className="rh-meta">updated {updatedAt}</div>
        </div>
      </div>

      {bodyState === 'loading' && (
        <div className="loading-wrap">
          <JuiceLoader />
        </div>
      )}
      {bodyState === 'error' && (
        <div className="err">Couldn't load waitlist data: {error}. Try refreshing — if it persists, the report may not be configured for this org yet.</div>
      )}
      {bodyState === 'empty' && (
        <div className="err">No section data returned for this org.</div>
      )}
      {bodyState === 'ready' && (<React.Fragment>
      <div className="report-blurb">
        <strong>Who's waiting for a spot, and what that demand is worth.</strong> When a section fills up, residents
        can put their name on its waitlist; when a seat opens back up, the platform can send them a link to claim it.
        This report counts that demand. Key terms:
        <div className="glossary">
          <div className="g"><b>Waitlisted now</b> — people on a waitlist at this moment (canceled entries don't count). Someone waiting on three different sections counts once for each.</div>
          <div className="g"><b>Waitlist → enrolled</b> — of everyone who has <i>ever</i> joined one of these waitlists, the share who now holds a confirmed spot in that same section.</div>
          <div className="g"><b>Unmet demand</b> — waitlisted now × the section's list price: the revenue sitting on the table if seats existed.</div>
          <div className="g"><b>Offers sent</b> — every claim link the platform issued when a seat opened up. One person waiting on several sessions of the same program can receive (and use) more than one link, so offers and claims count <i>links</i>; the funnel below counts <i>people</i>.</div>
          <div className="g"><b>Seats claimed / expired unclaimed</b> — a sent link is either <i>used</i> to take the seat (claimed), <i>never used</i> before its window closed (expired unclaimed — missed connections worth a look), or still open right now.</div>
          <div className="g"><b>When a seat opens</b> — each section's waitlist setting: <b>offers go to the list</b> (waitlisted people get a claim link) · <b>reopens to everyone</b> (the seat goes back to public first-come-first-served) · <b>waitlist off / not set up</b> (a full section just shows "Full" — that interest is invisible demand).</div>
        </div>
      </div>

      {/* AI Insights */}
      <div className="insights-section no-print">
        <div className="insights-head">
          <button type="button" className="insights-btn" onClick={getInsights} disabled={insightsLoading}>
            <span className="sparkle">✦</span><span className="sparkle">✧</span><span className="sparkle">✦</span><span className="sparkle">✧</span><span className="sparkle">✦</span><span className="sparkle">✧</span>
            {insightsLoading ? 'Analyzing…' : (activeInsights ? '↻ Refresh insights' : '✨ Rec Insights')}
          </button>
          {activeInsights && !insightsLoading && (
            <span className="insights-sub">Generated from {insightsMeta ? insightsMeta.sectionCount : tableRows.length} section{(insightsMeta ? insightsMeta.sectionCount : tableRows.length) !== 1 ? 's' : ''} with waitlist history</span>
          )}
        </div>
        {insightsLoading && <JuiceLoader style={{ padding: '20px 16px' }} />}
        {insightsError && !insightsLoading && (
          <div className="err"><strong>Insights unavailable:</strong> {insightsError}</div>
        )}
        {activeInsights && !insightsLoading && (
          <div className="insights-grid">
            {activeInsights.map((ins, i) => (
              <div key={i} className={'insight-card insight-' + (ins.type || 'signal')}>
                <div className="insight-type">{ins.type || 'signal'}</div>
                <div className="insight-title">{ins.title}</div>
                <div className="insight-detail">{ins.detail}</div>
                {ins.action && <div className="insight-action">→ {ins.action}</div>}
              </div>
            ))}
          </div>
        )}
        {activeInsights && !insightsLoading && (
          <div className="insights-feedback">
            {fbSent ? (
              <span className="fb-thanks">✅ Thanks for the feedback!</span>
            ) : fbMode === 'down' ? (
              <div className="fb-down-form">
                <input
                  placeholder="What could be better?"
                  value={fbComment}
                  onChange={e => setFbComment(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && sendInsightsFeedback(0)}
                  autoFocus maxLength={500}
                />
                <button className="fb-send" onClick={() => sendInsightsFeedback(0)}>Send</button>
                <button onClick={() => setFbMode(null)}>Cancel</button>
              </div>
            ) : (
              <React.Fragment>
                <span className="fb-label">Were these insights helpful?</span>
                <button onClick={() => sendInsightsFeedback(1)} title="Yes, helpful">👍</button>
                <button onClick={() => setFbMode('down')} title="Not helpful">👎</button>
              </React.Fragment>
            )}
          </div>
        )}
      </div>

      <div className="cards">
        <div className="card">
          <div className="lbl">Waitlisted now</div>
          <div className="val amber">{fmtInt(agg.waitlisted)}</div>
          <div className="sub">people across {fmtInt(fRows.filter(r => r.waitlisted > 0).length)} sections</div>
        </div>
        <div className="card">
          <div className="lbl">Waitlist → enrolled</div>
          <div className="val green">{agg.convPct != null ? agg.convPct + '%' : '—'}</div>
          <div className="sub">{fmtInt(agg.converted)} of {fmtInt(agg.allTime)} joiners, all-time</div>
        </div>
        <div className="card">
          <div className="lbl">Unmet demand</div>
          <div className="val amber">{fmt$(agg.demand)}</div>
          <div className="sub">waitlisted × program price</div>
        </div>
        <div className="card">
          <div className="lbl">Seats claimed from the list</div>
          <div className="val">{fmtInt(agg.offersClaimed)}</div>
          <div className="sub">of {fmtInt(agg.offersSent)} offers sent · by {fmtInt(agg.claimants)} people</div>
        </div>
        <div className="card">
          <div className="lbl">Offers expired unclaimed</div>
          <div className="val amber">{fmtInt(agg.offersExpired)}</div>
          <div className="sub">links sent but never used{agg.offersOutstanding > 0 ? ' · ' + fmtInt(agg.offersOutstanding) + ' still open' : ''}</div>
        </div>
      </div>

      <div className="band">
        <div className="band-h">
          <span className="t">⏳ From waitlist to enrolled</span>
          <span className="d">the journey after someone puts their name on a waitlist — all-time, for the sections in view</span>
        </div>
        <div className="funnel">
          <div className="fstage">
            <div className="fl"><div className="n">Put their name on a list</div><div className="s">everyone who's ever joined one of these waitlists</div></div>
            <div><div className="fbar" style={{ width: Math.max(2, Math.round(agg.allTime / funnelMax * 100)) + '%', background: '#fbbf24' }}><span className="fv">{fmtInt(agg.allTime)}</span></div></div>
          </div>
          <div className="fstage">
            <div className="fl"><div className="n">Told a seat opened up</div><div className="s">people sent a link to claim an open seat</div></div>
            <div><div className="fbar" style={{ width: Math.max(2, Math.round(agg.peopleOffered / funnelMax * 100)) + '%', background: '#f59e0b' }}><span className="fv">{fmtInt(agg.peopleOffered)}</span></div></div>
          </div>
          <div className="fstage">
            <div className="fl"><div className="n">Claimed a seat</div><div className="s">people who clicked a claim link and took a spot</div></div>
            <div><div className="fbar" style={{ width: Math.max(2, Math.round(agg.claimants / funnelMax * 100)) + '%', background: '#d97706' }}><span className="fv">{fmtInt(agg.claimants)}</span></div></div>
          </div>
          <div className="fstage">
            <div className="fl"><div className="n">Enrolled in that section</div><div className="s">holds a confirmed spot there today</div></div>
            <div><div className="fbar" style={{ width: Math.max(2, Math.round(agg.converted / funnelMax * 100)) + '%', background: '#92400e' }}><span className="fv">{fmtInt(agg.converted)}</span></div></div>
          </div>
        </div>
        <div className="insight">Every count here is <b>people</b>, so the stages compare fairly. {agg.converted > agg.claimants
          ? 'Enrolled can exceed claimed-a-seat: a claim link is only one way in — seats that reopen to everyone, staff enrollments, and re-registration count too.'
          : 'People can also get in without a claim link (seats that reopen to everyone, staff enrollments), so the last two stages overlap rather than nest perfectly.'}</div>
      </div>

      <div className="twocol">
        <div className="panel">
          <div className="panel-h"><span className="t">Time to claim an open spot</span><span className="d">{fmtInt(agg.offersClaimed)} seat claims by {fmtInt(agg.claimants)} people</span></div>
          {agg.offersClaimed > 0 ? (
            <React.Fragment>
              <div className="hist">
                <div className="expiry-rule"></div><div className="expiry-tag">8h default link expiry</div>
                {buckets.map(b => (
                  <div className="hcol" key={b.k} title={fmtInt(b.v) + ' offers claimed in ' + b.k}>
                    <div className="hnum">{b.v === histMax || b.k === '48h+' ? fmtInt(b.v) : ' '}</div>
                    <div className="hbar" style={{ height: Math.max(2, Math.round(b.v / histMax * 100)) + '%' }}></div>
                    <div className="hlbl">{b.k}</div>
                  </div>
                ))}
              </div>
              {after8Pct != null && after8Pct > 40 && (
                <div className="insight"><b>{after8Pct}% of claims land after the 8-hour default expiry.</b> Either staff
                  routinely extend links or per-section windows vary — worth checking claim-window settings.</div>
              )}
            </React.Fragment>
          ) : <div className="insight">No claimed offers in the filtered sections yet.</div>}
        </div>

        <div className="panel">
          <div className="panel-h"><span className="t">What happens when a seat opens up</span><span className="d">each section's waitlist setting · {fmtInt(agg.sections)} sections in view</span></div>
          <div className="mix" role="img" aria-label={'Waitlist settings: offers go to the list ' + agg.modes['remain-active'] + '; reopens to everyone ' + agg.modes['reopen-registration'] + '; waitlist off ' + agg.modes.off + '; no waitlist set up ' + agg.modes.none}>
            {[['remain-active', '#d97706'], ['reopen-registration', '#92400e'], ['off', '#a8a29e'], ['none', '#e8e6e0']].map(([m, c]) => {
              const w = (agg.modes[m] || 0) / totalModes * 100;
              return w > 0 ? <div key={m} style={{ width: Math.max(w, 0.7) + '%', background: c }} title={(m === 'none' ? 'no waitlist set up' : MODE_LABELS[m]) + ' · ' + fmtInt(agg.modes[m]) + ' sections'}></div> : null;
            })}
          </div>
          <div className="mixleg">
            <span title={MODE_HELP['remain-active']}><span className="dot" style={{ background: '#d97706' }}></span>offers go to the list · {fmtInt(agg.modes['remain-active'])}</span>
            <span title={MODE_HELP['reopen-registration']}><span className="dot" style={{ background: '#92400e' }}></span>reopens to everyone · {fmtInt(agg.modes['reopen-registration'])}</span>
            <span title={MODE_HELP['off']}><span className="dot" style={{ background: '#a8a29e' }}></span>waitlist off · {fmtInt(agg.modes.off)}</span>
            <span title={MODE_NONE_HELP}><span className="dot" style={{ background: '#e8e6e0' }}></span>no waitlist set up · {fmtInt(agg.modes.none)}</span>
          </div>
          {agg.modes.none / totalModes > 0.3 && (
            <div className="insight"><b>{Math.round(agg.modes.none / totalModes * 100)}% of these sections have no waitlist configured.</b> A
              full section without a waitlist is invisible demand — residents hit "Full" and walk away uncounted.</div>
          )}
        </div>
      </div>

      <div className="tablecard">
        <div className="cap">
          <div className="t">Waitlist pressure by section</div>
          <div className="d">Sections with waitlist history, honoring the filters above. Pressure = waitlisted ÷ capacity. Click headers to sort.</div>
        </div>
        <div className="tbl-scroll">
          <table>
            <thead><tr>
              <Th id="program">Program / Section</Th>
              <th>Season</th><th>Status</th><th title="What happens when a seat opens up in a full section — hover a pill for details">When a seat opens</th>
              <Th id="enrolled" right>Enrolled / Cap</Th>
              <Th id="waitlisted" right>Waitlisted</Th>
              <Th id="pressure" right>Pressure</Th>
              <Th id="demand" right>Est. demand</Th>
              <th className="r">Oldest join</th>
            </tr></thead>
            <tbody>
              {tableRows.slice(0, 200).map(r => {
                const hot = (r.pressure ?? 0) >= 100;
                return (
                  <tr key={r.sectionId}>
                    <td className="name"><div className="prog">{r.program}</div>{r.section !== r.program && <div className="sec">{r.section}</div>}</td>
                    <td style={{ fontSize: 11, color: '#78716c' }}>{r.season}</td>
                    <td><span className={'statuspill ' + (r.status === 'In Progress' ? 'st-prog' : r.status === 'Upcoming' ? 'st-up' : 'st-past')}>{r.status}</span></td>
                    <td>{r.mode
                      ? <span className={'modepill' + (r.mode === 'off' ? ' off' : '')}
                              title={(MODE_HELP[r.mode] || r.mode) + (r.modeSource === 'session' ? ' Set on this section’s sessions.' : ' Set on the section.')}>
                          {MODE_LABELS[r.mode] || r.mode}
                        </span>
                      : <span className="modepill mute" title={MODE_NONE_HELP}>no waitlist set up</span>}</td>
                    <td className="r">{fmtInt(r.enrolled)} <span style={{ color: '#a8a29e' }}>/ {r.capacity != null ? fmtInt(r.capacity) : '—'}</span></td>
                    <td className="r" style={{ fontWeight: 700 }}>{fmtInt(r.waitlisted)}</td>
                    <td className="r">{r.pressure != null
                      ? <span><span className={'pressbar' + (hot ? ' hot' : '')} style={{ width: pressToBar(r.pressure) + 'px' }}></span><span className={'press ' + (hot ? 'hot' : r.pressure >= 40 ? 'warm' : '')}>{fmtInt(r.pressure)}%</span></span>
                      : '—'}</td>
                    <td className="r">{r.demand > 0 ? fmt$(r.demand) : (r.waitlisted > 0 && r.price === 0 ? 'free' : '—')}</td>
                    <td className="r" style={{ fontSize: 11, color: '#78716c' }}>{fmtD(r.oldestJoin) || '—'}</td>
                  </tr>
                );
              })}
              <tr className="totals-row">
                <td>Total ({fmtInt(tableRows.length)} sections{tableRows.length > 200 ? ', top 200 shown' : ''})</td>
                <td /><td /><td />
                <td className="r">{fmtInt(tableRows.reduce((s, r) => s + r.enrolled, 0))}</td>
                <td className="r">{fmtInt(tableRows.reduce((s, r) => s + r.waitlisted, 0))}</td>
                <td />
                <td className="r">{fmt$(tableRows.reduce((s, r) => s + r.demand, 0))}</td>
                <td />
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div className="method">
        <div className="t">How this works</div>
        <ul>
          <li><b>Waitlisted now</b> — live entries (not canceled, not deleted) on each section's waitlist; session-level waitlists roll up to their section. Scope: sections that aren't deleted, canceled, or archived.</li>
          <li><b>Waitlist → enrolled</b> — a joiner who later holds a confirmed booking in the same section, booked at/after their waitlist join.</li>
          <li><b>Offer lifecycle</b> — the platform creates a claim-link record the moment an offer goes out (that's "offers sent") and stamps the record when the link is used (that's a claim — 71% are followed within minutes by a confirmed booking in the same section; the rest are claims that didn't finish checkout). A link never used before its window closed counts as "expired unclaimed". Time-to-claim measures offer-sent → claim. Offers and claims count <i>links</i>, and one person waiting on several sessions of a program can hold several links — the funnel counts distinct <i>people</i> instead. A small slice of link records (~7%) show other activity (e.g. staff extending a window) and are counted as neither claimed nor expired.</li>
          <li><b>Est. demand</b> — waitlisted × the section's default price. An estimate: assumes everyone waiting would enroll at list price if a seat existed.</li>
          <li><b>"When a seat opens"</b> — each section's waitlist setting (Rec calls it the waitlist "mode"): <b>offers go to the list</b> (remain-active) sends waitlisted people a claim link; <b>reopens to everyone</b> (reopen-registration) makes the seat first-come-first-served; <b>waitlist off</b> / <b>no waitlist set up</b> means a full section just shows "Full". Settings can live on the section or its sessions.</li>
        </ul>
      </div>
      </React.Fragment>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
