<!doctype html>
<!--
  Throwaway Rokt sandbox probe. NOT part of the app — do not commit, do not deploy.
  Open it in your own browser, paste the Niagara Falls mParticle key, click Run.
  The key is never saved: it lives in the input box only for this tab.
  Nothing is sent about a real or made-up customer: the request carries no email
  and no order, only sandbox:"true".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rokt sandbox probe</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 24px; max-width: 900px; color: #1c1c1c; background: #fafaf9; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #555; margin-bottom: 18px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input[type=text] { width: 100%; padding: 8px; font: 13px ui-monospace, monospace; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 14px; padding: 9px 18px; font-weight: 600; border: 0; border-radius: 6px; background: #2f5d3a; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .note { font-size: 12px; color: #666; margin-top: 4px; }
  #verdict { margin-top: 18px; padding: 12px 14px; border-radius: 8px; background: #eef2ee; display: none; font-weight: 600; }
  #log { margin-top: 14px; background: #111; color: #d7e3d7; padding: 12px; border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-height: 460px; overflow: auto; }
  #rokt-slot { margin-top: 14px; min-height: 60px; border: 2px dashed #bbb; border-radius: 8px; padding: 8px; color: #999; }
</style>
</head>
<body>
<h1>Rokt sandbox probe</h1>
<div class="sub">Does Rokt return an offer with <b>no customer</b>? Sandbox only, nothing saved.</div>

<label for="key">mParticle key (Niagara Falls → Rec Admin → Ad Network)</label>
<input type="text" id="key" placeholder="us2-…" autocomplete="off" spellcheck="false">

<label for="ident">Placement identifier</label>
<input type="text" id="ident" value="RoktExperience" spellcheck="false">
<div class="note">If Rec's checkout uses a different identifier, paste it here. A wrong one usually comes back as "no placement".</div>

<button id="run">Run sandbox test</button>

<div id="verdict"></div>
<div id="rokt-slot">Embedded placement would appear here (overlays pop up on top of the page).</div>
<div id="log"></div>

<script>
(function () {
  var logEl = document.getElementById('log');
  var t0 = Date.now();
  function log(kind, parts) {
    var s = parts.map(function (p) {
      if (typeof p === 'string') return p;
      try { return JSON.stringify(p); } catch (e) { return String(p); }
    }).join(' ');
    logEl.textContent += '[' + ((Date.now() - t0) / 1000).toFixed(1) + 's] ' + kind + ' ' + s + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  ['log', 'info', 'warn', 'error'].forEach(function (m) {
    var orig = console[m];
    console[m] = function () { log(m.toUpperCase(), [].slice.call(arguments)); orig.apply(console, arguments); };
  });
  window.addEventListener('error', function (e) { log('PAGE-ERROR', [e.message]); });

  // Watch network calls to the ad hosts, so we see what came back even if nothing renders.
  var watch = /rokt|mparticle/i;
  var ofetch = window.fetch;
  window.fetch = function (u, o) {
    var url = typeof u === 'string' ? u : (u && u.url) || '';
    return ofetch.apply(this, arguments).then(function (r) {
      if (watch.test(url)) {
        log('NET', [r.status, url.split('?')[0]]);
        r.clone().text().then(function (b) { if (b) log('BODY', [b.slice(0, 1500)]); }).catch(function () {});
      }
      return r;
    });
  };
  var oopen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (m, url) {
    var x = this;
    if (watch.test(url)) x.addEventListener('loadend', function () {
      log('NET', [x.status, String(url).split('?')[0]]);
      if (x.responseText) log('BODY', [x.responseText.slice(0, 1500)]);
    });
    return oopen.apply(this, arguments);
  };

  function verdict(msg) { var v = document.getElementById('verdict'); v.style.display = 'block'; v.textContent = msg; }

  document.getElementById('run').addEventListener('click', function () {
    var key = document.getElementById('key').value.trim();
    var ident = document.getElementById('ident').value.trim() || 'RoktExperience';
    if (!/^us\d-[0-9a-f]{32}$/i.test(key)) { verdict('That does not look like an mParticle key (us2-…).'); return; }
    this.disabled = true;

    // Development mode = mParticle sandbox. Never flip this off.
    window.mParticle = { config: { isDevelopmentMode: true, logLevel: 'verbose' } };

    // Standard mParticle web snippet (v2), forced to https.
    (function(t){window.mParticle=window.mParticle||{};window.mParticle.EventType={Unknown:0,Navigation:1,Location:2,Search:3,Transaction:4,UserContent:5,UserPreference:6,Social:7,Other:8,Media:9};window.mParticle.eCommerce={Cart:{}};window.mParticle.Identity={};window.mParticle.Rokt={};window.mParticle.config=window.mParticle.config||{};window.mParticle.config.rq=[];window.mParticle.config.snippetVersion=2.7;window.mParticle.ready=function(t){window.mParticle.config.rq.push(t)};var e=["endSession","logError","logBaseEvent","logEvent","logForm","logLink","logPageView","setSessionAttribute","setAppName","setAppVersion","setOptOut","setPosition","startNewSession","startTrackingLocation","stopTrackingLocation"];var o=["setCurrencyCode","logCheckout"];var i=["identify","login","logout","modify"];e.forEach(function(t){window.mParticle[t]=n(t)});o.forEach(function(t){window.mParticle.eCommerce[t]=n(t,"eCommerce")});i.forEach(function(t){window.mParticle.Identity[t]=n(t,"Identity")});function n(e,o){return function(){if(o){e=o+"."+e}var t=Array.prototype.slice.call(arguments);t.unshift(e);window.mParticle.config.rq.push(t)}}var mp=document.createElement("script");mp.async=true;mp.src="https://jssdkcdns.mparticle.com/js/v2/"+t+"/mparticle.js?env=1";mp.onerror=function(){log('ERROR',['mParticle SDK failed to load — blocked by an ad blocker or network?'])};document.head.appendChild(mp)})(key);

    log('STEP', ['Loading mParticle SDK in development (sandbox) mode…']);
    mParticle.ready(function () {
      log('STEP', ['SDK ready. Rokt module present: ' + !!(mParticle.Rokt && mParticle.Rokt.selectPlacements)]);
      if (!mParticle.Rokt || !mParticle.Rokt.selectPlacements) {
        verdict('The SDK loaded but no Rokt module is attached to this key. Nothing to request.');
        return;
      }
      log('STEP', ['Requesting placement "' + ident + '" with NO customer (sandbox:"true" only)…']);
      var timer = setTimeout(function () {
        verdict('No answer from Rokt after 20s. Read the log below: a 4xx/empty body means no offer without a customer.');
      }, 20000);
      Promise.resolve(mParticle.Rokt.selectPlacements({
        identifier: ident,
        attributes: { sandbox: 'true' }
      })).then(function (sel) {
        clearTimeout(timer);
        log('RESULT', ['selectPlacements resolved to a selection handle (this alone does NOT mean an offer).']);
        ['PLACEMENT_READY','PLACEMENT_INTERACTIVE','PLACEMENT_FAILURE','PLACEMENT_COMPLETED','PLACEMENT_CLOSED',
         'OFFER_ENGAGEMENT','POSITIVE_ENGAGEMENT','SIGNAL_RESPONSE','UNSUPPORTED_BROWSER','NO_WIDGET_RESPONSE']
          .forEach(function (ev) {
            try { sel.on(ev).subscribe(function (e) { log('ROKT-EVENT', [ev, e && (e.body || e)]); }); } catch (x) {}
          });
        var decided = false;
        function finish(msg) { if (decided) return; decided = true; verdict(msg); }
        Promise.resolve(sel.getPlacements ? sel.getPlacements() : []).then(function (pl) {
          pl = pl || [];
          log('RESULT', ['getPlacements() count', pl.length]);
          pl.forEach(function (p, i) {
            var info = {};
            ['id','placementId','layoutType','name'].forEach(function (k) { if (p && p[k] != null) info[k] = p[k]; });
            log('RESULT', ['placement ' + i, info]);
          });
          finish(pl.length
            ? 'Rokt chose ' + pl.length + ' placement(s) with no customer. Look for an overlay or the dashed box.'
            : 'Rokt accepted the request but chose NO placements for an anonymous visitor. Nothing to show on a screen.');
        }).catch(function (e) { log('RESULT', ['getPlacements() failed', String(e && e.message || e)]); });
        setTimeout(function () { finish('No placement reported within 15s. Treat this as: no offer for an anonymous visitor.'); }, 15000);
      }).catch(function (err) {
        clearTimeout(timer);
        log('RESULT', ['selectPlacements rejected', String(err && err.message || err)]);
        verdict('Rokt refused the request: ' + String(err && err.message || err));
      });
    });
  });
})();
</script>
</body>
</html>
