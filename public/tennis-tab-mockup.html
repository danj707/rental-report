    .toolbar input[type="date"] { padding: 4px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; background: rgba(255,255,255,.1); color: #fff; font-size: 12px; font-family: inherit; }

    .sum-card .sc-val { font-size: 22px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .sum-card .sc-sub { font-size: 11px; color: #999; margin-top: 3px; }
    .sc-green { color: #16a34a; } .sc-blue { color: #2563eb; } .sc-amber { color: #d97706; } .sc-red { color: #dc2626; } .sc-purple { color: #7c3aed; } .sc-muted { color: #64748b; } .sc-indigo { color: #4f46e5; }

    .sum-legend span { display: flex; align-items: center; gap: 4px; }
    .sum-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    .section-note { font-size: 11px; color: #9ca3af; margin-top: 18px; text-align: center; }
    .cap-note { font-size: 11px; color: #1e40af; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 7px 11px; margin-top: 8px; display: flex; gap: 7px; align-items: flex-start; }

    .heatmap-label { padding: 5px 6px; font-size: 10.5px; white-space: nowrap; border-radius: 3px; background: #f1f5f9; color: #64748b; font-weight: 600; }

    .heatmap-legend { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 10px; color: #888; flex-wrap: wrap; }
    .heatmap-legend-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 3px; }

    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 8px; }

    .insight-type { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
    .insight-title { font-size: 13.5px; font-weight: 700; color: #111827; margin-bottom: 5px; line-height: 1.3; }

    .mo-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .mo-bar { width: 74%; border-radius: 3px 3px 0 0; background: linear-gradient(180deg,#3b82f6,#1d4ed8); }
    .mo-x { font-size: 8.5px; color: #9ca3af; margin-top: 3px; font-family: 'IBM Plex Mono', monospace; }

    .pm-detail .pmd-row:last-child { border-bottom: none; }
    .pm-detail .pmd-row b { color: #111827; }
  </style>

          <svg className="scene" viewBox="0 0 1200 190" preserveAspectRatio="xMidYMid slice">

              <linearGradient id="tnSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#1e3a8a" /><stop offset="60%" stopColor="#3b82f6" /><stop offset="100%" stopColor="#60a5fa" /></linearGradient>
              <linearGradient id="tnCourt" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#1d4ed8" /><stop offset="100%" stopColor="#1e40af" /></linearGradient>
              <radialGradient id="tnSun" cx="50%" cy="50%" r="50%"><stop offset="0%" stopColor="#fffbeb" /><stop offset="55%" stopColor="#fde68a" /><stop offset="100%" stopColor="#fde68a" stopOpacity="0" /></radialGradient>
              <linearGradient id="tnScrim" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#0b1220" stopOpacity="0.62" /><stop offset="55%" stopColor="#0b1220" stopOpacity="0.15" /><stop offset="100%" stopColor="#0b1220" stopOpacity="0" /></linearGradient>
            </defs>
            <rect x="0" y="0" width="1200" height="190" fill="url(#tnSky)" />
            <circle cx="840" cy="52" r="86" fill="url(#tnSun)" /><circle cx="840" cy="52" r="30" fill="#fffef6" />
            {/* perspective hard court */}
            <polygon points="470,190 730,190 1180,86 900,86" fill="url(#tnCourt)" opacity="0.96" />
            <polygon points="600,190 620,86" fill="none" />
            {/* court lines */}
            <line x1="600" y1="190" x2="765" y2="86" stroke="#dbeafe" strokeWidth="2" opacity="0.9" />
            <line x1="470" y1="190" x2="900" y2="86" stroke="#dbeafe" strokeWidth="2" opacity="0.6" />
            <line x1="730" y1="190" x2="1180" y2="86" stroke="#dbeafe" strokeWidth="2" opacity="0.6" />
            <line x1="545" y1="150" x2="980" y2="150" stroke="#dbeafe" strokeWidth="2" opacity="0.55" />
            {/* net */}
            <line x1="520" y1="126" x2="1035" y2="126" stroke="#f8fafc" strokeWidth="3" opacity="0.85" strokeDasharray="4 4" />
            {/* tennis ball (optic yellow) */}
            <circle cx="352" cy="60" r="15" fill="#d4f000" stroke="#a3b800" strokeWidth="1" />
            <path d="M340,52 Q352,66 364,52" stroke="#fff" strokeWidth="1.6" fill="none" opacity="0.9" />
            <rect x="0" y="0" width="1200" height="190" fill="url(#tnScrim)" />
          </svg>
          <div className="b-overlay">
            <div className="b-kicker">San Francisco Rec &amp; Park · real read-replica data</div>
            <div className="b-title">🎾 Tennis</div>
            <div className="b-sub">76 courts across 28 parks · 139K bookings &amp; 17.5K players a year · a private-coaching engine — the data a USTA partner wants.</div>
            <div className="b-pills">
              <span className="b-pill"><b>76</b> courts · 28 parks</span>
              <span className="b-pill"><b>{num(PLAY.reservations)}</b> bookings/yr</span>
              <span className="b-pill"><b>{num(PLAY.players)}</b> players</span>
              <span className="b-pill"><b>{money1k(LESSON.revenue)}</b> lesson revenue</span>
            </div>
          </div>
          <div className="b-badge">Real data</div>
        </div>
      );
    }

    // Leaflet map of SF tennis courts
    function CourtMap({ onSelect, selected }) {
      const ref = useRef(null), mapRef = useRef(null), lgRef = useRef(null);
      useEffect(() => {
        if (!ref.current) return;
        if (!mapRef.current) {
          mapRef.current = L.map(ref.current, { scrollWheelZoom: false });
          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '© OpenStreetMap © CARTO' }).addTo(mapRef.current);
          lgRef.current = L.layerGroup().addTo(mapRef.current);
        }
        const lg = lgRef.current; lg.clearLayers();
        const pts = [];
        LOCS.forEach(l => {
          const col = mapColor(l.rpc);
          const m = L.circleMarker([l.lat, l.lng], { radius: 6 + l.courts * 2.4, color: '#fff', weight: 1.5, fillColor: col, fillOpacity: selected === l.name ? 1 : 0.82 });
          m.bindPopup('<div style="font-weight:800;font-size:13px;color:#1e3a8a">' + l.name + '</div>' +
            '<div style="font-size:11px;color:#374151;margin-top:3px">' + l.courts + ' tennis court' + (l.courts > 1 ? 's' : '') + '</div>' +
            '<div style="font-size:11px;color:#374151">' + num(l.resv) + ' bookings / yr · ' + num(l.rpc) + ' per court</div>');
          m.on('click', () => onSelect(l.name));
          m.addTo(lg); pts.push([l.lat, l.lng]);
        });
        mapRef.current.fitBounds(pts, { padding: [30, 30] });
        setTimeout(() => mapRef.current && mapRef.current.invalidateSize(), 60);
      }, [selected]);
      return <div className="cu-map-wrap" ref={ref} />;
    }

    /* ========================= VIEWS ========================= */
    function MapView() {
      const [selected, setSelected] = useState('Dolores');
      const loc = LOCS.find(l => l.name === selected) || LOCS[0];
      const top = [...LOCS].sort((a, b) => b.rpc - a.rpc);
      return (
        <div>
          <div className="two-col">
            <div>
              <Sec title="🗺️ SF tennis courts — every location, mapped" sub="76 courts across 28 parks (real coordinates). Marker size = # courts; color = bookings per court (demand). Click a park." />
              <CourtMap onSelect={setSelected} selected={selected} />
              <div className="cu-map-legend">
                <span><span className="cu-map-dot" style={{ background: '#22c55e' }} />&lt;1,000 / court</span>
                <span><span className="cu-map-dot" style={{ background: '#f59e0b' }} />1,000–2,000</span>
                <span><span className="cu-map-dot" style={{ background: '#dc2626' }} />2,000+ (highest demand)</span>
                <span style={{ marginLeft: 'auto', color: '#9ca3af' }}>marker size = court count</span>
              </div>
            </div>
            <div>
              <Sec title="🎾 Inventory" sub="What SF has to offer." />
              <Kpis cards={[
                { label: 'Tennis courts', val: num(TOTAL_COURTS), cls: 'sc-blue', sub: 'across ' + TOTAL_LOCS + ' parks' },
                { label: 'Instant-bookable', val: pct(INSTANT_COURTS / TOTAL_COURTS * 100), cls: 'sc-green', sub: INSTANT_COURTS + ' of ' + TOTAL_COURTS + ' courts' },
              ]} />
              <div className="pm-detail">
                <h4>{loc.name}</h4>
                <div className="pmd-row"><span>Tennis courts</span><b>{loc.courts}</b></div>
                <div className="pmd-row"><span>Bookings / yr</span><b>{num(loc.resv)}</b></div>
                <div className="pmd-row"><span>Bookings per court</span><b>{num(loc.rpc)}</b></div>
                <div className="pmd-row"><span>Demand</span><b style={{ color: mapColor(loc.rpc) }}>{loc.rpc >= 2000 ? 'Very high' : loc.rpc >= 1000 ? 'Moderate' : 'Low — programmable'}</b></div>
                <div style={{ fontSize: 11, color: '#9ca3af', marginTop: 8 }}>Click any park marker on the map.</div>
              </div>
              <div style={{ fontSize: 11, color: '#6b7280', marginTop: 10 }}>Hottest: <b>Potrero Hill</b> (3,273/court), <b>Lafayette</b> (2,832). Coldest: <b>Stern Grove</b> (309), <b>Rossi</b> (424) — capacity to program.</div>
            </div>
          </div>
        </div>
      );
    }

    function DemandView() {
      // heatmap from real day × smoothed-hour marginals
      const hours = Object.keys(PLAY.hourW).map(Number);
      const dowMax = Math.max(...DOW.map(d => PLAY.dow[d]));
      const grid = hours.map(h => DOW.map(d => Math.round(PLAY.hourW[h] * (PLAY.dow[d] / dowMax) * 100)));
      const moMax = Math.max(...PLAY.months.map(m => m.v));
      return (
        <div>
          <Kpis cards={[
            { label: 'Reservations (12 mo)', val: num(PLAY.reservations), cls: 'sc-blue', sub: num(PLAY.delivered) + ' played · ' + num(PLAY.players) + ' unique players' },
            { label: 'Cancellation rate', val: pct(PLAY.cancelPct), cls: 'sc-amber', sub: num(PLAY.canceled) + ' canceled court bookings' },
            { label: 'Avg slot', val: PLAY.avgDur + ' min', cls: 'sc-muted', sub: '90-min grid · ' + pct(PLAY.instantShare) + ' instant-booked' },
            { label: 'Bookings YoY', val: (PLAY.yoy > 0 ? '+' : '') + PLAY.yoy + '%', cls: 'sc-red', sub: '⚠ verify — vs ' + num(PLAY.priorYear) + ' prior year' },
          ]} />
          <div className="two-col">
            <div>
              <Sec title="🔥 When SF plays — hour × day" sub="Derived from real day-of-week and hour-of-day booking distributions (smoothed for 90-min slot bucketing)." />
              <div className="heatmap-grid">
                <div className="heatmap-hdr" />
                {DOW.map(d => <div className="heatmap-hdr" key={d}>{d}</div>)}
                {hours.map((h, ri) => (
                  <React.Fragment key={ri}>
                    <div className="heatmap-label">{hlabel(h)}</div>
                    {grid[ri].map((v, ci) => { const c = rampPick(v, HEAT); return <div className="heatmap-cell" key={ci} style={{ background: c.bg, color: c.fg }} title={hlabel(h) + ' · ' + DOW[ci]}>{v}</div>; })}
                  </React.Fragment>
                ))}
              </div>
              <div className="heatmap-legend"><span>Quiet</span>{[10, 22, 36, 50, 66, 82].map((v, i) => <span key={i}><span className="heatmap-legend-swatch" style={{ background: rampPick(v, HEAT).bg }} /></span>)}<span>Packed</span></div>
              <div style={{ fontSize: 12, color: '#6b7280', marginTop: 8 }}>Weekends carry <b>39%</b> of play (Fri–Sun = 54%); the <b>6pm</b> after-work slot is the single busiest hour. Mornings 9–10a and midday 12–4p are the steady base.</div>
            </div>
            <div>
              <Sec title="📈 Seasonality" sub="Bookings by month — late-summer peak, winter trough." />
              <div className="mo-curve">
                {PLAY.months.map((m, i) => (
                  <div className="mo-col" key={i} title={m.m + ': ' + num(m.v)}>
                    <div className="mo-bar" style={{ height: (m.v / moMax * 100) + '%' }} />
                    <div className="mo-x">{m.m}</div>
                  </div>
                ))}
              </div>
              <Sec title="🎾 Booking types" sub="How tennis water time is used." />
              <div className="sum-bar-wrap">
                <div className="sum-bar">
                  {PLAY.typeMix.map((t, i) => { const tot = PLAY.typeMix.reduce((s, x) => s + x.val, 0); return <div className="seg" key={i} style={{ width: (t.val / tot * 100) + '%', background: t.color, color: i === 1 ? '#1a2e05' : '#fff' }}>{Math.round(t.val / tot * 100) + '%'}</div>; })}
                </div>
                <div className="sum-legend">{PLAY.typeMix.map((t, i) => <span key={i}><span className="sum-dot" style={{ background: t.color }} />{t.label} ({num(t.val)})</span>)}</div>
              </div>
              <CapNote>It's a court-booking model — a reservation is one court held by one party, so <b>singles vs. doubles isn't distinguishable</b>, and there's no <b>league/class</b> booking type recorded for tennis (both are USTA-integration opportunities).</CapNote>
            </div>
          </div>
        </div>
      );
    }

    function LessonsView() {
      const maxDel = Math.max(...LESSON.top.map(t => t.del));
      const moMax = Math.max(...LESSON.months.map(m => m.v));
      return (
        <div>
          <Kpis cards={[
            { label: 'Lessons delivered', val: num(LESSON.delivered), cls: 'sc-blue', sub: num(LESSON.booked) + ' booked · trailing 12 mo' },
            { label: 'Realized revenue', val: money1k(LESSON.revenue), cls: 'sc-green', sub: money(LESSON.avgPrice) + ' avg lesson' },
            { label: 'Delivered YoY', val: '+' + LESSON.yoyDelivered + '%', cls: 'sc-green', sub: 'booked +' + LESSON.yoyBooked + '% — coaching is surging' },
            { label: 'Instructors', val: num(LESSON.instructors), cls: 'sc-indigo', sub: 'taught · ' + LESSON.eligible + ' eligible org-wide' },
            { label: 'Students', val: num(LESSON.students), cls: 'sc-purple', sub: '~' + LESSON.repeat + ' lessons each (repeat)' },
            { label: 'Cancellation', val: pct(LESSON.cancelPct), cls: 'sc-amber', sub: 'mostly unfilled availability slots' },
          ]} />
          <div className="two-col even">
            <div>
              <Sec title="🏆 Top coaches" sub="By lessons booked (delivered in parens). Anonymized — no PII exposed." />
              <div className="cu-bars">
                {LESSON.top.map((t, i) => (
                  <div className="cu-bar-row" key={i}>
                    <div className="cu-bar-name">Instructor {t.id}</div>
                    <div className="cu-bar-track"><div className="cu-bar-seg" style={{ width: (t.del / maxDel * 100) + '%', background: 'linear-gradient(90deg,#3b82f6,#1d4ed8)' }} /></div>
                    <div><div className="cu-bar-val">{t.del} <span style={{ color: '#9ca3af', fontWeight: 400 }}>/ {t.booked}</span></div><div className="cu-bar-sub">{money(t.avg)} avg</div></div>
                  </div>
                ))}
              </div>
              <CapNote>SF doesn't populate the <b>pro / contractor</b> flag on instructors (all false) and every lesson is tagged skill-level "<b>all</b>" — so no pro-vs-contractor or NTRP breakout is possible today. Capturing instructor type + swimmer level would unlock coaching-quality analytics.</CapNote>
            </div>
            <div>
              <Sec title="📈 Lessons delivered by month" sub="Steady demand year-round; spring/summer strongest." />
              <div className="mo-curve">
                {LESSON.months.map((m, i) => (
                  <div className="mo-col" key={i} title={m.m + ': ' + num(m.v)}>
                    <div className="mo-bar" style={{ height: (m.v / moMax * 100) + '%', background: 'linear-gradient(180deg,#a3e635,#65a30d)' }} />
                    <div className="mo-x">{m.m}</div>
                  </div>
                ))}
              </div>
              <div style={{ marginTop: 14, background: '#f0fdf4', border: '1px solid #bbf7d0', borderRadius: 8, padding: '11px 14px' }}>
                <div style={{ fontSize: 12, color: '#166534' }}><b>Private coaching is the growth story.</b> Delivered lessons nearly doubled year-over-year (+{LESSON.yoyDelivered}%) to {money1k(LESSON.revenue)} — even as open-court bookings dipped. Only {PRIVATE_COURTS} of {TOTAL_COURTS} courts are lesson-enabled, so there's headroom to expand coaching to more sites.</div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function UstaView() {
      return (
        <div>
          <Sec title="🏆 USTA partnership snapshot" sub="The public-tennis data a national partner wants: supply, participation, growth, coaching, and access." />
          <Kpis cards={[
            { label: 'Public courts', val: num(TOTAL_COURTS), cls: 'sc-blue', sub: TOTAL_LOCS + ' parks citywide' },
            { label: 'Annual participation', val: num(PLAY.players), cls: 'sc-green', sub: 'unique players · ' + num(PLAY.reservations) + ' bookings' },
            { label: 'Coaching pipeline', val: num(LESSON.students), cls: 'sc-indigo', sub: LESSON.instructors + ' instructors · ' + num(LESSON.delivered) + ' lessons' },
            { label: 'Free/low-cost access', val: pct(INSTANT_COURTS / TOTAL_COURTS * 100), cls: 'sc-green', sub: 'courts instantly self-bookable online' },
          ]} />
          <div className="two-col even">
            <div>
              <Sec title="🌉 Court access across the city" sub="Courts per park — the geographic supply a USTA facility-investment case is built on." />
              <div className="cu-bars">
                {[...LOCS].sort((a, b) => b.courts - a.courts).slice(0, 12).map((l, i) => (
                  <div className="cu-bar-row" key={i}>
                    <div className="cu-bar-name">{l.name}</div>
                    <div className="cu-bar-track"><div className="cu-bar-seg" style={{ width: (l.courts / 6 * 100) + '%', background: mapColor(l.rpc) }} /></div>
                    <div><div className="cu-bar-val">{l.courts} ct</div><div className="cu-bar-sub">{num(l.rpc)}/ct</div></div>
                  </div>
                ))}
              </div>
            </div>
            <div>
              <Sec title="📋 What USTA would want next" sub="The gaps in today's data — each a partnership build-out." />
              <table className="g-table">
                <thead><tr><th>Signal</th><th>Status today</th></tr></thead>
                <tbody>
                  <tr><td>Court supply &amp; geo access</td><td><span className="pill pill-green">Have it</span> 76 courts / 28 parks, mapped</td></tr>
                  <tr><td>Participation &amp; frequency</td><td><span className="pill pill-green">Have it</span> {num(PLAY.players)} players</td></tr>
                  <tr><td>Private coaching pipeline</td><td><span className="pill pill-green">Have it</span> +{LESSON.yoyDelivered}% YoY</td></tr>
                  <tr><td>League / team play</td><td><span className="pill pill-amber">Gap</span> no league booking type yet</td></tr>
                  <tr><td>NTRP / skill ratings</td><td><span className="pill pill-amber">Gap</span> level always "all"</td></tr>
                  <tr><td>Player demographics (age/geo)</td><td><span className="pill pill-amber">Gap</span> needs profile join / capture</td></tr>
                </tbody>
              </table>
              <CapNote>Adding league play, NTRP levels, and a demographic-reach join would make this a full USTA-grade dataset — and directly power junior-development and access-equity programs.</CapNote>
            </div>
          </div>
        </div>
      );
    }

    /* ========================= APP ========================= */
    function TennisApp() {
      const [tab, setTab] = useState('map');
      const heroKpis = [
        { label: 'Tennis courts', val: num(TOTAL_COURTS), cls: 'sc-blue', sub: 'across ' + TOTAL_LOCS + ' SF parks' },
        { label: 'Reservations (12 mo)', val: num(PLAY.reservations), cls: 'sc-blue', sub: num(PLAY.players) + ' unique players' },
        { label: 'Cancellation rate', val: pct(PLAY.cancelPct), cls: 'sc-amber', sub: 'court bookings' },
        { label: 'Private-lesson revenue', val: money1k(LESSON.revenue), cls: 'sc-green', sub: num(LESSON.delivered) + ' lessons delivered' },
        { label: 'Lessons YoY', val: '+' + LESSON.yoyDelivered + '%', cls: 'sc-green', sub: 'delivered · coaching surging' },
        { label: 'Court bookings YoY', val: PLAY.yoy + '%', cls: 'sc-red', sub: '⚠ verify vs data-model change' },
      ];
      const tabs = [
        { key: 'map', label: '🗺️ Courts & Map' },
        { key: 'demand', label: '🔥 Play & Demand' },
        { key: 'lessons', label: '🎓 Private Lessons' },
        { key: 'usta', label: '🏆 USTA Snapshot' },
      ];
      return (
        <div className="page">
          <div className="report-header">
            <div><div className="org-label">San Francisco Rec &amp; Park</div><div className="title">Facilities · Tennis</div></div>
            <div className="date-range">Trailing 365 days · through Jul 24, 2026</div>
          </div>
          <div className="real-ribbon">
            <strong>Real data — San Francisco Rec &amp; Park.</strong> Every figure was data-mined live from the Rec production read-replica (trailing 365 days). This is a design study of the Tennis report layout; the numbers are real. A few fields aren't captured yet (league play, NTRP levels, player demographics) — flagged inline as USTA build-outs, not faked.
          </div>

          <TennisBanner />
          <Kpis cards={heroKpis} />

          <div className="g-tabs">
            {tabs.map(t => <button key={t.key} className={'g-tab' + (t.key === tab ? ' active' : '')} onClick={() => setTab(t.key)}>{t.label}</button>)}
          </div>

          {tab === 'map' && <MapView />}
          {tab === 'demand' && <DemandView />}
          {tab === 'lessons' && <LessonsView />}
          {tab === 'usta' && <UstaView />}

          <Sec title="🎾 Rec Insights" sub="Auto-generated from the reservation, court & instructor data — framed around revenue upside and access." />
          <Insights items={[
            { type: 'opportunity', title: 'Private coaching is the revenue engine — feed it', detail: 'Delivered lessons nearly doubled YoY (+' + LESSON.yoyDelivered + '%) to ' + money1k(LESSON.revenue) + ', yet only ' + PRIVATE_COURTS + ' of ' + TOTAL_COURTS + ' courts allow lessons and ~811 students repeat ~' + LESSON.repeat + '×. Enable lessons at more high-traffic parks and recruit instructors.', action: 'Turn on private lessons at Moscone/Alice Marble/Potrero; add a lesson-package + promo' },
            { type: 'opportunity', title: 'Cold courts are programmable inventory', detail: 'Stern Grove (309/court), Rossi (424) and Buena Vista (673) sit far below the ~1,560 citywide average — idle public capacity that clinics, beginner leagues, or junior programs could fill without new construction.', action: 'Stand up beginner clinics / junior programs at the coldest parks' },
            { type: 'signal', title: 'Access gap: who is NOT on the court?', detail: 'Courts cluster in the north/east; outer-southwest parks (Parkside, Minnie & Lovie Ward) run cooler. A demographic-reach join (age/gender/neighborhood vs. citywide) would reveal which residents the public courts are — and are not — reaching.', action: 'Add a player demographic-reach view; target outreach + subsidized coaching in under-served ZIPs' },
            { type: 'risk', title: 'Court bookings down ~32% YoY — verify before reporting', detail: 'Open-court reservations fell from ' + num(PLAY.priorYear) + ' to ' + num(PLAY.reservations) + '. That is large enough to be a reservation-model / migration artifact rather than a true demand drop — confirm before it goes to a partner.', action: 'Validate the YoY drop against a known-good month before external use' },
            { type: 'signal', title: '20% of court bookings cancel', detail: PLAY.cancelPct + '% of court reservations are canceled — on high-demand courts that is turned-away play. A hold/deposit or shorter cancellation window on prime evening/weekend slots would recover capacity.', action: 'Pilot a no-show policy on 5–8pm & weekend prime slots' },
          ]} />

          <div className="section-note">Tennis · San Francisco Rec &amp; Park · real read-replica data (trailing 365 days). Layout study for a Tennis report — built to wire into the Facilities hub. Gaps (league, NTRP, demographics) flagged as USTA build-outs.</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<TennisApp />);
  </script>
</body>
</html>
