<html lang="en">
<head>

<title>Instructor Lessons</title>

<style>
  * { box-sizing: border-box; }
  body { background: #faf9f7; color: #1c1917; margin: 0; padding: 0 0 60px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  .toolbar { position: sticky; top: var(--rec-banner-h, 0px); z-index: 100; display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: #2c2c2c; color: #eee; font-size: 13px; flex-wrap: wrap; }

  .report-header-left { display:flex; align-items:center; gap:14px; }

  .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }

  .insights-btn { position: relative; overflow: visible; box-shadow: 0 2px 12px rgba(99,102,241,.3); }
  .insights-btn:hover:not(:disabled) { background: linear-gradient(135deg, #4f46e5, #7c3aed); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,.4); filter: none; }
  .insights-btn .sparkle { position: absolute; pointer-events: none; font-size: 10px; opacity: 0; animation: sparkle-float 2.5s ease-in-out infinite; }

       is the report treatment built from them. Linked AFTER this page's own

       joins the layer by adding these two lines rather than by having its own
       copy of the card treatment surgically removed. Only page rules that are
       MORE specific (an accent bar, a value colour) are deleted. -->
  <link rel="stylesheet" href="/recess-tokens.css">

<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const fmtMoney = (n) => "$" + Math.round(n || 0).toLocaleString();
const fmtNum = (n) => (n == null ? "—" : Math.round(n).toLocaleString());
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const RAMP = ["#f5f4f1","#cde2fb","#9ec5f4","#5598e7","#2a78d6","#1c5cab"];

// ── Acquisition and Retention tabs ────────────────────────────────────
//
// The three tabs and the resolver live at MODULE SCOPE, not inside App,
// so a spec can LIFT AND RUN lsEffectiveTab rather than regex over it —
// a regex passes on an inverted comparison, which is the whole reason
// nightStateFrom was pulled out of its callback.
const LS_TABS = ["overview", "acquisition", "retention"];
const LS_TAB_LABEL = { overview: "📊 Overview", acquisition: "🚪 Acquisition", retention: "🔁 Retention & LTV" };

// An unrecognised ?tab= resolves to the tab the page opens on rather than
// rendering nothing. A link somebody was handed must not land on a blank
// body with no lit tab — the facEffectiveTab rule.
function lsEffectiveTab(want) {
  return LS_TABS.indexOf(String(want || "")) >= 0 ? String(want) : "overview";
}

const lsPct = (n) => (n == null ? "—" : (Math.round(n * 10) / 10) + "%");
// Month label from the card's own YYYY-MM text. new Date("2026-08") is
// UTC midnight and renders as July west of UTC; five instances of that
// are already recorded in this repo.
function lsMonthLabel(mk, withYear) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(mk || ""));
  if (!m) return String(mk || "");
  return MONTHS[+m[2] - 1] + (withYear ? " " + m[1].slice(2) : "");
}

// A card that has no public link yet and a card that answered with no
// rows are DIFFERENT FACTS. The first says so and names the remedy; the
// second is a real empty state. Rendering a confident 0% funnel for the
// first would tell an org its instructors answer nobody.
function LsUnwired({ what, reason }) {
  return (
    <div className="ls-unwired">
      <b>{reason === "error" ? what + " could not be loaded" : what + " is not wired up yet"}</b>
      {reason === "error"
        ? "The card answered with an error. The other tab is unaffected — they are separate cards on purpose."
        : "The Metabase card exists and is verified; it needs a public link, and the environment variable that holds it, before this tab can draw. Nothing else has to change."}
    </div>
  );
}

function AcqTab({ a, instructor }) {
  if (!a || !a.ok) return <LsUnwired what="The acquisition funnel" reason={a && a.reason} />;
  const t = a.totals;
  const S = a.byStatus || {};
  const row = (k) => S[k] || { n: 0, booked30: 0, bookedSame30: 0 };
  const acc = row("ACCEPTED"), pend = row("PENDING"), rej = row("REJECTED"), can = row("CANCELED");
  const max = Math.max(1, t.inquiries);
  const mon = (a.monthly || []).slice(-14);
  const monMax = Math.max(1, ...mon.map(m => m.n));
  const rows = [
    ["Answered — instructor accepted", acc, "#0f766e"],
    ["Declined by instructor", rej, "#94a3b8"],
    ["Withdrawn by the customer", can, "#b9b2aa"],
    ["Never answered", pend, "#c2700a"],
  ];
  return (
    <div>
      <div className="cards" data-ls-inq={t.inquiries}>
        <div className="card"><div className="lbl">Inquiries sent</div><div className="val">{fmtNum(t.inquiries)}</div><div className="sub">customers messaging an instructor</div></div>
        <div className="card"><div className="lbl">Answered</div><div className="val">{fmtNum(t.accepted)}</div><div className="sub">{lsPct(t.acceptedPct)} of inquiries</div></div>
        <div className="card flag" data-ls-never={t.pending}><div className="lbl">Never answered</div><div className="val">{fmtNum(t.pending)}</div><div className="sub">{lsPct(t.neverAnsweredPct)} — no reply, ever</div></div>
        <div className="card"><div className="lbl">Answered → booked</div><div className="val">{lsPct(t.acceptedBooked30Pct)}</div><div className="sub">within 30 days</div></div>
        <div className="card"><div className="lbl">Ignored → booked</div><div className="val">{lsPct(t.pendingBooked30Pct)}</div><div className="sub">within 30 days</div></div>
      </div>

      <div className="two-col w">
        <div className="panel">
          <div className="panel-h">Inquiry funnel — what happens after someone messages an instructor</div>
          <div className="fbar">
            {rows.map(([label, r, col]) => r.n > 0 && (
              <div key={label} style={{ flex: r.n, background: col }}>{r.n >= max * 0.08 ? fmtNum(r.n) : ""}</div>
            ))}
          </div>
          <table className="mini" style={{ marginTop: 12 }}>
            <thead><tr><th>Outcome</th><th className="r">Inquiries</th><th className="r">Share</th><th className="r">Booked a lesson ≤30 days</th></tr></thead>
            <tbody>
              {rows.map(([label, r, col]) => {
                const pct = t.inquiries ? Math.round(r.n / t.inquiries * 1000) / 10 : 0;
                const cv = r.n ? Math.round(r.booked30 / r.n * 1000) / 10 : null;
                return (
                  <tr key={label}>
                    <td className="b"><span className="dot" style={{ background: col }}></span>{label}</td>
                    <td className="r">{fmtNum(r.n)}</td>
                    <td className="r">{pct}%</td>
                    <td className="r"><span className="conv">
                      <span className="tr"><i style={{ width: Math.min(100, cv || 0) + "%", background: col }}></i></span>
                      <b>{lsPct(cv)}</b></span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="panel-note">
            {t.liftGap != null ? (
              <span><b>An answered inquiry converts better than an ignored one</b> — {lsPct(t.acceptedBooked30Pct)} against {lsPct(t.pendingBooked30Pct)}.
              Close that gap on the {fmtNum(t.pending)} never answered and roughly <b>{fmtNum(t.liftGap)} more inquiries</b> in this window turn into lessons.</span>
            ) : <span>Not enough answered inquiries in this window to compare the two rates.</span>}
            {" "}Treat it as an upper bound, not a controlled test: instructors choose which requests to accept, so this compares two self-selected groups.
          </div>
        </div>

        <div className="panel">
          <div className="panel-h">Who creates the booking</div>
          <div className="panel-note" style={{ marginTop: 0 }}>
            The other front door. A reader who never messages anybody just books a published slot — see the Retention tab for the channel split, which comes off the same bookings.
          </div>
          <table className="mini" style={{ marginTop: 10 }}>
            <tbody>
              <tr><td className="b">Asked with the instructor they messaged</td><td className="r">{fmtNum(acc.bookedSame30 + pend.bookedSame30 + rej.bookedSame30 + can.bookedSame30)}</td></tr>
              <tr><td className="b">Already a lesson customer when they asked</td><td className="r">{fmtNum((S.ACCEPTED || {}).prior + (S.PENDING || {}).prior + (S.REJECTED || {}).prior + (S.CANCELED || {}).prior || 0)}</td></tr>
            </tbody>
          </table>
          <div className="panel-note">
            {instructor
              ? <span>Scoped to <b>{instructor}</b>: “with the instructor they messaged” means with them specifically.</span>
              : <span>“With the instructor they messaged” is the stricter test — a booking with anyone else still counts in the funnel above.</span>}
          </div>
        </div>
      </div>

      {mon.length > 1 && (
        <div className="panel" style={{ marginTop: 14 }}>
          <div className="panel-h">Reply rate over time — share of inquiries answered vs never answered</div>
          <div className="twocols" data-ls-months={mon.length}>
            {mon.map(m => {
              const never = m.n ? m.pending / m.n : 0;
              const ans = m.n ? m.answered / m.n : 0;
              return (
                <div className="tc" key={m.month}>
                  <div className="t">{Math.round(never * 100)}%</div>
                  <div className="p" style={{ height: (never * 100) + "%" }}></div>
                  <div className="q" style={{ height: (ans * 100) + "%" }}></div>
                </div>
              );
            })}
          </div>
          <div className="col-lbls">{mon.map(m => <span key={m.month}>{lsMonthLabel(m.month)}</span>)}</div>
          <div className="legend">
            <span><span className="dot" style={{ background: "#c2700a" }}></span>Never answered</span>
            <span><span className="dot" style={{ background: "#0f766e" }}></span>Answered (accepted or declined)</span>
          </div>
          <div className="panel-note">All-time from the card, not the toolbar window — a reply rate is only readable as a trend, and one month would draw one bar. The current month is still filling in.</div>
        </div>
      )}
    </div>
  );
}

function RetTab({ r, instructor, start, end }) {
  const [cac, setCac] = useState(50);
  if (!r || !r.ok) return <LsUnwired what="Retention and LTV" reason={r && r.reason} />;
  const t = r.totals;
  const mon = (r.monthly || []).slice(-14);
  const monMax = Math.max(1, ...mon.map(m => m.customers));
  const cohorts = (r.cohorts || []).slice(-12);
  const ch = r.channel || {};
  const chTotal = (ch.self || 0) + (ch.instructor || 0) + (ch.staff || 0) + (ch.other || 0) + (ch.unknown || 0);
  const ratio = (cac > 0 && t.meanLtv != null) ? (t.meanLtv / cac) : null;
  const shade = (p) => p == null ? "#f5f4f1"
    : p >= 30 ? "#2a78d6" : p >= 22 ? "#5598e7" : p >= 15 ? "#9ec5f4" : p >= 8 ? "#cde2fb" : "#eaf2fb";

  return (
    <div>
      <div className="ls-scope">
        <b>All-time, and deliberately so.</b> A lifetime value is a position, not a flow — it is what a customer has been worth to date, whatever the toolbar says.
        The date range above still moves the Overview tab and the two windowed figures below.
        {instructor && <span> Scoped to <b>{instructor}</b>, so “customer”, “LTV” and “new” all mean <b>with this instructor</b> — somebody on their second lesson with the department but their first with {instructor} counts as new here.</span>}
      </div>

      <div className="cards" style={{ marginTop: 12 }} data-ls-customers={t.customers}>
        <div className="card"><div className="lbl">Lesson customers</div><div className="val">{fmtNum(t.customers)}</div><div className="sub">{fmtNum(t.live)} lessons all-time</div></div>
        <div className="card"><div className="lbl">Average LTV</div><div className="val">{t.meanLtv == null ? "—" : fmtMoney(t.meanLtv)}</div><div className="sub">median {t.medianLtv == null ? "—" : fmtMoney(t.medianLtv)} · p90 {t.p90Ltv == null ? "—" : fmtMoney(t.p90Ltv)}</div></div>
        <div className="card"><div className="lbl">Come back at least once</div><div className="val">{lsPct(t.repeatPct)}</div><div className="sub">{fmtNum(t.repeat)} of {fmtNum(t.customers)} customers</div></div>
        <div className="card"><div className="lbl">Lessons per customer</div><div className="val">{t.meanLessons == null ? "—" : t.meanLessons}</div><div className="sub">median {fmtNum(t.medianLessons)} · {fmtNum(t.fivePlus)} take 5+</div></div>
        <div className="card"><div className="lbl">Net lesson revenue</div><div className="val">{fmtMoney(t.net)}</div><div className="sub">all-time, after refunds</div></div>
      </div>

      <div className="two-col w">
        <div className="panel">
          <div className="panel-h">New vs returning customers each month</div>
          <div className="stackcols" data-ls-retmonths={mon.length}>
            {mon.map(m => (
              <div className="sc" key={m.month} title={m.month + ": " + m.newCust + " new, " + m.returningCust + " returning"}>
                <div className="a" style={{ height: (m.newCust / monMax * 100) + "%" }}></div>
                <div className="b" style={{ height: (m.returningCust / monMax * 100) + "%" }}></div>
              </div>
            ))}
          </div>
          <div className="col-lbls">{mon.map(m => <span key={m.month}>{lsMonthLabel(m.month)}</span>)}</div>
          <div className="legend">
            <span><span className="dot" style={{ background: "#2a78d6" }}></span>New</span>
            <span><span className="dot" style={{ background: "#0f766e" }}></span>Returning</span>
          </div>
          <div className="panel-note">
            {t.windowReturningNetPct != null
              ? <span><b>Returning customers are {lsPct(t.windowReturningNetPct)} of the money taken in the toolbar window</b> — {fmtMoney(t.windowNet)} across {fmtNum(t.windowBookings)} lessons. Retention, not acquisition, is what carries a quiet month.</span>
              : <span>No lessons in the toolbar window, so the returning share of revenue cannot be stated for it.</span>}
          </div>
        </div>

        <div className="panel">
          <div className="panel-h">The second lesson is the whole business</div>
          <div className="half2">
            <div className="halfbox one"><div className="hl">One and done</div><div className="hv">{fmtNum(t.oneAndDone)}</div>
              <div className="hs">{lsPct(t.customers ? 100 - t.repeatPct : null)} of customers<br />{t.meanLtvOnce == null ? "—" : fmtMoney(t.meanLtvOnce)} average LTV</div></div>
            <div className="halfbox rep"><div className="hl">Came back</div><div className="hv">{fmtNum(t.repeat)}</div>
              <div className="hs">{lsPct(t.repeatPct)} of customers<br />{t.meanLtvRepeat == null ? "—" : fmtMoney(t.meanLtvRepeat)} average LTV</div></div>
          </div>
          <div className="panel-note">
            {(t.meanLtvRepeat != null && t.meanLtvOnce > 0)
              ? <span>A customer who books a second lesson is worth <b>{Math.round(t.meanLtvRepeat / t.meanLtvOnce * 10) / 10}x one who does not</b> — {fmtMoney(t.meanLtvRepeat - t.meanLtvOnce)} more, on average, over the rest of their life with the department.</span>
              : <span>Not enough of both kinds of customer here to compare the two lifetimes.</span>}
          </div>
        </div>
      </div>

      <div className="two-col">
        <div className="panel">
          <div className="panel-h">When the second lesson happens</div>
          {t.secondTotal > 0 ? (
            <div>
              {[["Within 30 days", t.secondWithin30], ["Within 60 days", t.secondWithin60], ["Within 90 days", t.secondWithin90],
                ["Later than 90 days", t.secondTotal - t.secondWithin90]].map(([lab, n], i) => (
                <div className="meter" key={lab}>
                  <div className="mh"><span>{lab}</span><b>{fmtNum(n)} · {Math.round(n / t.secondTotal * 100)}%</b></div>
                  <div className="track"><div style={{ width: (n / t.secondTotal * 100) + "%", height: "100%", background: i === 3 ? "#94a3b8" : "#0f766e", borderRadius: 4 }}></div></div>
                </div>
              ))}
              <div className="panel-note">
                Median gap is <b>{t.medianDaysToSecond} days</b>. A first-time customer who has not rebooked by <b>day 30</b> is unlikely to — that is where a win-back nudge belongs, not at day 90.
              </div>
            </div>
          ) : <div className="panel-note" style={{ marginTop: 0 }}>Nobody has booked a second lesson in this scope yet, so there is no gap to measure.</div>}
        </div>

        <div className="panel">
          <div className="panel-h">Who creates the booking</div>
          <table className="mini">
            <thead><tr><th>Created by</th><th className="r">Bookings</th><th className="r">Share</th></tr></thead>
            <tbody>
              {[["The customer — instant book", ch.self, "#2a78d6"],
                ["Park staff, on their behalf", ch.staff, "#94a3b8"],
                ["The instructor, on their behalf", ch.instructor, "#e8e6e0"]].map(([lab, n, col]) => (
                <tr key={lab}><td className="b"><span className="dot" style={{ background: col }}></span>{lab}</td>
                  <td className="r">{fmtNum(n || 0)}</td>
                  <td className="r">{chTotal ? Math.round((n || 0) / chTotal * 1000) / 10 : 0}%</td></tr>
              ))}
              <tr><td className="b" style={{ color: "#a8a29e" }}>of which fast-tracked</td><td className="r">{fmtNum(ch.fastTrack || 0)}</td>
                <td className="r">{chTotal ? Math.round((ch.fastTrack || 0) / chTotal * 1000) / 10 : 0}%</td></tr>
            </tbody>
          </table>
          <div className="panel-note">
            “Instructor booked” is shown even at zero: instructors book the COURT as a facility reservation, not the customer's lesson, so it is a real channel nobody uses. A row that appears is a row somebody can watch.
          </div>
        </div>
      </div>

      {cohorts.length > 0 && (
        <div className="panel" style={{ marginTop: 14 }}>
          <div className="panel-h">Cohort retention — share of each month's new customers still booking</div>
          <div style={{ overflowX: "auto" }}>
            <table className="coh">
              <thead><tr><th style={{ textAlign: "left" }}>First lesson</th><th>New</th>
                {[1, 2, 3, 4, 5, 6].map(i => <th key={i}>+{i}</th>)}</tr></thead>
              <tbody>
                {cohorts.map(c => (
                  <tr key={c.cohort}>
                    <td className="rowh">{lsMonthLabel(c.cohort, true)}</td>
                    <td className="n">{fmtNum(c.size)}</td>
                    {[1, 2, 3, 4, 5, 6].map(i => {
                      // A month that has not happened yet is HATCHED, never
                      // drawn as zero — a zero reads as a collapse rather
                      // than as a month nobody has lived through.
                      const lived = (() => {
                        const [y, m] = c.cohort.split("-").map(Number);
                        const tot = y * 12 + (m - 1) + i;
                        const now = new Date();
                        return tot <= now.getFullYear() * 12 + now.getMonth();
                      })();
                      if (!lived) return <td className="c void" key={i}></td>;
                      const n = c.months[i] || 0;
                      const p = c.size ? Math.round(n / c.size * 100) : 0;
                      return <td className="c" key={i} style={{ background: shade(p), color: p >= 30 ? "#fff" : "#1c1917" }}>{p}%</td>;
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="panel-note">Hatched cells are months that have not happened yet. Month 0 is every customer by definition and is shown as the cohort size instead.</div>
        </div>
      )}

      <div className="panel" style={{ marginTop: 14 }}>
        <div className="panel-h">LTV / CAC</div>
        <div className="cacrow">
          <label htmlFor="lsCac">Cost to acquire a customer
            <input id="lsCac" type="number" min="1" step="5" value={cac} onChange={e => setCac(Number(e.target.value))} />
          </label>
          <div>
            <div className="cacout" data-ls-ratio={ratio == null ? "" : Math.round(ratio * 10) / 10}>
              {ratio == null ? "—" : (Math.round(ratio * 10) / 10) + "x"}
            </div>
            <div className="tiny">LTV / CAC against an average LTV of {t.meanLtv == null ? "—" : fmtMoney(t.meanLtv)}</div>
          </div>
        </div>
        <div className="panel-note">
          <b>CAC is not in the platform, so this is the one number the report asks you for.</b> There is no ad spend, campaign cost or attribution table in Rec, and this org's outbound messages carry no recorded cost — so rather than invent a figure the tab takes it as an input and computes the ratio against a measured LTV. Worth knowing before you pick one: the marginal cost of answering an inquiry is close to zero, which is why the Acquisition tab leads with the ones nobody answered.
        </div>
      </div>
    </div>
  );
}

function App() {
  const cfg = window.ORG_CONFIG || {};
  const slug = cfg.slug || "";
  const orgName = cfg.displayName || slug;
  const token = cfg.token || "";
  const QS = new URLSearchParams(window.location.search);
  const isPrint = QS.get("_print") === "1";

  const today = new Date().toISOString().slice(0, 10);
  const [start, setStart] = useState(QS.get("start_date") || "2025-01-01");
  const [end, setEnd] = useState(QS.get("end_date") || today);
  const [data, setData] = useState(null);
  const [state, setState] = useState("loading");
  const [errMsg, setErrMsg] = useState("");
  const [pdfLoading, setPdfLoading] = useState(false);
  // AI insights are opt-in: generated on click, and only present in an export
  // when the user generated them (?insights=1 carries that into print mode).
  const [insights, setInsights] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);
  const wantInsights = QS.get("insights") === "1";

  // Tab + instructor both ride the URL so a link, the share link and the
  // print/PDF render all land where the sender was looking. An unknown
  // tab resolves to Overview rather than rendering nothing.
  const [tab, setTab] = useState(() => lsEffectiveTab(QS.get("tab")));
  const [instructor, setInstructor] = useState(QS.get("instructor") || "");
  const [funnel, setFunnel] = useState(null);
  const [funnelState, setFunnelState] = useState("idle");

  const withToken = (url) => token ? url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token) : url;

  const load = useCallback((s, e2) => {
    const sd = s || start, ed = e2 || end;
    setState("loading"); setInsights(null);
    const instrQS = instructor ? "&instructor=" + encodeURIComponent(instructor) : "";
    // THE STATUS IS CHECKED BEFORE THE BODY IS PARSED, and that is not
    // tidiness. Dan hit this on production: the instructor-payout card went
    // past Railway's EDGE timeout, the edge answered with the plain text
    // "upstream error", and a bare r.json() threw a PARSER message at the
    // reader — `Unexpected token 'u', "upstream error" is not valid JSON` —
    // on a page whose own route had a remedy to offer. reportFetchError
    // reads the body only when it can, so an edge failure degrades to the
    // status and the 5xx branch says what to try. Same fix the 2026-09-04
    // and 2026-09-12 sweeps applied to seventeen other call sites; this
    // page was written afterwards and never had it.
    fetch(withToken("/" + slug + "/lessons/api/data?start_date=" + sd + "&end_date=" + ed + instrQS))
      .then(async r => { if (!r.ok) throw await reportFetchError(r); return r.json(); })
      .then(j => { if (!j.ok) throw new Error(j.error || "Failed to load"); setData(j); setState("done"); })
      .catch(err => { setErrMsg(err.message); setState("error"); });
  }, [slug, token, start, end, instructor]);

  useEffect(() => { load(); }, []);

  // The two new cards are fetched TOGETHER and reported SEPARATELY by the
  // route, so a slow or unwired retention card cannot blank the funnel.
  // Refetched when the instructor or the window changes; the Metabase
  // fetch underneath is cached four hours and the instructor is not one of
  // the card's parameters, so a filter change re-runs arithmetic, not a
  // query.
  const loadFunnel = useCallback(() => {
    setFunnelState("loading");
    const qs = new URLSearchParams({ start_date: start, end_date: end });
    if (instructor) qs.set("instructor", instructor);
    fetch(withToken("/" + slug + "/lessons/api/funnel?" + qs.toString()))
      .then(async r => { if (!r.ok) throw await reportFetchError(r); return r.json(); })
      .then(j => { if (!j.ok) throw new Error(j.error || "Failed to load"); setFunnel(j); setFunnelState("done"); })
      .catch(err => { console.error("[lessons] funnel: " + err.message); setFunnelState("error"); });
  }, [slug, token, start, end, instructor]);

  useEffect(() => { loadFunnel(); }, [loadFunnel]);

  // Tab and instructor are mirrored back into the URL, mutating only those
  // two keys — ?token= and ?_print= ride on this URL too and rebuilding the
  // whole query string is how the ?ci_rows= deep link shipped broken.
  useEffect(() => {
    if (isPrint) return;
    const u = new URL(window.location.href);
    if (tab === "overview") u.searchParams.delete("tab"); else u.searchParams.set("tab", tab);
    if (instructor) u.searchParams.set("instructor", instructor); else u.searchParams.delete("instructor");
    window.history.replaceState(null, "", u.toString());
  }, [tab, instructor, isPrint]);

  const genInsights = useCallback(() => {
    if (!data) return;
    setAiLoading(true);
    const blob = { range: data.range, totals: data.totals, monthly: data.monthly, sport: data.sport,
      priceBands: data.priceBands, instructors: data.instructors.slice(0, 10) };
    fetch(withToken("/" + slug + "/lessons/api/insights"), {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(blob),
    }).then(async r => {
        // Non-JSON body = route/middleware error (e.g. a plain-text 404);
        // report it verbatim rather than as a JSON parse failure.
        const t = await r.text();
        try { return JSON.parse(t); }
        catch { throw new Error("HTTP " + r.status + " — " + t.slice(0, 120)); }
      })
      .then(j => { if (j.ok && j.insights) setInsights(j.insights); else throw new Error(j.error || "no insights"); })
      .catch(err => alert("Insights failed: " + err.message))
      .finally(() => setAiLoading(false));
  }, [data, slug, token]);

  // Print mode: auto-generate insights only when the export asked for them
  useEffect(() => { if (isPrint && wantInsights && data && !insights && !aiLoading) genInsights(); }, [isPrint, wantInsights, data]);

  function downloadPdf() {
    const qs = new URLSearchParams({ start_date: start, end_date: end });
    if (insights) qs.set("insights", "1");
    // The print page is this page under ?_print=1 in a browser that has
    // never seen this reader, so the URL is the only channel. A PDF that
    // silently reverted to Overview for the whole org is the four-gates
    // bug this repo keeps recording.
    if (tab !== "overview") qs.set("tab", tab);
    if (instructor) qs.set("instructor", instructor);
    if (token) qs.set("token", token);
    // Opened in its own window rather than downloaded — a download started by a
    // sandboxed iframe is silently dropped. See open-pdf.js.
    openReportPdf("/" + slug + "/lessons/api/pdf?" + qs.toString(), { label: 'Instructor Lessons' });
  }

  const d = data;
  const monthly = (d && d.monthly) || [];
  const maxMonth = Math.max(1, ...monthly.map(m => m.n));
  const years = useMemo(() => [...new Set(monthly.map(m => m.month.slice(0, 4)))].sort(), [monthly]);
  const yearTotals = useMemo(() => years.map(y => {
    const ms = monthly.filter(m => m.month.startsWith(y));
    return { year: y, n: ms.reduce((s, m) => s + m.n, 0), rev: ms.reduce((s, m) => s + m.rev, 0) };
  }), [years, monthly]);
  const heatMax = d ? Math.max(1, ...Object.values(d.heat || {})) : 1;
  // GUARDED LIKE ITS TWO NEIGHBOURS. `sport` was the one of the three read
  // without a fallback, so any response missing it threw here and React
  // unmounted the whole page — a 200 with nothing in it, the blank-page class
  // this repo has shipped twice. The real route always sends it, which is why
  // it never bit; the render harness's generic /api/ stub is the first thing
  // to produce that shape, and it blanked every lessons case.
  const sportTotal = d ? Object.values(d.sport || {}).reduce((s, v) => s + v, 0) : 0;
  const maxBand = d ? Math.max(1, ...Object.values(d.priceBands || {})) : 1;
  const maxInstrRev = d && d.instructors.length ? Math.max(1, ...d.instructors.map(i => i.paid)) : 1;

  return (
    <div>
      <div className="toolbar no-print">
        <a className="toolbar-back" href={withToken("/" + slug)}>&larr; Reports</a>
        <span className="toolbar-title">🎾 Instructor Lessons</span>
        <div className="toolbar-spacer"></div>
        <label>Start<input type="date" value={start} onChange={e => setStart(e.target.value)} /></label>
        <label>End<input type="date" value={end} onChange={e => setEnd(e.target.value)} /></label>
        {(funnel && funnel.instructors && funnel.instructors.length > 1) && (
          <label>Instructor
            <select value={instructor} onChange={e => setInstructor(e.target.value)} data-ls-instr={instructor || "all"}>
              <option value="">All instructors ({funnel.instructors.length})</option>
              {funnel.instructors.map(n => <option key={n} value={n}>{n}</option>)}
            </select>
          </label>
        )}
        <button className="btn-run" onClick={() => load()}>▶ Run</button>
        <span className="divider"></span>
        <button onClick={() => window.print()}>🖨️ Print</button>
        <button className="btn-pdf" onClick={downloadPdf} disabled={state !== "done" || pdfLoading}>
          {pdfLoading ? "Generating…" : "📄 PDF"}
        </button>
      </div>

      {state === "loading" && <div style={{ paddingTop: 80 }}><ReportLoader /></div>}
      {state === "error" && (
        <div className="gen-wrapper">
          <div style={{ color: "#dc2626", marginBottom: 16 }}>Error: {errMsg}</div>
          <button className="insights-btn" onClick={() => load()}>Retry</button>
        </div>
      )}

      {state === "done" && d && (
        <div className="page">
          <div className="report-header">
            <div className="report-header-left">
              {cfg.logoUrl && <img className="report-header-logo" src={cfg.logoUrl} alt="" onError={e => { e.target.style.display = "none"; }} />}
              <div>
                <div className="org-label">{orgName}</div>
                <div className="title">Instructor Lessons — Private &amp; Semi-Private Coaching</div>
              </div>
            </div>
            <div>
              <div className="rh-period">{d.range.start} &ndash; {d.range.end}</div>
              <div className="rh-meta">Lessons marketplace &middot; booked through the programs pipeline</div>
            </div>
          </div>

          <div className="ls-tabs no-print">
            {LS_TABS.map(t => (
              <button key={t} type="button" className={"ls-tab" + (tab === t ? " on" : "")}
                data-ls-tab={t} aria-current={tab === t ? "page" : undefined}
                onClick={() => setTab(t)}>{LS_TAB_LABEL[t]}</button>
            ))}
          </div>

          {instructor && (
            <div className="ls-scope" data-ls-scoped={instructor}>
              Every figure on every tab is scoped to <b>{instructor}</b>.
              {" "}<button type="button" className="ls-tab" style={{ padding: "1px 7px", border: "1px solid #e8e6e0", borderRadius: 5, marginLeft: 4 }}
                onClick={() => setInstructor("")}>Show all instructors</button>
            </div>
          )}

          {tab === "overview" && (<div>
          {d.totals.lessons === 0 ? (
            <div className="panel" style={{ textAlign: "center", padding: "40px 20px" }}>
              <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>No instructor lessons in this range</div>
              <div className="tiny">{instructor ? "Nothing for " + instructor + " in this range — try a wider one, or show all instructors." : "Try a wider date range. Lessons are detected from instructor-led sections named \u201Clesson\u201D, \u201Cclinic\u201D, \u201Ccoaching\u201D, or \u201Cprivate\u201D."}</div>
            </div>
          ) : (
          <div>
            {/* KPI strip */}
            <div className="cards">
              <div className="card"><div className="lbl">Lessons Booked</div><div className="val">{fmtNum(d.totals.lessons)}</div>
                <div className="sub">{fmtNum(d.totals.active)} active, {fmtNum(d.totals.canceled)} canceled</div></div>
              <div className="card"><div className="lbl">Lesson Revenue</div><div className="val">{fmtMoney(d.totals.paid)}</div>
                <div className="sub">{d.totals.refunded > 0 ? fmtMoney(d.totals.refunded) + " refunded" : "no refunds"}</div></div>
              <div className="card"><div className="lbl">Active Instructors</div><div className="val">{fmtNum(d.totals.instructors)}</div>
                <div className="sub">teaching in this range</div></div>
              <div className="card"><div className="lbl">Avg Paid / Lesson</div><div className="val">{fmtMoney(d.totals.avgPrice)}</div>
                <div className="sub">packs included</div></div>
              <div className="card"><div className="lbl">Students</div><div className="val">{fmtNum(d.totals.students)}</div>
                <div className="sub">{d.totals.students > 0 ? Math.round(d.totals.repeatStudents / d.totals.students * 100) + "% take 2+" : "—"}</div></div>
            </div>

            {/* Rec Insights — on demand */}
            {!insights && (
              <div className="insights-head no-print" style={{ marginBottom: 16 }}>
                <button className="insights-btn" onClick={genInsights} disabled={aiLoading}>
                  <span className="sparkle">✦</span><span className="sparkle">✧</span><span className="sparkle">✦</span><span className="sparkle">✧</span><span className="sparkle">✦</span><span className="sparkle">✧</span>
                  {aiLoading ? "Analyzing…" : "✨ Rec Insights"}
                </button>
                <span className="d">AI read on this range — optional, and only included in exports if you generate it</span>
              </div>
            )}
            {insights && (
              <div>
                <div className="insights-head">
                  <span className="t">✨ Rec Insights</span>
                  <span className="d">generated from the data in this date range</span>
                  <button className="no-print" style={{ marginLeft: "auto", background: "none", border: "1px solid #e8e6e0", borderRadius: 6, padding: "2px 10px", fontSize: 11, color: "#78716c", cursor: "pointer", fontFamily: "inherit" }}
                    onClick={() => setInsights(null)}>Hide</button>
                </div>
                <div className="insights-grid">
                  {insights.map((ins, i) => (
                    <div key={i} className={"insight-card insight-" + (ins.type || "signal")}>
                      <div className="it">{ins.type}</div>
                      <div className="ittl">{ins.title}</div>
                      <div className="idet">{ins.detail || ins.body}</div>
                      {ins.action && <div className="iact">&rarr; {ins.action}</div>}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Monthly trend */}
            {monthly.length > 1 && (
              <div>
                <div className="vsec">
                  <div className="vsec-t">📈 Lessons per Month</div>
                  <div className="vsec-s">Bookings by signup month{years.length > 1 ? " · earlier year in light blue" : ""}</div>
                </div>
                <div className="panel">
                  <div className="cols">
                    {monthly.map((m, i) => {
                      const isPrev = years.length > 1 && m.month.slice(0, 4) === years[0];
                      return (
                        <div key={m.month} className={"col" + (isPrev ? " prev" : "")}
                          style={{ height: Math.max(2, m.n / maxMonth * 100) + "%" }}
                          title={m.month + " — " + m.n + " lessons · " + fmtMoney(m.rev)}>
                          {m.n === maxMonth && <span className="cv">{m.n}</span>}
                        </div>
                      );
                    })}
                  </div>
                  <div className="col-lbls">
                    {monthly.map(m => <span key={m.month}>{m.month.slice(5) === "01" ? "J '" + m.month.slice(2, 4) : MONTHS[parseInt(m.month.slice(5), 10) - 1][0]}</span>)}
                  </div>
                  <div className="legend">
                    {yearTotals.map((y, i) => (
                      <span key={y.year}><span className="dot" style={{ background: i === 0 && years.length > 1 ? "#9ec5f4" : "#2a78d6" }}></span>
                        {y.year} <b>{fmtNum(y.n)} lessons · {fmtMoney(y.rev)}</b></span>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Leaderboard + mix */}
            <div className="vsec">
              <div className="vsec-t">🏆 Instructor Leaderboard</div>
              <div className="vsec-s">Top {Math.min(15, d.instructors.length)} of {d.totals.instructors} instructors by revenue</div>
            </div>
            <div className="two-col w">
              <div className="panel">
                <table className="mini">
                  <thead><tr><th>Instructor</th><th className="r">Lessons</th><th className="r">Students</th><th style={{ width: 120 }}></th><th className="r">Revenue</th></tr></thead>
                  <tbody>
                    {d.instructors.map((i, idx) => (
                      <tr key={idx} title={i.canceled > 0 ? i.canceled + " canceled" : ""}>
                        <td className="b">{i.name}</td>
                        <td className="r">{fmtNum(i.lessons)}</td>
                        <td className="r">{fmtNum(i.students)}</td>
                        <td><div className="rowbar"><div style={{ width: Math.max(2, i.paid / maxInstrRev * 100) + "%" }} /></div></td>
                        <td className="r"><b>{fmtMoney(i.paid)}</b></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="panel-note">Revenue is participant payments on each instructor's lessons — compensation splits live in the Instructor Payout report.</div>
              </div>
              <div className="panel">
                {sportTotal > 0 && (
                  <div>
                    <div className="panel-h">Sport mix</div>
                    <div className="stack">
                      {["Tennis", "Pickleball", "Other"].map((k, i) => d.sport[k] > 0 ? (
                        <div key={k} className="seg" style={{ width: (d.sport[k] / sportTotal * 100) + "%", background: ["#2a78d6", "#eb6834", "#1baf7a"][i] }}
                          title={k + ": " + d.sport[k]} />
                      ) : null)}
                    </div>
                    <div className="legend">
                      {["Tennis", "Pickleball", "Other"].map((k, i) => d.sport[k] > 0 ? (
                        <span key={k}><span className="dot" style={{ background: ["#2a78d6", "#eb6834", "#1baf7a"][i] }}></span>{k} <b>{fmtNum(d.sport[k])}</b></span>
                      ) : null)}
                    </div>
                  </div>
                )}
                <div className="panel-h" style={{ marginTop: 16 }}>Price paid per lesson</div>
                {["<$60", "$60–99", "$100–149", "$150–249", "$250+"].map(b => d.priceBands[b] ? (
                  <div className="meter" key={b}>
                    <div className="mh"><span>{b}{b === "$250+" ? <span className="tiny"> (packs)</span> : null}</span><b>{fmtNum(d.priceBands[b])}</b></div>
                    <div className="track"><div style={{ width: (d.priceBands[b] / maxBand * 100) + "%" }} /></div>
                  </div>
                ) : null)}
              </div>
            </div>

            {/* Heat map */}
            <div className="vsec">
              <div className="vsec-t">🔥 Booking Heat Map</div>
              <div className="vsec-s">Lessons booked by day of week &times; calendar month</div>
            </div>
            <div className="panel">
              <div className="heat">
                <div></div>
                {MONTHS.map(m => <div key={m} className="hh">{m}</div>)}
                {DAYS.map((day, i) => (
                  <React.Fragment key={day}>
                    <div className="hd">{day}</div>
                    {MONTHS.map((mo, j) => {
                      const v = (d.heat && d.heat[i + "|" + j]) || 0;
                      const step = v === 0 ? 0 : Math.min(5, 1 + Math.floor(v / heatMax * 5));
                      return <div key={j} className="hc" style={{ background: RAMP[step], color: step >= 4 ? "#fff" : (v > 0 ? "#1c1917" : "#d6d3ce") }}
                        title={day + " " + mo + " — " + v + " lesson" + (v === 1 ? "" : "s")}>{v || ""}</div>;
                    })}
                  </React.Fragment>
                ))}
              </div>
              <div className="heat-legend">
                <span>Lessons:</span>
                {[1, 2, 3, 4, 5].map(s => <React.Fragment key={s}>
                  <span className="step" style={{ background: RAMP[s] }}></span>
                  <span>{Math.round((s - 1) / 5 * heatMax) + (s === 5 ? "+" : "–" + Math.round(s / 5 * heatMax))}</span>
                </React.Fragment>)}
              </div>
            </div>

            {/* Loyalty */}
            <div className="two-col" style={{ marginTop: 14 }}>
              <div className="panel">
                <div className="panel-h">Student loyalty</div>
                <table className="mini">
                  <tbody>
                    <tr><td className="b">Distinct students</td><td className="r">{fmtNum(d.totals.students)}</td></tr>
                    <tr><td className="b">Booked 2+ lessons</td><td className="r">{fmtNum(d.totals.repeatStudents)} <span className="tiny">({d.totals.students ? Math.round(d.totals.repeatStudents / d.totals.students * 100) : 0}%)</span></td></tr>
                    <tr><td className="b">Share of lessons from repeat students</td><td className="r">{d.totals.repeatShare}%</td></tr>
                    <tr><td className="b">Most lessons by one student</td><td className="r">{fmtNum(d.totals.maxByOneStudent)}</td></tr>
                  </tbody>
                </table>
                <div className="panel-note">Repeat business is the retention engine — instructor relationships, not one-off signups, carry the revenue.</div>
              </div>
              <div className="panel">
                <div className="panel-h">Cancellations</div>
                <table className="mini">
                  <tbody>
                    <tr><td className="b">Canceled bookings</td><td className="r">{fmtNum(d.totals.canceled)} <span className="tiny">({d.totals.lessons ? Math.round(d.totals.canceled / d.totals.lessons * 100) : 0}% of bookings)</span></td></tr>
                    <tr><td className="b">Refunded</td><td className="r">{fmtMoney(d.totals.refunded)}</td></tr>
                  </tbody>
                </table>
                <div className="panel-note">Cancellations are counted in booking totals but excluded from “active”. Revenue shown is amounts actually paid.</div>
              </div>
            </div>

            {/* Data notes */}
            <div className="panel" style={{ marginTop: 16, background: "#faf9f7" }}>
              <div className="panel-h">📋 Data notes</div>
              <div className="panel-note" style={{ marginTop: 0 }}>
                Lessons live in the programs pipeline: the marketplace publishes one section per lesson slot, and a booking is a program registration with an instructor attached. Counts are booking-grain on a signup-date basis, drawn from the instructor registrations feed; lessons are identified by instructor-led sections named “lesson”, “clinic”, “coaching”, or “private”. Court time consumed by lessons is not yet part of the facility or court-utilization feeds.
              </div>
            </div>
          </div>
          )}
          </div>)}

          {tab === "acquisition" && (
            funnelState === "loading" ? <div style={{ padding: "40px 0" }}><ReportLoader /></div>
            : funnelState === "error" ? <div className="ls-unwired"><b>The acquisition funnel could not be loaded</b>The feed did not answer. The Overview tab is unaffected.</div>
            : <AcqTab a={funnel && funnel.acquisition} instructor={instructor} />
          )}

          {tab === "retention" && (
            funnelState === "loading" ? <div style={{ padding: "40px 0" }}><ReportLoader /></div>
            : funnelState === "error" ? <div className="ls-unwired"><b>Retention and LTV could not be loaded</b>The feed did not answer. The Overview tab is unaffected.</div>
            : <RetTab r={funnel && funnel.retention} instructor={instructor} start={start} end={end} />
          )}

          <div className="report-footer">
            <span>Powered by Rec Technologies &middot; rec.us</span>
            <span>Confidential — {orgName} &middot; Instructor Lessons</span>
          </div>

          <div id="report-ready" style={{ display: "none" }} />
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <script src="/report-loader.js" defer></script>
  <script src="/nav-breadcrumb.js" defer></script>
  <script src="/feedback-widget.js" defer></script>
</body>
</html>
