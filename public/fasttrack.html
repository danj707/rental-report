<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fast Track Report</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; color: #1a1a1a; background: #f5f4f1; line-height: 1.35; }

    /* ── Toolbar ── */
    .toolbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: #2c2c2c; color: #eee; font-size: 13px; flex-wrap: wrap; }
    .toolbar-title { font-weight: 600; margin-right: 4px; }
    .toolbar-spacer { flex: 1; }
    .toolbar label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; display: flex; flex-direction: column; gap: 2px; }
    .toolbar select { padding: 4px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; background: rgba(255,255,255,.1); color: #fff; font-size: 12px; font-family: inherit; outline: none; max-width: 220px; }
    .toolbar select option { background: #2c2c2c; color: #fff; }
    .toolbar input[type="text"] { padding: 4px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; background: rgba(255,255,255,.1); color: #fff; font-size: 12px; font-family: inherit; outline: none; width: 160px; }
    .toolbar input:focus, .toolbar select:focus { border-color: #3b82f6; }
    .toolbar button { padding: 6px 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: rgba(255,255,255,.08); color: #fff; font-size: 12px; font-family: inherit; cursor: pointer; transition: background .15s; white-space: nowrap; }
    .toolbar button:hover { background: rgba(255,255,255,.18); }
    .toolbar .btn-pdf { background: #3b82f6; border-color: #3b82f6; font-weight: 600; }
    .toolbar .btn-pdf:hover { background: #2563eb; }
    .toolbar .btn-pdf:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-excel { background: #16803c; border-color: #16803c; font-weight: 600; }
    .toolbar .btn-excel:hover { background: #15692f; }
    .toolbar .btn-excel:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Print ── */
    .print-mode .toolbar, .print-mode .no-print { display: none !important; }
    .print-mode .report { padding: 12px 16px; box-shadow: none; margin: 0; }
    @media print { .toolbar, .no-print { display: none !important; } }

    /* ── Report body ── */
    .report { max-width: 1400px; margin: 16px auto; padding: 24px 28px 48px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:18px; gap:16px; }
    .report-header-left { display:flex; align-items:center; gap:14px; }
    .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
    .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
    .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
    .report-header-right { text-align:right; }
    .report-header .rh-meta { font-size:11px; color:#666; }

  /* ── Animated header — a 5k in progress. Same construction as the Programs
     and Community Intelligence banners: a CSS scene under a text overlay, no
     images, no interaction. ── */
  .ft-banner { position:relative; width:100%; height:168px; border-radius:12px; overflow:hidden;
    margin:0 0 18px; border:1px solid #fed7aa; box-shadow:0 3px 14px rgba(124,45,18,.16);
    background:linear-gradient(112deg,#312e81 0%,#9d174d 45%,#ea580c 78%,#fbbf24 100%); }
  .ft-banner .ftb-scene { position:absolute; inset:0; z-index:0; overflow:hidden; }
  .ft-banner .ftb-overlay { position:absolute; inset:0; padding:18px 26px 34px; display:flex; flex-direction:column;
    align-items:flex-start; justify-content:center; text-align:left; z-index:2; }
  .ft-banner .ftb-kicker { font-size:10.5px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.92); text-shadow:0 1px 3px rgba(0,0,0,.45); }
  .ft-banner .ftb-title { font-size:30px; font-weight:800; color:#fff; text-shadow:0 2px 7px rgba(0,0,0,.45); line-height:1.04; margin-top:3px; }
  .ft-banner .ftb-sub { font-size:12.5px; color:rgba(255,255,255,.95); text-shadow:0 1px 4px rgba(0,0,0,.5); margin-top:6px; max-width:560px; }
  .ft-banner .ftb-pills { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .ft-banner .ftb-pill { background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); color:#fff; font-size:12px; font-weight:600; padding:4px 12px; border-radius:20px; text-shadow:0 1px 2px rgba(0,0,0,.35); }
  .ft-banner .ftb-pill b { font-weight:800; }

  .ftx-sun { position:absolute; right:13%; top:19%; width:66px; height:66px; border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #fff2c9, #ffc86a 52%, #ff8f2e 100%);
    box-shadow:0 0 46px 14px rgba(255,160,60,.5); animation:ftxSun 7s ease-in-out infinite alternate; }
  .ftx-haze { position:absolute; height:8px; border-radius:999px; background:rgba(255,255,255,.10); filter:blur(3px); animation:ftxDrift linear infinite; }
  .ftx-hill { position:absolute; bottom:0; width:150%; border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .ftx-hill.h1 { height:44%; left:-26%; background:rgba(30,18,58,.3); }
  .ftx-hill.h2 { height:30%; left:-6%;  background:rgba(20,12,38,.38); }
  /* The road, with lane dashes streaming past to sell the pace. */
  .ftx-road { position:absolute; left:0; right:0; bottom:0; height:30px; background:linear-gradient(180deg,#5a3624,#331d13); }
  .ftx-road::before { content:''; position:absolute; left:0; right:0; top:0; height:2px; background:rgba(255,255,255,.18); }
  .ftx-dashes { position:absolute; left:0; right:0; bottom:5px; height:3px;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 16px, transparent 16px 40px);
    animation:ftxDash 1.05s linear infinite; }
  /* Runners: the wrapper travels, the figure strides. */
  .ftx-lane { position:absolute; left:-40px; animation:ftxRun linear infinite; }
  .ftx-runner { position:relative; width:13px; height:20px; transform-origin:50% 100%;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
    animation:ftxBob .3s ease-in-out infinite alternate; }
  .ftx-runner i { position:absolute; display:block; }
  .ftx-runner .head { width:5.5px; height:5.5px; border-radius:50%; background:#fbdcb8; top:0; left:5px; }
  .ftx-runner .torso { top:5px; left:2px; width:8.5px; height:9px; border-radius:3px 3px 2px 2px;
    background:var(--kit); transform:rotate(-10deg); }
  .ftx-runner .arm { top:6.5px; left:0; width:2.4px; height:6.5px; border-radius:2px; background:var(--kit);
    transform-origin:50% 0; animation:ftxSwing .3s linear infinite alternate-reverse; }
  .ftx-runner .leg { bottom:0; left:4.6px; width:2.6px; height:8px; border-radius:2px; background:#e7e2da;
    transform-origin:50% 0; animation:ftxSwing .3s linear infinite alternate; }
  .ftx-runner .leg.back { animation-direction:alternate-reverse; background:#a8a196; }
  /* Bunting over the start, and a marker cone or two. */
  .ftx-bunting { position:absolute; top:-6px; left:-2%; width:104%; height:40px; }
  .ftx-bunting .cord { position:absolute; left:0; right:0; top:9px; height:2px; border-radius:2px; background:rgba(255,255,255,.26); }
  .ftx-pennant { position:absolute; top:9px; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent;
    border-top:13px solid #fff; transform-origin:50% 0; animation:ftxSway 4.2s ease-in-out infinite alternate; }
  .ftx-cone { position:absolute; width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent;
    border-bottom:8px solid #fb923c; filter:drop-shadow(0 1px 2px rgba(0,0,0,.4)); }

  @keyframes ftxSun   { to { box-shadow:0 0 52px 18px rgba(255,170,80,.58); } }
  @keyframes ftxDrift { from { transform:translateX(-160px); } to { transform:translateX(1500px); } }
  @keyframes ftxDash  { to { background-position-x:-40px; } }
  @keyframes ftxRun   { to { transform:translateX(calc(100vw + 70px)); } }
  @keyframes ftxBob   { from { transform:translateY(0) rotate(-1deg); } to { transform:translateY(-2px) rotate(1deg); } }
  @keyframes ftxSwing { from { transform:rotate(-32deg); } to { transform:rotate(30deg); } }
  @keyframes ftxSway  { from { transform:rotate(-6deg); } to { transform:rotate(6deg); } }

  /* Decoration only — a reduced-motion reader gets the same scene, held still. */
  @media (prefers-reduced-motion: reduce) { .ft-banner * { animation:none !important; } }
  @media print { .ft-banner { display:none !important; } }
  body.print-mode .ft-banner { display:none !important; }

    /* ── Loading / Error ── */
    .loading { display: flex; flex-direction: column; align-items: center; padding: 48px 0; gap: 14px; }
    .spinner { width: 30px; height: 30px; border: 3px solid #ddd; border-top-color: #3b82f6; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ftPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(220,38,38,.55); } 50% { box-shadow: 0 0 0 7px rgba(220,38,38,0); } }
    .ft-pulse { animation: ftPulse 1.5s ease-in-out infinite; }
    .juice-msg { font-size: 12px; color: #999; }
    .juice-msg span { display: none; }
    .juice-msg span:first-child { display: inline; }
    .error { padding: 20px; color: #dc2626; font-size: 13px; text-align: center; }

    /* ── Summary cards ── */
    .summary-cards { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .summary-card { flex: 1; min-width: 130px; border: 1px solid #e0ddd8; border-radius: 8px; padding: 14px 16px; background: #fff; }
    .summary-card .sc-label { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: #888; margin-bottom: 4px; font-weight: 600; }
    .summary-card .sc-value { font-size: 22px; font-weight: 700; }
    .summary-card .sc-sub { font-size: 11px; color: #888; margin-top: 2px; }

    /* ── Tooltips ── */
    .tip-wrap { position: relative; display: inline-flex; align-items: center; gap: 5px; }
    .tip-icon { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; background: #6b7280; color: #fff; font-size: 10px; font-weight: 700; font-family: Georgia, serif; font-style: italic; cursor: help; flex-shrink: 0; line-height: 1; transition: background .15s; }
    .tip-icon:hover { background: #374151; }
    .tip-bubble { display: none; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 8px); z-index: 50; width: 220px; padding: 8px 11px; background: #1f2937; color: #f3f4f6; font-size: 11.5px; font-weight: 400; line-height: 1.5; border-radius: 6px; text-transform: none; letter-spacing: 0; box-shadow: 0 4px 16px rgba(0,0,0,.25); pointer-events: none; }
    .tip-bubble::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: #1f2937; }
    .tip-wrap:hover .tip-bubble { display: block; }
    @media print { .tip-bubble, .tip-icon { display: none !important; } }

    /* ── Explainer ── */
    .explainer { background: #fff; border: 1px solid #e0ddd8; border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 12px; color: #555; line-height: 1.6; }
    .explainer strong { color: #333; }
    .explainer-toggle { background: none; border: none; cursor: pointer; font-size: 12px; font-weight: 600; color: #3b82f6; padding: 0; font-family: inherit; }
    .explainer ul { margin: 8px 0 0 16px; }
    .explainer li { margin-bottom: 3px; }

    /* ── Chart ── */
    .chart-section { margin: 20px 0; }
    .chart-container { background: #fff; border: 1px solid #e0ddd8; border-radius: 10px; padding: 16px 20px; }
    .chart-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .chart-label { width: 240px; flex-shrink: 0; font-size: 12px; font-weight: 500; color: #333; text-align: right; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .chart-bar-wrap { flex: 1; height: 24px; background: #f5f4f1; border-radius: 4px; position: relative; overflow: hidden; }
    .chart-bar { height: 100%; border-radius: 4px; transition: width .4s ease; min-width: 0; position: absolute; top: 0; cursor: pointer; }
    .chart-bar.ft-total { background: #d1d5db; z-index: 1; left: 0; }
    .chart-bar.ft-conv { background: #22c55e; z-index: 3; left: 0; }
    .chart-bar.ft-pend { background: #f59e0b; z-index: 2; }
    .chart-bar:hover { filter: brightness(1.1); }
    .chart-val { font-size: 11px; font-weight: 600; color: #555; width: 56px; text-align: right; flex-shrink: 0; }
    .chart-tooltip { position: fixed; z-index: 60; pointer-events: none; background: #1f2937; color: #fff; border-radius: 8px; padding: 9px 11px; font-size: 11px; line-height: 1.5; box-shadow: 0 8px 28px rgba(0,0,0,.28); width: 220px; }
    .chart-tooltip .tt-name { font-weight: 700; margin-bottom: 5px; font-size: 11.5px; }

    /* ── AI Insights ── */
    .insights-section { margin: 4px 0 18px; }
    .insights-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .insights-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border: 1px solid #e5e7eb; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s; 
      position: relative; overflow: visible;
      box-shadow: 0 2px 12px rgba(99,102,241,.3);
    }
    .insights-btn:hover:not(:disabled) { background: linear-gradient(135deg, #4f46e5, #7c3aed); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,.4); filter: none; }
    .insights-btn:disabled { opacity: .6; cursor: default; }
    .insights-btn .sparkle {
      position: absolute; pointer-events: none;
      font-size: 10px; opacity: 0;
      animation: sparkle-float 2.5s ease-in-out infinite;
    }
    .insights-btn .sparkle:nth-child(1) { top: -8px; left: 8%; animation-delay: 0s; }
    .insights-btn .sparkle:nth-child(2) { top: -6px; right: 12%; animation-delay: 0.7s; font-size: 8px; }
    .insights-btn .sparkle:nth-child(3) { bottom: -7px; left: 25%; animation-delay: 1.4s; font-size: 7px; }
    .insights-btn .sparkle:nth-child(4) { top: -5px; left: 50%; animation-delay: 0.3s; font-size: 6px; }
    .insights-btn .sparkle:nth-child(5) { bottom: -6px; right: 20%; animation-delay: 1.1s; font-size: 9px; }
    .insights-btn .sparkle:nth-child(6) { top: -9px; right: 3%; animation-delay: 1.9s; font-size: 7px; }
    @keyframes sparkle-float {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
      15% { opacity: 1; transform: translateY(-3px) scale(1.1); }
      30% { opacity: 0.7; transform: translateY(-7px) scale(0.9); }
      50% { opacity: 0.3; transform: translateY(-11px) scale(0.6); }
      70% { opacity: 0; transform: translateY(-15px) scale(0.3); }
    }
    @media (prefers-reduced-motion: reduce) { .insights-btn .sparkle { animation: none; opacity: 0; } .insights-btn:hover:not(:disabled) { transform: none; } }
    .insights-sub { font-size: 11.5px; color: #9ca3af; }
    .insights-section .loading { padding: 36px 16px; }
    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
    .insight-card { border: 1px solid #e5e7eb; border-left-width: 4px; border-radius: 8px; padding: 14px 16px; background: #fff; }
    .insight-type { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 6px; }
    .insight-title { font-size: 14px; font-weight: 700; color: #111827; margin-bottom: 5px; line-height: 1.3; }
    .insight-detail { font-size: 12.5px; color: #374151; line-height: 1.45; }
    .insight-action { font-size: 12px; color: #6b7280; margin-top: 8px; font-weight: 500; }
    .insight-opportunity { border-left-color: #10b981; }
    .insight-opportunity .insight-type { color: #059669; }
    .insight-risk { border-left-color: #f59e0b; }
    .insight-risk .insight-type { color: #d97706; }
    .insight-signal { border-left-color: #6366f1; }
    .insight-signal .insight-type { color: #4f46e5; }

    /* ── Table ── */
    .table-scroll { overflow-x: auto; }
    .ft-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .ft-table th { background: #2c2c2c; color: #fff; padding: 8px 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; font-weight: 700; position: sticky; top: 0; z-index: 10; white-space: nowrap; }
    .ft-table th.left { text-align: left; }
    .ft-table td { padding: 7px 10px; border-bottom: 1px solid #e8e5e0; text-align: right; white-space: nowrap; }
    .ft-table td.left { text-align: left; }

    .prog-row { background: #f0eeea; cursor: pointer; }
    .prog-row:hover { background: #e8e5df; }
    .prog-row td { font-weight: 700; }
    .sec-row td { font-weight: 400; color: #444; }
    .sec-row td:first-child { padding-left: 32px; }
    .totals-row { background: #2c2c2c; color: #fff; }
    .totals-row td { font-weight: 700; border: none; }

    .cell-zero { color: #ccc; }
    .pct-bar { display: inline-flex; align-items: center; gap: 6px; }
    .pct-fill { height: 6px; border-radius: 3px; display: inline-block; }


    /* ── Post-launch conversion flow board ──
       Heat encodes conversion rate (validated palette): HOT ≥50% #b91c1c,
       WARMING 25–49% #f97316, COOL 1–24% #0369a1, COLD 0% neutral #6b7280.
       Never color-alone: every card shows the %, a band label and an icon. */
    .flow-card { background: #fff; border: 1px solid #e0ddd8; border-left-width: 6px; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
    .flow-card.focused { box-shadow: 0 0 0 3px #f9731655; }
    .flow-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .flow-conv { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
    .flow-band { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 8px; border-radius: 10px; }
    .flow-title { font-size: 13px; font-weight: 700; color: #111; }
    .flow-sub { font-size: 11px; color: #888; }
    .flow-row { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 2px 0; }
    .flow-node { min-width: 92px; border: 1px solid #e0ddd8; border-radius: 8px; padding: 6px 12px; text-align: center; background: #fafaf9; flex-shrink: 0; }
    .flow-node .fn-val { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .flow-node .fn-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #888; }
    .flow-arrow { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 6px; flex-shrink: 0; min-width: 54px; }
    .flow-arrow .fa-line { font-size: 15px; font-weight: 800; line-height: 1; white-space: nowrap; }
    .flow-arrow .fa-lbl { font-size: 9px; font-weight: 700; color: #999; white-space: nowrap; }
    .flow-pending { margin-top: 8px; border-top: 1px dashed #e0ddd8; padding-top: 8px; }
    .flow-action { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; cursor: pointer; border: none; font-family: inherit; }
    .roster { margin-top: 8px; border: 1px solid #f0ede8; border-radius: 8px; background: #fffdf8; padding: 6px 10px; max-height: 300px; overflow-y: auto; }
    .roster-row { display: flex; gap: 8px; align-items: baseline; font-size: 11px; padding: 3px 0; border-bottom: 1px solid #f5f2ec; flex-wrap: wrap; }
    .roster-row:last-child { border-bottom: none; }
    .launch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .launch-card { background: #fff; border: 1px solid #e0ddd8; border-radius: 10px; padding: 12px 14px; cursor: pointer; text-align: left; font-family: inherit; transition: box-shadow .15s, transform .15s; border-left-width: 5px; }
    .launch-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.08); transform: translateY(-1px); }
    .launch-stats { display: flex; gap: 12px; margin-top: 8px; }
    .launch-stat .ls-v { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .launch-stat .ls-l { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: #999; }
    /* Pin toggle + email digest modal */
    .pin-toggle { border: 1px solid transparent; background: transparent; cursor: pointer; font-size: 13px; line-height: 1; padding: 3px 5px; border-radius: 6px; opacity: .35; transition: opacity .12s, background .12s; font-family: inherit; }
    .pin-toggle:hover { opacity: 1; background: #f3e8ff; }
    .pin-toggle.pinned { opacity: 1; background: #f3e8ff; border-color: #d8b4fe; }
    .pin-toggle:focus-visible { outline: 2px solid #7c3aed; outline-offset: 1px; opacity: 1; }

  var ftUsersBySection = useMemo(function() {

                  onClick: function() { setSubCadence(c); } }, c.charAt(0).toUpperCase() + c.slice(1));
              })),
            subStatus && React.createElement('div', { style: { fontSize: 12, fontWeight: 600, marginBottom: 12, color: subStatus.ok ? '#059669' : '#dc2626' } }, subStatus.msg),
            React.createElement('div', { style: { display: 'flex', gap: 8, justifyContent: 'flex-end' } },
              React.createElement('button', { className: 'flow-action', style: { background: '#fff', color: '#555', border: '1px solid #d1d5db', padding: '8px 16px' }, onClick: function() { setSubOpen(false); } }, 'Close'),
              React.createElement('button', { className: 'flow-action', style: { background: '#b91c1c', color: '#fff', border: '1px solid #b91c1c', padding: '8px 16px' }, onClick: submitDigestSub }, 'Subscribe'))
          )
        ),

                /* Footer */
        React.createElement('div', { className: 'report-footer' }, 'rec.us · ', orgSlug)
      ),

      /* Print-ready sentinel */
      !loading && React.createElement('div', { id: 'report-ready', style: { display: 'none' } })
    )
  );
}

function SummaryCard(props) {
  return React.createElement('div', { className: 'summary-card', style: { borderTop: '3px solid ' + (props.color || '#888') } },
    React.createElement('div', { className: 'sc-label' },
      props.tip
        ? React.createElement('span', { className: 'tip-wrap' },
            props.label,
            React.createElement('span', { className: 'tip-icon' }, 'i'),
            React.createElement('span', { className: 'tip-bubble' }, props.tip)
          )
        : props.label
    ),
    React.createElement('div', { className: 'sc-value', style: { color: props.color || '#111' } }, props.value),
    props.sub && React.createElement('div', { className: 'sc-sub' }, props.sub)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
