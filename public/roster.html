  const grouped = useMemo(() => {
    const bySec = {};
    displayRows.forEach(r => {
      if (!bySec[r.section]) bySec[r.section] = { className: r.className, sessions: {} };
      const dk = r.sessionDate || '(No Date)';
      if (!bySec[r.section].sessions[dk])
        bySec[r.section].sessions[dk] = { start: r.sessionStart, end: r.sessionEnd, rows: [] };
      bySec[r.section].sessions[dk].rows.push(r);
    });
    Object.values(bySec).forEach(sec =>
      Object.values(sec.sessions).forEach(sess =>
        sess.rows.sort((a, b) => (a.lastName + a.firstName).localeCompare(b.lastName + b.firstName))
      )
    );
    return bySec;
  }, [displayRows]);

  const sortedSections = useMemo(() => Object.keys(grouped).sort(), [grouped]);

  // Fire-and-forget log to server for client-side events (excel, print)
  function logClientEvent(event, extra) {
    try {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length < 2) return;
      // The convention is ?event=<name> in the QUERY STRING — a JSON body is
      // read by nothing on the server and comes back 400 Unknown event, which a
      // fire-and-forget beacon never complains about. See the memberships note.
      const qs = new URLSearchParams({ event });
      Object.keys(extra || {}).forEach(k => {
        if (extra[k] !== undefined && extra[k] !== null && extra[k] !== '') qs.set(k, String(extra[k]));
      });
      fetch(withToken(`/${parts[0]}/${parts[1]}/api/log?${qs}`), { method: 'POST', keepalive: true }).catch(() => {});
    } catch {}
  }


  // ── Excel export ──
  function toXlDate(s) { if (!s) return ''; const p = String(s).split('T')[0].split('-'); return p.length === 3 ? new Date(+p[0], +p[1]-1, +p[2]) : s; }
  function exportExcel() {
    if (!rows || !rows.length) return;
    const headers = [
      'Section', 'Class', 'Session Date',
      'Last Name', 'First Name',
      ...(cols.recId    ? ['Rec ID'] : []),
      ...(cols.dob      ? ['DOB'] : []),
      ...(cols.age      ? ['Age'] : []),
      ...(cols.grade    ? ['Grade'] : []),
      ...(cols.gender   ? ['Gender'] : []),
      ...(cols.contact  ? ['Phone', 'Email'] : []),
      ...(cols.owner    ? ['Household Owner'] : []),
      ...(cols.ownerContact ? ['Owner Phone', 'Owner Email'] : []),
      ...(cols.emergency ? ['Emergency Contacts'] : []),
      ...(cols.pickup    ? ['Authorized Pickups'] : []),
      'Status',
      ...(cols.registered ? ['Registered'] : []),
    ];
    const dataRows = displayRows.map(r => [
      r.section, r.className, toXlDate(r.sessionDate),
      r.lastName, r.firstName,
      ...(cols.recId    ? [r.recId] : []),
      ...(cols.dob      ? [formatDOB(r.dob)] : []),
      ...(cols.age      ? [r.age] : []),
      ...(cols.grade    ? [r.grade] : []),
      ...(cols.gender   ? [r.gender] : []),
      ...(cols.contact  ? [formatPhone(r.phone), r.email] : []),
      ...(cols.owner    ? [r.owner] : []),
      ...(cols.ownerContact ? [formatPhone(r.ownerPhone), r.ownerEmail] : []),
      ...(cols.emergency ? [r.emergencyContacts] : []),
      ...(cols.pickup    ? [r.authorizedPickups] : []),
      r.status,
      ...(cols.registered ? [toXlDate(r.registered)] : []),
    ]);
    const ws = XLSX.utils.aoa_to_sheet([headers, ...dataRows], { cellDates: true });
    // Format date columns
    const sesIdx = 2;
    const regIdx = cols.registered ? headers.indexOf('Registered') : -1;
    for (let ri = 1; ri <= dataRows.length; ri++) {
      [sesIdx, regIdx].forEach(ci => {
        if (ci < 0) return;
        const addr = XLSX.utils.encode_cell({ r: ri, c: ci });
        if (ws[addr] && ws[addr].t === 'd') ws[addr].z = 'MM/DD/YY';
      });
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Roster');
    // Handed to a popup to save rather than written straight from here — a
    // download started by a sandboxed iframe is silently dropped. See open-pdf.js.
    saveWorkbookViaPopup(XLSX, wb, `class-roster-${loadedStart || 'report'}.xlsx`);
    logClientEvent('excel');
  }

  // ── ePACT export ──
  // Two entry points, ONE builder: the toolbar button over everything on screen,
  // and a button on each section's header row for the single-class case. Two
  // copies of the column list would drift the first time ePACT wanted a field,
  // and a vendor import is the last place to discover that.
  // The org's column set — one lookup, used by the count, both buttons and the
  // file, so the number on the toolbar cannot describe a different export than
  // the one the button produces.
  const epactCols = useMemo(() => epactColumns(), []);
  const epactAll = useMemo(() => epactRows(displayRows, epactCols), [displayRows, epactCols]);

  function exportEpact(rowSet, sectionName) {
    const tuples = epactRows(rowSet, epactCols);
    if (!tuples.length) return;
    const scope = sectionName ? 'section' : 'view';
    const name = ['epact', orgSlug || 'org', sectionName ? epactFileSlug(sectionName) : '',
                  loadedStart || startDate].filter(Boolean).join('-') + '.csv';
    saveTextViaPopup(epactCsv(tuples, epactCols), name, {
      gesture: 'ePACT',
      // Metabase writes a UTF-8 BOM on every CSV it serves, so the file Melinda
      // downloads from the card today has one and ePACT already ingests it. It
      // also matters on its own: Excel sniffs bytes rather than trusting UTF-8,
      // so without a BOM an accented participant name opens as mojibake.
      // Metabase writes a BOM on every CSV it serves, so the file Melinda
      // downloads from the card today has one and ePACT already ingests it.
      // Excel also sniffs bytes rather than trusting UTF-8, so without it an
      // accented participant name opens as mojibake. An org can turn it off.
      bom: RS().epactBom !== false,
      title: 'Your ePACT file is ready',
      hint: tuples.length + ' participant' + (tuples.length === 1 ? '' : 's')
          + ' \u2014 upload this CSV in ePACT. If the download did not start on its own, use the '
          + 'button above; "Copy for Excel" puts the same rows on your clipboard instead.',
    });
    // The SCOPE is the interesting half: a whole-view export is a bulk upload,
    // a per-section one is a class about to start. Sections are the debounce key
    // (below), so working down a list of classes reads as N exports, not one.
    logClientEvent('epact', { rows: tuples.length, scope, section: sectionName || '' });
  }

  function ColToggle({ k, label }) {
    return <button className={`col-toggle${cols[k] ? ' on' : ''}`} onClick={() => toggleCol(k)}>{label}</button>;
  }

  const now = new Date();
  const runDate = `${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')}/${now.getFullYear()} @ ${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()}`;
  const dateRangeLabel = [loadedStart && formatDisplayDate(loadedStart), loadedEnd && formatDisplayDate(loadedEnd)].filter(Boolean).join(' – ')
    || [startDate && formatDisplayDate(startDate), endDate && formatDisplayDate(endDate)].filter(Boolean).join(' – ');

  function downloadPdf() {
    const parts = window.location.pathname.split('/').filter(Boolean);
    const pdfParams = new URLSearchParams({ start_date: loadedStart||'', end_date: loadedEnd||'' });
    // Use the LIVE section filter — typing in the box narrows the on-screen
    // rows client-side without re-fetching, so loadedSection is stale (usually
    // empty). The visible view is driven by sectionFilter, so the PDF must be too.
    const sec = (sectionFilter && sectionFilter.trim()) ? sectionFilter.trim() : (loadedSection || '');
    if (sec) pdfParams.set('section_name', sec);
    if (statusFilter && statusFilter !== 'all') pdfParams.set('status', statusFilter);
    if (selectedQs !== null) pdfParams.set('questions', JSON.stringify(selectedQs));
    pdfParams.set('cols', JSON.stringify(cols));
    const pdfUrl = parts.length >= 2
      ? `/${parts[0]}/${parts[1]}/api/pdf?${pdfParams}`
      : '/api/pdf';
    // Opened in its own window rather than downloaded — a download started by a
    // sandboxed iframe is silently dropped. See open-pdf.js.
    openReportPdf(withToken(pdfUrl), { label: 'Class Roster' });
  }

  // Inclusive day count of the window on screen. Built from the date STRINGS
  // rather than new Date(a) - new Date(b): both are UTC midnight there, which is
  // right by luck and wrong the moment one of them is a local date.
  const rangeDays = (() => {
    const d = t => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
    const a = d(startDate), b = d(endDate);
    return a != null && b != null ? Math.round((b - a) / 86400000) + 1 : 0;
  })();

  function renderToolbar() {
    if (isPrint) return null;
    return (
      <>
      {renderSaveDialog()}
      {renderUndoToast()}
      {renderSettings()}
      <div className="toolbar" data-roster-days={rangeDays}>
        <span className="toolbar-title">Class Roster</span>

        {rsShown('views') && renderViewPicker()}

        <div className="toolbar-divider" />

        <label>
          Section
          <input type="text" value={sectionFilter} onChange={e => setSectionFilter(e.target.value)}
            placeholder="Filter sections…" style={{width:160}} onKeyDown={e => e.key === 'Enter' && handleRun()} />
        </label>

        <label>Start<input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} /></label>
        <label>End<input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} /></label>
        <button onClick={() => setDays(rsDefaultDays())} style={{fontSize:10,padding:'3px 7px'}}
          title={'Back to the default window \u2014 the next ' + rsDefaultDays() + ' days'}>{rsDefaultDays()} Days</button>
        <button onClick={() => setMonth(-1)} style={{fontSize:10,padding:'3px 7px'}}>Last Mo.</button>
        <button onClick={() => setMonth(0)}  style={{fontSize:10,padding:'3px 7px'}}>This Mo.</button>
        <button onClick={() => setMonth(1)}  style={{fontSize:10,padding:'3px 7px'}}>Next Mo.</button>
        <button className="btn-run" onClick={handleRun} disabled={loading}
          style={paramsChanged && !loading ? {boxShadow:'0 0 0 2px #4ade80'} : {}}>
          {loading ? <><span className="btn-spinner" />Loading…</> : '▶ Run Report'}
        </button>

        <div className="toolbar-divider" />

        <div className="status-pills">
          <span className={`status-pill status-pill-all${statusFilter==='all'?' active':''}`} onClick={() => setStatusFilter('all')}>
            All {counts.all > 0 && `(${counts.all})`}
          </span>
          <span className={`status-pill status-pill-enrolled${statusFilter==='enrolled'?' active':''}`} onClick={() => setStatusFilter('enrolled')}>
            Enrolled {counts.enrolled > 0 && `(${counts.enrolled})`}
          </span>
          <span className={`status-pill status-pill-cancelled${statusFilter==='cancelled'?' active':''}`} onClick={() => setStatusFilter('cancelled')}>
            Cancelled {counts.cancelled > 0 && `(${counts.cancelled})`}
          </span>
        </div>

        <div className="toolbar-divider" />

        <ColToggle k="recId"        label="Rec ID" />
        <ColToggle k="dob"          label="DOB" />
        <ColToggle k="age"          label="Age" />
        <ColToggle k="grade"        label="Grade" />
        <ColToggle k="gender"       label="Gender" />
        <ColToggle k="contact"      label="Contact" />
        <ColToggle k="owner"        label="Owner" />
        <ColToggle k="ownerContact" label="Owner Contact" />
        <ColToggle k="emergency"    label="🛑 Emergency" />
        <ColToggle k="pickup"       label="🚸 Pickup" />
        <ColToggle k="registered"   label="Registered" />
        <ColToggle k="responses"    label="Form Responses" />
        {rsShown('questions') && cols.responses && availableQuestions.length > 0 && (() => {
          const total = availableQuestions.length;
          const selCount = selectedQs === null ? total : selectedQs.length;
          const trunc = (str, n = 42) => str.length > n ? str.slice(0, n).trimEnd() + '\u2026' : str;
          return (
            <div className="qfilter">
              <button className={`col-toggle${selCount < total ? ' on' : ''}`}
                onClick={() => setQPanelOpen(o => !o)}>
                Questions: {selCount === total ? 'All' : `${selCount}/${total}`} {'\u25be'}
              </button>
              {qPanelOpen && <>
                <div className="qfilter-backdrop" onClick={() => setQPanelOpen(false)} />
                <div className="qfilter-panel">
                  <div className="qfilter-head">
                    <span className="qf-title">Show questions</span>
                    <button onClick={() => setSelectedQs(null)}>All</button>
                    <button onClick={() => setSelectedQs([])}>None</button>
                  </div>
                  {availableQuestions.map(({ q, idx }) => {
                    const checked = selectedQs === null || selectedQs.includes(q);
                    return (
                      <label className="qfilter-item" key={q} title={q}>
                        <input type="checkbox" checked={checked} onChange={() => toggleQ(q)} />
                        <span><span className="qf-idx">Q{idx}:</span> {trunc(q)}</span>
                      </label>
                    );
                  })}
                </div>
              </>}
            </div>
          );
        })()}

        <div className="toolbar-spacer" />
        {rows && <span className="row-count">{displayRows.length} of {counts.all}</span>}
        <div className="toolbar-divider" />
        {rsShown('print') && <button onClick={() => window.print()}>🖨️ Print</button>}
        {rsShown('pdf') && (
        <button
          className="btn-pdf"
          onClick={downloadPdf}
          disabled={pdfLoading || !rows || !rows.length}
        >
          {pdfLoading ? 'Generating…' : '📄 PDF'}
        </button>
        )}
        {rsShown('excel') && <button className="btn-excel" onClick={exportExcel} disabled={!rows || !rows.length}>📊 Excel</button>}
        {rsShown('epact') && (
        <button className="btn-epact" data-epact-rows={epactAll.length}
          onClick={() => exportEpact(displayRows, '')}
          disabled={!epactAll.length}
          title={epactAll.length
            ? `Export ${epactAll.length} participant${epactAll.length === 1 ? '' : 's'} across every section on screen, ready to upload into ePACT. Cancelled registrations are always excluded.`
            : 'Nothing to export \u2014 no enrolled participants in this view.'}>
          {'\uD83D\uDCE4 ePACT'}{epactAll.length ? ` (${epactAll.length})` : ''}
        </button>
        )}
        <button className="btn-settings" onClick={openSettings} data-rs-open
          title="Report settings — what this report opens on for everyone in this organization"
          aria-label="Report settings">⚙</button>

      </div>
      </>
    );
  }

  if (error && !rows) return (
    <div>{renderToolbar()}
      <div className="page"><div className="error" style={{textAlign:'center',padding:'3rem 1rem'}}><p style={{fontSize:'2.5rem',marginBottom:'0.5rem'}}>😔</p><p style={{fontSize:'1.1rem',color:'#666'}}>Looks like reporting has encountered an issue — try loading this report again later.</p>
            <p style={{fontSize:'0.8rem',color:'#b91c1c',marginTop:'0.75rem',fontFamily:'monospace',background:'#fef2f2',padding:'8px 14px',borderRadius:6,display:'inline-block',maxWidth:500,wordBreak:'break-word'}}>{error}</p></div></div>
    </div>
  );

  if (!rows) return (
    <div>{renderToolbar()}
      <div className="page"><div className="loading"><div className="spinner" /><div className="juice-msg"><span>Squeezing the oranges…</span><span>Juicing!</span><span>Adding the pulp…</span><span>Chilling the glass…</span><span>Pouring it out…</span></div></div></div>
    </div>
  );

  function ColHdrs() {
    return (
      <div className="col-header-row">
        {cols.recId && <span className="cell col-recid">Rec ID</span>}
        <span className="cell col-fname">First Name</span>
        <span className="cell col-lname">Last Name</span>
        {cols.dob      && <span className="cell col-dob">DOB</span>}
        {cols.age      && <span className="cell col-age">Age</span>}
        {cols.grade    && <span className="cell col-grade">Grade</span>}
        {cols.gender   && <span className="cell col-gender">Gender</span>}
        {cols.contact  && <><span className="cell col-phone">Phone</span><span className="cell col-email">Email</span></>}
        {cols.owner    && <span className="cell col-owner">Household Owner</span>}
        {cols.ownerContact && <><span className="cell col-ownerph">Owner Phone</span><span className="cell col-ownerem">Owner Email</span></>}
        <span className="cell col-status">Status</span>
        {cols.registered && <span className="cell col-reg">Registered</span>}
      </div>
    );
  }

  function DataRow({ r }) {
    const isCancelled = r.status === 'Cancelled';
    const fr = r.formResponses || [];
    const qaList = selectedQs === null ? fr : fr.filter(qa => selectedQs.includes(qa.q));
    return (
      <>
        <div className={`data-row${isCancelled ? ' is-cancelled' : ''}`}>
          {cols.recId && <span className="cell col-recid">{r.recId}</span>}
          <span className="cell col-fname">{r.firstName}</span>
          <span className="cell col-lname">{r.lastName}</span>
          {cols.dob      && <span className="cell col-dob">{formatDOB(r.dob)}</span>}
          {cols.age      && <span className="cell col-age">{r.age}</span>}
          {cols.grade    && <span className="cell col-grade">{r.grade}</span>}
          {cols.gender   && <span className="cell col-gender">{r.gender}</span>}
          {cols.contact  && <>
            <span className="cell col-phone">{formatPhone(r.phone)}</span>
            <span className="cell col-email">
              {r.email ? <a href={`mailto:${r.email}`} style={{color:'#3b82f6',textDecoration:'none'}}>{r.email}</a> : ''}
            </span>
          </>}
          {cols.owner && <span className="cell col-owner">{r.owner}</span>}
          {cols.ownerContact && <>
            <span className="cell col-ownerph">{formatPhone(r.ownerPhone)}</span>
            <span className="cell col-ownerem">{r.ownerEmail}</span>
          </>}
          <span className="cell col-status">
            <span className={`status-badge status-${isCancelled ? 'cancelled' : 'enrolled'}`}>{r.status}</span>
          </span>
          {cols.registered && <span className="cell col-reg">{r.registered}</span>}
        </div>
        {((cols.emergency && r.emergencyContacts) || (cols.pickup && r.authorizedPickups)) && (
          <div className="contacts-sub-row">
            {cols.emergency && r.emergencyContacts && (
              <div className="contact-group">
                <span className="contact-label">🛑 Emergency:</span>
                <span className="contact-val">{r.emergencyContacts}</span>
              </div>
            )}
            {cols.pickup && r.authorizedPickups && (
              <div className="contact-group">
                <span className="contact-label">🚸 Pickup:</span>
                <span className="contact-val">{r.authorizedPickups}</span>
              </div>
            )}
          </div>
        )}
        {cols.responses && qaList.length > 0 && (
          <div className="form-responses-row">
            <div className="form-responses-list">
              {qaList.map((qa, i) => (
                <div className="form-qa-line" key={i}>
                  <span className="form-q">{qa.q}:</span>{' '}
                  <span className="form-a">{qa.a}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </>
    );
  }

  return (
    <div>
      {renderToolbar()}
      <StaleCacheBanner cachedAt={staleCacheAt} />
      <div className="page" style={loading ? {opacity:.5, pointerEvents:'none'} : {}}>

        <div className="report-header">
          <div className="report-header-left">
            {logoUrl && <img src={logoUrl} alt="" className="report-header-logo" onError={e => e.target.style.display='none'} />}
            <div>
              <div className="org-label">{orgName || orgSlug}</div>
              <div className="title">Class Roster</div>
            </div>
          </div>
          <div className="report-header-right">
            <div className="rh-meta" style={{fontWeight:600,marginBottom:2}}>{dateRangeLabel}</div>
            {RS().showStamp && dataAt && !isPrint && (
              <div className="rh-meta" data-rs-stamp style={{fontSize:10,color:'#999'}}>
                Data as of {new Date(dataAt).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'})}
                {' \u00B7 '}
                <a href="#" onClick={e => { e.preventDefault(); fetchData(startDate, endDate, sectionFilter, true); }}
                   style={{color:'#3b82f6'}}>Refresh</a>
              </div>
            )}
          </div>
        </div>

        {sortedSections.length === 0 && (
          <div style={{textAlign:'center',padding:'40px 0',color:'#888'}}>
            No participants found for the selected filters.
          </div>
        )}

        {sortedSections.map(secName => {
          const sec = grouped[secName];
          const sortedDates = Object.keys(sec.sessions).sort();
          const secRows = Object.values(sec.sessions).flatMap(s => s.rows);
          const secEnrolled  = secRows.filter(r => r.status === 'Enrolled').length;
          const secCancelled = secRows.filter(r => r.status === 'Cancelled').length;
          const secEpact = epactRows(secRows, epactCols).length;

          return (
            <div className="section-group" key={secName}>
              <div className="section-hdr">
                <div className="section-hdr-left">
                  <span className="sec-name">{secName}</span>
                  {sec.className && <span className="class-name">{sec.className}</span>}
                </div>
                <div className="sec-counts">
                  {secEnrolled  > 0 && <span className="cnt-enrolled">{secEnrolled} enrolled</span>}
                  {secCancelled > 0 && <span className="cnt-cancelled">{secCancelled} cancelled</span>}
                  {/* One class at a time is the common case — Melinda exports the
                      camp that is about to start, not the quarter. No button
                      where there is nobody to upload: a control that produces an
                      empty file is a dead end. */}
                  {!isPrint && secEpact > 0 && (
                    <button className="btn-epact-sm" data-epact-section={secName}
                      data-epact-rows={secEpact}
                      onClick={() => exportEpact(secRows, secName)}
                      title={`Export ${secEpact} participant${secEpact === 1 ? '' : 's'} from ${secName} for ePACT`}>
                      {'\uD83D\uDCE4 ePACT'}
                    </button>
                  )}
                </div>
              </div>

              {sortedDates.map((dk, di) => {
                const sess = sec.sessions[dk];
                return (
                  <div key={dk}>
                    <div className="session-hdr">
                      <span className="sess-date">{dk}</span>
                      {sess.start && sess.end && (
                        <span className="sess-time">·  {sess.start} – {sess.end}</span>
                      )}
                      <span className="sess-count">{sess.rows.length} participant{sess.rows.length !== 1 ? 's' : ''}</span>
                    </div>
                    {di === 0 && <ColHdrs />}
                    {sess.rows.map((r, i) => <DataRow key={i} r={r} />)}
                  </div>
                );
              })}
            </div>
          );
        })}



        <div className="report-footer">
          <span>{orgName || orgSlug}</span>
          <span>Run Date/Time: {runDate}</span>
        </div>
        {!loading && (rows || error) && <div id="report-ready" data-ready="true" style={{display:'none'}} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
    <script src="/share-widget.js" defer></script>
    <script src="/feedback-widget.js" defer></script>
      <script src="/nav-breadcrumb.js" defer></script>
  </body>
</html>
