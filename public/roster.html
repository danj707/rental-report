<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #1a1a1a;
      background: #f5f4f1;
      line-height: 1.35;
    }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: #2c2c2c; color: #eee;
      font-size: 12px; flex-wrap: wrap;
    }
    .toolbar-title { font-weight: 700; font-size: 13px; margin-right: 4px; white-space: nowrap; }
    .toolbar-divider { width: 1px; height: 24px; background: rgba(255,255,255,.18); margin: 0 2px; }
    .toolbar-spacer { flex: 1; }

    .toolbar label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      color: #aaa; display: flex; flex-direction: column; gap: 2px;
    }
    .toolbar input[type="date"],
    .toolbar input[type="text"] {
      padding: 4px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px;
      background: rgba(255,255,255,.1); color: #fff; font-size: 12px; font-family: inherit; outline: none;
    }
    .toolbar input[type="date"]:focus,
    .toolbar input[type="text"]:focus { border-color: #3b82f6; }
    .toolbar input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .toolbar input[type="text"]::placeholder { color: #777; }

    .toolbar button {
      padding: 5px 12px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px;
      background: rgba(255,255,255,.08); color: #fff; font-size: 11px; font-family: inherit;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .toolbar button:hover { background: rgba(255,255,255,.18); }
    .toolbar .btn-run  { background: #16a34a; border-color: #16a34a; font-weight: 600; font-size: 12px; padding: 5px 14px; }
    .toolbar .btn-run:hover { background: #15803d; }
    .toolbar .btn-run:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-pdf { background: #3b82f6; border-color: #3b82f6; font-weight: 600; }
    .toolbar .btn-pdf:hover { background: #2563eb; }
    .toolbar .btn-pdf:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-excel { background: #16803c; border-color: #16803c; font-weight: 600; }
    .toolbar .btn-excel:hover { background: #15692f; }
    .toolbar .btn-excel:disabled { opacity: .5; cursor: not-allowed; }
    /* ePACT is an upload to an outside vendor, so it reads as its own action
       rather than a third shade of the export buttons beside it. */
    .toolbar .btn-epact { background: #6d28d9; border-color: #6d28d9; font-weight: 600; }
    .toolbar .btn-epact:hover { background: #5b21b6; }
    .toolbar .btn-epact:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Report settings ── */
    .toolbar .btn-settings {
      margin-left: 4px; font-size: 13px; line-height: 1;
      padding: 4px 8px; background: rgba(255,255,255,.08);
    }
    .toolbar .btn-settings:hover { background: rgba(255,255,255,.18); }
    .rs-back {
      position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,.55);
      display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px;
      overflow-y: auto;
    }
    .rs-sheet {
      background: #fff; color: #222; border-radius: 12px; width: 760px; max-width: 96vw;
      box-shadow: 0 24px 70px rgba(0,0,0,.35); overflow: hidden;
    }
    .rs-head {
      display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
      padding: 15px 22px; background: #2c2c2c; color: #eee;
    }
    .rs-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
    .rs-head .rs-who { font-size: 11.5px; color: #a8a8a8; }
    .rs-head .rs-x {
      margin-left: auto; background: none; border: none; color: #a8a8a8;
      font-size: 15px; cursor: pointer; font-family: inherit;
    }
    .rs-head .rs-x:hover { color: #fff; }
    .rs-body { max-height: 66vh; overflow-y: auto; }
    .rs-grp { border-top: 1px solid #eee; }
    .rs-grp:first-child { border-top: none; }
    .rs-grp-head { display: flex; gap: 12px; padding: 16px 22px 10px; }
    .rs-stripe { width: 3px; border-radius: 2px; flex: 0 0 3px; }
    .rs-grp[data-sev="safe"]   .rs-stripe { background: #157f4a; }
    .rs-grp[data-sev="warn"]   .rs-stripe { background: #a35a06; }
    .rs-grp[data-sev="strict"] .rs-stripe { background: #a8231f; }
    .rs-blast {
      font-size: 10px; letter-spacing: .05em; text-transform: uppercase; font-weight: 600;
    }
    .rs-grp[data-sev="safe"]   .rs-blast { color: #157f4a; }
    .rs-grp[data-sev="warn"]   .rs-blast { color: #a35a06; }
    .rs-grp[data-sev="strict"] .rs-blast { color: #a8231f; }
    .rs-grp-head h4 { margin: 2px 0 0; font-size: 14px; font-weight: 650; }
    .rs-grp-head p { margin: 4px 0 0; font-size: 12.5px; color: #666; max-width: 64ch; }
    .rs-grp-body { padding: 2px 22px 20px 37px; display: flex; flex-direction: column; gap: 16px; }
    .rs-row { display: flex; flex-wrap: wrap; gap: 12px 24px; }
    .rs-field { display: flex; flex-direction: column; gap: 5px; }
    .rs-field > span {
      font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: #888; font-weight: 500;
    }
    .rs-field select, .rs-field input[type="range"] { font: inherit; font-size: 13px; color: #111; }
    .rs-field select {
      background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 5px 8px;
    }
    .rs-hint { margin: 0; font-size: 12px; color: #666; max-width: 66ch; }
    .rs-warn {
      font-size: 11.5px; color: #a35a06; background: #fdf4e7; border: 1px solid #f0dcbd;
      border-radius: 5px; padding: 6px 9px; max-width: 46ch; text-transform: none;
      letter-spacing: 0; font-weight: 400; line-height: 1.45;
    }
    .rs-tgrid { display: flex; flex-wrap: wrap; gap: 6px; }
    .rs-tg {
      font: inherit; font-size: 11px; cursor: pointer; padding: 4px 10px; border-radius: 4px;
      border: 1px solid #ddd; background: #f4f4f4; color: #666;
    }
    .rs-tg[aria-pressed="true"] { background: #e8f0fe; border-color: #93c5fd; color: #1e3a8a; font-weight: 600; }
    .rs-meter input[type="range"] { width: 100%; max-width: 460px; accent-color: #3b82f6; }
    .rs-cost { display: flex; gap: 20px; flex-wrap: wrap; font-size: 12px; color: #555; }
    .rs-cost b { font-size: 15px; color: #111; font-variant-numeric: tabular-nums; }
    .rs-cost .hot b { color: #a8231f; }
    .rs-cols { display: flex; flex-direction: column; gap: 4px; max-width: 520px; }
    .rs-col-item {
      display: flex; align-items: center; gap: 10px; padding: 5px 10px;
      border: 1px solid #eee; border-radius: 5px; background: #f8f8f8; font-size: 12.5px;
    }
    .rs-col-item .rs-src { color: #aaa; font-size: 11px; min-width: 14px; }
    .rs-col-item .rs-col-acts { margin-left: auto; display: flex; gap: 4px; }
    .rs-col-item .rs-col-acts button {
      font: inherit; font-size: 11px; cursor: pointer; background: none;
      border: 1px solid #ddd; border-radius: 4px; padding: 1px 6px; color: #666;
    }
    .rs-col-item .rs-col-acts button:disabled { opacity: .35; cursor: default; }
    .rs-verified {
      font-size: 12px; padding: 8px 11px; border-radius: 5px; max-width: 560px;
      background: #eaf6ef; border: 1px solid #b6ddc6; color: #157f4a;
    }
    .rs-verified.drifted { background: #fbeceb; border-color: #f0c3c1; color: #a8231f; }
    .rs-err {
      margin: 0 22px 12px; padding: 8px 11px; border-radius: 5px; font-size: 12.5px;
      background: #fbeceb; border: 1px solid #f0c3c1; color: #a8231f;
    }
    .rs-foot {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 14px 22px; border-top: 1px solid #eee; background: #f7f7f7;
    }
    .rs-save {
      font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
      background: #2563eb; color: #fff; border: none; border-radius: 5px; padding: 7px 15px;
    }
    .rs-save:disabled { background: #9db6e8; cursor: default; }
    .rs-ghost {
      font: inherit; font-size: 13px; cursor: pointer; color: #555;
      background: #fff; border: 1px solid #ddd; border-radius: 5px; padding: 7px 12px;
    }
    .rs-footnote { margin-left: auto; font-size: 11.5px; color: #999; }
    .rs-tg:focus-visible, .rs-save:focus-visible, .rs-ghost:focus-visible,
    .rs-field select:focus-visible, .btn-settings:focus-visible {
      outline: 2px solid #3b82f6; outline-offset: 1px;
    }
    @media print { .rs-back, .btn-settings { display: none !important; } }

    /* ── Saved views ── (same markup and classes as the GL report) */
    .view-wrap { position: relative; display: flex; align-items: center; gap: 6px; }
    .btn-view {
      display: flex; align-items: center; gap: 7px; white-space: nowrap;
      font-weight: 600; max-width: 260px;
    }
    .btn-view .vname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-view .vcaret { font-size: 9px; color: #aaa; }
    .btn-view .vdirty { font-size: 10px; color: #fbbf24; font-weight: 400; }
    .btn-save-view { font-size: 11px; padding: 4px 10px; }
    .btn-save-view:disabled { opacity: .45; cursor: default; }
    .view-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 250;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
      min-width: 300px; max-width: 380px; max-height: 400px; overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 4px 0;
    }
    .view-row {
      display: flex; align-items: flex-start; gap: 8px; padding: 7px 12px;
      cursor: pointer; font-size: 12.5px; color: #ddd;
    }
    .view-row:hover { background: rgba(255,255,255,.07); }
    .view-row .vtick { width: 12px; flex-shrink: 0; color: #4ade80; font-size: 11px; line-height: 1.5; }
    .view-row .vmain { flex: 1; min-width: 0; }
    .view-row .vsub {
      display: block; font-size: 10.5px; color: #888; margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .view-row .vmenu {
      flex-shrink: 0; color: #888; padding: 0 3px; font-size: 13px;
      background: none; border: none; cursor: pointer; font-family: inherit;
    }
    .view-row .vmenu:hover { color: #fff; }
    .view-actions {
      display: flex; flex-direction: column; padding: 2px 0 6px 32px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .view-actions button {
      text-align: left; background: none; border: none; color: #93c5fd;
      font-size: 11.5px; padding: 4px 12px; cursor: pointer; font-family: inherit;
    }
    .view-actions button:hover { color: #fff; }
    .view-actions button.danger { color: #f87171; }
    .view-add {
      border-top: 1px solid rgba(255,255,255,.1); margin-top: 4px; padding-top: 8px;
      color: #4ade80; font-weight: 600;
    }
    .view-empty { padding: 10px 12px; font-size: 11.5px; color: #888; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 220px;
      background: rgba(59,130,246,.18); border: 1px solid rgba(59,130,246,.45);
      border-radius: 4px; padding: 3px 7px; font-size: 11px; color: #dbeafe;
    }
    .filter-chip .clabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filter-chip button {
      background: none; border: none; color: #93c5fd; cursor: pointer;
      padding: 0 1px; font-size: 11px; font-family: inherit; line-height: 1;
    }
    .filter-chip button:hover { color: #fff; }
    .view-warn {
      background: #78350f; border: 1px solid #b45309; color: #fde68a;
      border-radius: 6px; padding: 9px 14px; margin: 0 0 14px;
      font-size: 12.5px; display: flex; align-items: flex-start; gap: 10px;
    }
    .view-warn .vwtext { flex: 1; }
    .view-warn button {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
      color: #fff; border-radius: 4px; padding: 3px 9px; font-size: 11px;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    .view-toast {
      position: fixed; left: 20px; bottom: 20px; z-index: 9998;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,.2); border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,.5); padding: 11px 15px;
      display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: #ddd;
    }
    .view-toast button {
      background: none; border: none; color: #93c5fd; font-size: 12.5px;
      font-weight: 600; cursor: pointer; font-family: inherit; padding: 0;
    }
    .view-toast button:hover { color: #fff; }
    @media print { .view-wrap, .view-toast, .view-warn { display: none !important; } }
    .toolbar .row-count { font-size: 11px; color: #aaa; }

    /* status filter pills */
    .status-pills { display: flex; gap: 4px; }
    .status-pill {
      padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; white-space: nowrap;
      transition: background .12s, border-color .12s;
    }
    .status-pill-all     { background: rgba(255,255,255,.1); color: #ddd; }
    .status-pill-all.active { background: #e5e7eb; color: #111; }
    .status-pill-enrolled { background: rgba(22,163,74,.15); color: #4ade80; border-color: rgba(22,163,74,.3); }
    .status-pill-enrolled.active { background: #16a34a; color: #fff; }
    .status-pill-cancelled { background: rgba(239,68,68,.1); color: #f87171; border-color: rgba(239,68,68,.3); }
    .status-pill-cancelled.active { background: #dc2626; color: #fff; }

    /* col toggle buttons */
    .col-toggle {
      padding: 3px 9px; border-radius: 4px; font-size: 10px; cursor: pointer; white-space: nowrap;
      background: rgba(255,255,255,.07); color: #aaa; border: 1px solid rgba(255,255,255,.15);
      transition: background .12s, color .12s;
    }
    .col-toggle.on { background: rgba(59,130,246,.25); color: #93c5fd; border-color: rgba(59,130,246,.4); }

    /* ── Form-response question multiselect ── */
    .qfilter { position: relative; display: inline-block; }
    .qfilter-backdrop { position: fixed; inset: 0; z-index: 40; }
    .qfilter-panel {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
      width: 330px; max-height: 340px; overflow-y: auto;
      background: #1f2430; border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
      box-shadow: 0 8px 26px rgba(0,0,0,.4); padding: 6px;
    }
    .qfilter-head {
      display: flex; gap: 6px; align-items: center;
      padding: 2px 4px 6px; margin-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .qfilter-head .qf-title { flex: 1; font-size: 9.5px; color: #888; text-transform: uppercase; letter-spacing: .05em; }
    .qfilter-head button { padding: 2px 8px; font-size: 10px; }
    .qfilter-item {
      display: flex; gap: 7px; align-items: flex-start;
      padding: 4px 5px; border-radius: 4px;
      font-size: 11px; color: #ddd; line-height: 1.3; cursor: pointer;
    }
    .qfilter-item:hover { background: rgba(255,255,255,.06); }
    .qfilter-item input { margin: 1px 0 0; cursor: pointer; flex-shrink: 0; }
    .qfilter-item .qf-idx { color: #93c5fd; font-weight: 600; }

    /* ── Page ── */
    .page {
      max-width: 1400px; margin: 16px auto; padding: 24px 28px;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* ── Report header ── */
    .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:18px; gap:16px; }
    .report-header-left { display:flex; align-items:center; gap:14px; }
    .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
    .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
    .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
    .report-header-right { text-align:right; }
    .report-header .rh-meta { font-size:11px; color:#666; }

    /* ── Section group ── */
    .section-group { margin-bottom: 20px; }

    .section-hdr {
      display: flex; align-items: baseline; gap: 10px; justify-content: space-between;
      padding: 7px 8px;
      background: #2c2c2c; color: #fff;
      border-radius: 4px 4px 0 0;
    }
    .section-hdr-left { display: flex; align-items: baseline; gap: 10px; }
    .section-hdr .sec-name { font-weight: 700; font-size: 13px; }
    .section-hdr .class-name { font-size: 11px; color: #aaa; }
    .section-hdr .sec-counts { font-size: 10px; color: #aaa; display: flex; gap: 8px; }
    .sec-counts .cnt-enrolled  { color: #4ade80; }
    .sec-counts .cnt-cancelled { color: #f87171; }
    /* Legible at rest, not on hover — a control nobody can find is a control
       that does not exist (the Fast Track pin, one report over). */
    .btn-epact-sm {
      font: inherit; font-size: 10px; line-height: 1;
      padding: 4px 8px; margin-left: 2px;
      background: #6d28d9; color: #fff; border: 1px solid #7c3aed;
      border-radius: 4px; cursor: pointer; white-space: nowrap;
    }
    .btn-epact-sm:hover { background: #5b21b6; }
    .btn-epact-sm:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 1px; }
    @media print { .btn-epact-sm { display: none; } }

    /* ── Session sub-header ── */
    .session-hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 8px 4px;
      background: #edeae4;
      border-bottom: 1px solid #ccc;
      font-weight: 600; font-size: 11px; color: #555;
    }
    .session-hdr .sess-date { font-size: 12px; font-weight: 700; color: #222; }
    .session-hdr .sess-time { color: #777; }
    .session-hdr .sess-count { margin-left: auto; font-size: 10px; color: #999; }

    /* ── Column header row ── */
    .col-header-row {
      display: flex; gap: 4px; padding: 4px 8px;
      background: #e8e5df;
      border-bottom: 1px solid #ccc;
      font-weight: 700; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.4px; color: #555;
    }

    /* ── Data row ── */
    .data-row {
      display: flex; gap: 4px; padding: 4px 8px;
      border-bottom: 1px solid #f0ede8;
      align-items: center; font-size: 11.5px;
    }
    .data-row:nth-child(even) { background: #fafaf8; }
    .data-row.is-cancelled { opacity: .65; }

    .cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .status-badge {
      display: inline-block; padding: 1px 7px; border-radius: 10px;
      font-size: 10px; font-weight: 600; white-space: nowrap;
    }
    .status-enrolled  { background: #dcfce7; color: #166534; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }

    /* ── Form responses sub-row ── */
    .form-responses-row {
      padding: 4px 8px 6px 8px;
      border-bottom: 1px solid #e8e4de;
      background: #f0f4ff;
      font-size: 10.5px;
    }
    .form-responses-list {
      display: flex; flex-direction: column; gap: 2px;
    }
    .form-qa-line {
      text-align: left; line-height: 1.4;
    }
    .form-q {
      color: #555; font-size: 10px; font-weight: 600;
    }
    .form-a { color: #111; font-size: 11px; }

    /* ── Column widths ── */
    .col-fname     { width: 110px; font-weight: 500; }
    .col-lname     { width: 110px; font-weight: 500; }
    .col-recid     { width: 72px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; }
    .col-dob       { width: 82px; }
    .col-age       { width: 36px; text-align: center; }
    .col-grade     { width: 50px; text-align: center; }
    .col-gender    { width: 56px; }
    .col-phone     { width: 108px; }
    .col-email     { width: 160px; font-size: 10.5px; }
    .col-owner     { width: 130px; }
    .col-ownerph   { width: 108px; }
    .col-ownerem   { width: 155px; font-size: 10.5px; }
    .contacts-sub-row { padding: 3px 12px 6px 24px; font-size: 11.5px; color: #374151; display: flex; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid rgba(0,0,0,.06); background: #fafaf9; }
    .contacts-sub-row .contact-group { display: flex; gap: 4px; align-items: baseline; }
    .contacts-sub-row .contact-label { font-weight: 700; color: #1f2937; font-size: 10.5px; text-transform: uppercase; letter-spacing: .3px; }
    .contacts-sub-row .contact-val { color: #111827; }
    .col-status    { width: 76px; }

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;


// ── Per-org report settings ──────────────────────────────────────────────────
// Injected by the server into ORG_CONFIG so they are available on the FIRST
// render: they decide the window, the columns and which controls exist, and a
// page that waited for a round trip would flash the platform defaults first.
//
// PRECEDENCE, and it is the whole design:
//     platform default  →  the org's setting  →  this person's own choice
// A setting SEEDS; it never overrides. Someone's column toggles still live in
// their own localStorage and still win. If a saved default reached in and reset
// those, the first support ticket would be "my settings keep resetting".
function RS() {
  try { return (window.ORG_CONFIG || {}).settings || {}; } catch (_) { return {}; }
}
function RSMeta() {
  try { return (window.ORG_CONFIG || {}).settingsMeta || {}; } catch (_) { return {}; }
}
function rsDefaultDays() {
  const n = Number(RS().defaultDays);
  return Number.isFinite(n) && n > 0 ? n : ROSTER_DEFAULT_DAYS;
}
// `hide` removes a control rather than disabling it — a greyed button that never
// works is worse than no button.
function rsShown(key) { return !(RS().hide || {})[key]; }

const LS_COLS = 'roster_cols_v2';

// One label per column key, so the settings panel and the toolbar cannot end up
// calling the same column two different things.
const COL_LABELS = {
  recId: 'Rec ID', dob: 'DOB', age: 'Age', grade: 'Grade', gender: 'Gender',
  contact: 'Contact', owner: 'Owner', ownerContact: 'Owner Contact',
  emergency: '\uD83D\uDED1 Emergency', pickup: '\uD83D\uDEB8 Pickup',
  registered: 'Registered', responses: 'Form Responses',
};
const HIDE_LABELS = {
  questions: 'Form Responses picker', views: 'Saved views',
  pdf: 'PDF export', print: 'Print', excel: 'Excel export', epact: 'ePACT export',
};
// Above this the roster gets long fast — one block per session date, and the
// query widens with it. Allowed, but the panel warns rather than refusing: an
// org running year-round programmes may genuinely want a quarter.
const ROSTER_WIDE_WINDOW_DAYS = 30;
// The offered cache lifetimes, in minutes. The floor comes from the server
// (REPORT_TTL_FLOOR_MIN) and is echoed in the panel — the ladder must not offer
// a value the server would clamp.
const TTL_STEPS = [30, 45, 60, 120, 240, 360, 1440];

const COL_DEFAULTS = {
  recId: false, dob: false, age: true, grade: true, gender: false,
  contact: true, owner: true, ownerContact: false,
  emergency: true, pickup: true,
  registered: false, responses: false,
};

// Platform defaults, then the ORG's, then whatever this person last chose. The
// org setting is a seed: it decides what a first-time reader sees and is
// overruled the moment they touch a toggle.
function orgColDefaults() {
  const c = RS().cols;
  return c && typeof c === 'object' ? c : {};
}
function loadCols() {
  try { return { ...COL_DEFAULTS, ...orgColDefaults(), ...JSON.parse(localStorage.getItem(LS_COLS) || '{}') }; }
  catch { return { ...COL_DEFAULTS, ...orgColDefaults() }; }
}
function saveCols(v) { try { localStorage.setItem(LS_COLS, JSON.stringify(v)); } catch {} }

function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// The roster prints one block per session date, so a whole month at a big org
// is hundreds of pages before the reader has chosen anything — apex opened at
// ~382. The default is deliberately TIGHT: land on something small, see what the
// sections ARE, then widen the dates or type a partial section name and Run.
// The PLATFORM default. Deliberately still a constant: the server's `next14`
// relative range is pinned to it, so a saved view named "Next 14 days" and the
// report's own default cannot drift apart. An org that wants a different window
// sets `defaultDays`, which is passed in below rather than changing this.
const ROSTER_DEFAULT_DAYS = 14;
function getDefaultRange(today, days) {
  const n = Number.isFinite(days) && days > 0 ? days : ROSTER_DEFAULT_DAYS;
  const now = today || new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + n - 1);
  return { start: toISO(start), end: toISO(end) };
}
function formatDisplayDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  const months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function formatPhone(p) {
  if (!p) return '';
  const d = p.replace(/\D/g, '');
  if (d.length === 10) return `(${d.slice(0,3)})${d.slice(3,6)}-${d.slice(6)}`;
  if (d.length === 11 && d[0] === '1') return `(${d.slice(1,4)})${d.slice(4,7)}-${d.slice(7)}`;
  return p;
}
function formatDOB(dob) {
  if (!dob) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(dob)) {
    const [y, mo, d] = dob.substring(0,10).split('-');
    return `${mo}/${d}/${y}`;
  }
  return dob;
}

function StaleCacheBanner({ cachedAt }) {
  if (!cachedAt) return null;
  const when = new Date(cachedAt).toLocaleString();
  return (
    <div style={{background:'#fef3c7',borderBottom:'1px solid #f59e0b',padding:'8px 16px',textAlign:'center',fontSize:13,color:'#92400e'}}>
      ⚠️ Showing cached data from {when} — live data is temporarily unavailable
    </div>
  );
}

function normalizeRow(raw) {
  // Decode form responses from form_submission schema + submission
  const formResponses = (() => {
    try {
      const fd = typeof raw['Form Responses'] === 'string'
        ? JSON.parse(raw['Form Responses'])
        : raw['Form Responses'];
      if (!fd || !fd.schema || !fd.submission) return null;
      return fd.schema
        .filter(el => el.name && el.title)
        .map(el => {
          const rawAns = fd.submission[el.name];
          let answer = '';
          const choiceMap = {};
          (el.choices || []).forEach(c => { choiceMap[c.value] = c.text; });
          if (Array.isArray(rawAns)) {
            answer = rawAns.map(v => choiceMap[v] || v).join(', ');
          } else if (rawAns !== null && rawAns !== undefined) {
            answer = choiceMap[String(rawAns)] || String(rawAns);
          }
          // Digital signatures come through as base64 data URIs — show a clean label
          if (typeof answer === 'string' && (answer.startsWith('data:image') || answer.startsWith('data:application'))) {
            answer = '\u2713 Signed';
          }
          return { q: el.title, a: answer };
        })
        .filter(qa => qa.a !== '');
    } catch { return null; }
  })();

  return {
    recId:        raw['Rec ID']          || '',
    firstName:    raw['First Name']      || '',
    lastName:     raw['Last Name']       || '',
    dob:          raw['Date of Birth']   || '',
    age:          raw['Age'] != null ? raw['Age'] : '',
    grade:        raw['Grade']           || '',
    gender:       raw['Gender']          || '',
    phone:        raw['Phone']           || '',
    email:        raw['Email']           || '',
    owner:        raw['Household Owner'] || '',
    ownerEmail:   raw['Owner Email']     || '',
    ownerPhone:   raw['Owner Phone']     || '',
    emergencyContacts: raw['Emergency Contacts'] || '',
    authorizedPickups: raw['Authorized Pickups'] || '',
    className:    raw['Class']           || '',
    section:      raw['Section']         || '',
    sessionDate:  raw['Session Date']    || '',
    sessionStart: raw['Session Start']   || '',
    sessionEnd:   raw['Session End']     || '',
    status:       raw['Status']          || 'Enrolled',
    registered:   raw['Registered']      || '',
    formResponses,
  };
}


// ── Saved views ──────────────────────────────────────────────────────────────
// Ported from the GL report, which is where this shipped first. A saved view is
// a name + a filter query string + a date intent. It is never a snapshot of
// rows: applying one sets the same filter state a person could set by hand, so
// the PDF, print, Excel and ePACT paths need to know nothing about it.
//
// WHAT A ROSTER VIEW CARRIES, and what it deliberately does not:
//   section_name, status   — filter state. These are the two things Dan's
//        workflow is built on ("type in partial section names, click Run").
//   the column toggles and the question picker — NOT carried. They are display
//        state, they already persist per browser in localStorage, and a shared
//        view that overwrote them would take a colleague's chosen columns away
//        the moment they opened someone else's filter. Same reason the GL report
//        excludes its display toggles from the "edited" marker.
const LS_LAST_VIEW = 'roster_saved_view_last_v1_';

// The date half comes from /saved-views.js, shared with the GL report — one
// mirror of the server's getDateRange(), not one per page. Thin wrappers so the
// reference resolves at CALL time rather than at module scope.
function resolveSavedRange(token) { return RecSavedViews.resolveSavedRange(token); }
function fmtShortDate(iso)        { return RecSavedViews.fmtShortDate(iso); }
function viewDateLabel(v)         { return RecSavedViews.viewDateLabel(v); }

// Which ranges THIS report offers is the server's call — a roster reads FORWARD,
// a GL rollup only looks backwards — and it arrives as ORG_CONFIG.savedViewRanges.
// A hardcoded list here is how gl.html came to offer "Today", which the server
// has always refused to store.
function savedViewRanges() {
  const r = (window.ORG_CONFIG || {}).savedViewRanges;
  return Array.isArray(r) ? r : [];
}
function defaultSavedRange() {
  const r = savedViewRanges();
  return r.length ? r[0][0] : '';
}

const ROSTER_VIEW_PARAMS = ['section_name', 'status'];

function parseViewParams(params) {
  const p = new URLSearchParams(params || '');
  return { section_name: p.get('section_name') || '', status: p.get('status') || '' };
}

const ROSTER_STATUS_LABELS = { all: 'All statuses', enrolled: 'Enrolled only', cancelled: 'Cancelled only' };

function viewFilterSummary(v) {
  const f = parseViewParams(v.params);
  const bits = [];
  if (f.section_name) bits.push('"' + f.section_name + '"');
  // `all` is the absence of a status filter, so naming it would read as a filter
  // where there is none — and every unfiltered view would say "All statuses".
  if (f.status && f.status !== 'all') bits.push(ROSTER_STATUS_LABELS[f.status] || f.status);
  return bits.length ? bits.join(' · ') : 'no filters';
}

// ── ePACT export ─────────────────────────────────────────────────────────────
// Orgs upload participant lists into ePACT, an outside HIPAA vendor that holds
// camp health forms. Melinda at Apex has been producing that list by hand from a
// Metabase SQL: a date range, a partial section name, five columns, CSV. This
// reproduces that query's OUTPUT from the roster feed, so the file drops
// straight into ePACT's importer.
//
// THE MAPPING, verified against card 17296 and against her SQL on prod
// (apex, 2026-08-27) rather than read off column names:
//
//   Rec ID / First Name / Last Name → the same three roster columns.
//   Household Owner Email           → the roster's `Email` column, NOT its
//        `Owner Email`. Both her query and the card compute
//        COALESCE(NULLIF(participant.email,''), owner.email); the roster's
//        `Owner Email` is owner.email ALONE. Her label says "Owner" and her SQL
//        does not, so the obvious-looking mapping is the wrong one.
//   Session Date - Section Name     → YYYY-MM-DD of the card's Session Date,
//        ' - ', then the section name. Both sides date a row from
//        COALESCE(this session, the section's first session).
//
// HER FILTERS, and where each one already lives:
//   b.status = 'confirmed' AND b.canceled_at IS NULL
//        The card is already restricted to b.status IN ('confirmed','cancelled')
//        and derives Status purely from canceled_at, so roster `Enrolled` IS her
//        set. Measured at apex: 0 bookings are status='cancelled' with a null
//        canceled_at, so the two cannot diverge; 16,831 are confirmed-then-
//        cancelled and both sides drop them.
//   section.is_rec_managed IS FALSE  → already in the card.
//   the date range and the section name → the report's own toolbar.
//   JOIN order_item ON booking_id    → a NO-OP. All 82,244 qualifying apex
//        bookings have a live order_item, so it removes nothing.
//   SELECT DISTINCT                  → NOT a no-op, and reproduced here: it
//        collapsed 82,244 rows to 82,127 at apex — the same participant in the
//        same section on the same DATE, from two sessions that day.
const EPACT_HEADERS = ['Rec ID', 'First Name', 'Last Name', 'Household Owner Email',
                       'Session Date - Section Name'];

// How each offered column is read off a roster row. PARTICIPANT- and
// SECTION-grain only, and that restriction is load-bearing: the export
// reproduces her SELECT DISTINCT over whatever columns are chosen, so a
// SESSION-grain field (Session Start / Session End) would stop the dedupe
// collapsing two same-day sessions and upload the same camper twice. Those two
// are absent from this map on purpose — see EPACT_FIELD_CATALOGUE in server.js.
const EPACT_FIELDS = {
  'Rec ID':                      r => r.recId,
  'First Name':                  r => r.firstName,
  'Last Name':                   r => r.lastName,
  'Household Owner Email':       r => r.email,        // COALESCE(participant, owner)
  'Session Date - Section Name': r => epactLabel(r),
  'Date of Birth':               r => r.dob,
  'Age':                         r => (r.age === '' || r.age == null ? '' : String(r.age)),
  'Grade':                       r => r.grade,
  'Gender':                      r => r.gender,
  'Phone':                       r => r.phone,
  'Household Owner':             r => r.owner,
  'Owner Email':                 r => r.ownerEmail,   // owner.email ALONE — not hers
  'Owner Phone':                 r => r.ownerPhone,
  'Section':                     r => r.section,
  'Class':                       r => r.className,
  'Session Date':                r => epactIsoDate(r.sessionDate),
};

// The org's chosen columns, falling back to the verified five. Anything the
// catalogue does not know is dropped rather than exported as an empty column.
function epactColumns() {
  const c = RS().epactColumns;
  const ok = Array.isArray(c) ? c.filter(h => EPACT_FIELDS[h]) : [];
  return ok.length ? ok : EPACT_HEADERS;
}

// 'MM/DD/YYYY' -> 'YYYY-MM-DD'. String surgery, deliberately not new Date():
// the card emits a bare date and new Date() reads that as UTC midnight, which
// renders as the previous day across the US — the Fast Track date bug, one
// report over.
function epactIsoDate(s) {
  const t = String(s == null ? '' : s).trim();
  const us = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);
  if (us) return us[3] + '-' + us[1].padStart(2, '0') + '-' + us[2].padStart(2, '0');
  const iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(t);
  return iso ? iso[1] + '-' + iso[2] + '-' + iso[3] : '';
}

// Her label is NULL when a section has no session to date it from — TO_CHAR(NULL)
// makes the whole concatenation NULL. So a dateless row exports with an EMPTY
// label rather than a guessed date: putting an invented camp date beside a real
// child's name in a vendor's system is the fabrication this repo keeps refusing.
function epactLabel(r) {
  const d = epactIsoDate(r && r.sessionDate);
  const sec = (r && r.section) || '';
  const fmt = RS().epactLabel || 'date-section';
  // `section` alone needs no date, so it is the one format a dateless row can
  // still fill. The other two keep her behaviour: TO_CHAR(NULL) nulls the whole
  // concatenation, and a guessed camp date beside a real child's name in a
  // vendor's system is the fabrication this export refuses to make.
  if (fmt === 'section') return sec;
  if (!d) return '';
  return fmt === 'section-date' ? sec + ' (' + d + ')' : d + ' - ' + sec;
}

function epactRows(rows, columns) {
  const cols = (columns && columns.length ? columns : EPACT_HEADERS).filter(h => EPACT_FIELDS[h]);
  const seen = new Set(), out = [];
  (rows || []).forEach(r => {
    // Her SQL takes confirmed, not-cancelled bookings only, and the on-screen
    // status pill does NOT loosen that: uploading a child who cancelled hands a
    // camp health vendor a roster with the wrong children on it.
    if (r.status === 'Cancelled') return;
    const tuple = cols.map(h => { const v = EPACT_FIELDS[h](r); return v == null ? '' : String(v); });
    // A separator no field can contain. Joining on a space would collapse two
    // genuinely different people ("Ana Lee Smith" / "Ana Lee" "Smith").
    const key = tuple.join('\u001f');
    if (seen.has(key)) return;               // her SELECT DISTINCT
    seen.add(key);
    out.push(tuple);
  });
  // ORDER BY the concatenated label, then last name, then first — hers exactly.
  // Keyed by COLUMN NAME rather than by position: with a configurable column set
  // index 4 is not necessarily the label any more, and sorting on whatever
  // happens to sit there would reorder the file for no reason.
  const at = h => { const i = cols.indexOf(h); return i < 0 ? null : i; };
  const iL = at('Session Date - Section Name'), iLast = at('Last Name'), iFirst = at('First Name');
  const key = (t, i) => (i == null ? '' : t[i] || '');
  out.sort((a, b) => key(a, iL).localeCompare(key(b, iL))
                  || key(a, iLast).localeCompare(key(b, iLast))
                  || key(a, iFirst).localeCompare(key(b, iFirst)));
  return out;
}

function epactCsv(tuples, columns) {
  const cols = (columns && columns.length ? columns : EPACT_HEADERS).filter(h => EPACT_FIELDS[h]);
  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols].concat(tuples).map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
}

// Is this org still on the column set verified against her Metabase query?
// Order matters — ePACT maps on position as well as header.
function epactVerified(cols) {
  const want = (RSMeta().verifiedEpactColumns || EPACT_HEADERS);
  const have = cols || epactColumns();
  return have.length === want.length && have.every((c, i) => c === want[i]);
}

// A section name goes into a filename, so it has to survive being one.
function epactFileSlug(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48);
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const p = useMemo(() => new URLSearchParams(window.location.search), []);
  const isPrint = p.get('_print') === '1';

  const defaults = useMemo(() => getDefaultRange(null, rsDefaultDays()), []);
  const [startDate, setStartDate] = useState(p.get('start_date') || defaults.start);
  const [endDate, setEndDate]     = useState(p.get('end_date')   || defaults.end);
  const [sectionFilter, setSectionFilter] = useState(p.get('section_name') || '');
  const [statusFilter, setStatusFilter]   = useState(p.get('status') || RS().defaultStatus || 'all');

  const [rows, setRows]       = useState(null);
  const [orgName, setOrgName] = useState('');
  const [staleCacheAt, setStaleCacheAt] = useState(null);
  // When the rows were produced. Only rendered if the org asked for the stamp:
  // a reader looking at two-hour-old enrolments should be able to see that.
  const [dataAt, setDataAt] = useState(null);
  const [logoUrl,  setLogoUrl]  = useState(null);
  const [pdfLoading, setPdfLoading] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState(null);
  const [loadedStart, setLoadedStart]     = useState(null);
  const [loadedEnd, setLoadedEnd]         = useState(null);
  const [loadedSection, setLoadedSection] = useState(null);

  // Saved views
  const [views, setViews] = useState([]);
  const [activeViewId, setActiveViewId] = useState(null);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [rowMenu, setRowMenu] = useState(null);      // id of the view whose ⋯ menu is open
  const [saveForm, setSaveForm] = useState(null);    // open save/rename dialog
  const [viewBusy, setViewBusy] = useState(false);
  const [undoView, setUndoView] = useState(null);    // { id, name } behind the Undo toast
  const pickerRef = useRef(null);

  // Share Link: expose the live applied filter state so the floating Share
  // widget copies a URL that reproduces the on-screen view (mirrors the PDF).
  useEffect(() => {
    window.recShareLink = () => {
      const qs = new URLSearchParams();
      qs.set('start_date', loadedStart || startDate);
      qs.set('end_date',   loadedEnd   || endDate);
      const sec = (loadedSection != null ? loadedSection : sectionFilter);
      if (sec) qs.set('section_name', sec);
      if (URL_TOKEN) qs.set('token', URL_TOKEN);
      return `${window.location.pathname}?${qs.toString()}`;
    };
    return () => { try { delete window.recShareLink; } catch (e) { window.recShareLink = undefined; } };
  }, [loadedStart, loadedEnd, loadedSection, startDate, endDate, sectionFilter]);

  // In print/PDF mode the columns travel on the URL (Puppeteer starts with empty
  // localStorage); otherwise fall back to the saved/default columns.
  const [cols, setCols] = useState(() => {
    const cp = p.get('cols');
    if (cp) { try { return { ...COL_DEFAULTS, ...JSON.parse(cp) }; } catch {} }
    return loadCols();
  });
  const toggleCol = useCallback(key => {
    setCols(prev => { const next = { ...prev, [key]: !prev[key] }; saveCols(next); return next; });
  }, []);

  // ── Form-response question multiselect ──
  // selectedQs: null = show all questions; array = explicit list of question titles to show.
  const [selectedQs, setSelectedQs] = useState(() => {
    const qp = p.get('questions');
    if (qp) { try { const arr = JSON.parse(qp); if (Array.isArray(arr)) return arr; } catch {} }
    return null;
  });
  const [qPanelOpen, setQPanelOpen] = useState(false);

  const availableQuestions = useMemo(() => {
    if (!rows) return [];
    const seen = [], seenSet = new Set();
    rows.forEach(r => (r.formResponses || []).forEach(qa => {
      if (!seenSet.has(qa.q)) { seenSet.add(qa.q); seen.push(qa.q); }
    }));
    return seen.map((q, i) => ({ q, idx: i + 1 }));
  }, [rows]);

  // Reconcile selection when the available question set changes (new report / different form).
  useEffect(() => {
    setSelectedQs(prev => {
      if (prev === null) return null;
      const avail = new Set(availableQuestions.map(a => a.q));
      const kept = prev.filter(q => avail.has(q));
      return kept.length ? kept : null;            // nothing matches → fall back to "all"
    });
  }, [availableQuestions]);

  const toggleQ = useCallback((q) => {
    setSelectedQs(prev => {
      const all = availableQuestions.map(a => a.q);
      const base = prev === null ? all : prev;
      return base.includes(q) ? base.filter(x => x !== q) : [...base, q];
    });
  }, [availableQuestions]);

  const orgSlug = useMemo(() => window.location.pathname.split('/').filter(Boolean)[0] || '', []);

  useEffect(() => { if (isPrint) document.body.classList.add('print-mode'); }, [isPrint]);

  const fetchData = useCallback((sd, ed, sec, force) => {
    setLoading(true); setError(null);
    const qs = new URLSearchParams();
    if (sd) qs.set('start_date', sd);
    if (ed) qs.set('end_date', ed);
    if (sec && sec.trim()) qs.set('section_name', sec.trim());
    if (force || p.get('_nocache') === '1' || p.get('_refresh') === '1') qs.set('_nocache', '1');

    fetch(withToken(`/${orgSlug}/roster/api/data?${qs}`))
      .then(r => { if (!r.ok) throw new Error(`Server returned ${r.status}`); return r.json(); })
      .then(json => {
        setRows(json.rows.map(normalizeRow));
        if (json.rows.length > 0 && json.rows[0]['Org Name']) setOrgName(json.rows[0]['Org Name']);
        setLogoUrl(json.meta?.logo_url || null);
        setStaleCacheAt(json.meta?.stale_cache ? json.meta.cached_at : null);
        setDataAt(json.meta?.generated_at || json.meta?.cached_at || null);
        setLoadedStart(sd); setLoadedEnd(ed); setLoadedSection(sec || '');
      })
      .catch(err => setError(err.message))
      .finally(() => setLoading(false));
  }, [orgSlug]);

  // `autoRun: false` lets a big org land on an empty, filtered-first view instead
  // of paying for a query nobody asked for — Dan's "start tightly filtered, then
  // set dates and type a partial section name" workflow taken one step further.
  useEffect(() => {
    if (RS().autoRun === false && !isPrint && !p.get('section_name') && !p.get('view')) {
      setRows([]);
      return;
    }
    fetchData(startDate, endDate, sectionFilter);
  }, []);

  function handleRun() { fetchData(startDate, endDate, sectionFilter); }

  // ── Saved views ───────────────────────────────────────────────────────────
  // The filter query string a view would store, built from what is on screen.
  // Empty when nothing is filtered, so an unfiltered report never carries
  // "section_name=" and read back as filtered.
  const currentFilterParams = useMemo(() => {
    const qs = new URLSearchParams();
    if (sectionFilter.trim()) qs.set('section_name', sectionFilter.trim());
    if (statusFilter && statusFilter !== 'all') qs.set('status', statusFilter);
    return qs.toString();
  }, [sectionFilter, statusFilter]);

  const activeView = useMemo(
    () => views.find(v => v.id === activeViewId) || null,
    [views, activeViewId]
  );

  // "Edited" = the filters, or the range for a view that carries one, have moved
  // off what the view stores. The column toggles and question picker are
  // deliberately excluded: collapsing a column must not light up Save.
  const viewDirty = useMemo(() => {
    if (!activeView) return false;
    if (activeView.params !== currentFilterParams) return true;
    if (activeView.dateMode === 'fixed') {
      return startDate !== activeView.fixedStart || endDate !== activeView.fixedEnd;
    }
    if (activeView.dateMode === 'relative') {
      const r = resolveSavedRange(activeView.relativeRange);
      return startDate !== r.start || endDate !== r.end;
    }
    return false;
  }, [activeView, currentFilterParams, startDate, endDate]);

  const viewsUrl = suffix => withToken('/' + orgSlug + '/roster/api/views' + (suffix || ''));

  const loadViews = useCallback(() => {
    return fetch(viewsUrl())
      .then(r => (r.ok ? r.json() : null))
      .then(j => { if (j) setViews(j.views || []); return j; })
      .catch(() => null);
  }, [orgSlug]);

  // Put the view's filters on screen. `announce` is false for the automatic
  // restore on page load — that is not a user action worth logging.
  function applyView(v, announce) {
    const f = parseViewParams(v.params);
    setSectionFilter(f.section_name);
    setStatusFilter(f.status || 'all');
    setActiveViewId(v.id);
    try { localStorage.setItem(LS_LAST_VIEW + orgSlug, v.id); } catch (_) {}

    // Dates: a view either pins them, resolves a relative range, or leaves
    // whatever range you are already on entirely alone.
    let range = null;
    if (v.dateMode === 'fixed')    range = { start: v.fixedStart, end: v.fixedEnd };
    if (v.dateMode === 'relative') range = resolveSavedRange(v.relativeRange);
    if (range) { setStartDate(range.start); setEndDate(range.end); }

    // A roster's section filter is passed to the CARD, not just applied on
    // screen, so applying a view has to re-run the query when the section or the
    // range moves. That is the difference from the GL report, whose filters are
    // all client-side over rows already loaded — there, applying a view never
    // needs the network.
    const sd = range ? range.start : startDate;
    const ed = range ? range.end   : endDate;
    if (sd !== loadedStart || ed !== loadedEnd || (f.section_name || '') !== (loadedSection || '')) {
      fetchData(sd, ed, f.section_name);
    }

    // Keep the URL honest: it reproduces the filters AND names the view.
    try {
      const qs = new URLSearchParams(window.location.search);
      ROSTER_VIEW_PARAMS.forEach(k => qs.delete(k));
      new URLSearchParams(v.params).forEach((val, k) => qs.set(k, val));
      qs.set('view', v.id);
      if (range) { qs.set('start_date', range.start); qs.set('end_date', range.end); }
      window.history.replaceState(null, '', window.location.pathname + '?' + qs);
    } catch (_) {}

    if (announce) logClientEvent('view-apply', { view: v.name });
    setPickerOpen(false);
    setRowMenu(null);
  }

  // "Default view" is the absence of a saved view: no filters at all. The date
  // range is deliberately left alone — clearing a filter is not a request to
  // jump back to the default fortnight.
  function clearView() {
    setSectionFilter('');
    setStatusFilter('all');
    setActiveViewId(null);
    try { localStorage.removeItem(LS_LAST_VIEW + orgSlug); } catch (_) {}
    if (loadedSection) fetchData(startDate, endDate, '');
    try {
      const qs = new URLSearchParams(window.location.search);
      ROSTER_VIEW_PARAMS.concat(['view']).forEach(k => qs.delete(k));
      const q = qs.toString();
      window.history.replaceState(null, '', window.location.pathname + (q ? '?' + q : ''));
    } catch (_) {}
    setPickerOpen(false);
    setRowMenu(null);
  }

  async function submitView(form) {
    setViewBusy(true);
    try {
      const payload = {
        name: form.name.trim(),
        dateMode: form.dateMode,
        relativeRange: form.dateMode === 'relative' ? form.relativeRange : null,
        fixedStart: form.dateMode === 'fixed' ? startDate : null,
        fixedEnd:   form.dateMode === 'fixed' ? endDate   : null,
      };
      if (!form.renameOnly) payload.params = currentFilterParams;
      const isPatch = !!form.targetId;
      if (!isPatch) payload.replace = !!form.replace;
      const resp = await fetch(viewsUrl(isPatch ? '/' + form.targetId : ''), {
        method: isPatch ? 'PATCH' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.status === 409 && data.existingId) {
        // Same name, different view: ask before overwriting a colleague's.
        if (!window.confirm('A view named "' + payload.name + '" already exists. Replace it?')) return;
        return submitView(Object.assign({}, form, { replace: true }));
      }
      if (!resp.ok) { alert(data.error || 'Could not save the view.'); return; }
      await loadViews();
      setActiveViewId(data.view.id);
      try { localStorage.setItem(LS_LAST_VIEW + orgSlug, data.view.id); } catch (_) {}
      setSaveForm(null);
    } catch (e) {
      alert('Could not save the view: ' + e.message);
    } finally {
      setViewBusy(false);
    }
  }

  // Soft delete on the server, so the Undo below is a restore rather than a
  // re-save. The list is shared by the whole org — a mis-click has to be cheap.
  async function deleteView(v) {
    setRowMenu(null);
    try {
      const resp = await fetch(viewsUrl('/' + v.id), { method: 'DELETE', headers: { 'x-token': URL_TOKEN || '' } });
      if (!resp.ok) { const d = await resp.json().catch(() => ({})); alert(d.error || 'Could not delete the view.'); return; }
      if (activeViewId === v.id) setActiveViewId(null);
      await loadViews();
      setUndoView({ id: v.id, name: v.name });
    } catch (e) {
      alert('Could not delete the view: ' + e.message);
    }
  }

  async function restoreView(id) {
    setUndoView(null);
    try {
      const resp = await fetch(viewsUrl('/' + id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ restore: true }),
      });
      const d = await resp.json().catch(() => ({}));
      if (!resp.ok) { alert(d.error || 'Could not restore the view.'); return; }
      await loadViews();
    } catch (e) {
      alert('Could not restore the view: ' + e.message);
    }
  }

  // Load the list, then decide what we are looking at: an explicit ?view= wins;
  // failing that, and only when the URL carries no filters of its own, fall back
  // to the last view used in this browser.
  useEffect(() => {
    if (isPrint) return;   // the PDF renderer gets its filters from the URL
    loadViews().then(j => {
      if (!j || !Array.isArray(j.views)) return;
      const urlQs = new URLSearchParams(window.location.search);
      const named = urlQs.get('view');
      const hit = named && j.views.find(v => v.id === named);
      if (hit) { applyView(hit, false); return; }
      if (ROSTER_VIEW_PARAMS.some(k => urlQs.get(k))) return;
      let lastId = null;
      try { lastId = localStorage.getItem(LS_LAST_VIEW + orgSlug); } catch (_) {}
      const last = lastId && j.views.find(v => v.id === lastId);
      if (last) applyView(last, false);
    });
  }, []);

  // The Undo window is short on purpose — it is an undo, not a trash can.
  useEffect(() => {
    if (!undoView) return;
    const t = setTimeout(() => setUndoView(null), 10000);
    return () => clearTimeout(t);
  }, [undoView]);

  useEffect(() => {
    if (!pickerOpen) return;
    function onDown(e) {
      if (pickerRef.current && !pickerRef.current.contains(e.target)) { setPickerOpen(false); setRowMenu(null); }
    }
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [pickerOpen]);

  // Something is worth saving when a filter is active, or when the applied view
  // has drifted off what it stores. Otherwise Save stays greyed out.
  const canSaveView = !!currentFilterParams || (activeView && viewDirty);

  function openSaveDialog() {
    setPickerOpen(false);
    setRowMenu(null);
    setSaveForm(activeView && viewDirty
      ? { name: activeView.name, targetId: activeView.id, dateMode: activeView.dateMode,
          relativeRange: activeView.relativeRange || defaultSavedRange() }
      : { name: '', targetId: null, dateMode: 'current', relativeRange: defaultSavedRange() });
  }

  function renderViewPicker() {
    const chips = [];
    if (sectionFilter.trim()) {
      chips.push({ key: 'section_name', label: '"' + sectionFilter.trim() + '"',
                   clear: () => { setSectionFilter(''); if (loadedSection) fetchData(startDate, endDate, ''); } });
    }
    if (statusFilter && statusFilter !== 'all') {
      chips.push({ key: 'status', label: ROSTER_STATUS_LABELS[statusFilter] || statusFilter,
                   clear: () => setStatusFilter('all') });
    }

    return (
      <>
        <div className="view-wrap" ref={pickerRef}>
          <button
            className={'btn-view' + (activeView ? ' active' : '')}
            onClick={() => { setPickerOpen(o => !o); setRowMenu(null); }}
            title="Saved views — named filter sets shared across this organization"
          >
            <span className="vname">{activeView ? activeView.name : 'Default view'}</span>
            {activeView && viewDirty && <span className="vdirty">· edited</span>}
            <span className="vcaret">▾</span>
          </button>

          <button
            className="btn-save-view"
            disabled={!canSaveView}
            onClick={openSaveDialog}
            title={canSaveView
              ? 'Save the current filters as a named view'
              : 'Set a filter first — there is nothing to save yet'}
          >Save view</button>

          {pickerOpen && (
            <div className="view-dropdown">
              <div className="view-row" onClick={clearView}>
                <span className="vtick">{activeView ? '' : '✓'}</span>
                <span className="vmain">Default view<span className="vsub">no filters</span></span>
              </div>

              {views.length === 0 && (
                <div className="view-empty">No saved views yet. Filter to a section, then hit “Save view”.</div>
              )}

              {views.map(v => (
                <div key={v.id}>
                  <div className="view-row" data-view-row={v.name} onClick={() => applyView(v, true)}>
                    <span className="vtick">{v.id === activeViewId ? '✓' : ''}</span>
                    <span className="vmain">
                      {v.name}
                      <span className="vsub">{viewDateLabel(v)} · {viewFilterSummary(v)}</span>
                    </span>
                    <button
                      className="vmenu"
                      onClick={e => { e.stopPropagation(); setRowMenu(rowMenu === v.id ? null : v.id); }}
                      title="Rename, update or delete this view"
                    >⋯</button>
                  </div>
                  {rowMenu === v.id && (
                    <div className="view-actions">
                      <button onClick={() => { setRowMenu(null); setSaveForm({ name: v.name, targetId: v.id, renameOnly: true, dateMode: v.dateMode, relativeRange: v.relativeRange || defaultSavedRange() }); }}>
                        Rename…
                      </button>
                      <button
                        onClick={() => submitView({ name: v.name, targetId: v.id, dateMode: v.dateMode, relativeRange: v.relativeRange })}
                        disabled={!currentFilterParams && !activeView}
                        title="Replace this view's filters with what is on screen now"
                      >Update to current filters</button>
                      <button className="danger" onClick={() => deleteView(v)}>Delete</button>
                    </div>
                  )}
                </div>
              ))}

              <div className="view-row view-add" onClick={openSaveDialog}>
                <span className="vtick">＋</span>
                <span className="vmain">Save current view…</span>
              </div>
            </div>
          )}
        </div>

        {chips.map(c => (
          <span key={c.key} className="filter-chip">
            <span className="clabel">{c.label}</span>
            <button onClick={c.clear} title="Clear this filter">✕</button>
          </span>
        ))}
      </>
    );
  }

  function renderSaveDialog() {
    const f = saveForm;
    if (!f) return null;
    const ranges = savedViewRanges();
    const radio = (mode, label, hint) => (
      <label style={{display:'flex',alignItems:'flex-start',gap:8,fontSize:13,color:'#333',cursor:'pointer',marginBottom:6}}>
        <input type="radio" checked={f.dateMode === mode} onChange={() => setSaveForm(x => ({...x, dateMode: mode}))} style={{marginTop:3}} />
        <span>{label}<br/><span style={{fontSize:11,color:'#888'}}>{hint}</span></span>
      </label>
    );
    return (
      <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center'}}
           onClick={e => { if (e.target === e.currentTarget) setSaveForm(null); }}>
        <div style={{background:'#fff',borderRadius:12,padding:'26px 30px',width:440,maxWidth:'92vw',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
          <h3 style={{margin:'0 0 4px',fontSize:18,color:'#111'}}>
            {f.renameOnly ? 'Rename view' : f.targetId ? 'Update view' : 'Save view'}
          </h3>
          <p style={{margin:'0 0 16px',fontSize:12,color:'#777'}}>
            Saved views are shared with everyone who has this report's link.
          </p>

          <label style={{display:'block',fontSize:11,textTransform:'uppercase',letterSpacing:'.5px',color:'#888',marginBottom:4}}>Name</label>
          <input
            autoFocus
            value={f.name}
            maxLength={60}
            onChange={e => setSaveForm(x => ({...x, name: e.target.value}))}
            onKeyDown={e => { if (e.key === 'Enter' && f.name.trim()) submitView(f); }}
            placeholder="Hackberry Hill after school"
            style={{width:'100%',padding:'7px 10px',border:'1px solid #ddd',borderRadius:6,fontSize:14,fontFamily:'inherit',marginBottom:16,color:'#111'}}
          />

          {!f.renameOnly && (
            <div style={{background:'#f6f7f8',border:'1px solid #eee',borderRadius:8,padding:'10px 12px',marginBottom:16,fontSize:12,color:'#444'}}>
              <strong>Filters saved:</strong>{' '}
              {viewFilterSummary({ params: currentFilterParams })}
              <div style={{marginTop:4,fontSize:11,color:'#888'}}>
                Columns and form questions aren’t saved — those stay per person.
              </div>
            </div>
          )}

          <label style={{display:'block',fontSize:11,textTransform:'uppercase',letterSpacing:'.5px',color:'#888',marginBottom:6}}>Dates</label>
          {radio('current', "Don't save dates", 'Opens on whatever range you are already looking at. Best for a section you check every week.')}
          {radio('relative', 'Save a relative range', 'Recalculated every time the view is opened.')}
          {f.dateMode === 'relative' && (
            <select
              value={f.relativeRange}
              onChange={e => setSaveForm(x => ({...x, relativeRange: e.target.value}))}
              style={{margin:'0 0 8px 26px',padding:'5px 8px',border:'1px solid #ddd',borderRadius:6,fontSize:13,fontFamily:'inherit',color:'#111'}}
            >
              {ranges.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
            </select>
          )}
          {radio('fixed', 'Pin these exact dates', 'Stays on ' + fmtShortDate(startDate) + ' – ' + fmtShortDate(endDate) + ' forever. For a camp that has finished.')}

          <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:20}}>
            <button
              onClick={() => setSaveForm(null)}
              style={{padding:'7px 14px',border:'1px solid #ddd',borderRadius:6,background:'#fff',fontSize:13,fontFamily:'inherit',cursor:'pointer',color:'#555'}}
            >Cancel</button>
            {f.targetId && !f.renameOnly && (
              <button
                onClick={() => setSaveForm(x => ({...x, targetId: null}))}
                style={{padding:'7px 14px',border:'1px solid #ddd',borderRadius:6,background:'#fff',fontSize:13,fontFamily:'inherit',cursor:'pointer',color:'#555'}}
              >Save as new instead</button>
            )}
            <button
              disabled={!f.name.trim() || viewBusy}
              onClick={() => submitView(f)}
              style={{padding:'7px 16px',border:'none',borderRadius:6,background:!f.name.trim()||viewBusy?'#9db6e8':'#2563eb',color:'#fff',fontSize:13,fontWeight:600,fontFamily:'inherit',cursor:!f.name.trim()||viewBusy?'default':'pointer'}}
            >{viewBusy ? 'Saving…' : f.targetId ? (f.renameOnly ? 'Rename' : 'Update “' + f.name.trim() + '”') : 'Save view'}</button>
          </div>
        </div>
      </div>
    );
  }


  // ── Report settings panel ─────────────────────────────────────────────────
  // Grouped by BLAST RADIUS rather than by category, because "default columns"
  // and "cache lifetime" are not the same kind of decision: one seeds a first
  // render, the other spends Metabase time on a card every org shares.
  const [setOpen, setSetOpen] = useState(false);
  const [setDraft, setSetDraft] = useState(null);
  const [setBusy, setSetBusy] = useState(false);
  const [setErr, setSetErr] = useState(null);

  function openSettings() {
    setSetErr(null);
    setSetDraft(Object.assign({}, RSMeta().defaults || {}, RS()));
    setSetOpen(true);
  }

  async function saveSettings(patch) {
    setSetBusy(true); setSetErr(null);
    try {
      const resp = await fetch(withToken('/' + orgSlug + '/roster/api/settings'), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(patch),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) { setSetErr(data.error || 'Could not save the settings.'); return; }
      // The saved settings decide the FIRST render — the window, the seeded
      // columns, which controls exist — so the honest thing after a save is a
      // reload rather than half-applying them to a page already in flight.
      window.location.reload();
    } catch (e) {
      setSetErr('Could not save the settings: ' + e.message);
    } finally {
      setSetBusy(false);
    }
  }

  function renderSettings() {
    if (!setOpen || !setDraft) return null;
    const d = setDraft;
    const meta = RSMeta();
    const put = (k, v) => setSetDraft(x => Object.assign({}, x, { [k]: v }));
    const flag = (k, sub, v) => setSetDraft(x =>
      Object.assign({}, x, { [k]: Object.assign({}, x[k] || {}, { [sub]: v }) }));

    const catalogue = meta.epactCatalogue || EPACT_HEADERS;
    const chosen = Array.isArray(d.epactColumns) && d.epactColumns.length ? d.epactColumns : EPACT_HEADERS;
    const verified = (meta.verifiedEpactColumns || EPACT_HEADERS);
    const isVerified = chosen.length === verified.length && chosen.every((c, i) => c === verified[i]);

    // The cost of the cache dial, computed rather than described: the roster runs
    // on a card every org shares, so a short TTL multiplies across all of them.
    const ttlMin = Number(d.cacheTtlMin) || 120;
    const floor = meta.ttlFloorMin || 30;
    const perDay = Math.round(24 * 60 / ttlMin);
    const orgs = meta.orgCount || 1;

    const grp = (sev, blast, title, why, body) => (
      <div className="rs-grp" data-sev={sev} data-rs-group={sev}>
        <div className="rs-grp-head">
          <span className="rs-stripe" />
          <div>
            <span className="rs-blast">{blast}</span>
            <h4>{title}</h4>
            <p>{why}</p>
          </div>
        </div>
        <div className="rs-grp-body">{body}</div>
      </div>
    );

    return (
      <div className="rs-back" onClick={e => { if (e.target === e.currentTarget) setSetOpen(false); }}>
        <div className="rs-sheet" role="dialog" aria-label="Class Roster settings">
          <div className="rs-head">
            <h3>⚙ Class Roster settings</h3>
            <span className="rs-who">Applies to everyone with this report's link</span>
            <button className="rs-x" onClick={() => setSetOpen(false)} aria-label="Close">✕</button>
          </div>

          <div className="rs-body">
            {grp('safe', 'Low risk · display only', 'What the report opens on',
              'A starting point, not a lock. Each reader’s own column toggles still win afterwards and still persist in their browser.',
              <>
                <div className="rs-row">
                  <label className="rs-field">
                    <span>Default window</span>
                    <select value={d.defaultDays} onChange={e => put('defaultDays', Number(e.target.value))}>
                      {[7, 14, 21, 30, 60, 90].map(n => <option key={n} value={n}>Next {n} days</option>)}
                    </select>
                    {d.defaultDays > ROSTER_WIDE_WINDOW_DAYS && (
                      <span className="rs-warn" data-rs-wide>
                        ⚠ Over {ROSTER_WIDE_WINDOW_DAYS} days gets heavy — the roster prints a block per
                        session date, and a calendar month at a big org is ~380 pages and 12,000 rows
                        before anyone has filtered. Readers can always widen it themselves.
                      </span>
                    )}
                  </label>
                  <label className="rs-field">
                    <span>Default status</span>
                    <select value={d.defaultStatus} onChange={e => put('defaultStatus', e.target.value)}>
                      <option value="all">All</option>
                      <option value="enrolled">Enrolled only</option>
                      <option value="cancelled">Cancelled only</option>
                    </select>
                  </label>
                  <label className="rs-field">
                    <span>On open</span>
                    <select value={d.autoRun ? '1' : '0'} onChange={e => put('autoRun', e.target.value === '1')}>
                      <option value="1">Run immediately</option>
                      <option value="0">Wait for Run Report</option>
                    </select>
                  </label>
                </div>

                <div className="rs-field">
                  <span>Default columns · {Object.keys(d.cols || {}).filter(k => (d.cols || {})[k]).length} of {Object.keys(COL_DEFAULTS).length} on</span>
                  <div className="rs-tgrid" data-rs-cols>
                    {Object.keys(COL_DEFAULTS).map(k => (
                      <button key={k} type="button" className="rs-tg" data-col={k}
                        aria-pressed={!!(d.cols || {})[k]}
                        onClick={() => flag('cols', k, !(d.cols || {})[k])}>{COL_LABELS[k] || k}</button>
                    ))}
                  </div>
                </div>

                <div className="rs-field">
                  <span>Controls this org uses</span>
                  <div className="rs-tgrid" data-rs-hide>
                    {(meta.hideable || []).map(k => (
                      <button key={k} type="button" className="rs-tg" data-hide={k}
                        aria-pressed={!(d.hide || {})[k]}
                        onClick={() => flag('hide', k, !(d.hide || {})[k])}>{HIDE_LABELS[k] || k}</button>
                    ))}
                  </div>
                  <p className="rs-hint">Off removes the control rather than greying it out — a button that never works is worse than no button.</p>
                </div>
              </>)}

            {grp('warn', 'Costs Metabase time · shared card', 'How fresh the data is',
              'The Class Roster runs on a card every org shares, so shortening one org’s cache multiplies queries against that card for everyone.',
              <>
                <div className="rs-field rs-meter">
                  <span>Cache lifetime — <b data-rs-ttl>{ttlMin >= 60 ? (ttlMin / 60) + (ttlMin === 60 ? ' hour' : ' hours') : ttlMin + ' minutes'}</b></span>
                  <input type="range" min="0" max="6" step="1"
                    value={String(TTL_STEPS.findIndex(v => v === ttlMin) >= 0 ? TTL_STEPS.findIndex(v => v === ttlMin) : 3)}
                    onChange={e => put('cacheTtlMin', TTL_STEPS[Number(e.target.value)])} />
                  <div className="rs-cost" data-rs-cost={String(perDay * orgs)}>
                    <span><b>{perDay}</b> refreshes / org / day</span>
                    <span className={ttlMin <= floor ? 'hot' : ''}><b>{(perDay * orgs).toLocaleString('en-US')}</b> card queries / day · {orgs} orgs</span>
                    <span><b>{ttlMin >= 60 ? Math.floor(ttlMin / 60) + 'h ' + String(ttlMin % 60).padStart(2, '0') + 'm' : ttlMin + 'm'}</b> worst-case staleness</span>
                  </div>
                  <p className="rs-hint">Floor is {floor} minutes. Below that this stops being a preference and becomes a load decision.</p>
                </div>

                <div className="rs-field">
                  <span>Freshness &amp; warm-up</span>
                  <div className="rs-tgrid">
                    <button type="button" className="rs-tg" data-stamp
                      aria-pressed={!!d.showStamp}
                      onClick={() => put('showStamp', !d.showStamp)}>Show a “Data as of” stamp</button>
                    <button type="button" className="rs-tg" data-warm
                      aria-pressed={!!d.warmDefaultWindow}
                      onClick={() => put('warmDefaultWindow', !d.warmDefaultWindow)}>Pre-warm the default window</button>
                  </div>
                  <p className="rs-hint">
                    Pre-warming costs one Metabase query per day and makes the first open of the day
                    instant instead of a cold query. Off by default so the extra load is a choice.
                  </p>
                </div>
              </>)}

            {grp('strict', 'Changes a file a vendor imports', 'The ePACT export',
              'These columns were verified byte-for-byte against the Metabase query Apex runs by hand — 68 rows, identical, same order. Editing them edits a file that goes to a HIPAA vendor.',
              <>
                <div className="rs-field">
                  <span>Columns, in order</span>
                  <div className="rs-cols" data-rs-epact>
                    {chosen.map((h, i) => (
                      <div className="rs-col-item" key={h}>
                        <span className="rs-src">{i + 1}</span>
                        <b>{h}</b>
                        <span className="rs-col-acts">
                          <button type="button" onClick={() => {
                            if (i === 0) return;
                            const next = chosen.slice();
                            next[i - 1] = chosen[i]; next[i] = chosen[i - 1];
                            put('epactColumns', next);
                          }} aria-label={'Move ' + h + ' up'}>↑</button>
                          <button type="button" disabled={chosen.length <= 1}
                            onClick={() => put('epactColumns', chosen.filter(c => c !== h))}
                            aria-label={'Remove ' + h}>✕</button>
                        </span>
                      </div>
                    ))}
                  </div>
                  <select value="" style={{marginTop:8}} data-rs-epact-add
                    onChange={e => { if (e.target.value) put('epactColumns', chosen.concat([e.target.value])); }}>
                    <option value="">＋ Add a column…</option>
                    {catalogue.filter(h => chosen.indexOf(h) < 0)
                      .map(h => <option key={h} value={h}>{h}</option>)}
                  </select>
                </div>

                <div className={'rs-verified' + (isVerified ? '' : ' drifted')} data-rs-verified={isVerified ? '1' : '0'}>
                  {isVerified
                    ? '✓ Matches the Apex-verified template exactly — ' + chosen.length + ' columns, original order'
                    : '⚠ ' + chosen.length + ' columns — no longer the Apex-verified template. Confirm this org’s ePACT account accepts this mapping before uploading.'}
                </div>

                <div className="rs-row">
                  <label className="rs-field">
                    <span>Group label</span>
                    <select value={d.epactLabel} onChange={e => put('epactLabel', e.target.value)}>
                      <option value="date-section">YYYY-MM-DD - Section Name</option>
                      <option value="section">Section Name only</option>
                      <option value="section-date">Section Name (YYYY-MM-DD)</option>
                    </select>
                  </label>
                  <label className="rs-field">
                    <span>File encoding</span>
                    <select value={d.epactBom ? '1' : '0'} onChange={e => put('epactBom', e.target.value === '1')}>
                      <option value="1">UTF-8 with BOM — matches Metabase</option>
                      <option value="0">UTF-8, no BOM</option>
                    </select>
                  </label>
                </div>
              </>)}
          </div>

          {setErr && <div className="rs-err">{setErr}</div>}

          <div className="rs-foot">
            <button className="rs-save" disabled={setBusy}
              onClick={() => saveSettings(Object.assign({}, d, { epactColumns: chosen }))}>
              {setBusy ? 'Saving…' : 'Save settings'}
            </button>
            <button className="rs-ghost" onClick={() => setSetOpen(false)}>Cancel</button>
            <button className="rs-ghost" disabled={setBusy}
              onClick={() => { if (window.confirm('Reset this report to the platform defaults for every reader?')) saveSettings({ reset: true }); }}>
              Reset to defaults
            </button>
            <span className="rs-footnote">Applies on the next load. Nobody’s own column choices are touched.</span>
          </div>
        </div>
      </div>
    );
  }

  function renderUndoToast() {
    if (!undoView) return null;
    return (
      <div className="view-toast">
        <span>Deleted “{undoView.name}”</span>
        <button onClick={() => restoreView(undoView.id)}>Undo</button>
      </div>
    );
  }

  function setDays(n) {
    const r = getDefaultRange(null, rsDefaultDays());
    if (n === rsDefaultDays()) { setStartDate(r.start); setEndDate(r.end); return; }
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    setStartDate(toISO(start));
    setEndDate(toISO(new Date(start.getFullYear(), start.getMonth(), start.getDate() + n - 1)));
  }

  function setMonth(offset) {
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    const last   = new Date(target.getFullYear(), target.getMonth() + 1, 0);
    setStartDate(toISO(target)); setEndDate(toISO(last));
  }

  const paramsChanged = loadedSection !== null && (
    startDate !== loadedStart || endDate !== loadedEnd
  );

  const sectionFilteredRows = useMemo(() => {
    if (!rows) return [];
    const secLower = sectionFilter.trim().toLowerCase();
    return !secLower ? rows : rows.filter(r => r.section.toLowerCase().includes(secLower));
  }, [rows, sectionFilter]);

  const counts = useMemo(() => ({
    all:       sectionFilteredRows.length,
    enrolled:  sectionFilteredRows.filter(r => r.status === 'Enrolled').length,
    cancelled: sectionFilteredRows.filter(r => r.status === 'Cancelled').length,
  }), [sectionFilteredRows]);

  const displayRows = useMemo(() => {
    if (!rows) return [];
    // Belt-and-suspenders: in print mode, apply filters from URL directly
    const isPrint = new URLSearchParams(window.location.search).get('_print') === '1';
    const urlSection = new URLSearchParams(window.location.search).get('section_name');
    const urlStatus = new URLSearchParams(window.location.search).get('status');
    const secLower = (isPrint && urlSection ? urlSection : sectionFilter).trim().toLowerCase();
    const statFilter = (isPrint && urlStatus ? urlStatus : statusFilter);
    return rows.filter(r => {
      const statusOk =
        statFilter === 'all' || !statFilter ||
        (statFilter === 'enrolled'  && r.status === 'Enrolled') ||
        (statFilter === 'cancelled' && r.status === 'Cancelled');
      const sectionOk = !secLower || r.section.toLowerCase().includes(secLower);
      return statusOk && sectionOk;
    });
  }, [rows, statusFilter, sectionFilter]);
