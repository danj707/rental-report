<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Roster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #1a1a1a;
      background: #f5f4f1;
      line-height: 1.35;
    }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      background: #2c2c2c; color: #eee;
      font-size: 12px; flex-wrap: wrap;
    }
    .toolbar-title { font-weight: 700; font-size: 13px; margin-right: 4px; white-space: nowrap; }
    .toolbar-divider { width: 1px; height: 24px; background: rgba(255,255,255,.18); margin: 0 2px; }
    .toolbar-spacer { flex: 1; }

    .toolbar label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      color: #aaa; display: flex; flex-direction: column; gap: 2px;
    }
    .toolbar input[type="date"],
    .toolbar input[type="text"] {
      padding: 4px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px;
      background: rgba(255,255,255,.1); color: #fff; font-size: 12px; font-family: inherit; outline: none;
    }
    .toolbar input[type="date"]:focus,
    .toolbar input[type="text"]:focus { border-color: #3b82f6; }
    .toolbar input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .toolbar input[type="text"]::placeholder { color: #777; }

    .toolbar button {
      padding: 5px 12px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px;
      background: rgba(255,255,255,.08); color: #fff; font-size: 11px; font-family: inherit;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .toolbar button:hover { background: rgba(255,255,255,.18); }
    .toolbar .btn-run  { background: #16a34a; border-color: #16a34a; font-weight: 600; font-size: 12px; padding: 5px 14px; }
    .toolbar .btn-run:hover { background: #15803d; }
    .toolbar .btn-run:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-pdf { background: #3b82f6; border-color: #3b82f6; font-weight: 600; }
    .toolbar .btn-pdf:hover { background: #2563eb; }
    .toolbar .btn-pdf:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-excel { background: #16803c; border-color: #16803c; font-weight: 600; }
    .toolbar .btn-excel:hover { background: #15692f; }
    .toolbar .btn-excel:disabled { opacity: .5; cursor: not-allowed; }
    /* ePACT is an upload to an outside vendor, so it reads as its own action
       rather than a third shade of the export buttons beside it. */
    .toolbar .btn-epact { background: #6d28d9; border-color: #6d28d9; font-weight: 600; }
    .toolbar .btn-epact:hover { background: #5b21b6; }
    .toolbar .btn-epact:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .row-count { font-size: 11px; color: #aaa; }

    /* status filter pills */
    .status-pills { display: flex; gap: 4px; }
    .status-pill {
      padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent; white-space: nowrap;
      transition: background .12s, border-color .12s;
    }
    .status-pill-all     { background: rgba(255,255,255,.1); color: #ddd; }
    .status-pill-all.active { background: #e5e7eb; color: #111; }
    .status-pill-enrolled { background: rgba(22,163,74,.15); color: #4ade80; border-color: rgba(22,163,74,.3); }
    .status-pill-enrolled.active { background: #16a34a; color: #fff; }
    .status-pill-cancelled { background: rgba(239,68,68,.1); color: #f87171; border-color: rgba(239,68,68,.3); }
    .status-pill-cancelled.active { background: #dc2626; color: #fff; }

    /* col toggle buttons */
    .col-toggle {
      padding: 3px 9px; border-radius: 4px; font-size: 10px; cursor: pointer; white-space: nowrap;
      background: rgba(255,255,255,.07); color: #aaa; border: 1px solid rgba(255,255,255,.15);
      transition: background .12s, color .12s;
    }
    .col-toggle.on { background: rgba(59,130,246,.25); color: #93c5fd; border-color: rgba(59,130,246,.4); }

    /* ── Form-response question multiselect ── */
    .qfilter { position: relative; display: inline-block; }
    .qfilter-backdrop { position: fixed; inset: 0; z-index: 40; }
    .qfilter-panel {
      position: absolute; top: calc(100% + 4px); left: 0; z-index: 50;
      width: 330px; max-height: 340px; overflow-y: auto;
      background: #1f2430; border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
      box-shadow: 0 8px 26px rgba(0,0,0,.4); padding: 6px;
    }
    .qfilter-head {
      display: flex; gap: 6px; align-items: center;
      padding: 2px 4px 6px; margin-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .qfilter-head .qf-title { flex: 1; font-size: 9.5px; color: #888; text-transform: uppercase; letter-spacing: .05em; }
    .qfilter-head button { padding: 2px 8px; font-size: 10px; }
    .qfilter-item {
      display: flex; gap: 7px; align-items: flex-start;
      padding: 4px 5px; border-radius: 4px;
      font-size: 11px; color: #ddd; line-height: 1.3; cursor: pointer;
    }
    .qfilter-item:hover { background: rgba(255,255,255,.06); }
    .qfilter-item input { margin: 1px 0 0; cursor: pointer; flex-shrink: 0; }
    .qfilter-item .qf-idx { color: #93c5fd; font-weight: 600; }

    /* ── Page ── */
    .page {
      max-width: 1400px; margin: 16px auto; padding: 24px 28px;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* ── Report header ── */
    .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:18px; gap:16px; }
    .report-header-left { display:flex; align-items:center; gap:14px; }
    .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
    .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
    .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
    .report-header-right { text-align:right; }
    .report-header .rh-meta { font-size:11px; color:#666; }

    /* ── Section group ── */
    .section-group { margin-bottom: 20px; }

    .section-hdr {
      display: flex; align-items: baseline; gap: 10px; justify-content: space-between;
      padding: 7px 8px;
      background: #2c2c2c; color: #fff;
      border-radius: 4px 4px 0 0;
    }
    .section-hdr-left { display: flex; align-items: baseline; gap: 10px; }
    .section-hdr .sec-name { font-weight: 700; font-size: 13px; }
    .section-hdr .class-name { font-size: 11px; color: #aaa; }
    .section-hdr .sec-counts { font-size: 10px; color: #aaa; display: flex; gap: 8px; }
    .sec-counts .cnt-enrolled  { color: #4ade80; }
    .sec-counts .cnt-cancelled { color: #f87171; }
    /* Legible at rest, not on hover — a control nobody can find is a control
       that does not exist (the Fast Track pin, one report over). */
    .btn-epact-sm {
      font: inherit; font-size: 10px; line-height: 1;
      padding: 4px 8px; margin-left: 2px;
      background: #6d28d9; color: #fff; border: 1px solid #7c3aed;
      border-radius: 4px; cursor: pointer; white-space: nowrap;
    }
    .btn-epact-sm:hover { background: #5b21b6; }
    .btn-epact-sm:focus-visible { outline: 2px solid #c4b5fd; outline-offset: 1px; }
    @media print { .btn-epact-sm { display: none; } }

    /* ── Session sub-header ── */
    .session-hdr {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 8px 4px;
      background: #edeae4;
      border-bottom: 1px solid #ccc;
      font-weight: 600; font-size: 11px; color: #555;
    }
    .session-hdr .sess-date { font-size: 12px; font-weight: 700; color: #222; }
    .session-hdr .sess-time { color: #777; }
    .session-hdr .sess-count { margin-left: auto; font-size: 10px; color: #999; }

    /* ── Column header row ── */
    .col-header-row {
      display: flex; gap: 4px; padding: 4px 8px;
      background: #e8e5df;
      border-bottom: 1px solid #ccc;
      font-weight: 700; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.4px; color: #555;
    }

    /* ── Data row ── */
    .data-row {
      display: flex; gap: 4px; padding: 4px 8px;
      border-bottom: 1px solid #f0ede8;
      align-items: center; font-size: 11.5px;
    }
    .data-row:nth-child(even) { background: #fafaf8; }
    .data-row.is-cancelled { opacity: .65; }

    .cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .status-badge {
      display: inline-block; padding: 1px 7px; border-radius: 10px;
      font-size: 10px; font-weight: 600; white-space: nowrap;
    }
    .status-enrolled  { background: #dcfce7; color: #166534; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }

    /* ── Form responses sub-row ── */
    .form-responses-row {
      padding: 4px 8px 6px 8px;
      border-bottom: 1px solid #e8e4de;
      background: #f0f4ff;
      font-size: 10.5px;
    }
    .form-responses-list {
      display: flex; flex-direction: column; gap: 2px;
    }
    .form-qa-line {
      text-align: left; line-height: 1.4;
    }
    .form-q {
      color: #555; font-size: 10px; font-weight: 600;
    }
    .form-a { color: #111; font-size: 11px; }

    /* ── Column widths ── */
    .col-fname     { width: 110px; font-weight: 500; }
    .col-lname     { width: 110px; font-weight: 500; }
    .col-recid     { width: 72px; font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; }
    .col-dob       { width: 82px; }
    .col-age       { width: 36px; text-align: center; }
    .col-grade     { width: 50px; text-align: center; }
    .col-gender    { width: 56px; }
    .col-phone     { width: 108px; }
    .col-email     { width: 160px; font-size: 10.5px; }
    .col-owner     { width: 130px; }
    .col-ownerph   { width: 108px; }
    .col-ownerem   { width: 155px; font-size: 10.5px; }
    .contacts-sub-row { padding: 3px 12px 6px 24px; font-size: 11.5px; color: #374151; display: flex; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid rgba(0,0,0,.06); background: #fafaf9; }
    .contacts-sub-row .contact-group { display: flex; gap: 4px; align-items: baseline; }
    .contacts-sub-row .contact-label { font-weight: 700; color: #1f2937; font-size: 10.5px; text-transform: uppercase; letter-spacing: .3px; }
    .contacts-sub-row .contact-val { color: #111827; }
    .col-status    { width: 76px; }
    .col-reg       { width: 82px; }

    /* ── Footer ── */
    .report-footer {
      display: flex; justify-content: space-between;
      border-top: 2.5px solid #111; margin-top: 14px; padding-top: 6px;
      font-size: 10px; color: #777;
    }

    /* ── Loading / Error ── */
    .loading { text-align: center; padding: 80px 20px; color: #888; font-size: 14px; }
    .loading .spinner {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 44px;
      margin: 0 auto;
      box-sizing: border-box;
      border: 2px solid #e07b1a;
      border-top-color: #f7b96b;
      border-radius: 4px 4px 14px 14px;
      background: rgba(255, 248, 240, 0.5);
      overflow: hidden;
      box-shadow: inset -4px 0 0 rgba(255, 255, 255, 0.35);
    }
    .loading .spinner::before {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 60%;
      background: linear-gradient(180deg, #ffb24d 0%, #ff8c1f 55%, #f2710a 100%);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45);
      animation: juice-fill 2s ease-in-out infinite;
    }
    .loading .spinner::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 6px;
      width: 3px; height: 3px;
      margin-left: -1.5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: -5px 7px 0 0 rgba(255, 255, 255, 0.65), 5px 12px 0 -0.5px rgba(255, 255, 255, 0.5);
      animation: juice-bubbles 2.2s ease-out infinite;
    }
    @keyframes juice-fill {
      0%   { height: 42%; }
      50%  { height: 80%; }
      100% { height: 42%; }
    }
    @keyframes juice-bubbles {
      0%   { transform: translateY(2px) scale(0.5); opacity: 0; }
      30%  { opacity: 0.9; }
      70%  { opacity: 0.6; }
      100% { transform: translateY(-22px) scale(1); opacity: 0; }
    }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .juice-msg { position: relative; height: 1.4em; line-height: 1.4em; min-width: 190px; }
    .juice-msg span { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; animation: juice-phrase 10s infinite; }
    .juice-msg span:nth-child(1) { animation-delay: 0s; }
    .juice-msg span:nth-child(2) { animation-delay: 2s; }
    .juice-msg span:nth-child(3) { animation-delay: 4s; }
    .juice-msg span:nth-child(4) { animation-delay: 6s; }
    .juice-msg span:nth-child(5) { animation-delay: 8s; }
    @keyframes juice-phrase {
      0%   { opacity: 0; transform: translateY(5px); }
      2%   { opacity: 1; transform: translateY(0); }
      18%  { opacity: 1; transform: translateY(0); }
      20%  { opacity: 0; transform: translateY(-5px); }
      100% { opacity: 0; }
    }
    .error { text-align: center; padding: 60px 20px; color: #b91c1c; font-size: 14px; }

    /* ── Print ── */
    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .page { box-shadow: none; margin: 0; padding: 12px 16px; max-width: 100%; }
    }
    body.print-mode .toolbar { display: none !important; }
    body.print-mode { background: #fff; }
    body.print-mode .page { box-shadow: none; margin: 0; padding: 12px 16px; max-width: 100%; }


    /* ── Button loading spinner ── */
    @keyframes btn-spin { to { transform: rotate(360deg); } }
    .btn-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid rgba(0,0,0,.15);
      border-top-color: #333;
      border-radius: 50%;
      animation: btn-spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 5px;
    }
    .toolbar button:disabled .btn-spinner {
      border-top-color: #888;
    }

  </style>
  <script>
    // ── Token auth (injected) ────────────────────────────────────────
    const URL_TOKEN = new URLSearchParams(window.location.search).get('token') || '';
    const TOKEN_QS  = URL_TOKEN ? '?token=' + encodeURIComponent(URL_TOKEN) : '';
    function withToken(url) {
      if (!URL_TOKEN) return url;
      return url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(URL_TOKEN);
    }
  </script>
<script src="/report-refresh.js" defer></script>
<script src="/open-pdf.js" defer></script>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const LS_COLS = 'roster_cols_v2';

const COL_DEFAULTS = {
  recId: false, dob: false, age: true, grade: true, gender: false,
  contact: true, owner: true, ownerContact: false,
  emergency: true, pickup: true,
  registered: false, responses: false,
};

function loadCols() {
  try { return { ...COL_DEFAULTS, ...JSON.parse(localStorage.getItem(LS_COLS) || '{}') }; }
  catch { return COL_DEFAULTS; }
}
function saveCols(v) { try { localStorage.setItem(LS_COLS, JSON.stringify(v)); } catch {} }

function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// The roster prints one block per session date, so a whole month at a big org
// is hundreds of pages before the reader has chosen anything — apex opened at
// ~382. The default is deliberately TIGHT: land on something small, see what the
// sections ARE, then widen the dates or type a partial section name and Run.
const ROSTER_DEFAULT_DAYS = 14;
function getDefaultRange(today) {
  const now = today || new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + ROSTER_DEFAULT_DAYS - 1);
  return { start: toISO(start), end: toISO(end) };
}
function formatDisplayDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  const months = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}
function formatPhone(p) {
  if (!p) return '';
  const d = p.replace(/\D/g, '');
  if (d.length === 10) return `(${d.slice(0,3)})${d.slice(3,6)}-${d.slice(6)}`;
  if (d.length === 11 && d[0] === '1') return `(${d.slice(1,4)})${d.slice(4,7)}-${d.slice(7)}`;
  return p;
}
function formatDOB(dob) {
  if (!dob) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(dob)) {
    const [y, mo, d] = dob.substring(0,10).split('-');
    return `${mo}/${d}/${y}`;
  }
  return dob;
}

function StaleCacheBanner({ cachedAt }) {
  if (!cachedAt) return null;
  const when = new Date(cachedAt).toLocaleString();
  return (
    <div style={{background:'#fef3c7',borderBottom:'1px solid #f59e0b',padding:'8px 16px',textAlign:'center',fontSize:13,color:'#92400e'}}>
      ⚠️ Showing cached data from {when} — live data is temporarily unavailable
    </div>
  );
}

function normalizeRow(raw) {
  // Decode form responses from form_submission schema + submission
  const formResponses = (() => {
    try {
      const fd = typeof raw['Form Responses'] === 'string'
        ? JSON.parse(raw['Form Responses'])
        : raw['Form Responses'];
      if (!fd || !fd.schema || !fd.submission) return null;
      return fd.schema
        .filter(el => el.name && el.title)
        .map(el => {
          const rawAns = fd.submission[el.name];
          let answer = '';
          const choiceMap = {};
          (el.choices || []).forEach(c => { choiceMap[c.value] = c.text; });
          if (Array.isArray(rawAns)) {
            answer = rawAns.map(v => choiceMap[v] || v).join(', ');
          } else if (rawAns !== null && rawAns !== undefined) {
            answer = choiceMap[String(rawAns)] || String(rawAns);
          }
          // Digital signatures come through as base64 data URIs — show a clean label
          if (typeof answer === 'string' && (answer.startsWith('data:image') || answer.startsWith('data:application'))) {
            answer = '\u2713 Signed';
          }
          return { q: el.title, a: answer };
        })
        .filter(qa => qa.a !== '');
    } catch { return null; }
  })();

  return {
    recId:        raw['Rec ID']          || '',
    firstName:    raw['First Name']      || '',
    lastName:     raw['Last Name']       || '',
    dob:          raw['Date of Birth']   || '',
    age:          raw['Age'] != null ? raw['Age'] : '',
    grade:        raw['Grade']           || '',
    gender:       raw['Gender']          || '',
    phone:        raw['Phone']           || '',
    email:        raw['Email']           || '',
    owner:        raw['Household Owner'] || '',
    ownerEmail:   raw['Owner Email']     || '',
    ownerPhone:   raw['Owner Phone']     || '',
    emergencyContacts: raw['Emergency Contacts'] || '',
    authorizedPickups: raw['Authorized Pickups'] || '',
    className:    raw['Class']           || '',
    section:      raw['Section']         || '',
    sessionDate:  raw['Session Date']    || '',
    sessionStart: raw['Session Start']   || '',
    sessionEnd:   raw['Session End']     || '',
    status:       raw['Status']          || 'Enrolled',
    registered:   raw['Registered']      || '',
    formResponses,
  };
}


// ── ePACT export ─────────────────────────────────────────────────────────────
// Orgs upload participant lists into ePACT, an outside HIPAA vendor that holds
// camp health forms. Melinda at Apex has been producing that list by hand from a
// Metabase SQL: a date range, a partial section name, five columns, CSV. This
// reproduces that query's OUTPUT from the roster feed, so the file drops
// straight into ePACT's importer.
//
// THE MAPPING, verified against card 17296 and against her SQL on prod
// (apex, 2026-08-27) rather than read off column names:
//
//   Rec ID / First Name / Last Name → the same three roster columns.
//   Household Owner Email           → the roster's `Email` column, NOT its
//        `Owner Email`. Both her query and the card compute
//        COALESCE(NULLIF(participant.email,''), owner.email); the roster's
//        `Owner Email` is owner.email ALONE. Her label says "Owner" and her SQL
//        does not, so the obvious-looking mapping is the wrong one.
//   Session Date - Section Name     → YYYY-MM-DD of the card's Session Date,
//        ' - ', then the section name. Both sides date a row from
//        COALESCE(this session, the section's first session).
//
// HER FILTERS, and where each one already lives:
//   b.status = 'confirmed' AND b.canceled_at IS NULL
//        The card is already restricted to b.status IN ('confirmed','cancelled')
//        and derives Status purely from canceled_at, so roster `Enrolled` IS her
//        set. Measured at apex: 0 bookings are status='cancelled' with a null
//        canceled_at, so the two cannot diverge; 16,831 are confirmed-then-
//        cancelled and both sides drop them.
//   section.is_rec_managed IS FALSE  → already in the card.
//   the date range and the section name → the report's own toolbar.
//   JOIN order_item ON booking_id    → a NO-OP. All 82,244 qualifying apex
//        bookings have a live order_item, so it removes nothing.
//   SELECT DISTINCT                  → NOT a no-op, and reproduced here: it
//        collapsed 82,244 rows to 82,127 at apex — the same participant in the
//        same section on the same DATE, from two sessions that day.
const EPACT_HEADERS = ['Rec ID', 'First Name', 'Last Name', 'Household Owner Email',
                       'Session Date - Section Name'];

// 'MM/DD/YYYY' -> 'YYYY-MM-DD'. String surgery, deliberately not new Date():
// the card emits a bare date and new Date() reads that as UTC midnight, which
// renders as the previous day across the US — the Fast Track date bug, one
// report over.
function epactIsoDate(s) {
  const t = String(s == null ? '' : s).trim();
  const us = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);
  if (us) return us[3] + '-' + us[1].padStart(2, '0') + '-' + us[2].padStart(2, '0');
  const iso = /^(\d{4})-(\d{2})-(\d{2})/.exec(t);
  return iso ? iso[1] + '-' + iso[2] + '-' + iso[3] : '';
}

// Her label is NULL when a section has no session to date it from — TO_CHAR(NULL)
// makes the whole concatenation NULL. So a dateless row exports with an EMPTY
// label rather than a guessed date: putting an invented camp date beside a real
// child's name in a vendor's system is the fabrication this repo keeps refusing.
function epactLabel(r) {
  const d = epactIsoDate(r && r.sessionDate);
  return d ? d + ' - ' + ((r && r.section) || '') : '';
}

function epactRows(rows) {
  const seen = new Set(), out = [];
  (rows || []).forEach(r => {
    // Her SQL takes confirmed, not-cancelled bookings only, and the on-screen
    // status pill does NOT loosen that: uploading a child who cancelled hands a
    // camp health vendor a roster with the wrong children on it.
    if (r.status === 'Cancelled') return;
    const tuple = [r.recId || '', r.firstName || '', r.lastName || '',
                   r.email || '', epactLabel(r)];
    // A separator no field can contain. Joining on a space would collapse two
    // genuinely different people ("Ana Lee Smith" / "Ana Lee" "Smith").
    const key = tuple.join('\u001f');
    if (seen.has(key)) return;               // her SELECT DISTINCT
    seen.add(key);
    out.push(tuple);
  });
  // ORDER BY the concatenated field, then last name, then first — hers exactly.
  out.sort((a, b) => a[4].localeCompare(b[4]) || a[2].localeCompare(b[2]) || a[1].localeCompare(b[1]));
  return out;
}

function epactCsv(tuples) {
  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [EPACT_HEADERS].concat(tuples).map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
}

// A section name goes into a filename, so it has to survive being one.
function epactFileSlug(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48);
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const p = useMemo(() => new URLSearchParams(window.location.search), []);
  const isPrint = p.get('_print') === '1';

  const defaults = useMemo(() => getDefaultRange(), []);
  const [startDate, setStartDate] = useState(p.get('start_date') || defaults.start);
  const [endDate, setEndDate]     = useState(p.get('end_date')   || defaults.end);
  const [sectionFilter, setSectionFilter] = useState(p.get('section_name') || '');
  const [statusFilter, setStatusFilter]   = useState(p.get('status') || 'all');

  const [rows, setRows]       = useState(null);
  const [orgName, setOrgName] = useState('');
  const [staleCacheAt, setStaleCacheAt] = useState(null);
  const [logoUrl,  setLogoUrl]  = useState(null);
  const [pdfLoading, setPdfLoading] = useState(false);
  const [loading, setLoading] = useState(false);
  const [error, setError]     = useState(null);
  const [loadedStart, setLoadedStart]     = useState(null);
  const [loadedEnd, setLoadedEnd]         = useState(null);
  const [loadedSection, setLoadedSection] = useState(null);

  // Share Link: expose the live applied filter state so the floating Share
  // widget copies a URL that reproduces the on-screen view (mirrors the PDF).
  useEffect(() => {
    window.recShareLink = () => {
      const qs = new URLSearchParams();
      qs.set('start_date', loadedStart || startDate);
      qs.set('end_date',   loadedEnd   || endDate);
      const sec = (loadedSection != null ? loadedSection : sectionFilter);
      if (sec) qs.set('section_name', sec);
      if (URL_TOKEN) qs.set('token', URL_TOKEN);
      return `${window.location.pathname}?${qs.toString()}`;
    };
    return () => { try { delete window.recShareLink; } catch (e) { window.recShareLink = undefined; } };
  }, [loadedStart, loadedEnd, loadedSection, startDate, endDate, sectionFilter]);

  // In print/PDF mode the columns travel on the URL (Puppeteer starts with empty
  // localStorage); otherwise fall back to the saved/default columns.
  const [cols, setCols] = useState(() => {
    const cp = p.get('cols');
    if (cp) { try { return { ...COL_DEFAULTS, ...JSON.parse(cp) }; } catch {} }
    return loadCols();
  });
  const toggleCol = useCallback(key => {
    setCols(prev => { const next = { ...prev, [key]: !prev[key] }; saveCols(next); return next; });
  }, []);

  // ── Form-response question multiselect ──
  // selectedQs: null = show all questions; array = explicit list of question titles to show.
  const [selectedQs, setSelectedQs] = useState(() => {
    const qp = p.get('questions');
    if (qp) { try { const arr = JSON.parse(qp); if (Array.isArray(arr)) return arr; } catch {} }
    return null;
  });
  const [qPanelOpen, setQPanelOpen] = useState(false);

  const availableQuestions = useMemo(() => {
    if (!rows) return [];
    const seen = [], seenSet = new Set();
    rows.forEach(r => (r.formResponses || []).forEach(qa => {
      if (!seenSet.has(qa.q)) { seenSet.add(qa.q); seen.push(qa.q); }
    }));
    return seen.map((q, i) => ({ q, idx: i + 1 }));
  }, [rows]);

  // Reconcile selection when the available question set changes (new report / different form).
  useEffect(() => {
    setSelectedQs(prev => {
      if (prev === null) return null;
      const avail = new Set(availableQuestions.map(a => a.q));
      const kept = prev.filter(q => avail.has(q));
      return kept.length ? kept : null;            // nothing matches → fall back to "all"
    });
  }, [availableQuestions]);

  const toggleQ = useCallback((q) => {
    setSelectedQs(prev => {
      const all = availableQuestions.map(a => a.q);
      const base = prev === null ? all : prev;
      return base.includes(q) ? base.filter(x => x !== q) : [...base, q];
    });
  }, [availableQuestions]);

  const orgSlug = useMemo(() => window.location.pathname.split('/').filter(Boolean)[0] || '', []);

  useEffect(() => { if (isPrint) document.body.classList.add('print-mode'); }, [isPrint]);

  const fetchData = useCallback((sd, ed, sec) => {
    setLoading(true); setError(null);
    const qs = new URLSearchParams();
    if (sd) qs.set('start_date', sd);
    if (ed) qs.set('end_date', ed);
    if (sec && sec.trim()) qs.set('section_name', sec.trim());
    if (p.get('_nocache') === '1' || p.get('_refresh') === '1') qs.set('_nocache', '1');

    fetch(withToken(`/${orgSlug}/roster/api/data?${qs}`))
      .then(r => { if (!r.ok) throw new Error(`Server returned ${r.status}`); return r.json(); })
      .then(json => {
        setRows(json.rows.map(normalizeRow));
        if (json.rows.length > 0 && json.rows[0]['Org Name']) setOrgName(json.rows[0]['Org Name']);
        setLogoUrl(json.meta?.logo_url || null);
        setStaleCacheAt(json.meta?.stale_cache ? json.meta.cached_at : null);
        setLoadedStart(sd); setLoadedEnd(ed); setLoadedSection(sec || '');
      })
      .catch(err => setError(err.message))
      .finally(() => setLoading(false));
  }, [orgSlug]);

  useEffect(() => { fetchData(startDate, endDate, sectionFilter); }, []);

  function handleRun() { fetchData(startDate, endDate, sectionFilter); }

  function setDays(n) {
    const r = getDefaultRange();
    if (n === ROSTER_DEFAULT_DAYS) { setStartDate(r.start); setEndDate(r.end); return; }
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    setStartDate(toISO(start));
    setEndDate(toISO(new Date(start.getFullYear(), start.getMonth(), start.getDate() + n - 1)));
  }

  function setMonth(offset) {
    const now = new Date();
    const target = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    const last   = new Date(target.getFullYear(), target.getMonth() + 1, 0);
    setStartDate(toISO(target)); setEndDate(toISO(last));
  }

  const paramsChanged = loadedSection !== null && (
    startDate !== loadedStart || endDate !== loadedEnd
  );

  const sectionFilteredRows = useMemo(() => {
    if (!rows) return [];
    const secLower = sectionFilter.trim().toLowerCase();
    return !secLower ? rows : rows.filter(r => r.section.toLowerCase().includes(secLower));
  }, [rows, sectionFilter]);

  const counts = useMemo(() => ({
    all:       sectionFilteredRows.length,
    enrolled:  sectionFilteredRows.filter(r => r.status === 'Enrolled').length,
    cancelled: sectionFilteredRows.filter(r => r.status === 'Cancelled').length,
  }), [sectionFilteredRows]);

  const displayRows = useMemo(() => {
    if (!rows) return [];
    // Belt-and-suspenders: in print mode, apply filters from URL directly
    const isPrint = new URLSearchParams(window.location.search).get('_print') === '1';
    const urlSection = new URLSearchParams(window.location.search).get('section_name');
    const urlStatus = new URLSearchParams(window.location.search).get('status');
    const secLower = (isPrint && urlSection ? urlSection : sectionFilter).trim().toLowerCase();
    const statFilter = (isPrint && urlStatus ? urlStatus : statusFilter);
    return rows.filter(r => {
      const statusOk =
        statFilter === 'all' || !statFilter ||
        (statFilter === 'enrolled'  && r.status === 'Enrolled') ||
        (statFilter === 'cancelled' && r.status === 'Cancelled');
      const sectionOk = !secLower || r.section.toLowerCase().includes(secLower);
      return statusOk && sectionOk;
    });
  }, [rows, statusFilter, sectionFilter]);

  const grouped = useMemo(() => {
    const bySec = {};
    displayRows.forEach(r => {
      if (!bySec[r.section]) bySec[r.section] = { className: r.className, sessions: {} };
      const dk = r.sessionDate || '(No Date)';
      if (!bySec[r.section].sessions[dk])
        bySec[r.section].sessions[dk] = { start: r.sessionStart, end: r.sessionEnd, rows: [] };
      bySec[r.section].sessions[dk].rows.push(r);
    });
    Object.values(bySec).forEach(sec =>
      Object.values(sec.sessions).forEach(sess =>
        sess.rows.sort((a, b) => (a.lastName + a.firstName).localeCompare(b.lastName + b.firstName))
      )
    );
    return bySec;
  }, [displayRows]);

  const sortedSections = useMemo(() => Object.keys(grouped).sort(), [grouped]);

  // Fire-and-forget log to server for client-side events (excel, print)
  function logClientEvent(event, extra) {
    try {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length < 2) return;
      // The convention is ?event=<name> in the QUERY STRING — a JSON body is
      // read by nothing on the server and comes back 400 Unknown event, which a
      // fire-and-forget beacon never complains about. See the memberships note.
      const qs = new URLSearchParams({ event });
      Object.keys(extra || {}).forEach(k => {
        if (extra[k] !== undefined && extra[k] !== null && extra[k] !== '') qs.set(k, String(extra[k]));
      });
      fetch(withToken(`/${parts[0]}/${parts[1]}/api/log?${qs}`), { method: 'POST', keepalive: true }).catch(() => {});
    } catch {}
  }


  // ── Excel export ──
  function toXlDate(s) { if (!s) return ''; const p = String(s).split('T')[0].split('-'); return p.length === 3 ? new Date(+p[0], +p[1]-1, +p[2]) : s; }
  function exportExcel() {
    if (!rows || !rows.length) return;
    const headers = [
      'Section', 'Class', 'Session Date',
      'Last Name', 'First Name',
      ...(cols.recId    ? ['Rec ID'] : []),
      ...(cols.dob      ? ['DOB'] : []),
      ...(cols.age      ? ['Age'] : []),
      ...(cols.grade    ? ['Grade'] : []),
      ...(cols.gender   ? ['Gender'] : []),
      ...(cols.contact  ? ['Phone', 'Email'] : []),
      ...(cols.owner    ? ['Household Owner'] : []),
      ...(cols.ownerContact ? ['Owner Phone', 'Owner Email'] : []),
      ...(cols.emergency ? ['Emergency Contacts'] : []),
      ...(cols.pickup    ? ['Authorized Pickups'] : []),
      'Status',
      ...(cols.registered ? ['Registered'] : []),
    ];
    const dataRows = displayRows.map(r => [
      r.section, r.className, toXlDate(r.sessionDate),
      r.lastName, r.firstName,
      ...(cols.recId    ? [r.recId] : []),
      ...(cols.dob      ? [formatDOB(r.dob)] : []),
      ...(cols.age      ? [r.age] : []),
      ...(cols.grade    ? [r.grade] : []),
      ...(cols.gender   ? [r.gender] : []),
      ...(cols.contact  ? [formatPhone(r.phone), r.email] : []),
      ...(cols.owner    ? [r.owner] : []),
      ...(cols.ownerContact ? [formatPhone(r.ownerPhone), r.ownerEmail] : []),
      ...(cols.emergency ? [r.emergencyContacts] : []),
      ...(cols.pickup    ? [r.authorizedPickups] : []),
      r.status,
      ...(cols.registered ? [toXlDate(r.registered)] : []),
    ]);
    const ws = XLSX.utils.aoa_to_sheet([headers, ...dataRows], { cellDates: true });
    // Format date columns
    const sesIdx = 2;
    const regIdx = cols.registered ? headers.indexOf('Registered') : -1;
    for (let ri = 1; ri <= dataRows.length; ri++) {
      [sesIdx, regIdx].forEach(ci => {
        if (ci < 0) return;
        const addr = XLSX.utils.encode_cell({ r: ri, c: ci });
        if (ws[addr] && ws[addr].t === 'd') ws[addr].z = 'MM/DD/YY';
      });
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Roster');
    // Handed to a popup to save rather than written straight from here — a
    // download started by a sandboxed iframe is silently dropped. See open-pdf.js.
    saveWorkbookViaPopup(XLSX, wb, `class-roster-${loadedStart || 'report'}.xlsx`);
    logClientEvent('excel');
  }

  // ── ePACT export ──
  // Two entry points, ONE builder: the toolbar button over everything on screen,
  // and a button on each section's header row for the single-class case. Two
  // copies of the column list would drift the first time ePACT wanted a field,
  // and a vendor import is the last place to discover that.
  const epactAll = useMemo(() => epactRows(displayRows), [displayRows]);

  function exportEpact(rowSet, sectionName) {
    const tuples = epactRows(rowSet);
    if (!tuples.length) return;
    const scope = sectionName ? 'section' : 'view';
    const name = ['epact', orgSlug || 'org', sectionName ? epactFileSlug(sectionName) : '',
                  loadedStart || startDate].filter(Boolean).join('-') + '.csv';
    saveTextViaPopup(epactCsv(tuples), name, {
      gesture: 'ePACT',
      title: 'Your ePACT file is ready',
      hint: tuples.length + ' participant' + (tuples.length === 1 ? '' : 's')
          + ' \u2014 upload this CSV in ePACT. If the download did not start on its own, use the '
          + 'button above; "Copy for Excel" puts the same rows on your clipboard instead.',
    });
    // The SCOPE is the interesting half: a whole-view export is a bulk upload,
    // a per-section one is a class about to start. Sections are the debounce key
    // (below), so working down a list of classes reads as N exports, not one.
    logClientEvent('epact', { rows: tuples.length, scope, section: sectionName || '' });
  }

  function ColToggle({ k, label }) {
    return <button className={`col-toggle${cols[k] ? ' on' : ''}`} onClick={() => toggleCol(k)}>{label}</button>;
  }

  const now = new Date();
  const runDate = `${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')}/${now.getFullYear()} @ ${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()}`;
  const dateRangeLabel = [loadedStart && formatDisplayDate(loadedStart), loadedEnd && formatDisplayDate(loadedEnd)].filter(Boolean).join(' – ')
    || [startDate && formatDisplayDate(startDate), endDate && formatDisplayDate(endDate)].filter(Boolean).join(' – ');

  function downloadPdf() {
    const parts = window.location.pathname.split('/').filter(Boolean);
    const pdfParams = new URLSearchParams({ start_date: loadedStart||'', end_date: loadedEnd||'' });
    // Use the LIVE section filter — typing in the box narrows the on-screen
    // rows client-side without re-fetching, so loadedSection is stale (usually
    // empty). The visible view is driven by sectionFilter, so the PDF must be too.
    const sec = (sectionFilter && sectionFilter.trim()) ? sectionFilter.trim() : (loadedSection || '');
    if (sec) pdfParams.set('section_name', sec);
    if (statusFilter && statusFilter !== 'all') pdfParams.set('status', statusFilter);
    if (selectedQs !== null) pdfParams.set('questions', JSON.stringify(selectedQs));
    pdfParams.set('cols', JSON.stringify(cols));
    const pdfUrl = parts.length >= 2
      ? `/${parts[0]}/${parts[1]}/api/pdf?${pdfParams}`
      : '/api/pdf';
    // Opened in its own window rather than downloaded — a download started by a
    // sandboxed iframe is silently dropped. See open-pdf.js.
    openReportPdf(withToken(pdfUrl), { label: 'Class Roster' });
  }

  // Inclusive day count of the window on screen. Built from the date STRINGS
  // rather than new Date(a) - new Date(b): both are UTC midnight there, which is
  // right by luck and wrong the moment one of them is a local date.
  const rangeDays = (() => {
    const d = t => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
    const a = d(startDate), b = d(endDate);
    return a != null && b != null ? Math.round((b - a) / 86400000) + 1 : 0;
  })();

  function renderToolbar() {
    if (isPrint) return null;
    return (
      <div className="toolbar" data-roster-days={rangeDays}>
        <span className="toolbar-title">Class Roster</span>
        <div className="toolbar-divider" />

        <label>
          Section
          <input type="text" value={sectionFilter} onChange={e => setSectionFilter(e.target.value)}
            placeholder="Filter sections…" style={{width:160}} onKeyDown={e => e.key === 'Enter' && handleRun()} />
        </label>

        <label>Start<input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} /></label>
        <label>End<input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} /></label>
        <button onClick={() => setDays(ROSTER_DEFAULT_DAYS)} style={{fontSize:10,padding:'3px 7px'}}
          title={'Back to the default window \u2014 the next ' + ROSTER_DEFAULT_DAYS + ' days'}>{ROSTER_DEFAULT_DAYS} Days</button>
        <button onClick={() => setMonth(-1)} style={{fontSize:10,padding:'3px 7px'}}>Last Mo.</button>
        <button onClick={() => setMonth(0)}  style={{fontSize:10,padding:'3px 7px'}}>This Mo.</button>
        <button onClick={() => setMonth(1)}  style={{fontSize:10,padding:'3px 7px'}}>Next Mo.</button>
        <button className="btn-run" onClick={handleRun} disabled={loading}
          style={paramsChanged && !loading ? {boxShadow:'0 0 0 2px #4ade80'} : {}}>
          {loading ? <><span className="btn-spinner" />Loading…</> : '▶ Run Report'}
        </button>

        <div className="toolbar-divider" />

        <div className="status-pills">
          <span className={`status-pill status-pill-all${statusFilter==='all'?' active':''}`} onClick={() => setStatusFilter('all')}>
            All {counts.all > 0 && `(${counts.all})`}
          </span>
          <span className={`status-pill status-pill-enrolled${statusFilter==='enrolled'?' active':''}`} onClick={() => setStatusFilter('enrolled')}>
            Enrolled {counts.enrolled > 0 && `(${counts.enrolled})`}
          </span>
          <span className={`status-pill status-pill-cancelled${statusFilter==='cancelled'?' active':''}`} onClick={() => setStatusFilter('cancelled')}>
            Cancelled {counts.cancelled > 0 && `(${counts.cancelled})`}
          </span>
        </div>

        <div className="toolbar-divider" />

        <ColToggle k="recId"        label="Rec ID" />
        <ColToggle k="dob"          label="DOB" />
        <ColToggle k="age"          label="Age" />
        <ColToggle k="grade"        label="Grade" />
        <ColToggle k="gender"       label="Gender" />
        <ColToggle k="contact"      label="Contact" />
        <ColToggle k="owner"        label="Owner" />
        <ColToggle k="ownerContact" label="Owner Contact" />
        <ColToggle k="emergency"    label="🛑 Emergency" />
        <ColToggle k="pickup"       label="🚸 Pickup" />
        <ColToggle k="registered"   label="Registered" />
        <ColToggle k="responses"    label="Form Responses" />
        {cols.responses && availableQuestions.length > 0 && (() => {
          const total = availableQuestions.length;
          const selCount = selectedQs === null ? total : selectedQs.length;
          const trunc = (str, n = 42) => str.length > n ? str.slice(0, n).trimEnd() + '\u2026' : str;
          return (
            <div className="qfilter">
              <button className={`col-toggle${selCount < total ? ' on' : ''}`}
                onClick={() => setQPanelOpen(o => !o)}>
                Questions: {selCount === total ? 'All' : `${selCount}/${total}`} {'\u25be'}
              </button>
              {qPanelOpen && <>
                <div className="qfilter-backdrop" onClick={() => setQPanelOpen(false)} />
                <div className="qfilter-panel">
                  <div className="qfilter-head">
                    <span className="qf-title">Show questions</span>
                    <button onClick={() => setSelectedQs(null)}>All</button>
                    <button onClick={() => setSelectedQs([])}>None</button>
                  </div>
                  {availableQuestions.map(({ q, idx }) => {
                    const checked = selectedQs === null || selectedQs.includes(q);
                    return (
                      <label className="qfilter-item" key={q} title={q}>
                        <input type="checkbox" checked={checked} onChange={() => toggleQ(q)} />
                        <span><span className="qf-idx">Q{idx}:</span> {trunc(q)}</span>
                      </label>
                    );
                  })}
                </div>
              </>}
            </div>
          );
        })()}

        <div className="toolbar-spacer" />
        {rows && <span className="row-count">{displayRows.length} of {counts.all}</span>}
        <div className="toolbar-divider" />
        <button onClick={() => window.print()}>🖨️ Print</button>
        <button
          className="btn-pdf"
          onClick={downloadPdf}
          disabled={pdfLoading || !rows || !rows.length}
        >
          {pdfLoading ? 'Generating…' : '📄 PDF'}
        </button>
        <button className="btn-excel" onClick={exportExcel} disabled={!rows || !rows.length}>📊 Excel</button>
        <button className="btn-epact" data-epact-rows={epactAll.length}
          onClick={() => exportEpact(displayRows, '')}
          disabled={!epactAll.length}
          title={epactAll.length
            ? `Export ${epactAll.length} participant${epactAll.length === 1 ? '' : 's'} across every section on screen, ready to upload into ePACT. Cancelled registrations are always excluded.`
            : 'Nothing to export \u2014 no enrolled participants in this view.'}>
          {'\uD83D\uDCE4 ePACT'}{epactAll.length ? ` (${epactAll.length})` : ''}
        </button>

      </div>
    );
  }

  if (error && !rows) return (
    <div>{renderToolbar()}
      <div className="page"><div className="error" style={{textAlign:'center',padding:'3rem 1rem'}}><p style={{fontSize:'2.5rem',marginBottom:'0.5rem'}}>😔</p><p style={{fontSize:'1.1rem',color:'#666'}}>Looks like reporting has encountered an issue — try loading this report again later.</p>
            <p style={{fontSize:'0.8rem',color:'#b91c1c',marginTop:'0.75rem',fontFamily:'monospace',background:'#fef2f2',padding:'8px 14px',borderRadius:6,display:'inline-block',maxWidth:500,wordBreak:'break-word'}}>{error}</p></div></div>
    </div>
  );

  if (!rows) return (
    <div>{renderToolbar()}
      <div className="page"><div className="loading"><div className="spinner" /><div className="juice-msg"><span>Squeezing the oranges…</span><span>Juicing!</span><span>Adding the pulp…</span><span>Chilling the glass…</span><span>Pouring it out…</span></div></div></div>
    </div>
  );

  function ColHdrs() {
    return (
      <div className="col-header-row">
        {cols.recId && <span className="cell col-recid">Rec ID</span>}
        <span className="cell col-fname">First Name</span>
        <span className="cell col-lname">Last Name</span>
        {cols.dob      && <span className="cell col-dob">DOB</span>}
        {cols.age      && <span className="cell col-age">Age</span>}
        {cols.grade    && <span className="cell col-grade">Grade</span>}
        {cols.gender   && <span className="cell col-gender">Gender</span>}
        {cols.contact  && <><span className="cell col-phone">Phone</span><span className="cell col-email">Email</span></>}
        {cols.owner    && <span className="cell col-owner">Household Owner</span>}
        {cols.ownerContact && <><span className="cell col-ownerph">Owner Phone</span><span className="cell col-ownerem">Owner Email</span></>}
        <span className="cell col-status">Status</span>
        {cols.registered && <span className="cell col-reg">Registered</span>}
      </div>
    );
  }

  function DataRow({ r }) {
    const isCancelled = r.status === 'Cancelled';
    const fr = r.formResponses || [];
    const qaList = selectedQs === null ? fr : fr.filter(qa => selectedQs.includes(qa.q));
    return (
      <>
        <div className={`data-row${isCancelled ? ' is-cancelled' : ''}`}>
          {cols.recId && <span className="cell col-recid">{r.recId}</span>}
          <span className="cell col-fname">{r.firstName}</span>
          <span className="cell col-lname">{r.lastName}</span>
          {cols.dob      && <span className="cell col-dob">{formatDOB(r.dob)}</span>}
          {cols.age      && <span className="cell col-age">{r.age}</span>}
          {cols.grade    && <span className="cell col-grade">{r.grade}</span>}
          {cols.gender   && <span className="cell col-gender">{r.gender}</span>}
          {cols.contact  && <>
            <span className="cell col-phone">{formatPhone(r.phone)}</span>
            <span className="cell col-email">
              {r.email ? <a href={`mailto:${r.email}`} style={{color:'#3b82f6',textDecoration:'none'}}>{r.email}</a> : ''}
            </span>
          </>}
          {cols.owner && <span className="cell col-owner">{r.owner}</span>}
          {cols.ownerContact && <>
            <span className="cell col-ownerph">{formatPhone(r.ownerPhone)}</span>
            <span className="cell col-ownerem">{r.ownerEmail}</span>
          </>}
          <span className="cell col-status">
            <span className={`status-badge status-${isCancelled ? 'cancelled' : 'enrolled'}`}>{r.status}</span>
          </span>
          {cols.registered && <span className="cell col-reg">{r.registered}</span>}
        </div>
        {((cols.emergency && r.emergencyContacts) || (cols.pickup && r.authorizedPickups)) && (
          <div className="contacts-sub-row">
            {cols.emergency && r.emergencyContacts && (
              <div className="contact-group">
                <span className="contact-label">🛑 Emergency:</span>
                <span className="contact-val">{r.emergencyContacts}</span>
              </div>
            )}
            {cols.pickup && r.authorizedPickups && (
              <div className="contact-group">
                <span className="contact-label">🚸 Pickup:</span>
                <span className="contact-val">{r.authorizedPickups}</span>
              </div>
            )}
          </div>
        )}
        {cols.responses && qaList.length > 0 && (
          <div className="form-responses-row">
            <div className="form-responses-list">
              {qaList.map((qa, i) => (
                <div className="form-qa-line" key={i}>
                  <span className="form-q">{qa.q}:</span>{' '}
                  <span className="form-a">{qa.a}</span>
                </div>
              ))}
            </div>
          </div>
        )}
      </>
    );
  }

  return (
    <div>
      {renderToolbar()}
      <StaleCacheBanner cachedAt={staleCacheAt} />
      <div className="page" style={loading ? {opacity:.5, pointerEvents:'none'} : {}}>

        <div className="report-header">
          <div className="report-header-left">
            {logoUrl && <img src={logoUrl} alt="" className="report-header-logo" onError={e => e.target.style.display='none'} />}
            <div>
              <div className="org-label">{orgName || orgSlug}</div>
              <div className="title">Class Roster</div>
            </div>
          </div>
          <div className="report-header-right">
            <div className="rh-meta" style={{fontWeight:600,marginBottom:2}}>{dateRangeLabel}</div>
          </div>
        </div>

        {sortedSections.length === 0 && (
          <div style={{textAlign:'center',padding:'40px 0',color:'#888'}}>
            No participants found for the selected filters.
          </div>
        )}

        {sortedSections.map(secName => {
          const sec = grouped[secName];
          const sortedDates = Object.keys(sec.sessions).sort();
          const secRows = Object.values(sec.sessions).flatMap(s => s.rows);
          const secEnrolled  = secRows.filter(r => r.status === 'Enrolled').length;
          const secCancelled = secRows.filter(r => r.status === 'Cancelled').length;
          const secEpact = epactRows(secRows).length;

          return (
            <div className="section-group" key={secName}>
              <div className="section-hdr">
                <div className="section-hdr-left">
                  <span className="sec-name">{secName}</span>
                  {sec.className && <span className="class-name">{sec.className}</span>}
                </div>
                <div className="sec-counts">
                  {secEnrolled  > 0 && <span className="cnt-enrolled">{secEnrolled} enrolled</span>}
                  {secCancelled > 0 && <span className="cnt-cancelled">{secCancelled} cancelled</span>}
                  {/* One class at a time is the common case — Melinda exports the
                      camp that is about to start, not the quarter. No button
                      where there is nobody to upload: a control that produces an
                      empty file is a dead end. */}
                  {!isPrint && secEpact > 0 && (
                    <button className="btn-epact-sm" data-epact-section={secName}
                      data-epact-rows={secEpact}
                      onClick={() => exportEpact(secRows, secName)}
                      title={`Export ${secEpact} participant${secEpact === 1 ? '' : 's'} from ${secName} for ePACT`}>
                      {'\uD83D\uDCE4 ePACT'}
                    </button>
                  )}
                </div>
              </div>

              {sortedDates.map((dk, di) => {
                const sess = sec.sessions[dk];
                return (
                  <div key={dk}>
                    <div className="session-hdr">
                      <span className="sess-date">{dk}</span>
                      {sess.start && sess.end && (
                        <span className="sess-time">·  {sess.start} – {sess.end}</span>
                      )}
                      <span className="sess-count">{sess.rows.length} participant{sess.rows.length !== 1 ? 's' : ''}</span>
                    </div>
                    {di === 0 && <ColHdrs />}
                    {sess.rows.map((r, i) => <DataRow key={i} r={r} />)}
                  </div>
                );
              })}
            </div>
          );
        })}



        <div className="report-footer">
          <span>{orgName || orgSlug}</span>
          <span>Run Date/Time: {runDate}</span>
        </div>
        {!loading && (rows || error) && <div id="report-ready" data-ready="true" style={{display:'none'}} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
    <script src="/share-widget.js" defer></script>
    <script src="/feedback-widget.js" defer></script>
      <script src="/nav-breadcrumb.js" defer></script>
  </body>
</html>
