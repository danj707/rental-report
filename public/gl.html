      if (hasGlCodes && selectedGlCodes && selectedGlCodes.size < allGlCodes.length) qs.set('gl_codes', [...selectedGlCodes].join(','));
      if (availableMethods.length > 1 && selectedMethods && selectedMethods.size < availableMethods.length) qs.set('methods', [...selectedMethods].join(','));
      if (isTylerActive) qs.set('tyler', '1');
      if (URL_TOKEN) qs.set('token', URL_TOKEN);
      return `${window.location.pathname}?${qs.toString()}`;
    };
    return () => { try { delete window.recShareLink; } catch (e) { window.recShareLink = undefined; } };
  }, [loadedStart, loadedEnd, startDate, endDate, isTylerActive, hasDesk, selectedDesks, allDesks, selectedMethods, availableMethods]);

  const [showRefunds,   setShowRefunds]   = useState(
    () => localStorage.getItem(LS_REFUND) === 'true'
  );
  const [showLocations, setShowLocations] = useState(
    () => localStorage.getItem(LS_LOCS) !== 'false'  // default ON
  );
  // Desk-location filter (session-only; resets when new data loads)
  const [showEmailModal, setShowEmailModal] = useState(false);
  const [emailAddr, setEmailAddr] = useState('');
  const [emailCadence, setEmailCadence] = useState('weekly');
  const [emailDateRange, setEmailDateRange] = useState('prior30');
  const [emailStatus, setEmailStatus] = useState(null);
  const [selectedDesks, setSelectedDesks] = useState(null);
  const [selectedGlCodes, setSelectedGlCodes] = useState(null);
  const [selectedMethods, setSelectedMethods] = useState(null);
  const [glFilter, setGlFilter] = useState(params.glq || '');

  // ── Saved views ──
  // `intent` is the filter selection a saved view (or the URL, on first load)
  // ASKED for, as opposed to what the loaded data could satisfy. Keeping the
  // request around is what lets the resolve effects report "2 of 3 desks aren't
  // in this range" instead of silently showing everything. `seq` bumps on every
  // deliberate apply so those effects re-run against already-loaded rows.
  const [intent, setIntent] = useState(() => {
    const p = new URLSearchParams(window.location.search);
    const csv = k => { const v = p.get(k); return v ? v.split(',').map(x => x.trim()).filter(Boolean) : null; };
    return { seq: 0, desks: csv('desks'), methods: csv('methods'), glCodes: csv('gl_codes') };
  });
  const [views, setViews] = useState([]);
  const [activeViewId, setActiveViewId] = useState(null);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [rowMenu, setRowMenu] = useState(null);      // id of the view whose ⋯ menu is open
  const [saveForm, setSaveForm] = useState(null);    // open save/rename dialog
  const [viewBusy, setViewBusy] = useState(false);
  const [undoView, setUndoView] = useState(null);    // { id, name } behind the Undo toast
  const [warnDismissed, setWarnDismissed] = useState(false);
  const pickerRef = useRef(null);
  const [insights, setInsights] = useState(null);
  const [insightsLoading, setInsightsLoading] = useState(false);
  const [insightsError, setInsightsError] = useState(null);
  const [insightsTraceId, setInsightsTraceId] = useState(null);
  const [fbSent, setFbSent] = useState(false);
  const [fbMode, setFbMode] = useState(null);
  const [fbComment, setFbComment] = useState('');

  useEffect(() => { if (params._print === '1') document.body.classList.add('print-mode'); }, []);
  useEffect(() => { localStorage.setItem(LS_REFUND,   showRefunds);   }, [showRefunds]);
  useEffect(() => { localStorage.setItem(LS_LOCS,     showLocations); }, [showLocations]);

  // ── Fetch ───────────────────────────────────────────────────────────
  const fetchData = useCallback((sd, ed, force) => {
    setLoading(true);
    setError(null);
    const qs = new URLSearchParams();
    if (sd) qs.set('start_date', sd);
    if (ed) qs.set('end_date', ed);
    // Force bypasses the cache for on-demand realtime (the Refresh button).
    if (force || params._nocache === '1' || params._refresh === '1') qs.set('_nocache', '1');
    fetch(withToken(`/${orgSlug}/${reportType}/api/data?${qs}`))
      .then(r => { if (!r.ok) throw new Error(`Server returned ${r.status}`); return r.json(); })
      .then(json => {
        setRows(json.rows.map(normalizeRow));
        setOrgName(json.meta?.org_name || '');
        setStaleCacheAt(json.meta?.stale_cache ? json.meta.cached_at : null);
        // A fresh (uncached) fetch has no cached_at — it's current as of now.
        setDataAsOf(json.meta?.cached_at || new Date().toISOString());
        setLogoUrl(json.meta?.logo_url || null);
        setLoadedStart(sd);
        setLoadedEnd(ed);
      })
      .catch(e => setError(e.message))
      .finally(() => setLoading(false));
  }, []);

  useEffect(() => { fetchData(startDate, endDate); }, []);

  function handleRun() { fetchData(startDate, endDate); }
  function handleRefresh() { fetchData(loadedStart || startDate, loadedEnd || endDate, true); }

  function setMonth(offset) {
    const now = new Date();
    const t = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    setStartDate(toISO(t));
    setEndDate(toISO(new Date(t.getFullYear(), t.getMonth() + 1, 0)));
  }

  const datesChanged = startDate !== loadedStart || endDate !== loadedEnd;

  // ── Derived ─────────────────────────────────────────────────────────
  const hasCCSplit = useMemo(
    () => rows && rows.length > 0 && rows[0].ccOnlinePayments !== null,
    [rows]
  );

  // Tenders present in the loaded data (drives the Method picker).
  const availableMethods = useMemo(() => availableMethodsFor(rows), [rows]);

  // Shared payment-method visibility: sub = a strict subset is active; sM(key)
  // ⇒ show that tender's column/card. Print/PDF reconstructs from the URL so the
  // rendered PDF hides the same columns as the on-screen view. Used by both the
  // table (hide deselected columns) and the summary cards (hide deselected cards).
  const methodVis = useMemo(() => {
    let eff = selectedMethods;
    if (params._print === '1') {
      const urlM = new URLSearchParams(window.location.search).get('methods');
      if (urlM) { const allow = new Set(urlM.split(',').map(s => s.trim()).filter(Boolean)); eff = new Set(availableMethods.map(m => m.key).filter(k => allow.has(k))); }
    }
    const sub = eff && availableMethods.length > 1 && eff.size < availableMethods.length;
    return { sub, sM: k => !sub || eff.has(k) };
  }, [selectedMethods, availableMethods, params._print]);

  // Distinct desk locations present in the data ('' bucketed as "(No desk location)").
  const allDesks = useMemo(() => {
    if (!rows) return [];
    const set = new Set();
    rows.forEach(r => set.add(r.deskLocation || NO_DESK_LABEL));
    const arr = Array.from(set);
    // sort alpha, but always float "(No desk location)" to the bottom
    arr.sort((a, b) => {
      if (a === NO_DESK_LABEL) return 1;
      if (b === NO_DESK_LABEL) return -1;
      return a.localeCompare(b);
    });
    return arr;
  }, [rows]);

  // Only worth showing the filter when the data actually splits across >1 desk.
  const hasDesk = useMemo(() => allDesks.length > 1, [allDesks]);

  // Only Norman's custom GL card returns a "Locations" column (a hand-mapped
  // gl_code → facility list); the shared card has no such column, so every
  // other org gets empty locations. Hide the toggle unless the data has any.
  const hasLocData = useMemo(
    () => !!rows && rows.some(r => r.locations && r.locations.trim()),
    [rows]
  );

  // Reset desk selection to "all" whenever a fresh dataset loads — except when a
  // request is pending: a `desks` URL param (PDF/print, share link) or a saved
  // view being applied pins a subset.
  const intentDesksApplied = useRef(-1);
  // Signature of the desks the loaded data actually contains. The reconcile
  // below runs ONLY when this changes: it exists to cope with new data, and
  // running it on every checkbox click is what made "None" impossible — an
  // empty selection was immediately widened back to all (see the fallback at
  // the end of this effect, which is deliberate for new data and wrong for a
  // deliberate choice).
  const loadedDesksSig = useRef(null);
  useEffect(() => {
    if (!rows || !hasDesk) {
      setSelectedDesks(null);
      loadedDesksSig.current = null;
      return;
    }
    const sig = allDesks.join('\u0000');
    // A bumped `seq` means a view was deliberately applied — including "Default
    // view", which asks for no desks at all. An apply always RESETS this
    // dimension: to the requested subset if the view names one, otherwise to
    // everything. Without that, picking Default view (or a view that filters
    // only tenders) left the previous desk filter silently in place.
    // `previous` is deliberately not passed: an apply is not a merge.
    if (intentDesksApplied.current !== intent.seq) {
      intentDesksApplied.current = intent.seq;
      loadedDesksSig.current = sig;
      setSelectedDesks(reconcileFilterSelection({
        available: allDesks, previous: null, requested: intent.desks, dataChanged: true,
      }));
      return;
    }
    // No apply, and the same desks as last time ⇒ a plain checkbox click.
    // Leave the selection exactly as the user set it, empty included.
    if (loadedDesksSig.current === sig) return;
    loadedDesksSig.current = sig;
    setSelectedDesks(prev =>
      reconcileFilterSelection({ available: allDesks, previous: prev, requested: null, dataChanged: true }) || prev);
  }, [rows, hasDesk, allDesks, intent]);

  // ── GL code filter ─────────────────────────────────────────────────────
  // Dan: "everything starts as selected/checked, there's an unselect all,
  // select all, and individual checkboxes."
  //
  // THE OPTIONS COME FROM THE ROWS, not from the org's chart of accounts, and
  // that is a measured decision rather than a shortcut. At apex the chart holds
  // 974 accounts (888 unarchived) while only 220 codes carry any activity in a
  // year — a list where two thirds of the boxes can never match a row is worse
  // than no list, and you would scroll past hundreds of dead options to reach
  // the twenty that matter in the window. Sourcing it from the chart is a
  // one-line swap here if that is ever wanted.
  const allGlCodes = useMemo(() => {
    if (!rows) return [];
    const set = new Set();
    rows.forEach(r => set.add(glOptionKey(r)));
    const arr = Array.from(set);
    // Numeric-aware sort, so 9 comes before 100 rather than after it — a GL
    // chart read in string order is unusable for finding a code.
    arr.sort((a, b) => {
      if (a === NO_GL_LABEL) return 1;
      if (b === NO_GL_LABEL) return -1;
      const na = parseFloat(a), nb = parseFloat(b);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return a.localeCompare(b, undefined, { numeric: true });
    });
    return arr;
  }, [rows]);

  const hasGlCodes = useMemo(() => allGlCodes.length > 1, [allGlCodes]);

  // Mirrors the desk effect exactly, including the signature guard: the
  // reconcile runs only when the DATA changes, never on a checkbox click, or an
  // empty selection is immediately widened back to all and "None" looks broken.
  const intentGlApplied = useRef(-1);
  const loadedGlSig = useRef(null);
  useEffect(() => {
    if (!rows || !hasGlCodes) {
      setSelectedGlCodes(null);
      loadedGlSig.current = null;
      return;
    }
    const sig = allGlCodes.join('\u0000');
    if (intentGlApplied.current !== intent.seq) {
      intentGlApplied.current = intent.seq;
      loadedGlSig.current = sig;
      setSelectedGlCodes(reconcileFilterSelection({
        available: allGlCodes, previous: null, requested: intent.glCodes, dataChanged: true,
      }));
      return;
    }
    if (loadedGlSig.current === sig) return;
    loadedGlSig.current = sig;
    setSelectedGlCodes(prev =>
      reconcileFilterSelection({ available: allGlCodes, previous: prev, requested: null, dataChanged: true }) || prev);
  }, [rows, hasGlCodes, allGlCodes, intent]);

  // Payment-method selection: reset to "all" on fresh data, honor a `methods`
  // URL param on first load (PDF / print / share link), and prune tenders that
  // drop out of the data across date changes. Mirrors the desk-filter effect.
  const intentMethodsApplied = useRef(-1);
  const loadedMethodsSig = useRef(null);
  useEffect(() => {
    if (!rows || availableMethods.length <= 1) {
      setSelectedMethods(null);
      loadedMethodsSig.current = null;
      return;
    }
    const keys = availableMethods.map(m => m.key);
    const sig = keys.join('\u0000');
    // As above: an apply resets, a click does not. See the desk effect.
    if (intentMethodsApplied.current !== intent.seq) {
      intentMethodsApplied.current = intent.seq;
      loadedMethodsSig.current = sig;
      setSelectedMethods(reconcileFilterSelection({
        available: keys, previous: null, requested: intent.methods, dataChanged: true,
      }));
      return;
    }
    if (loadedMethodsSig.current === sig) return;
    loadedMethodsSig.current = sig;
    setSelectedMethods(prev =>
      reconcileFilterSelection({ available: keys, previous: prev, requested: null, dataChanged: true }) || prev);
  }, [rows, availableMethods, intent]);

  // ── Saved views: current state, dirty check, and the CRUD calls ─────
  const methodLabels = useMemo(() => {
    const m = {};
    availableMethods.forEach(x => { m[x.key] = x.label; });
    return m;
  }, [availableMethods]);

  // The canonical filter query string for what is on screen right now. Built in
  // the same key order the server's allowlist emits, so string equality against
  // a stored view's params is a valid "has anything changed?" test.
  const currentFilterParams = useMemo(() => {
    const p = new URLSearchParams();
    if (hasDesk && selectedDesks && selectedDesks.size < allDesks.length) {
      p.set('desks', [...selectedDesks].join(','));
    }
    if (availableMethods.length > 1 && selectedMethods && selectedMethods.size < availableMethods.length) {
      p.set('methods', [...selectedMethods].join(','));
    }
    if (glFilter.trim()) p.set('glq', glFilter.trim());
    if (isTylerActive)   p.set('tyler', '1');
    return p.toString();
  }, [hasDesk, selectedDesks, allDesks, availableMethods, selectedMethods, glFilter, isTylerActive]);

  const activeView = useMemo(
    () => views.find(v => v.id === activeViewId) || null,
    [views, activeViewId]
  );

  // "Edited" = the filters (or, for a view that carries dates, the range) have
  // moved off what the view stores. Display toggles are deliberately excluded —
  // collapsing a column must not light up Save.
  const viewDirty = useMemo(() => {
    if (!activeView) return false;
    if (activeView.params !== currentFilterParams) return true;
    if (activeView.dateMode === 'fixed') {
      return startDate !== activeView.fixedStart || endDate !== activeView.fixedEnd;
    }
    if (activeView.dateMode === 'relative') {
      const r = resolveSavedRange(activeView.relativeRange);
      return startDate !== r.start || endDate !== r.end;
    }
    return false;
  }, [activeView, currentFilterParams, startDate, endDate]);

  // What a saved view asked for that this date range cannot satisfy. The old
  // behaviour was to fall back to "all" — a view named "Front desk only" that
  // quietly shows every desk is wrong in the same way a stale-cache render is
  // wrong, so say it out loud instead.
  const filterWarnings = useMemo(() => {
    const out = [];
    if (rows && hasDesk && intent.desks && intent.desks.length) {
      const missing = intent.desks.filter(d => !allDesks.includes(d));
      if (missing.length === intent.desks.length) {
        out.push('None of the ' + intent.desks.length + ' saved desk location' + (intent.desks.length === 1 ? '' : 's') +
                 ' appear in this date range — showing all desk locations.');
      } else if (missing.length) {
        out.push(missing.length + ' of ' + intent.desks.length + ' saved desk locations aren\'t in this date range: ' +
                 missing.join(', ') + '.');
      }
    }
    if (rows && availableMethods.length > 1 && intent.methods && intent.methods.length) {
      const keys = availableMethods.map(m => m.key);
      const missing = intent.methods.filter(k => !keys.includes(k));
      if (missing.length === intent.methods.length) {
        out.push('None of the saved payment methods appear in this date range — showing all tenders.');
      } else if (missing.length) {
        out.push(missing.length + ' of ' + intent.methods.length + ' saved payment methods aren\'t in this date range: ' +
                 missing.map(k => methodLabels[k] || k).join(', ') + '.');
      }
    }
    return out;
  }, [rows, hasDesk, intent, allDesks, availableMethods, methodLabels]);

  const viewsUrl = suffix => withToken('/' + orgSlug + '/' + reportType + '/api/views' + (suffix || ''));

  const loadViews = useCallback(() => {
    return fetch(viewsUrl())
      .then(r => (r.ok ? r.json() : null))
      .then(j => { if (j) setViews(j.views || []); return j; })
      .catch(() => null);
  }, []);

  // Put the view's filters on screen. `announce` is false for the automatic
  // restore on page load — that is not a user action worth logging.
  function applyView(v, announce) {
    const f = parseViewParams(v.params);
    setIntent(prev => ({ seq: prev.seq + 1, desks: f.desks, methods: f.methods }));
    setGlFilter(f.glq || '');
    if (tylerEnabled) setTylerView(f.tyler);
    setWarnDismissed(false);
    setActiveViewId(v.id);
    try { localStorage.setItem(LS_LAST_VIEW + orgSlug, v.id); } catch (_) {}

    // Dates: a view either pins them, resolves a relative range, or leaves
    // whatever range you are already on entirely alone.
    let range = null;
    if (v.dateMode === 'fixed')    range = { start: v.fixedStart, end: v.fixedEnd };
    if (v.dateMode === 'relative') range = resolveSavedRange(v.relativeRange);
    if (range) {
      setStartDate(range.start);
      setEndDate(range.end);
      if (range.start !== loadedStart || range.end !== loadedEnd) fetchData(range.start, range.end);
    }

    // Keep the URL honest: it reproduces the filters AND names the view.
    try {
      const qs = new URLSearchParams(window.location.search);
      ['desks', 'methods', 'glq', 'tyler'].forEach(k => qs.delete(k));
      new URLSearchParams(v.params).forEach((val, k) => qs.set(k, val));
      qs.set('view', v.id);
      if (range) { qs.set('start_date', range.start); qs.set('end_date', range.end); }
      window.history.replaceState(null, '', window.location.pathname + '?' + qs);
    } catch (_) {}

    if (announce) logClientEvent('view-apply', { view: v.name });
    setPickerOpen(false);
    setRowMenu(null);
  }

  // "Default view" is the absence of a saved view: no filters at all. Bumping
  // `seq` with every dimension null is what makes the effects above reset each
  // one back to everything.
  function clearView() {
    setIntent(prev => ({ seq: prev.seq + 1, desks: null, methods: null }));
    setGlFilter('');
    if (tylerEnabled) setTylerView(false);
    setActiveViewId(null);
    setWarnDismissed(false);
    try { localStorage.removeItem(LS_LAST_VIEW + orgSlug); } catch (_) {}
    try {
      const qs = new URLSearchParams(window.location.search);
      ['desks', 'methods', 'glq', 'tyler', 'view'].forEach(k => qs.delete(k));
      const q = qs.toString();
      window.history.replaceState(null, '', window.location.pathname + (q ? '?' + q : ''));
    } catch (_) {}
    setPickerOpen(false);
    setRowMenu(null);
  }

  async function submitView(form) {
    setViewBusy(true);
    try {
      const payload = {
        name: form.name.trim(),
        dateMode: form.dateMode,
        relativeRange: form.dateMode === 'relative' ? form.relativeRange : null,
        fixedStart: form.dateMode === 'fixed' ? startDate : null,
        fixedEnd:   form.dateMode === 'fixed' ? endDate   : null,
      };
      if (!form.renameOnly) payload.params = currentFilterParams;
      const isPatch = !!form.targetId;
      if (!isPatch) payload.replace = !!form.replace;
      const resp = await fetch(viewsUrl(isPatch ? '/' + form.targetId : ''), {
        method: isPatch ? 'PATCH' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.status === 409 && data.existingId) {
        // Same name, different view: ask before overwriting a colleague's.
        if (!window.confirm('A view named "' + payload.name + '" already exists. Replace it?')) return;
        return submitView(Object.assign({}, form, { replace: true }));
      }
      if (!resp.ok) { alert(data.error || 'Could not save the view.'); return; }
      await loadViews();
      setActiveViewId(data.view.id);
      try { localStorage.setItem(LS_LAST_VIEW + orgSlug, data.view.id); } catch (_) {}
      setSaveForm(null);
    } catch (e) {
      alert('Could not save the view: ' + e.message);
    } finally {
      setViewBusy(false);
    }
  }

  // Soft delete on the server, so the Undo below is a restore rather than a
  // re-save. The list is shared by the whole org — a mis-click has to be cheap.
  async function deleteView(v) {
    setRowMenu(null);
    try {
      const resp = await fetch(viewsUrl('/' + v.id), { method: 'DELETE', headers: { 'x-token': URL_TOKEN || '' } });
      if (!resp.ok) { const d = await resp.json().catch(() => ({})); alert(d.error || 'Could not delete the view.'); return; }
      if (activeViewId === v.id) setActiveViewId(null);
      await loadViews();
      setUndoView({ id: v.id, name: v.name });
    } catch (e) {
      alert('Could not delete the view: ' + e.message);
    }
  }

  async function restoreView(id) {
    setUndoView(null);
    try {
      const resp = await fetch(viewsUrl('/' + id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ restore: true }),
      });
      const d = await resp.json().catch(() => ({}));
      if (!resp.ok) { alert(d.error || 'Could not restore the view.'); return; }
      await loadViews();
    } catch (e) {
      alert('Could not restore the view: ' + e.message);
    }
  }

  // Load the list, then decide what we are looking at: an explicit ?view= wins;
  // failing that, and only when the URL carries no filters of its own, fall back
  // to the last view used in this browser.
  useEffect(() => {
    if (params._print === '1') return;   // the PDF renderer gets its filters from the URL
    loadViews().then(j => {
      if (!j || !Array.isArray(j.views)) return;
      const urlQs = new URLSearchParams(window.location.search);
      const named = urlQs.get('view');
      const hit = named && j.views.find(v => v.id === named);
      if (hit) { applyView(hit, false); return; }
      const hasUrlFilters = ['desks', 'methods', 'glq'].some(k => urlQs.get(k));
      if (hasUrlFilters) return;
      let lastId = null;
      try { lastId = localStorage.getItem(LS_LAST_VIEW + orgSlug); } catch (_) {}
      const last = lastId && j.views.find(v => v.id === lastId);
      if (last) applyView(last, false);
    });
  }, []);

  // The Undo window is short on purpose — it is an undo, not a trash can.
  useEffect(() => {
    if (!undoView) return;
    const t = setTimeout(() => setUndoView(null), 10000);
    return () => clearTimeout(t);
  }, [undoView]);

  useEffect(() => {
    if (!pickerOpen) return;
    function onDown(e) {
      if (pickerRef.current && !pickerRef.current.contains(e.target)) { setPickerOpen(false); setRowMenu(null); }
    }
    document.addEventListener('mousedown', onDown);
    return () => document.removeEventListener('mousedown', onDown);
  }, [pickerOpen]);

  // Manual filter changes drop the pending request for that dimension: once you
  // have taken the wheel, "2 of 3 saved desks are missing" is no longer news.
  // Returning the SAME object when there is nothing to clear matters: `intent`
  // is a dependency of the reconcile effects above, so a fresh object on every
  // checkbox click re-ran them needlessly.
  function handleDesksChange(next) {
    setSelectedDesks(next);
    setIntent(p => (p.desks === null ? p : { ...p, desks: null }));
  }
  function handleMethodsChange(next) {
    setSelectedMethods(next);
    setIntent(p => (p.methods === null ? p : { ...p, methods: null }));
  }
  function handleGlCodesChange(next) {
    setSelectedGlCodes(next);
    setIntent(p => (p.glCodes === null ? p : { ...p, glCodes: null }));
  }

  // Rows actually rendered: desk-filtered then re-collapsed to one row per GL code.
  // For orgs without a desk dimension this is a no-op (displayRows === rows).
  const displayRows = useMemo(() => {
    if (!rows) return [];
    var base;
    // Belt-and-suspenders: in print mode, apply desk filter from URL directly
    if (params._print === '1' && params.desks) {
      const allowed = new Set(params.desks.split(',').map(d => d.trim()));
      const filtered = rows.filter(r => allowed.has(r.deskLocation || NO_DESK_LABEL));
      base = aggregateByGlCode(filtered);
    } else if (!hasDesk) {
      base = rows;
    } else {
      const sel = selectedDesks || new Set(allDesks);
      const filtered = rows.filter(r => sel.has(r.deskLocation || NO_DESK_LABEL));
      base = aggregateByGlCode(filtered);
    }
    // GL CODE CHECKBOXES. Applied before the text filter and independently of
    // it: the two answer different questions ("show me exactly these accounts"
    // vs "find the one whose name mentions swim"), and an admin may well use
    // both. Only bites when a real subset is picked, so the common all-checked
    // case costs nothing.
    //
    // Print/PDF has no React state, so it reconstructs the selection from the
    // URL the same way the desk and method filters do — otherwise the exported
    // document silently shows every code the reader had filtered out.
    let glSel = selectedGlCodes;
    if (params._print === '1') {
      const urlG = new URLSearchParams(window.location.search).get('gl_codes');
      if (urlG) {
        const allow = new Set(urlG.split(',').map(x => x.trim()).filter(Boolean));
        glSel = new Set(allGlCodes.filter(c => allow.has(c)));
      }
    }
    if (glSel && allGlCodes.length > 1 && glSel.size < allGlCodes.length) {
      base = base.filter(function(r) { return glSel.has(glOptionKey(r)); });
    }
    // GL code / account name text filter
    if (glFilter && glFilter.trim()) {
      var q = glFilter.trim().toLowerCase();
      base = base.filter(function(r) {
        return (r.glCode || '').toLowerCase().indexOf(q) !== -1 ||
               (r.accountName || '').toLowerCase().indexOf(q) !== -1;
      });
    }
    // Payment-method filter: recompute each row from the selected tenders.
    // Interactive uses React state; print/PDF reconstructs it from the URL.
    let methodSel = selectedMethods;
    if (params._print === '1') {
      const urlM = new URLSearchParams(window.location.search).get('methods');
      if (urlM) {
        const allow = new Set(urlM.split(',').map(s => s.trim()).filter(Boolean));
        methodSel = new Set(availableMethods.map(m => m.key).filter(k => allow.has(k)));
      }
    }
    if (methodSel && availableMethods.length > 1 && methodSel.size < availableMethods.length) {
      base = base.map(r => applyMethodFilter(r, methodSel));
    }
    return base;
  }, [rows, hasDesk, selectedDesks, allDesks, glFilter, selectedGlCodes, allGlCodes, selectedMethods, availableMethods]);

  const totals = useMemo(() => {
    if (!displayRows) return {};
    // # payments / # refunds are DISTINCT transaction counts and don't sum across
    // GL codes — one payment fans out across item + card-fee GLs, so summing the
    // per-GL column overstates the total (Lewisburg Jul'26: 1,993 vs true 1,281).
    // The card's per-desk distinct counts ARE additive across desks (each
    // transaction_event_id has exactly one desk), so sum them once per desk over
    // the desk-filtered set. This stays correct under the desk filter; the count
    // is a desk/date concept that legitimately spans GL codes, so it isn't
    // narrowed by the GL text filter. Falls back to the old (inflated) row sum
    // only until card 17293 is updated to expose the per-desk columns.
    const deskScoped = hasDesk
      ? (rows || []).filter(r => (selectedDesks || new Set(allDesks)).has(r.deskLocation || NO_DESK_LABEL))
      : (rows || []);
    let numPayments, numRefunds;
    if (deskScoped.some(r => r.deskDistinctPayments != null)) {
      const byDesk = new Map();
      for (const r of deskScoped) {
        const k = r.deskLocation || NO_DESK_LABEL;
        if (!byDesk.has(k)) byDesk.set(k, { p: r.deskDistinctPayments || 0, rf: r.deskDistinctRefunds || 0 });
      }
      numPayments = 0; numRefunds = 0;
      for (const v of byDesk.values()) { numPayments += v.p; numRefunds += v.rf; }
    } else {
      numPayments = sumField(displayRows, 'numPayments');
      numRefunds  = sumField(displayRows, 'numRefunds');
    }
    return {
      totalPayments:      sumField(displayRows, 'totalPayments'),
      numPayments,
      totalRefunds:       sumField(displayRows, 'totalRefunds'),
      numRefunds,
      netAmount:          sumField(displayRows, 'netAmount'),
      ccPayments:         sumField(displayRows, 'ccPayments'),
      ccOnlinePayments:   sumField(displayRows, 'ccOnlinePayments'),
      ccInPersonPayments: sumField(displayRows, 'ccInPersonPayments'),
      cashPayments:       sumField(displayRows, 'cashPayments'),
      checkPayments:      sumField(displayRows, 'checkPayments'),
      orgCreditPayments:  sumField(displayRows, 'orgCreditPayments'),
      scholarshipPayments: sumField(displayRows, 'scholarshipPayments'),
    };
  }, [displayRows, rows, hasDesk, selectedDesks, allDesks]);

  // ── AI Insights ────────────────────────────────────────────────────────────
  const buildInsightsBlob = useCallback(() => {
    if (!displayRows || !displayRows.length) return null;
    return {
      totals,
      glCodeCount: displayRows.length,
      dateRange: { start: loadedStart, end: loadedEnd },
      topCodes: displayRows
        .slice().sort((a, b) => (b.netAmount || 0) - (a.netAmount || 0))
        .slice(0, 15)
        .map(r => ({ code: r.glCode, name: r.accountName, net: r.netAmount, payments: r.totalPayments, refunds: r.totalRefunds, numPayments: r.numPayments })),
      refundRate: totals.totalPayments > 0 ? (totals.totalRefunds / totals.totalPayments * 100).toFixed(1) + '%' : '0%',
    };
  }, [displayRows, totals, loadedStart, loadedEnd]);

  const sendInsightsFeedback = useCallback((score) => {
    if (!insightsTraceId) return;
    fetch(withToken('/' + orgSlug + '/' + reportType + '/api/insights/score'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ traceId: insightsTraceId, score, comment: score === 0 ? fbComment : '' }),
    }).catch(() => {});
    setFbSent(true); setFbMode(null);
  }, [insightsTraceId, fbComment, orgSlug, reportType]);

  const getInsights = useCallback(async () => {
    const blob = buildInsightsBlob();
    if (!blob) return;
    setInsightsLoading(true); setInsightsError(null);
    try {
      const resp = await fetch(withToken('/' + orgSlug + '/' + reportType + '/api/insights'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(blob),
      });
      const json = await resp.json().catch(() => ({}));
      if (!resp.ok || !json.ok) throw new Error(json.error || 'Request failed');
      setInsights(json.insights || []);
      setInsightsTraceId(json.traceId || null);
      setFbSent(false); setFbMode(null); setFbComment('');
    } catch (err) {
      setInsightsError(err.message);
    } finally {
      setInsightsLoading(false);
    }
  }, [buildInsightsBlob, orgSlug, reportType]);

  // ── Excel export ────────────────────────────────────────────────────
  function exportExcel() {
    if (!displayRows || displayRows.length === 0) return;

    const includeLocs = showLocations && displayRows.some(x => x.locations && x.locations.trim());

    const makeDataRow = r => {
      const row = {};
      row['GL Code']      = r.glCode;
      row['Account Name'] = r.accountName;
      if (includeLocs) row['Locations'] = r.locations || '';
      if (displayRows.some(x => x.accountNumber)) row['Account #'] = r.accountNumber;
      if (hasCCSplit) {
        row['CC Online Pmts']    = r.ccOnlinePayments;
        row['CC In-Person Pmts'] = r.ccInPersonPayments;
      } else {
        row['CC Payments']       = r.ccPayments;
      }
      row['Cash Payments']         = r.cashPayments;
      row['Check Payments']        = r.checkPayments;
      row['Free Payments']         = r.freePayments;
      row['Org Credit Pmts']       = r.orgCreditPayments;
      row['Scholarship Pmts']      = r.scholarshipPayments;
      row['Gift Card Pmts']        = r.giftCardPayments;
      row['Other Pmts']            = r.otherPayments;
      row['Total Payments']        = r.totalPayments;
      row['# Payments']            = r.numPayments;
      if (hasCCSplit) {
        row['CC Online Refunds']    = r.ccOnlineRefunds;
        row['CC In-Person Refunds'] = r.ccInPersonRefunds;
      } else {
        row['CC Refunds']           = r.ccRefunds;
      }
      row['Cash Refunds']          = r.cashRefunds;
      row['Check Refunds']         = r.checkRefunds;
      row['Org Credit Refunds']    = r.orgCreditRefunds;
      row['Other Refunds']         = r.otherRefunds;
      row['Total Refunds']         = r.totalRefunds;
      row['# Refunds']             = r.numRefunds;
      row['Net Amount']            = r.netAmount;
      return row;
    };

    const data = displayRows.map(makeDataRow);

    // Totals row
    const totalsRow = { 'GL Code': 'TOTALS', 'Account Name': '' };
    if (includeLocs) totalsRow['Locations'] = '';
    if (displayRows.some(x => x.accountNumber)) totalsRow['Account #'] = '';
    if (hasCCSplit) {
      totalsRow['CC Online Pmts']    = totals.ccOnlinePayments;
      totalsRow['CC In-Person Pmts'] = totals.ccInPersonPayments;
    } else {
      totalsRow['CC Payments']       = totals.ccPayments;
    }
    totalsRow['Cash Payments']       = totals.cashPayments;
    totalsRow['Check Payments']      = totals.checkPayments;
    totalsRow['Free Payments']       = sumField(displayRows, 'freePayments');
    totalsRow['Org Credit Pmts']     = sumField(displayRows, 'orgCreditPayments');
    totalsRow['Scholarship Pmts']    = sumField(displayRows, 'scholarshipPayments');
    totalsRow['Gift Card Pmts']      = sumField(displayRows, 'giftCardPayments');
    totalsRow['Other Pmts']          = sumField(displayRows, 'otherPayments');
    totalsRow['Total Payments']      = totals.totalPayments;
    totalsRow['# Payments']          = totals.numPayments;
    if (hasCCSplit) {
      totalsRow['CC Online Refunds']    = sumField(displayRows, 'ccOnlineRefunds');
      totalsRow['CC In-Person Refunds'] = sumField(displayRows, 'ccInPersonRefunds');
    } else {
      totalsRow['CC Refunds']           = sumField(displayRows, 'ccRefunds');
    }
    totalsRow['Cash Refunds']        = sumField(displayRows, 'cashRefunds');
    totalsRow['Check Refunds']       = sumField(displayRows, 'checkRefunds');
    totalsRow['Org Credit Refunds']  = sumField(displayRows, 'orgCreditRefunds');
    totalsRow['Other Refunds']       = sumField(displayRows, 'otherRefunds');
    totalsRow['Total Refunds']       = totals.totalRefunds;
    totalsRow['# Refunds']           = totals.numRefunds;
    totalsRow['Net Amount']          = totals.netAmount;
    data.push(totalsRow);

    const ws = XLSX.utils.aoa_to_sheet([
      [`${displayOrg} \u2014 GL Code Rollup \u2014 ${dateRangeLabel}`],
      []
    ]);
    XLSX.utils.sheet_add_json(ws, data, { origin: 'A3' });

    // Currency format on money columns (data starts at row 3 = index 3, header row at index 2)
    const headers = Object.keys(data[0]);
    const moneyHeaders = headers.filter(h => !['GL Code','Account Name','Locations','Account #','# Payments','# Refunds'].includes(h));
    const range = XLSX.utils.decode_range(ws['!ref']);
    for (let R = 3; R <= range.e.r; R++) {
      moneyHeaders.forEach(h => {
        const c = headers.indexOf(h);
        if (c < 0) return;
        const addr = XLSX.utils.encode_cell({ r: R, c });
        if (ws[addr]) ws[addr].z = '"$"#,##0.00';
      });
    }

    // Bold totals row
    const totalsRowIdx = 2 + data.length;
    headers.forEach((h, c) => {
      const addr = XLSX.utils.encode_cell({ r: totalsRowIdx, c });
      if (ws[addr]) ws[addr].s = { font: { bold: true } };
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'GL Rollup');
    // Handed to a popup to save rather than written straight from here — a
    // download started by a sandboxed iframe is silently dropped. See open-pdf.js.
    saveWorkbookViaPopup(XLSX, wb, `gl-report-${loadedStart || 'export'}.xlsx`);
    logClientEvent('excel');
  }


  // Fire-and-forget log to server for client-side events (excel, print)
  function logClientEvent(event, extra) {
    try {
      const parts = window.location.pathname.split('/').filter(Boolean);
      const qs = new URLSearchParams({ event });
      if (extra) Object.keys(extra).forEach(k => { if (extra[k]) qs.set(k, extra[k]); });
      if (parts.length >= 2) fetch(withToken(`/${parts[0]}/${parts[1]}/api/log?${qs}`), { method: 'POST', keepalive: true }).catch(() => {});
    } catch {}
  }

  const isPrint = params._print === '1';

  function downloadPdf() {
    const parts = window.location.pathname.split('/').filter(Boolean);
    const qs = new URLSearchParams({ start_date: loadedStart||'', end_date: loadedEnd||'' });
    // Respect the on-screen desk filter so the PDF matches the displayed rollup.
    // Only send when a subset is selected (omit ⇒ "all", keeps URL short).
    if (hasDesk && selectedDesks && selectedDesks.size < allDesks.length) {
      qs.set('desks', [...selectedDesks].join(','));
    }
    // Respect the on-screen payment-method filter so the PDF matches the view.
    if (availableMethods.length > 1 && selectedMethods && selectedMethods.size < availableMethods.length) {
      qs.set('methods', [...selectedMethods].join(','));
    }
    // Respect the GL code / account text filter so the PDF matches the view.
    if (glFilter.trim()) qs.set('glq', glFilter.trim());
    // Tyler mode → portrait Munis cover sheets instead of the landscape rollup
    if (isTylerActive) qs.set('tyler', '1');
    const pdfUrl = parts.length >= 2
      ? `/${parts[0]}/${parts[1]}/api/pdf?${qs}`
      : '/api/pdf';
    // Opened in its own window rather than downloaded — a download started by a
    // sandboxed iframe is silently dropped. See open-pdf.js.
    openReportPdf(withToken(pdfUrl), { label: isTylerActive ? 'Treasurer Turnover' : 'GL Code Rollup' });
  }

  // ── Tyler/Munis GL Account Detail ───────────────────────────────────
  // Server-rendered from its own line-level card (one row per transaction), not
  // from the rollup on screen — the rollup has already summed away the detail a
  // Munis account-detail page is made of. Same date range as the loaded report.
  function downloadMunis(fmt) {
    setMunisLoading(fmt);
    const parts = window.location.pathname.split('/').filter(Boolean);
    const qs = new URLSearchParams({ start_date: loadedStart || '', end_date: loadedEnd || '' });
    fetch(withToken(`/${parts[0]}/gl/tyler.${fmt}?${qs}`))
      .then(r => { if (!r.ok) return r.text().then(t => { throw new Error(t || ('HTTP ' + r.status)); }); return r.blob(); })
      .then(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `gl-account-detail-${loadedStart || 'export'}.${fmt}`;
        a.click(); URL.revokeObjectURL(a.href);
      })
      .catch(err => alert('Tyler export failed: ' + err.message))
      .finally(() => setMunisLoading(null));
  }

  // ── Saved-view UI ───────────────────────────────────────────────────
  // Something is worth saving when filters are active, or when the applied view
  // has drifted off what it stores. Otherwise Save stays greyed out.
  const canSaveView = !!currentFilterParams || (activeView && viewDirty);

  function openSaveDialog() {
    setPickerOpen(false);
    setRowMenu(null);
    setSaveForm(activeView && viewDirty
      ? { name: activeView.name, targetId: activeView.id, dateMode: activeView.dateMode,
          relativeRange: activeView.relativeRange || defaultSavedRange(), repin: false }
      : { name: '', targetId: null, dateMode: 'current', relativeRange: defaultSavedRange(), repin: true });
  }

  function renderViewPicker() {
    const chips = [];
    if (hasDesk && selectedDesks && selectedDesks.size < allDesks.length) {
      const picked = [...selectedDesks];
      chips.push({
        key: 'desks',
        label: picked.length === 1 ? picked[0] : picked.length + ' of ' + allDesks.length + ' desk locations',
        clear: () => handleDesksChange(new Set(allDesks)),
      });
    }
    if (availableMethods.length > 1 && selectedMethods && selectedMethods.size < availableMethods.length) {
      chips.push({
        key: 'methods',
        label: availableMethods.filter(m => selectedMethods.has(m.key)).map(m => m.label).join(', '),
        clear: () => handleMethodsChange(new Set(availableMethods.map(m => m.key))),
      });
    }
    if (glFilter.trim()) {
      chips.push({ key: 'glq', label: '"' + glFilter.trim() + '"', clear: () => setGlFilter('') });
    }

    return (
      <>
        <div className="view-wrap" ref={pickerRef}>
          <button
            className={'btn-view' + (activeView ? ' active' : '')}
            onClick={() => { setPickerOpen(o => !o); setRowMenu(null); }}
            title="Saved views — named filter sets shared across this organization"
          >
            <span className="vname">{activeView ? activeView.name : 'Default view'}</span>
            {activeView && viewDirty && <span className="vdirty">· edited</span>}
            <span className="vcaret">▾</span>
          </button>

          <button
            className="btn-save-view"
            disabled={!canSaveView}
            onClick={openSaveDialog}
            title={canSaveView
              ? 'Save the current filters as a named view'
              : 'Set a filter first — there is nothing to save yet'}
          >Save view</button>

          {pickerOpen && (
            <div className="view-dropdown">
              <div className="view-row" onClick={clearView}>
                <span className="vtick">{activeView ? '' : '✓'}</span>
                <span className="vmain">Default view<span className="vsub">no filters</span></span>
              </div>

              {views.length === 0 && (
                <div className="view-empty">No saved views yet. Set a few filters, then hit “Save view”.</div>
              )}

              {views.map(v => (
                <div key={v.id}>
                  <div className="view-row" onClick={() => applyView(v, true)}>
                    <span className="vtick">{v.id === activeViewId ? '✓' : ''}</span>
                    <span className="vmain">
                      {v.name}
                      <span className="vsub">{viewDateLabel(v)} · {viewFilterSummary(v, methodLabels)}</span>
                    </span>
                    <button
                      className="vmenu"
                      onClick={e => { e.stopPropagation(); setRowMenu(rowMenu === v.id ? null : v.id); }}
                      title="Rename, update or delete this view"
                    >⋯</button>
                  </div>
                  {rowMenu === v.id && (
                    <div className="view-actions">
                      <button onClick={() => { setRowMenu(null); setSaveForm({ name: v.name, targetId: v.id, renameOnly: true, dateMode: v.dateMode, relativeRange: v.relativeRange || defaultSavedRange() }); }}>
                        Rename…
                      </button>
                      <button
                        onClick={() => submitView({ name: v.name, targetId: v.id, dateMode: v.dateMode, relativeRange: v.relativeRange })}
                        disabled={!currentFilterParams && !activeView}
                        title="Replace this view's filters with what is on screen now"
                      >Update to current filters</button>
                      <button className="danger" onClick={() => deleteView(v)}>Delete</button>
                    </div>
                  )}
                </div>
              ))}

              <div className="view-row view-add" onClick={openSaveDialog}>
                <span className="vtick">＋</span>
                <span className="vmain">Save current view…</span>
              </div>
            </div>
          )}
        </div>

        {chips.map(c => (
          <span key={c.key} className="filter-chip">
            <span className="clabel">{c.label}</span>
            <button onClick={c.clear} title="Clear this filter">✕</button>
          </span>
        ))}
      </>
    );
  }

  // A saved view whose desks or tenders are missing from this range used to fall
  // back to "all" without a word. Say it instead.

      <div className="view-warn">
        <span>⚠</span>
        <span className="vwtext">

                onClick={() => setSaveForm(x => ({...x, targetId: null}))}

            <button
              disabled={!f.name.trim() || viewBusy}
              onClick={() => submitView(f)}
              style={{padding:'7px 16px',border:'none',borderRadius:6,background:!f.name.trim()||viewBusy?'#9db6e8':'#2563eb',color:'#fff',fontSize:13,fontWeight:600,fontFamily:'inherit',cursor:!f.name.trim()||viewBusy?'default':'pointer'}}
            >{viewBusy ? 'Saving…' : f.targetId ? (f.renameOnly ? 'Rename' : 'Update “' + f.name.trim() + '”') : 'Save view'}</button>
          </div>
        </div>
      </div>
    );
  }

  function renderUndoToast() {
    if (!undoView) return null;
    return (
      <div className="view-toast">
        <span>Deleted “{undoView.name}”</span>
        <button onClick={() => restoreView(undoView.id)}>Undo</button>
      </div>
    );
  }

  // ── Toolbar ─────────────────────────────────────────────────────────
  function renderToolbar() {
    if (isPrint) return null;
    return (
      <div className="toolbar">
        <span className="toolbar-title">GL Code Rollup</span>

        {renderViewPicker()}

        <label>
          Start
          <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} />
        </label>
        <label>
          End
          <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} />
        </label>

        <button onClick={() => setMonth(-1)} style={{fontSize:11, padding:'4px 8px'}}>Last Month</button>
        <button onClick={() => setMonth(0)}  style={{fontSize:11, padding:'4px 8px'}}>This Month</button>
        <button onClick={() => setMonth(1)}  style={{fontSize:11, padding:'4px 8px'}}>Next Month</button>

        <button
          className="btn-run"
          onClick={handleRun}
          disabled={loading}
          style={datesChanged && !loading ? { boxShadow: '0 0 0 2px #4ade80' } : {}}
        >
          {loading ? <><span className="btn-spinner" />Loading…</> : '▶ Run Report'}
        </button>

        <div className="divider" />

        {!isTylerActive && (
          <button
            className={showRefunds ? 'active' : ''}
            style={{fontSize:11, padding:'4px 10px'}}
            onClick={() => setShowRefunds(v => !v)}
          >
            {showRefunds ? '▾' : '▸'} Refund Detail
          </button>
        )}

        {!isTylerActive && hasLocData && (
          <button
            className={showLocations ? 'active' : ''}
            style={{fontSize:11, padding:'4px 10px'}}
            onClick={() => setShowLocations(v => !v)}
          >
            {showLocations ? '▾' : '▸'} Locations
          </button>
        )}

        {hasDesk && selectedDesks && (
          <CheckFilter
            slug="desk" icon="🗄️" label="Desk" title="Desk Location"
            options={allDesks}
            selected={selectedDesks}
            onChange={handleDesksChange}
          />
        )}

        {hasGlCodes && selectedGlCodes && (
          <CheckFilter
            slug="glcode" icon="🏷️" label="GL Code" title="GL Code"
            options={allGlCodes}
            selected={selectedGlCodes}
            onChange={handleGlCodesChange}
          />
        )}

        {availableMethods.length > 1 && selectedMethods && (
          <MethodFilter
            methods={availableMethods}
            selected={selectedMethods}
            onChange={handleMethodsChange}
          />
        )}

        {/* The divider rode in with the retired Table/Bar/Pie buttons; keep one
            here so the Tyler toggle is not jammed against the filters if that
            export is ever switched back on for an org. */}
        {tylerEnabled && <div className="divider" />}

        {tylerEnabled && (
          <button
            className={tylerView ? 'active' : ''}
            style={{fontSize:11, padding:'4px 10px', ...(tylerView ? {borderColor:'#f59e0b', color:'#fde68a'} : {})}}
            onClick={() => setTylerView(v => !v)}
            title="Re-render this report as the treasurer turnover cover sheets (Credit, then Cash &amp; Check)"
          >
            → Turnover
          </button>
        )}
        {munisEnabled && (
          <button
            onClick={() => downloadMunis('pdf')}
            disabled={!!munisLoading || !rows || rows.length === 0}
            title="Download the Tyler/Munis GL Account Detail (glgatddt) for this date range — line-level, cash-receipts basis"
            style={{background:'#0f766e',color:'#fff',borderColor:'#0f766e'}}
          >{munisLoading === 'pdf' ? 'Building…' : '🏛️ Tyler'}</button>
        )}
        {munisEnabled && (
          <button
            onClick={() => downloadMunis('csv')}
            disabled={!!munisLoading || !rows || rows.length === 0}
            title="The same GL Account Detail as a flat CSV for loading into Munis"
            style={{fontSize:11, padding:'4px 8px'}}
          >{munisLoading === 'csv' ? '…' : '.csv'}</button>
        )}

        <div className="toolbar-spacer" />

        <input type="text" value={glFilter} onChange={e => setGlFilter(e.target.value)}
          placeholder="Filter GL codes..."
          style={{background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.2)',borderRadius:6,padding:'5px 10px',color:'#fff',fontSize:12,fontFamily:'inherit',width:160,outline:'none'}} />

        {rows && <span className="row-count">{displayRows.length} GL code{displayRows.length !== 1 ? 's' : ''}{glFilter.trim() ? ' (filtered)' : ''}</span>}

        {rows && dataAsOf && (() => {
          const d = new Date(dataAsOf);
          const t = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
          const mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
          const ago = mins < 1 ? 'just now' : mins < 60 ? mins + 'm ago' : Math.round(mins / 60) + 'h ago';
          const stale = !!staleCacheAt;
          return <span className={'freshness' + (stale ? ' stale' : '')} title={(stale ? 'Served from a stale cache — Metabase was briefly unavailable. ' : '') + 'GL data as of ' + d.toLocaleString()}>{stale ? '⚠ ' : ''}As of {t} · {ago}</span>;
        })()}
        <button className="btn-refresh" onClick={handleRefresh} disabled={loading} title="Fetch the latest financial data now (bypasses the cache)">{loading ? '…' : '⟳ Refresh'}</button>

        <div className="divider" />

        <button onClick={() => window.print()}>🖨️ Print</button>
        <button
          className="btn-pdf"
          onClick={downloadPdf}
          disabled={pdfLoading || !rows || rows.length === 0}
        >{pdfLoading ? 'Generating…' : '📄 PDF'}</button>
        {!isTylerActive && (
          <button
            className="btn-excel"
            onClick={exportExcel}
            disabled={!rows || rows.length === 0}
          >📊 Excel</button>
        )}

        {window.ORG_CONFIG?.emailEnabled && !isPrint && (
          <button className="btn-email" onClick={() => setShowEmailModal(true)}>
            📧 Email
          </button>
        )}

      </div>
    );
  }

  // ── Summary cards ────────────────────────────────────────────────────
  function renderSummaryCards() {
    if (!rows) return null;
    const methodSubset = selectedMethods && availableMethods.length > 1 && selectedMethods.size < availableMethods.length;
    const sM = methodVis.sM;   // hide deselected tenders' cards, matching the table
    return (
      <>
      <div className="summary-cards">
        <SummaryCard label="Net Amount"     value={totals.netAmount}     color="green"  />
        <SummaryCard label="Total Payments" value={totals.totalPayments} color="blue"   />
        <SummaryCard label="Total Refunds"  value={totals.totalRefunds}  color="red"    />
        {sM('cc') && (hasCCSplit ? (
          <>
            <SummaryCard label="CC Online"    value={totals.ccOnlinePayments}   color="indigo" />
            <SummaryCard label="CC In-Person" value={totals.ccInPersonPayments} color="violet" />
          </>
        ) : (
          <SummaryCard label="Credit Card" value={totals.ccPayments} color="violet" />
        ))}
        {sM('cash')  && <SummaryCard label="Cash"  value={totals.cashPayments}  color="amber" />}
        {sM('check') && <SummaryCard label="Check" value={totals.checkPayments} color="slate" />}
        {sM('orgcredit') && <SummaryCard label="Acct Credit" value={totals.orgCreditPayments} color="teal" />}
        {sM('scholarship') && totals.scholarshipPayments > 0 && <SummaryCard label="Scholarship" value={totals.scholarshipPayments} color="purple" />}
      </div>
      {methodSubset && (
        <div style={{margin:'-4px 0 10px', fontSize:12, color:'#b45309', display:'flex', alignItems:'center', gap:6}}>
          <span>💳 Filtered to {availableMethods.filter(m => selectedMethods.has(m.key)).map(m => m.label).join(', ')}.</span>
          <span style={{color:'#9ca3af'}}>Dollar totals reflect the selected tenders; transaction counts (# Payments / # Refunds) remain whole-report.</span>
        </div>
      )}
      </>
    );
  }

  // ── Table ────────────────────────────────────────────────────────────
  function renderTable() {
    if (!displayRows || displayRows.length === 0) {
      return <div style={{textAlign:'center', padding:'40px 0', color:'#888'}}>No data found for the selected date range.</div>;
    }

    const hasAcctName = displayRows.some(r => r.accountName);
    const hasAcctNum  = displayRows.some(r => r.accountNumber);
    // Payment-method column visibility (shared with the summary cards): when a
    // tender subset is selected, hide the deselected tenders' columns entirely
    // rather than rendering zeros.
    const sM = methodVis.sM;
    const sCC = sM('cc'), sCash = sM('cash'), sChk = sM('check'), sOrg = sM('orgcredit'), sFree = sM('free'), sOth = sM('other');

    const hasScholarship = sM('scholarship') && displayRows.some(r => r.scholarshipPayments > 0);
    const hasGiftCard    = sM('giftcard')    && displayRows.some(r => r.giftCardPayments > 0);
    const hasOtherPmts   = sOth              && displayRows.some(r => r.otherPayments > 0);
    const hasLocs     = (showLocations || isPrint) && displayRows.some(r => r.locations && r.locations.trim());

    // colspan helpers — a tender group collapses to 0 cols when it's hidden
    const idCols       = 1 + (hasAcctName ? 1 : 0) + (hasLocs ? 1 : 0) + (hasAcctNum ? 1 : 0);
    const ccCols       = sCC ? (hasCCSplit ? 2 : 1) : 0;
    // "Other Pmts" group (refund view) = Free + Org Credit + Scholarship? + Gift Card? + Other?
    const otherPmtsGroupCols = (sFree ? 1 : 0) + (sOrg ? 1 : 0) + (hasScholarship ? 1 : 0) + (hasGiftCard ? 1 : 0) + (hasOtherPmts ? 1 : 0);
    // Refund columns (refund view) = CC(1-2) + Cash + Check + Org Crd + Other, each gated
    const refundCols   = showRefunds
      ? ((sCC ? (hasCCSplit ? 2 : 1) : 0) + (sCash ? 1 : 0) + (sChk ? 1 : 0) + (sOrg ? 1 : 0) + (sOth ? 1 : 0))
      : 1;

    return (
      <div className="table-wrapper">
        <table className={(showRefunds || hasScholarship || hasGiftCard || hasOtherPmts) ? 'compact' : ''}>
          <thead>
            {/* ── Group header ── */}
            <tr>
              <th className="group left" colSpan={idCols}></th>
              {sCC   && <th className="group" colSpan={ccCols}>Credit Card</th>}
              {sCash && <th className="group" colSpan={1}>Cash</th>}
              {sChk  && <th className="group" colSpan={1}>Check</th>}
              {!showRefunds && sOrg && <th className="group" colSpan={1}>Acct Credit</th>}
              {showRefunds && otherPmtsGroupCols > 0 && <th className="group" colSpan={otherPmtsGroupCols}>Other Pmts</th>}
              {!showRefunds && hasScholarship && <th className="group" colSpan={1}>Scholarship</th>}
              {!showRefunds && hasGiftCard    && <th className="group" colSpan={1}>Gift Card</th>}
              {!showRefunds && hasOtherPmts   && <th className="group" colSpan={1}>Other</th>}
              <th className="group" colSpan={1}>Total Pmts</th>
              <th className="group" colSpan={1}></th>
              <th className={`group${showRefunds ? ' refund-group' : ''}`} colSpan={refundCols}>{showRefunds ? 'Refunds' : 'Total Refunds'}</th>
              <th className="group" colSpan={1}></th>
              <th className="group" colSpan={1}>Net</th>
            </tr>

            {/* ── Column header ── */}
            <tr>
              <th className="left">GL Code</th>
              {hasAcctName && <th className="left">Account Name</th>}
              {hasLocs     && <th className="left">Locations</th>}
              {hasAcctNum  && <th className="left">Acct #</th>}

              {sCC && (hasCCSplit ? (
                <>
                  <th>CC Online</th>
                  <th>CC In-Person</th>
                </>
              ) : (
                <th>Credit Card</th>
              ))}

              {sCash && <th>Cash</th>}
              {sChk  && <th>Check</th>}

              {!showRefunds && sOrg && <th>Acct Credit</th>}
              {showRefunds && <>{sFree && <th>Free</th>}{sOrg && <th>Org Credit</th>}{hasScholarship && <th>Schlrshp</th>}{hasGiftCard && <th>Gift Card</th>}{hasOtherPmts && <th>Other</th>}</>}
              {!showRefunds && hasScholarship && <th>Scholarship</th>}
              {!showRefunds && hasGiftCard    && <th>Gift Card</th>}
              {!showRefunds && hasOtherPmts   && <th>Other</th>}

              <th>Total Pmts</th>
              <th title="Distinct payment transactions for this GL code. A single payment can post to multiple GL codes (e.g. item + card fee), so the TOTALS row counts each transaction once rather than summing this column."># Pmts</th>

              {showRefunds
                ? hasCCSplit
                  ? <>{sCC && <><th className="refund-col">CC Online</th><th className="refund-col">CC In-Prn</th></>}{sCash && <th className="refund-col">Cash</th>}{sChk && <th className="refund-col">Check</th>}{sOrg && <th className="refund-col">Org Crd</th>}{sOth && <th className="refund-col">Other</th>}</>
                  : <>{sCC && <th className="refund-col">CC</th>}{sCash && <th className="refund-col">Cash</th>}{sChk && <th className="refund-col">Check</th>}{sOrg && <th className="refund-col">Org Crd</th>}{sOth && <th className="refund-col">Other</th>}</>
                : <th>Total Rfnds</th>
              }

              <th title="Distinct refund transactions for this GL code. A single refund can post to multiple GL codes, so the TOTALS row counts each transaction once rather than summing this column."># Rfnds</th>
              <th>Net Amount</th>
            </tr>
          </thead>

          <tbody>
            {displayRows.map((r, i) => (
              <tr key={i}>
                <td className="left gl-code">{r.glCode}</td>
                {hasAcctName && <td className="left">{r.accountName}</td>}
                {hasLocs && (
                  <td className="left" style={{minWidth:120, maxWidth:200}}>
                    {r.locations && r.locations.trim() ? (
                      <div className="gl-locations">
                        {r.locations.split(',').map(l => l.trim()).filter(Boolean).map((l, i) => (
                          <span key={i} className="gl-loc-tag">{l}</span>
                        ))}
                      </div>
                    ) : null}
                  </td>
                )}
                {hasAcctNum  && <td className="left" style={{fontFamily:'IBM Plex Mono,monospace',fontSize:10}}>{r.accountNumber}</td>}

                {sCC && (hasCCSplit ? (
                  <>
                    <td><MoneyCell v={r.ccOnlinePayments}   /></td>
                    <td><MoneyCell v={r.ccInPersonPayments} /></td>
                  </>
                ) : (
                  <td><MoneyCell v={r.ccPayments} /></td>
                ))}

                {sCash && <td><MoneyCell v={r.cashPayments}  /></td>}
                {sChk  && <td><MoneyCell v={r.checkPayments} /></td>}

                {!showRefunds && sOrg && <td><MoneyCell v={r.orgCreditPayments} /></td>}
                {!showRefunds && hasScholarship && <td><MoneyCell v={r.scholarshipPayments} /></td>}
                {!showRefunds && hasGiftCard    && <td><MoneyCell v={r.giftCardPayments}    /></td>}
                {!showRefunds && hasOtherPmts   && <td><MoneyCell v={r.otherPayments}       /></td>}
                {showRefunds && (
                  <>
                    {sFree && <td><MoneyCell v={r.freePayments}      /></td>}
                    {sOrg  && <td><MoneyCell v={r.orgCreditPayments} /></td>}
                    {hasScholarship && <td><MoneyCell v={r.scholarshipPayments} /></td>}
                    {hasGiftCard    && <td><MoneyCell v={r.giftCardPayments}    /></td>}
                    {hasOtherPmts   && <td><MoneyCell v={r.otherPayments}       /></td>}
                  </>
                )}

                <td style={{fontWeight:600}}><MoneyCell v={r.totalPayments} /></td>
                <td>{r.numPayments ? r.numPayments : <span className="cell-zero">—</span>}</td>

                {showRefunds
                  ? hasCCSplit
                    ? <>
                        {sCC && <>
                          <td className="refund-col"><MoneyCell v={r.ccOnlineRefunds}    /></td>
                          <td className="refund-col"><MoneyCell v={r.ccInPersonRefunds}  /></td>
                        </>}
                        {sCash && <td className="refund-col"><MoneyCell v={r.cashRefunds}        /></td>}
                        {sChk  && <td className="refund-col"><MoneyCell v={r.checkRefunds}       /></td>}
                        {sOrg  && <td className="refund-col"><MoneyCell v={r.orgCreditRefunds}   /></td>}
                        {sOth  && <td className="refund-col"><MoneyCell v={r.otherRefunds}       /></td>}
                      </>
                    : <>
                        {sCC   && <td className="refund-col"><MoneyCell v={r.ccRefunds}          /></td>}
                        {sCash && <td className="refund-col"><MoneyCell v={r.cashRefunds}        /></td>}
                        {sChk  && <td className="refund-col"><MoneyCell v={r.checkRefunds}       /></td>}
                        {sOrg  && <td className="refund-col"><MoneyCell v={r.orgCreditRefunds}   /></td>}
                        {sOth  && <td className="refund-col"><MoneyCell v={r.otherRefunds}       /></td>}
                      </>
                  : <td style={{fontWeight:600}}><MoneyCell v={r.totalRefunds} /></td>
                }

                <td>{r.numRefunds ? r.numRefunds : <span className="cell-zero">—</span>}</td>

                <td style={{fontWeight:600, color: r.netAmount < 0 ? '#dc2626' : 'inherit'}}>
                  {fmtMoneyStr(r.netAmount)}
                </td>
              </tr>
            ))}
          </tbody>

          <tfoot>
            <tr>
              <td className="left">TOTALS</td>
              {hasAcctName && <td></td>}
              {hasLocs     && <td></td>}
              {hasAcctNum  && <td></td>}

              {sCC && (hasCCSplit ? (
                <>
                  <td>{fmtMoneyStr(totals.ccOnlinePayments)}</td>
                  <td>{fmtMoneyStr(totals.ccInPersonPayments)}</td>
                </>
              ) : (
                <td>{fmtMoneyStr(totals.ccPayments)}</td>
              ))}

              {sCash && <td>{fmtMoneyStr(totals.cashPayments)}</td>}
              {sChk  && <td>{fmtMoneyStr(totals.checkPayments)}</td>}

              {!showRefunds && sOrg && <td>{fmtMoneyStr(totals.orgCreditPayments)}</td>}
              {!showRefunds && hasScholarship && <td>{fmtMoneyStr(totals.scholarshipPayments)}</td>}
              {!showRefunds && hasGiftCard    && <td>{fmtMoneyStr(sumField(displayRows, 'giftCardPayments'))}</td>}
              {!showRefunds && hasOtherPmts   && <td>{fmtMoneyStr(sumField(displayRows, 'otherPayments'))}</td>}
              {showRefunds && (
                <>
                  {sFree && <td>{fmtMoneyStr(sumField(displayRows, 'freePayments'))}</td>}
                  {sOrg  && <td>{fmtMoneyStr(sumField(displayRows, 'orgCreditPayments'))}</td>}
                  {hasScholarship && <td>{fmtMoneyStr(totals.scholarshipPayments)}</td>}
                  {hasGiftCard    && <td>{fmtMoneyStr(sumField(displayRows, 'giftCardPayments'))}</td>}
                  {hasOtherPmts   && <td>{fmtMoneyStr(sumField(displayRows, 'otherPayments'))}</td>}
                </>
              )}

              <td>{fmtMoneyStr(totals.totalPayments)}</td>
              <td>{totals.numPayments || 0}</td>

              {showRefunds
                ? hasCCSplit
                  ? <>
                      {sCC && <>
                        <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'ccOnlineRefunds'))}</td>
                        <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'ccInPersonRefunds'))}</td>
                      </>}
                      {sCash && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'cashRefunds'))}</td>}
                      {sChk  && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'checkRefunds'))}</td>}
                      {sOrg  && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'orgCreditRefunds'))}</td>}
                      {sOth  && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'otherRefunds'))}</td>}
                    </>
                  : <>
                      {sCC   && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'ccRefunds'))}</td>}
                      {sCash && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'cashRefunds'))}</td>}
                      {sChk  && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'checkRefunds'))}</td>}
                      {sOrg  && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'orgCreditRefunds'))}</td>}
                      {sOth  && <td className="refund-col">{fmtMoneyStr(sumField(displayRows,'otherRefunds'))}</td>}
                    </>
                : <td>{fmtMoneyStr(totals.totalRefunds)}</td>
              }

              <td>{totals.numRefunds || 0}</td>

              <td style={{color: totals.netAmount < 0 ? '#dc2626' : 'inherit'}}>
                {fmtMoneyStr(totals.netAmount)}
              </td>
            </tr>
          </tfoot>
        </table>
      </div>
    );
  }

  // ── Error / loading ─────────────────────────────────────────────────
  if (error && !rows) {
    return (
      <div>
        {renderToolbar()}
        <StaleCacheBanner cachedAt={staleCacheAt} />
        <div className="page">
          <div className="error" style={{textAlign:'center',padding:'3rem 1rem'}}>
            <p style={{fontSize:'2.5rem',marginBottom:'0.5rem'}}>😔</p>
            <p style={{fontSize:'1.1rem',color:'#666'}}>Looks like reporting has encountered an issue — try loading this report again later.</p>
            <p style={{fontSize:'0.8rem',color:'#b91c1c',marginTop:'0.75rem',fontFamily:'monospace',background:'#fef2f2',padding:'8px 14px',borderRadius:6,display:'inline-block',maxWidth:500,wordBreak:'break-word'}}>{error}</p>
          </div>
        </div>
      </div>
    );
  }

  if (!rows) {
    return (
      <div>
        {renderToolbar()}
        <div className="page">
          <div className="loading">
            <div className="spinner" />
            <div className="juice-msg"><span>Squeezing the oranges…</span><span>Juicing!</span><span>Adding the pulp…</span><span>Chilling the glass…</span><span>Pouring it out…</span></div>
          </div>
        </div>
      </div>
    );
  }

  // ── Run date/time ───────────────────────────────────────────────────
  const now = new Date();
  const runDate = `${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')}/${now.getFullYear()} @ ${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()}`;

  const displayOrg = orgName || orgSlug;
  const dateRangeLabel = [
    loadedStart ? formatDisplayDate(loadedStart) : null,
    loadedEnd   ? formatDisplayDate(loadedEnd)   : null,
  ].filter(Boolean).join(' – ') || 'Current Month';

  return (
    <div>
      {renderToolbar()}

      <div className="page" style={loading ? { opacity: 0.5, pointerEvents: 'none' } : {}}>

        {renderFilterWarning()}

        {isTylerActive ? (
          /* Tyler/Munis turnover — the loaded rows re-rendered as the two
             treasurer cover sheets (credit, then cash & check) */
          <TylerSheets
            rows={displayRows}
            orgName={displayOrg}
            startDate={loadedStart || startDate}
            endDate={loadedEnd || endDate}
          />
        ) : (
          <>
            {/* Report header */}
            <div className="report-header">
              <div className="report-header-left">
                {logoUrl && <img src={logoUrl} alt="" className="report-header-logo" onError={e => e.target.style.display='none'} />}
                <div>
                  <div className="org-label">{displayOrg}</div>
                  <div className="title">GL Code Rollup</div>
                </div>
              </div>
              <div className="report-header-right">
                <div className="rh-meta" style={{fontWeight:600,marginBottom:2}}>{dateRangeLabel}</div>
              </div>
            </div>

            {/* Summary cards */}
            {renderSummaryCards()}

            {/* Content: the table. Bar and pie were retired 2026-08-22. */}
            {renderTable()}
          </>
        )}

        {/* Footer */}
        <div className="report-footer">
          <span>{displayOrg}</span>
          <span>Run Date/Time: {runDate}</span>
        </div>

        {showEmailModal && EmailSubscribeModal()}

        {/* Puppeteer marker */}
        <div id="report-ready" style={{display:'none'}} />
      </div>

      {renderSaveDialog()}
      {renderUndoToast()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
    <script src="/share-widget.js" defer></script>
    <script src="/feedback-widget.js" defer></script>
      <script src="/nav-breadcrumb.js" defer></script>
  </body>
</html>
