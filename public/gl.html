<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GL Code Rollup</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #1a1a1a;
      background: #f5f4f1;
      line-height: 1.35;
    }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: #2c2c2c;
      color: #eee;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .toolbar-title { font-weight: 600; margin-right: 8px; }
    .toolbar-spacer { flex: 1; }
    .toolbar label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toolbar input[type="date"] {
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 4px;
      background: rgba(255,255,255,.1);
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .toolbar input[type="date"]:focus { border-color: #3b82f6; }
    .toolbar input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .toolbar button {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    .toolbar button:hover { background: rgba(255,255,255,.18); }
    .toolbar button.active {
      background: rgba(255,255,255,.22);
      border-color: rgba(255,255,255,.55);
    }
    .toolbar .btn-run { background: #16a34a; border-color: #16a34a; font-weight: 600; }
    .toolbar .btn-run:hover { background: #15803d; }
    .toolbar .btn-run:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-pdf { background: #3b82f6; border-color: #3b82f6; font-weight: 600; }
    .toolbar .btn-pdf:hover { background: #2563eb; }
    .toolbar .btn-pdf:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-excel { background: #16803c; border-color: #16803c; font-weight: 600; }
    .toolbar .btn-excel:hover { background: #15692f; }
    .toolbar .btn-excel:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-email { background: #7c3aed; border-color: #7c3aed; font-weight: 600; }
    .toolbar .btn-email:hover { background: #6d28d9; }
    .toolbar .btn-email:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .divider { width: 1px; height: 28px; background: rgba(255,255,255,.15); margin: 0 4px; }
    .toolbar .row-count { font-size: 11px; color: #aaa; }
    .toolbar .freshness { font-size: 11px; color: #9ca3af; white-space: nowrap; margin: 0 2px; }
    .toolbar .freshness.stale { color: #fbbf24; font-weight: 600; }
    .toolbar .btn-refresh { font-size: 11px; padding: 4px 10px; }

    /* ── Page ── */
    .page {
      max-width: 1400px;
      margin: 16px auto;
      padding: 24px 28px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* ── Report header ── */
    .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:18px; gap:16px; }
    .report-header-left { display:flex; align-items:center; gap:14px; }
    .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
    .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
    .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
    .report-header-right { text-align:right; }
    .report-header .rh-meta { font-size:11px; color:#666; }

    /* ── Summary cards ── */
    .summary-cards {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .summary-card {
      flex: 1;
      min-width: 110px;
      padding: 10px 12px;
      border-radius: 5px;
      background: #f8f8f6;
      border: 1px solid #e4e4e0;
      border-left: 3px solid #ccc;
    }
    .summary-card .card-label {
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .summary-card .card-value {
      font-size: 15px;
      font-weight: 700;
      font-family: 'IBM Plex Mono', monospace;
      white-space: nowrap;
    }
    .summary-card.green  { border-left-color: #16a34a; }
    .summary-card.green  .card-value { color: #15803d; }
    .summary-card.blue   { border-left-color: #3b82f6; }
    .summary-card.blue   .card-value { color: #2563eb; }
    .summary-card.red    { border-left-color: #ef4444; }
    .summary-card.red    .card-value { color: #dc2626; }
    .summary-card.violet { border-left-color: #7c3aed; }
    .summary-card.violet .card-value { color: #6d28d9; }
    .summary-card.indigo { border-left-color: #4f46e5; }
    .summary-card.indigo .card-value { color: #4338ca; }
    .summary-card.amber  { border-left-color: #d97706; }
    .summary-card.amber  .card-value { color: #b45309; }
    .summary-card.slate  { border-left-color: #475569; }
    .summary-card.slate  .card-value { color: #334155; }
    .summary-card.teal   { border-left-color: #0d9488; }
    .summary-card.teal   .card-value { color: #0f766e; }
    .summary-card.purple { border-left-color: #9333ea; }
    .summary-card.purple .card-value { color: #7e22ce; }

    /* ── Table ── */
    .table-wrapper { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
    table.compact { font-size: 10px; }
    table.compact td, table.compact th { padding: 4px 5px; }
    table.compact th.left, table.compact td.left { padding-left: 6px; }

    thead th {
      background: #e4e4e0;
      border: 1px solid #ccc;
      padding: 5px 8px;
      text-align: right;
      font-weight: 600;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: #333;
      white-space: nowrap;
    }
    thead th.left { text-align: left; }
    thead th.group {
      text-align: center;
      background: #d0d0cc;
      font-size: 9px;
      border-bottom: 2px solid #aaa;
      color: #444;
    }
    thead th.group.refund-group {
      background: #fca5a5;
      border-bottom: 2px solid #f87171;
      color: #7f1d1d;
    }
    thead th.refund-col {
      background: #fee2e2;
      color: #7f1d1d;
    }
    tbody td.refund-col { background: #fff5f5; }
    tbody tr:nth-child(even) td.refund-col { background: #fef2f2; }
    tbody tr:hover td.refund-col { background: #fee2e2; }
    tfoot td.refund-col { background: #fecaca; }

    tbody td {
      border: 1px solid #e8e8e4;
      padding: 4px 8px;
      text-align: right;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      white-space: nowrap;
    }
    tbody td.left {
      text-align: left;
      font-family: 'IBM Plex Sans', sans-serif;
      white-space: normal;
    }
    tbody td.gl-code { font-weight: 700; }
    tbody tr:nth-child(even) { background: #fafaf8; }
    tbody tr:hover { background: #f0f0ec; }

    tfoot td {
      border: 1px solid #ccc;
      border-top: 2px solid #444;
      padding: 5px 8px;
      text-align: right;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      background: #ececea;
      white-space: nowrap;
    }
    tfoot td.left {
      text-align: left;
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 700;
    }

    .cell-zero { color: #c8c8c4; }
    .cell-neg  { color: #dc2626; }


    /* ── Footer ── */
    .report-footer {
      display: flex;
      justify-content: space-between;
      border-top: 2.5px solid #111;
      margin-top: 16px;
      padding-top: 6px;
      font-size: 10px;
      color: #777;
    }

    /* ── Loading / Error ── */
    .loading { text-align: center; padding: 80px 20px; color: #888; font-size: 14px; }
    .loading .spinner {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 44px;
      margin: 0 auto;
      box-sizing: border-box;
      border: 2px solid #e07b1a;
      border-top-color: #f7b96b;
      border-radius: 4px 4px 14px 14px;
      background: rgba(255, 248, 240, 0.5);
      overflow: hidden;
      box-shadow: inset -4px 0 0 rgba(255, 255, 255, 0.35);
    }
    .loading .spinner::before {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 60%;
      background: linear-gradient(180deg, #ffb24d 0%, #ff8c1f 55%, #f2710a 100%);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45);
      animation: juice-fill 2s ease-in-out infinite;
    }
    .loading .spinner::after {
      content: '';
      position: absolute;
      left: 50%; bottom: 6px;
      width: 3px; height: 3px;
      margin-left: -1.5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: -5px 7px 0 0 rgba(255, 255, 255, 0.65), 5px 12px 0 -0.5px rgba(255, 255, 255, 0.5);
      animation: juice-bubbles 2.2s ease-out infinite;
    }
    @keyframes juice-fill {
      0%   { height: 42%; }
      50%  { height: 80%; }
      100% { height: 42%; }
    }
    @keyframes juice-bubbles {
      0%   { transform: translateY(2px) scale(0.5); opacity: 0; }
      30%  { opacity: 0.9; }
      70%  { opacity: 0.6; }
      100% { transform: translateY(-22px) scale(1); opacity: 0; }
    }
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .juice-msg { position: relative; height: 1.4em; line-height: 1.4em; min-width: 190px; }
    .juice-msg span { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; animation: juice-phrase 10s infinite; }
    .juice-msg span:nth-child(1) { animation-delay: 0s; }
    .juice-msg span:nth-child(2) { animation-delay: 2s; }
    .juice-msg span:nth-child(3) { animation-delay: 4s; }
    .juice-msg span:nth-child(4) { animation-delay: 6s; }
    .juice-msg span:nth-child(5) { animation-delay: 8s; }
    @keyframes juice-phrase {
      0%   { opacity: 0; transform: translateY(5px); }
      2%   { opacity: 1; transform: translateY(0); }
      18%  { opacity: 1; transform: translateY(0); }
      20%  { opacity: 0; transform: translateY(-5px); }
      100% { opacity: 0; }
    }
    .error { text-align: center; padding: 60px 20px; color: #b91c1c; font-size: 14px; }

    /* ── GL Locations cell ── */
    .gl-locations {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 3px;
    }
    .gl-loc-tag {
      display: inline-block;
      font-size: 9px;
      font-family: 'IBM Plex Sans', sans-serif;
      background: #f0ede8;
      border: 1px solid #ddd;
      border-radius: 3px;
      padding: 1px 5px;
      color: #555;
      white-space: nowrap;
      line-height: 1.5;
    }

    /* ── Tyler turnover cover sheets ── */
    .tyler-sheet { max-width: 720px; margin: 0 auto; padding: 10px 4px 30px; }
    .tyler-sheet + .tyler-sheet { border-top: 1px dashed #bbb; padding-top: 30px; }
    .tyler-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      border-bottom: 2.5px solid #111;
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .tyler-head .town { font-size: 16px; font-weight: 700; }
    .tyler-head .sched-title { font-size: 13px; font-weight: 600; margin-top: 1px; }
    .tyler-head .sub { font-size: 9.5px; color: #888; margin-top: 4px; }
    .tyler-head .meta { text-align: right; font-size: 11px; white-space: nowrap; }
    .tyler-head .meta .turnover-type { font-weight: 700; letter-spacing: .6px; font-size: 12px; }
    .tyler-head .meta .meta-line { margin-top: 2px; color: #333; }
    /* fully reset the global GL-table styling (grey header band, right-aligned
       monospace cells) — the cover sheet mimics the town's pre-printed form */
    .tyler-table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-bottom: 20px; }
    .tyler-table thead th {
      background: none;
      border: none;
      border-bottom: 1.5px solid #111;
      text-align: left;
      padding: 4px 6px;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #333;
    }
    .tyler-table thead th.num { text-align: right; }
    .tyler-table tbody td {
      padding: 5px 6px;
      border: none;
      border-bottom: 1px solid #e8e8e4;
      text-align: left;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11.5px;
      white-space: normal;
    }
    .tyler-table tbody tr:nth-child(even) { background: none; }
    .tyler-table tbody tr:hover { background: none; }
    .tyler-table td.num { text-align: right !important; font-family: 'IBM Plex Mono', monospace !important; white-space: nowrap; }
    .tyler-table td.code { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; }
    .tyler-table td.checks { white-space: nowrap; color: #333; }
    .tyler-table tbody tr.unmapped td { background: #fef3c7; }
    .tyler-table tbody tr.unmapped td.code { color: #92400e; font-family: 'Inter', sans-serif; font-style: italic; }
    .tyler-table tfoot td {
      background: none;
      border: none;
      border-top: 2px solid #111;
      padding: 5px 6px;
      text-align: left;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      white-space: normal;
    }
    .tyler-empty {
      text-align: center;
      color: #888;
      padding: 26px 0;
      font-size: 12px;
      border-top: 1.5px solid #111;
      border-bottom: 1px solid #e8e8e4;
      margin-bottom: 20px;
    }
    .tyler-sigs { font-size: 11px; margin-top: 26px; }
    .tyler-sigs p { margin-bottom: 4px; color: #333; }
    .tyler-sig-row { display: flex; gap: 36px; margin: 30px 0 22px; }
    .tyler-sig-row .sig { flex: 2.5; border-top: 1px solid #111; padding-top: 3px; font-size: 10px; color: #555; }
    .tyler-sig-row .date { flex: 1; border-top: 1px solid #111; padding-top: 3px; font-size: 10px; color: #555; }
    .tyler-summary {
      margin-left: auto;
      width: 280px;
      font-size: 11.5px;
      margin-top: 10px;
      border-top: 1.5px solid #111;
      padding-top: 6px;
    }
    .tyler-summary .srow { display: flex; justify-content: space-between; padding: 2px 0; }
    .tyler-summary .srow.indent { padding-left: 14px; font-size: 10.5px; color: #92400e; }
    .tyler-summary .srow.total { border-top: 1px solid #111; margin-top: 4px; padding-top: 4px; font-weight: 700; }
    .tyler-summary .amt { font-family: 'IBM Plex Mono', monospace; }
    @media print {
      .tyler-sheet { page-break-after: always; max-width: 100%; }
      .tyler-sheet:last-child { page-break-after: auto; }
      .tyler-sheet + .tyler-sheet { border-top: none; padding-top: 10px; }
    }
    body.print-mode .tyler-sheet { page-break-after: always; max-width: 100%; }
    body.print-mode .tyler-sheet:last-child { page-break-after: auto; }
    body.print-mode .tyler-sheet + .tyler-sheet { border-top: none; padding-top: 10px; }

    /* ── Print ── */
    @media print {
      .toolbar { display: none !important; }
      body { background: #fff; }
      .page { box-shadow: none; margin: 0; padding: 12px 16px; max-width: 100%; }
      table.compact { font-size: 9px; }
      table.compact td, table.compact th { padding: 3px 4px; }
    }
    body.print-mode .toolbar { display: none !important; }
    body.print-mode .page { box-shadow: none; margin: 0; padding: 12px 16px; max-width: 100%; }
    /* ── Desk filter dropdown ── */
    .loc-filter-wrap { position: relative; }
    .btn-loc-filter { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .btn-loc-filter .badge {
      background: #f59e0b; color: #1a1a1a; border-radius: 10px;
      font-size: 10px; font-weight: 700; padding: 1px 6px; line-height: 1.4;
    }
    .loc-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 200;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
      min-width: 220px; max-height: 360px; display: flex; flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .loc-dropdown-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.1);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
      color: #aaa; flex-shrink: 0;
    }
    .loc-dropdown-header-actions { display: flex; gap: 8px; }
    .loc-dropdown-header button {
      padding: 2px 6px; font-size: 10px;
      border-color: rgba(255,255,255,.15); background: rgba(255,255,255,.06);
    }
    .loc-dropdown-search { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.08); flex-shrink: 0; }
    .loc-dropdown-search input {
      width: 100%; padding: 4px 8px; background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15); border-radius: 4px;
      color: #fff; font-size: 11px; font-family: inherit; outline: none;
    }
    .loc-dropdown-search input::placeholder { color: #777; }
    .loc-dropdown-search input:focus { border-color: #3b82f6; }
    .loc-dropdown-list { overflow-y: auto; flex: 1; padding: 4px 0; }
    .loc-dropdown-list::-webkit-scrollbar { width: 4px; }
    .loc-dropdown-list::-webkit-scrollbar-track { background: transparent; }
    .loc-dropdown-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 2px; }
    .loc-item {
      display: flex; align-items: center; gap: 8px; padding: 5px 12px;
      cursor: pointer; transition: background .1s; font-size: 12px; color: #ddd;
    }
    .loc-item:hover { background: rgba(255,255,255,.07); }
    .loc-item input[type="checkbox"] { accent-color: #3b82f6; width: 13px; height: 13px; flex-shrink: 0; cursor: pointer; }
    .loc-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

    /* ── Saved views (picker + chips) ── */
    .view-wrap { position: relative; display: flex; align-items: center; gap: 6px; }
    .btn-view {
      display: flex; align-items: center; gap: 7px; white-space: nowrap;
      font-weight: 600; max-width: 260px;
    }
    .btn-view .vname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-view .vcaret { font-size: 9px; color: #aaa; }
    .btn-view .vdirty { font-size: 10px; color: #fbbf24; font-weight: 400; }
    .btn-save-view { font-size: 11px; padding: 4px 10px; }
    .btn-save-view:disabled { opacity: .45; cursor: default; }
    .view-dropdown {
      position: absolute; top: calc(100% + 6px); left: 0; z-index: 250;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
      min-width: 300px; max-width: 380px; max-height: 400px; overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,.5); padding: 4px 0;
    }
    .view-row {
      display: flex; align-items: flex-start; gap: 8px; padding: 7px 12px;
      cursor: pointer; font-size: 12.5px; color: #ddd;
    }
    .view-row:hover { background: rgba(255,255,255,.07); }
    .view-row .vtick { width: 12px; flex-shrink: 0; color: #4ade80; font-size: 11px; line-height: 1.5; }
    .view-row .vmain { flex: 1; min-width: 0; }
    .view-row .vsub {
      display: block; font-size: 10.5px; color: #888; margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .view-row .vmenu {
      flex-shrink: 0; color: #888; padding: 0 3px; font-size: 13px;
      background: none; border: none; cursor: pointer; font-family: inherit;
    }
    .view-row .vmenu:hover { color: #fff; }
    .view-actions {
      display: flex; flex-direction: column; padding: 2px 0 6px 32px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .view-actions button {
      text-align: left; background: none; border: none; color: #93c5fd;
      font-size: 11.5px; padding: 4px 12px; cursor: pointer; font-family: inherit;
    }
    .view-actions button:hover { color: #fff; }
    .view-actions button.danger { color: #f87171; }
    .view-add {
      border-top: 1px solid rgba(255,255,255,.1); margin-top: 4px; padding-top: 8px;
      color: #4ade80; font-weight: 600;
    }
    .view-empty { padding: 10px 12px; font-size: 11.5px; color: #888; }
    .filter-chip {

<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const LS_REFUND   = 'gl_refund_breakdown_v2';
// Bar and pie were retired 2026-08-22 (Dan: permanently). The key is cleared
// rather than merely ignored, so nobody debugging localStorage later finds a
// stored 'pie' and goes looking for the mode that would honour it.
try { localStorage.removeItem('gl_view_mode_v2'); } catch (_) {}
const LS_LOCS     = 'gl_show_locations_v1';
const NO_DESK_LABEL = '(No desk location)';
// The GL rollup has THREE states, not two — see sql/gl-account-detail.sql: a
// code with an account name, a code with no gl_account row, and no code at all.
// Only the last is genuinely unmapped, and it gets its own option so it can be
// ticked off rather than vanishing silently when someone picks a real code.
const NO_GL_LABEL = '(Unmapped — no GL code)';
function glOptionKey(r) {
  const c = r && r.glCode;
  return (c == null || c === '' || String(c).toLowerCase() === 'none') ? NO_GL_LABEL : String(c);
}

// ── Params / date helpers ────────────────────────────────────────────
function getParams() {
  const p = new URLSearchParams(window.location.search);
  return { start_date: p.get('start_date'), end_date: p.get('end_date'), _print: p.get('_print'), tyler: p.get('tyler'),
           glq: p.get('glq'), view: p.get('view') };
}

function toISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getCurrentMonthRange() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  return { start: toISO(new Date(y, m, 1)), end: toISO(new Date(y, m + 1, 0)) };
}

function formatDisplayDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  const M = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${M[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

// ── Money helpers ────────────────────────────────────────────────────
function pf(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }

function fmtMoney(v) {
  const n = pf(v);
  if (n === 0) return null; // null = render blank with .cell-zero
  const abs = Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n < 0 ? '-$' : '$') + abs;
}

function fmtMoneyStr(v) {
  const n = pf(v);
  const abs = Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (n < 0 ? '-$' : '$') + abs;
}

function MoneyCell({ v }) {
  const s = fmtMoney(v);
  const n = pf(v);
  if (s === null) return <span className="cell-zero">—</span>;
  if (n < 0) return <span className="cell-neg">{s}</span>;
  return <span>{s}</span>;
}

function sumField(rows, field) {
  return rows.reduce((acc, r) => acc + (r[field] ?? 0), 0);
}

// ── Re-aggregate desk-split rows back to one row per GL code ──────────
const GL_MONEY_FIELDS = [
  'ccPayments','cashPayments','checkPayments','freePayments','orgCreditPayments','scholarshipPayments',
  'giftCardPayments','otherPayments',
  'totalPayments','numPayments','ccRefunds','cashRefunds','checkRefunds',
  'orgCreditRefunds','otherRefunds','totalRefunds','numRefunds','netAmount'
];
const GL_SPLIT_FIELDS = ['ccOnlinePayments','ccInPersonPayments','ccOnlineRefunds','ccInPersonRefunds'];

// Check numbers are text but almost always digits — sort them as numbers so
// "9" lands before "104", falling back to string order for anything else.
function cmpCheckNo(a, b) {
  const na = Number(a), nb = Number(b);
  const bothNumeric = Number.isFinite(na) && Number.isFinite(nb);
  return bothNumeric ? na - nb : String(a).localeCompare(String(b));
}

function aggregateByGlCode(list) {
  const map = new Map();  // preserves first-seen (gl-code) order
  for (const r of list) {
    const key = r.glCode || '';
    let a = map.get(key);
    if (!a) {
      a = {
        glCode:        r.glCode,
        accountName:   r.accountName,
        accountNumber: r.accountNumber,
        isSplit:       r.isSplit,
        _locSet:       new Set(),
        _checkSet:     new Set(),
      };
      GL_MONEY_FIELDS.forEach(f => { a[f] = 0; });
      GL_SPLIT_FIELDS.forEach(f => { a[f] = null; });
      map.set(key, a);
    }
    GL_MONEY_FIELDS.forEach(f => { a[f] += pf(r[f]); });
    GL_SPLIT_FIELDS.forEach(f => {
      if (r[f] !== null && r[f] !== undefined) a[f] = (a[f] ?? 0) + pf(r[f]);
    });
    if (r.locations) {
      r.locations.split(',').map(x => x.trim()).filter(Boolean).forEach(l => a._locSet.add(l));
    }
    // Text, not money: union across desks rather than sum.
    if (r.checkNumbers) {
      r.checkNumbers.split(',').map(x => x.trim()).filter(Boolean).forEach(c => a._checkSet.add(c));
    }
  }
  return Array.from(map.values()).map(a => {
    a.locations = Array.from(a._locSet).sort().join(', ');
    a.checkNumbers = Array.from(a._checkSet).sort(cmpCheckNo).join(', ');
    delete a._locSet;
    delete a._checkSet;
    return a;
  });
}

// ── Normalize row ────────────────────────────────────────────────────
function StaleCacheBanner({ cachedAt }) {
  if (!cachedAt) return null;
  const when = new Date(cachedAt).toLocaleString();
  return (
    <div style={{background:'#fef3c7',borderBottom:'1px solid #f59e0b',padding:'8px 16px',textAlign:'center',fontSize:13,color:'#92400e'}}>
      ⚠️ Showing cached data from {when} — live data is temporarily unavailable
    </div>
  );
}

function normalizeRow(raw) {
  const isSplit = 'CC Online Payments' in raw;
  return {
    glCode:             raw['GL Code'] || '',
    accountName:        raw['Account Name'] || raw['GL Code Description'] || '',
    accountNumber:      raw['Account Number'] || '',
    locations:          raw['Locations'] || '',
    deskLocation:       raw['Desk Location'] || '',
    isSplit,

    // CC — adaptive
    ccPayments:         !isSplit
                          ? pf(raw['Credit Card Payments'])
                          : pf(raw['CC Online Payments']) + pf(raw['CC In-Person Payments']),
    ccOnlinePayments:   isSplit ? pf(raw['CC Online Payments'])    : null,
    ccInPersonPayments: isSplit ? pf(raw['CC In-Person Payments']) : null,

    cashPayments:       pf(raw['Cash Payments']),
    checkPayments:      pf(raw['Check Payments']),
    // Check numbers behind this row's check receipts, comma separated. Absent
    // until card 17293 carries the column, so everything downstream treats an
    // empty string as "we don't know" rather than "there were none".
    checkNumbers:       String(raw['Check Numbers'] ?? ''),
    freePayments:       pf(raw['Free Payments']),
    orgCreditPayments:  pf(raw['Organization Credit Payments']),
    scholarshipPayments: pf(raw['Scholarship Payments']),
    giftCardPayments:   pf(raw['Gift Card Payments']),
    otherPayments:      pf(raw['Other Payments']),
    totalPayments:      pf(raw['Total Payments']),
    numPayments:        pf(raw['Number of Payments']),

    // CC refunds — adaptive
    ccRefunds:          !isSplit
                          ? pf(raw['CC Refunds'])
                          : pf(raw['CC Online Refunds']) + pf(raw['CC In-Person Refunds']),
    ccOnlineRefunds:    isSplit ? pf(raw['CC Online Refunds'])    : null,
    ccInPersonRefunds:  isSplit ? pf(raw['CC In-Person Refunds']) : null,

    cashRefunds:        pf(raw['Cash Refunds']),
    checkRefunds:       pf(raw['Check Refunds']),
    orgCreditRefunds:   pf(raw['Org Credit Refunds']),
    otherRefunds:       pf(raw['Other Refunds']),
    totalRefunds:       pf(raw['Total Refunds']),
    numRefunds:         pf(raw['Number of Refunds']),

    // True distinct transaction counts at desk grain (org/date-scoped). One
    // payment fans out across multiple GL codes, so the per-GL "Number of
    // Payments" above is NOT additive — summing it double-counts. These per-desk
    // distinct counts ARE additive across desks (a transaction_event_id has
    // exactly one desk), so the app sums them once per desk for a correct TOTAL.
    // Present only after card 17293 exposes them; null on the old card.
    deskDistinctPayments: raw['Desk Distinct Payments'] != null ? pf(raw['Desk Distinct Payments']) : null,
    deskDistinctRefunds:  raw['Desk Distinct Refunds']  != null ? pf(raw['Desk Distinct Refunds'])  : null,

    netAmount:          pf(raw['Net Amount']),
  };
}

// ── Payment-method (tender) filter ────────────────────────────────────
// Each GL row already carries every tender as its own column, so "show only
// these payment methods" is a pure client-side recompute: keep the selected
// tenders, zero the rest, and re-sum each row's Payments / Refunds / Net from
// what remains. `payTotal`/`refTotal` name the canonical fields that feed the
// row total (never the split CC sub-fields — that would double-count); `zero`
// names every column to blank so the on-screen breakdown stays consistent with
// the recomputed total. Distinct transaction counts (# Payments / # Refunds)
// aren't available per tender, so they intentionally stay whole-report.
const GL_PAY_METHODS = [
  { key: 'cc',          label: 'Credit Card', payTotal: ['ccPayments'],          refTotal: ['ccRefunds'],
    zero: ['ccPayments','ccOnlinePayments','ccInPersonPayments','ccRefunds','ccOnlineRefunds','ccInPersonRefunds'] },
  { key: 'cash',        label: 'Cash',        payTotal: ['cashPayments'],        refTotal: ['cashRefunds'],      zero: ['cashPayments','cashRefunds'] },
  { key: 'check',       label: 'Check',       payTotal: ['checkPayments'],       refTotal: ['checkRefunds'],     zero: ['checkPayments','checkRefunds'] },
  { key: 'giftcard',    label: 'Gift Card',   payTotal: ['giftCardPayments'],    refTotal: [],                   zero: ['giftCardPayments'] },
  { key: 'orgcredit',   label: 'Org Credit',  payTotal: ['orgCreditPayments'],   refTotal: ['orgCreditRefunds'], zero: ['orgCreditPayments','orgCreditRefunds'] },
  { key: 'scholarship', label: 'Scholarship', payTotal: ['scholarshipPayments'], refTotal: [],                   zero: ['scholarshipPayments'] },
  { key: 'free',        label: 'Free',        payTotal: ['freePayments'],        refTotal: [],                   zero: ['freePayments'] },
  { key: 'other',       label: 'Other',       payTotal: ['otherPayments'],       refTotal: ['otherRefunds'],     zero: ['otherPayments','otherRefunds'] },
];

// Which tenders actually have activity in this dataset, so the picker lists
// only the methods the org uses instead of a wall of always-$0 rows.
function availableMethodsFor(rows) {
  if (!rows || !rows.length) return [];
  return GL_PAY_METHODS.filter(m => rows.some(r =>
    m.payTotal.some(f => pf(r[f]) !== 0) || m.refTotal.some(f => pf(r[f]) !== 0)
  ));
}

// Recompute one row against a selected-tender set: zero the deselected tenders
// and re-sum Payments / Refunds / Net from what's left. Returns a fresh object
// (never mutates the source row).
function applyMethodFilter(r, sel) {
  const nr = { ...r };
  let tp = 0, tr = 0;
  for (const m of GL_PAY_METHODS) {
    if (sel.has(m.key)) {
      for (const f of m.payTotal) tp += pf(r[f]);
      for (const f of m.refTotal) tr += pf(r[f]);
    } else {
      for (const f of m.zero) if (nr[f] != null) nr[f] = 0;
    }
  }
  nr.totalPayments = tp;
  nr.totalRefunds  = tr;
  nr.netAmount     = tp - tr;
  return nr;
}

// ── Summary card ─────────────────────────────────────────────────────
function SummaryCard({ label, value, color = 'blue' }) {
  const n = pf(value);
  const abs = Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  const display = (n < 0 ? '-$' : '$') + abs;
  return (
    <div className={`summary-card ${color}`}>
      <div className="card-label">{label}</div>
      <div className="card-value">{display}</div>
    </div>
  );
}

// ── Tyler/Munis treasurer turnover ("→ Tyler" toggle) ─────────────────
// Client-side pivot of the GL rows already on screen into the Munis
// "Schedule of Departmental Payments to the Treasurer" cover sheets:
// one for credit-card receipts, one for cash + check. Gross receipts only —
// refunds run separately through the AP warrant and never appear here.
// Org Credit / Free / Scholarship / Gift Card are non-cash and stay off.

function fmtMDY(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${m}/${d}/${y}`;
}

// Short code: -427001-NY* (next-year deferred) codes ARE their NY* suffix;
// everything else comes from the per-org map (rec.us doesn't store them).
function tylerShortCode(fullNumber, shortCodes) {
  if (!fullNumber) return '';
  const ny = fullNumber.match(/-427001-(NY[\w-]*)$/i);
  if (ny) return ny[1].toUpperCase();
  return (shortCodes || {})[fullNumber] || '';
}

// Pivot loaded GL rows into one turnover's line items (version B: active only).
function buildTurnover(rows, amountOf, shortCodes, checksOf) {
  const lines = [];
  let unmappedTotal = 0;
  for (const r of rows) {
    // Littleton's junk test account — never belongs on a treasurer sheet
    if (r.glCode === '001' || (r.accountName || '').trim().toUpperCase() === 'TEST - GL') continue;
    const amt = amountOf(r);
    if (!amt) continue;
    // Blank/none GL must surface as its own flagged line — Munis rejects a
    // turnover with an unmapped GL row, so it's a fix-upstream signal.
    const unmapped = !r.glCode || String(r.glCode).toLowerCase() === 'none';
    const fullNumber = unmapped ? '' : (r.accountNumber || r.glCode || '');
    if (unmapped) unmappedTotal += amt;
    lines.push({
      name: r.accountName || (unmapped ? 'Unmapped receipts' : r.glCode),
      code: unmapped ? '' : tylerShortCode(fullNumber, shortCodes),
      number: fullNumber,
      unmapped,
      amount: amt > 0 ? amt : 0,
      fee: amt < 0 ? amt : 0,   // negative amounts land in the Fees column
      checks: checksOf ? (checksOf(r) || '') : '',
    });
  }
  lines.sort((a, b) => (a.unmapped - b.unmapped) || a.number.localeCompare(b.number) || a.name.localeCompare(b.name));
  return {
    lines,
    amountTotal: lines.reduce((s, l) => s + l.amount, 0),
    feeTotal:    lines.reduce((s, l) => s + l.fee, 0),
    unmappedTotal,
  };
}

// A check number is only ever a handful of digits, but one GL account can
// collect a lot of them in a month (median 1, p90 6, worst seen 46). List the
// first few and count the rest rather than letting one cell wrap forever.
const CHECKS_SHOWN = 4;
function formatChecks(str) {
  // Sort here as well as at aggregation: the turnover sheet can be handed rows
  // that never went through aggregateByGlCode, and a treasurer reading down the
  // column wants 6, 9, 12, 104 rather than whatever order the card emitted.
  const all = String(str || '').split(',').map(x => x.trim()).filter(Boolean).sort(cmpCheckNo);
  if (all.length === 0) return '';
  if (all.length <= CHECKS_SHOWN) return all.join(', ');
  return all.slice(0, CHECKS_SHOWN).join(', ') + ' +' + (all.length - CHECKS_SHOWN) + ' more';
}

function TylerSheet({ typeLabel, data, summaryRows, emptyText, cfg, orgName, startDate, endDate, showChecks }) {
  const hasFees = data.lines.some(l => l.fee !== 0);
  // Absent until the card carries the column — don't print an empty column.
  const withChecks = !!showChecks && data.lines.some(l => l.checks);
  const grand = data.amountTotal + data.feeTotal;
  return (
    <div className="tyler-sheet">
      <div className="tyler-head">
        <div>
          <div className="town">{cfg.entityName || orgName}</div>
          <div className="sched-title">Schedule of Departmental Payments to the Treasurer</div>
          <div className="sub">rec.us live data (GL Code Rollup, treasurer turnover format) · active accounts only</div>
        </div>
        <div className="meta">
          <div className="turnover-type">{typeLabel}</div>
          {cfg.department && <div className="meta-line">Department: {cfg.department}</div>}
          <div className="meta-line">Date: {fmtMDY(endDate)}</div>
          <div className="meta-line">{fmtMDY(startDate)} – {fmtMDY(endDate)}</div>
        </div>
      </div>

      {data.lines.length === 0 ? (
        <div className="tyler-empty">{emptyText}</div>
      ) : (
        <table className="tyler-table">
          <thead>
            <tr>
              <th>Account Name</th>
              <th>Account Code</th>
              <th>Account Number</th>
              {withChecks && <th>Check #</th>}
              <th className="num">Amount</th>
              <th className="num">Fees (negative)</th>
            </tr>
          </thead>
          <tbody>
            {data.lines.map((l, i) => (
              <tr key={i} className={l.unmapped ? 'unmapped' : ''}>
                <td>{l.name}</td>

function TylerSheets({ rows, orgName, startDate, endDate }) {

  const cashOnly  = buildTurnover(rows, r => pf(r.cashPayments), shortCodes);

// ── Desk-location multi-select filter ────────────────────────────────
// ONE checkbox filter, used by BOTH the desk picker and the GL code picker.
// A second copy of this markup would drift the first time one of them changed —
// and the thing that would drift is the All/None behaviour, which already has a
// hard-won bug fixed in it (see reconcileFilterSelection: an empty selection
// used to be re-widened back to all, which made None look broken).
//
// The selection model here is deliberately the OPPOSITE of the MultiPicker on
// programs.html, where an empty tick list MEANS all and only a Clear button is
// offered. Here everything starts CHECKED, so empty means none, and All and
// None are two genuinely different states rather than one state with two
// buttons. Dan's spec, 2026-09-01: "everything starts as selected/checked,
// there's an unselect all, select all, and individual checkboxes".
function CheckFilter({ icon, label, title, options, selected, onChange, slug }) {
  const allDesks = options, selectedDesks = selected;
  const [open, setOpen] = useState(false);
  const [search, setSearch] = useState('');
  const wrapRef = useRef(null);

  useEffect(() => {
    function onDocClick(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', onDocClick);
    return () => document.removeEventListener('mousedown', onDocClick);
  }, []);

  const filtered = allDesks.filter(d => d.toLowerCase().includes(search.toLowerCase()));
  const allSelected  = selectedDesks.size === allDesks.length;
  const noneSelected = selectedDesks.size === 0;

  function toggle(desk) {
    const next = new Set(selectedDesks);
    if (next.has(desk)) next.delete(desk); else next.add(desk);
    onChange(next);
  }
  const selectAll = () => onChange(new Set(allDesks));
  const clearAll  = () => onChange(new Set());

  const badgeCount = allSelected ? null : selectedDesks.size;

  return (
    <div className="loc-filter-wrap" ref={wrapRef} {...{ ['data-' + slug + '-wrap']: true }}>
      <button
        className={'btn-loc-filter' + (allSelected ? '' : ' active')}
        style={{fontSize:11, padding:'4px 10px', ...(allSelected ? {} : {borderColor:'#f59e0b', color:'#fde68a'})}}
        onClick={() => setOpen(o => !o)}
        {...{ ['data-' + slug + '-btn']: true }}
      >
        {icon} {label}
        {badgeCount !== null && <span className="badge" {...{ ['data-' + slug + '-badge']: badgeCount }}>{badgeCount}/{allDesks.length}</span>}
      </button>
      {open && (
        <div className="loc-dropdown">
          <div className="loc-dropdown-header">
            <span>{title}</span>
            <div className="loc-dropdown-header-actions">
              <button onClick={selectAll} disabled={allSelected} {...{ ['data-' + slug + '-all']: true }}>All</button>
              <button onClick={clearAll} disabled={noneSelected} {...{ ['data-' + slug + '-none']: true }}>None</button>
            </div>
          </div>
          {allDesks.length > 5 && (
            <div className="loc-dropdown-search">
              <input
                type="text"
                placeholder="Search…"
                value={search}
                onChange={e => setSearch(e.target.value)}
                autoFocus
              />
            </div>
          )}
          <div className="loc-dropdown-list">
            {filtered.map(desk => (
              <label className="loc-item" key={desk} {...{ ['data-' + slug + '-opt']: desk }}>
                <input
                  type="checkbox"
                  checked={selectedDesks.has(desk)}
                  onChange={() => toggle(desk)}
                />
                <span>{desk}</span>
              </label>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Payment-method picker — same dropdown chrome as DeskFilter, but toggles

function MethodFilter({ methods, selected, onChange }) {

  }

// Decide what a multi-select filter's selection should become. Returns a Set,
// or null meaning "leave the current selection exactly alone".
//
// The `dataChanged: false` case is the whole point: it is what lets someone
// clear every checkbox and have it stick. This reconcile used to run on every
// click, and its empty-overlap fallback re-widened an empty selection back to
// all — which is what made the None button look broken and unchecking the last
// box re-check everything.
//
//   requested    a set a saved view / URL param asked for, applied once
//   previous     what is selected now (null on first load)
//   available    what the loaded data actually offers
//   dataChanged  whether `available` differs from the last reconcile
function reconcileFilterSelection({ available, previous, requested, dataChanged }) {
  if (requested) {
    const want = new Set(requested);
    const valid = available.filter(v => want.has(v));
    // Nothing requested is present — show everything rather than a blank
    // report. The caller surfaces a warning saying so; it must not be silent.
    return new Set(valid.length ? valid : available);
  }
  if (!dataChanged) return null;              // the user's choice, empty included
  if (!previous) return new Set(available);   // first load ⇒ everything
  const kept = new Set(available.filter(v => previous.has(v)));
  return kept.size > 0 ? kept : new Set(available);
}

// ── Saved views ───────────────────────────────────────────────────────
// A saved view is a name + a filter query string + a date intent. It is never a
// snapshot of rows: applying one sets the same filter state a person could set
// by hand, so the PDF, print and Excel paths need to know nothing about it.
const LS_LAST_VIEW = 'gl_saved_view_last_v1_';

// The date half lives in /saved-views.js, shared with every other report that
// has saved views. One mirror of the server's getDateRange() is a risk worth
// pinning; one per page drifts the first time a token is added to one of them.
// These are thin wrappers so the reference resolves at CALL time — a deferred
// script has loaded by the time Babel runs these blocks, but reading it at
// module scope would make that an assumption rather than a fact.
function resolveSavedRange(token) { return RecSavedViews.resolveSavedRange(token); }
function fmtShortDate(iso)        { return RecSavedViews.fmtShortDate(iso); }
function viewDateLabel(v)         { return RecSavedViews.viewDateLabel(v); }

// Which ranges THIS report offers is the server's call — a GL rollup only looks
// backwards — and it arrives as ORG_CONFIG.savedViewRanges. Hardcoding it here
// is how the dialog came to offer "Today", which the server has always refused.
function savedViewRanges() {
  const r = (window.ORG_CONFIG || {}).savedViewRanges;
  return Array.isArray(r) ? r : [];
}
// The dialog's pre-selected range. Taken from the offered list rather than named
// here, so the default can never be a token this report does not offer.
function defaultSavedRange() {
  const r = savedViewRanges();
  return r.length ? r[0][0] : '';
}

function parseViewParams(params) {
  const p = new URLSearchParams(params || '');
  const csv = k => { const v = p.get(k); return v ? v.split(',').map(x => x.trim()).filter(Boolean) : null; };
  return { desks: csv('desks'), methods: csv('methods'), glCodes: csv('gl_codes'), glq: p.get('glq') || '', tyler: p.get('tyler') === '1' };
}

function viewFilterSummary(v, methodLabels) {
  const f = parseViewParams(v.params);
  const bits = [];
  if (f.desks)   bits.push(f.desks.length === 1 ? f.desks[0] : f.desks.length + ' desks');
  if (f.methods) bits.push(f.methods.map(k => (methodLabels && methodLabels[k]) || k).join(', '));
  if (f.glq)     bits.push('"' + f.glq + '"');
  if (f.tyler)   bits.push('turnover');
  return bits.length ? bits.join(' · ') : 'no filters';
}

      if (hasDesk && selectedDesks && selectedDesks.size < allDesks.length) qs.set('desks', [...selectedDesks].join(','));
