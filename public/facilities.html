            }, allSites ? 'Hide ' + hidden + ' empty sites' : 'Show all ' + totalAll + ' sites') : null),
          e('div', { className: 'aqua-panel' },
            shown.map((g, gi) => e('div', { key: gi, style: gi ? { marginTop: 16 } : null },
              shown.length > 1 ? e('h4', { style: { margin: '0 0 8px', fontSize: 11.5, fontWeight: 700, color: '#374151' } }, g.name || 'Sites',
                e('span', { className: 'n', style: { fontWeight: 500, color: '#9ca3af', fontSize: 10.5, marginLeft: 6 } }, g.sites.length + ' site' + (g.sites.length === 1 ? '' : 's'))) : null,
              e('div', { className: 'camp-cal-wrap' },
                e('div', { className: 'camp-cal', style: { gridTemplateColumns: '110px repeat(' + calCols.length + ', minmax(' + (weekly ? 22 : 14) + 'px, 1fr))' } },
                  e('div', { className: 'cc-site' }, ''),
                  calCols.map((dl, i) => hdFor(dl, i)),
                  g.sites.flatMap(site => [
                    e('div', { key: site.n + 'lbl', className: 'cc-site', title: site.n + (site.loc ? ' · ' + site.loc : '') },
                      trendChip(trendFor(site.st)), site.n),
                    calCols.map((dl, i) => calCell(site, dl, site.n + '-' + i)),
                  ]))))),
            weekly
              ? e('div', { className: 'camp-cal-legend' }, 'Fewer', RAMP6.map((c, i) => e('i', { key: i, style: { background: c, marginRight: 0 } })), 'More days booked / week')
              : e('div', { className: 'camp-cal-legend' },
                  e('span', null, e('i', { style: { background: '#2c8a50' } }), 'Check-in'),
                  e('span', null, e('i', { style: { background: '#5fae70' } }), 'Occupied'),
                  e('span', null, e('i', { style: { background: '#a4d3a0' } }), 'Checkout'),
                  e('span', null, e('i', { style: { background: '#f4f3ef', border: '1px solid #e5e3dd' } }), 'Open'),
                  trendReady
                    ? e('span', { style: { marginLeft: 6 } },
                        e('b', { className: 'cc-trend up' }, '\u25B2'), 'heating\u00A0',
                        e('b', { className: 'cc-trend down' }, '\u25BC'), 'cooling',
                        e('span', { style: { color: '#b8b5ad', marginLeft: 4 } }, '(settled days only)'))
                    : e('span', { style: { color: '#b8b5ad', marginLeft: 6 } },
                        'trend arrows need 14+ elapsed days in range'))));
        })(),

        // Campground maps — one per campsite location, with embedded editing
        // (drag pins, save) writing to the shared campmap positions store.
        locs.length ? e('div', { className: 'aqua-sec' },
          e('h3', null, 'Campground map' + (locs.length > 1 ? 's' : ''), e('span', { className: 'sub' },
            (locs.length > 1 ? locs.length + ' campsite locations' : (locs[0].name || 'sites')) + ' — deeper green = more days booked')),
          locs.map((l, i) => e('div', { className: 'aqua-panel', key: l.id || i, style: i ? { marginTop: 12 } : null },
            locs.length > 1 ? e('h4', null, l.name || ('Location ' + (i + 1)), e('span', { className: 'n' }, l.sites.length + ' site' + (l.sites.length === 1 ? '' : 's'))) : null,
            e(CampMap, { loc: l, findStat: matchStat, editable: !!CFG.token }),
            e('div', { className: 'camp-map-legend' },
              e('span', null, e('i', { style: { background: '#fff', borderColor: '#94a3b8' } }), ' No bookings'),
              CAMP_RAMP.map((c, ci) => e('i', { key: ci, style: { background: c } })),
              'More days booked'),
            e(PublicMapLink, { locId: l.id, multi: locs.length > 1 }))),
          e(CampMapStats, null)) : null,

        // Arrivals by weekday + stay length
        hasStays ? e('div', { className: 'aqua-sec' },
          e('div', { className: 'aqua-grid' },
            e('div', { className: 'aqua-panel' },
              e('h4', null, 'Check-ins by day of week', e('span', { className: 'n' }, stays.toLocaleString() + ' stays')),
              e(HBars, { color: '#2c8a50', data: DOW.map((d, i) => ({ label: d, v: dowCounts[i], valText: dowCounts[i].toLocaleString() })) })),
            e('div', { className: 'aqua-panel' },
              e('h4', null, 'Stay length', e('span', { className: 'n' }, 'nights per stay')),
              e(HBars, { color: '#2c8a50', data: lenData })))) : null,

        // Monthly seasonality
        months.length > 1 ? e('div', { className: 'aqua-sec' },
          e('h3', null, 'Stays & revenue by month'),
          e('div', { className: 'vtrend' },
            months.map((m, i) => e('div', { className: 'vtrend-row', key: i },
              e('div', { className: 'vtrend-mo' }, monthLabel(m)),
              e('div', { className: 'vtrend-track' }, e('div', { className: 'vtrend-bar', style: { width: (byMonth[m].revenue / maxMonthRev * 100) + '%', background: '#2c8a50' } })),
              e('div', { className: 'vtrend-rev' }, money(byMonth[m].revenue)),
              e('div', { className: 'vtrend-bk' }, byMonth[m].stays.toLocaleString() + ' stays')))),
        ) : null,

        // Detail table
        hasStays ? e('table', { className: 'sum-cat-table' },
          e('caption', null, 'Campsites by revenue'),
          e('thead', null, e('tr', null,
            e('th', null, 'Site'), e('th', null, 'Location'),
            e('th', { className: 'num' }, 'Stays'), e('th', { className: 'num' }, 'Days booked'),
            e('th', { className: 'num' }, 'Weekend %'), e('th', { className: 'num' }, 'Charged'))),
          e('tbody', null,
            topSites.map((s, i) => e('tr', { key: i },
              e('td', null, s.site),
              e('td', null, s.location),
              e('td', { className: 'num' }, s.stays),
              e('td', { className: 'num' }, s.days),
              e('td', { className: 'num' }, s.nights ? Math.round(s.wknd / s.nights * 100) + '%' : '—'),
              e('td', { className: 'num' }, money(s.rev)))))) : e('div', { className: 'empty' },
            e('div', { className: 'em-icon' }, '🏕️'),
            e('div', { className: 'em-title' }, 'No camping stays in this range'),
            e('div', { className: 'em-sub' }, 'Try a wider date range — mapped sites still show on the campground map above.')),
        e('div', { className: 'section-note' }, 'Camping · ' + stays.toLocaleString() + ' stays · ' + siteDays.toLocaleString() + ' booked site-days · per-day reservation feed (canceled stays not included).'),
      );
    }

    // ── Outdoor Event Spaces ──────────────────────────────────────────────
    // Pavilions, shelters, picnic areas and bounce houses — the segment every
    // parks department rents constantly and nothing here surfaced. Modelled on
    // the Camping tab (same per-day reservation feed, same panel furniture) with
    // one deliberate difference running through every figure: these are HOURLY
    // and occasionally all-day rentals, never nightly. So the unit of this tab
    // is the booked HOUR and the day-part; the word "night" does not appear.
    //
    // Why it re-fetches card 17294 (/facility/api/data) instead of using the
    // hub's summary rows: only that card carries the wall-clock Begin/End, which
    // is what makes a day-part heat map possible with no new SQL. Those times
    // need no timezone care either — reservation_timestamp_range is a `tsrange`
    // (timestamp WITHOUT time zone), so Begin/End are already local wall clock
    // and Metabase's Pacific report timezone has nothing to shift. That is the
    // opposite of the Fast Track card, where the column is a timestamptz.
    function OutdoorBanner({ bookings, hours, fill, revenue, sitesBooked }) {
      const pills = [
        ['bookings', bookings.toLocaleString()],
        ['hours booked', Math.round(hours).toLocaleString()],
        ['days used', fill == null ? '—' : Math.round(fill) + '%'],
        ['charged', money(revenue)],
        ['sites booked', sitesBooked.toLocaleString()],
      ];
      return e('div', { className: 'fac-banner fbx-pavilion' },
        e('div', { className: 'fcb-scene', dangerouslySetInnerHTML: { __html: FBX_SCENES.pavilion } }),
        e(BannerGame, { game: 'bounce', key: 'game-bounce' }),
        e('div', { className: 'fcb-overlay' },
          e('div', { className: 'fcb-kicker' }, CFG.displayName || 'Parks & Recreation'),
          e('div', { className: 'fcb-title' }, '🎪 Outdoor Event Spaces'),
          e('div', { className: 'fcb-sub' }, 'Pavilions, shelters, picnic areas & bounce houses — who books them, when, and for how long.'),
          e('div', { className: 'fcb-pills' }, pills.map((p, i) => e('span', { className: 'fcb-pill', key: i }, e('b', null, p[1]), ' ' + p[0]))),
        ),
      );
    }

    function OutdoorEventsView({ start, end }) {
      const [data, setData] = React.useState({ rows: null, err: null });
      const [locSel, setLocSel] = React.useState([]);      // [] = all locations
      const [allSites, setAllSites] = React.useState(false);
      const [insights, setInsights] = React.useState(null);
      const [insLoading, setInsLoading] = React.useState(false);
      const [insError, setInsError] = React.useState(null);
      const pinged = React.useRef(false);

      React.useEffect(() => {
        let dead = false;
        setData({ rows: null, err: null });
        const tok = CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '';
        fetch('/' + CFG.slug + '/facility/api/data?start_date=' + start + '&end_date=' + end + tok)
          .then(r => { if (!r.ok) throw new Error('Server returned ' + r.status); return r.json(); })
          .then(j => { if (!dead) setData({ rows: (j.rows || []).filter(r => OUTDOOR_TYPES.indexOf(r['Site Type']) >= 0), err: null }); })
          .catch(err => { if (!dead) setData({ rows: null, err: err.message || String(err) }); });
        return () => { dead = true; };
      }, [start, end]);

      // Activity ping — one per page load, carrying how much the tab had to show
      // (see the standing Slack activity rule). Fire-and-forget: a failed beacon
      // must never be visible to the reader.
      React.useEffect(() => {
        if (pinged.current || data.rows === null) return;
        pinged.current = true;
        const n = data.rows.filter(r => (Number(r['Multi-Day Day#']) || 0) <= 1).length;
        const tok = CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '';
        try {
          fetch('/' + CFG.slug + '/facilities/api/log?event=outdoor&n=' + n + tok, { method: 'POST', keepalive: true }).catch(() => {});
        } catch (er) { /* never let logging break the tab */ }
      }, [data.rows]);

      if (data.err) return e('div', { className: 'empty' },
        e('div', { className: 'em-icon' }, '⚠️'),
        e('div', { className: 'em-title' }, 'Could not load outdoor event space data'),
        e('div', { className: 'em-sub' }, String(data.err)));
      if (data.rows === null) return e('div', { className: 'empty' },
        e('div', { className: 'em-title', style: { color: '#9ca3af' } }, 'Loading Outdoor Event Spaces…'),
        e('div', { className: 'fac-spin' }));

      const allRows = data.rows;
      const allLocations = Array.from(new Set(allRows.map(r => r['Location'] || '—'))).sort();
      const rows = locSel.length ? allRows.filter(r => locSel.indexOf(r['Location'] || '—') >= 0) : allRows;

      // Row helpers — the hour math itself lives at module scope (see oeRowHours)
      // so it can be pinned by a spec without rendering the tab.
      const dayNum    = oeDayNum;
      const totDays   = oeTotDays;
      const isArrival = oeIsArrival;
      const isMulti   = oeIsMulti;
      const rowHours  = oeRowHours;
      const fmtHrs    = oeFmtHrs;
      const hour12    = oeHour12;
      const clockMin  = oeClockMin;
      const typeOf    = r => String(r['Site Type'] || '');
      const shortSite = f => { f = f || '—'; return f.indexOf(' - ') !== -1 ? f.split(' - ').slice(1).join(' - ') : f; };

      const arrivals   = rows.filter(isArrival);
      const bookings   = arrivals.length;
      const hourRows   = arrivals.map(rowHours).filter(h => h != null);
      const hoursTotal = hourRows.reduce((s, h) => s + h, 0);
      const avgBlock   = hourRows.length ? hoursTotal / hourRows.length : null;
      const multiDay   = arrivals.filter(isMulti).length;
      const revenue    = arrivals.reduce((s, r) => s + (Number(r['Total']) || 0), 0);
      const addOnFees  = arrivals.reduce((s, r) => s + (Number(r['Add-On Fees']) || 0), 0);
      const siteDays   = rows.length;                    // one row per site per day
      const parties    = arrivals.map(r => Number(r['Head Cnt']) || 0).filter(n => n > 0);
      const avgParty   = parties.length ? parties.reduce((a, b) => a + b, 0) / parties.length : null;

      // Day list for the range (daily cells up to ~3 months, weekly beyond)
      const days = [];
      { const endD = new Date(end + 'T00:00:00');
        for (let d = new Date(start + 'T00:00:00'); d <= endD && days.length < 1100; d.setDate(d.getDate() + 1)) days.push(fmtDate(d)); }
      const weekly = days.length > 95;

      // ── Per-site stats, with a per-day map for the calendar ───────────────
      // Keyed by (Location, short site name) so two "Shelter 1"s at different
      // parks stay separate — the same rule the Camping tab uses.
      const statByKey = {};
      rows.forEach(r => {
        const site = shortSite(r['Facility']);
        const locName = r['Location'] || '';
        const key = locName + '||' + site;
        const d = String(r['Date'] || '').slice(0, 10);
        let st = statByKey[key];
        if (!st) st = statByKey[key] = { site, location: locName, type: typeOf(r), bookings: 0, days: 0, hours: 0, rev: 0, party: 0, partyN: 0, wknd: 0, mdDays: 0, occ: {} };
        const cell = st.occ[d] || (st.occ[d] = { n: 0, hours: 0, multi: false, tips: [] });
        cell.n++;
        const h = rowHours(r);
        if (h != null) { cell.hours += h; st.hours += h; }
        if (isMulti(r)) { cell.multi = true; st.mdDays++; }
        if (cell.tips.length < 4) cell.tips.push((r['Reservee'] || 'Booked')
          + (h != null ? ' · ' + fmtHrs(h) : (isMulti(r) ? ' · day ' + dayNum(r) + ' of ' + totDays(r) : ''))
          + (r['Purpose'] ? ' · ' + r['Purpose'] : ''));
        if (isArrival(r)) {
          st.bookings++;
          st.rev += Number(r['Total']) || 0;
          const p = Number(r['Head Cnt']) || 0;
          if (p > 0) { st.party += p; st.partyN++; }
          const dw = dowOfStr(r['Date']);
          if (dw === 0 || dw === 6) st.wknd++;
        }
      });
      const statList = Object.keys(statByKey).map(k => {
        const st = statByKey[k];
        st.days = Object.keys(st.occ).length;
        return st;
      });
      const sitesBooked = statList.length;
      // Day fill, NOT occupancy: the share of (booked site × day) slots that
      // carry a booking. Honest denominator — the feed only contains sites that
      // were booked at least once, so a pavilion nobody reserved is invisible
      // here and cannot be counted against the department.
      const dayFill = sitesBooked && days.length ? (siteDays / (sitesBooked * days.length)) * 100 : null;

      const kpis = [
        { label: 'Bookings', val: bookings.toLocaleString(), cls: 'sc-blue', sub: 'reservations starting in range' },
        { label: 'Hours Booked', val: Math.round(hoursTotal).toLocaleString(), cls: 'sc-green', sub: hourRows.length.toLocaleString() + ' same-day bookings' + (multiDay ? ' · ' + multiDay + ' multi-day excl.' : '') },
        { label: 'Avg Block', val: avgBlock == null ? '—' : fmtHrs(avgBlock), cls: 'sc-amber', sub: 'hours per booking' },
        { label: 'Days Used', val: dayFill == null ? '—' : dayFill.toFixed(dayFill < 10 ? 1 : 0) + '%', cls: 'sc-purple', sub: siteDays.toLocaleString() + ' of ' + (sitesBooked * days.length).toLocaleString() + ' site-days' },
        { label: 'Charged', val: money(revenue), cls: 'sc-green', sub: 'base rental' + (addOnFees ? ' · ' + money(addOnFees) + ' add-ons' : '') },
        { label: 'Sites Booked', val: sitesBooked.toLocaleString(), cls: 'sc-muted', sub: 'distinct spaces with a booking' },
        { label: 'Avg Party', val: avgParty == null ? '—' : Math.round(avgParty).toLocaleString(), cls: 'sc-muted', sub: avgParty == null ? 'no head counts recorded' : 'where recorded (' + parties.length + ' of ' + bookings + ')' },
      ];

      // Day-part grid (see oeHeatGrid — hours covered, not hours started).
      const hg = oeHeatGrid(arrivals);
      const heat = hg.heat, heatHours = hg.hours, heatMax = hg.max;
      const hourTotals = hg.hourTotals, heatBookings = hg.timed, busiestHour = hg.peak;

      // ── Type mix (pavilion vs picnic area vs bounce house) ────────────────
      const typeAgg = {};
      arrivals.forEach(r => {
        const t = typeOf(r) || 'other';
        const b = typeAgg[t] || (typeAgg[t] = { t, n: 0, hours: 0, rev: 0, sites: {} });
        b.n++; b.rev += Number(r['Total']) || 0;
        const h = rowHours(r); if (h != null) b.hours += h;
        b.sites[(r['Location'] || '') + '||' + shortSite(r['Facility'])] = 1;
      });
      const typeList = OUTDOOR_TYPES.filter(t => typeAgg[t]).map(t => typeAgg[t])
        .concat(Object.keys(typeAgg).filter(t => OUTDOOR_TYPES.indexOf(t) < 0).map(t => typeAgg[t]));

      // ── Locations ─────────────────────────────────────────────────────────
      const locAgg = {};
      arrivals.forEach(r => {
        const l = r['Location'] || '—';
        const b = locAgg[l] || (locAgg[l] = { l, n: 0, hours: 0, rev: 0, sites: {} });
        b.n++; b.rev += Number(r['Total']) || 0;
        const h = rowHours(r); if (h != null) b.hours += h;
        b.sites[shortSite(r['Facility'])] = 1;
      });
      const locList = Object.keys(locAgg).map(k => locAgg[k]).sort((a, b) => b.n - a.n);

      // ── Popular / quiet spaces ────────────────────────────────────────────
      // Ranked on hours when the org's bookings carry times, on booking count
      // when they do not — an all-multi-day org would otherwise rank everything
      // at zero hours and present it as "least popular".
      const rankByHours = hoursTotal > 0;
      const rankVal = st => rankByHours ? st.hours : st.bookings;
      // Days used breaks the tie before revenue does: a space used on five days
      // is more used than one used on two, and a space whose bookings are all
      // multi-day has NO hours to rank on, so hours alone would drop it to the
      // bottom of the list as though nobody had booked it.
      const ranked = statList.slice().sort((a, b) => rankVal(b) - rankVal(a) || b.days - a.days || b.rev - a.rev);
      const topSites = ranked.slice(0, 10);
      // The quietest spaces must not be spaces already listed as the busiest —
      // with eight sites in view, a naive bottom-6 repeats four of the top rows
      // and reads as a contradiction.
      const quietSites = ranked.slice(Math.max(topSites.length, ranked.length - 6)).reverse();

      // ── Block length mix ──────────────────────────────────────────────────
      const BLOCKS = [
        { lbl: 'Up to 2 hrs', lo: 0,  hi: 2 },
        { lbl: '2–4 hrs',     lo: 2,  hi: 4 },
        { lbl: '4–8 hrs',     lo: 4,  hi: 8 },
        { lbl: '8 hrs+',      lo: 8,  hi: Infinity },
      ];
      const blockData = BLOCKS.map(b => {
        const n = hourRows.filter(h => h > b.lo && h <= b.hi).length;
        return { label: b.lbl, v: n, valText: n.toLocaleString() };
      }).concat(multiDay ? [{ label: 'Multi-day', v: multiDay, valText: multiDay.toLocaleString() }] : []);

      // ── Add-ons ───────────────────────────────────────────────────────────
      // "Add Ons" is a display string, e.g. "Alcohol Permit ($25.00)", sometimes
      // several comma-separated. Counted on ARRIVAL rows only — a multi-day
      // booking repeats its add-ons on every day row, which would multiply a
      // 3-day permit by three.
      const addOns = (() => {
        const byName = {};
        let withAny = 0;
        arrivals.forEach(r => {
          const raw = String(r['Add Ons'] || '').trim();
          if (!raw) return;
          withAny++;
          raw.split(/,(?![^(]*\))/).forEach(part => {
            const t = part.trim(); if (!t) return;
            const m = /^(.*?)\s*\(\$?([\d,.]+)\)\s*$/.exec(t);
            const name = (m ? m[1] : t).trim(); if (!name) return;
            const listed = m ? Number(String(m[2]).replace(/,/g, '')) : null;
            const b = byName[name] || (byName[name] = { name, n: 0, listed: null });
            b.n++;
            if (listed != null && !isNaN(listed)) b.listed = listed;
          });
        });
        return { list: Object.keys(byName).map(k => byName[k]).sort((a, b) => b.n - a.n), withAny };
      })();

      // ── Day-of-week demand, per occurrence of that weekday ────────────────
      // Normalised by how many of each weekday the range actually contains: a
      // range with five Saturdays and four Tuesdays would otherwise make
      // Saturday look busier than it is.
      const dowDemand = (() => {
        const dayCount = [0, 0, 0, 0, 0, 0, 0], byDow = [0, 0, 0, 0, 0, 0, 0];
        days.forEach(d => { dayCount[new Date(d + 'T00:00:00').getDay()]++; });
        arrivals.forEach(r => { const dw = dowOfStr(r['Date']); if (dw != null) byDow[dw]++; });
        const list = OE_DOW.map((name, i) => ({
          i, name, n: byDow[i], occurrences: dayCount[i],
          perDay: dayCount[i] ? byDow[i] / dayCount[i] : null,
        })).filter(x => x.occurrences > 0);
        const rated = list.filter(x => x.perDay != null);
        if (rated.length < 2) return null;
        const sorted = rated.slice().sort((a, b) => b.perDay - a.perDay);
        return { list, busiest: sorted[0], quietest: sorted[sorted.length - 1] };
      })();

      // ── Monthly trend ─────────────────────────────────────────────────────
      const byMonth = {};
      arrivals.forEach(r => {
        const ym = String(r['Date'] || '').slice(0, 7);
        if (!/^\d{4}-\d{2}$/.test(ym)) return;
        if (!byMonth[ym]) byMonth[ym] = { n: 0, revenue: 0, hours: 0 };
        byMonth[ym].n++;
        byMonth[ym].revenue += Number(r['Total']) || 0;
        const h = rowHours(r); if (h != null) byMonth[ym].hours += h;
      });
      const months = Object.keys(byMonth).sort();
      const maxMonthRev = Math.max(1, ...months.map(m => byMonth[m].revenue));

      // ── Calendar geometry ─────────────────────────────────────────────────
      const calCols = weekly ? (() => { const w = []; for (let i = 0; i < days.length; i += 7) w.push(days.slice(i, i + 7)); return w; })()
                             : days.map(d => [d]);
      const calGroups = (() => {
        const byLoc = {};
        ranked.forEach(st => { (byLoc[st.location] = byLoc[st.location] || []).push(st); });
        return Object.keys(byLoc).sort().map(name => ({ name, sites: byLoc[name] }));
      })();
      const CAL_CAP = 40;                       // rows shown before the toggle
      const calShown = (() => {
        if (allSites) return calGroups;
        let left = CAL_CAP;
        const out = [];
        calGroups.forEach(g => {
          if (left <= 0) return;
          const take = g.sites.slice(0, left);
          left -= take.length;
          out.push({ name: g.name, sites: take });
        });
        return out;
      })();
      const calHidden = statList.length - calShown.reduce((n, g) => n + g.sites.length, 0);

      const cellFor = (st, dList, key) => {
        if (weekly) {
          let n = 0, hrs = 0;
          dList.forEach(d => { const c = st.occ[d]; if (c) { n++; hrs += c.hours; } });
          const sh = n ? OE_RAMP[Math.min(5, 1 + Math.floor((n - 1) / dList.length * 4.999))] : OE_RAMP[0];
          return e('div', { key, className: 'cc-cell', style: { background: sh },
            title: st.site + ' · wk of ' + dList[0] + ' · ' + n + ' of ' + dList.length + ' days booked'
                 + (hrs ? ' · ' + fmtHrs(hrs) : '') });
        }
        const c = st.occ[dList[0]];
        return e('div', { key, className: 'cc-cell', style: { background: oeShade(c) },
          title: st.site + ' · ' + dList[0] + (c ? ' · ' + c.tips.join(' | ') + (c.n > c.tips.length ? ' (+' + (c.n - c.tips.length) + ' more)' : '') : ' · open') });
      };
      const hdFor = (dList, i) => {
        const d = new Date(dList[0] + 'T00:00:00');
        const we = !weekly && (d.getDay() === 0 || d.getDay() === 6);
        const lbl = weekly ? ((d.getMonth() + 1) + '/' + d.getDate())
          : (d.getDate() === 1 || i === 0 ? monthLabel(dList[0].slice(0, 7)).split(' ')[0] + ' ' + d.getDate() : String(d.getDate()));
        return e('div', { key: 'h' + i, className: 'cc-hd' + (we ? ' we' : ''), title: weekly ? dList[0] : OE_DOW[d.getDay()] + ' ' + dList[0] },
          weekly ? null : e('span', { className: 'cc-dow' }, OE_DOW1[d.getDay()]), lbl);
      };

      // ── Rec Insights ──────────────────────────────────────────────────────
      const buildBlob = () => ({
        scope: 'outdoor event spaces (pavilions, shelters, picnic areas, bounce houses) — hourly/daily rentals, not nightly',
        dateRange: { start, end, daysInRange: days.length },
        totals: { bookings, hoursBooked: Math.round(hoursTotal), sameDayBookings: hourRows.length, multiDayBookings: multiDay,
                  avgBlockHours: avgBlock == null ? null : +avgBlock.toFixed(1), sitesBooked, bookedSiteDays: siteDays,
                  dayFillPct: dayFill == null ? null : Math.round(dayFill), netRevenueUsd: Math.round(revenue),
                  addOnFeesUsd: Math.round(addOnFees), avgPartySize: avgParty == null ? null : Math.round(avgParty) },
        bookingsCoveringEachHour: Object.fromEntries(heatHours.map(h => [hour12(h), hourTotals[h]])),
        bookingsByDayOfWeek: dowDemand ? Object.fromEntries(dowDemand.list.map(x => [x.name, { bookings: x.n, perOccurrence: x.perDay == null ? null : +x.perDay.toFixed(2) }])) : null,
        blockLengthMix: blockData.map(b => ({ bucket: b.label, bookings: b.v })),
        byType: typeList.map(t => ({ type: t.t, bookings: t.n, hours: Math.round(t.hours), sites: Object.keys(t.sites).length, revenueUsd: Math.round(t.rev) })),
        byLocation: locList.slice(0, 12).map(l => ({ location: l.l, bookings: l.n, hours: Math.round(l.hours), sites: Object.keys(l.sites).length, revenueUsd: Math.round(l.rev) })),
        addOns: addOns.list.slice(0, 8).map(a => ({ addOn: a.name, attachedToBookings: a.n, listedPriceUsd: a.listed })),
        topSites: topSites.map(s => ({ site: s.site, location: s.location, type: s.type, bookings: s.bookings, hours: Math.round(s.hours), daysUsed: s.days, revenueUsd: Math.round(s.rev) })),
        quietestSites: quietSites.map(s => ({ site: s.site, location: s.location, bookings: s.bookings, hours: Math.round(s.hours) })),
        monthly: months.map(m => ({ month: m, bookings: byMonth[m].n, hours: Math.round(byMonth[m].hours), revenueUsd: Math.round(byMonth[m].revenue) })),
      });
      const getInsights = async () => {
        setInsLoading(true); setInsError(null);
        try {
          const tok = CFG.token ? '?token=' + encodeURIComponent(CFG.token) : '';
          const resp = await fetch('/' + CFG.slug + '/outdoor/api/insights' + tok, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildBlob()) });
          const j = await resp.json();
          if (!resp.ok || !j.ok) throw new Error(j.error || 'Server returned ' + resp.status);
          setInsights(j.insights || []);
        } catch (er) { setInsError(er.message || 'Could not generate insights'); }
        setInsLoading(false);
      };

      const hasBookings = bookings > 0;
      const perHour = hoursTotal > 0 ? revenue / hoursTotal : null;
      const perBooking = bookings ? revenue / bookings : null;

      return e('div', null,
        e(OutdoorBanner, { bookings, hours: hoursTotal, fill: dayFill, revenue, sitesBooked }),
        allLocations.length > 1 ? e('div', { className: 'filters', style: { marginTop: 12 } },
          e('div', { className: 'filter-group' },
            e('span', { className: 'filter-lbl' }, 'Location'),
            e(LocationFilter, { locations: allLocations, sel: locSel, setSel: setLocSel }))) : null,
        e('div', { className: 'sum-cards' },
          kpis.map((c, i) => e('div', { className: 'sum-card', key: i },
            e('div', { className: 'sc-label' }, c.label),
            e('div', { className: 'sc-val ' + c.cls }, c.val),
            e('div', { className: 'sc-sub' }, c.sub)))),

        hasBookings ? e('div', { className: 'insights-section' },
          e('div', { className: 'insights-head' },
            e('button', { type: 'button', className: 'insights-btn', onClick: getInsights, disabled: insLoading }, sparkles(), insLoading ? 'Analyzing…' : (insights ? '↻ Refresh insights' : '✨ Rec Insights')),
            insights && !insLoading ? e('span', { className: 'insights-sub' }, 'Generated from the ' + bookings.toLocaleString() + ' bookings shown') : null),
          insError && !insLoading ? e('div', { className: 'cu-error' }, e('strong', null, 'Insights unavailable: '), insError) : null,
          insights && !insLoading ? e('div', { className: 'insights-grid' },
            insights.map((ins, i) => e('div', { key: i, className: 'insight-card insight-' + (ins.type || 'signal') },
              e('div', { className: 'insight-type' }, ins.type || 'signal'),
              e('div', { className: 'insight-title' }, ins.title),
              e('div', { className: 'insight-detail' }, ins.detail),
              ins.action ? e('div', { className: 'insight-action' }, '→ ' + ins.action) : null))) : null) : null,

        // ── Day-part heat map ─────────────────────────────────────────────
        hasBookings ? e('div', { className: 'aqua-sec' },
          e('h3', null, 'When these spaces are in use', e('span', { className: 'sub' },
            'bookings covering each hour · ' + heatBookings.toLocaleString() + ' timed booking' + (heatBookings === 1 ? '' : 's'))),
          e('div', { className: 'aqua-panel' },
            e('div', { className: 'oe-heat-wrap' },
              // The data-* hooks are what scripts/ci-check-render.js asserts on:
              // a grid that rendered proves nothing, but a PEAK derived from
              // hour COVERAGE (not start times) and a timed count that excludes
              // multi-day rows both change if that math regresses.
              e('div', { className: 'oe-heat', 'data-oe-heat': 'true',
                'data-oe-peak': busiestHour >= 0 ? oeHour12(busiestHour) : 'none',
                'data-oe-timed': String(heatBookings),
                style: { gridTemplateColumns: '38px repeat(' + heatHours.length + ', minmax(20px, 1fr))' } },
                e('div', { className: 'oe-h-lbl' }, ''),
                heatHours.map((h, i) => e('div', { key: 'hh' + i, className: 'oe-h-hd' }, hour12(h))),
                OE_DOW.map((dname, dw) => [
                  e('div', { key: 'd' + dw, className: 'oe-h-lbl' }, dname),
                  heatHours.map((h, i) => {
                    const v = heat[dw][h];
                    return e('div', { key: 'c' + dw + '-' + i, className: 'oe-h-cell',
                      style: { background: v ? OE_RAMP[Math.min(5, 1 + Math.floor(v / heatMax * 4.999))] : OE_RAMP[0], color: v / heatMax > 0.6 ? '#fff' : '#8a8578' },
                      title: dname + ' ' + hour12(h) + ' · ' + v + ' booking' + (v === 1 ? '' : 's') + ' in use' },
                      v ? String(v) : '');
                  }),
                ]))),
            e('div', { className: 'camp-note' },
              busiestHour >= 0 && hourTotals[busiestHour] > 0
                ? e('span', null, 'Peak hour is ', e('b', null, hour12(busiestHour) + 'm'),
                    ' with ', e('b', null, hourTotals[busiestHour].toLocaleString()), ' bookings in use across the range. ')
                : null,
              'A booking counts in every hour it covers, so a 10am–4pm rental fills six cells. ',
              multiDay ? e('span', null, e('b', null, oePlural(multiDay, 'multi-day booking')),
                multiDay === 1 ? ' is not in this grid' : ' are not in this grid',
                ' — the feed records a multi-day booking\u2019s start and end times only on its first and last day, '
                + 'so there are no per-day hours to place.') : null)))
          : null,

        // ── Demand & pricing read ─────────────────────────────────────────
        hasBookings ? e('div', { className: 'aqua-sec' },
          e('h3', null, 'Demand & pricing signals', e('span', { className: 'sub' },
            'what the ' + bookings.toLocaleString() + ' bookings in range suggest')),
          e('div', { className: 'aqua-grid' },

            dowDemand ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Demand by day of week', e('span', { className: 'n' }, 'bookings per occurrence')),
              e(HBars, { color: '#0d9488', data: dowDemand.list.map(x => ({
                label: x.name, v: x.perDay || 0,
                valText: (x.perDay || 0).toFixed(1) + ' / ' + x.occurrences + 'd',
              })) }),
              e('div', { className: 'camp-note' },
                'Busiest ', e('b', null, dowDemand.busiest.name), ' at ',
                e('b', null, dowDemand.busiest.perDay.toFixed(1)), ' bookings per ', dowDemand.busiest.name,
                '; quietest ', e('b', null, dowDemand.quietest.name), ' at ',
                e('b', null, dowDemand.quietest.perDay.toFixed(1)), '.',
                dowDemand.quietest.perDay > 0 && dowDemand.busiest.perDay / dowDemand.quietest.perDay >= 1.5
                  ? e('span', null, ' A ', e('b', null, (dowDemand.busiest.perDay / dowDemand.quietest.perDay).toFixed(1) + '×'),
                      ' spread — weekday rates and weekday programming are both aimed at this gap.')
                  : e('span', null, ' Demand is fairly even across the week, so day-of-week pricing has little to bite on.'))) : null,

            e('div', { className: 'aqua-panel' },
              e('h4', null, 'Booking length', e('span', { className: 'n' }, avgBlock == null ? 'no times recorded' : 'avg ' + fmtHrs(avgBlock))),
              e(HBars, { color: '#7c3aed', data: blockData }),
              e('div', { className: 'camp-note' },
                hourRows.length
                  ? e('span', null, e('b', null, Math.round(hourRows.filter(h => h > 8).length / hourRows.length * 100) + '%'),
                      ' of timed bookings run longer than eight hours — most of a day. ',
                      'An hourly rate card only bites where blocks are short; where they are not, the lever is a day rate.')
                  : e('span', null, 'No booking on these spaces carries both a start and an end time in range, so length cannot be read.'))),

            typeList.length ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'By space type', e('span', { className: 'n' }, typeList.length + ' type' + (typeList.length === 1 ? '' : 's'))),
              e(HBars, { color: '#0369a1', data: typeList.map(t => ({
                label: OE_TYPE_SHORT[t.t] || siteTypeLabel(t.t), title: siteTypeLabel(t.t), v: t.n,
                valText: t.n.toLocaleString(),
                sub: oePlural(Object.keys(t.sites).length, 'site') + ' · ' + money(t.rev),
              })) }),
              e('div', { className: 'camp-note' },
                'Bounce houses and picnic areas are separate rentable sites in Rec, not add-ons on a shelter — '
                + 'so each one that books is its own booking here.')) : null,

            addOns.list.length ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Add-ons attached', e('span', { className: 'n' },
                addOns.withAny.toLocaleString() + ' of ' + bookings.toLocaleString() + ' bookings')),
              e(HBars, { color: '#c2410c', data: addOns.list.slice(0, 6).map(a => ({
                label: a.name, v: a.n,
                valText: a.n.toLocaleString() + (a.listed != null ? ' · $' + a.listed.toFixed(2) : ''),
              })) }),
              e('div', { className: 'camp-note' },
                e('b', null, Math.round(addOns.withAny / Math.max(1, bookings) * 100) + '%'),
                ' of bookings carry at least one add-on',
                addOnFees > 0 ? e('span', null, ', ', e('b', null, money(addOnFees)), ' in add-on fees booked') : null,
                '. Alcohol permits, tables and power are the usual ones — an add-on attached to a slice of bookings is a pricing lever not being pulled.')) : null,

            perHour != null ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Realized rate', e('span', { className: 'n' }, 'indicative only')),
              e('div', { className: 'camp-bignum' }, money(perHour) + ' / hr'),
              e('div', { className: 'camp-note' },
                money(perBooking), ' per booking across ', Math.round(hoursTotal).toLocaleString(), ' booked hours. ',
                e('b', null, 'Treat as a floor, not a rate card'), ' — comped and $0 bookings are real and common here, '
                + 'revenue is counted on the booking’s first day only, and manual invoice lines are missing from this '
                + 'feed entirely. The hour and day-part figures above are the reliable half of this tab.')) : null))
          : null,

        // ── Most and least booked ─────────────────────────────────────────
        hasBookings ? e('div', { className: 'aqua-sec' },
          e('h3', null, quietSites.length ? 'Most and least booked spaces' : 'Busiest spaces',
            e('span', { className: 'sub' }, rankByHours ? 'ranked by hours booked' : 'ranked by bookings')),
          e('div', { className: 'aqua-grid' },
            e('div', { className: 'aqua-panel' },
              // With no quietest panel beside it there is nothing to tell apart,
              // and the section heading above already says "Busiest spaces".
              quietSites.length ? e('h4', null, 'Busiest spaces', e('span', { className: 'n' }, 'top ' + topSites.length)) : null,
              e(HBars, { color: '#15803d', data: topSites.map(s => ({
                label: s.site, title: s.site + ' · ' + s.location,
                v: rankVal(s),
                valText: rankByHours ? fmtHrs(s.hours) : s.bookings.toLocaleString(),
                sub: oePlural(s.days, 'day') + ' used · ' + money(s.rev)
                   + (s.mdDays ? ' · ' + s.mdDays + 'd multi-day' : ''),
              })) }),
              statList.some(x => x.mdDays) ? e('div', { className: 'camp-note' },
                'A space booked across several days shows fewer HOURS than it was used for — '
                + 'the feed records a multi-day booking\u2019s times only on its first and last day. '
                + 'Those days are called out on the bar and counted in "days used".') : null),
            quietSites.length ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Quietest spaces', e('span', { className: 'n' }, 'of those booked at all')),
              e(HBars, { color: '#9ca3af', data: quietSites.map(s => ({
                label: s.site, title: s.site + ' · ' + s.location,
                v: rankVal(s),
                valText: rankByHours ? fmtHrs(s.hours) : s.bookings.toLocaleString(),
                sub: oePlural(s.days, 'day') + ' used' + (s.mdDays ? ' · ' + s.mdDays + 'd multi-day' : ''),
              })) }),
              e('div', { className: 'camp-note' },
                'These are the quietest spaces ', e('b', null, 'that booked at least once'),
                '. A pavilion nobody reserved in this range is not in the reservation feed at all, so it cannot appear '
                + 'here — read this as "least used of the ones in play", never as the full inventory.')) : null)) : null,

        // ── Locations ─────────────────────────────────────────────────────
        locList.length > 1 ? e('div', { className: 'aqua-sec' },
          e('h3', null, 'By park / location'),
          e('div', { className: 'aqua-panel' },
            e(HBars, { color: '#0891b2', data: locList.slice(0, 12).map(l => ({
              label: l.l, v: l.n,
              valText: l.n.toLocaleString(),
              sub: oePlural(Object.keys(l.sites).length, 'site') + ' · ' + (l.hours ? fmtHrs(l.hours) + ' · ' : '') + money(l.rev),
            })) }))) : null,

        // ── Site × day calendar ───────────────────────────────────────────
        statList.length ? e('div', { className: 'aqua-sec' },
          e('h3', null, 'Space usage calendar', e('span', { className: 'sub' },
            weekly ? 'weekly — deeper amber = more days booked' : 'deeper amber = more hours booked that day'),
            calHidden > 0 ? e('button', {
              onClick: () => setAllSites(v => !v),
              style: { marginLeft: 10, fontSize: 10, fontWeight: 600, color: '#b45309', background: 'none', border: '1px solid #fcd34d', borderRadius: 12, padding: '1px 9px', cursor: 'pointer', textTransform: 'none', letterSpacing: 0 },
            }, allSites ? 'Show top ' + CAL_CAP + ' only' : 'Show all ' + statList.length + ' spaces') : null),
          e('div', { className: 'aqua-panel' },
            calShown.map((g, gi) => e('div', { key: gi, style: gi ? { marginTop: 16 } : null },
              calShown.length > 1 ? e('h4', { style: { margin: '0 0 8px', fontSize: 11.5, fontWeight: 700, color: '#374151' } }, g.name || 'Spaces',
                e('span', { className: 'n', style: { fontWeight: 500, color: '#9ca3af', fontSize: 10.5, marginLeft: 6 } }, g.sites.length + ' space' + (g.sites.length === 1 ? '' : 's'))) : null,
              e('div', { className: 'camp-cal-wrap' },
                e('div', { className: 'camp-cal', style: { gridTemplateColumns: '130px repeat(' + calCols.length + ', minmax(' + (weekly ? 22 : 14) + 'px, 1fr))' } },
                  e('div', { className: 'cc-site' }, ''),
                  calCols.map((dl, i) => hdFor(dl, i)),
                  g.sites.flatMap(st => [
                    e('div', { key: st.site + '|' + st.location + '|lbl', className: 'cc-site', title: st.site + (st.location ? ' · ' + st.location : '') + ' · ' + siteTypeLabel(st.type) }, st.site),
                    calCols.map((dl, i) => cellFor(st, dl, st.site + '|' + st.location + '-' + i)),
                  ]))))),
            e('div', { className: 'camp-cal-legend' },
              e('span', null, 'Fewer'),
              OE_RAMP.slice(1).map((c, i) => e('i', { key: i, style: { background: c, marginRight: 0 } })),
              e('span', null, weekly ? 'More days booked / week' : 'More hours booked'),
              multiDay ? e('span', { style: { marginLeft: 6 } },
                e('i', { style: { background: OE_MULTI } }), 'Multi-day (hours not recorded)') : null))) : null,

        // ── Monthly ───────────────────────────────────────────────────────
        months.length > 1 ? e('div', { className: 'aqua-sec' },
          e('h3', null, 'Bookings & revenue by month'),
          e('div', { className: 'vtrend' },
            months.map((m, i) => e('div', { className: 'vtrend-row', key: i },
              e('div', { className: 'vtrend-mo' }, monthLabel(m)),
              e('div', { className: 'vtrend-track' }, e('div', { className: 'vtrend-bar', style: { width: (byMonth[m].revenue / maxMonthRev * 100) + '%', background: '#d97706' } })),
              e('div', { className: 'vtrend-rev' }, money(byMonth[m].revenue)),
              e('div', { className: 'vtrend-bk' }, byMonth[m].n.toLocaleString() + ' bookings'))))) : null,

        // ── Detail table ──────────────────────────────────────────────────
        hasBookings ? e('table', { className: 'sum-cat-table' },
          e('caption', null, statList.length > topSites.length
            ? 'Top ' + topSites.length + ' outdoor event spaces by usage — of ' + statList.length + ' booked'
            : 'Outdoor event spaces by usage'),
          e('thead', null, e('tr', null,
            e('th', null, 'Space'), e('th', null, 'Location'), e('th', null, 'Type'),
            e('th', { className: 'num' }, 'Bookings'), e('th', { className: 'num' }, 'Hours'),
            e('th', { className: 'num' }, 'Days used'), e('th', { className: 'num' }, 'Weekend %'),
            e('th', { className: 'num' }, 'Avg party'), e('th', { className: 'num' }, 'Charged'))),
          e('tbody', null,
            topSites.map((s, i) => e('tr', { key: i },
              e('td', null, s.site),
              e('td', null, s.location),
              e('td', null, siteTypeLabel(s.type)),
              e('td', { className: 'num' }, s.bookings),
              e('td', { className: 'num' }, s.hours ? fmtHrs(s.hours) : '—'),
              e('td', { className: 'num' }, s.days),
              e('td', { className: 'num' }, s.bookings ? Math.round(s.wknd / s.bookings * 100) + '%' : '—'),
              e('td', { className: 'num' }, s.partyN ? Math.round(s.party / s.partyN) : '—'),
              e('td', { className: 'num' }, money(s.rev)))))) : e('div', { className: 'empty' },
            e('div', { className: 'em-icon' }, '🎪'),
            e('div', { className: 'em-title' }, 'No outdoor event space bookings in this range'),
            e('div', { className: 'em-sub' }, 'Pavilions, shelters, picnic areas and bounce houses are all counted here — try a wider date range, or a summer month.')),
        e('div', { className: 'section-note' }, 'Outdoor event spaces · ' + bookings.toLocaleString() + ' bookings · '
          + Math.round(hoursTotal).toLocaleString() + ' hours · ' + siteDays.toLocaleString() + ' booked site-days · '
          + 'per-day reservation feed (canceled bookings not included). Fields are deliberately excluded.'),
      );
    }

    // ── Fields ────────────────────────────────────────────────────────────
    // Ball diamonds, soccer pitches and multipurpose turf — 1,903 sites across
    // 74 orgs and ~62k bookings a year, and the only facility type the hub had
    // nothing for. Deliberately NOT folded into Outdoor Event Spaces: that tab
    // is parties, this one is leagues.
    //
    // Built on card 17294 like the Outdoor tab, and it has to be: the Court
    // Utilization card (17297) filters `c.type = 'court'`, so fields are absent
    // from that feed entirely and its utilization pipeline cannot be reused the
    // way Racket Sports reuses it. The hour helpers are shared (oeRowHours,
    // oeHeatGrid) because the question — how many hours, covering which part of
    // the day — is the same one.
    //
    // What makes this tab field-specific rather than a copy:
    //   · INSTANT vs MANAGED. Only ~4.5% of field bookings platform-wide are
    //     instant; leagues come through staff. A low instant share is the
    //     baseline here, not a failure, and the panel says so.
    //   · LIGHTS. Field lighting is billed as an ADD-ON line, not through the
    //     Musco integration — `reservation_lighting_schedule` has 5 field rows
    //     platform-wide, while "Field Light Fee" and its siblings are the four
    //     most-attached add-ons on fields. So lights are read from add-on names,
    //     and the Lighting columns are deliberately ignored.
    //   · SPORT is inferred from names, because `court.sub_type` is NULL on all
    //     1,903 fields. That is a guess, so the unclassified share is shown and
    //     the panel steps aside when it is too large to read.
    const FIELD_SPORTS = [
      // \b before "ball": without it, /ball ?field/ matches inside "FootBALL FIELD"
      // and every football field is filed as baseball. Caught by
      // scripts/fields-classify.spec.js the first time it ran.
      { key: 'baseball', label: 'Baseball / Softball',        re: /baseball|softball|diamond|\bball ?field|little league/i },
      { key: 'soccer',   label: 'Soccer',                     re: /soccer|futsal|pitch/i },
      { key: 'football', label: 'Football',                   re: /football|gridiron/i },
      { key: 'lacrosse', label: 'Lacrosse / Rugby / Cricket', re: /lacrosse|rugby|cricket/i },
      // Last on purpose: "Athletic Field 3" is only multipurpose if nothing more
      // specific matched first.
      { key: 'multi',    label: 'Multipurpose / Turf',        re: /multi|open space|turf|practice|athletic/i },
    ];
    // Field and PARK name together — a park called "Smith Soccer Complex" names
    // the sport its fields do not. Measured platform-wide, adding the location
    // moves ~4,800 bookings out of unclassified.
    function fieldSport(facility, location) {
      const t = String(facility == null ? '' : facility) + ' | ' + String(location == null ? '' : location);
      for (let i = 0; i < FIELD_SPORTS.length; i++) if (FIELD_SPORTS[i].re.test(t)) return FIELD_SPORTS[i].key;
      return null;
    }
    const FIELD_SPORT_LABEL = {};
    FIELD_SPORTS.forEach(sp => { FIELD_SPORT_LABEL[sp.key] = sp.label; });
    // Add-on families. Lights first — they are the biggest add-on on fields by a
    // distance, and they are the lever an evening-heavy calendar turns on.
    const FIELD_ADDON_GROUPS = [
      { key: 'lights', label: 'Lights',           re: /light/i,
        note: 'billed as a line item, not through the lighting integration' },
      { key: 'prep',   label: 'Staffing & prep',  re: /attendant|prep|lining|clean|restroom|supply|park service|trash|maintenance|staff|janitor|security|umpire|scorekeep/i,
        note: 'cost recovery for the crew a rental actually costs' },
      { key: 'other',  label: 'Other add-ons',    re: null, note: null },
    ];
    function fieldAddonGroup(name) {
      const n = String(name == null ? '' : name);
      for (let i = 0; i < FIELD_ADDON_GROUPS.length; i++) {
        const g = FIELD_ADDON_GROUPS[i];
        if (g.re && g.re.test(n)) return g.key;
      }
      return 'other';
    }

    function FieldsBanner({ bookings, hours, fill, revenue, fieldsBooked, managedPct }) {
      const pills = [
        ['bookings', bookings.toLocaleString()],
        ['hours booked', Math.round(hours).toLocaleString()],
        ['days used', fill == null ? '—' : Math.round(fill) + '%'],
        ['charged', money(revenue)],
        ['fields booked', fieldsBooked.toLocaleString()],
        ['staff-booked', managedPct == null ? '—' : Math.round(managedPct) + '%'],
      ];
      return e('div', { className: 'fac-banner fbx-ballfield' },
        e('div', { className: 'fcb-scene', dangerouslySetInnerHTML: { __html: FBX_SCENES.ballfield } }),
        e(BannerGame, { game: 'bases', key: 'game-bases' }),
        e('div', { className: 'fcb-overlay' },
          e('div', { className: 'fcb-kicker' }, CFG.displayName || 'Parks & Recreation'),
          e('div', { className: 'fcb-title' }, '⚾ Fields'),
          e('div', { className: 'fcb-sub' }, 'Diamonds, pitches & multipurpose turf — who books them, when, for how long, and with what.'),
          e('div', { className: 'fcb-pills' }, pills.map((p, i) => e('span', { className: 'fcb-pill', key: i }, e('b', null, p[1]), ' ' + p[0]))),
        ),
      );
    }

    function FieldsView({ start, end }) {
      const [data, setData] = React.useState({ rows: null, err: null });
      const [locSel, setLocSel] = React.useState([]);
      const [allSites, setAllSites] = React.useState(false);
      const [insights, setInsights] = React.useState(null);
      const [insLoading, setInsLoading] = React.useState(false);
      const [insError, setInsError] = React.useState(null);
      const pinged = React.useRef(false);

      React.useEffect(() => {
        let dead = false;
        setData({ rows: null, err: null });
        const tok = CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '';
        fetch('/' + CFG.slug + '/facility/api/data?start_date=' + start + '&end_date=' + end + tok)
          .then(r => { if (!r.ok) throw new Error('Server returned ' + r.status); return r.json(); })
          .then(j => { if (!dead) setData({ rows: (j.rows || []).filter(r => r['Site Type'] === 'field'), err: null }); })
          .catch(err => { if (!dead) setData({ rows: null, err: err.message || String(err) }); });
        return () => { dead = true; };
      }, [start, end]);

      React.useEffect(() => {
        if (pinged.current || data.rows === null) return;
        pinged.current = true;
        const n = data.rows.filter(r => oeIsArrival(r)).length;
        const tok = CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '';
        try {
          fetch('/' + CFG.slug + '/facilities/api/log?event=fields&n=' + n + tok, { method: 'POST', keepalive: true }).catch(() => {});
        } catch (er) { /* never let logging break the tab */ }
      }, [data.rows]);

      if (data.err) return e('div', { className: 'empty' },
        e('div', { className: 'em-icon' }, '⚠️'),
        e('div', { className: 'em-title' }, 'Could not load field data'),
        e('div', { className: 'em-sub' }, String(data.err)));
      if (data.rows === null) return e('div', { className: 'empty' },
        e('div', { className: 'em-title', style: { color: '#9ca3af' } }, 'Loading Fields…'),
        e('div', { className: 'fac-spin' }));

      const allRows = data.rows;
      const allLocations = Array.from(new Set(allRows.map(r => r['Location'] || '—'))).sort();
      const rows = locSel.length ? allRows.filter(r => locSel.indexOf(r['Location'] || '—') >= 0) : allRows;

      const shortSite = f => { f = f || '—'; return f.indexOf(' - ') !== -1 ? f.split(' - ').slice(1).join(' - ') : f; };
      const isInstant = r => String(r['Booking Type'] || '').toLowerCase().indexOf('instant') >= 0;

      const arrivals   = rows.filter(oeIsArrival);
      const bookings   = arrivals.length;
      const hourList   = arrivals.map(oeRowHours).filter(h => h != null);
      const hoursTotal = hourList.reduce((s, h) => s + h, 0);
      const avgBlock   = hourList.length ? hoursTotal / hourList.length : null;
      const multiDay   = arrivals.filter(oeIsMulti).length;
      const revenue    = arrivals.reduce((s, r) => s + (Number(r['Total']) || 0), 0);
      const addOnFees  = arrivals.reduce((s, r) => s + (Number(r['Add-On Fees']) || 0), 0);
      const siteDays   = rows.length;
      const parties    = arrivals.map(r => Number(r['Head Cnt']) || 0).filter(n => n > 0);
      const avgParty   = parties.length ? parties.reduce((a, b) => a + b, 0) / parties.length : null;
      const instantN   = arrivals.filter(isInstant).length;
      const managedN   = bookings - instantN;
      const managedPct = bookings ? (managedN / bookings) * 100 : null;

      const days = [];
      { const endD = new Date(end + 'T00:00:00');
        for (let d = new Date(start + 'T00:00:00'); d <= endD && days.length < 1100; d.setDate(d.getDate() + 1)) days.push(fmtDate(d)); }
      const weekly = days.length > 95;

      // ── Per-field stats ───────────────────────────────────────────────────
      const statByKey = {};
      rows.forEach(r => {
        const site = shortSite(r['Facility']);
        const locName = r['Location'] || '';
        const key = locName + '||' + site;
        const d = String(r['Date'] || '').slice(0, 10);
        let st = statByKey[key];
        if (!st) st = statByKey[key] = { site, location: locName, sport: fieldSport(r['Facility'], locName),
          bookings: 0, days: 0, hours: 0, rev: 0, party: 0, partyN: 0, wknd: 0, mdDays: 0, instant: 0, evening: 0, occ: {} };
        const cell = st.occ[d] || (st.occ[d] = { n: 0, hours: 0, multi: false, tips: [] });
        cell.n++;
        const h = oeRowHours(r);
        if (h != null) { cell.hours += h; st.hours += h; }
        if (oeIsMulti(r)) { cell.multi = true; st.mdDays++; }
        if (cell.tips.length < 4) cell.tips.push((r['Reservee'] || 'Booked')
          + (h != null ? ' · ' + oeFmtHrs(h) : (oeIsMulti(r) ? ' · day ' + oeDayNum(r) + ' of ' + oeTotDays(r) : ''))
          + (r['Purpose'] ? ' · ' + r['Purpose'] : ''));
        if (oeIsArrival(r)) {
          st.bookings++;
          st.rev += Number(r['Total']) || 0;
          const p = Number(r['Head Cnt']) || 0;
          if (p > 0) { st.party += p; st.partyN++; }
          const dw = dowOfStr(r['Date']);
          if (dw === 0 || dw === 6) st.wknd++;
          if (isInstant(r)) st.instant++;
          const bm = oeClockMin(r['Begin']);
          if (bm != null && bm >= 17 * 60) st.evening++;
        }
      });
      const statList = Object.keys(statByKey).map(k => {
        const st = statByKey[k];
        st.days = Object.keys(st.occ).length;
        return st;
      });
      const fieldsBooked = statList.length;
      const dayFill = fieldsBooked && days.length ? (siteDays / (fieldsBooked * days.length)) * 100 : null;

      const kpis = [
        { label: 'Bookings', val: bookings.toLocaleString(), cls: 'sc-blue', sub: 'reservations starting in range' },
        { label: 'Hours Booked', val: Math.round(hoursTotal).toLocaleString(), cls: 'sc-green', sub: hourList.length.toLocaleString() + ' timed bookings' + (multiDay ? ' · ' + multiDay + ' multi-day excl.' : '') },
        { label: 'Avg Block', val: avgBlock == null ? '—' : oeFmtHrs(avgBlock), cls: 'sc-amber', sub: 'hours per booking' },
        { label: 'Days Used', val: dayFill == null ? '—' : dayFill.toFixed(dayFill < 10 ? 1 : 0) + '%', cls: 'sc-purple', sub: siteDays.toLocaleString() + ' of ' + (fieldsBooked * days.length).toLocaleString() + ' field-days' },
        { label: 'Charged', val: money(revenue), cls: 'sc-green', sub: 'base rental' + (addOnFees ? ' · ' + money(addOnFees) + ' add-ons' : '') },
        { label: 'Fields Booked', val: fieldsBooked.toLocaleString(), cls: 'sc-muted', sub: 'distinct fields with a booking' },
        { label: 'Staff-Booked', val: managedPct == null ? '—' : Math.round(managedPct) + '%', cls: 'sc-muted', sub: instantN ? instantN.toLocaleString() + ' booked instantly online' : 'none booked instantly' },
      ];

      const hg = oeHeatGrid(arrivals);
      const heat = hg.heat, heatHours = hg.hours, heatMax = hg.max;
      const hourTotals = hg.hourTotals, heatBookings = hg.timed, busiestHour = hg.peak;
      // Evening share: leagues live after 5pm, and it is the number the lights
      // add-on hangs off.
      const eveningN = arrivals.filter(r => { const m = oeClockMin(r['Begin']); return m != null && m >= 17 * 60; }).length;
      const timedWithStart = arrivals.filter(r => oeClockMin(r['Begin']) != null).length;
      const eveningPct = timedWithStart ? (eveningN / timedWithStart) * 100 : null;

      // ── Sport mix (name-derived) ──────────────────────────────────────────
      const sportAgg = {};
      arrivals.forEach(r => {
        const k = fieldSport(r['Facility'], r['Location']) || '(unknown)';
        const b = sportAgg[k] || (sportAgg[k] = { k, n: 0, hours: 0, rev: 0, sites: {} });
        b.n++; b.rev += Number(r['Total']) || 0;
        const h = oeRowHours(r); if (h != null) b.hours += h;
        b.sites[(r['Location'] || '') + '||' + shortSite(r['Facility'])] = 1;
      });
      const sportList = FIELD_SPORTS.filter(sp => sportAgg[sp.key]).map(sp => sportAgg[sp.key]);
      const unknownSport = sportAgg['(unknown)'] ? sportAgg['(unknown)'].n : 0;
      const unknownSportPct = bookings ? (unknownSport / bookings) * 100 : 0;

      // ── Add-ons, grouped ──────────────────────────────────────────────────
      const addOns = (() => {
        const byName = {};
        let withAny = 0;
        arrivals.forEach(r => {
          const raw = String(r['Add Ons'] || '').trim();
          if (!raw) return;
          withAny++;
          raw.split(/,(?![^(]*\))/).forEach(part => {
            const t = part.trim(); if (!t) return;
            const m = /^(.*?)\s*\(\$?([\d,.]+)\)\s*$/.exec(t);
            const name = (m ? m[1] : t).trim(); if (!name) return;
            const listed = m ? Number(String(m[2]).replace(/,/g, '')) : null;
            const b = byName[name] || (byName[name] = { name, n: 0, listed: null, group: fieldAddonGroup(name) });
            b.n++;
            if (listed != null && !isNaN(listed)) b.listed = listed;
          });
        });
        const list = Object.keys(byName).map(k => byName[k]).sort((a, b) => b.n - a.n);
        const groups = FIELD_ADDON_GROUPS.map(g => {
          const items = list.filter(x => x.group === g.key);
          return { g, items, n: items.reduce((s, x) => s + x.n, 0) };
        }).filter(x => x.items.length);
        return { list, withAny, groups };
      })();
      const lightsGroup = addOns.groups.filter(x => x.g.key === 'lights')[0] || null;

      // ── Locations ─────────────────────────────────────────────────────────
      const locAgg = {};
      arrivals.forEach(r => {
        const l = r['Location'] || '—';
        const b = locAgg[l] || (locAgg[l] = { l, n: 0, hours: 0, rev: 0, sites: {} });
        b.n++; b.rev += Number(r['Total']) || 0;
        const h = oeRowHours(r); if (h != null) b.hours += h;
        b.sites[shortSite(r['Facility'])] = 1;
      });
      const locList = Object.keys(locAgg).map(k => locAgg[k]).sort((a, b) => b.n - a.n);

      // ── Ranking ───────────────────────────────────────────────────────────
      const rankByHours = hoursTotal > 0;
      const rankVal = st => rankByHours ? st.hours : st.bookings;
      const ranked = statList.slice().sort((a, b) => rankVal(b) - rankVal(a) || b.days - a.days || b.rev - a.rev);
      const topSites = ranked.slice(0, 10);
      const quietSites = ranked.slice(Math.max(topSites.length, ranked.length - 6)).reverse();

      // ── Block length mix ──────────────────────────────────────────────────
      const BLOCKS = [
        { lbl: 'Up to 2 hrs', lo: 0, hi: 2 },
        { lbl: '2–4 hrs',     lo: 2, hi: 4 },
        { lbl: '4–8 hrs',     lo: 4, hi: 8 },
        { lbl: '8 hrs+',      lo: 8, hi: Infinity },
      ];
      const blockData = BLOCKS.map(b => {
        const n = hourList.filter(h => h > b.lo && h <= b.hi).length;
        return { label: b.lbl, v: n, valText: n.toLocaleString() };
      }).concat(multiDay ? [{ label: 'Multi-day', v: multiDay, valText: multiDay.toLocaleString() }] : []);

      // ── Day-of-week demand ────────────────────────────────────────────────
      const dowDemand = (() => {
        const dayCount = [0, 0, 0, 0, 0, 0, 0], byDow = [0, 0, 0, 0, 0, 0, 0];
        days.forEach(d => { dayCount[new Date(d + 'T00:00:00').getDay()]++; });
        arrivals.forEach(r => { const dw = dowOfStr(r['Date']); if (dw != null) byDow[dw]++; });
        const list = OE_DOW.map((name, i) => ({
          i, name, n: byDow[i], occurrences: dayCount[i],
          perDay: dayCount[i] ? byDow[i] / dayCount[i] : null,
        })).filter(x => x.occurrences > 0);
        const rated = list.filter(x => x.perDay != null);
        if (rated.length < 2) return null;
        const sorted = rated.slice().sort((a, b) => b.perDay - a.perDay);
        return { list, busiest: sorted[0], quietest: sorted[sorted.length - 1] };
      })();

      // ── Monthly ───────────────────────────────────────────────────────────
      const byMonth = {};
      arrivals.forEach(r => {
        const ym = String(r['Date'] || '').slice(0, 7);
        if (!/^\d{4}-\d{2}$/.test(ym)) return;
        if (!byMonth[ym]) byMonth[ym] = { n: 0, revenue: 0, hours: 0 };
        byMonth[ym].n++;
        byMonth[ym].revenue += Number(r['Total']) || 0;
        const h = oeRowHours(r); if (h != null) byMonth[ym].hours += h;
      });
      const months = Object.keys(byMonth).sort();
      const maxMonthRev = Math.max(1, ...months.map(m => byMonth[m].revenue));

      // ── Calendar ──────────────────────────────────────────────────────────
      const calCols = weekly ? (() => { const w = []; for (let i = 0; i < days.length; i += 7) w.push(days.slice(i, i + 7)); return w; })()
                             : days.map(d => [d]);
      const calGroups = (() => {
        const byLoc = {};
        ranked.forEach(st => { (byLoc[st.location] = byLoc[st.location] || []).push(st); });
        return Object.keys(byLoc).sort().map(name => ({ name, sites: byLoc[name] }));
      })();
      const CAL_CAP = 40;
      const calShown = (() => {
        if (allSites) return calGroups;
        let left = CAL_CAP; const out = [];
        calGroups.forEach(g => {
          if (left <= 0) return;
          const take = g.sites.slice(0, left);
          left -= take.length;
          out.push({ name: g.name, sites: take });
        });
        return out;
      })();
      const calHidden = statList.length - calShown.reduce((n, g) => n + g.sites.length, 0);
      const cellFor = (st, dList, key) => {
        if (weekly) {
          let n = 0, hrs = 0;
          dList.forEach(d => { const c = st.occ[d]; if (c) { n++; hrs += c.hours; } });
          const sh = n ? OE_RAMP[Math.min(5, 1 + Math.floor((n - 1) / dList.length * 4.999))] : OE_RAMP[0];
          return e('div', { key, className: 'cc-cell', style: { background: sh },
            title: st.site + ' · wk of ' + dList[0] + ' · ' + n + ' of ' + dList.length + ' days booked' + (hrs ? ' · ' + oeFmtHrs(hrs) : '') });
        }
        const c = st.occ[dList[0]];
        return e('div', { key, className: 'cc-cell', style: { background: oeShade(c) },
          title: st.site + ' · ' + dList[0] + (c ? ' · ' + c.tips.join(' | ') + (c.n > c.tips.length ? ' (+' + (c.n - c.tips.length) + ' more)' : '') : ' · open') });
      };
      const hdFor = (dList, i) => {
        const d = new Date(dList[0] + 'T00:00:00');
        const we = !weekly && (d.getDay() === 0 || d.getDay() === 6);
        const lbl = weekly ? ((d.getMonth() + 1) + '/' + d.getDate())
          : (d.getDate() === 1 || i === 0 ? monthLabel(dList[0].slice(0, 7)).split(' ')[0] + ' ' + d.getDate() : String(d.getDate()));
        return e('div', { key: 'h' + i, className: 'cc-hd' + (we ? ' we' : ''), title: weekly ? dList[0] : OE_DOW[d.getDay()] + ' ' + dList[0] },
          weekly ? null : e('span', { className: 'cc-dow' }, OE_DOW1[d.getDay()]), lbl);
      };

      // ── Rec Insights ──────────────────────────────────────────────────────
      const buildBlob = () => ({
        scope: 'ball fields (diamonds, soccer pitches, multipurpose turf) — hourly/daily league and tournament rentals',
        dateRange: { start, end, daysInRange: days.length },
        totals: { bookings, hoursBooked: Math.round(hoursTotal), timedBookings: hourList.length, multiDayBookings: multiDay,
                  avgBlockHours: avgBlock == null ? null : +avgBlock.toFixed(1), fieldsBooked, bookedFieldDays: siteDays,
                  dayFillPct: dayFill == null ? null : Math.round(dayFill), netRevenueUsd: Math.round(revenue),
                  addOnFeesUsd: Math.round(addOnFees), avgPartySize: avgParty == null ? null : Math.round(avgParty) },
        bookingChannel: { instant: instantN, staffBooked: managedN, staffBookedPct: managedPct == null ? null : Math.round(managedPct) },
        eveningShare: { after5pmBookings: eveningN, ofTimedBookings: timedWithStart, pct: eveningPct == null ? null : Math.round(eveningPct) },
        bookingsCoveringEachHour: Object.fromEntries(heatHours.map(h => [oeHour12(h), hourTotals[h]])),
        bookingsByDayOfWeek: dowDemand ? Object.fromEntries(dowDemand.list.map(x => [x.name, { bookings: x.n, perOccurrence: x.perDay == null ? null : +x.perDay.toFixed(2) }])) : null,
        blockLengthMix: blockData.map(b => ({ bucket: b.label, bookings: b.v })),
        sportMix: sportList.map(sp => ({ sport: FIELD_SPORT_LABEL[sp.k] || sp.k, bookings: sp.n, hours: Math.round(sp.hours), fields: Object.keys(sp.sites).length }))
          .concat(unknownSport ? [{ sport: 'not named for a sport', bookings: unknownSport, hours: null, fields: null }] : []),
        addOnsByFamily: addOns.groups.map(x => ({ family: x.g.label, attached: x.n, examples: x.items.slice(0, 4).map(i => i.name) })),
        topAddOns: addOns.list.slice(0, 8).map(a => ({ addOn: a.name, attachedToBookings: a.n, listedPriceUsd: a.listed })),
        byLocation: locList.slice(0, 12).map(l => ({ location: l.l, bookings: l.n, hours: Math.round(l.hours), fields: Object.keys(l.sites).length, revenueUsd: Math.round(l.rev) })),
        topFields: topSites.map(s => ({ field: s.site, location: s.location, sport: FIELD_SPORT_LABEL[s.sport] || null,
          bookings: s.bookings, hours: Math.round(s.hours), daysUsed: s.days, eveningBookings: s.evening, revenueUsd: Math.round(s.rev) })),
        quietestFields: quietSites.map(s => ({ field: s.site, location: s.location, bookings: s.bookings, hours: Math.round(s.hours) })),
        monthly: months.map(m => ({ month: m, bookings: byMonth[m].n, hours: Math.round(byMonth[m].hours), revenueUsd: Math.round(byMonth[m].revenue) })),
      });
      const getInsights = async () => {
        setInsLoading(true); setInsError(null);
        try {
          const tok = CFG.token ? '?token=' + encodeURIComponent(CFG.token) : '';
          const resp = await fetch('/' + CFG.slug + '/fields/api/insights' + tok, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildBlob()) });
          const j = await resp.json();
          if (!resp.ok || !j.ok) throw new Error(j.error || 'Server returned ' + resp.status);
          setInsights(j.insights || []);
        } catch (er) { setInsError(er.message || 'Could not generate insights'); }
        setInsLoading(false);
      };

      const hasBookings = bookings > 0;
      const perHour = hoursTotal > 0 ? revenue / hoursTotal : null;
      const perBooking = bookings ? revenue / bookings : null;

      return e('div', null,
        e(FieldsBanner, { bookings, hours: hoursTotal, fill: dayFill, revenue, fieldsBooked, managedPct }),
        allLocations.length > 1 ? e('div', { className: 'filters', style: { marginTop: 12 } },
          e('div', { className: 'filter-group' },
            e('span', { className: 'filter-lbl' }, 'Location'),
            e(LocationFilter, { locations: allLocations, sel: locSel, setSel: setLocSel }))) : null,
        e('div', { className: 'sum-cards' },
          kpis.map((c, i) => e('div', { className: 'sum-card', key: i },

    // ── Court Utilization — native view (ported from court-utilization.html) ──
    // All metrics/info from the standalone Court Utilization report, rendered

    // (/api/data, /api/schedules, /api/insights) — no new SQL. The computation
    // is copied verbatim from the standalone report to guarantee parity.
    const withCuToken = url => CFG.token ? url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(CFG.token) : url;

    // Normalize court rows (snake_case or Title Case) — verbatim from the report.
    function cuNormalize(rows) {
      return (rows || []).map(r => ({
        courtName:        r.court_name        || r['Court Name']        || '',
        locationName:     r.location_name     || r['Location Name']     || '',
        facilityRentalId: r.facility_rental_id|| r['Facility Rental Id']|| '',
        usageCategory:    r.usage_category    || r['Usage Category']    || 'Customer Booking',
        bookingSource:    r.booking_source    || r['Booking Source']    || '',
        localDate:        r.local_date        || '',
        // Wall-clock start/end. The card has always sent these; they are what
        // makes hour-of-day analysis possible without a second query.
        localStart:       r.local_start       || '',
        localEnd:         r.local_end         || '',
        durationHours:    Number(r.duration_hours || 0),
      })).filter(r => r.courtName);
    }
    const CU_UTIL_COLOR = pct => pct >= 70 ? '#dc2626' : pct >= 50 ? '#ea580c' : pct >= 30 ? '#f59e0b' : pct >= 15 ? '#16a34a' : '#94a3b8';
    const CU_MAP_COLOR  = pct => pct >= 70 ? '#dc2626' : pct >= 40 ? '#f59e0b' : pct >= 15 ? '#22c55e' : '#94a3b8';
    const CU_DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const cuHour12 = h => { const x = ((h % 24) + 24) % 24; return ((x % 12) || 12) + (x < 12 ? 'am' : 'pm'); };
    // One ramp for every utilisation cell on this tab — the day-of-week grid and
    // the hourly grid that expands underneath a court must read as one scale.
    // avail === 0 means the court is closed then: grey, never a 0% reading.
    const cuHeatCell = (pct, avail) =>
      avail === 0            ? { bg: '#f3f3f0', fg: '#ccc' } :
      pct >= 80              ? { bg: '#dc2626', fg: '#fff' } :
      pct >= 60              ? { bg: '#ea580c', fg: '#fff' } :
      pct >= 40              ? { bg: '#f59e0b', fg: '#1a1a1a' } :
      pct >= 20              ? { bg: '#fde68a', fg: '#1a1a1a' } :

                               { bg: '#f8f8f6', fg: '#ccc' };

    // Location multiselect (hub dropdown styling)
    function CourtLocationFilter({ all, selected, onChange }) {
      const [open, setOpen] = React.useState(false);
      const allSel = selected.length === all.length;
      const label = allSel ? 'All locations' : selected.length + ' of ' + all.length;
      const toggle = loc => {
        const set = new Set(selected);
        if (set.has(loc)) set.delete(loc); else set.add(loc);
        onChange(all.filter(l => set.has(l)));
      };
      return e('div', { className: 'dd' },
        e('button', { className: 'dd-btn', onClick: () => setOpen(o => !o) }, '📍 ' + label, e('span', null, '▾')),
        open ? e('div', { className: 'dd-panel' },
