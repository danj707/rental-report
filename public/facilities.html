        e('div', { className: 'em-title', style: { color: '#9ca3af' } }, 'Loading Camping data…'),
        e('div', { className: 'fac-spin' }));

      const rows = data.rows;
      const dayNum  = r => Number(r['Multi-Day Day#']) || 0;
      const totDays = r => Number(r['Multi-Day Days']) || 0;
      const isArrival = r => dayNum(r) <= 1;
      const shortSite = f => { f = f || '—'; return f.indexOf(' - ') !== -1 ? f.split(' - ').slice(1).join(' - ') : f; };

      const arrivals = rows.filter(isArrival);
      const stays    = arrivals.length;
      const nights   = arrivals.reduce((s, r) => s + Math.max((totDays(r) || 1) - 1, 1), 0);
      const revenue  = arrivals.reduce((s, r) => s + (Number(r['Total']) || 0), 0);
      const avgStay  = stays ? nights / stays : 0;

      // Weekend vs weekday split of occupied nights: each day-row is a night
      // except a multi-day checkout day; Fri/Sat dates are weekend nights.
      const dowOf = r => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(r['Date'] || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getDay() : null; };
      const isNightRow  = r => { const t = totDays(r); return t <= 1 || dayNum(r) < t; };
      const isWkndNight = r => { const dw = dowOf(r); return dw === 5 || dw === 6; };
      const nightRows  = rows.filter(isNightRow);
      const wkndNights = nightRows.filter(isWkndNight).length;
      const wkndPct    = nightRows.length ? (wkndNights / nightRows.length) * 100 : null;

      // Day list for the range (daily cells up to ~3 months, weekly buckets beyond)
      const days = [];
      { const endD = new Date(end + 'T00:00:00');
        for (let d = new Date(start + 'T00:00:00'); d <= endD && days.length < 1100; d.setDate(d.getDate() + 1)) days.push(fmtDate(d)); }
      const weekly = days.length > 95;

      // Per-site stats + per-day occupancy, one entry per (reservation Location,
      // short site name) so same-named sites at different campsite locations
      // stay separate. Each entry carries its own occ day-map.
      const statByKey = {}, statIdx = {};
      rows.forEach(r => {
        const site = shortSite(r['Facility']);
        const locName = r['Location'] || '';
        const key = locName + '||' + site;
        const d = String(r['Date'] || '').slice(0, 10);
        const n = dayNum(r), t = totDays(r);
        const cls = (t <= 1 || !n) ? 'one' : n === 1 ? 'arr' : n === t ? 'dep' : 'occ';
        let st = statByKey[key];
        if (!st) { st = statByKey[key] = { site, location: locName, stays: 0, days: 0, rev: 0, nights: 0, wknd: 0, occ: {} }; (statIdx[site] = statIdx[site] || []).push(st); }
        st.occ[d] = {
          cls,
          tip: (r['Reservee'] || 'Booked') + (t > 1 ? ' · day ' + n + ' of ' + t : '') + (r['Purpose'] ? ' · ' + r['Purpose'] : ''),
        };
        st.days++;
        if (isNightRow(r)) { st.nights++; if (isWkndNight(r)) st.wknd++; }
        if (isArrival(r)) { st.stays++; st.rev += Number(r['Total']) || 0; }
      });
      const statList = Object.keys(statByKey).map(k => statByKey[k]);
      // Fuzzy matcher — reservation site names don't always equal seed names.
      // Douglas: 'Topaz Lake Recreation Area - Site 01' shortens to 'Site 01',
      // the seed name (exact match). Pleasant Hill: the feed says
      // "10 Brown's Arm" for seed 'Site 10' in area "Brown's Arm". Order:
      // exact name (location tiebreak) → same site number + area/name text
      // overlap → unambiguous number-only.
      const normTxt = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
      const numOf = s => { const m = /\d+/.exec(String(s || '')); return m ? parseInt(m[0], 10) : null; };
      const matchStat = (site, locName) => {   // site: { name, area } from geo
        const exact = statIdx[site.name];
        if (exact) return exact.find(x => x.location === locName) || (exact.length === 1 ? exact[0] : null);
        const num = numOf(site.name);
        if (num == null) return null;
        const areaN = normTxt(site.area), nameN = normTxt(site.name);
        const cands = statList.filter(st => numOf(st.site) === num);
        const byText = cands.filter(st => {
          const restN = normTxt(String(st.site).replace(/\d+/g, ' '));
          return restN && ((areaN && (areaN.indexOf(restN) !== -1 || restN.indexOf(areaN) !== -1)) || nameN.indexOf(restN) !== -1);
        });
        if (byText.length) return byText.find(x => x.location === locName) || byText[0];
        return cands.length === 1 ? cands[0] : null;
      };

      // ── Per-site momentum: heating up, cooling off, or steady ──────────────
      // Realized occupancy in the recent half of the ELAPSED window vs the
      // earlier half.
      //
      // Only PAST days count, and that is the whole trick. A campground
      // calendar usually runs into the future, and future days are
      // systematically emptier simply because those bookings have not been made
      // yet — booking lead time, not falling demand. Splitting the whole window
      // would therefore stamp "cooling" on every site in the park and look
      // authoritative doing it. So the split happens inside the settled part of
      // the range, and when too little of the range has elapsed there is no
      // arrow at all rather than a confident wrong one.
      const locs = geo.locations || [];
      const geoSitesAll = locs.reduce((a, l) => a.concat(l.sites), []);
      // Calendar groups: one per mapped campsite location (each site row keeps a
      // ref to its matched stats), plus booked sites not on any map ("Other sites").
      const claimed = new Set();
      const byNum = (a, b) => a.n.localeCompare(b.n, undefined, { numeric: true });
      const calGroups = locs.map(l => ({
        name: l.name,
        sites: l.sites.map(s => { const st = matchStat(s, l.name); if (st) claimed.add(st); return { n: s.name, loc: l.name, st }; }).sort(byNum),
      }));
      const leftovers = statList.filter(st => !claimed.has(st));
      if (leftovers.length) calGroups.push({ name: locs.length ? 'Other sites' : '', sites: leftovers.map(st => ({ n: st.site, loc: st.location, st })).sort(byNum) });
      const sitesTotal  = geoSitesAll.length ? geoSitesAll.length + leftovers.length : statList.length;
      const sitesBooked = statList.length;
      const siteDays = rows.length;
      const occPct = sitesTotal && days.length ? (siteDays / (sitesTotal * days.length)) * 100 : null;

      // Weekly buckets (7-day chunks from range start) when the range is long
      const RAMP6 = ['#f4f3ef', '#dcedd6', '#a4d3a0', '#5fae70', '#2c8a50', '#155f36'];
      const weeks = [];
      if (weekly) for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

      // Arrivals by day of week + stay length distribution
      const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const dowCounts = [0, 0, 0, 0, 0, 0, 0];
      arrivals.forEach(r => {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(r['Date'] || ''));
        if (m) dowCounts[new Date(+m[1], +m[2] - 1, +m[3]).getDay()]++;
      });
      const LEN = [
        { lbl: '1 night', lo: 1, hi: 1 }, { lbl: '2 nights', lo: 2, hi: 2 }, { lbl: '3 nights', lo: 3, hi: 3 },
        { lbl: '4–6 nights', lo: 4, hi: 6 }, { lbl: '7+ nights', lo: 7, hi: Infinity },
      ];
      const lenData = LEN.map(b => {
        const n = arrivals.filter(r => { const nn = Math.max((totDays(r) || 1) - 1, 1); return nn >= b.lo && nn <= b.hi; }).length;
        return { label: b.lbl, v: n, valText: n.toLocaleString() };
      });

      // Monthly trend (stays + revenue by arrival month)
      const byMonth = {};
      arrivals.forEach(r => {
        const ym = String(r['Date'] || '').slice(0, 7);
        if (!/^\d{4}-\d{2}$/.test(ym)) return;
        if (!byMonth[ym]) byMonth[ym] = { stays: 0, revenue: 0 };
        byMonth[ym].stays++; byMonth[ym].revenue += Number(r['Total']) || 0;
      });
      const months = Object.keys(byMonth).sort();
      const maxMonthRev = Math.max(1, ...months.map(m => byMonth[m].revenue));

      const topSites = statList.slice().sort((a, b) => b.rev - a.rev || b.days - a.days).slice(0, 12);

      const kpis = [
        { label: 'Stays', val: stays.toLocaleString(), cls: 'sc-blue', sub: 'campsite check-ins in range' },
        { label: 'Nights Booked', val: nights.toLocaleString(), cls: 'sc-green', sub: 'checkout day not counted' },
        { label: 'Occupancy', val: occPct == null ? '—' : occPct.toFixed(occPct < 10 ? 1 : 0) + '%', cls: 'sc-purple', sub: siteDays.toLocaleString() + ' of ' + (sitesTotal * days.length).toLocaleString() + ' site-days' },
        { label: 'Avg Stay', val: avgStay ? avgStay.toFixed(1) : '—', cls: 'sc-amber', sub: 'nights per stay' },
        { label: 'Charged', val: money(revenue), cls: 'sc-green', sub: 'base rental, excl. add-ons' },
        { label: 'Sites Booked', val: sitesBooked.toLocaleString() + (sitesTotal ? ' / ' + sitesTotal : ''), cls: 'sc-muted', sub: 'of mapped campsites' },
        { label: 'Weekend Nights', val: wkndPct == null ? '—' : Math.round(wkndPct) + '%', cls: 'sc-muted', sub: wkndPct == null ? 'no nights in range' : wkndNights.toLocaleString() + ' Fri/Sat vs ' + (nightRows.length - wkndNights).toLocaleString() + ' weekday' },
      ];

      const calCell = (site, dList, key) => {
        const od = (site.st && site.st.occ) || {};
        if (weekly) {
          const n = dList.reduce((s, d) => s + (od[d] ? 1 : 0), 0);
          const idx = !n ? 0 : Math.min(5, 1 + Math.floor((n - 1) / dList.length * 5));
          return e('div', { key, className: 'cc-cell', style: { background: RAMP6[idx] },
            title: site.n + ' · wk of ' + dList[0] + ' · ' + n + ' of ' + dList.length + ' days booked' });
        }
        const c = od[dList[0]];
        return e('div', { key, className: 'cc-cell' + (c ? ' ' + c.cls : ''), title: site.n + ' · ' + dList[0] + (c ? ' · ' + c.tip : ' · open') });
      };
      const calCols = weekly ? weeks : days.map(d => [d]);
      // Single-letter day of week above the date. Without it you cannot tell a
      // busy Saturday from a busy Tuesday, which is most of what this calendar
      // is for. Daily columns only — a weekly column spans every weekday, so a
      // single letter there would be a lie. The amber weekend colour stays; the
      // letter is what makes the pattern readable at a glance.
      const DOW1 = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
      const hdFor = (dList, i) => {
        const d = new Date(dList[0] + 'T00:00:00');
        const we = !weekly && (d.getDay() === 0 || d.getDay() === 6);
        const lbl = weekly ? ((d.getMonth() + 1) + '/' + d.getDate())
          : (d.getDate() === 1 || i === 0 ? monthLabel(dList[0].slice(0, 7)).split(' ')[0] + ' ' + d.getDate() : String(d.getDate()));
        // Full name in the tooltip, since S/T/S are ambiguous on their own.
        const ttl = weekly ? dList[0] : DOW[d.getDay()] + ' ' + dList[0];
        return e('div', { key: 'h' + i, className: 'cc-hd' + (we ? ' we' : ''), title: ttl },
          weekly ? null : e('span', { className: 'cc-dow' }, DOW1[d.getDay()]),
          lbl);
      };

      const hasStays = stays > 0;

      // Rec Insights — compact aggregate blob for the camping insights endpoint
      const nightsByDow = [0, 0, 0, 0, 0, 0, 0];
      nightRows.forEach(r => { const dw = dowOf(r); if (dw != null) nightsByDow[dw]++; });
      const buildCampBlob = () => ({
        dateRange: { start, end, daysInRange: days.length },
        totals: { stays, nightsBooked: nights, netRevenueUsd: Math.round(revenue), avgStayNights: +avgStay.toFixed(1), sitesBooked, sitesMapped: sitesTotal, bookedSiteDays: siteDays, occupancyPct: occPct == null ? null : Math.round(occPct) },
        weekendVsWeekday: { weekendNights: wkndNights, weekdayNights: nightRows.length - wkndNights, weekendPct: wkndPct == null ? null : Math.round(wkndPct) },
        occupiedNightsByDayOfWeek: Object.fromEntries(DOW.map((d, i) => [d, nightsByDow[i]])),
        checkinsByDayOfWeek: Object.fromEntries(DOW.map((d, i) => [d, dowCounts[i]])),
        stayLengthMix: lenData.map(b => ({ bucket: b.label, stays: b.v })),
        monthly: months.map(m => ({ month: m, stays: byMonth[m].stays, revenueUsd: Math.round(byMonth[m].revenue) })),
        topSitesByRevenue: topSites.map(s => ({ site: s.site, location: s.location, stays: s.stays, daysBooked: s.days, weekendPct: s.nights ? Math.round(s.wknd / s.nights * 100) : null, revenueUsd: Math.round(s.rev) })),
      });
      const getCampInsights = async () => {
        setInsLoading(true); setInsError(null);
        try {
          const tok = CFG.token ? '?token=' + encodeURIComponent(CFG.token) : '';
          const resp = await fetch('/' + CFG.slug + '/camping/api/insights' + tok, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildCampBlob()) });
          const j = await resp.json();
          if (!resp.ok || !j.ok) throw new Error(j.error || 'Server returned ' + resp.status);
          setInsights(j.insights || []);
        } catch (er) { setInsError(er.message || 'Could not generate insights'); }
        setInsLoading(false);
      };

      // ── Derived signals for the panels below ──────────────────────────────
      // Placed HERE, immediately before the render, and not up with the other
      // derivations — on purpose.
      //
      // These blocks are IIFEs, so they run the moment they are defined. Sitting
      // higher up, `dowSpread` referenced `DOW`, which is declared ~80 lines
      // further down this same function. In source that is a temporal dead zone,
      // but Babel compiles `const` to `var`, so it did not throw a clean
      // ReferenceError — `DOW` was simply `undefined` and `DOW.map` blew up with
      // "Cannot read properties of undefined", crashing the whole tab to a blank
      // page in production. Defining derived values after everything they read
      // removes the class of bug rather than patching one instance of it.
      // ── Add-ons: what people actually buy, and what it earns ──────────────
      // "Add Ons" is a display string, e.g. "Topaz Holiday Surcharge ($10.00)"
      // and occasionally several separated by commas. The price in the label is
      // per-add-on list price; "Add-On Fees" is the charged total for the row,
      // so counts come from the label and money from the numeric column. Counted
      // on ARRIVAL rows only — a multi-day stay repeats its add-ons on every
      // night row, which would multiply a 5-night stay's alcohol permit by five.
      const addOnStats = (() => {
        const byName = {};
        let withAny = 0, feeTotal = 0;
        arrivals.forEach(r => {
          const raw = String(r['Add Ons'] || '').trim();
          const fee = Number(r['Add-On Fees']) || 0;
          feeTotal += fee;
          if (!raw) return;
          withAny++;
          // Split on commas that are not inside the trailing ($x.xx).
          raw.split(/,(?![^(]*\))/).forEach(part => {
            const t = part.trim();
            if (!t) return;
            const m = /^(.*?)\s*\(\$?([\d,.]+)\)\s*$/.exec(t);
            const name = (m ? m[1] : t).trim();
            const listed = m ? Number(String(m[2]).replace(/,/g, '')) : null;
            if (!name) return;
            const b = byName[name] || (byName[name] = { name, n: 0, listed: null });
            b.n++;
            if (listed != null && !isNaN(listed)) b.listed = listed;
          });
        });
        const list = Object.keys(byName).map(k => byName[k]).sort((a, b) => b.n - a.n);
        return { list, withAny, feeTotal, arrivals: arrivals.length };
      })();

      // ── Day-of-week demand spread ─────────────────────────────────────────
      // Occupied nights per weekday, normalised by how many of that weekday the
      // range actually contains — a range with five Saturdays and four Tuesdays
      // would otherwise make Saturday look busier than it is.
      const dowSpread = (() => {
        const dayCount = [0, 0, 0, 0, 0, 0, 0];
        days.forEach(d => { dayCount[new Date(d + 'T00:00:00').getDay()]++; });
        // Counted locally rather than reusing `nightsByDow`. It is declared above
        // this point now, so either would work — but deriving from `nightRows`
        // keeps this block independent of declaration order, which is the thing
        // that broke it once already.
        const byDow = [0, 0, 0, 0, 0, 0, 0];
        nightRows.forEach(r => { const dw = dowOf(r); if (dw != null) byDow[dw]++; });
        const rows_ = DOW.map((name, i) => ({
          i, name,
          nights: byDow[i],
          occurrences: dayCount[i],
          perDay: dayCount[i] ? byDow[i] / dayCount[i] : null,
        })).filter(r => r.occurrences > 0);
        const rated = rows_.filter(r => r.perDay != null);
        if (rated.length < 2) return null;
        const sorted = rated.slice().sort((a, b) => b.perDay - a.perDay);
        return { rows: rows_, busiest: sorted[0], quietest: sorted[sorted.length - 1] };
      })();

      // ── Stay-length mix ───────────────────────────────────────────────────
      const stayMix = (() => {
        if (!arrivals.length) return null;
        let one = 0, short_ = 0, week = 0, longest = 0;
        arrivals.forEach(r => {
          const n = Math.max(1, Number(r['Multi-Day Days']) || 1);
          if (n > longest) longest = n;
          if (n <= 1) one++; else if (n <= 3) short_++; else week++;
        });
        return { one, short: short_, week, longest, total: arrivals.length };
      })();

      const TODAY = todayStr();
      const pastDays = days.filter(d => d <= TODAY);
      const trendHalf = Math.floor(pastDays.length / 2);
      // Need a fortnight of settled days to say anything: a 3-day sample flips
      // direction on one booking.
      const trendReady = !weekly && pastDays.length >= 14;
      const trendFor = st => {
        if (!trendReady || !st) return null;
        const early = pastDays.slice(0, trendHalf);
        const late  = pastDays.slice(pastDays.length - trendHalf);
        const occIn = list => list.reduce((n, d) => n + (st.occ[d] ? 1 : 0), 0);
        const a = occIn(early), b = occIn(late);
        if (a + b < 2) return null;              // barely booked either way
        const ra = a / early.length, rb = b / late.length;
        const delta = rb - ra;
        const dir = Math.abs(delta) < 0.12 ? 'flat' : (delta > 0 ? 'up' : 'down');
        return { dir, delta, ra, rb, nights: trendHalf };
      };
      const TREND_META = {
        up:   { glyph: '\u25B2', cls: 'up',   word: 'heating up' },
        down: { glyph: '\u25BC', cls: 'down', word: 'cooling off' },
        flat: { glyph: '\u2013', cls: 'flat', word: 'steady' },
      };
      const trendChip = t => {
        if (!t) return null;
        const m = TREND_META[t.dir];
        const pct = v => Math.round(v * 100) + '%';
        return e('span', {
          className: 'cc-trend ' + m.cls,
          title: 'Occupancy ' + m.word + ' \u2014 ' + pct(t.ra) + ' \u2192 ' + pct(t.rb)
               + ' over the last two ' + t.nights + '-day stretches (settled days only)',
        }, m.glyph);
      };


      return e('div', null,
        e(CampBanner, { stays, nights, occPct, revenue, sitesBooked, sitesTotal }),
        e('div', { className: 'sum-cards' },
          kpis.map((c, i) => e('div', { className: 'sum-card', key: i },
            e('div', { className: 'sc-label' }, c.label),
            e('div', { className: 'sc-val ' + c.cls }, c.val),
            e('div', { className: 'sc-sub' }, c.sub)))),

        // AI insights (shared endpoint pattern with the Court Utilization tab)
        hasStays ? e('div', { className: 'insights-section' },
          e('div', { className: 'insights-head' },
            e('button', { type: 'button', className: 'insights-btn', onClick: getCampInsights, disabled: insLoading }, sparkles(), insLoading ? 'Analyzing…' : (insights ? '↻ Refresh insights' : '✨ Rec Insights')),
            insights && !insLoading ? e('span', { className: 'insights-sub' }, 'Generated from the ' + stays.toLocaleString() + ' stays shown') : null),
          insError && !insLoading ? e('div', { className: 'cu-error' }, e('strong', null, 'Insights unavailable: '), insError) : null,
          insights && !insLoading ? e('div', { className: 'insights-grid' },
            insights.map((ins, i) => e('div', { key: i, className: 'insight-card insight-' + (ins.type || 'signal') },
              e('div', { className: 'insight-type' }, ins.type || 'signal'),
              e('div', { className: 'insight-title' }, ins.title),
              e('div', { className: 'insight-detail' }, ins.detail),
              ins.action ? e('div', { className: 'insight-action' }, '→ ' + ins.action) : null))) : null) : null,

        // ── Demand & pricing read ─────────────────────────────────────────
        // Deliberately leads with OCCUPANCY, not money. Occupancy is a count of
        // nights and is trustworthy; campsite revenue here is not, for three
        // reasons worth keeping in front of the reader rather than in a commit
        // message: `Total` is only summed on arrival rows, comped and test
        // bookings sit in the data at $0, and this feed has the known invoice_v2
        // gap (manual invoice lines carry no reservation_id, so they are missing
        // entirely — see the facility-revenue write-up). So the rate figure is
        // labelled indicative and the pricing conclusion rests on the occupancy
        // spread, which is the part that holds up.
        hasStays ? e('div', { className: 'aqua-sec' },
          e('h3', null, 'Demand & pricing signals', e('span', { className: 'sub' },
            'what the ' + stays.toLocaleString() + ' stays in range suggest')),
          e('div', { className: 'aqua-grid' },

            // Busiest / quietest weekday, per-occurrence so an uneven range
            // does not fake a winner.
            dowSpread ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Demand by day of week', e('span', { className: 'n' }, 'nights per occurrence')),
              e(HBars, { color: '#2c8a50', data: dowSpread.rows.map(r => ({
                label: r.name, v: r.perDay || 0,
                valText: (r.perDay || 0).toFixed(1) + ' / ' + r.occurrences + 'd',
              })) }),
              e('div', { className: 'camp-note' },
                'Busiest ', e('b', null, dowSpread.busiest.name),
                ' at ', e('b', null, dowSpread.busiest.perDay.toFixed(1)), ' site-nights per ',
                dowSpread.busiest.name, '; quietest ', e('b', null, dowSpread.quietest.name),
                ' at ', e('b', null, dowSpread.quietest.perDay.toFixed(1)), '.',
                dowSpread.quietest.perDay > 0 && dowSpread.busiest.perDay / dowSpread.quietest.perDay >= 1.5
                  ? e('span', null, ' That is a ',
                      e('b', null, (dowSpread.busiest.perDay / dowSpread.quietest.perDay).toFixed(1) + '\u00D7'),
                      ' spread \u2014 the gap a weekday discount or a peak-night premium would work on.')
                  : e('span', null, ' Demand is fairly even across the week, so day-of-week pricing has little to bite on.')) ) : null,

            // Add-ons: what sells, and whether a surcharge is actually landing.
            addOnStats.list.length ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Add-ons attached', e('span', { className: 'n' },
                addOnStats.withAny.toLocaleString() + ' of ' + addOnStats.arrivals.toLocaleString() + ' stays')),
              e(HBars, { color: '#7c3aed', data: addOnStats.list.slice(0, 6).map(a => ({
                label: a.name, v: a.n,
                valText: a.n.toLocaleString() + (a.listed != null ? ' \u00B7 $' + a.listed.toFixed(2) : ''),
              })) }),
              e('div', { className: 'camp-note' },
                e('b', null, Math.round(addOnStats.withAny / Math.max(1, addOnStats.arrivals) * 100) + '%'),
                ' of stays carry at least one add-on',
                addOnStats.feeTotal > 0
                  ? e('span', null, ', ', e('b', null, money(addOnStats.feeTotal)), ' in add-on fees booked')
                  : null,
                '. A surcharge attached to only a slice of stays is a pricing lever that is not being pulled.')) : null,

            // Stay-length mix — the turnover picture behind the occupancy number.
            stayMix ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Stay length mix', e('span', { className: 'n' }, 'avg ' + avgStay.toFixed(1) + ' nights')),
              e(HBars, { color: '#0369a1', data: [
                { label: '1 night',    v: stayMix.one,   valText: stayMix.one.toLocaleString() },
                { label: '2\u20133 nights', v: stayMix.short, valText: stayMix.short.toLocaleString() },
                { label: '4+ nights',  v: stayMix.week,  valText: stayMix.week.toLocaleString() },
              ] }),
              e('div', { className: 'camp-note' },
                e('b', null, Math.round(stayMix.one / stayMix.total * 100) + '%'),
                ' are single nights (longest in range: ', e('b', null, stayMix.longest + ' nights'), '). ',
                stayMix.one / stayMix.total > 0.5
                  ? 'Single-night churn is the cost centre \u2014 a 2-night minimum on peak weekends is the usual lever.'
                  : 'Multi-night stays dominate, so minimum-stay rules would mostly just turn away business.')) : null,

            // Realized rate, explicitly labelled as indicative.
            nights > 0 ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Realized rate', e('span', { className: 'n' }, 'indicative only')),
              e('div', { className: 'camp-bignum' }, money(revenue / nights)),
              e('div', { className: 'camp-note' },
                'Booked revenue \u00F7 ', nights.toLocaleString(), ' site-nights. ',
                e('b', null, 'Treat as a floor, not a rate card'), ' \u2014 this feed counts revenue only on '
                + 'the arrival row, comped and test bookings sit in it at $0, and manual invoice lines are '
                + 'missing from it entirely. Occupancy above is the reliable half of this panel.')) : null))
          : null,

        // Site × day occupancy calendar — booked sites only by default; empty
        // rows are noise at campgrounds with many mapped-but-unbooked sites.
        // One sub-grid per campsite location when the org runs more than one.
        (() => {
          const groups = calGroups.map(g => ({
            name: g.name, all: g.sites, booked: g.sites.filter(s => s.st),
          })).filter(g => g.all.length);
          const totalAll = groups.reduce((n, g) => n + g.all.length, 0);
          const hidden = totalAll - groups.reduce((n, g) => n + g.booked.length, 0);
          const shown = groups.map(g => ({ name: g.name, sites: allSites ? g.all : g.booked })).filter(g => g.sites.length);
          if (!shown.length) return null;
          return e('div', { className: 'aqua-sec' },
          e('h3', null, 'Site occupancy calendar', e('span', { className: 'sub' },
            weekly ? 'weekly — deeper green = more days booked' : 'green runs are stays — dark cell = check-in day'),
            hidden > 0 ? e('button', {
              onClick: () => setAllSites(v => !v),
              style: { marginLeft: 10, fontSize: 10, fontWeight: 600, color: '#2c8a50', background: 'none', border: '1px solid #a4d3a0', borderRadius: 12, padding: '1px 9px', cursor: 'pointer', textTransform: 'none', letterSpacing: 0 },
            }, allSites ? 'Hide ' + hidden + ' empty sites' : 'Show all ' + totalAll + ' sites') : null),
          e('div', { className: 'aqua-panel' },
            shown.map((g, gi) => e('div', { key: gi, style: gi ? { marginTop: 16 } : null },
              shown.length > 1 ? e('h4', { style: { margin: '0 0 8px', fontSize: 11.5, fontWeight: 700, color: '#374151' } }, g.name || 'Sites',
                e('span', { className: 'n', style: { fontWeight: 500, color: '#9ca3af', fontSize: 10.5, marginLeft: 6 } }, g.sites.length + ' site' + (g.sites.length === 1 ? '' : 's'))) : null,
              e('div', { className: 'camp-cal-wrap' },
                e('div', { className: 'camp-cal', style: { gridTemplateColumns: '110px repeat(' + calCols.length + ', minmax(' + (weekly ? 22 : 14) + 'px, 1fr))' } },
                  e('div', { className: 'cc-site' }, ''),
                  calCols.map((dl, i) => hdFor(dl, i)),
                  g.sites.flatMap(site => [
                    e('div', { key: site.n + 'lbl', className: 'cc-site', title: site.n + (site.loc ? ' · ' + site.loc : '') },
                      trendChip(trendFor(site.st)), site.n),
                    calCols.map((dl, i) => calCell(site, dl, site.n + '-' + i)),
                  ]))))),
            weekly
              ? e('div', { className: 'camp-cal-legend' }, 'Fewer', RAMP6.map((c, i) => e('i', { key: i, style: { background: c, marginRight: 0 } })), 'More days booked / week')
              : e('div', { className: 'camp-cal-legend' },
                  e('span', null, e('i', { style: { background: '#2c8a50' } }), 'Check-in'),

    // ── Court Utilization — native view (ported from court-utilization.html) ──
    // All metrics/info from the standalone Court Utilization report, rendered

    const withCuToken = url => CFG.token ? url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(CFG.token) : url;

    // Normalize court rows (snake_case or Title Case) — verbatim from the report.
    function cuNormalize(rows) {
      return (rows || []).map(r => ({
        courtName:        r.court_name        || r['Court Name']        || '',
        locationName:     r.location_name     || r['Location Name']     || '',
        facilityRentalId: r.facility_rental_id|| r['Facility Rental Id']|| '',
        usageCategory:    r.usage_category    || r['Usage Category']    || 'Customer Booking',
        bookingSource:    r.booking_source    || r['Booking Source']    || '',
        localDate:        r.local_date        || '',
        // Wall-clock start/end. The card has always sent these; they are what
        // makes hour-of-day analysis possible without a second query.
        localStart:       r.local_start       || '',
        localEnd:         r.local_end         || '',
        durationHours:    Number(r.duration_hours || 0),
      })).filter(r => r.courtName);
    }
    const CU_UTIL_COLOR = pct => pct >= 70 ? '#dc2626' : pct >= 50 ? '#ea580c' : pct >= 30 ? '#f59e0b' : pct >= 15 ? '#16a34a' : '#94a3b8';
    const CU_MAP_COLOR  = pct => pct >= 70 ? '#dc2626' : pct >= 40 ? '#f59e0b' : pct >= 15 ? '#22c55e' : '#94a3b8';
    const CU_DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const cuHour12 = h => { const x = ((h % 24) + 24) % 24; return ((x % 12) || 12) + (x < 12 ? 'am' : 'pm'); };
    // One ramp for every utilisation cell on this tab — the day-of-week grid and
    // the hourly grid that expands underneath a court must read as one scale.
    // avail === 0 means the court is closed then: grey, never a 0% reading.
    const cuHeatCell = (pct, avail) =>
      avail === 0            ? { bg: '#f3f3f0', fg: '#ccc' } :
      pct >= 80              ? { bg: '#dc2626', fg: '#fff' } :
      pct >= 60              ? { bg: '#ea580c', fg: '#fff' } :
      pct >= 40              ? { bg: '#f59e0b', fg: '#1a1a1a' } :
      pct >= 20              ? { bg: '#fde68a', fg: '#1a1a1a' } :
      pct > 0                ? { bg: '#fef9c3', fg: '#666' } :
                               { bg: '#f8f8f6', fg: '#ccc' };

    // Leaflet utilization map by location (ported from the report's MapView)
    function CourtMap({ grouped }) {
      const mapRef = React.useRef(null);
      const mapInst = React.useRef(null);
      const cacheRef = React.useRef({});
      const [geocoded, setGeocoded] = React.useState(null);

      const locations = React.useMemo(() => {
        const byLoc = {};
        grouped.forEach(g => {
          const loc = g.label.split(' — ')[0] || g.label;
          if (!byLoc[loc]) byLoc[loc] = { name: loc, courts: [], totalUsed: 0, totalAvail: 0 };
          byLoc[loc].courts.push(g);
          byLoc[loc].totalUsed += g.customerHrs + g.programHrs;
          byLoc[loc].totalAvail += g.availHrs;
        });
        return Object.values(byLoc).map(l => { l.utilPct = l.totalAvail > 0 ? Math.round(l.totalUsed / l.totalAvail * 100) : 0; return l; });
      }, [grouped]);

      React.useEffect(() => {
        if (!locations.length) return;
        const cache = cacheRef.current;
        let cityName = CFG.mapCity || '';
        if (!cityName) cityName = (CFG.displayName || '').replace(/\s*(Parks|Recreation|Department|City of|Town of).*$/i, '').replace(/^(City of|Town of)\s*/i, '').trim();
        let vb = '';
        const oc = CFG.coords || null;
        if (oc) { const d = 0.15; vb = '&viewbox=' + (oc.lon - d) + ',' + (oc.lat + d) + ',' + (oc.lon + d) + ',' + (oc.lat - d); }
        let idx = 0; const results = [];
        const next = () => {
          if (idx >= locations.length) {
            for (let i = 0; i < results.length; i++) for (let j = i + 1; j < results.length; j++) {
              const dl = results[i].lat - results[j].lat, dg = results[i].lng - results[j].lng;
              if (Math.sqrt(dl * dl + dg * dg) < 0.003) { const a = j * 2.2; results[j].lat += Math.cos(a) * 0.003; results[j].lng += Math.sin(a) * 0.003; }
            }
            setGeocoded(results); return;
          }
          const loc = locations[idx]; idx++;
          if (cache[loc.name]) { results.push(Object.assign({}, loc, cache[loc.name])); next(); return; }
          const q = loc.name + (cityName ? ', ' + cityName : '');
          setTimeout(() => {
            fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q) + vb)
              .then(r => r.json())
              .then(data => {
                if (data && data[0]) { const c = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) }; cache[loc.name] = c; results.push(Object.assign({}, loc, c)); }
                else if (oc) { const off = (results.length * 0.003) - 0.005; results.push(Object.assign({}, loc, { lat: oc.lat + off, lng: oc.lon + off })); }
                next();
              })
              .catch(() => { if (oc) results.push(Object.assign({}, loc, { lat: oc.lat, lng: oc.lon })); next(); });
          }, 1100);
        };
        next();
      }, [locations]);

      React.useEffect(() => {
        if (!geocoded || !geocoded.length || !mapRef.current || typeof L === 'undefined') return;
        if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; }
        const oc = CFG.coords || null;
        const center = oc ? [oc.lat, oc.lon] : [geocoded[0].lat, geocoded[0].lng];
        const map = L.map(mapRef.current).setView(center, 13);
        mapInst.current = map;
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 18 }).addTo(map);
        geocoded.forEach(loc => {
          const radius = Math.max(18, Math.min(50, loc.courts.length * 12 + 10));
          const color = CU_MAP_COLOR(loc.utilPct);
          const circle = L.circleMarker([loc.lat, loc.lng], { radius, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8 }).addTo(map);
          const bars = loc.courts.map(c => {
            const cn = c.label.split(' — ')[1] || c.label;
            const p = c.utilPct != null ? c.utilPct.toFixed(0) : 0;
            const bc = CU_MAP_COLOR(p);
            return '<div class="cu-popup-bar-wrap"><div class="cu-popup-bar-label"><span>' + cn + '</span><span style="font-weight:600;color:' + bc + '">' + p + '%</span></div><div class="cu-popup-bar-track"><div class="cu-popup-bar-fill" style="width:' + Math.min(p, 100) + '%;background:' + bc + '"></div></div></div>';
          }).join('');
          circle.bindPopup('<div style="min-width:220px;max-width:300px;max-height:320px;overflow-y:auto"><div class="cu-popup-title">' + loc.name + '</div>' + bars + '<div class="cu-popup-stats">' + loc.courts.length + ' court' + (loc.courts.length > 1 ? 's' : '') + ' • ' + Math.round(loc.totalUsed) + ' hrs used of ' + Math.round(loc.totalAvail) + ' available</div></div>', { maxWidth: 320 });
          L.marker([loc.lat, loc.lng], { interactive: false, icon: L.divIcon({ className: '', html: '<div style="font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center">' + loc.utilPct + '%</div>', iconSize: [40, 20], iconAnchor: [20, 10] }) }).addTo(map);
        });
        if (geocoded.length > 1) map.fitBounds(L.latLngBounds(geocoded.map(l => [l.lat, l.lng])), { padding: [40, 40] });
        return () => { if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; } };
      }, [geocoded]);

      if (!geocoded) return e('div', { className: 'cu-loading' }, e('div', { className: 'fac-spin' }), 'Geocoding ' + locations.length + ' location' + (locations.length > 1 ? 's' : '') + '…');
      return e('div', null,
        e('div', { className: 'cu-map-legend' },
          e('span', null, e('span', { className: 'cu-map-dot', style: { background: '#dc2626' } }), '70%+ High'),
          e('span', null, e('span', { className: 'cu-map-dot', style: { background: '#f59e0b' } }), '40-70% Medium'),
          e('span', null, e('span', { className: 'cu-map-dot', style: { background: '#22c55e' } }), '15-40% Moderate'),
          e('span', null, e('span', { className: 'cu-map-dot', style: { background: '#94a3b8' } }), '<15% Low'),
          e('span', { style: { marginLeft: 'auto', fontSize: 10, color: '#bbb' } }, 'Click a location for court breakdown')),
        e('div', { className: 'cu-map-wrap', ref: mapRef }),
      );
    }

    function CourtUtilizationView({ start, end, courtFilter, theme }) {
      const slug = CFG.slug;
      const [schedules, setSchedules] = React.useState(null);
      const [schedMeta, setSchedMeta] = React.useState(null);
      const [rows, setRows] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      const [loadedStart, setLoadedStart] = React.useState(null);
      const [loadedEnd, setLoadedEnd] = React.useState(null);
      const [selectedLocations, setSelectedLocations] = React.useState([]);
      const [showInstant, setShowInstant] = React.useState(true);
      const [showManaged, setShowManaged] = React.useState(true);
      const [hrsPerDay, setHrsPerDay] = React.useState(16);
      const [metric, setMetric] = React.useState('util');
      const [ctab, setCtab] = React.useState('overview');
      // Which court's hourly grid is open. A single value, not a Set — expanding
      // one court closes the last, because 26 open grids is 3,000 cells.
      const [openCourt, setOpenCourt] = React.useState(null);
      // Day-of-week + hour-of-day slice. Days are 1=Mon..7=Sun; the hour window
      // is [from, to) in 24h, null when off. Both narrow the numerator AND the
      // denominator — see sliceHours/computeCourtAvail.
      const [dowSel, setDowSel] = React.useState(() => {
        const q = new URLSearchParams(window.location.search);
        const days = (q.get('dow') || '').split(',').map(Number).filter(n => n >= 1 && n <= 7);
        return days.length ? days : [1, 2, 3, 4, 5, 6, 7];
      });
      const [hourFrom, setHourFrom] = React.useState(() => {
        const v = parseInt(new URLSearchParams(window.location.search).get('from'), 10);
        return isNaN(v) ? null : v;
      });
      const [hourTo, setHourTo] = React.useState(() => {
        const v = parseInt(new URLSearchParams(window.location.search).get('to'), 10);
        return isNaN(v) ? null : v;
      });
      // insights
      const [insights, setInsights] = React.useState(null);
      const [insLoading, setInsLoading] = React.useState(false);
      const [insError, setInsError] = React.useState(null);
      const [insTrace, setInsTrace] = React.useState(null);
      const [fbSent, setFbSent] = React.useState(false);
      const [fbMode, setFbMode] = React.useState(null);
      const [fbComment, setFbComment] = React.useState('');

      // Schedules once on mount
      React.useEffect(() => {
        (async () => {
          try {
            const r = await fetch(withCuToken('/' + slug + '/court-utilization/api/schedules'));
            if (!r.ok) throw new Error('schedules fetch failed');
            const j = await r.json();
            setSchedules(j.schedules || {});
            setSchedMeta({ fallbackHrsPerDay: j.fallbackHrsPerDay || 12, matchedCount: j.matchedCount || 0, courtCount: j.courtCount || 0 });
            if (j.fallbackHrsPerDay) setHrsPerDay(j.fallbackHrsPerDay);
          } catch (er) { setSchedules({}); setSchedMeta({ fallbackHrsPerDay: 12, matchedCount: 0, courtCount: 0 }); }
        })();
      }, [slug]);

      const load = React.useCallback(async (sd, ed) => {
        setLoading(true); setError(null);
        try {
          const params = new URLSearchParams({ start_date: sd, end_date: ed });
          const r = await fetch(withCuToken('/' + slug + '/court-utilization/api/data?' + params.toString()));
          if (!r.ok) { const t = await r.text(); throw new Error(r.status + ': ' + t.slice(0, 160)); }
          const j = await r.json();
          setRows(Array.isArray(j) ? j : (j.rows || j.data || []));
          setLoadedStart(sd); setLoadedEnd(ed);
        } catch (er) { setError(String(er.message || er)); setRows([]); }
        finally { setLoading(false); }
      }, [slug]);

      React.useEffect(() => { load(start, end); }, [start, end, load]);

      // Keep the slice in the URL — a filtered view is the thing people want to
      // send each other ("pickleball courts, Tuesdays 11-2").
      React.useEffect(() => {
        const q = new URLSearchParams(window.location.search);
        if (dowSel.length < 7) q.set('dow', dowSel.slice().sort().join(',')); else q.delete('dow');
        if (hourFrom != null) q.set('from', String(hourFrom)); else q.delete('from');
        if (hourTo != null && hourFrom != null) q.set('to', String(hourTo)); else q.delete('to');
        const next = window.location.pathname + (q.toString() ? '?' + q.toString() : '') + window.location.hash;
        window.history.replaceState(null, '', next);
      }, [dowSel, hourFrom, hourTo]);

      // ── Derived (verbatim from the standalone report) ──
      const normalized = React.useMemo(() => {
        const all = cuNormalize(rows);
        return courtFilter ? all.filter(r => courtFilter(r.courtName, r.locationName)) : all;
      }, [rows, courtFilter]);
      const allLocations = React.useMemo(() => Array.from(new Set(normalized.map(r => r.locationName).filter(Boolean))).sort(), [normalized]);
      React.useEffect(() => { setSelectedLocations(allLocations); }, [allLocations]);

      const daysInRange = React.useMemo(() => {
        const s = loadedStart || start, en = loadedEnd || end;
        if (!s || !en) return 1;
        return Math.max(1, Math.round((new Date(en + 'T00:00:00') - new Date(s + 'T00:00:00')) / 86400000) + 1);
      }, [loadedStart, loadedEnd, start, end]);

      const dowCounts = React.useMemo(() => {
        const s = loadedStart || start, en = loadedEnd || end;
        if (!s || !en) return {};
        const counts = {}; const cur = new Date(s + 'T12:00:00'); const stop = new Date(en + 'T12:00:00');
        while (cur <= stop) { const jd = cur.getDay(); const dow = jd === 0 ? 7 : jd; counts[dow] = (counts[dow] || 0) + 1; cur.setDate(cur.getDate() + 1); }
        return counts;
      }, [loadedStart, loadedEnd, start, end]);

      const dowSet = React.useMemo(() => new Set(dowSel), [dowSel]);
      const hourWin = React.useMemo(
        () => (hourFrom != null && hourTo != null && hourTo > hourFrom) ? { from: hourFrom, to: hourTo } : null,
        [hourFrom, hourTo]);
      const sliceActive = dowSel.length < 7 || !!hourWin;
      const dowLabel = (() => {
        const sorted = dowSel.slice().sort((a, b) => a - b);
        if (sorted.length === 7) return 'All days';
        if (sorted.join() === '1,2,3,4,5') return 'Weekdays';
        if (sorted.join() === '6,7') return 'Weekends';
        return sorted.map(d => CU_DOW[d - 1]).join(', ');
      })();
      const sliceLabel = dowLabel
        + (hourWin ? ' · ' + cuHour12(hourWin.from) + '-' + cuHour12(hourWin.to) : '');
      // Dates of each weekday that survive the day filter — the denominator's
      // date count everywhere below.
      const selDates = React.useCallback(d => (dowSet.has(d) ? (dowCounts[d] || 0) : 0), [dowSet, dowCounts]);
      const dowOfRow = r => {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(r.localDate || ''));
        if (!m) return null;
        const jd = new Date(+m[1], +m[2] - 1, +m[3]).getDay();
        return jd === 0 ? 7 : jd;
      };
      // Hours of a booking that fall inside the hour window. A 10:00-12:30
      // rental contributes 1.5h to an 11-2 window, not 2.5h — without the clip
      // every filtered number would overcount the edges.
      const sliceHours = React.useCallback(r => {
        if (!hourWin) return r.durationHours || 0;
        if (!r.localStart || !r.localEnd) return 0;
        const st = new Date(r.localStart), en = new Date(r.localEnd);
        if (isNaN(st) || isNaN(en) || en <= st) return 0;
        const ws = new Date(st.getFullYear(), st.getMonth(), st.getDate(), hourWin.from);
        const we = new Date(st.getFullYear(), st.getMonth(), st.getDate());
        we.setHours(hourWin.to);
        const ms = Math.min(en, we) - Math.max(st, ws);
        return ms > 0 ? ms / 3600000 : 0;
      }, [hourWin]);

      const filtered = React.useMemo(() => {
        const locSet = new Set(selectedLocations);
        return normalized.filter(r => {
          if (!locSet.has(r.locationName)) return false;
          const d = dowOfRow(r);
          if (d && !dowSet.has(d)) return false;
          if (hourWin && sliceHours(r) <= 0) return false;   // nothing inside the window
          return true;
        });
      }, [normalized, selectedLocations, dowSet, hourWin, sliceHours]);

      const computeCourtAvail = React.useCallback(label => {
        // With an hour window the window IS the denominator: "of the 11-2 you
        // asked about, X% was booked". Schedules expose hours-per-day, not the
        // windows themselves, so they cannot be intersected with 11-2 — and
        // dividing a 3-hour slice by a 12-hour day would read as noise.
        if (hourWin) {
          const perDay = hourWin.to - hourWin.from;
          let total = 0;
          for (let dow = 1; dow <= 7; dow++) total += perDay * selDates(dow);
          return { availHrs: total, source: 'window' };
        }
        if (schedules && schedules[label] && schedules[label].dailyHrs) {
          const dh = schedules[label].dailyHrs; let total = 0;
          for (let dow = 1; dow <= 7; dow++) total += (dh[dow] || 0) * selDates(dow);
          return { availHrs: total, source: 'schedule' };
        }
        let days = 0;
        for (let dow = 1; dow <= 7; dow++) days += selDates(dow);
        return { availHrs: (Number(hrsPerDay) || 0) * days, source: 'fallback' };
      }, [schedules, selDates, hrsPerDay, hourWin]);

      const grouped = React.useMemo(() => {
        const byCourt = new Map();
        for (const r of filtered) {
          const label = r.locationName + ' — ' + r.courtName;
          if (!byCourt.has(label)) byCourt.set(label, { label, location: r.locationName, court: r.courtName, customer: new Set(), program: new Set(), closure: new Set(), customerHrs: 0, programHrs: 0, closureHrs: 0 });
          const g = byCourt.get(label); const hrs = sliceHours(r);
          if (r.usageCategory === 'Closure / Block') { g.closure.add(r.facilityRentalId); g.closureHrs += hrs; }
          else if (r.bookingSource === 'instant') { g.customer.add(r.facilityRentalId); g.customerHrs += hrs; }
          else { g.program.add(r.facilityRentalId); g.programHrs += hrs; }
        }
        const arr = Array.from(byCourt.values()).map(g => {
          const usedHrs = g.customerHrs + g.programHrs;
          const avail = computeCourtAvail(g.label);
          const pct = avail.availHrs > 0 ? (usedHrs / avail.availHrs) * 100 : null;
          return Object.assign({}, g, { customer: g.customer.size, program: g.program.size, closure: g.closure.size, total: g.customer.size + g.program.size + g.closure.size, usedHrs, availHrs: avail.availHrs, availSource: avail.source, utilPct: pct, demand: pct >= 80 ? 'hot' : pct >= 50 ? 'warm' : null });
        });
        arr.sort((a, b) => a.label.localeCompare(b.label));
        return arr;
      }, [filtered, computeCourtAvail, sliceHours]);

      const overallUtil = React.useMemo(() => {
        if (!grouped.length) return null;
        const used = grouped.reduce((s, g) => s + g.usedHrs, 0), avail = grouped.reduce((s, g) => s + g.availHrs, 0);
        return avail > 0 ? (used / avail) * 100 : null;
      }, [grouped]);

      const scheduleStats = React.useMemo(() => {
        let real = 0, fb = 0;
        grouped.forEach(g => { if (g.availSource === 'schedule') real++; else fb++; });
        return { real, fallback: fb, total: grouped.length };
      }, [grouped]);

      const stats = React.useMemo(() => ({
        distinctFr: new Set(filtered.map(r => r.facilityRentalId).filter(Boolean)).size,
        distinctCourts: new Set(filtered.map(r => r.locationName + '|' + r.courtName)).size,
        reservationRows: filtered.length,
        totalHours: filtered.reduce((s, r) => s + sliceHours(r), 0),
      }), [filtered, sliceHours]);

      const dowHeatmap = React.useMemo(() => {
        if (!grouped.length || !filtered.length) return [];
        const courtDow = {};
        for (const r of filtered) {
          if (!r.localDate || !r.durationHours || r.usageCategory === 'Closure / Block') continue;
          const label = r.locationName + ' — ' + r.courtName;
          const jd = new Date(r.localDate + 'T12:00:00').getDay(); const dow = jd === 0 ? 7 : jd;
          courtDow[label + '|' + dow] = (courtDow[label + '|' + dow] || 0) + sliceHours(r);
        }
        const fb = Number(hrsPerDay) || 12;
        return grouped.map(g => {
          const cells = [];
          for (let d = 1; d <= 7; d++) {
            const used = courtDow[g.label + '|' + d] || 0;
            const sched = schedules && schedules[g.label] && schedules[g.label].dailyHrs;
            const hrsForDay = hourWin ? (hourWin.to - hourWin.from) : (sched ? (sched[d] || 0) : fb);
            const avail = hrsForDay * selDates(d);   // 0 for a day the filter excludes
            cells.push({ dow: d, used, avail, pct: avail > 0 ? (used / avail) * 100 : 0, off: !dowSet.has(d) });
          }
          return { label: g.label, court: g.court, location: g.location, demand: g.demand, utilPct: g.utilPct, cells };
        });
      }, [grouped, filtered, schedules, selDates, dowSet, hourWin, hrsPerDay, sliceHours]);

      // ── Hour-of-day utilisation ──────────────────────────────────────
      // Occupied time is split across every hour a booking actually spans
      // (a 5:30-8:00 rental is 30 min of 5pm and an hour each of 6 and 7),
      // never credited whole to its start hour. Minutes are capped at 60 per
      // court/date/hour so overlapping bookings on one court cannot push an
      // hour past 100%. Denominator is the observed open window — the
      // earliest start to the latest end seen in the range — since the
      // schedules feed currently exposes hours-per-day but not the windows
      // themselves; hours outside it count as closed rather than as 0%.
      // Closure/maintenance blocks are excluded on both sides.
      const hourly = React.useMemo(() => {
        const src = filtered.filter(r => r.localStart && r.localEnd && r.usageCategory !== 'Closure / Block');
        const courts = grouped.length;
        if (!src.length || !courts) return null;
        const perCell = {}, perCourtDate = {}, perCourt = {};
        let minHour = 24, maxHour = 0;
        for (const r of src) {
          const s = new Date(r.localStart), e = new Date(r.localEnd);

            const prev = perCourtDate[ck] || 0;
            const add = Math.max(0, Math.min(60 - prev, mins));

            const cl = r.locationName + ' — ' + r.courtName;   // matches the heatmap row label
            if (!perCourt[cl]) perCourt[cl] = {};

            if (h + 1 > maxHour) maxHour = h + 1;
          }

        if (minHour >= maxHour) return null;

        const byHour = [];
        for (let h = minHour; h < maxHour; h++) {

          byHour.push({
            hour: cuHour12(h), utilizationPct: all.pct,
            weekdayPct: band(h, h + 1, WD).pct, weekendPct: band(h, h + 1, WE).pct,

        // an operator can act on. Two hours minimum, biggest idle first.

          const out = []; let run = null;
          for (let h = minHour; h < maxHour; h++) {
            const b = band(h, h + 1, days);

            else if (run) { out.push(run); run = null; }

          if (run) out.push(run);

            .map(x => Object.assign({ days: label, from: cuHour12(x.from), to: cuHour12(x.to) }, band(x.from, x.to, days)))
            .sort((a, b) => b.idleHours - a.idleHours).slice(0, 2);
        };
        return {
          // Sent to Rec Insights. Deliberately excludes byCourt — the model
          // needs the shape of the day, not 69 courts × 126 cells.
          blob: {
            basis: 'Observed open window ' + cuHour12(minHour) + '-' + cuHour12(maxHour) + ' across ' + courts + ' court(s) with activity; hours outside the window are treated as closed, not as 0% utilised. Closure and maintenance blocks excluded.',
            openWindow: cuHour12(minHour) + '-' + cuHour12(maxHour),
            courtsCounted: courts,
            byHour,
            quietWeekdayBlocks: quiet(WD, 'Mon-Fri'),
            quietWeekendBlocks: quiet(WE, 'Sat-Sun'),
            peakHours: byHour.slice().sort((a, b) => (b.utilizationPct || 0) - (a.utilizationPct || 0)).slice(0, 3)
              .map(x => ({ hour: x.hour, utilizationPct: x.utilizationPct })),
          },
          fromHour: minHour,
          toHour: maxHour,
          // court label -> 'dow|hour' -> booked minutes, for the row a user expands
          byCourt: perCourt,
        };
      }, [filtered, grouped, selDates, dowSet, hourWin]);

      // One court's hour × day grid, built on expand rather than for all 26 at
      // once. Denominator is that court alone: 60 min × the number of that
      // weekday in range. The open window is the view-wide observed one, so
      // every expanded court shows the same hour rows and stays comparable.
      const hourGridFor = React.useCallback((label, parentCells) => {
        if (!hourly || !hourly.byCourt[label]) return null;
        const cells = hourly.byCourt[label];
        // Days the schedule says this court is shut: the day-of-week row above
        // already renders them grey, so the hours under them must agree.
        const closedDow = {};
        (parentCells || []).forEach(c => { if (c.avail === 0) closedDow[c.dow] = true; });
        const rows = [];
        const lo = hourWin ? Math.max(hourly.fromHour, hourWin.from) : hourly.fromHour;
        const hi = hourWin ? Math.min(hourly.toHour, hourWin.to) : hourly.toHour;
        for (let h = lo; h < hi; h++) {
          const cs = [];
          for (let d = 1; d <= 7; d++) {
            const used = (cells[d + '|' + h] || 0) / 60;
            const avail = closedDow[d] ? 0 : selDates(d);   // hours available that weekday

          }

        rows.forEach(r => {

          const wd = r.cells.filter(c => c.dow <= 5);
          const used = wd.reduce((a, c) => a + c.used, 0), avail = wd.reduce((a, c) => a + c.avail, 0);
          const pct = avail > 0 ? (used / avail) * 100 : null;
          if (pct != null && pct < 15) { if (!run) run = { from: r.hour, to: r.hour, used: 0, avail: 0 }; run.to = r.hour + 1; run.used += used; run.avail += avail; }
          else { if (run && run.to - run.from >= 2 && (!quiet || run.to - run.from > quiet.to - quiet.from)) quiet = run; run = null; }
        });
        if (run && run.to - run.from >= 2 && (!quiet || run.to - run.from > quiet.to - quiet.from)) quiet = run;
        return { rows, peak, quiet };
      }, [hourly, selDates]);

      // Insights (reuse the report's endpoint + a compact aggregate blob)
      const buildBlob = React.useCallback(() => {
        const r1 = n => n == null ? null : Math.round(n * 10) / 10;
        return {
          period: { start: loadedStart || start, end: loadedEnd || end, days: daysInRange, hrsPerDayFallback: Number(hrsPerDay) || 0, scheduleSources: { real: scheduleStats.real, fallback: scheduleStats.fallback } },
          overall: { utilizationPct: r1(overallUtil), courtsWithActivity: grouped.length, distinctBookings: stats.distinctFr, reservationRows: stats.reservationRows, totalHours: r1(stats.totalHours) },
          courts: grouped.slice(0, 40).map(g => ({ label: g.label, location: g.location, court: g.court, bookings: g.total, utilizationPct: r1(g.utilPct), hoursUsed: r1(g.usedHrs), availHrs: r1(g.availHrs), availSource: g.availSource, customerBookings: g.customer, programBookings: g.program, closureBookings: g.closure })),
          hourOfDay: hourly ? hourly.blob : null,
          slice: sliceActive ? {

      }, [grouped, overallUtil, stats, loadedStart, loadedEnd, start, end, daysInRange, hrsPerDay, scheduleStats, hourly, sliceActive, dowSel, hourWin, showManaged, showInstant, selectedLocations, allLocations]);

      const getInsights = React.useCallback(async () => {

      }, [buildBlob, slug]);

      const sendFb = React.useCallback(score => {
        if (!insTrace) return;
        fetch(withCuToken('/' + slug + '/court-utilization/api/insights/score'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ traceId: insTrace, score, comment: score === 0 ? fbComment : '' }) }).catch(() => {});
        setFbSent(true); setFbMode(null);
      }, [insTrace, fbComment, slug]);

      if (error) return e('div', { className: 'court-native' }, e('div', { className: 'cu-error' }, e('strong', null, 'Could not load court data: '), error));
      if (loading && !grouped.length) return e('div', { className: 'court-native' }, e('div', { className: 'cu-loading' }, e('div', { className: 'fac-spin' }), 'Loading court utilization…'));
      if (courtFilter && !loading && normalized.length === 0) return e('div', { className: 'court-native' }, e('div', { className: 'cu-empty' }, (theme && theme.emptyMsg) || 'No matching courts in this range.'));

      // KPI cards (hub sum-card style)
      const kpis = [
        { label: 'Court Utilization', val: overallUtil == null ? '—' : overallUtil.toFixed(0) + '%', cls: 'sc-purple' },
        { label: 'Courts with Activity', val: stats.distinctCourts.toLocaleString(), cls: 'sc-green' },
        { label: 'Distinct Bookings', val: stats.distinctFr.toLocaleString(), cls: 'sc-blue' },
        { label: 'Reservation Rows', val: stats.reservationRows.toLocaleString(), cls: 'sc-muted' },
        { label: 'Total Hours', val: stats.totalHours.toLocaleString(undefined, { maximumFractionDigits: 1 }), cls: 'sc-blue' },
      ];

      // Instant vs Leagues split
      const totI = grouped.reduce((s, g) => s + g.customerHrs, 0);
      const totM = grouped.reduce((s, g) => s + g.programHrs, 0);
      const totA = totI + totM;
      const cntI = grouped.reduce((s, g) => s + (g.customer || 0), 0);
      const cntM = grouped.reduce((s, g) => s + (g.program || 0), 0);
      const pI = totA > 0 ? Math.round(totI / totA * 100) : 0;
      const pM = totA > 0 ? Math.round(totM / totA * 100) : 0;

      // Per-court bars — value in the active metric, colored by utilization
      const maxHrs = Math.max(1, ...grouped.map(g => g.customerHrs + g.programHrs));
      const barFor = g => {
        const iVal = showInstant ? (metric === 'util' ? (g.availHrs > 0 ? g.customerHrs / g.availHrs * 100 : 0) : g.customerHrs) : 0;
        const mVal = showManaged ? (metric === 'util' ? (g.availHrs > 0 ? g.programHrs / g.availHrs * 100 : 0) : g.programHrs) : 0;
        const denom = metric === 'util' ? 100 : maxHrs;
        const col = CU_UTIL_COLOR(g.utilPct || 0);
        const visHrs = (showInstant ? g.customerHrs : 0) + (showManaged ? g.programHrs : 0);
        const visPct = g.availHrs > 0 ? (visHrs / g.availHrs) * 100 : 0;
        return {
          iW: Math.min(100, iVal / denom * 100), mW: Math.min(100, mVal / denom * 100), col,
          headline: metric === 'util' ? (visPct > 0 ? Math.round(visPct) + '%' : '—') : (visHrs > 0 ? (visHrs >= 10 ? Math.round(visHrs) : Math.round(visHrs * 10) / 10) + 'h' : '—'),
          sub: g.total + ' bkg' + (g.total === 1 ? '' : 's'),
        };
      };

      return e('div', { className: 'court-native' },
        // KPI row
        e('div', { className: 'sum-cards' },
          kpis.map((c, i) => e('div', { className: 'sum-card', key: i },
            e('div', { className: 'sc-label' }, c.label),
            e('div', { className: 'sc-val ' + c.cls }, c.val)))
        ),
        // Inner tabs (Overview / Map)
        e('div', { className: 'cu-tabs' },
          e('button', { className: 'cu-tab' + (ctab === 'overview' ? ' active' : ''), onClick: () => setCtab('overview') }, 'Overview'),
          e('button', { className: 'cu-tab' + (ctab === 'map' ? ' active' : ''), onClick: () => setCtab('map') }, '🗺️ Map'),
        ),
        ctab === 'map'
          ? (grouped.length ? e(CourtMap, { grouped }) : e('div', { className: 'cu-loading' }, 'No court activity to map in this range.'))
          : e('div', null,
              // Instant vs Leagues/Managed
              grouped.length ? e('div', { style: { display: 'flex', gap: 10, marginTop: 12, flexWrap: 'wrap' } },
                e('div', { className: 'kpi-card' }, e('div', { className: 'kpi-label', style: { color: '#2563eb' } }, 'Instant Bookings'), e('div', { className: 'kpi-value' }, cntI), e('div', { className: 'kpi-sub' }, Math.round(totI) + ' hrs (' + pI + '% of court time)')),
                e('div', { className: 'kpi-card' }, e('div', { className: 'kpi-label', style: { color: '#f59e0b' } }, 'Leagues / Managed'), e('div', { className: 'kpi-value' }, cntM), e('div', { className: 'kpi-sub' }, Math.round(totM) + ' hrs (' + pM + '% of court time)')),
                e('div', { className: 'kpi-card' }, e('div', { className: 'kpi-label', style: { color: '#6b7280' } }, 'Booking Mix'), e('div', { className: 'kpi-value', style: { fontSize: 20 } }, pI + '% / ' + pM + '%'), e('div', { className: 'kpi-sub' }, 'instant / managed')),
              ) : null,
              // Toggle row
              e('div', { className: 'toggle-row' },
                e('span', { style: { fontSize: 11, color: '#666', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.5px' } }, 'View'),
                e('div', { style: { display: 'inline-flex', border: '1px solid #d1d5db', borderRadius: 6, overflow: 'hidden' } },
                  [['util', 'Utilization %'], ['hours', 'Hours reserved']].map(([v, l]) => e('button', {
                    key: v, type: 'button', onClick: () => setMetric(v),
                    style: { padding: '5px 12px', fontSize: 12, border: 'none', cursor: 'pointer', fontFamily: 'inherit', background: metric === v ? '#0d9488' : '#fff', color: metric === v ? '#fff' : '#374151', fontWeight: metric === v ? 600 : 400 },
                  }, l))),
                e('label', null, e('input', { type: 'checkbox', checked: showInstant, onChange: ev => setShowInstant(ev.target.checked) }), e('span', { style: { fontWeight: showInstant ? 600 : 400 } }, 'Instant')),
                e('label', null, e('input', { type: 'checkbox', checked: showManaged, onChange: ev => setShowManaged(ev.target.checked) }), e('span', { style: { fontWeight: showManaged ? 600 : 400 } }, 'Leagues / Managed')),
                allLocations.length > 1 ? e(CourtLocationFilter, { all: allLocations, selected: selectedLocations, onChange: setSelectedLocations }) : null,
                scheduleStats.total > 0 ? e('span', { style: { fontSize: 11, color: '#666', display: 'flex', alignItems: 'center', gap: 6, marginLeft: 'auto' } },
                  scheduleStats.real > 0 ? e('span', { className: 'cu-schedule-badge' }, scheduleStats.real === scheduleStats.total ? 'Real schedules' : scheduleStats.real + '/' + scheduleStats.total + ' real') : null,
                  scheduleStats.fallback > 0 ? e('label', { title: 'Fallback open hours/day — the utilization denominator for courts without schedule data.' }, (scheduleStats.real > 0 ? 'Fallback' : 'Open') + ' hrs/day',
                    e('input', { type: 'number', min: 1, max: 24, step: 0.5, value: hrsPerDay, onChange: ev => setHrsPerDay(ev.target.value) })) : null,
                ) : null,
              ),
              // AI insights
              grouped.length ? e('div', { className: 'insights-section' },
                e('div', { className: 'insights-head' },
                  e('button', { type: 'button', className: 'insights-btn', onClick: getInsights, disabled: insLoading }, sparkles(), insLoading ? 'Analyzing…' : (insights ? '↻ Refresh insights' : '✨ Rec Insights')),
                  insights && !insLoading ? e('span', { className: 'insights-sub' }, 'Generated from the ' + selectedLocations.length + ' location' + (selectedLocations.length === 1 ? '' : 's') + ' shown') : null,
                ),
                insLoading ? e('div', { className: 'cu-loading', style: { padding: '30px 16px' } }, e('div', { className: 'fac-spin' }), 'Squeezing the oranges…') : null,
                insError && !insLoading ? e('div', { className: 'cu-error' }, e('strong', null, 'Insights unavailable: '), insError) : null,
                insights && !insLoading ? e('div', { className: 'insights-grid' },
                  insights.map((ins, i) => e('div', { key: i, className: 'insight-card insight-' + (ins.type || 'signal') },
                    e('div', { className: 'insight-type' }, ins.type || 'signal'),
                    e('div', { className: 'insight-title' }, ins.title),
                    e('div', { className: 'insight-detail' }, ins.detail),
                    ins.action ? e('div', { className: 'insight-action' }, '→ ' + ins.action) : null)) ) : null,
                insights && !insLoading ? e('div', { className: 'insights-feedback' },
                  fbSent ? e('span', { className: 'fb-thanks' }, '✅ Thanks for the feedback!')
                    : fbMode === 'down' ? e('div', { style: { display: 'flex', gap: 6, flex: 1 } },

    const isRacketCourt = (court, loc) => /tennis|pickle|padel|racquet|squash|badminton/i.test((court || '') + ' ' + (loc || ''));

      emptyMsg: 'No racket-sport courts found for this organization in the selected date range. Courts are detected by name (tennis, pickleball, padel, racquetball, squash, badminton) — if you expect courts here, they may be recorded under a different name, or there were no bookings in this window.',

    function App() {
      const now = new Date();
      // Print mode (Puppeteer PDF): /facilities?_print=1&start_date=&end_date=&
      // status=&site_type=&tab= — hydrate the exact on-screen state from the
      // URL so the captured PDF matches the filtered view that requested it.
      const PQS = new URLSearchParams(window.location.search);
      const isPrint = PQS.get('_print') === '1';
      const [start, setStart] = React.useState(PQS.get('start_date') || fmtDate(monthStart(now)));
      const [end, setEnd] = React.useState(PQS.get('end_date') || fmtDate(monthEnd(now)));
      const [tab, setTab] = React.useState(() => PQS.get('tab') || 'summary');
      const [statusSel, setStatusSel] = React.useState(() =>
        PQS.get('status') ? PQS.get('status').split(',').filter(Boolean) : ['confirmed', 'in-progress', 'canceled']);
      const [typeSel, setTypeSel] = React.useState(() =>
        PQS.get('site_type') ? PQS.get('site_type').split(',').filter(Boolean) : []); // [] = all site types
      const [locSel, setLocSel] = React.useState(() =>
        PQS.get('location') ? PQS.get('location').split('~~').filter(Boolean) : []); // [] = all locations
      const [rows, setRows] = React.useState(null);      // null = loading
      const [err, setErr] = React.useState(null);
      const [lessons, setLessons] = React.useState(null); // { n, rev } from the instructor-payout feed
      const [pdfLoading, setPdfLoading] = React.useState(false);
      React.useEffect(() => { if (isPrint) document.body.classList.add('print-mode'); }, []);

      function load(s, en) {
        const sd = s || start, ed = en || end;
        setRows(null); setErr(null);
        const tok = CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '';
        fetch('/' + CFG.slug + '/facilities/api/summary?start_date=' + sd + '&end_date=' + ed + tok)
          .then(r => r.json())
          .then(d => { if (d && d.error) { setErr(d.error); setRows([]); } else { setRows(refineRows((d && d.rows) || [])); } })
          .catch(er => { setErr(er.message); setRows([]); });
        // Instructor lessons happen on these same courts but book through the
        // Lessons product (programs pipeline) — they never appear as facility
        // reservations, so the Summary fetches them separately for the mix.
        setLessons(null);

          .then(r => r.json())
          .then(d => {
            const lrows = (d && d.rows) || [];
            const active = lrows.filter(r => String(r.booking_status || '').toLowerCase() !== 'canceled');
            setLessons({ n: active.length, rev: active.reduce((s, r) => s + (Number(r.amount_paid) || 0), 0) });
          })
          .catch(() => setLessons(null));
      }
      React.useEffect(() => { load(); }, []); // initial

      const runRange = (s, en) => { setStart(s); setEnd(en); load(s, en); };
      const setThisMonth = () => runRange(fmtDate(monthStart(now)), fmtDate(monthEnd(now)));
      const setLastMonth = () => { const d = new Date(now.getFullYear(), now.getMonth() - 1, 1); runRange(fmtDate(monthStart(d)), fmtDate(monthEnd(d))); };
      const setThisYear = () => runRange(fmtDate(new Date(now.getFullYear(), 0, 1)), fmtDate(new Date(now.getFullYear(), 11, 31)));

      const fmtRange = (s, en) => {
        const o = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(s + 'T00:00:00').toLocaleDateString('en-US', o) + ' – ' + new Date(en + 'T00:00:00').toLocaleDateString('en-US', o);
      };
      const active = TABS.find(t => t.key === tab) || TABS[0];

      // All locations present in the feed (the filter's options).
      const allLocations = React.useMemo(
        () => rows ? Array.from(new Set(rows.map(r => r['Location']).filter(Boolean))).sort() : [],
        [rows]);
      // Location filter is a pre-filter on the shared rows: every rows-driven
      // view (Summary + the Golf/Aquatics/Ice vertical tabs) sees only the
      // selected locations, so their internals need no change. [] = all.
      const viewRows = React.useMemo(() => {
        if (!rows || !locSel.length) return rows;
        const set = new Set(locSel);
        return rows.filter(r => set.has(r['Location'] || ''));
      }, [rows, locSel]);

      const count = viewRows ? viewRows.length : null;
      const siteCount = viewRows ? new Set(viewRows.map(r => (r['Facility'] || '') + '|' + (r['Location'] || ''))).size : 0;
      // SF-style orgs name courts plainly ("Alice Marble — Court 1") with no
      // sport keyword; when nothing name-matches but court-type rows exist,
      // fall back to Site Type so the Racket tab shows the org's courts
      // instead of a false empty state.
      const racketFallback = !!(rows && rows.length && !rows.some(r => isRacketCourt(r['Facility'], r['Location'])) && rows.some(r => r['Site Type'] === 'court'));
      const racketRowMatch = r => racketFallback ? r['Site Type'] === 'court' : isRacketCourt(r['Facility'], r['Location']);
      // Per-vertical booking counts for the tab badges — computed from the
      // location-filtered rows so the badges track the location selection.
      const vertCounts = {};

        const ss = new Set(statusSel);

        // Racket Sports view uses to scope the feed.
        vertCounts.racket = viewRows.filter(r => racketRowMatch(r) && ss.has(lc(r['Status']))).length;
      }

      const bannerAgg = viewRows ? aggregate(viewRows, statusSel, typeSel) : null;

      // Exports mirror exactly what's on screen, like the other reports:

      // PDF prints the current view, so it is view-scoped by construction.
      function exportExcel() {
        if (!viewRows || viewRows.length === 0 || typeof XLSX === 'undefined') return;

        let scopeLabel = 'Facility Bookings';
        if (tab === 'racket') {
          scoped = scoped.filter(r => racketRowMatch(r));
          scopeLabel = 'Racket Sports';
        } else if (VERT_CONFIG[tab]) {
          const vt = new Set(VERT_CONFIG[tab].types);
          scoped = scoped.filter(r => vt.has(r['Site Type']));
          scopeLabel = VERT_CONFIG[tab].label;
        }
        if (scoped.length === 0) return;
        const cols = Object.keys(viewRows[0]);
        const ws = XLSX.utils.json_to_sheet(scoped, { header: cols });
        ws['!cols'] = cols.map(c => ({ wch: Math.min(32, Math.max(10, String(c).length + 4)) }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, scopeLabel.slice(0, 31));
        const tabSuffix = (tab !== 'summary' && tab !== 'utilization') ? '-' + tab : '';
        // Handed to a popup to save rather than written straight from here — a
        // download started by a sandboxed iframe is silently dropped. See open-pdf.js.
        saveWorkbookViaPopup(XLSX, wb, CFG.slug + '-facilities' + tabSuffix + '-' + start + '-to-' + end + '.xlsx');
      }
      // PDF: server-side Puppeteer render of this page in print mode with the
      // current filters — same mechanism as the Facility Rental Schedule report.
      function downloadPdf() {
        const qs = new URLSearchParams({ start_date: start, end_date: end });
        if (statusSel.length && statusSel.length < 3) qs.set('status', statusSel.join(','));

        openReportPdf('/' + CFG.slug + '/facilities/api/pdf?' + qs.toString(), { label: 'Facilities' });

      // Lite export — a plain, print-first one-page revenue summary (no dashboard
      // chrome) built from the SAME aggregate that feeds the tiles, so its numbers
      // match the current view exactly and honor the active filters. Opens in a new
      // window; the user prints / saves as PDF (like the standalone Charged Revenue
      // Report). Mirrors the Charged / Collected / Outstanding / Refunds ladder.
      function exportLite() {
        const a = bannerAgg;
        if (!a) return;

        try {
