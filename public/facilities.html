<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facilities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="/report-settings.css">
  <style>
    .aqrs-gear { display: inline-flex; }
    .aq-scopebar {
      display: flex; align-items: center; gap: 10px;
      margin: 0 0 14px; padding: 9px 13px;
      background: #f4f7f9; border: 1px solid #e2e8ec; border-radius: 6px;
      font-size: 12.5px; color: #5b6b78; line-height: 1.45;
    }
    .aq-scopebar > span { min-width: 0; }
    .toolbar .btn-settings {
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
      color: #e5e7eb; border-radius: 6px; cursor: pointer;
      font-size: 12px; line-height: 1.3; padding: 5px 9px; white-space: nowrap;
    }
    .toolbar .btn-settings:hover { background: rgba(255,255,255,.18); }
    .btn-settings.is-off { opacity: .4; cursor: not-allowed; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 12px; color: #1a1a1a; background: #f5f4f1; line-height: 1.35; }

    /* ── Toolbar (matches Programs / Court Utilization) ── */
    .toolbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 10px; padding: 8px 20px; background: #2c2c2c; color: #eee; font-size: 13px; flex-wrap: wrap; }
    .toolbar-title { font-weight: 600; margin-right: 4px; }
    .toolbar-back { color: #9ca3af; text-decoration: none; font-size: 12px; }
    .toolbar-back:hover { color: #fff; }
    .toolbar-spacer { flex: 1; }
    .toolbar label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; display: flex; flex-direction: column; gap: 2px; }
    .toolbar input[type="date"] { padding: 4px 8px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; background: rgba(255,255,255,.1); color: #fff; font-size: 12px; font-family: inherit; outline: none; }
    .toolbar input[type="date"]:focus { border-color: #3b82f6; }
    .toolbar input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    .toolbar button { padding: 6px 14px; border: 1px solid rgba(255,255,255,.25); border-radius: 4px; background: rgba(255,255,255,.08); color: #fff; font-size: 12px; font-family: inherit; cursor: pointer; transition: background .15s; white-space: nowrap; }
    .toolbar button:hover { background: rgba(255,255,255,.18); }
    .toolbar .btn-run { background: #16a34a; border-color: #16a34a; font-weight: 600; }
    .toolbar .btn-run:hover { background: #15803d; }
    .toolbar .btn-pdf { background: #3b82f6; border-color: #3b82f6; font-weight: 600; }
    .toolbar .btn-pdf:hover { background: #2563eb; }
    .toolbar .btn-excel { background: #16803c; border-color: #16803c; font-weight: 600; }
    .toolbar .btn-excel:hover { background: #15692f; }
    .toolbar .btn-pdf:disabled, .toolbar .btn-excel:disabled, .toolbar .btn-lite:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-lite { background: #0d9488; border-color: #0d9488; font-weight: 600; }
    .toolbar .btn-lite:hover { background: #0f766e; }

    /* Print button + Puppeteer PDF capture (_print=1): hide the chrome, keep the report */
    @media print {
      .rec-banner, .toolbar, .fb-overlay, .leaflet-control-container { display: none !important; }
      body { background: #fff; }
      .page { padding: 0; }
      .sum-card, .fac-banner, .court-native .heatmap-grid { break-inside: avoid; }
    }
    body.print-mode .rec-banner, body.print-mode .fb-overlay { display: none !important; }
    body.print-mode { background: #fff; }
    body.print-mode .page { padding: 0; }
    .toolbar .row-count { font-size: 11px; color: #aaa; }
    .toolbar .divider { width: 1px; height: 28px; background: rgba(255,255,255,.15); margin: 0 2px; }
    .toolbar .chk { flex-direction: row; align-items: center; gap: 6px; color: #ddd; text-transform: none; letter-spacing: 0; font-size: 12px; cursor: pointer; }

    /* ── Page ── */
    .page { max-width: 1400px; margin: 16px auto; padding: 24px 28px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

    /* ── Header ── */
    .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:18px; gap:16px; }
    .report-header-left { display:flex; align-items:center; gap:14px; }
    .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
    .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
    .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
    .report-header-right { text-align:right; }
    .report-header .rh-meta { font-size:11px; color:#666; }

    /* Facilities hero banner (self-contained SVG scene, no external image) */
    .fac-banner { position: relative; width: 100%; height: 172px; border-radius: 12px; overflow: hidden; margin: 0 0 16px; border: 1px solid #a7f3d0; box-shadow: 0 3px 14px rgba(6,95,70,.15); }
    .fac-banner .fcb-scene { position: absolute; inset: 0; }
    .fac-banner .fcb-scene svg { width: 100%; height: 100%; display: block; }
    .fac-banner .fcb-overlay { position: absolute; inset: 0; padding: 20px 26px; display: flex; flex-direction: column; justify-content: center; z-index: 2; }
    .fac-banner .fcb-kicker { font-size: 10.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.92); text-shadow: 0 1px 3px rgba(0,0,0,.4); }
    .fac-banner .fcb-title { font-size: 30px; font-weight: 800; color: #fff; text-shadow: 0 2px 7px rgba(0,0,0,.42); line-height: 1.04; margin-top: 3px; }
    .fac-banner .fcb-sub { font-size: 12.5px; color: rgba(255,255,255,.95); text-shadow: 0 1px 4px rgba(0,0,0,.45); margin-top: 6px; max-width: 560px; }
    .fac-banner .fcb-pills { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .fac-banner .fcb-pill { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .fac-banner .fcb-pill b { font-weight: 800; }

    /* ── Themed animated banner scenes (per vertical) ── */
    .fac-banner .fcb-scene { z-index: 0; overflow: hidden; }
    .fac-banner.fbx-facilities { background: linear-gradient(120deg, #0c3b3a 0%, #0f4b40 46%, #146b46 100%); }
    .fac-banner.fbx-racket     { background: linear-gradient(115deg, #0c4a2b 0%, #12703e 60%, #1a844a 100%); }
    .fac-banner.fbx-camp       { background: linear-gradient(180deg, #221a4d 0%, #3b2a63 55%, #6b3f5e 100%); }
    .fac-banner.fbx-pool       { background: linear-gradient(160deg, #073b63 0%, #0e6fa8 55%, #17a0c4 100%); }
    .fac-banner.fbx-ice        { background: linear-gradient(165deg, #2a5b86 0%, #5b93bd 55%, #a9d3e8 100%); }
    .fac-banner.fbx-pavilion   { background: linear-gradient(170deg, #1e6f9e 0%, #56a8cd 48%, #8fd08a 100%); }
    .fac-banner .fcb-scene svg { position: static; }
    /* facilities: sun, clouds, hills, road */
    .fbx-sun { position: absolute; right: 15%; top: 18%; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #ffe6a8, #ffb84d 60%, #ff9e3d 100%); box-shadow: 0 0 42px 13px rgba(255,180,80,.55); }
    .fbx-cloud { position: absolute; height: 11px; border-radius: 999px; background: rgba(255,255,255,.16); filter: blur(1px); }
    .fbx-hill { position: absolute; bottom: 0; width: 140%; border-radius: 50% 50% 0 0 / 100% 100% 0 0; }
    .fbx-hill.h1 { height: 62%; left: -20%; background: rgba(10,60,50,.55); }
    .fbx-hill.h2 { height: 44%; left: -10%; background: rgba(12,74,54,.7); }
    .fbx-hill.h3 { height: 30%; left: 30%; width: 120%; background: rgba(16,96,64,.9); }
    .fbx-road { position: absolute; bottom: -4px; left: 46%; width: 3px; height: 42%; background: linear-gradient(#cfe8d8, rgba(207,232,216,.15)); transform-origin: bottom; transform: perspective(120px) rotateX(58deg); }
    .fbx-road::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(rgba(255,255,255,.9) 0 8px, transparent 8px 20px); opacity: .5; }
    /* racket: net + rallying ball */
    .fbx-court-net { position: absolute; left: 50%; top: 18%; bottom: 18%; width: 2px; background: repeating-linear-gradient(rgba(255,255,255,.5) 0 5px, transparent 5px 9px); }
    .fbx-ball-x { position: absolute; left: 8%; top: 50%; width: 20px; height: 20px; }
    .fbx-ball { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 32%, #f2ff7a, #cfe70e 65%, #a9c400); box-shadow: 0 3px 8px rgba(0,0,0,.35); position: relative; }
    .fbx-ball::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1px solid rgba(255,255,255,.7); border-left-color: transparent; border-right-color: transparent; }
    /* camp: stars, pines, tent, fire, bear */
    .fbx-stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .5; }
    .fbx-pine { position: absolute; bottom: 20%; width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent; border-bottom: 44px solid #16311f; }
    .fbx-ground-c { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: #16281a; }
    .fbx-tent { position: absolute; bottom: 20%; width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 26px solid #d8794a; }
    .fbx-tent::after { content: ""; position: absolute; left: -2px; top: 6px; width: 4px; height: 20px; background: #7a3d22; }
    .fbx-fire { position: absolute; bottom: 21%; width: 12px; height: 18px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 50% 70%, #ffe27a, #ff8a1e 60%, #e8451c); transform-origin: bottom; box-shadow: 0 0 18px 5px rgba(255,140,40,.5); }
    .fbx-bear { position: absolute; bottom: 22%; left: -60px; width: 54px; height: 34px; }
    .fbx-bear svg { transform: scaleX(-1); transform-origin: center; }  /* face the direction of travel (rightward) */
    /* pool: shimmer, lanes, swimmer */
    .fbx-lane { position: absolute; left: 0; right: 0; height: 2px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 12px, rgba(255,255,255,.08) 12px 24px); }
    .fbx-shimmer { position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 26px, rgba(255,255,255,.10) 26px 30px); }
    .fbx-swimmer { position: absolute; top: 46%; left: -70px; width: 66px; height: 26px; }
    .fbx-splash { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.7); }
    /* ice: floor, skater, trail, snow */
    .fbx-ice-floor { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(#ffffff22, #ffffff05); }
    .fbx-skater { position: absolute; bottom: 34%; left: -50px; width: 30px; height: 46px; }
    .fbx-trail { position: absolute; bottom: 34%; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.6)); }
    .fbx-snow i { position: absolute; top: -6px; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: .85; }
    /* pavilion: lawn, bunting, shelter, balloons, frisbee (Outdoor Event Spaces) */
    .fbx-lawn { position: absolute; left: 0; right: 0; bottom: 0; height: 27%; background: linear-gradient(#3f8f4a, #2c6f38); }
    .fbx-lawn::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: rgba(255,255,255,.18); }
    .fbx-bunting { position: absolute; left: 0; right: 0; top: 8%; height: 18px; }
    .fbx-bunting i { position: absolute; top: 0; width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 13px solid #fff; transform-origin: top center; }
    .fbx-bunting::before { content: ""; position: absolute; left: 2%; right: 2%; top: 0; height: 1px; background: rgba(255,255,255,.45); }
    .fbx-shelter { position: absolute; right: 14%; bottom: 22%; width: 132px; height: 76px; }
    .fbx-balloon { position: absolute; bottom: 24%; width: 15px; height: 19px; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%; box-shadow: inset -3px -3px 6px rgba(0,0,0,.18); }
    .fbx-balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 15px; background: rgba(255,255,255,.5); }
    .fbx-frisbee { position: absolute; left: -40px; top: 42%; width: 22px; height: 7px; border-radius: 50%; background: linear-gradient(#ffe066, #f59e0b); box-shadow: 0 2px 5px rgba(0,0,0,.3); }
    /* ballfield: turf, infield diamond, foul lines, outfield fence, flag (Fields) */
    .fac-banner.fbx-ballfield  { background: linear-gradient(175deg, #1c5f8a 0%, #4b93b8 40%, #4b8c3f 62%, #2f6b2c 100%); }
    .fbx-turf { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: linear-gradient(#4f9440, #2f6b2c); }
    .fbx-turf::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 26px, transparent 26px 52px); }
    /* Bottom-RIGHT, clear of the overlay: the title, subtitle and pill row all
       live on the left, and a diamond under the pills reads as a smudge. */
    .fbx-diamond { position: absolute; right: 11%; bottom: 3%; width: 112px; height: 62px; transform: perspective(200px) rotateX(54deg); }
    .fbx-diamond .dm-dirt { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 100%, #c98a5b 62%, rgba(201,138,91,0) 66%); }
    .fbx-diamond .dm-base { position: absolute; width: 8px; height: 8px; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,.35); }
    .fbx-foul { position: absolute; bottom: 3%; right: 17%; width: 2px; height: 30%; background: rgba(255,255,255,.32); transform-origin: bottom; }
    .fbx-fence { position: absolute; left: 8%; right: 8%; bottom: 40%; height: 8px; border-top: 2px solid rgba(255,255,255,.3);
                 background: repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 3px, transparent 3px 8px); }
    /* Left of the diamond and below the sun — at right:12% it was planted on it. */
    .fbx-flag { position: absolute; right: 34%; bottom: 42%; width: 2px; height: 24px; background: rgba(255,255,255,.55); }
    .fbx-flag::after { content: ""; position: absolute; left: 2px; top: 0; width: 13px; height: 9px; background: #e0554f; transform-origin: left center; }
    .fbx-ballarc { position: absolute; left: 72%; bottom: 20%; width: 9px; height: 9px; border-radius: 50%;
                   background: radial-gradient(circle at 35% 30%, #fff, #e8e4d8); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    /* play button + pong overlay */
    .fac-banner .fb-play { position: absolute; top: 12px; right: 14px; z-index: 5; width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.14); color: #fff; cursor: pointer; display: grid; place-items: center; font-size: 12px; padding-left: 2px; transition: background .15s, transform .15s; }
    .fac-banner .fb-play:hover { background: rgba(255,255,255,.28); transform: scale(1.08); }
    .fac-banner .fb-play:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .fac-banner .fb-pong { position: absolute; inset: 0; z-index: 6; display: none; background: #0b3d24; }
    .fac-banner .fb-pong.on { display: block; }
    .fac-banner .fb-pong canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .fac-banner .fb-pong-close { position: absolute; top: 10px; right: 12px; z-index: 7; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.25); color: #fff; cursor: pointer; font-size: 13px; line-height: 1; }
    .fac-banner .fb-pong-mute { position: absolute; top: 10px; right: 44px; z-index: 7; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.25); color: #fff; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
    .fac-banner .fb-pong-mute.off { opacity: .5; }
    .fac-banner .fb-pong-hud { position: absolute; top: 10px; left: 14px; z-index: 7; color: #eafff2; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-shadow: 0 1px 4px rgba(0,0,0,.5); }
    .fac-banner .fb-pong-tip { position: absolute; left: 0; right: 0; bottom: 10px; z-index: 7; text-align: center; color: rgba(255,255,255,.85); font-size: 11.5px; }
    @media (prefers-reduced-motion: no-preference) {
      .fbx-sun { animation: fbxSunPulse 4.5s ease-in-out infinite; }
      .fbx-cloud { animation: fbxDrift linear infinite; }
      .fbx-road::after { animation: fbxRoadRun 1.4s linear infinite; }
      .fbx-ball-x { animation: fbxRallyX 2.6s cubic-bezier(.45,0,.55,1) infinite alternate; }
      .fbx-ball { animation: fbxRallyY .65s cubic-bezier(.3,0,.7,1) infinite alternate, fbxSpin 1s linear infinite; }
      .fbx-stars i { animation: fbxTwinkle ease-in-out infinite; }
      .fbx-fire { animation: fbxFlicker .28s ease-in-out infinite alternate; }
      .fbx-bear { animation: fbxAmble 15s linear infinite; }
      .fbx-bear .body { animation: fbxWaddle .5s ease-in-out infinite alternate; transform-origin: center bottom; }
      .fbx-swimmer { animation: fbxSwim 6.5s linear infinite; }
      .fbx-swimmer .arm { animation: fbxStroke .9s linear infinite; transform-origin: 14px 13px; }
      .fbx-shimmer { animation: fbxShim 7s linear infinite; }
      .fbx-splash { animation: fbxSplashUp 6.5s linear infinite; }
      .fbx-skater { animation: fbxGlide 5.5s ease-in-out infinite; }
      .fbx-skater .body { animation: fbxLean 5.5s ease-in-out infinite; transform-origin: bottom; }
      .fbx-trail { animation: fbxTrailGrow 5.5s ease-in-out infinite; }
      .fbx-snow i { animation: fbxFall linear infinite; }
      .fbx-bunting i { animation: fbxFlagSway 2.4s ease-in-out infinite alternate; }
      .fbx-balloon { animation: fbxBalloonUp linear infinite; }
      .fbx-frisbee { animation: fbxFrisbee 6s linear infinite; }
      .fbx-flag::after { animation: fbxFlagWave 1.8s ease-in-out infinite alternate; }
      .fbx-ballarc { animation: fbxPopFly 4.2s ease-in-out infinite; }
    }
    @keyframes fbxSunPulse { 50% { box-shadow: 0 0 58px 21px rgba(255,180,80,.7); } }
    @keyframes fbxDrift { from { transform: translateX(-120px); } to { transform: translateX(1300px); } }
    @keyframes fbxRoadRun { to { background-position: 0 -28px; } }
    @keyframes fbxRallyX { from { left: 8%; } to { left: calc(92% - 20px); } }
    @keyframes fbxRallyY { from { transform: translateY(-24px); } to { transform: translateY(24px); } }
    @keyframes fbxSpin { to { transform: rotate(360deg); } }
    @keyframes fbxTwinkle { 50% { opacity: 1; } }
    @keyframes fbxFlicker { from { transform: scaleY(1) scaleX(1) rotate(-2deg); opacity: .92; } to { transform: scaleY(1.25) scaleX(.9) rotate(2deg); opacity: 1; } }
    @keyframes fbxAmble { to { transform: translateX(1320px); } }
    @keyframes fbxWaddle { to { transform: translateY(-3px) rotate(1.5deg); } }
    @keyframes fbxSwim { to { transform: translateX(1360px); } }
    @keyframes fbxStroke { to { transform: rotate(360deg); } }
    @keyframes fbxShim { to { transform: translateX(-30px); } }
    @keyframes fbxSplashUp { 0%,100% { transform: translate(0,0); opacity: 0; } 50% { opacity: .8; } }
    @keyframes fbxGlide { 0% { left: -50px; } 100% { left: 100%; } }
    @keyframes fbxLean { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes fbxTrailGrow { 0% { left: 0; width: 0; opacity: 0; } 30% { opacity: .6; } 100% { left: 100%; width: 90px; opacity: 0; } }
    @keyframes fbxFall { to { transform: translateY(150px); } }
    @keyframes fbxFlagSway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    @keyframes fbxBalloonUp { 0% { transform: translateY(30px); opacity: 0; } 12% { opacity: .95; } 88% { opacity: .95; } 100% { transform: translateY(-150px); opacity: 0; } }
    @keyframes fbxFrisbee { 0% { left: -40px; transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-16px) rotate(540deg); } 100% { left: 100%; transform: translateY(4px) rotate(1080deg); } }
    @keyframes fbxFlagWave { from { transform: skewY(0deg) scaleX(1); } to { transform: skewY(-7deg) scaleX(.86); } }
    /* A pop fly: up and out to the outfield, then gone. */
    @keyframes fbxPopFly { 0% { left: 72%; bottom: 20%; opacity: 0; } 10% { opacity: 1; }
                           50% { left: 84%; bottom: 58%; } 90% { opacity: .9; }
                           100% { left: 96%; bottom: 34%; opacity: 0; } }
    @media print { .fac-banner .fb-play, .fac-banner .fb-pong { display: none !important; } .fbx-sun, .fbx-cloud, .fbx-ball, .fbx-ball-x, .fbx-bear, .fbx-swimmer, .fbx-skater, .fbx-snow i, .fbx-stars i, .fbx-fire, .fbx-shimmer, .fbx-trail, .fbx-road::after, .fbx-bunting i, .fbx-balloon, .fbx-frisbee, .fbx-flag::after, .fbx-ballarc { animation: none !important; } }
    body.print-mode .fac-banner .fb-play, body.print-mode .fac-banner .fb-pong { display: none !important; }
    .fac-banner .fb-badge { position: absolute; top: 14px; right: 16px; z-index: 2; font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: #065f46; background: #d1fae5; border: 1px solid #6ee7b7; padding: 3px 9px; border-radius: 6px; }

    /* ── Tabs (matches Programs) ── */

    .band { background: linear-gradient(135deg,#ecfdf5 0%,#f0fdf4 100%); border: 1px solid #bbf7d0; border-radius: 10px; padding: 16px 18px; margin: 16px 0; }

    .sum-bar-wrap { margin: 16px 0; }

    .sum-badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 9px; font-weight: 700; letter-spacing: .3px; background:#e0f2fe; color:#075985; }

    /* ── Empty / loading / error states ── */

    /* Per-vertical monthly trend */

    .vtrend-row { display: grid; grid-template-columns: 66px 1fr 96px 92px; align-items: center; gap: 10px; font-size: 12px; }
    .vtrend-mo { color: #6b7280; font-weight: 600; font-variant-numeric: tabular-nums; }

    @keyframes facspin { to { transform: rotate(360deg); } }
    .fac-spin { width:34px; height:34px; border:3px solid #e8e6e0; border-top-color:#0d9488; border-radius:50%; margin:14px auto; animation:facspin .8s linear infinite; }

    /* ── Filters ── */

    /* Wrap long court names ("Marquardt-Miles Outdoor Pickleball Courts — Court 07")
       instead of truncating — the distinguishing tail (the court number) was the
       part getting cut off, leaving every row looking identical. */
    .court-native .cu-bar-name { overflow-wrap: anywhere; word-break: break-word; line-height: 1.25; color: #374151; }
    .court-native .cu-bar-track { position: relative; background: #f1efe9; border-radius: 4px; height: 18px; overflow: hidden; display: flex; }

    .court-native .cu-bar-val { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: #111827; }

    .court-native .cu-legend { display: flex; gap: 14px; justify-content: center; margin: 6px 0 2px; font-size: 11px; color: #666; flex-wrap: wrap; }

    .court-native .cu-map-legend { display: flex; gap: 16px; align-items: center; padding: 10px 0; font-size: 11px; color: #666; flex-wrap: wrap; }
    .court-native .cu-map-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: -1px; }
    .court-native .cu-popup-title { font-weight: 700; font-size: 13px; color: #1e1b4b; margin-bottom: 8px; }
    .court-native .cu-popup-bar-wrap { margin: 4px 0; }
    .court-native .cu-popup-bar-label { font-size: 11px; color: #374151; margin-bottom: 2px; display: flex; justify-content: space-between; }
    .court-native .cu-popup-bar-track { height: 8px; background: #f3f4f6; border-radius: 4px; overflow: hidden; }
    .court-native .cu-popup-bar-fill { height: 100%; border-radius: 4px; }
    .court-native .cu-popup-stats { font-size: 10px; color: #9ca3af; margin-top: 6px; }
    /* Day-of-week heatmap */
    .court-native .heatmap-section { margin-top: 22px; }
    .court-native .heatmap-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .court-native .heatmap-title .subtitle { font-weight: 400; color: #888; font-size: 11px; }
    .court-native .heatmap-grid { display: grid; grid-template-columns: minmax(180px, 1fr) repeat(7, 1fr); gap: 2px; font-size: 11px; }
    .court-native .heatmap-hdr { text-align: center; font-weight: 700; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #888; padding: 4px 2px; }
    .court-native .heatmap-label { padding: 5px 8px; font-size: 11px; white-space: normal; overflow-wrap: anywhere; line-height: 1.25; display: flex; align-items: center; gap: 4px; border-radius: 3px; background: #f8f8f6; }
    .court-native .heatmap-cell { display: flex; align-items: center; justify-content: center; text-align: center; padding: 5px 2px; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; }
    .court-native .cu-slice { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 10px 0 2px; }
    .court-native .cu-slice-lbl { font-size: 11px; color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .court-native .cu-day { padding: 4px 9px; font-size: 12px; border: 1px solid #d1d5db; background: #fff; color: #374151;
      border-radius: 999px; cursor: pointer; font-family: inherit; }

    .court-native .cu-slice-sep { width: 1px; height: 18px; background: #e2e5ea; margin: 0 2px; }

    .court-native .hx-hour { font-size: 10px; color: #7c8798; text-align: right; padding: 4px 10px 4px 0; font-family: 'IBM Plex Mono', monospace; align-self: center; }
    .court-native .hx-note { font-size: 10px; color: #94a3b8; margin-top: 7px; }
    .court-native .heatmap-legend { display: flex; align-items: center; gap: 12px; margin-top: 8px; font-size: 10px; color: #888; flex-wrap: wrap; }
    .court-native .heatmap-legend-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; margin-right: 3px; }
    /* Loading / error */
    .court-native .cu-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #9ca3af; padding: 60px 16px; font-size: 13px; }

    /* AI insights — shared by the Court Utilization and Camping tabs */
    .insights-section { margin: 14px 0 18px; }
    .insights-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .insights-btn { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: 0 2px 12px rgba(99,102,241,.3); }
    .insights-btn:hover:not(:disabled) { background: linear-gradient(135deg, #4f46e5, #7c3aed); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,.4); filter: none; }
    .insights-btn:disabled { opacity: .6; cursor: default; }
    /* Rec Insights button — animated sparkle treatment (shared across reports) */
    .insights-btn { position: relative; overflow: visible; box-shadow: 0 2px 12px rgba(99,102,241,.3); }
    .insights-btn .sparkle { position: absolute; pointer-events: none; font-size: 10px; opacity: 0; animation: sparkle-float 2.5s ease-in-out infinite; }
    .insights-btn .sparkle:nth-child(1) { top: -8px; left: 8%; animation-delay: 0s; }
    .insights-btn .sparkle:nth-child(2) { top: -6px; right: 12%; animation-delay: 0.7s; font-size: 8px; }
    .insights-btn .sparkle:nth-child(3) { bottom: -7px; left: 25%; animation-delay: 1.4s; font-size: 7px; }
    .insights-btn .sparkle:nth-child(4) { top: -5px; left: 50%; animation-delay: 0.3s; font-size: 6px; }
    .insights-btn .sparkle:nth-child(5) { bottom: -6px; right: 20%; animation-delay: 1.1s; font-size: 9px; }
    .insights-btn .sparkle:nth-child(6) { top: -9px; right: 3%; animation-delay: 1.9s; font-size: 7px; }
    @keyframes sparkle-float {
      0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
      15% { opacity: 1; transform: translateY(-3px) scale(1.1); }
      30% { opacity: 0.7; transform: translateY(-7px) scale(0.9); }
      50% { opacity: 0.3; transform: translateY(-11px) scale(0.6); }
      70% { opacity: 0; transform: translateY(-15px) scale(0.3); }
    }
    @media (prefers-reduced-motion: reduce) { .insights-btn .sparkle { animation: none; opacity: 0; } .insights-btn:hover:not(:disabled) { transform: none; } }
    .insights-sub { font-size: 11.5px; color: #9ca3af; }
    .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="text/babel">
    const CFG = window.ORG_CONFIG || {};
    const e = React.createElement;

    // Six drifting sparkles for the Rec Insights button (same treatment everywhere).
    const sparkles = () => ['✦', '✧', '✦', '✧', '✦', '✧']
      .map((ch, i) => e('span', { key: 'sp' + i, className: 'sparkle' }, ch));

    const TABS = [
      { key: 'summary',     label: 'Summary' },
      { key: 'utilization', label: 'Court Utilization' },
      { key: 'camping',     label: 'Camping',        icon: '🏕️' },
      { key: 'outdoor',     label: 'Outdoor Events', icon: '🎪' },
      { key: 'fields',      label: 'Fields',         icon: '⚾' },
      { key: 'golf',        label: 'Golf',           icon: '⛳' },
      { key: 'aquatics',    label: 'Pool / Aquatics', icon: '🏊' },
      { key: 'ice',         label: 'Ice',            icon: '⛸️' },
      { key: 'racket',      label: 'Racket Sports',   icon: '🎾' },
    ];

    // Rec's real site types (court.type), grouped into the display verticals.
    // These are the filter options — they match what Rec has, per spec.
    const REC_SITE_TYPES = [
      { v: 'campsite',            l: 'Campsite',            grp: 'Camping' },
      { v: 'golf',                l: 'Golf',                grp: 'Golf' },
      { v: 'pool',                l: 'Pool',                grp: 'Pool / Aquatics' },
      { v: 'court',               l: 'Court',               grp: 'Courts & Fields' },
      { v: 'field',               l: 'Field',               grp: 'Courts & Fields' },
      { v: 'gym',                 l: 'Gym',                 grp: 'Courts & Fields' },
      { v: 'rink',                l: 'Rink',                grp: 'Courts & Fields' },
      { v: 'room',                l: 'Room',                grp: 'Pavilions & Spaces' },
      { v: 'outdoor-event-space', l: 'Outdoor Event Space', grp: 'Pavilions & Spaces' },
      { v: 'picnic-table',        l: 'Picnic Table',        grp: 'Pavilions & Spaces' },
      { v: 'bounce-house',        l: 'Bounce House',        grp: 'Pavilions & Spaces' },
      { v: 'other',               l: 'Other',               grp: 'Pavilions & Spaces' },
    ];
    const STATUSES = [
      { v: 'confirmed',   l: 'Confirmed' },
      { v: 'in-progress', l: 'In-progress' },
      { v: 'canceled',    l: 'Canceled' },
    ];
    const VERTICALS = ['Camping', 'Golf', 'Pool / Aquatics', 'Courts & Fields', 'Pavilions & Spaces'];
    const TYPE_VERTICAL = {};
    const TYPE_LABEL = {};
    REC_SITE_TYPES.forEach(t => { TYPE_VERTICAL[t.v] = t.grp; TYPE_LABEL[t.v] = t.l; });
    const verticalOf = raw => TYPE_VERTICAL[raw] || 'Pavilions & Spaces';
    // The specific Rec site type, title-cased ("court" → "Court"). The Top-sites
    // badge shows THIS, not the vertical grouping — otherwise filtering to "Court"
    // still labelled every row "Courts & Fields", which read like the filter had
    // been ignored.
    const siteTypeLabel = raw => TYPE_LABEL[raw] ||
      (raw ? String(raw).replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : '—');

    // ── Recover the *real* site type from the site name ──────────────────
    // Some orgs (Apex is the clear case) deliberately type their rinks, pools,
    // gyms, etc. ALL as `court`, because Rec only surfaces `court`-typed sites
    // in the consumer app's instant-book "Pools, Rinks & Courts" section —
    // anything typed otherwise routes to "Facility Rentals" instead. So
    // court.type genuinely can't tell an ice rink from a tennis court, and a
    // naive "court rentals" total sweeps in rinks + pools + gyms (for Apex,
    // ~$591K of "court" revenue is really only ~$88K of actual courts).
    //
    // We recover the true type from the SITE name only — never the location —
    // so a court that merely sits at, say, "Aquatic Park" isn't miscast as a
    // pool. Only rows Rec typed `court` are ever reconsidered; anything already
    // typed specifically (field, room, pool…) is left exactly as Rec has it.
    // A BARE "LANE" IS THE ONE CASE WHERE THE LOCATION HAS TO BE CONSULTED, and
    // it is a deliberate, narrow exception to the never-the-location rule above.
    // That rule exists so a TENNIS COURT sitting at "Aquatic Park" is not
    // miscast as a pool. A site literally named "Lane 3 - B" is not a tennis
    // court — the name is genuinely ambiguous and carries no sport at all, and
    // the location is the only thing that can resolve it.
    //
    // Measured platform-wide before this shipped: 487 sites match \blane\b.
    // 373 are already typed `pool`; 305 are already recovered by the name rule
    // below. That leaves 74 court-typed lanes the name rule misses, and 68 of
    // them sit at a location named pool/aquatic/swim/plunge. The other 6 are
    // exactly why both guards exist:
    //
    //   * 3 are El Segundo sites parked in "ZZ Archived Sites [do not use]"
    //   * 3 are Douglas County's "Johnson Lane Tennis/Pickleball Court #1/#2"
    //     and "Johnson Lane 2-Half Court Basketball Court" — "Lane" as a ROAD
    //     name, at Johnson Lane Park. This is the /ball ?field/ -> "Football
    //     Field" bug waiting to happen, and it is rejected twice over: the
    //     names carry a competing court word, AND the location is not aquatic.
    //
    // Blast radius, measured: El Segundo +66 sites and Northern Door +2. Every
    // other org's aquatics figures are byte-identical, because their lanes are
    // either already typed `pool` or already caught by the name.
    //
    // Why this is not per-org config: it is a data-shape problem, not a policy
    // one. A slug allowlist would need remembering for the next org that types
    // its lanes `court` so they instant-book, and would silently do nothing
    // until someone did.
    // THE LANE GUESS IS GONE (2026-09-01, Dan): "pools can be courts, but courts
    // can never be pools." A court-typed swim lane used to be reclassified here
    // by name + an aquatic location — a guess that had to be right about every
    // org on the platform from one regex, and that quietly encoded a product
    // capability gap (a site must be typed `court` to be instant-bookable, so an
    // org wanting a self-bookable lane has to lie about the type).
    //
    // It is CONFIGURATION now: the Aquatics tab defaults to `pool` and an org
    // that types its lanes `court` says so in its report settings. El Segundo is
    // configured that way in the same change, so nobody loses a number. The
    // name branches below stay — a site an org literally called "Pool 1" is not
    // a guess about a location, it is the org's own word.
    function refineSiteType(rawType, facility, location) {
      if (rawType !== 'court') return rawType;
      const n = String(facility == null ? '' : facility).toLowerCase();
      if (/\b(ice|rink)\b/.test(n)) return 'rink';
      if (/\b(pool|aquatics?|natatorium|swim)\b/.test(n)) return 'pool';
      // "Gymnasium" is a gym; but several orgs name basketball/volleyball courts
      // inside a gym "Gym Court 1" — those the org explicitly called courts, so
      // leave them as courts. Only reclassify a gym site that isn't named a court.
      if (/\bgym(nasium)?\b/.test(n) && !/\bcourt\b/.test(n)) return 'gym';
      return 'court';
    }
    // Rewrite each row's Site Type to the recovered value once, at ingestion,
    // so every downstream reader (filter, verticals, badges, racket match,
    // exports) sees the corrected type. Idempotent — re-running only ever
    // reclassifies rows still typed `court`. Refined rows keep the exact same
    // column set as the originals, so the Excel export is unaffected.
    function refineRows(rows) {
      return (rows || []).map(r => {
        const refined = refineSiteType(r['Site Type'], r['Facility'], r['Location']);
        if (refined === r['Site Type']) return r;
        return Object.assign({}, r, { 'Site Type': refined });
      });
    }
    // ── Per-org aquatics scope (report settings) ────────────────────────────
    // Injected by the /:org/facilities route, never fetched: these decide which
    // site types the tab counts AT ALL, so a page that fetched them would draw
    // the pools-only version and then jump.
    const RS_SETTINGS = (window.ORG_CONFIG || {}).settings || {};
    const AQ_EXTRA = Array.isArray(RS_SETTINGS.aquaticsExtraTypes) ? RS_SETTINGS.aquaticsExtraTypes : [];
    // EMPTY MEANS EVERY LOCATION, the same rule as every other multi-select in
    // this repo. It is the safe direction: an org that renames a location gets
    // its whole tab back rather than an empty one.
    const AQ_SCOPE = Array.isArray(RS_SETTINGS.aquaticsScope) ? RS_SETTINGS.aquaticsScope : [];

    // The Outdoor Events tab's scope. All three are real court.type values with a
    // CHECK constraint behind them, so no name-matching recovery is needed the
    // way courts need refineSiteType().
    const OUTDOOR_TYPES = ['outdoor-event-space', 'picnic-table', 'bounce-house'];
    const OE_DOW   = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const OE_DOW1  = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    const OE_RAMP  = ['#faf8f2', '#fef3c7', '#fde68a', '#fcd34d', '#f59e0b', '#d97706'];
    const OE_MULTI = '#a5b4fc';   // booked, but with no per-day hours to shade by
    const oePlural = (n, w) => n.toLocaleString() + ' ' + w + (n === 1 ? '' : 's');
    // Short labels for the narrow bar chart. siteTypeLabel()'s full names
    // ("Outdoor Event Space") ellipsize in a 100px label column, and a truncated
    // label is a label you have to hover to read.
    const OE_TYPE_SHORT = {
      'outdoor-event-space': 'Event space',
      'picnic-table': 'Picnic area',
      'bounce-house': 'Bounce house',
    };
    const dowOfStr = v => {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v == null ? '' : v));
      return m ? new Date(+m[1], +m[2] - 1, +m[3]).getDay() : null;
    };
    // ── Outdoor-events hour math, at module scope on purpose ─────────────
    // These are the load-bearing derivations of the Outdoor Events tab, and they
    // are pure, so they live out here where `scripts/outdoor-hours.spec.js` can
    // lift and pin them. Inside the component they would only be reachable by
    // rendering the whole tab.
    const OE_CLOCK = /^(\d{1,2}):(\d{2})\s*(am|pm)$/i;
    // "01:00pm" → 780. The card emits to_char(…, 'HH12:MIam').
    const oeClockMin = v => {
      const m = OE_CLOCK.exec(String(v == null ? '' : v).trim());
      if (!m) return null;
      const h = parseInt(m[1], 10) % 12;
      return (h + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + parseInt(m[2], 10);
    };
    const oeDayNum    = r => Number(r['Multi-Day Day#']) || 0;
    const oeTotDays   = r => Number(r['Multi-Day Days']) || 0;
    const oeIsArrival = r => oeDayNum(r) <= 1;
    const oeIsMulti   = r => oeTotDays(r) > 1;
    // Hours on one row, or null when they cannot be known. Card 17294 prints
    // Begin on a booking's FIRST day and End on its LAST, so a same-day booking
    // carries both and a multi-day one carries neither on any single day. Those
    // return null and are kept out of every hour figure rather than divided into
    // a guess — 99% of these bookings are same-day platform-wide, so the hour
    // figures cover nearly all of them, and the exclusion is stated on screen.
    const oeRowHours = r => {
      if (oeIsMulti(r)) return null;
      const a = oeClockMin(r['Begin']), b = oeClockMin(r['End']);
      if (a == null || b == null) return null;
      let d = b - a;
      if (d <= 0) d += 1440;                    // an evening block ending after midnight
      return Math.min(d, 1440) / 60;
    };
    const oeFmtHrs = h => (h >= 9.95 ? Math.round(h) : (Math.round(h * 10) / 10)) + 'h';
    const oeHour12 = h => { const x = ((h % 24) + 24) % 24; return ((x % 12) || 12) + (x < 12 ? 'a' : 'p'); };
    // Day-part grid — bookings COVERING each hour, by weekday. A booking counts
    // in every hour it covers, so an 11am–4pm shelter rental reads as five hours
    // of demand rather than one 11am tick: which part of the day is spoken for is
    // the question, not when the paperwork starts. Pass arrival rows.
    function oeHeatGrid(rows) {
      const heat = [];
      for (let i = 0; i < 7; i++) heat.push(new Array(24).fill(0));
      let timed = 0;
      (rows || []).forEach(r => {
        const h = oeRowHours(r); if (h == null) return;
        const dw = dowOfStr(r['Date']); if (dw == null) return;
        const a = oeClockMin(r['Begin']); if (a == null) return;
        timed++;
        const startH = Math.floor(a / 60), span = Math.max(1, Math.min(24, Math.ceil(h)));
        for (let k = 0; k < span; k++) heat[dw][(startH + k) % 24]++;
      });
      const hourTotals = new Array(24).fill(0);
      for (let i = 0; i < 7; i++) for (let hh = 0; hh < 24; hh++) hourTotals[hh] += heat[i][hh];
      let peak = -1, peakBookings = 0;
      hourTotals.forEach((v, i) => { if (v > peakBookings) { peakBookings = v; peak = i; } });
      let h0 = 24, h1 = -1;
      hourTotals.forEach((v, i) => { if (v > 0) { if (i < h0) h0 = i; if (i > h1) h1 = i; } });
      if (h1 < h0) { h0 = 8; h1 = 20; }         // nothing timed — show a plausible day
      const hours = [];
      for (let hh = h0; hh <= h1; hh++) hours.push(hh);
      let max = 1;
      for (let i = 0; i < 7; i++) for (let k = 0; k < hours.length; k++) max = Math.max(max, heat[i][hours[k]]);
      return { heat, hourTotals, hours, max, timed, peak, peakBookings };
    }
    // Calendar cell shade. A day with hours shades by them (capped at 12, which
    // is already a whole-day rental); a day booked with UNKNOWN hours gets its
    // own colour rather than the lightest amber, because "booked all day" and
    // "barely booked" must not look the same.
    const oeShade = c => !c || !c.n ? OE_RAMP[0]
      : !c.hours ? OE_MULTI
      : OE_RAMP[Math.min(5, 1 + Math.floor(Math.min(c.hours, 12) / 12 * 4.999))];
    const HIGH_CANCEL = 20; // % → flag site as at-risk

    // Per-vertical sub-tab config — each is a scoped view of the SAME facility
    // data the Summary already fetched (site types → vertical). No new SQL.
    const VERT_CONFIG = {
      camping:  { label: 'Camping',          icon: '🏕️', types: ['campsite'] },
      // Outdoor event spaces — Rec's three real types for rentable outdoor
      // gathering space. `field` is deliberately OUT: fields are a big enough
      // segment (and a different question — leagues, not parties) to deserve
      // their own tab, and folding them in here would swamp every average.
      outdoor:  { label: 'Outdoor Event Spaces', icon: '🎪', types: OUTDOOR_TYPES },
      // Ball fields, pitches and multipurpose turf. Kept out of Outdoor Event
      // Spaces on purpose (Dan): leagues and tournaments, not parties.
      fields:   { label: 'Fields',           icon: '⚾',  types: ['field'] },
      golf:     { label: 'Golf',             icon: '⛳',  types: ['golf'] },
      // Pools ALWAYS, plus whatever this org has configured. Empty by default,
      // so an org that has not been configured sees exactly what it saw before
      // any of this existed. See AQ_EXTRA / AQ_SCOPE above.
      aquatics: { label: 'Pool / Aquatics',  icon: '🏊',
                  types: ['pool'].concat(AQ_EXTRA), scope: AQ_SCOPE },
      // Ice — mostly orgs type these 'rink', but some (Apex) type them 'court';
      // refineSiteType() recovers those from the site name, so this vertical
      // catches both the correctly-typed rinks and the reclassified outliers.
      ice:      { label: 'Ice',              icon: '⛸️', types: ['rink'] },
    };
    // ONE PREDICATE, read by every surface that scopes to a vertical: the tab's
    // view, its hours panel, the tab badge and the Excel export. Four copies is
    // exactly how the facility Summary shipped chips that scoped some panels and
    // not others and the page disagreed with itself for a week.
    //
    // The scope Set is built ONCE per vertical rather than per row — this runs
    // over every row of the feed on every render.
    Object.keys(VERT_CONFIG).forEach(k => {
      const v = VERT_CONFIG[k];
      v.key = k;                                // so a view handed `vert` can name itself
      v._types = new Set(v.types);
      v._scope = (v.scope && v.scope.length) ? new Set(v.scope) : null;
    });
    // A configured scope matches on the LOCATION or the site NAME, because Dan
    // asked to be able to name either and the feed carries both. A site name is
    // `Facility` — card 17294's column for court.court_number.
    function vertRowMatch(r, key) {
      const v = VERT_CONFIG[key];
      if (!v || !v._types.has(r['Site Type'])) return false;
      if (!v._scope) return true;               // empty means every one
      return v._scope.has(r['Location']) || v._scope.has(r['Facility']);
    }

    // What the tab is scoped to, in words. A configured scope that is not stated
    // on screen is how a number stops being trusted: an admin looking at a
    // narrowed tab must be able to see that it is narrowed, and to what.
    function vertScopeNote(key) {
      const v = VERT_CONFIG[key];
      if (!v) return '';
      let note = 'scoped to ' + v.types.join(', ') + ' site types';
      if (v._scope) note += ' at ' + v.scope.length + ' configured '
                          + (v.scope.length === 1 ? 'location/site' : 'locations/sites')
                          + ' (' + v.scope.slice(0, 3).join(', ')
                          + (v.scope.length > 3 ? ', +' + (v.scope.length - 3) + ' more' : '') + ')';
      return note + '.';
    }

    const monthLabel = ym => {
      const p = String(ym).split('-');
      if (p.length < 2) return ym;
      return new Date(Number(p[0]), Number(p[1]) - 1, 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    };

    const money = n => '$' + Math.round(n || 0).toLocaleString();
    const pct = (n, d) => d ? Math.round((n / d) * 100) + '%' : '—';
    const lc = v => String(v == null ? '' : v).toLowerCase();

    // Per-status filter chips (all on by default — every status counts)
    function StatusChips({ sel, setSel }) {
      const toggle = v => setSel(sel.includes(v) ? sel.filter(x => x !== v) : sel.concat(v));
      return e('div', { className: 'filter-group' },
        e('span', { className: 'filter-lbl' }, 'Status'),
        STATUSES.map(s => e('span', {
          key: s.v,
          className: 'chip' + (sel.includes(s.v) ? ' on' + (s.v === 'canceled' ? ' cancel' : '') : ''),
          onClick: () => toggle(s.v),
        }, s.l)),
      );
    }

    // Sentinel for an explicit "none selected" state. [] already means "all", so
    // an empty array can't also mean "none" — this distinct value lets the filter
    // render every box unchecked and show zero rows until the user picks a few.
    const NONE_SEL = '\x00none';

    // Site-type filter — Rec's real types, grouped by vertical. [] = All, [NONE_SEL] = None.
    function SiteTypeFilter({ sel, setSel }) {
      const [open, setOpen] = React.useState(false);
      const allV = REC_SITE_TYPES.map(t => t.v);
      const isNone = sel.length === 1 && sel[0] === NONE_SEL;
      const label = isNone ? 'None selected'
        : (sel.length === 0 || sel.length === allV.length) ? 'All site types' : (sel.length + ' selected');
      const toggle = v => {
        const base = isNone ? [] : (sel.length === 0 ? allV : sel);
        const next = base.includes(v) ? base.filter(x => x !== v) : base.concat(v);
        setSel(next.length === 0 ? [NONE_SEL] : (next.length === allV.length ? [] : next));
      };
      const groups = [];
      REC_SITE_TYPES.forEach(t => { if (!groups.includes(t.grp)) groups.push(t.grp); });
      return e('div', { className: 'dd' },
        e('button', { className: 'dd-btn', onClick: () => setOpen(o => !o) }, '🏷️ ' + label, e('span', null, '▾')),
        open ? e('div', { className: 'dd-panel' },
          e('div', { className: 'dd-actions' },
            e('button', { onClick: () => setSel([]) }, 'Select all'),
            e('button', { onClick: () => setSel([NONE_SEL]) }, 'Unselect all'),
            e('button', { onClick: () => setOpen(false) }, 'Done')),
          groups.map(g => e('div', { key: g },
            e('div', { className: 'dd-grp' }, g),
            REC_SITE_TYPES.filter(t => t.grp === g).map(t =>
              e('label', { className: 'dd-opt', key: t.v },
                e('input', { type: 'checkbox', checked: !isNone && (sel.length === 0 || sel.includes(t.v)), onChange: () => toggle(t.v) }),
                t.l)),
          )),
        ) : null,
      );
    }

    // Location filter — [] = all. Options are the locations actually present in
    // the loaded rows, so a big org with tennis, pickleball, ice, and pool sites
    // at separate venues can scope the whole report to just theirs (Brad wants
    // the Marquardt-Miles pickleball courts; Tim wants the Apex Tennis Center).
    function LocationFilter({ locations, sel, setSel }) {
      const [open, setOpen] = React.useState(false);
      const all = locations || [];
      const isNone = sel.length === 1 && sel[0] === NONE_SEL;
      const label = isNone ? 'None selected'
        : (sel.length === 0 || sel.length === all.length) ? 'All locations'
        : (sel.length === 1 ? sel[0] : sel.length + ' locations');
      const toggle = v => {
        const base = isNone ? [] : (sel.length === 0 ? all.slice() : sel);
        const next = base.includes(v) ? base.filter(x => x !== v) : base.concat(v);
        setSel(next.length === 0 ? [NONE_SEL] : (next.length === all.length ? [] : next));
      };
      if (!all.length) return null;
      return e('div', { className: 'dd' },
        e('button', { className: 'dd-btn', onClick: () => setOpen(o => !o) }, '📍 ' + label, e('span', null, '▾')),
        open ? e('div', { className: 'dd-panel' },
          e('div', { className: 'dd-actions' },
            e('button', { onClick: () => setSel([]) }, 'Select all'),
            e('button', { onClick: () => setSel([NONE_SEL]) }, 'Unselect all'),
            e('button', { onClick: () => setOpen(false) }, 'Done')),
          all.map(loc => e('label', { className: 'dd-opt', key: loc },
            e('input', { type: 'checkbox', checked: !isNone && (sel.length === 0 || sel.includes(loc)), onChange: () => toggle(loc) }),
            loc)),
        ) : null,
      );
    }

    function fmtDate(d) { return d.toISOString().slice(0, 10); }
    // Local calendar date as YYYY-MM-DD. Not fmtDate(new Date()) — that goes
    // through UTC and rolls the day over in the evening for US timezones,
    // which would mis-split charges into "upcoming" on the last day of a range.
    function todayStr() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
    }
    function monthStart(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
    function monthEnd(d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }

    // ── Aggregate the card's rows into the Summary metrics, honoring filters ──
    function aggregate(rows, statusSel, typeSel) {
      const ts = new Set(typeSel);          // empty = all types
      const ss = new Set(statusSel);
      const scoped = rows.filter(r =>
        (ts.size === 0 || ts.has(r['Site Type'])) && ss.has(lc(r['Status']))
      );
      const isCanceled = r => lc(r['Status']) === 'canceled';
      const isInstant = r => lc(r['Booking Type']) === 'instant';
      const num = v => Number(v) || 0;
      const rev = r => isCanceled(r) ? 0 : num(r['Total']);
      // Billed vs collected — only present when the v2 card is live. On the
      // legacy card there's no Billed/Collected column, so both fall back to
      // Total (billed == collected, no outstanding) and the authoritative view
      // stays hidden behind hasBilled.
      const hasBilled = scoped.some(r => r['Billed'] != null) || rows.some(r => r['Billed'] != null);
      const billedOf = r => isCanceled(r) ? 0 : (r['Billed'] != null ? num(r['Billed']) : num(r['Total']));
      const collectedOf = r => r['Collected'] != null ? num(r['Collected']) : (isCanceled(r) ? 0 : num(r['Total']));
      const refundedOf = r => num(r['Refunded']);
      const isInvoice = r => r['Source'] === 'Invoice';

      // Invoice rows are MONEY, not bookings. The card unions invoice_v2 manual
      // lines (tournament fees, deposits, service fees) into the same feed, and
      // they are shaped like reservations without being any: "Reservation ID" is
      // an order_item id, "Facility" is the FEE'S NAME, "Status" is hard-coded
      // Confirmed, and "Site Type" is inherited from a representative court of
      // the rental — so the chips cannot exclude them either.
      // Counting them cost Douglas County 254 bookings instead of 198 and 46
      // sites instead of 41: 48 fee lines under 5 distinct fee names, each name
      // read as a campsite. Every count and every site set is therefore taken
      // from reservation rows only; every amount still comes from all of them,
      // so Charged keeps including the invoiced money v2 exists to surface.
      const resRows = scoped.filter(r => !isInvoice(r));
      // Prefer the card's site identifier; fall back to name+location for the
      // legacy card, which has no "Site ID" column. Never a bare name — two
      // locations can both have a "Site 01".
      const siteKey = r => r['Site ID'] != null && r['Site ID'] !== ''
        ? 'id:' + r['Site ID']
        : (r['Facility'] || '') + '|' + (r['Location'] || '');

      const a = {
        bookings: resRows.length,
        canceled: resRows.filter(isCanceled).length,
        confirmed: resRows.filter(r => lc(r['Status']) === 'confirmed').length,
        inprog: resRows.filter(r => lc(r['Status']) === 'in-progress').length,
        revenue: scoped.reduce((s, r) => s + rev(r), 0),
        instant: resRows.filter(isInstant).length,
        managed: resRows.filter(r => !isInstant(r)).length,
        instRev: scoped.filter(isInstant).reduce((s, r) => s + rev(r), 0),
        mgdRev: scoped.filter(r => !isInstant(r)).reduce((s, r) => s + rev(r), 0),
        sites: new Set(resRows.map(siteKey)).size,
        // Authoritative revenue: billed (charged), collected (confirmed
        // payments), refunded, and outstanding A/R = billed − collected.
        hasBilled,
        billed: scoped.reduce((s, r) => s + billedOf(r), 0),
        collected: scoped.reduce((s, r) => s + collectedOf(r), 0),
        refunded: scoped.reduce((s, r) => s + refundedOf(r), 0),
        instRefund: scoped.filter(isInstant).reduce((s, r) => s + refundedOf(r), 0),
        mgdRefund: scoped.filter(r => !isInstant(r)).reduce((s, r) => s + refundedOf(r), 0),
        invoicedN: scoped.filter(isInvoice).length,
        invoicedRev: scoped.filter(isInvoice).reduce((s, r) => s + billedOf(r), 0),
        byV: {},
        topSites: [],
      };
      a.outstanding = Math.max(0, a.billed - a.collected);
      // Charged-to-date vs upcoming. A range that runs past today bills sessions
      // that have not happened yet: that money is contracted, not overdue, and
      // it drags the collected % down for no real reason. Split it so the tiles
      // can say what is actually due. Ranges wholly in the past have upcoming
      // = 0 and the tiles fall back to their plain wording.
      const today = todayStr();
      const onOrBeforeToday = r => String(r['Date'] || '').slice(0, 10) <= today;
      a.chargedToDate = scoped.filter(onOrBeforeToday).reduce((s, r) => s + billedOf(r), 0);
      a.chargedUpcoming = Math.max(0, a.billed - a.chargedToDate);
      a.dueNow = Math.max(0, Math.min(a.outstanding, a.chargedToDate - a.collected));
      a.notYetDue = Math.max(0, a.outstanding - a.dueNow);

      VERTICALS.forEach(v => a.byV[v] = { bookings: 0, canceled: 0, revenue: 0, instant: 0, sites: new Set() });
      a.byType = {}; // keyed by specific site-type label ("Court", "Rink", "Pool"…) — the real breakdown
      const bySite = {};
      scoped.forEach(r => {
        const v = verticalOf(r['Site Type']);
        if (!a.byV[v]) a.byV[v] = { bookings: 0, canceled: 0, revenue: 0, instant: 0, sites: new Set() };
        const g = a.byV[v];
        g.revenue += rev(r);
        if (!isInvoice(r)) {
          g.bookings++;
          if (isCanceled(r)) g.canceled++;
          if (isInstant(r)) g.instant++;
          g.sites.add(siteKey(r));
        }

        // Specific-type rollup — this is what separates real courts from the
        // rinks/pools/gyms Rec lumps into `court` (see refineSiteType).
        const tl = siteTypeLabel(r['Site Type']);
        if (!a.byType[tl]) a.byType[tl] = { bookings: 0, canceled: 0, revenue: 0, collected: 0, instant: 0, sites: new Set() };
        const tg = a.byType[tl];
        tg.revenue += rev(r); tg.collected += collectedOf(r);
        if (!isInvoice(r)) {
          tg.bookings++;
          if (isCanceled(r)) tg.canceled++;
          if (isInstant(r)) tg.instant++;
          tg.sites.add(siteKey(r));
        }

        if (isInvoice(r)) return;
        const key = siteKey(r);
        if (!bySite[key]) bySite[key] = { facility: r['Facility'] || '—', location: r['Location'] || '', type: r['Site Type'] || '', bookings: 0, canceled: 0, revenue: 0 };
        bySite[key].bookings++; bySite[key].revenue += rev(r);
        if (isCanceled(r)) bySite[key].canceled++;
      });
      // Top type reported by the specific type, not the vertical — "Rink" is far
      // more useful to an Apex than "Courts & Fields".
      a.topType = Object.keys(a.byType).filter(t => a.byType[t].bookings).sort((x, y) => a.byType[y].revenue - a.byType[x].revenue)[0] || '—';
      a.topSites = Object.values(bySite).sort((x, y) => y.revenue - x.revenue).slice(0, 10);
      return a;
    }

    // Facilities hero banner — a little themed scene per vertical (sunset fields
    // for the hub, a bear at the campground, a swimmer in the pool, a skater on
    // the ice, a rally on the courts). Corny on purpose. All CSS + inline SVG,
    // frozen for reduced-motion. The Racket Sports header hides a game of Pong.
    function fbxStars() { let s = ''; for (let i = 0; i < 20; i++) s += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (Math.random() * 60).toFixed(1) + '%;animation-duration:' + (1.6 + Math.random() * 2.6).toFixed(2) + 's;animation-delay:-' + (Math.random() * 3).toFixed(2) + 's"></i>'; return s; }
    function fbxSnow() { let s = ''; for (let i = 0; i < 16; i++) s += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;animation-duration:' + (3 + Math.random() * 4).toFixed(2) + 's;animation-delay:-' + (Math.random() * 5).toFixed(2) + 's;opacity:' + (0.4 + Math.random() * 0.5).toFixed(2) + ';transform:scale(' + (0.6 + Math.random() * 1.1).toFixed(2) + ')"></i>'; return s; }

    // Bunting across the top of the shelter scene, and a few balloons rising off
    // the lawn. Random placement is fine here (decor, not data) — the same
    // treatment as fbxStars/fbxSnow above.
    function fbxBunting() { const c = ['#fca5a5', '#fcd34d', '#a7f3d0', '#bfdbfe', '#fbcfe8']; let s = ''; for (let i = 0; i < 18; i++) s += '<i style="left:' + (3 + i * 5.3).toFixed(1) + '%;border-top-color:' + c[i % c.length] + ';animation-delay:-' + (i * 0.13).toFixed(2) + 's"></i>'; return s; }
    function fbxBalloons() { const c = ['#f87171', '#fbbf24', '#60a5fa', '#f472b6', '#34d399']; let s = ''; for (let i = 0; i < 5; i++) s += '<div class="fbx-balloon" style="left:' + (6 + i * 7).toFixed(1) + '%;background:' + c[i % c.length] + ';animation-duration:' + (7 + i * 1.4).toFixed(1) + 's;animation-delay:-' + (i * 2.1).toFixed(1) + 's"></div>'; return s; }
    // A picnic shelter: gable roof on four posts, table underneath. Drawn once as
    // static SVG — everything that moves in this scene moves in CSS.
    const FBX_SHELTER_SVG = '<svg viewBox="0 0 132 76">'
      + '<path d="M4 30 L66 2 L128 30 Z" fill="#8b4a2f"/><path d="M66 2 L128 30 L120 30 L66 8 Z" fill="#6d3821"/>'
      + '<rect x="8" y="30" width="116" height="5" rx="2" fill="#a8603c"/>'
      + '<rect x="14" y="35" width="6" height="34" fill="#7c4a30"/><rect x="112" y="35" width="6" height="34" fill="#7c4a30"/>'
      + '<rect x="40" y="35" width="5" height="34" fill="#6b3f28"/><rect x="88" y="35" width="5" height="34" fill="#6b3f28"/>'
      + '<rect x="46" y="52" width="42" height="4" rx="1.5" fill="#c98a5b"/>'
      + '<rect x="52" y="56" width="4" height="13" fill="#a56f47"/><rect x="78" y="56" width="4" height="13" fill="#a56f47"/>'
      + '<rect x="44" y="60" width="16" height="3" rx="1" fill="#b87c50"/><rect x="74" y="60" width="16" height="3" rx="1" fill="#b87c50"/>'
      + '<rect x="0" y="69" width="132" height="7" fill="rgba(0,0,0,.16)"/></svg>';
    const FBX_SCENES = {
      facilities: '<div class="fbx-cloud" style="top:20%;left:10%;width:60px;animation-duration:34s"></div><div class="fbx-cloud" style="top:34%;left:0;width:40px;animation-duration:46s;animation-delay:-12s"></div><div class="fbx-sun"></div><div class="fbx-hill h1"></div><div class="fbx-hill h2"></div><div class="fbx-hill h3"></div><div class="fbx-road"></div>',
      racket: '<div class="fbx-court-net"></div><div class="fbx-ball-x"><div class="fbx-ball"></div></div>',
      camp: '<div class="fbx-stars">' + fbxStars() + '</div><div class="fbx-ground-c"></div><div class="fbx-pine" style="left:6%"></div><div class="fbx-pine" style="left:16%;transform:scale(.8)"></div><div class="fbx-pine" style="right:10%;transform:scale(1.1)"></div><div class="fbx-tent" style="right:26%"></div><div class="fbx-fire" style="right:20%"></div><div class="fbx-bear"><svg viewBox="0 0 54 34"><g class="body" fill="#3b2417"><rect x="21" y="25" width="6" height="9" rx="2.5" fill="#2b1a0f"/><rect x="41" y="25" width="6" height="9" rx="2.5" fill="#2b1a0f"/><ellipse cx="32" cy="19" rx="16" ry="10"/><circle cx="41" cy="12" r="7"/><rect x="15" y="25" width="6" height="9" rx="2.5"/><rect x="35" y="25" width="6" height="9" rx="2.5"/><circle cx="13" cy="16" r="8.5"/><circle cx="8" cy="8" r="2.8"/><circle cx="17" cy="8" r="2.8"/><circle cx="8" cy="8" r="1.2" fill="#6b4a2e"/><circle cx="17" cy="8" r="1.2" fill="#6b4a2e"/><ellipse cx="5.5" cy="18.5" rx="5" ry="3.6" fill="#7a5535"/><ellipse cx="2.6" cy="18" rx="1.8" ry="1.5" fill="#160d06"/><circle cx="12" cy="14" r="1.2" fill="#160d06"/></g></svg></div>',
      pool: '<div class="fbx-shimmer"></div><div class="fbx-lane" style="top:32%"></div><div class="fbx-lane" style="top:58%"></div><div class="fbx-lane" style="top:82%"></div><div class="fbx-splash" style="top:48%;left:0"></div><div class="fbx-swimmer"><svg viewBox="0 0 66 26"><g fill="#08324a"><ellipse cx="34" cy="16" rx="22" ry="6"/><circle cx="12" cy="13" r="6"/></g><line class="arm" x1="14" y1="13" x2="30" y2="4" stroke="#08324a" stroke-width="4" stroke-linecap="round"/></svg></div>',
      ballfield: '<div class="fbx-cloud" style="top:12%;left:10%;width:54px;animation-duration:42s"></div>'
        + '<div class="fbx-cloud" style="top:22%;left:0;width:36px;animation-duration:56s;animation-delay:-18s"></div>'
        + '<div class="fbx-sun" style="right:7%;top:4%"></div>'
        + '<div class="fbx-turf"></div><div class="fbx-fence"></div><div class="fbx-flag"></div>'
        + '<div class="fbx-foul" style="transform:rotate(38deg)"></div><div class="fbx-foul" style="transform:rotate(-38deg)"></div>'
        + '<div class="fbx-diamond"><div class="dm-dirt"></div>'
        +   '<div class="dm-base" style="left:50%;bottom:0;margin-left:-4px"></div>'
        +   '<div class="dm-base" style="right:0;bottom:50%;margin-bottom:-4px"></div>'
        +   '<div class="dm-base" style="left:50%;top:0;margin-left:-4px"></div>'
        +   '<div class="dm-base" style="left:0;bottom:50%;margin-bottom:-4px"></div></div>'
        + '<div class="fbx-ballarc"></div>',
      pavilion: '<div class="fbx-cloud" style="top:14%;left:8%;width:58px;animation-duration:40s"></div><div class="fbx-cloud" style="top:26%;left:0;width:38px;animation-duration:54s;animation-delay:-16s"></div><div class="fbx-sun" style="right:8%;top:12%"></div><div class="fbx-lawn"></div><div class="fbx-bunting">' + fbxBunting() + '</div><div class="fbx-shelter">' + FBX_SHELTER_SVG + '</div>' + fbxBalloons() + '<div class="fbx-frisbee"></div>',
      ice: '<div class="fbx-snow">' + fbxSnow() + '</div><div class="fbx-ice-floor"></div><div class="fbx-trail"></div><div class="fbx-skater"><svg viewBox="0 0 30 46"><g class="body"><circle cx="15" cy="7" r="5" fill="#0f2f4a"/><rect x="12" y="11" width="6" height="20" rx="3" fill="#0f2f4a"/><line x1="15" y1="30" x2="7" y2="42" stroke="#0f2f4a" stroke-width="4" stroke-linecap="round"/><line x1="15" y1="30" x2="23" y2="40" stroke="#0f2f4a" stroke-width="4" stroke-linecap="round"/><line x1="4" y1="43" x2="10" y2="43" stroke="#cfe9f7" stroke-width="2"/></g></svg></div>',
    };
    // tab key → theme (scene class, scene html, title, subtitle, pong?)
    const FBX_THEME = {
      summary:     { cls: 'fbx-facilities', scene: 'facilities', title: '🏟️ Facilities',       sub: 'Courts, fields, picnic areas & more.', game: 'invaders' },
      utilization: { cls: 'fbx-facilities', scene: 'facilities', title: '🏟️ Court Utilization', sub: 'How hard your courts are working.', game: 'breakout' },
      golf:        { cls: 'fbx-facilities', scene: 'facilities', title: '⛳ Golf',              sub: 'Tee sheets, rounds & revenue.', game: 'golf' },
      camping:     { cls: 'fbx-camp',       scene: 'camp',       title: '🏕️ Camping',          sub: 'Campsite reservations & occupancy.' },
      aquatics:    { cls: 'fbx-pool',       scene: 'pool',       title: '🏊 Pool / Aquatics',   sub: 'Lap swim, lessons & open-swim.' },
      outdoor:     { cls: 'fbx-pavilion',   scene: 'pavilion',   title: '🎪 Outdoor Event Spaces', sub: 'Pavilions, shelters, picnic areas & bounce houses.' },
      fields:      { cls: 'fbx-ballfield',  scene: 'ballfield',  title: '⚾ Fields',            sub: 'Diamonds, pitches & multipurpose turf.' },
      ice:         { cls: 'fbx-ice',        scene: 'ice',        title: '⛸️ Ice',               sub: 'Rink schedule & public skate.', game: 'hockey' },
      racket:      { cls: 'fbx-racket',     scene: 'racket',     title: '🎾 Racket Sports',     sub: 'Tennis, pickleball & padel demand.', game: 'pong' },
    };

    // ── Banner minigames ────────────────────────────────────────────────
    // One shared engine (audio + canvas sizing + RAF loop + input + mute +
    // open/close) drives a pluggable per-tab game. Each game is a factory
    // (api) => { reset, step(dt,input), draw(ctx), hud?, tip?, press?, release?,
    // resize?, over }. All canvas + Web Audio, no assets.
    const GAME_META = {
      pong:   { title: 'Pong',       tip: 'Mouse or ↑ ↓ to move · first to 5' },
      hockey: { title: 'Slapshot',   tip: 'Aim with the mouse · click to shoot · 5 shots' },
      swim:   { title: 'Pool Catch', tip: 'Move the tube · catch the pool toys · 3 misses' },
      golf:   { title: 'Putt',       tip: 'Pull back from the ball & release · sink it' },
      bear:   { title: 'Berry Run',  tip: 'Click / Space to hop · eat berries, dodge rocks' },
      invaders: { title: 'Invaders', tip: 'Move ← → · click / Space to fire · clear the wave' },
      breakout: { title: 'Court Breaker', tip: 'Move the paddle · click / Space to launch' },
      bounce:   { title: 'Bounce House', tip: 'Move \u2190 \u2192 \u00B7 click / Space to bounce higher \u00B7 pop the balloons' },
      bases:    { title: 'Sandlot', tip: 'Click / Space to swing \u00B7 time it as the ball crosses the plate' },
    };

    // Games that feed the seasonal arcade leaderboard (score-accumulation only;
    // pong/hockey are first-to-5 matches and excluded). `lower` ⇒ ranked by the
    // fewest (Putt's strokes); `unit` labels the score in the panel.
    const LB_GAMES = {
      swim:     { label: 'Pool Catch',    emoji: '🏖️', lower: false, unit: 'caught' },
      bear:     { label: 'Berry Run',     emoji: '🫐',       lower: false, unit: 'berries' },
      invaders: { label: 'Invaders',      emoji: '👾',       lower: false, unit: 'pts' },
      breakout: { label: 'Court Breaker', emoji: '🧱',       lower: false, unit: 'pts' },
      bounce:   { label: 'Bounce House',  emoji: '🎈',       lower: false, unit: 'balloons' },
      bases:    { label: 'Sandlot',       emoji: '⚾',       lower: false, unit: 'bases' },
      golf:     { label: 'Putt',          emoji: '⛳',             lower: true,  unit: 'strokes' },
    };
    // Build a token-aware /:org/api/games/* URL for score submit + board fetch.
    function lbUrl(path, params) {
      const qs = new URLSearchParams(params || {});
      if (CFG.token) qs.set('token', CFG.token);
      const q = qs.toString();
      return '/' + CFG.slug + '/api/games' + path + (q ? '?' + q : '');
    }

    const GAME_FACTORIES = {
      // ── Racket Sports: Pong ──
      pong: (api) => {
        const PADW = 9, BALLR = 7; let PADH = Math.max(30, api.H * 0.26);
        let player, cpu, ball, sP = 0, sC = 0;
        function serve(dir) { ball = { x: api.W / 2, y: api.H / 2, vx: (dir || (Math.random() < .5 ? -1 : 1)) * (api.W * 0.34), vy: (Math.random() * 2 - 1) * (api.H * 0.25) }; }
        function done(dir) { if (sP >= 5 || sC >= 5) { g.over = true; api.setTip((sP >= 5 ? 'You win! 🏆' : 'CPU wins') + ' — click to rematch'); (sP >= 5 ? api.snd.win() : api.snd.lose()); } else { api.snd.score(); serve(dir); } }
        const g = {
          tip: GAME_META.pong.tip, over: false,
          resize() { PADH = Math.max(30, api.H * 0.26); if (player) { player.h = PADH; cpu.h = PADH; cpu.x = api.W - 14 - PADW; } },
          reset() { PADH = Math.max(30, api.H * 0.26); player = { x: 14, y: api.H / 2 - PADH / 2, h: PADH }; cpu = { x: api.W - 14 - PADW, y: api.H / 2 - PADH / 2, h: PADH }; sP = 0; sC = 0; serve(); },
          step(dt, input) {
            const W = api.W, H = api.H;
            if (input.keys.ArrowUp) player.y -= H * 0.95 * dt;
            if (input.keys.ArrowDown) player.y += H * 0.95 * dt;
            if (input.y) player.y = input.y - player.h / 2;
            player.y = Math.max(0, Math.min(H - player.h, player.y));
            ball.x += ball.vx * dt; ball.y += ball.vy * dt;
            if (ball.y < BALLR) { ball.y = BALLR; ball.vy *= -1; api.snd.wall(); }
            if (ball.y > H - BALLR) { ball.y = H - BALLR; ball.vy *= -1; api.snd.wall(); }
            const tgt = ball.y - cpu.h / 2, mv = H * 0.62 * dt;
            if (tgt < cpu.y) cpu.y -= Math.min(mv, cpu.y - tgt); else cpu.y += Math.min(mv, tgt - cpu.y);
            cpu.y = Math.max(0, Math.min(H - cpu.h, cpu.y));
            if (ball.vx < 0 && ball.x - BALLR < player.x + PADW && ball.x > player.x && ball.y > player.y && ball.y < player.y + player.h) { ball.x = player.x + PADW + BALLR; ball.vx = Math.abs(ball.vx) * 1.06; ball.vy = ((ball.y - (player.y + player.h / 2)) / (player.h / 2)) * (H * 0.42); api.snd.hit(); }
            if (ball.vx > 0 && ball.x + BALLR > cpu.x && ball.x < cpu.x + PADW && ball.y > cpu.y && ball.y < cpu.y + cpu.h) { ball.x = cpu.x - BALLR; ball.vx = -Math.abs(ball.vx) * 1.06; ball.vy = ((ball.y - (cpu.y + cpu.h / 2)) / (cpu.h / 2)) * (H * 0.42); api.snd.hit(); }
            const mx = W * 0.85; ball.vx = Math.max(-mx, Math.min(mx, ball.vx));
            if (ball.x < -BALLR) { sC++; done(1); } else if (ball.x > W + BALLR) { sP++; done(-1); }
          },
          draw(ctx) {
            const W = api.W, H = api.H;
            ctx.fillStyle = '#0b3d24'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
            ctx.beginPath(); ctx.moveTo(W / 2, 6); ctx.lineTo(W / 2, H - 6); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = '#eafff2'; api.rr(player.x, player.y, PADW, player.h, 4); ctx.fill(); api.rr(cpu.x, cpu.y, PADW, cpu.h, 4); ctx.fill();
            ctx.fillStyle = '#e9ff5c'; ctx.beginPath(); ctx.arc(ball.x, ball.y, BALLR, 0, Math.PI * 2); ctx.fill();
            api.textScrim();
          },
          hud() { return 'You ' + sP + ' · ' + sC + ' CPU'; },
        };
        return g;
      },

      // ── Ice: Slapshot — aim & shoot the puck past the goalie into the net ──
      hockey: (api) => {
        let puck, goalie, shots = 0, goals = 0, state = 'aim', aim = null;
        const gTop = () => api.H * 0.30, gBot = () => api.H * 0.70;
        function newPuck() { if (shots >= 5) { g.over = true; api.setTip('Final: ' + goals + '/5 goals — click to play again'); return; } puck = { x: api.W * 0.16, y: api.H / 2, vx: 0, vy: 0, r: 7 }; state = 'aim'; }
        function shoot(input) { const dx = input.x - puck.x, dy = input.y - puck.y, d = Math.hypot(dx, dy) || 1; const pw = api.W * 1.05; puck.vx = dx / d * pw; puck.vy = dy / d * pw; state = 'shot'; shots++; api.snd.tone(320, 0.09, 'square', 0.18); }
        const g = {
          tip: GAME_META.hockey.tip, over: false,
          reset() { shots = 0; goals = 0; goalie = { y: api.H / 2, t: 0 }; newPuck(); },
          press(input) { if (state === 'aim' && !g.over) shoot(input); },
          step(dt, input) {
            const W = api.W, H = api.H;
            goalie.t += dt * 2.3; goalie.y = H / 2 + Math.sin(goalie.t) * (H * 0.16);
            aim = { x: input.x, y: input.y };
            if (state === 'shot') {
              puck.x += puck.vx * dt; puck.y += puck.vy * dt; puck.vx *= 0.992; puck.vy *= 0.992;
              if (puck.y < 9) { puck.y = 9; puck.vy *= -1; api.snd.wall(); }
              if (puck.y > H - 9) { puck.y = H - 9; puck.vy *= -1; api.snd.wall(); }
              if (puck.x < 9) { puck.x = 9; puck.vx *= -1; }
              const gx = W - 24;
              if (puck.vx > 0 && puck.x > gx - 8 && Math.abs(puck.y - goalie.y) < H * 0.11) { puck.vx = -Math.abs(puck.vx) * 0.55; puck.x = gx - 9; api.snd.hit(); }
              if (puck.x > W - 12) { if (puck.y > gTop() && puck.y < gBot()) { goals++; api.snd.win(); } else { api.snd.lose(); } return newPuck(); }
              if (Math.hypot(puck.vx, puck.vy) < 10) return newPuck();
            }
          },
          draw(ctx) {
            const W = api.W, H = api.H;
            ctx.fillStyle = '#cfe4f5'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(70,120,180,.30)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(W * 0.5, 0); ctx.lineTo(W * 0.5, H); ctx.stroke();
            ctx.fillStyle = 'rgba(120,170,220,.28)'; ctx.beginPath(); ctx.arc(W - 12, H / 2, H * 0.34, Math.PI * 0.5, Math.PI * 1.5, true); ctx.fill();
            ctx.strokeStyle = 'rgba(90,90,90,.5)'; ctx.lineWidth = 1;
            for (let yy = gTop(); yy <= gBot(); yy += 8) { ctx.beginPath(); ctx.moveTo(W - 12, yy); ctx.lineTo(W - 2, yy - 4); ctx.stroke(); }
            ctx.strokeStyle = '#d33'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(W - 12, gTop()); ctx.lineTo(W - 12, gBot()); ctx.stroke();
            ctx.fillStyle = '#1e5fa8'; api.rr(W - 22, goalie.y - H * 0.10, 8, H * 0.20, 3); ctx.fill();
            if (state === 'aim' && aim) { ctx.strokeStyle = 'rgba(20,50,80,.55)'; ctx.setLineDash([4, 5]); ctx.beginPath(); ctx.moveTo(puck.x, puck.y); ctx.lineTo(aim.x, aim.y); ctx.stroke(); ctx.setLineDash([]); }
            ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2); ctx.fill();
            api.textScrim();
          },
          hud() { return '🥅 ' + goals + ' · ' + shots + '/5 shots'; },
        };
        return g;
      },

      // ── Pool / Aquatics: Pool Catch — slide the tube to catch falling toys ──
      swim: (api) => {
        let tubeX, items, spawnT, score, misses, speed;
        const tubeW = () => Math.max(46, api.W * 0.09);
        const catchY = () => api.H - 22;
        function spawn() { const W = api.W, duck = Math.random() < 0.18; items.push({ x: 18 + Math.random() * (W - 36), y: -16, r: duck ? 11 : 10, vy: Math.random() * api.H * 0.12, pts: duck ? 3 : 1, duck, hue: Math.floor(Math.random() * 360) }); }
        const g = {
          tip: GAME_META.swim.tip, over: false,
          reset() { tubeX = api.W * 0.5; items = []; spawnT = 0.3; score = 0; misses = 0; speed = api.H * 0.55; },
          step(dt, input) {
            const W = api.W, H = api.H;
            if (input.keys.ArrowLeft) tubeX -= W * 0.95 * dt;
            if (input.keys.ArrowRight) tubeX += W * 0.95 * dt;
            if (input.x) tubeX = input.x;
            tubeX = Math.max(tubeW() / 2, Math.min(W - tubeW() / 2, tubeX));
            speed += dt * H * 0.035;
            spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = 0.55 + Math.random() * 0.5; }
            for (const it of items) it.y += (speed + it.vy) * dt;
            for (const it of items) {
              if (it.done) continue;
              if (it.y >= catchY() && Math.abs(it.x - tubeX) < tubeW() / 2 + it.r) { it.done = true; score += it.pts; api.snd.good(); }
              else if (it.y > H + 20) { it.done = true; misses++; api.snd.wall(); if (misses >= 3) { g.over = true; api.snd.lose(); api.setTip('Game over · ' + score + ' caught — click to play again'); } }
            }
            items = items.filter(it => !it.done);
          },
          draw(ctx) {
            const W = api.W, H = api.H;
            const wg = ctx.createLinearGradient(0, 0, 0, H); wg.addColorStop(0, '#12a0d8'); wg.addColorStop(1, '#0a4f7a'); ctx.fillStyle = wg; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2; for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0, H * 0.22 * i); ctx.lineTo(W, H * 0.22 * i); ctx.stroke(); }
            for (const it of items) {
              if (it.done) continue;
              if (it.duck) {
