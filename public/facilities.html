                ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.ellipse(it.x, it.y + 1, it.r, it.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(it.x - it.r * 0.55, it.y - it.r * 0.5, it.r * 0.6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.moveTo(it.x - it.r * 1.05, it.y - it.r * 0.55); ctx.lineTo(it.x - it.r * 1.7, it.y - it.r * 0.4); ctx.lineTo(it.x - it.r * 1.05, it.y - it.r * 0.2); ctx.fill();
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(it.x - it.r * 0.7, it.y - it.r * 0.6, 1.4, 0, Math.PI * 2); ctx.fill();
              } else {
                ctx.fillStyle = 'hsl(' + it.hue + ',85%,60%)'; ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(it.x, it.y, it.r, -0.5, 2.1); ctx.stroke();
              }
            }
            const tw = tubeW(), ty = catchY();
            ctx.fillStyle = '#fb7137'; api.rr(tubeX - tw / 2, ty, tw, 15, 8); ctx.fill();
            ctx.fillStyle = '#ffd9c2'; api.rr(tubeX - tw / 2, ty, tw, 5, 3); ctx.fill();
            ctx.fillStyle = '#0d6ea0'; api.rr(tubeX - tw / 2 + 9, ty + 4, tw - 18, 8, 4); ctx.fill();
            api.textScrim();
          },
          hud() { return '🏖️ ' + score + '   ' + (misses >= 3 ? '' : '💛'.repeat(3 - misses)); },
          score() { return score; },
        };
        return g;
      },

      // ── Golf: Putt — pull back from the ball & release to sink it ──
      golf: (api) => {
        let ball, hole, strokes = 0, aiming = false, aimPos = null;
        const g = {
          tip: GAME_META.golf.tip, over: false,
          reset() { ball = { x: api.W * 0.12, y: api.H / 2, vx: 0, vy: 0, r: 6, moving: false }; hole = { x: api.W * 0.9, y: api.H / 2, r: 12 }; strokes = 0; aiming = false; },
          press(input) { if (!ball.moving) { aiming = true; aimPos = { x: input.x, y: input.y }; } },
          release(input) {
            if (!aiming) return; aiming = false;
            const dx = ball.x - input.x, dy = ball.y - input.y, d = Math.hypot(dx, dy);
            if (d < 6) return;
            const p = Math.min(1, d / (api.W * 0.4)), power = api.W * 1.5 * p;
            ball.vx = dx / d * power; ball.vy = dy / d * power; ball.moving = true; strokes++; api.snd.hit();
          },
          step(dt, input) {
            const W = api.W, H = api.H;
            if (aiming) aimPos = { x: input.x, y: input.y };
            if (ball.moving) {
              ball.x += ball.vx * dt; ball.y += ball.vy * dt; ball.vx *= 0.985; ball.vy *= 0.985;
              if (ball.y < ball.r) { ball.y = ball.r; ball.vy *= -1; } if (ball.y > H - ball.r) { ball.y = H - ball.r; ball.vy *= -1; }
              if (ball.x < ball.r) { ball.x = ball.r; ball.vx *= -1; } if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx *= -1; }
              const d = Math.hypot(ball.x - hole.x, ball.y - hole.y), sp = Math.hypot(ball.vx, ball.vy);
              if (d < hole.r && sp < api.W * 0.5) { g.over = true; ball.moving = false; api.snd.win(); api.setTip('Sunk it in ' + strokes + '! — click to play again'); }
              else if (sp < 7) { ball.moving = false; ball.vx = 0; ball.vy = 0; if (d < hole.r) { g.over = true; api.snd.win(); api.setTip('Sunk it in ' + strokes + '! — click to play again'); } }
            }
          },
          draw(ctx) {
            const W = api.W, H = api.H;
            ctx.fillStyle = '#16833f'; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,.05)'; for (let x = 0; x < W; x += 44) ctx.fillRect(x, 0, 22, H);
            ctx.fillStyle = '#0a3d1e'; ctx.beginPath(); ctx.ellipse(hole.x, hole.y, hole.r, hole.r * 0.72, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hole.x, hole.y - 4); ctx.lineTo(hole.x, hole.y - 40); ctx.stroke();
            ctx.fillStyle = '#e5484d'; ctx.beginPath(); ctx.moveTo(hole.x, hole.y - 40); ctx.lineTo(hole.x + 18, hole.y - 34); ctx.lineTo(hole.x, hole.y - 28); ctx.fill();
            if (aiming && aimPos) { const dx = ball.x - aimPos.x, dy = ball.y - aimPos.y; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x + dx * 0.8, ball.y + dy * 0.8); ctx.stroke(); ctx.setLineDash([]); }
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            api.textScrim();
          },
          hud() { return '⛳ ' + strokes + ' stroke' + (strokes === 1 ? '' : 's'); },
          score() { return strokes; },
        };
        return g;
      },

      // ── Camping: Berry Run — hop the bear to eat berries, dodge rocks ──
      bear: (api) => {
        let by, vy, grounded, items, spawnT, score, speed, groundY;
        const bx = () => api.W * 0.18;
        function spawnItem() {
          const W = api.W;
          if (Math.random() < 0.72) { const y = groundY - (34 + Math.random() * 78); items.push({ type: 'berry', x: W + 20, y, dead: false }); }
          else { items.push({ type: 'rock', x: W + 20, y: groundY - 4 }); }
        }
        const g = {
          tip: GAME_META.bear.tip, over: false,
          reset() { groundY = api.H * 0.74; by = groundY; vy = 0; grounded = true; items = []; spawnT = 0.4; score = 0; speed = api.W * 0.5; },
          press() { if (grounded) { vy = -api.H * 1.75; grounded = false; api.snd.tone(520, 0.08, 'square', 0.15); } },
          step(dt) {
            const W = api.W, H = api.H;
            vy += H * 5.2 * dt; by += vy * dt; if (by >= groundY) { by = groundY; vy = 0; grounded = true; }
            speed += dt * api.W * 0.02;
            spawnT -= dt; if (spawnT <= 0) { spawnItem(); spawnT = 0.65 + Math.random() * 0.5; }
            for (const it of items) it.x -= speed * dt;
            items = items.filter(it => it.x > -30);
            const cxp = bx(), cyp = by - 12;
            for (const it of items) {
              if (it.dead) continue;
              if (Math.abs(it.x - cxp) < 18 && Math.abs(it.y - cyp) < 17) {
                if (it.type === 'berry') { it.dead = true; score++; api.snd.good(); }
                else { g.over = true; api.snd.lose(); api.setTip('Ouch! ' + score + ' berries — click to run again'); }
              }
            }
          },
          draw(ctx) {
            const W = api.W, H = api.H;
            const sg = ctx.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, '#241a4d'); sg.addColorStop(1, '#3b2a63'); ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#16281a'; ctx.fillRect(0, groundY + 14, W, H - groundY);
            ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, groundY + 14); ctx.lineTo(W, groundY + 14); ctx.stroke();
            for (const it of items) {
              if (it.dead) continue;
              if (it.type === 'berry') { ctx.fillStyle = '#c060e0'; ctx.beginPath(); ctx.arc(it.x, it.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#3a7d2c'; ctx.fillRect(it.x - 1, it.y - 10, 2, 4); }
              else { ctx.fillStyle = '#6b6b6b'; ctx.beginPath(); ctx.ellipse(it.x, it.y, 12, 8, 0, 0, Math.PI * 2); ctx.fill(); }
            }
            const x = bx(), y = by;
            ctx.fillStyle = '#3b2417';
            ctx.beginPath(); ctx.ellipse(x, y - 11, 16, 11, 0, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x - 13, y - 17, 8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(x - 17, y - 24, 3, 0, Math.PI * 2); ctx.arc(x - 9, y - 24, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#7a5535'; ctx.beginPath(); ctx.ellipse(x - 19, y - 15, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#160d06'; ctx.beginPath(); ctx.arc(x - 22, y - 15, 1.5, 0, Math.PI * 2); ctx.fill();
            api.textScrim();
          },
          hud() { return '🫐 ' + score; },
          score() { return score; },
        };
        return g;
      },

      // ── Summary: Invaders — clear the descending formation, dodge the bombs ──
      invaders: (api) => {
        let ship, bullets, inv, bombs, dir, score, lives, wave, fireCd, stars, hurt;
        function build() {
          inv = []; const cols = 8, rows = 3, W = api.W;
          const x0 = W * 0.12, x1 = W * 0.88, dx = (x1 - x0) / (cols - 1);
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) inv.push({ x: x0 + c * dx, y: 24 + r * 17, row: r, alive: true });
          dir = 1;
        }
        function fire() { if (fireCd > 0) return; bullets.push({ x: ship.x, y: api.H - 20 }); fireCd = 0.32; api.snd.tone(880, 0.05, 'square', 0.12); }
        const g = {
          tip: GAME_META.invaders.tip, over: false,
          reset() {
            ship = { x: api.W / 2 }; bullets = []; bombs = []; score = 0; lives = 3; wave = 1; fireCd = 0; hurt = 0;
            stars = []; for (let i = 0; i < 40; i++) stars.push({ x: Math.random() * api.W, y: Math.random() * api.H, s: Math.random() < 0.3 ? 1.6 : 1 });
            build();
          },
          press() { fire(); },
          step(dt, input) {
            const W = api.W, H = api.H, sw = W * 0.6;
            if (input.keys.ArrowLeft) ship.x -= sw * dt;
            if (input.keys.ArrowRight) ship.x += sw * dt;
            if (input.x) ship.x = input.x;
            ship.x = Math.max(14, Math.min(W - 14, ship.x));
            if (fireCd > 0) fireCd -= dt;
            if (input.keys[' ']) fire();
            const alive = inv.filter(v => v.alive);
            if (!alive.length) { wave++; api.snd.win(); build(); return; }
            const speed = (W * 0.06) * (1 + (24 - alive.length) * 0.05) * (1 + (wave - 1) * 0.25);
            let minx = 1e9, maxx = -1e9, maxy = -1e9;
            for (const v of alive) { v.x += dir * speed * dt; minx = Math.min(minx, v.x); maxx = Math.max(maxx, v.x); }
            if (maxx > W - 12 || minx < 12) { dir *= -1; for (const v of alive) v.y += 8; api.snd.tone(160, 0.05, 'square', 0.1); }
            for (const v of alive) maxy = Math.max(maxy, v.y);
            if (maxy > H - 28) { g.over = true; api.snd.lose(); api.setTip('Overrun · score ' + score + ' — click to play again'); return; }
            // enemy bombs
            if (Math.random() < dt * (0.9 + wave * 0.25) && alive.length) { const s = alive[Math.floor(Math.random() * alive.length)]; bombs.push({ x: s.x, y: s.y + 6 }); }
            for (const b of bombs) b.y += H * 1.1 * dt;
            // bullets
            for (const b of bullets) b.y -= H * 2.4 * dt;
            for (const b of bullets) { if (b.hit) continue; for (const v of alive) { if (v.alive && Math.abs(b.x - v.x) < 10 && Math.abs(b.y - v.y) < 8) { v.alive = false; b.hit = true; score += (3 - v.row) * 10; api.snd.hit(); break; } } }
            bullets = bullets.filter(b => !b.hit && b.y > -8);
            // bombs vs ship
            if (hurt > 0) hurt -= dt;
            for (const b of bombs) { if (!b.done && b.y > H - 22 && Math.abs(b.x - ship.x) < 14) { b.done = true; if (hurt <= 0) { lives--; hurt = 1.2; api.snd.lose(); if (lives <= 0) { g.over = true; api.setTip('Game over · score ' + score + ' — click to play again'); } } } }
            bombs = bombs.filter(b => !b.done && b.y < H + 8);
          },
          draw(ctx) {
            const W = api.W, H = api.H;
            ctx.fillStyle = '#0a0e24'; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(255,255,255,.7)'; for (const s of stars) ctx.fillRect(s.x, s.y, s.s, s.s);
            const cols = ['#ff5d73', '#ffb14e', '#7cf5a0'];
            for (const v of inv) { if (!v.alive) continue; ctx.fillStyle = cols[v.row] || '#7cf5a0'; ctx.fillRect(v.x - 8, v.y - 5, 16, 9); ctx.fillRect(v.x - 10, v.y - 1, 3, 5); ctx.fillRect(v.x + 7, v.y - 1, 3, 5); ctx.fillStyle = '#0a0e24'; ctx.fillRect(v.x - 5, v.y - 2, 3, 3); ctx.fillRect(v.x + 2, v.y - 2, 3, 3); }
            ctx.fillStyle = '#fff'; for (const b of bullets) ctx.fillRect(b.x - 1, b.y - 6, 2, 6);
            ctx.fillStyle = '#ff6b6b'; for (const b of bombs) ctx.fillRect(b.x - 1.5, b.y, 3, 6);
            if (!(hurt > 0 && Math.floor(hurt * 12) % 2)) { ctx.fillStyle = '#8befb0'; const sx = ship.x, sy = H - 16; ctx.fillRect(sx - 12, sy, 24, 7); ctx.fillRect(sx - 4, sy - 6, 8, 6); }
            api.textScrim();
          },
          hud() { return '👾 ' + score + '   ' + (lives > 0 ? '❤'.repeat(lives) : '') + '   W' + wave; },
          score() { return score; },
        };
        return g;
      },

      // ── Court Utilization: Breakout — smash the busy-court grid ──
      breakout: (api) => {
        let paddle, ball, bricks, score, lives, level;
        const RAMP = ['#e31a1c', '#fd8d3c', '#fecc5c', '#41b6c4', '#2c7fb8'];
        function build() {
          bricks = []; const cols = 10, rows = 3, W = api.W;
          const pad = 6, bw = (W - pad * 2 - (cols - 1) * 4) / cols, bh = 11;
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) bricks.push({ x: pad + c * (bw + 4), y: 16 + r * (bh + 5), w: bw, h: bh, row: r, alive: true });
        }
        function serve() { ball = { x: paddle.x, y: api.H - 26, vx: 0, vy: 0, r: 6, stuck: true }; }
        const g = {
          tip: GAME_META.breakout.tip, over: false,
          resize() { if (paddle) paddle.w = Math.max(56, api.W * 0.13); },
          reset() { paddle = { x: api.W / 2, w: Math.max(56, api.W * 0.13) }; score = 0; lives = 3; level = 1; build(); serve(); },
          press() { if (ball.stuck) { const sp = api.H * 1.7; ball.vy = -sp; ball.vx = (api.W * 0.5) * (Math.random() < .5 ? -1 : 1) * 0.4; ball.stuck = false; api.snd.tone(660, 0.05, 'square', 0.12); } },
          step(dt, input) {
            const W = api.W, H = api.H;
            if (input.keys.ArrowLeft) paddle.x -= W * 0.9 * dt;
            if (input.keys.ArrowRight) paddle.x += W * 0.9 * dt;
            if (input.x) paddle.x = input.x;
            paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));
            const py = H - 14;
            if (ball.stuck) { ball.x = paddle.x; ball.y = py - 10; return; }
            ball.x += ball.vx * dt; ball.y += ball.vy * dt;
            if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); api.snd.wall(); }
            if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); api.snd.wall(); }
            if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); api.snd.wall(); }
            if (ball.vy > 0 && ball.y > py - 4 && ball.y < py + 6 && Math.abs(ball.x - paddle.x) < paddle.w / 2 + ball.r) { ball.y = py - 4; ball.vy = -Math.abs(ball.vy); ball.vx = ((ball.x - paddle.x) / (paddle.w / 2)) * (W * 0.55); api.snd.hit(); }
            if (ball.y > H + 12) { lives--; api.snd.lose(); if (lives <= 0) { g.over = true; api.setTip('Game over · ' + score + ' — click to play again'); } else serve(); return; }
            for (const bk of bricks) {
              if (!bk.alive) continue;
              if (ball.x > bk.x - ball.r && ball.x < bk.x + bk.w + ball.r && ball.y > bk.y - ball.r && ball.y < bk.y + bk.h + ball.r) {
                bk.alive = false; score += (3 - bk.row) * 5; api.snd.good();
                const ox = Math.min(Math.abs(ball.x - bk.x), Math.abs(ball.x - (bk.x + bk.w)));
                const oy = Math.min(Math.abs(ball.y - bk.y), Math.abs(ball.y - (bk.y + bk.h)));
                if (oy < ox) ball.vy *= -1; else ball.vx *= -1;
                break;
              }
            }
            if (!bricks.some(b => b.alive)) { level++; api.snd.win(); build(); serve(); const k = 1 + level * 0.08; ball.vx *= k; }
          },
          draw(ctx) {
            const W = api.W, H = api.H;
            ctx.fillStyle = '#0f3b2e'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1; ctx.strokeRect(3, 3, W - 6, H - 6); ctx.beginPath(); ctx.moveTo(W / 2, 3); ctx.lineTo(W / 2, H - 3); ctx.stroke();
            for (const bk of bricks) { if (!bk.alive) continue; ctx.fillStyle = RAMP[bk.row] || '#41b6c4'; api.rr(bk.x, bk.y, bk.w, bk.h, 2); ctx.fill(); }
            ctx.fillStyle = '#eafff2'; const py = H - 14; api.rr(paddle.x - paddle.w / 2, py, paddle.w, 8, 4); ctx.fill();
            ctx.fillStyle = '#fde68a'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
            api.textScrim();
          },
          hud() { return '🧱 ' + score + '   ' + (lives > 0 ? '❤'.repeat(lives) : '') + '   L' + level; },
          score() { return score; },
        };
        return g;
      },

      // ── Outdoor Event Spaces: Bounce House ──
      // Walk the inflatable, time a click as you land for a bigger bounce, and
      // pop the balloons overhead. Two ways to end it: come down off the mat, or
      // meet a wasp. Deliberately the one game here where you do NOT control
      // your own height directly — the timing window is the whole skill.
      bounce: (api) => {
        let px, py, vy, tuck, squash, score, balloons, wasps, spawnT, waspT, matY, matL, matR;
        const R = 11;                                     // half-width of the jumper
        const HEAD = () => 22;                            // head sits this far above the feet
        const BASE  = () => api.H * 1.55;                 // an ordinary bounce
        const BOOST = () => api.H * 2.15;                 // a well-timed one
        const BCOL = ['#f87171', '#fbbf24', '#60a5fa', '#f472b6', '#34d399', '#c084fc'];
        // The banner is ~172px tall, so the inflatable needs two thirds of the
        // way down to read as a bounce house rather than a red beam — and the
        // jumper still clears the balloons from there (a plain bounce rises ~45px,
        // a charged one ~85px, and the lowest balloons sit at 10% of the height).
        function mat() { matY = api.H * 0.67; matL = api.W * 0.10; matR = api.W * 0.90; }
        function spawnBalloon() {
          const W = api.W, H = api.H, fromLeft = Math.random() < 0.5;
          balloons.push({ x: fromLeft ? -16 : W + 16, y: H * (0.10 + Math.random() * 0.50),
            vx: (fromLeft ? 1 : -1) * W * (0.07 + Math.random() * 0.09),
            bob: Math.random() * 6.28, c: BCOL[Math.floor(Math.random() * BCOL.length)] });
        }
        function spawnWasp() {
          const W = api.W, H = api.H, fromLeft = Math.random() < 0.5;
          wasps.push({ x: fromLeft ? -16 : W + 16, y: H * (0.22 + Math.random() * 0.40),
            vx: (fromLeft ? 1 : -1) * W * (0.26 + Math.random() * 0.14), bob: Math.random() * 6.28 });
        }
        function ended(msg) {
          g.over = true; api.snd.lose();
          api.setTip(msg + ' ' + score + ' balloon' + (score === 1 ? '' : 's') + ' \u2014 click to bounce again');
        }
        const g = {
          tip: GAME_META.bounce.tip, over: false,
          resize() { mat(); px = Math.max(R, Math.min(api.W - R, px || api.W / 2)); },
          reset() { mat(); px = (matL + matR) / 2; py = matY; vy = -BASE(); tuck = false; squash = 0; score = 0; balloons = []; wasps = []; spawnT = 0.3; waspT = 4; },
          // Only a press while FALLING and close to the mat converts into height.
          // A mistimed one gets a dull thud rather than nothing, so the window
          // teaches itself instead of feeling broken.
          press() {
            if (g.over) return;
            if (vy > 0 && py > matY - api.H * 0.26) { tuck = true; api.snd.tone(540, 0.05, 'square', 0.12); }
            else api.snd.tone(190, 0.04, 'sine', 0.07);
          },
          step(dt, input) {
            const W = api.W, H = api.H;
            if (input.keys.ArrowLeft)  px -= W * 0.85 * dt;
            if (input.keys.ArrowRight) px += W * 0.85 * dt;
            if (input.x) { const lim = W * 1.4 * dt; px += Math.max(-lim, Math.min(lim, input.x - px)); }
            px = Math.max(R, Math.min(W - R, px));

            vy += H * 4.6 * dt; py += vy * dt;
            if (squash > 0) squash = Math.max(0, squash - dt * 4.5);
            if (py - HEAD() < 6) { py = HEAD() + 6; vy = Math.abs(vy) * 0.35; }
            if (py >= matY) {
              if (px < matL || px > matR) return ended('Off the mat!');
              py = matY; vy = -(tuck ? BOOST() : BASE());
              if (tuck) { api.snd.good(); tuck = false; } else api.snd.wall();
              squash = 1;
            }

            spawnT -= dt;
            if (spawnT <= 0 && balloons.length < 7) { spawnBalloon(); spawnT = 0.7 + Math.random() * 0.7; }
            // Wasps only after the player has the hang of it — an instant loss on
            // the first bounce reads as a broken game, not a hard one.
            if (score >= 4) { waspT -= dt; if (waspT <= 0 && wasps.length < 3) { spawnWasp(); waspT = 2.6 + Math.random() * 2.4; } }
            for (const b of balloons) { b.x += b.vx * dt; b.bob += dt * 2.2; }
            for (const w of wasps) { w.x += w.vx * dt; w.bob += dt * 9; }
            balloons = balloons.filter(b => b.x > -34 && b.x < W + 34);
            wasps    = wasps.filter(w => w.x > -34 && w.x < W + 34);

            const hx = px, hy = py - HEAD();
            for (const b of balloons) {
              if (Math.abs(b.x - hx) < 16 && Math.abs((b.y + Math.sin(b.bob) * 5) - hy) < 18) { b.pop = true; score++; api.snd.tone(880, 0.07, 'square', 0.16); }
            }
            if (balloons.some(b => b.pop)) balloons = balloons.filter(b => !b.pop);
            for (const w of wasps) {
              if (Math.abs(w.x - hx) < 13 && Math.abs((w.y + Math.sin(w.bob) * 4) - hy) < 14) return ended('Stung!');
            }
          },
          draw(ctx) {
            const W = api.W, H = api.H;
            const sky = ctx.createLinearGradient(0, 0, 0, H);
            sky.addColorStop(0, '#1e6f9e'); sky.addColorStop(0.55, '#56a8cd'); sky.addColorStop(1, '#9ad6a0');
            ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
            ctx.fillStyle = '#2c6f38'; ctx.fillRect(0, H * 0.86, W, H);

            // balloons
            for (const b of balloons) {
              const by = b.y + Math.sin(b.bob) * 5;
              ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(b.x, by + 9); ctx.lineTo(b.x, by + 22); ctx.stroke();
              ctx.fillStyle = b.c; ctx.beginPath(); ctx.ellipse(b.x, by, 9, 11, 0, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(b.x - 3, by - 4, 2.4, 3.2, 0, 0, Math.PI * 2); ctx.fill();
            }
            // wasps
            for (const w of wasps) {
              const wy = w.y + Math.sin(w.bob) * 4;
              ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(w.x, wy - 5, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#3a2c08'; ctx.beginPath(); ctx.ellipse(w.x, wy, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
              ctx.fillStyle = '#fbbf24'; ctx.fillRect(w.x - 3, wy - 4.6, 2.4, 9.2); ctx.fillRect(w.x + 2, wy - 4.2, 2.4, 8.4);
            }
            // the inflatable: striped walls, an arch, corner turrets, jumping mat
            const bw = matR - matL, top = matY, botY = H - 1, wallH = botY - top;
            ctx.fillStyle = '#3b82f6'; api.rr(matL - 12, top - 24, 24, 30, 9); ctx.fill();
            api.rr(matR - 12, top - 24, 24, 30, 9); ctx.fill();
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath(); ctx.arc(matL, top - 26, 3, 0, Math.PI * 2); ctx.arc(matR, top - 26, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#e0554f'; api.rr(matL - 10, top, bw + 20, wallH, 11); ctx.fill();
            ctx.save();
            api.rr(matL - 10, top, bw + 20, wallH, 11); ctx.clip();
            ctx.fillStyle = '#f8b4b0';
            for (let x = matL - 10; x < matR + 10; x += 26) ctx.fillRect(x, top, 13, wallH);
            ctx.restore();
            // the arch you climb in through — the one detail that says "inflatable"
            const ax = (matL + matR) / 2, aw = Math.max(26, bw * 0.16);
            ctx.fillStyle = '#7f1d1d';
            ctx.beginPath();
            ctx.moveTo(ax - aw / 2, botY);
            ctx.lineTo(ax - aw / 2, top + wallH * 0.45);
            ctx.quadraticCurveTo(ax, top + wallH * 0.10, ax + aw / 2, top + wallH * 0.45);
            ctx.lineTo(ax + aw / 2, botY);
            ctx.closePath(); ctx.fill();
            ctx.fillStyle = '#f2f2ef'; api.rr(matL, top - 6, bw, 11, 5); ctx.fill();
            ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(matL + 2, top - 4, bw - 4, 2);

            // the jumper — squashes on contact so the bounce reads
            const sq = squash, fy = py, hh = HEAD();
            const bodyH = (hh - 6) * (1 - sq * 0.28), wobble = 1 + sq * 0.22;
            ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(px, fy - bodyH); ctx.lineTo(px - 7 * wobble, fy); ctx.moveTo(px, fy - bodyH); ctx.lineTo(px + 7 * wobble, fy); ctx.stroke();
            ctx.fillStyle = '#fde68a'; api.rr(px - 6 * wobble, fy - bodyH - 8, 12 * wobble, bodyH + 8, 5); ctx.fill();
            ctx.strokeStyle = '#fde68a';
            ctx.beginPath(); ctx.moveTo(px - 4, fy - bodyH - 5); ctx.lineTo(px - 13 * wobble, fy - bodyH - 15);
            ctx.moveTo(px + 4, fy - bodyH - 5); ctx.lineTo(px + 13 * wobble, fy - bodyH - 15); ctx.stroke();
            ctx.fillStyle = '#f5c98b'; ctx.beginPath(); ctx.arc(px, fy - hh, 8, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#1f2937'; ctx.beginPath(); ctx.arc(px - 3, fy - hh - 1, 1.4, 0, Math.PI * 2); ctx.arc(px + 3, fy - hh - 1, 1.4, 0, Math.PI * 2); ctx.fill();
            api.textScrim();
          },
          hud() { return '🎈 ' + score; },
          score() { return score; },
        };
        return g;
      },

      // ── Fields: Sandlot ──
      // A whole at-bat in a 172px band, top-down so the pitch and the base
      // running share one frame: the pitcher winds up, the ball comes in, you
      // time ONE swing. Contact quality sets the launch angle and the power;
      // the ball carries, the nearest fielder breaks for where it will land,
      // and the runner takes whatever bases the retrieve time allows. Clear the
      // fence and it is gone.
      //
      // Three outs ends it. Score is TOTAL BASES, so a triple beats three
      // singles' worth of luck, and a home run is worth the swing.
      bases: (api) => {
        let st, t, ball, runner, fielders, outs, strikes, score, runs, msg, msgT, shake, swing, windup, bat;
        const FOUL = Math.PI / 4;                    // 45° either side of straight away
        // The banner is ~1220x172, so a top-down park has to be WIDE and SHALLOW:
        // a circular field of any useful radius puts its fence hundreds of pixels
        // above the top edge. Everything is therefore laid out in field units
        // (0 = home, 1 = the fence) and projected through separate x/y radii, so
        // the whole park — fence, foul lines, fielders — is on screen.
        const geo = () => {
          const cx = api.W / 2;
          const plateY = api.H * 0.88;
          const rxF = Math.min(api.W * 0.33, 340), ryF = api.H * 0.74;
          const rx = rxF * 0.34, ry = ryF * 0.34;
          return { cx, plateY, rxF, ryF, rx, ry, moundY: plateY - ry * 0.92 };
        };
        // dir: radians from straight-away (0), d: 0..1 field units.
        const toScreen = (dir, d) => {
          const g = geo();
          return { x: g.cx + Math.sin(dir) * d * g.rxF, y: g.plateY - Math.cos(dir) * d * g.ryF };
        };
        // Bases, top-down: home bottom, 1st right, 2nd top, 3rd left.
        function basePos(i) {
          const g = geo(), k = ((i % 4) + 4) % 4;
          if (k === 0) return { x: g.cx, y: g.plateY };
          if (k === 1) return { x: g.cx + g.rx, y: g.plateY - g.ry };
          if (k === 2) return { x: g.cx, y: g.plateY - g.ry * 2 };
          return { x: g.cx - g.rx, y: g.plateY - g.ry };
        }
        // Three deep, two in. Placed on two rings with a little jitter each pitch,
        // so the gaps are real and move — at four evenly-spaced fielders on one
        // ring nothing could drop in, every landing spot was 19-53px from
        // somebody, and the only hit that paid was one over the fence.
        // Fielders keep their POLAR home (angle, depth) as well as their pixels:
        // distances have to be judged in field units, because the projection
        // stretches x about 2.7x and a pixel measure made a fielder look one
        // stride from everything.
        function setFielders() {
          const jit = () => (Math.random() * 2 - 1) * 0.16;
          const at = (a, d) => {
            const ang = (a + jit()) * FOUL, p = toScreen(ang, d);
            return { a: ang, d, x: p.x, y: p.y, hx: p.x, hy: p.y };
          };
          // FOUR, not five: five bodies in a 90-degree wedge left nearest-fielder
          // distances of 0.04-0.21 field units, i.e. no gaps at all, and every
          // ball that stayed in the park was caught.
          fielders = [at(-0.82, 0.84), at(0, 0.88), at(0.82, 0.84), at(0, 0.42)];
        }
        // Straight-line distance between two polar points, in field units.
        const fieldDist = (a1, d1, a2, d2) =>
          Math.sqrt(Math.max(0, d1 * d1 + d2 * d2 - 2 * d1 * d2 * Math.cos(a1 - a2)));
        function newPitch() {
          const g = geo();
          if (outs >= 3) {
            g_over('Three outs — ' + score + ' base' + (score === 1 ? '' : 's') + ', ' + runs + ' run' + (runs === 1 ? '' : 's'));
            return;
          }

    function KpiCards({ a }) {
      // Authoritative view (v2 card): Charged / Collected / Outstanding
      // side by side, so invoiced-but-unpaid facility use is visible instead of
      // hidden. Falls back to a single "Charged" tile on the legacy card.
      // Sub-labels are time-aware: when the range reaches past today, Charged

      // has actually come due, and Outstanding separates due from not-yet-due.
      const invNote = a.invoicedRev > 0 ? ' · incl. ' + money(a.invoicedRev) + ' invoiced' : '';
      const future = a.chargedUpcoming > 0;
      const revCards = a.hasBilled ? [
        { label: 'Charged', val: money(a.billed), cls: 'sc-green',
          sub: (future ? money(a.chargedToDate) + ' to date · ' + money(a.chargedUpcoming) + ' upcoming'

        { label: 'Collected', val: money(a.collected), cls: 'sc-blue',

        { label: 'Outstanding', val: money(a.outstanding), cls: a.outstanding > 0 ? 'sc-amber' : 'sc-muted',
          sub: a.notYetDue > 0 ? money(a.dueNow) + ' due · ' + money(a.notYetDue) + ' not yet due'

    // Per-vertical view (Camping / Golf / Pool-Aquatics): a scoped slice of the
    // same facility rows, honoring the status filter. Same widgets as the
    // Summary, plus a monthly trend — these verticals are strongly seasonal.
    function VerticalView({ rows, err, statusSel, vert }) {
      if (err) return e('div', { className: 'empty' },
        e('div', { className: 'em-icon' }, '⚠️'),
        e('div', { className: 'em-title' }, 'Could not load facility data'),
        e('div', { className: 'em-sub' }, String(err)));
      if (rows === null) return e('div', { className: 'empty' },
        e('div', { className: 'em-title', style: { color: '#9ca3af' } }, 'Loading ' + vert.label + ' data…'),
        e('div', { className: 'fac-spin' }));

      const ss = new Set(statusSel);
      const scoped = rows.filter(r => vertRowMatch(r, vert.key) && ss.has(lc(r['Status'])));
      if (!scoped.length) return e('div', { className: 'empty' },
        e('div', { className: 'em-icon' }, vert.icon || '🗓️'),
        e('div', { className: 'em-title' }, 'No ' + vert.label + ' bookings in this range'),
        e('div', { className: 'em-sub' }, 'This org may not run ' + vert.label.toLowerCase() + ' sites, or there were none booked with the current status filter. Try a wider date range.'));

      const isCanceled = r => lc(r['Status']) === 'canceled';
      const isInstant  = r => lc(r['Booking Type']) === 'instant';
      const rev        = r => isCanceled(r) ? 0 : (Number(r['Total']) || 0);

      const bookings  = scoped.length;
      const revenue   = scoped.reduce((s, r) => s + rev(r), 0);
      const canceled  = scoped.filter(isCanceled).length;
      const confirmed = scoped.filter(r => lc(r['Status']) === 'confirmed').length;
      const inprog    = scoped.filter(r => lc(r['Status']) === 'in-progress').length;
      const instant   = scoped.filter(isInstant).length;
      const managed   = bookings - instant;
      const instRev   = scoped.filter(isInstant).reduce((s, r) => s + rev(r), 0);
      const mgdRev    = revenue - instRev;
      const guests    = scoped.reduce((s, r) => s + (Number(r['Head Cnt']) || 0), 0);
      const avgParty  = bookings ? guests / bookings : 0;
      const sites     = new Set(scoped.map(r => (r['Facility'] || '') + '|' + (r['Location'] || ''))).size;

      // Monthly trend (bookings + revenue by YYYY-MM)
      const byMonth = {};
      scoped.forEach(r => {
        const d = String(r['Date'] || '').slice(0, 7);
        if (!/^\d{4}-\d{2}$/.test(d)) return;
        if (!byMonth[d]) byMonth[d] = { bookings: 0, revenue: 0, canceled: 0 };
        byMonth[d].bookings++; byMonth[d].revenue += rev(r); if (isCanceled(r)) byMonth[d].canceled++;
      });
      const months = Object.keys(byMonth).sort();
      const maxMonthRev = Math.max(1, ...months.map(m => byMonth[m].revenue));

      // Top sites within the vertical
      const bySite = {};
      scoped.forEach(r => {
        const key = (r['Facility'] || '—') + '||' + (r['Location'] || '');
        if (!bySite[key]) bySite[key] = { facility: r['Facility'] || '—', location: r['Location'] || '', bookings: 0, canceled: 0, revenue: 0, guests: 0 };
        bySite[key].bookings++; bySite[key].revenue += rev(r); bySite[key].guests += Number(r['Head Cnt']) || 0; if (isCanceled(r)) bySite[key].canceled++;
      });
      const topSites = Object.values(bySite).sort((a, b) => b.revenue - a.revenue).slice(0, 12);

      const seg = (n, color, label) => n > 0 ? e('div', {
        className: 'seg', style: { width: (n / bookings * 100) + '%', background: color }
      }, (n / bookings >= 0.08 ? label : '')) : null;

      const cards = [
        { label: 'Bookings', val: bookings.toLocaleString(), cls: 'sc-blue', sub: vert.label + ' reservations in view' },
        { label: 'Charged', val: money(revenue), cls: 'sc-green', sub: 'excludes canceled' },
        { label: 'Instant-Book', val: pct(instant, bookings), cls: 'sc-purple', sub: instant.toLocaleString() + ' bkgs · ' + money(instRev) },
        { label: 'Managed', val: pct(managed, bookings), cls: 'sc-amber', sub: managed.toLocaleString() + ' bkgs · ' + money(mgdRev) },
        { label: 'Cancellation Rate', val: pct(canceled, bookings), cls: 'sc-red', sub: canceled.toLocaleString() + ' of ' + bookings.toLocaleString() + ' canceled' },
        { label: 'Active Sites', val: sites.toLocaleString(), cls: 'sc-muted', sub: 'with bookings in view' },
        { label: 'Total Guests', val: guests.toLocaleString(), cls: 'sc-muted', sub: 'sum of head counts' },
        { label: 'Avg Party', val: avgParty ? avgParty.toFixed(1) : '—', cls: 'sc-muted', sub: 'guests per booking' },
      ];

      return e('div', null,
        e('div', { className: 'sum-cards' },
          cards.map((c, i) => e('div', { className: 'sum-card', key: i },
            e('div', { className: 'sc-label' }, c.label),
            e('div', { className: 'sc-val ' + c.cls }, c.val),
            e('div', { className: 'sc-sub' }, c.sub),
          ))
        ),
        // Booking status mix
        e('div', { className: 'sum-bar-wrap' },
          e('div', { className: 'sum-bar-label' }, 'Booking status mix'),
          e('div', { className: 'sum-bar' }, seg(confirmed, '#16a34a', 'Confirmed'), seg(inprog, '#2563eb', 'In-progress'), seg(canceled, '#dc2626', 'Canceled')),
          e('div', { className: 'sum-legend' },
            e('span', null, e('span', { className: 'sum-dot', style: { background: '#16a34a' } }), 'Confirmed (' + confirmed + ')'),
            e('span', null, e('span', { className: 'sum-dot', style: { background: '#2563eb' } }), 'In-progress (' + inprog + ')'),
            e('span', null, e('span', { className: 'sum-dot', style: { background: '#dc2626' } }), 'Canceled (' + canceled + ')')),
        ),
        // Monthly trend (seasonality)
        months.length > 1 ? e('div', { className: 'vtrend-wrap' },
          e('div', { className: 'sum-bar-label' }, 'Bookings & revenue by month'),
          e('div', { className: 'vtrend' },
            months.map((m, i) => e('div', { className: 'vtrend-row', key: i },
              e('div', { className: 'vtrend-mo' }, monthLabel(m)),
              e('div', { className: 'vtrend-track' },
                e('div', { className: 'vtrend-bar', style: { width: (byMonth[m].revenue / maxMonthRev * 100) + '%' } })),
              e('div', { className: 'vtrend-rev' }, money(byMonth[m].revenue)),
              e('div', { className: 'vtrend-bk' }, byMonth[m].bookings.toLocaleString() + ' bkgs'),
            )),
          ),
        ) : null,
        // Top sites in this vertical
        e('table', { className: 'sum-cat-table' },
          e('caption', null, 'Top ' + vert.label + ' sites by revenue ',
            e('span', { style: { fontWeight: 400, color: '#9ca3af', fontSize: 11 } }, '· ', e('span', { className: 'flag' }, '⚠ HIGH CANCEL'), ' ≥' + HIGH_CANCEL + '% canceled')),
          e('thead', null, e('tr', null,
            e('th', null, 'Site'),
            e('th', null, 'Location'),
            e('th', { className: 'num' }, 'Bookings'),
            e('th', { className: 'num' }, 'Avg party'),
            e('th', { className: 'num' }, 'Cancel %'),
            e('th', { className: 'num' }, 'Charged'),
          )),
          e('tbody', null,
            topSites.map((s, i) => {
              const crPct = s.bookings ? (s.canceled / s.bookings) * 100 : 0;
              return e('tr', { key: i },
                e('td', null, s.facility, crPct >= HIGH_CANCEL ? e('span', { className: 'flag', style: { marginLeft: 6 } }, '⚠') : null),
                e('td', null, s.location),
                e('td', { className: 'num' }, s.bookings),
                e('td', { className: 'num' }, s.bookings ? (s.guests / s.bookings).toFixed(1) : '—'),
                e('td', { className: 'num' }, pct(s.canceled, s.bookings)),
                e('td', { className: 'num' }, money(s.revenue)),
              );
            }),
          ),
        ),
        e('div', { className: 'section-note' }, vert.label + ' · ' + bookings.toLocaleString() + ' bookings in range · ' + vertScopeNote(vert.key)),
      );
    }

    // ── Pool / Aquatics — a richer, visual take on the vertical view ─────────

    function AquaBanner({ bookings, revenue, guests, avgParty, sites }) {

    // Labeled 100%-stacked split bar. parts: [{ label, short, n, color }]

    // ── Lane hours ───────────────────────────────────────────────────────
    // Re-fetches card 17294 for the same reason OutdoorEventsView does: only
    // that card carries the wall-clock Begin/End, and the hub's own feed
    // (19570) does not. No new SQL, and the hour helpers are the shared ones —
    // two implementations of "hours booked" would drift and then two tabs would
    // report different numbers for the same pool.
    //
    // IT MUST RUN refineRows() BEFORE FILTERING, and that is the whole point of
    // this panel existing. El Segundo types its 70 swim lanes `court` so they
    // instant-book, so a filter on the RAW Site Type === 'pool' returns the 24
    // pool-typed sites and misses every lane — which is precisely the bug this
    // change fixes, reproduced one component over.
    function AquaticsHours({ start, end }) {
      const [data, setData] = React.useState({ rows: null, err: null });

      React.useEffect(() => {
        let dead = false;
        setData({ rows: null, err: null });
        const tok = CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '';
        fetch('/' + CFG.slug + '/facility/api/data?start_date=' + start + '&end_date=' + end + tok)
          .then(r => { if (!r.ok) throw new Error('Server returned ' + r.status); return r.json(); })
          .then(j => {
            if (dead) return;
            // refine FIRST, then scope — see the note above.
            const refined = refineRows(j.rows || []);
            // Through the SAME predicate as every other aquatics surface. This
            // used to hardcode 'pool', which is how the lane-hours panel would
            // have gone on reporting eleven hours at an org whose lanes are
            // typed `court` while the tab beside it reported thousands.
            setData({ rows: refined.filter(r => vertRowMatch(r, 'aquatics')), err: null });
          })
          .catch(err => { if (!dead) setData({ rows: null, err: err.message || String(err) }); });
        return () => { dead = true; };
      }, [start, end]);

      // A feed that has not answered is not an empty answer, and a failed one is
      // not "this pool was never booked" — three states, three renderings.
      if (data.err) return e('div', { className: 'aqua-sec' },
        e('h3', null, 'Lane hours'),
        e('div', { className: 'camp-note' }, '\u26a0 Could not load the hourly feed, so lane hours are not shown. This does not mean there were none.'));
      if (data.rows === null) return e('div', { className: 'aqua-sec' },
        e('h3', null, 'Lane hours'), e('div', { className: 'fac-spin' }));
      const rows = data.rows;
      const arrivals = rows.filter(oeIsArrival);
      const timed = arrivals.filter(r => oeRowHours(r) != null);
      if (!timed.length) return null;

      const totalHours = timed.reduce((a, r) => a + (oeRowHours(r) || 0), 0);
      const multiDay = arrivals.length - timed.length;

      // Hours per lane, so "which lane is spoken for" is answerable.
      const byLane = {};
      timed.forEach(r => {
        const k = r['Facility'] || '(unnamed)';
        if (!byLane[k]) byLane[k] = { hours: 0, bookings: 0, location: r['Location'] || '' };
        byLane[k].hours += oeRowHours(r) || 0;
        byLane[k].bookings++;
      });
      const lanes = Object.keys(byLane).map(k => ({ lane: k, ...byLane[k] }))
        .sort((a, b) => b.hours - a.hours);

      const hg = oeHeatGrid(arrivals);
      const heat = hg.heat, heatHours = hg.hours, heatMax = hg.max;
      const busiestHour = hg.peak, hourTotals = hg.hourTotals;

      return e(React.Fragment, null,
        e('div', { className: 'aqua-sec' },
          e('h3', null, 'Lane hours', e('span', { className: 'sub' },
            timed.length.toLocaleString() + ' timed booking' + (timed.length === 1 ? '' : 's')
            + ' across ' + lanes.length.toLocaleString() + ' lane' + (lanes.length === 1 ? '' : 's'))),
          e('div', { className: 'sum-cards', 'data-aq-hours': String(Math.round(totalHours)) },
            e('div', { className: 'sum-card' },
              e('div', { className: 'sc-label' }, 'Hours booked'),
              e('div', { className: 'sc-val sc-blue' }, Math.round(totalHours).toLocaleString()),
              e('div', { className: 'sc-sub' }, 'water time sold in this range')),
            e('div', { className: 'sum-card' },
              e('div', { className: 'sc-label' }, 'Lanes in use'),
              e('div', { className: 'sc-val sc-blue', 'data-aq-lanes': String(lanes.length) }, lanes.length.toLocaleString()),
              e('div', { className: 'sc-sub' }, 'of the lanes booked at least once')),
            e('div', { className: 'sum-card' },
              e('div', { className: 'sc-label' }, 'Avg block' ),
              e('div', { className: 'sc-val' }, oeFmtHrs(totalHours / timed.length)),
              e('div', { className: 'sc-sub' }, 'per booking'))),
          e('div', { className: 'camp-note' },
            'Every denominator here is a lane that was BOOKED at least once — the feed contains no unbooked lane, so no share of total inventory is claimed. ',
            multiDay ? e('span', null, e('b', null, oePlural(multiDay, 'multi-day booking')),
              ' carr' + (multiDay === 1 ? 'ies' : 'y') + ' no per-day hours and ' + (multiDay === 1 ? 'is' : 'are') + ' excluded from every hour figure above.') : null)),

        e('div', { className: 'aqua-sec' },
          e('h3', null, 'When the water is spoken for', e('span', { className: 'sub' }, 'bookings covering each hour')),
          e('div', { className: 'aqua-panel' },
            e('div', { className: 'oe-heat-wrap' },
              e('div', { className: 'oe-heat', 'data-aq-heat': 'true',
                'data-aq-peak': busiestHour >= 0 ? oeHour12(busiestHour) : 'none',
                'data-aq-timed': String(hg.timed),
                style: { gridTemplateColumns: '38px repeat(' + heatHours.length + ', minmax(20px, 1fr))' } },
                e('div', { className: 'oe-h-lbl' }, ''),
                heatHours.map((h, i) => e('div', { key: 'ah' + i, className: 'oe-h-hd' }, oeHour12(h))),
                OE_DOW.map((dname, dw) => [
                  e('div', { key: 'ad' + dw, className: 'oe-h-lbl' }, dname),
                  heatHours.map((h, i) => {
                    const v = heat[dw][h];
                    return e('div', { key: 'ac' + dw + '-' + i, className: 'oe-h-cell',
                      style: { background: v ? OE_RAMP[Math.min(5, 1 + Math.floor(v / heatMax * 4.999))] : OE_RAMP[0], color: v / heatMax > 0.6 ? '#fff' : '#8a8578' },
                      title: dname + ' ' + oeHour12(h) + ' \u00b7 ' + v + ' booking' + (v === 1 ? '' : 's') + ' in use' },
                      v ? String(v) : '');
                  }),
                ]))),
            e('div', { className: 'camp-note' },
              busiestHour >= 0 && hourTotals[busiestHour] > 0
                ? e('span', null, 'Peak is ', e('b', null, oeHour12(busiestHour) + 'm'), ' with ',
                    e('b', null, hourTotals[busiestHour].toLocaleString()), ' bookings in the water. ')
                : null,
              'A booking counts in every hour it COVERS, not the hour it starts — which lane time is sold is the question, not when the paperwork begins.'))),

        e('div', { className: 'aqua-sec' },
          e('h3', null, 'Busiest lanes', e('span', { className: 'sub' }, 'by hours booked')),
          e(HBars, { data: lanes.slice(0, 12).map(l => ({
            label: l.lane, v: l.hours,
            valText: oeFmtHrs(l.hours),
            sub: l.bookings.toLocaleString() + ' booking' + (l.bookings === 1 ? '' : 's') + (l.location ? ' \u00b7 ' + l.location : ''),
          })) })));

    // ── Aquatics scope settings ──────────────────────────────────────────────
    // The gear sits ON the Aquatics tab rather than in the global toolbar,
    // because that is where its effect is. Three states, exactly as on the Class
    // Roster: a working gear for a proven admin, a LOCKED one that opens the

    // requires the key, so this is a way to obtain the credential and never a
    // way to skip it.
    const rsAdmin    = () => !!(window.ORG_CONFIG || {}).settingsAdmin;
    const rsLockable = () => !!(window.ORG_CONFIG || {}).settingsLockable;
    const rsFlagOff  = () => !!(window.ORG_CONFIG || {}).settingsFlagOff;
    const rsKey      = () => String((window.ORG_CONFIG || {}).adminKey || '');
    const rsMeta     = () => (window.ORG_CONFIG || {}).settingsMeta || {};

    const SITE_TYPE_LABEL = {
      court: 'Courts', rink: 'Ice rinks', gym: 'Gyms',
      field: 'Fields', room: 'Rooms', other: 'Other',
    };

    // Out of the toolbar's subtree and onto <body>, so `.toolbar label` cannot
    // reach the sheet's checkbox rows. Falls back to rendering in place if
    // ReactDOM is somehow unavailable, rather than losing the dialog.
    function portal(node) {
      return (window.ReactDOM && ReactDOM.createPortal)
        ? ReactDOM.createPortal(node, document.body) : node;

    function AquaticsSettings({ rows }) {
      const [open, setOpen] = React.useState(false);
      const [busy, setBusy] = React.useState(false);
      const [err, setErr]   = React.useState(null);
      const cur = (window.ORG_CONFIG || {}).settings || {};
      const [types, setTypes] = React.useState(() => new Set(cur.aquaticsExtraTypes || []));
      const [scope, setScope] = React.useState(() => new Set(cur.aquaticsScope || []));
      const [unlock, setUnlock] = React.useState(false);
      const [pw, setPw] = React.useState('');

      // THE OPTIONS COME FROM THE FEED, so an option can never be unpickable —
      // the same rule as every other picker in this repo. A location already in
      // the saved scope is kept in the list even if this window has no bookings
      // for it, or an admin could never untick what they ticked last month.
      const places = React.useMemo(() => {
        const set = new Set(cur.aquaticsScope || []);
        (rows || []).forEach(r => { if (r['Location']) set.add(r['Location']); });
        return Array.from(set).sort((a, b) => a.localeCompare(b));
      }, [rows]);

      // What each extra type would actually ADD, counted over the rows on
      // screen. A checkbox labelled "Courts" is a guess; "Courts (+67 sites)" is
      // a decision. Sites, not bookings — the question is which sites belong on
      // this tab.
      const wouldAdd = React.useMemo(() => {
        const out = {};
        (rsMeta().aquaticsTypeCatalogue || []).forEach(t => {
          const seen = new Set();
          (rows || []).forEach(r => {
            if (r['Site Type'] !== t) return;
            if (scope.size && !(scope.has(r['Location']) || scope.has(r['Facility']))) return;
            if (r['Site ID'] || r['Facility']) seen.add(r['Site ID'] || r['Facility']);
          });
          out[t] = seen.size;
        });
        return out;
      }, [rows, scope]);

      async function save(patch) {
        setBusy(true); setErr(null);
        try {
          const base = '/' + CFG.slug + '/facility/api/settings';
          const q = [];
          if (CFG.token) q.push('token=' + encodeURIComponent(CFG.token));
          if (rsKey()) q.push('admin=' + encodeURIComponent(rsKey()));
          const resp = await fetch(base + (q.length ? '?' + q.join('&') : ''), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(patch),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) { setErr(data.error || 'Could not save the settings.'); return; }
          // The settings decide which site types the tab counts AT ALL, so the
          // honest thing after a save is a reload rather than half-applying them
          // to a page already in flight.
          window.location.reload();
        } catch (ex) {
          setErr('Could not save the settings: ' + (ex.message || ex));
        } finally { setBusy(false); }
      }

      const gear =
        rsAdmin()   ? e('button', { className: 'btn-settings', onClick: () => setOpen(true),
                                    'data-aqrs-open': true,
                                    title: 'Which sites count as aquatics for this organization' },
                                    '\u2699')
      : rsLockable() ? e('button', { className: 'btn-settings', 'data-aqrs-locked': true,
                                    onClick: () => { setUnlock(true); setErr(null); },
                                    title: 'Aquatics scope \u2014 admin password required' },
                                    '\u2699')
      : rsFlagOff() ? e('button', { className: 'btn-settings is-off', 'data-aqrs-flagoff': true, disabled: true,
                                    title: 'Report settings are switched off for this deployment.' },
                                    '\u2699')
      : null;
      if (!gear) return null;

      // Obtaining the credential, in place. The route is the generic one and it
      // is throttled server-side (5 per IP per 15 minutes, and the correct
      // password is refused while locked out); on success it sets the same
      // HttpOnly cookie the admin dashboard sets and the page RELOADS, because
      // `settingsAdmin` is injected server-side and decides the first render.
      // Revealing the panel client-side would be claiming an authorisation the

      async function submitUnlock(ev) {
        ev.preventDefault();
        setBusy(true); setErr(null);
        try {
          const base = '/' + CFG.slug + '/facility/api/settings-unlock';
          const resp = await fetch(base + (CFG.token ? '?token=' + encodeURIComponent(CFG.token) : ''), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw }),
          });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok || !data.ok) { setErr(data.error || 'That password was not accepted.'); return; }

      const inprog    = scoped.filter(r => lc(r['Status']) === 'in-progress').length;
      const instant   = scoped.filter(isInstant).length;
      const managed   = bookings - instant;
      const instRev   = scoped.filter(isInstant).reduce((s, r) => s + rev(r), 0);

      const avgParty  = bookings ? guests / bookings : 0;
      const sites     = new Set(scoped.map(r => (r['Facility'] || '') + '|' + (r['Location'] || ''))).size;

      // Monthly + weekday×month heatmap
      const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const byMonth = {};

      scoped.forEach(r => {
        const s = String(r['Date'] || '');
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
        if (!m) return;
        const ym = m[1] + '-' + m[2];
        const dow = new Date(+m[1], +m[2] - 1, +m[3]).getDay();

      });
      const months = Object.keys(byMonth).sort();
      const maxMonthRev = Math.max(1, ...months.map(m => byMonth[m].revenue));
      const hmMax = Math.max(1, ...months.flatMap(m => hm[m].map(c => c.n)));
      const HM_COLORS = ['#eef3f5', '#cbeef6', '#86d6e6', '#38b2ce', '#0e7d97'];

        bySite[key].bookings++; bySite[key].revenue += rev(r); bySite[key].guests += headCnt(r); if (isCanceled(r)) bySite[key].canceled++;
      });
      const topSites = Object.values(bySite).sort((a, b) => b.revenue - a.revenue).slice(0, 12);

      // Party-size distribution (bookings with a head count)
      const PARTY = [
        { lbl: '1–5', lo: 1, hi: 5 }, { lbl: '6–15', lo: 6, hi: 15 }, { lbl: '16–30', lo: 16, hi: 30 },

      ];
      const withParty = scoped.filter(r => headCnt(r) >= 1);
      const partyData = PARTY.map(b => {

        return { label: b.lbl + ' guests', v: n, valText: n.toLocaleString() };
      });

      // Usage category mix
      const byUse = {};
      scoped.forEach(r => {
        const u = (r['Usage Category'] || '').trim();
        if (!u) return;
        if (!byUse[u]) byUse[u] = { bookings: 0, revenue: 0 };
        byUse[u].bookings++; byUse[u].revenue += rev(r);
      });
      const useKeys = Object.keys(byUse).sort((a, b) => byUse[b].bookings - byUse[a].bookings).slice(0, 8);

      const kpis = [
        { label: 'Bookings', val: bookings.toLocaleString(), cls: 'sc-blue', sub: 'pool reservations in view' },
        { label: 'Charged', val: money(revenue), cls: 'sc-green', sub: 'excludes canceled' },
        { label: 'Instant-Book', val: pct(instant, bookings), cls: 'sc-purple', sub: instant.toLocaleString() + ' bkgs · ' + money(instRev) },
        { label: 'Managed', val: pct(managed, bookings), cls: 'sc-amber', sub: managed.toLocaleString() + ' bkgs · ' + money(mgdRev) },
        { label: 'Cancellation Rate', val: pct(canceled, bookings), cls: 'sc-red', sub: canceled.toLocaleString() + ' of ' + bookings.toLocaleString() + ' canceled' },
        { label: 'Active Sites', val: sites.toLocaleString(), cls: 'sc-muted', sub: 'with bookings in view' },
        { label: 'Total Guests', val: guests.toLocaleString(), cls: 'sc-muted', sub: 'sum of head counts' },
        { label: 'Avg Party', val: avgParty ? avgParty.toFixed(1) : '—', cls: 'sc-muted', sub: 'guests per booking' },
      ];

      return e('div', null,
        e(AquaBanner, { bookings, revenue, guests, avgParty, sites }),
        // WHAT THIS TAB COUNTS, AND THE CONTROL THAT CHANGES IT, BOTH GO ABOVE

        e('div', { className: 'aq-scopebar', 'data-aq-scope': true },
          e('span', null, vertScopeNote(vert.key))),
        e('div', { className: 'sum-cards' },
          kpis.map((c, i) => e('div', { className: 'sum-card', key: i },
            e('div', { className: 'sc-label' }, c.label),
            e('div', { className: 'sc-val ' + c.cls }, c.val),
            e('div', { className: 'sc-sub' }, c.sub)))),

        // Heatmap — when the pools get booked
        e('div', { className: 'aqua-sec' },
          e('h3', null, 'When the pools get booked', e('span', { className: 'sub' }, 'bookings by weekday & month — deeper = busier')),
          e('div', { className: 'aqua-panel' },
            e('div', { className: 'aqua-hm', style: { gridTemplateColumns: '68px repeat(7, minmax(0,1fr))' } },
              e('div', { className: 'hm-mo' }, ''),
              DOW.map((d, i) => e('div', { key: 'h' + i, className: 'hm-hd' }, d)),
              months.flatMap(m => [
                e('div', { key: m + 'lbl', className: 'hm-mo' }, monthLabel(m)),
                hm[m].map((c, d) => {
                  const lvl = hmLevel(c.n);
                  return e('div', {
                    key: m + '-' + d, className: 'hm-cell',
                    style: { background: HM_COLORS[lvl], color: lvl >= 3 ? '#f0fdff' : (lvl === 0 ? '#cbd5e1' : '#0f172a') },
                    title: DOW[d] + 's · ' + monthLabel(m) + ' · ' + c.n.toLocaleString() + ' booking' + (c.n === 1 ? '' : 's') + ' · ' + money(c.rev),
                  }, c.n || '');
                }),
              ]),

            e('div', { className: 'aqua-hm-legend' }, 'Fewer',
              HM_COLORS.map((c, i) => e('i', { key: i, style: { background: c } })), 'More'),

        // Revenue by site + party size
        e('div', { className: 'aqua-sec' },

            e('div', { className: 'aqua-panel' },

              e(HBars, { data: topSites.map(s => ({ label: s.facility.indexOf(' - ') !== -1 ? s.facility.split(' - ').slice(1).join(' - ') : s.facility, title: s.facility, v: s.revenue, valText: money(s.revenue), sub: s.bookings + ' bkgs' })) })),
            e('div', { className: 'aqua-panel' },
              e('h4', null, 'Party size', e('span', { className: 'n' }, withParty.length.toLocaleString() + ' of ' + bookings.toLocaleString() + ' with a head count')),
              withParty.length
                ? e(HBars, { data: partyData })
                : e('div', { style: { fontSize: 12, color: '#9ca3af', padding: '8px 0' } }, 'No head-count data on these bookings.')))),

        e('div', { className: 'aqua-sec' },

            e('div', { className: 'aqua-panel' },
              e('h4', null, 'Booking mix'),
              e('div', { style: { fontSize: 10, color: '#888', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.5px', margin: '2px 0 5px' } }, 'Channel'),
              e(SplitBar, { parts: [

              e('div', { style: { fontSize: 10, color: '#888', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '.5px', margin: '14px 0 5px' } }, 'Status'),
              e(SplitBar, { parts: [

                { label: 'In-progress', short: 'In-progress', n: inprog, color: '#2563eb' },

            useKeys.length ? e('div', { className: 'aqua-panel' },
              e('h4', null, 'Usage type', e('span', { className: 'n' }, 'by bookings')),
              e(HBars, { data: useKeys.map(u => ({ label: u, v: byUse[u].bookings, valText: byUse[u].bookings.toLocaleString(), sub: money(byUse[u].revenue) })) })) : null)),

        // Monthly seasonality

    const CAMP_SCENE = '<svg viewBox="0 0 1200 172" preserveAspectRatio="xMidYMid slice">' +

    // Leaflet site map — circle per campsite, colored by booked days in range.

    const CAMP_RAMP = ['#dcedd6', '#a4d3a0', '#5fae70', '#2c8a50', '#155f36'];
    function CampMap({ loc, findStat, editable }) {
      const mapRef = React.useRef(null);

      // Plain-DOM popup editor (Leaflet popups live outside React).
      const mkEditorEl = (mk, lmk, onDelete) => {
        const div = document.createElement('div');
        div.className = 'camp-mk-form';
        div.innerHTML =
          '<input class="mk-l" maxlength="80" placeholder="Name (e.g. Boat Ramp)">' +
          '<textarea class="mk-t" maxlength="500" rows="2" placeholder="Notes (optional)"></textarea>' +
          '<div class="mk-row"><label>Color <input type="color" class="mk-c"></label><button type="button" class="mk-del">🗑 Remove</button></div>';
        const li = div.querySelector('.mk-l'), ti = div.querySelector('.mk-t'), ci = div.querySelector('.mk-c');
        li.value = mk.label || ''; ti.value = mk.text || '';
        ci.value = /^#[0-9a-fA-F]{6}$/.test(mk.color || '') ? mk.color : '#38bdf8';
        li.addEventListener('input', () => { mk.label = li.value; });
        ti.addEventListener('input', () => { mk.text = ti.value; });
        ci.addEventListener('input', () => { mk.color = ci.value; lmk.setIcon(mkIcon(mk.color, true)); });
        div.querySelector('.mk-del').addEventListener('click', onDelete);
        return div;
      };

      React.useEffect(() => {
        const el = mapRef.current;
        if (!el || !loc.sites.length || typeof L === 'undefined') return;

        const maxD = Math.max(1, ...loc.sites.map(s => { const st = findStat(s, loc.name); return st ? st.days : 0; }));

        const addMk = (mk, openNow) => {

        };
        (loc.markers || []).forEach(m => addMk(Object.assign({}, m), false));
        loc.sites.forEach(s => {
          const st = findStat(s, loc.name);

          const num = String(s.name).replace(/^Site\s*0?/i, '');
          if (editing) {
            const m = L.marker([s.lat, s.lng], {

              icon: L.divIcon({ className: '', iconSize: [24, 24], iconAnchor: [12, 12],

          } else {
            const m = L.circleMarker([s.lat, s.lng], {
              radius: d ? 10 : 6.5, color: d ? '#155f36' : '#94a3b8', weight: 1.5,
              fillColor: fill, fillOpacity: d ? .92 : .55,

            m.bindPopup('<div class="camp-popup"><b>' + s.name + '</b>' + (s.area ? ' · ' + s.area : '') + '<br>' +
              (st ? st.stays + ' stay' + (st.stays === 1 ? '' : 's') + ' · ' + st.days + ' day' + (st.days === 1 ? '' : 's') + ' booked · ' + money(st.rev)
                  : 'No bookings in this range') +
              (s.price != null ? '<br>$' + s.price + '/night' + (s.kind ? ' · ' + s.kind.replace(/-/g, ' ') : '') : '') +
              (s.photo ? '<img src="' + s.photo + '" loading="lazy">' : '') + '</div>');
            m.bindTooltip(num, { permanent: true, direction: 'center', className: 'camp-site-lbl' });

        liveRef.current = { map, markers, mks, addMk };
        return () => { map.remove(); liveRef.current = null; };
      }, [loc, editing]);

      const addMarker = () => {
        const live = liveRef.current; if (!live) return;

      const save = () => {

          const ll = x.lmk.getLatLng();

        });
        const q = '?token=' + encodeURIComponent(CFG.token || '') +
          (loc.id && loc.id !== 'default' ? '&location=' + encodeURIComponent(loc.id) : '');
        const post = (path, body) => fetch('/' + CFG.slug + path + q, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ token: CFG.token || '' }, body)),
        }).then(r => r.json()).then(j => { if (!j || !j.ok) throw new Error((j && j.error) || 'save rejected'); return j; });
        Promise.all([
          post('/facilities/api/campsite-positions', { positions }),
          post('/facilities/api/campsite-markers', { markers: outMks }),
        ]).then(() => {
          loc.sites.forEach(s => { const m = live.markers[s.id]; if (m) { const ll = m.getLatLng(); s.lat = ll.lat; s.lng = ll.lng; } });
          loc.markers = outMks;
          setEditing(false); setMsg('Saved ✓');
        }).catch(err => setMsg('Save failed: ' + (err.message || err))).finally(() => setSaving(false));
      };

      const pill = { fontSize: 10, fontWeight: 600, borderRadius: 12, padding: '2px 10px', cursor: 'pointer', marginLeft: 8 };
      return e('div', null,
        e('div', { style: { display: 'flex', alignItems: 'center', marginBottom: 8, minHeight: 22 } },
          e('span', { style: { fontSize: 10.5, color: '#9ca3af' } },
            editing ? 'Drag site pins & markers into place; click a marker to name it. Save when done.' : 'Click a site for details.'),
          msg ? e('span', { style: { fontSize: 10.5, marginLeft: 8, fontWeight: 600, color: msg.indexOf('failed') !== -1 ? '#dc2626' : '#2c8a50' } }, msg) : null,
          e('span', { style: { marginLeft: 'auto', whiteSpace: 'nowrap' } },
            editable && !editing ? e('button', { onClick: () => { setMsg(''); setEditing(true); }, style: Object.assign({}, pill, { color: '#2c8a50', background: 'none', border: '1px solid #a4d3a0' }) }, '✏️ Edit map') : null,
            editing ? e('button', { onClick: addMarker, disabled: saving, style: Object.assign({}, pill, { color: '#0369a1', background: 'none', border: '1px solid #7dd3fc' }) }, '📍 Add marker') : null,
            editing ? e('button', { onClick: () => { setMsg(''); setEditing(false); }, disabled: saving, style: Object.assign({}, pill, { color: '#6b7280', background: 'none', border: '1px solid #d6d3cb' }) }, 'Cancel') : null,
            editing ? e('button', { onClick: save, disabled: saving, style: Object.assign({}, pill, { color: '#fff', background: '#2c8a50', border: '1px solid #2c8a50' }) }, saving ? 'Saving…' : '💾 Save') : null)),

    // ── Public map link ─────────────────────────────────────────────────────
    // The map above is the ADMIN interface (drag pins, add markers, save). This
    // is the same campground rendered for the public at /:org/campmap, which
    // takes NO token — that is what makes it safe to hand to a camper, tape to a
    // noticeboard as a QR, or drop in an iframe on a parks website.
    //
    // The token is deliberately absent from this URL and must stay absent. On
    // the campmap page a token does more than authenticate: it unlocks editing.
    // Pasting an address-bar URL that still carries ?token= would hand a camper
    // an editable map AND the org token that opens every other report for that
    // org. So the URL is built here from origin + slug, never from location.href.
    /* How campers are using the public map. Same events that go to our Slack
       feed, handed back to the org that owns the campground — until now the only
       place this traffic showed up was ours.
       Per ORG, not per location: events carry no location, so rendering this
       inside the per-location loop would repeat one identical row N times and
       imply each location earned it. */
    function CampMapStats() {
      const [d, setD] = React.useState(null);
      const [err, setErr] = React.useState('');
      React.useEffect(() => {
        if (!CFG.token) return;                 // read-only viewer: no analytics
        let live = true;
        fetch('/' + CFG.slug + '/facilities/api/campmap-activity?days=30&token='
              + encodeURIComponent(CFG.token))
          .then(r => r.ok ? r.json() : Promise.reject(new Error('http ' + r.status)))
          .then(j => { if (live) setD(j); })
          .catch(e => { if (live) setErr(e.message); });
        return () => { live = false; };
      }, []);
      // `!d.totals` and not just `!d`: this renders from a network response, and a
      // proxy, a rewritten route or a stub can answer 200 with a body that is not
      // this shape. Reading d.totals.views off that throws inside render and
      // unmounts the whole Camping tab — a blank tab because an analytics strip
      // could not parse is a bad trade.
      if (!CFG.token || err || !d || !d.totals) return null;

      const t = d.totals, p = d.prior;
      // A delta needs a prior period to compare against. With none, say nothing
      // rather than printing a fake +100%.
      const delta = (now, before) => {
        if (!before) return null;   // no prior window to compare against
        const pct = Math.round(((now - before) / before) * 100);
        if (!pct) return e('span', { className: 'sc-muted' }, '\u2014 flat vs prior 30d');
        return e('span', { className: pct > 0 ? 'sc-green' : 'sc-red' },
          (pct > 0 ? '\u25B2 +' : '\u25BC ') + pct + '% vs prior 30d');
      };
      // "2 link" reads like a truncation; name the thing and pluralise it.
      const LABELS = { link: 'link', embed: 'embed', dated: 'dated list', 'site-page': 'site page' };
      const kinds = obj => Object.keys(obj || {}).length
        ? Object.entries(obj).sort((a, b) => b[1] - a[1])
            .map(([k, n]) => n + ' ' + (LABELS[k] || k) + (n === 1 ? '' : 's')).join(' \u00b7 ')
        : null;

      // Book clicks as a share of views is the actionable number: it says whether
      // the map turns lookers into bookers. But a rate on a handful of views is
      // noise dressed as a metric — 6 views and 0 clicks is not "0% conversion",
      // it is not enough traffic to say. Same reasoning as the trend arrows on
      // this tab, which refuse to draw under 14 elapsed days.
      const RATE_MIN_VIEWS = 20;
      const rate = t.views >= RATE_MIN_VIEWS ? Math.round((t.books / t.views) * 100) : null;

      const cards = [
        { label: 'Map views', val: t.views.toLocaleString(), cls: '',
          sub: delta(t.views, p.views) || 'campers who opened the map' },
        { label: 'Sites opened', val: t.sites.toLocaleString(), cls: 'sc-blue',
          sub: d.topSite ? ('most opened: ' + d.topSite.name) : (delta(t.sites, p.sites) || 'site detail views') },
        // The RATE is the actionable half for an org admin — it says whether the
        // map turns lookers into bookers. Which of the two routes they took
        // (dated list vs site page) is interesting to us and is on the endpoint,
        // but it does not tell a parks department anything it can act on.
        { label: 'Book clicks', val: t.books.toLocaleString(), cls: 'sc-green',
          sub: rate != null ? (rate + '% of map views') : 'through to rec.us' },
        { label: 'Searches narrowed', val: t.filters.toLocaleString(), cls: 'sc-amber',
          sub: 'type or amenity filters used' },
        { label: 'Link shares', val: t.shares.toLocaleString(), cls: 'sc-purple',
          sub: kinds(d.shareKinds) || 'staff copied the link or embed' },
      ];

      // The window has to be honest: a log that does not reach back 30 days would
      // otherwise render zeros an admin reads as "nobody uses my map".
      const since = !d.covers && d.logStartsAt
        ? 'since ' + new Date(d.logStartsAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
        : 'last 30 days';

      return e('div', { style: { marginTop: 14 } },
        e('div', { style: { fontSize: 11, fontWeight: 700, textTransform: 'uppercase',
                            letterSpacing: '.5px', color: '#888', marginBottom: 2 } },
          'Public map activity',
          e('span', { style: { fontWeight: 600, textTransform: 'none', letterSpacing: 0,
                               color: '#b8b5ad', marginLeft: 8 } }, since)),
        e('div', { className: 'sum-cards', style: { marginTop: 8, marginBottom: 0 },
                   'data-campmap-stats': String(t.views) },
          cards.map((c, i) => e('div', { className: 'sum-card', key: i },
            e('div', { className: 'sc-label' }, c.label),
            e('div', { className: 'sc-val ' + c.cls }, c.val),
            e('div', { className: 'sc-sub' }, c.sub)))));
    }

    function PublicMapLink({ locId, multi }) {
