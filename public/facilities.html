    // Leaflet utilization map by location (ported from the report's MapView)
    function CourtMap({ grouped }) {
      const mapRef = React.useRef(null);
      const mapInst = React.useRef(null);
      const cacheRef = React.useRef({});
      const [geocoded, setGeocoded] = React.useState(null);

      const locations = React.useMemo(() => {
        const byLoc = {};
        grouped.forEach(g => {
          const loc = g.label.split(' — ')[0] || g.label;
          if (!byLoc[loc]) byLoc[loc] = { name: loc, courts: [], totalUsed: 0, totalAvail: 0 };
          byLoc[loc].courts.push(g);
          byLoc[loc].totalUsed += g.customerHrs + g.programHrs;
          byLoc[loc].totalAvail += g.availHrs;
        });
        return Object.values(byLoc).map(l => { l.utilPct = l.totalAvail > 0 ? Math.round(l.totalUsed / l.totalAvail * 100) : 0; return l; });
      }, [grouped]);

      React.useEffect(() => {
        if (!locations.length) return;
        const cache = cacheRef.current;
        let cityName = CFG.mapCity || '';
        if (!cityName) cityName = (CFG.displayName || '').replace(/\s*(Parks|Recreation|Department|City of|Town of).*$/i, '').replace(/^(City of|Town of)\s*/i, '').trim();
        let vb = '';
        const oc = CFG.coords || null;
        if (oc) { const d = 0.15; vb = '&viewbox=' + (oc.lon - d) + ',' + (oc.lat + d) + ',' + (oc.lon + d) + ',' + (oc.lat - d); }
        let idx = 0; const results = [];
        const next = () => {
          if (idx >= locations.length) {
            for (let i = 0; i < results.length; i++) for (let j = i + 1; j < results.length; j++) {
              const dl = results[i].lat - results[j].lat, dg = results[i].lng - results[j].lng;
              if (Math.sqrt(dl * dl + dg * dg) < 0.003) { const a = j * 2.2; results[j].lat += Math.cos(a) * 0.003; results[j].lng += Math.sin(a) * 0.003; }
            }
            setGeocoded(results); return;
          }
          const loc = locations[idx]; idx++;
          if (cache[loc.name]) { results.push(Object.assign({}, loc, cache[loc.name])); next(); return; }
          const q = loc.name + (cityName ? ', ' + cityName : '');
          setTimeout(() => {
            fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q) + vb)
              .then(r => r.json())
              .then(data => {
                if (data && data[0]) { const c = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) }; cache[loc.name] = c; results.push(Object.assign({}, loc, c)); }
                else if (oc) { const off = (results.length * 0.003) - 0.005; results.push(Object.assign({}, loc, { lat: oc.lat + off, lng: oc.lon + off })); }
                next();
              })
              .catch(() => { if (oc) results.push(Object.assign({}, loc, { lat: oc.lat, lng: oc.lon })); next(); });
          }, 1100);
        };
        next();
      }, [locations]);

      React.useEffect(() => {
        if (!geocoded || !geocoded.length || !mapRef.current || typeof L === 'undefined') return;
        if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; }
        const oc = CFG.coords || null;
        const center = oc ? [oc.lat, oc.lon] : [geocoded[0].lat, geocoded[0].lng];
        const map = L.map(mapRef.current).setView(center, 13);
        mapInst.current = map;
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 18 }).addTo(map);
        geocoded.forEach(loc => {
          const radius = Math.max(18, Math.min(50, loc.courts.length * 12 + 10));
          const color = CU_MAP_COLOR(loc.utilPct);
          const circle = L.circleMarker([loc.lat, loc.lng], { radius, fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8 }).addTo(map);
          const bars = loc.courts.map(c => {
            const cn = c.label.split(' — ')[1] || c.label;
            const p = c.utilPct != null ? c.utilPct.toFixed(0) : 0;
            const bc = CU_MAP_COLOR(p);
            return '<div class="cu-popup-bar-wrap"><div class="cu-popup-bar-label"><span>' + cn + '</span><span style="font-weight:600;color:' + bc + '">' + p + '%</span></div><div class="cu-popup-bar-track"><div class="cu-popup-bar-fill" style="width:' + Math.min(p, 100) + '%;background:' + bc + '"></div></div></div>';
          }).join('');
          circle.bindPopup('<div style="min-width:220px;max-width:300px;max-height:320px;overflow-y:auto"><div class="cu-popup-title">' + loc.name + '</div>' + bars + '<div class="cu-popup-stats">' + loc.courts.length + ' court' + (loc.courts.length > 1 ? 's' : '') + ' • ' + Math.round(loc.totalUsed) + ' hrs used of ' + Math.round(loc.totalAvail) + ' available</div></div>', { maxWidth: 320 });
          L.marker([loc.lat, loc.lng], { interactive: false, icon: L.divIcon({ className: '', html: '<div style="font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center">' + loc.utilPct + '%</div>', iconSize: [40, 20], iconAnchor: [20, 10] }) }).addTo(map);
        });
        if (geocoded.length > 1) map.fitBounds(L.latLngBounds(geocoded.map(l => [l.lat, l.lng])), { padding: [40, 40] });
        return () => { if (mapInst.current) { mapInst.current.remove(); mapInst.current = null; } };
      }, [geocoded]);

      if (!geocoded) return e('div', { className: 'cu-loading' }, e('div', { className: 'fac-spin' }), 'Geocoding ' + locations.length + ' location' + (locations.length > 1 ? 's' : '') + '…');
      return e('div', null,
        e('div', { className: 'cu-map-legend' },
          e('span', null, e('span', { className: 'cu-map-dot', style: { background: '#dc2626' } }), '70%+ High'),
          e('span', null, e('span', { className: 'cu-map-dot', style: { background: '#f59e0b' } }), '40-70% Medium'),
          e('span', null, e('span', { className: 'cu-map-dot', style: { background: '#22c55e' } }), '15-40% Moderate'),
          e('span', null, e('span', { className: 'cu-map-dot', style: { background: '#94a3b8' } }), '<15% Low'),
          e('span', { style: { marginLeft: 'auto', fontSize: 10, color: '#bbb' } }, 'Click a location for court breakdown')),
        e('div', { className: 'cu-map-wrap', ref: mapRef }),
      );
    }

    function CourtUtilizationView({ start, end, courtFilter, theme }) {
      const slug = CFG.slug;
      const [schedules, setSchedules] = React.useState(null);
      const [schedMeta, setSchedMeta] = React.useState(null);
      const [rows, setRows] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      const [loadedStart, setLoadedStart] = React.useState(null);
      const [loadedEnd, setLoadedEnd] = React.useState(null);
      const [selectedLocations, setSelectedLocations] = React.useState([]);
      const [showInstant, setShowInstant] = React.useState(true);
      const [showManaged, setShowManaged] = React.useState(true);
      const [hrsPerDay, setHrsPerDay] = React.useState(16);
      const [metric, setMetric] = React.useState('util');
      const [ctab, setCtab] = React.useState('overview');
      // Which court's hourly grid is open. A single value, not a Set — expanding
      // one court closes the last, because 26 open grids is 3,000 cells.
      const [openCourt, setOpenCourt] = React.useState(null);
      // Day-of-week + hour-of-day slice. Days are 1=Mon..7=Sun; the hour window
      // is [from, to) in 24h, null when off. Both narrow the numerator AND the
      // denominator — see sliceHours/computeCourtAvail.
      const [dowSel, setDowSel] = React.useState(() => {
        const q = new URLSearchParams(window.location.search);
        const days = (q.get('dow') || '').split(',').map(Number).filter(n => n >= 1 && n <= 7);
        return days.length ? days : [1, 2, 3, 4, 5, 6, 7];
      });
      const [hourFrom, setHourFrom] = React.useState(() => {
        const v = parseInt(new URLSearchParams(window.location.search).get('from'), 10);
        return isNaN(v) ? null : v;
      });
      const [hourTo, setHourTo] = React.useState(() => {
        const v = parseInt(new URLSearchParams(window.location.search).get('to'), 10);
        return isNaN(v) ? null : v;
      });
      // insights
      const [insights, setInsights] = React.useState(null);
      const [insLoading, setInsLoading] = React.useState(false);
      const [insError, setInsError] = React.useState(null);
      const [insTrace, setInsTrace] = React.useState(null);
      const [fbSent, setFbSent] = React.useState(false);
      const [fbMode, setFbMode] = React.useState(null);
      const [fbComment, setFbComment] = React.useState('');

      // Schedules once on mount
      React.useEffect(() => {
        (async () => {
          try {
            const r = await fetch(withCuToken('/' + slug + '/court-utilization/api/schedules'));
            if (!r.ok) throw new Error('schedules fetch failed');
            const j = await r.json();
            setSchedules(j.schedules || {});
            setSchedMeta({ fallbackHrsPerDay: j.fallbackHrsPerDay || 12, matchedCount: j.matchedCount || 0, courtCount: j.courtCount || 0 });
            if (j.fallbackHrsPerDay) setHrsPerDay(j.fallbackHrsPerDay);
          } catch (er) { setSchedules({}); setSchedMeta({ fallbackHrsPerDay: 12, matchedCount: 0, courtCount: 0 }); }
        })();
      }, [slug]);

      const load = React.useCallback(async (sd, ed) => {
        setLoading(true); setError(null);
        try {
          const params = new URLSearchParams({ start_date: sd, end_date: ed });
          const r = await fetch(withCuToken('/' + slug + '/court-utilization/api/data?' + params.toString()));
          if (!r.ok) { const t = await r.text(); throw new Error(r.status + ': ' + t.slice(0, 160)); }
          const j = await r.json();
          setRows(Array.isArray(j) ? j : (j.rows || j.data || []));
          setLoadedStart(sd); setLoadedEnd(ed);
        } catch (er) { setError(String(er.message || er)); setRows([]); }
        finally { setLoading(false); }
      }, [slug]);

      React.useEffect(() => { load(start, end); }, [start, end, load]);

      // Keep the slice in the URL — a filtered view is the thing people want to
      // send each other ("pickleball courts, Tuesdays 11-2").
      React.useEffect(() => {
        const q = new URLSearchParams(window.location.search);
        if (dowSel.length < 7) q.set('dow', dowSel.slice().sort().join(',')); else q.delete('dow');
        if (hourFrom != null) q.set('from', String(hourFrom)); else q.delete('from');
        if (hourTo != null && hourFrom != null) q.set('to', String(hourTo)); else q.delete('to');
        const next = window.location.pathname + (q.toString() ? '?' + q.toString() : '') + window.location.hash;
        window.history.replaceState(null, '', next);
      }, [dowSel, hourFrom, hourTo]);

      // ── Derived (verbatim from the standalone report) ──
      const normalized = React.useMemo(() => {
        const all = cuNormalize(rows);
        return courtFilter ? all.filter(r => courtFilter(r.courtName, r.locationName)) : all;
      }, [rows, courtFilter]);
      const allLocations = React.useMemo(() => Array.from(new Set(normalized.map(r => r.locationName).filter(Boolean))).sort(), [normalized]);
      React.useEffect(() => { setSelectedLocations(allLocations); }, [allLocations]);

      const daysInRange = React.useMemo(() => {
        const s = loadedStart || start, en = loadedEnd || end;
        if (!s || !en) return 1;
        return Math.max(1, Math.round((new Date(en + 'T00:00:00') - new Date(s + 'T00:00:00')) / 86400000) + 1);
      }, [loadedStart, loadedEnd, start, end]);

      const dowCounts = React.useMemo(() => {
        const s = loadedStart || start, en = loadedEnd || end;
        if (!s || !en) return {};
        const counts = {}; const cur = new Date(s + 'T12:00:00'); const stop = new Date(en + 'T12:00:00');
        while (cur <= stop) { const jd = cur.getDay(); const dow = jd === 0 ? 7 : jd; counts[dow] = (counts[dow] || 0) + 1; cur.setDate(cur.getDate() + 1); }
        return counts;
      }, [loadedStart, loadedEnd, start, end]);

      const dowSet = React.useMemo(() => new Set(dowSel), [dowSel]);
      const hourWin = React.useMemo(
        () => (hourFrom != null && hourTo != null && hourTo > hourFrom) ? { from: hourFrom, to: hourTo } : null,
        [hourFrom, hourTo]);
      const sliceActive = dowSel.length < 7 || !!hourWin;
      const dowLabel = (() => {
        const sorted = dowSel.slice().sort((a, b) => a - b);
        if (sorted.length === 7) return 'All days';
        if (sorted.join() === '1,2,3,4,5') return 'Weekdays';
        if (sorted.join() === '6,7') return 'Weekends';
        return sorted.map(d => CU_DOW[d - 1]).join(', ');
      })();
      const sliceLabel = dowLabel
        + (hourWin ? ' · ' + cuHour12(hourWin.from) + '-' + cuHour12(hourWin.to) : '');
      // Dates of each weekday that survive the day filter — the denominator's
      // date count everywhere below.
      const selDates = React.useCallback(d => (dowSet.has(d) ? (dowCounts[d] || 0) : 0), [dowSet, dowCounts]);
      const dowOfRow = r => {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(r.localDate || ''));
        if (!m) return null;
        const jd = new Date(+m[1], +m[2] - 1, +m[3]).getDay();
        return jd === 0 ? 7 : jd;
      };
      // Hours of a booking that fall inside the hour window. A 10:00-12:30
      // rental contributes 1.5h to an 11-2 window, not 2.5h — without the clip
      // every filtered number would overcount the edges.
      const sliceHours = React.useCallback(r => {
        if (!hourWin) return r.durationHours || 0;
        if (!r.localStart || !r.localEnd) return 0;
        const st = new Date(r.localStart), en = new Date(r.localEnd);
        if (isNaN(st) || isNaN(en) || en <= st) return 0;
        const ws = new Date(st.getFullYear(), st.getMonth(), st.getDate(), hourWin.from);
        const we = new Date(st.getFullYear(), st.getMonth(), st.getDate());
        we.setHours(hourWin.to);
        const ms = Math.min(en, we) - Math.max(st, ws);
        return ms > 0 ? ms / 3600000 : 0;
      }, [hourWin]);

      const filtered = React.useMemo(() => {
        const locSet = new Set(selectedLocations);
        return normalized.filter(r => {
          if (!locSet.has(r.locationName)) return false;
          const d = dowOfRow(r);
          if (d && !dowSet.has(d)) return false;
          if (hourWin && sliceHours(r) <= 0) return false;   // nothing inside the window
          return true;
        });
      }, [normalized, selectedLocations, dowSet, hourWin, sliceHours]);

      const computeCourtAvail = React.useCallback(label => {
        // With an hour window the window IS the denominator: "of the 11-2 you
        // asked about, X% was booked". Schedules expose hours-per-day, not the
        // windows themselves, so they cannot be intersected with 11-2 — and
        // dividing a 3-hour slice by a 12-hour day would read as noise.
        if (hourWin) {
          const perDay = hourWin.to - hourWin.from;
          let total = 0;
          for (let dow = 1; dow <= 7; dow++) total += perDay * selDates(dow);
          return { availHrs: total, source: 'window' };
        }
        if (schedules && schedules[label] && schedules[label].dailyHrs) {
          const dh = schedules[label].dailyHrs; let total = 0;
          for (let dow = 1; dow <= 7; dow++) total += (dh[dow] || 0) * selDates(dow);
          return { availHrs: total, source: 'schedule' };
        }
        let days = 0;
        for (let dow = 1; dow <= 7; dow++) days += selDates(dow);
        return { availHrs: (Number(hrsPerDay) || 0) * days, source: 'fallback' };
      }, [schedules, selDates, hrsPerDay, hourWin]);

      const grouped = React.useMemo(() => {
        const byCourt = new Map();
        for (const r of filtered) {
          const label = r.locationName + ' — ' + r.courtName;
          if (!byCourt.has(label)) byCourt.set(label, { label, location: r.locationName, court: r.courtName, customer: new Set(), program: new Set(), closure: new Set(), customerHrs: 0, programHrs: 0, closureHrs: 0 });
          const g = byCourt.get(label); const hrs = sliceHours(r);
          if (r.usageCategory === 'Closure / Block') { g.closure.add(r.facilityRentalId); g.closureHrs += hrs; }
          else if (r.bookingSource === 'instant') { g.customer.add(r.facilityRentalId); g.customerHrs += hrs; }
          else { g.program.add(r.facilityRentalId); g.programHrs += hrs; }
        }
        const arr = Array.from(byCourt.values()).map(g => {
          const usedHrs = g.customerHrs + g.programHrs;
          const avail = computeCourtAvail(g.label);
          const pct = avail.availHrs > 0 ? (usedHrs / avail.availHrs) * 100 : null;
          return Object.assign({}, g, { customer: g.customer.size, program: g.program.size, closure: g.closure.size, total: g.customer.size + g.program.size + g.closure.size, usedHrs, availHrs: avail.availHrs, availSource: avail.source, utilPct: pct, demand: pct >= 80 ? 'hot' : pct >= 50 ? 'warm' : null });
        });
        arr.sort((a, b) => a.label.localeCompare(b.label));
        return arr;
      }, [filtered, computeCourtAvail, sliceHours]);

      const overallUtil = React.useMemo(() => {
        if (!grouped.length) return null;
        const used = grouped.reduce((s, g) => s + g.usedHrs, 0), avail = grouped.reduce((s, g) => s + g.availHrs, 0);
        return avail > 0 ? (used / avail) * 100 : null;
      }, [grouped]);

      const scheduleStats = React.useMemo(() => {
        let real = 0, fb = 0;
        grouped.forEach(g => { if (g.availSource === 'schedule') real++; else fb++; });
        return { real, fallback: fb, total: grouped.length };
      }, [grouped]);

      const stats = React.useMemo(() => ({
        distinctFr: new Set(filtered.map(r => r.facilityRentalId).filter(Boolean)).size,
        distinctCourts: new Set(filtered.map(r => r.locationName + '|' + r.courtName)).size,
        reservationRows: filtered.length,
        totalHours: filtered.reduce((s, r) => s + sliceHours(r), 0),
      }), [filtered, sliceHours]);

      const dowHeatmap = React.useMemo(() => {
        if (!grouped.length || !filtered.length) return [];
        const courtDow = {};
        for (const r of filtered) {
          if (!r.localDate || !r.durationHours || r.usageCategory === 'Closure / Block') continue;
          const label = r.locationName + ' — ' + r.courtName;
          const jd = new Date(r.localDate + 'T12:00:00').getDay(); const dow = jd === 0 ? 7 : jd;
          courtDow[label + '|' + dow] = (courtDow[label + '|' + dow] || 0) + sliceHours(r);
        }
        const fb = Number(hrsPerDay) || 12;
        return grouped.map(g => {
          const cells = [];
          for (let d = 1; d <= 7; d++) {
            const used = courtDow[g.label + '|' + d] || 0;
            const sched = schedules && schedules[g.label] && schedules[g.label].dailyHrs;
            const hrsForDay = hourWin ? (hourWin.to - hourWin.from) : (sched ? (sched[d] || 0) : fb);
            const avail = hrsForDay * selDates(d);   // 0 for a day the filter excludes
            cells.push({ dow: d, used, avail, pct: avail > 0 ? (used / avail) * 100 : 0, off: !dowSet.has(d) });
          }
          return { label: g.label, court: g.court, location: g.location, demand: g.demand, utilPct: g.utilPct, cells };
        });
      }, [grouped, filtered, schedules, selDates, dowSet, hourWin, hrsPerDay, sliceHours]);

      // ── Hour-of-day utilisation ──────────────────────────────────────
      // Occupied time is split across every hour a booking actually spans
      // (a 5:30-8:00 rental is 30 min of 5pm and an hour each of 6 and 7),
      // never credited whole to its start hour. Minutes are capped at 60 per
      // court/date/hour so overlapping bookings on one court cannot push an
      // hour past 100%. Denominator is the observed open window — the
      // earliest start to the latest end seen in the range — since the
      // schedules feed currently exposes hours-per-day but not the windows
      // themselves; hours outside it count as closed rather than as 0%.
      // Closure/maintenance blocks are excluded on both sides.
      const hourly = React.useMemo(() => {
        const src = filtered.filter(r => r.localStart && r.localEnd && r.usageCategory !== 'Closure / Block');
        const courts = grouped.length;
        if (!src.length || !courts) return null;
        const perCell = {}, perCourtDate = {}, perCourt = {};
        let minHour = 24, maxHour = 0;
        for (const r of src) {
          const s = new Date(r.localStart), e = new Date(r.localEnd);
          if (isNaN(s) || isNaN(e) || e <= s) continue;
          for (let t = new Date(s.getFullYear(), s.getMonth(), s.getDate(), s.getHours()); t < e; t.setHours(t.getHours() + 1)) {
            const hourEnd = new Date(t); hourEnd.setHours(hourEnd.getHours() + 1);
            const mins = (Math.min(e, hourEnd) - Math.max(s, t)) / 60000;
            if (mins <= 0) continue;
            const h = t.getHours();
            if (hourWin && (h < hourWin.from || h >= hourWin.to)) continue;
            const ck = r.locationName + '|' + r.courtName + '|' + t.toDateString() + '|' + h;
            const prev = perCourtDate[ck] || 0;
            const add = Math.max(0, Math.min(60 - prev, mins));
            if (add <= 0) continue;
            perCourtDate[ck] = prev + add;
            const jd = t.getDay(), dow = jd === 0 ? 7 : jd;
            perCell[dow + '|' + h] = (perCell[dow + '|' + h] || 0) + add;
            const cl = r.locationName + ' — ' + r.courtName;   // matches the heatmap row label
            if (!perCourt[cl]) perCourt[cl] = {};
            perCourt[cl][dow + '|' + h] = (perCourt[cl][dow + '|' + h] || 0) + add;
            if (h < minHour) minHour = h;
            if (h + 1 > maxHour) maxHour = h + 1;
          }
        }
        if (minHour >= maxHour) return null;
        const band = (from, to, days) => {   // [from, to) in hours
          let booked = 0, open = 0;
          for (let h = from; h < to; h++) for (const d of days) {
            booked += perCell[d + '|' + h] || 0;
            open += 60 * selDates(d) * courts;
          }
          return {
            pct: open ? Math.round(1000 * booked / open) / 10 : null,
            bookedHours: Math.round(booked / 6) / 10,
            openHours: Math.round(open / 60),
            idleHours: Math.round((open - booked) / 60),
          };
        };
        const WD = [1, 2, 3, 4, 5].filter(d => dowSet.has(d)),
              WE = [6, 7].filter(d => dowSet.has(d)),
              ALL = [1, 2, 3, 4, 5, 6, 7].filter(d => dowSet.has(d));
        const byHour = [];
        for (let h = minHour; h < maxHour; h++) {
          const all = band(h, h + 1, ALL);
          byHour.push({
            hour: cuHour12(h), utilizationPct: all.pct,
            weekdayPct: band(h, h + 1, WD).pct, weekendPct: band(h, h + 1, WE).pct,
            hoursBooked: all.bookedHours, hoursOpen: all.openHours,
          });
        }
        // Contiguous open stretches sitting under 15% — the "dead window"
        // an operator can act on. Two hours minimum, biggest idle first.
        const quiet = (days, label) => {
          const out = []; let run = null;
          for (let h = minHour; h < maxHour; h++) {
            const b = band(h, h + 1, days);
            if (b.pct != null && b.pct < 15) { if (!run) run = { from: h, to: h }; run.to = h + 1; }
            else if (run) { out.push(run); run = null; }
          }
          if (run) out.push(run);
          return out.filter(x => x.to - x.from >= 2)
            .map(x => Object.assign({ days: label, from: cuHour12(x.from), to: cuHour12(x.to) }, band(x.from, x.to, days)))
            .sort((a, b) => b.idleHours - a.idleHours).slice(0, 2);
        };
        return {
          // Sent to Rec Insights. Deliberately excludes byCourt — the model
          // needs the shape of the day, not 69 courts × 126 cells.
          blob: {
            basis: 'Observed open window ' + cuHour12(minHour) + '-' + cuHour12(maxHour) + ' across ' + courts + ' court(s) with activity; hours outside the window are treated as closed, not as 0% utilised. Closure and maintenance blocks excluded.',
            openWindow: cuHour12(minHour) + '-' + cuHour12(maxHour),
            courtsCounted: courts,
            byHour,
            quietWeekdayBlocks: quiet(WD, 'Mon-Fri'),
            quietWeekendBlocks: quiet(WE, 'Sat-Sun'),
            peakHours: byHour.slice().sort((a, b) => (b.utilizationPct || 0) - (a.utilizationPct || 0)).slice(0, 3)
              .map(x => ({ hour: x.hour, utilizationPct: x.utilizationPct })),
          },
          fromHour: minHour,
          toHour: maxHour,
          // court label -> 'dow|hour' -> booked minutes, for the row a user expands
          byCourt: perCourt,
        };
      }, [filtered, grouped, selDates, dowSet, hourWin]);

      // One court's hour × day grid, built on expand rather than for all 26 at
      // once. Denominator is that court alone: 60 min × the number of that
      // weekday in range. The open window is the view-wide observed one, so
      // every expanded court shows the same hour rows and stays comparable.
      const hourGridFor = React.useCallback((label, parentCells) => {

                          + 'Window ' + cuHour12(hourWin ? hourWin.from : hourly.fromHour) + '-' + cuHour12(hourWin ? hourWin.to : hourly.toHour)
                          + (hourWin ? ' (your filter)' : ' (observed across the courts in view)')
                          + (dowSel.length < 7 ? ', ' + dowSel.slice().sort().map(d => CU_DOW[d - 1]).join('/') + ' only' : '')
                          + '. Time is split across every hour a booking spans; closure and maintenance blocks excluded.'));
                    })() : null)),
                ),
                e('div', { className: 'heatmap-legend' },
                  e('span', null, e('span', { className: 'heatmap-legend-swatch', style: { background: '#f8f8f6', border: '1px solid #e4e4e0' } }), '0%'),
                  e('span', null, e('span', { className: 'heatmap-legend-swatch', style: { background: '#fef9c3' } }), '1-19%'),
                  e('span', null, e('span', { className: 'heatmap-legend-swatch', style: { background: '#fde68a' } }), '20-39%'),
                  e('span', null, e('span', { className: 'heatmap-legend-swatch', style: { background: '#f59e0b' } }), '40-59%'),
                  e('span', null, e('span', { className: 'heatmap-legend-swatch', style: { background: '#ea580c' } }), '60-79%'),
                  e('span', null, e('span', { className: 'heatmap-legend-swatch', style: { background: '#dc2626' } }), '80%+ 🔥')),
              ) : null,
              e('div', { className: 'section-note' }, stats.reservationRows.toLocaleString() + ' reservation rows · utilization uses real per-court schedules where available.'),
            ),
      );
    }

    // ── Racket Sports sub-tab ───────────────────────────────────────────
    // Reuses the Court Utilization pipeline (same data, same math), scoped to
    // racket-sport courts by name/location. No new data source: courts are
    // isolated from the existing facility feed by matching a racket-sport
    // keyword (tennis, pickleball, padel, racquetball, squash, badminton) in
    // the court or location name. Per-court GPS isn't in the feed, so the map
    // places courts at their geocoded location (park), exactly like Court
    // Utilization. Private-lesson (instructor) data isn't in this feed — that
    // section is flagged pending rather than fabricated.
    const isRacketCourt = (court, loc) => /tennis|pickle|padel|racquet|squash|badminton/i.test((court || '') + ' ' + (loc || ''));
    const RACKET_THEME = {
      emptyMsg: 'No racket-sport courts found for this organization in the selected date range. Courts are detected by name (tennis, pickleball, padel, racquetball, squash, badminton) — if you expect courts here, they may be recorded under a different name, or there were no bookings in this window.',
    };

    function RacketSportsView({ start, end, fallback }) {
      // No hero here on purpose. This tab shows the shared themed banner
      // (FBX_THEME.racket) directly above it — same 🎾, same title, same green —
      // so an inner hero was the second copy of one header. The banner is the
      // one that carries the org name and the animated scene, so it stays and
      // this goes; the sections below label themselves.
      return e('div', { className: 'tennis-wrap' },
        fallback ? e('div', { style: { background: '#f0f9ff', border: '1px solid #bae6fd', borderRadius: 6, padding: '9px 14px', margin: '0 0 12px', fontSize: 12, color: '#075985' } },
          'Court names here don’t indicate a sport (e.g. “Court 1”), so this tab is showing all court-type sites instead of keyword-matched racket courts.') : null,
        e(CourtUtilizationView, { start, end, courtFilter: fallback ? (() => true) : isRacketCourt, theme: RACKET_THEME }),
        e('div', { className: 'tennis-pending' },
          e('div', { className: 'tp-head' }, '🎾 Private Instructor Lessons'),
          e('div', { className: 'tp-body' },
            'Lessons book through the Lessons product (programs pipeline), not facility reservations — instructor leaderboard, booking trends, price mix, and student loyalty live in their own report. ',
            e('a', { href: '/' + CFG.slug + '/lessons' + (CFG.token ? '?token=' + encodeURIComponent(CFG.token) : ''), style: { fontWeight: 700, color: '#047857' } }, 'Open the Instructor Lessons report →')),
        ),
      );
    }

    function App() {
      const now = new Date();
      // Print mode (Puppeteer PDF): /facilities?_print=1&start_date=&end_date=&
      // status=&site_type=&tab= — hydrate the exact on-screen state from the
      // URL so the captured PDF matches the filtered view that requested it.
      const PQS = new URLSearchParams(window.location.search);
      const isPrint = PQS.get('_print') === '1';
      const [start, setStart] = React.useState(PQS.get('start_date') || fmtDate(monthStart(now)));
      const [end, setEnd] = React.useState(PQS.get('end_date') || fmtDate(monthEnd(now)));
      const [tab, setTab] = React.useState(() => PQS.get('tab') || 'summary');
      const [statusSel, setStatusSel] = React.useState(() =>
        PQS.get('status') ? PQS.get('status').split(',').filter(Boolean) : ['confirmed', 'in-progress', 'canceled']);
      const [typeSel, setTypeSel] = React.useState(() =>
        PQS.get('site_type') ? PQS.get('site_type').split(',').filter(Boolean) : []); // [] = all site types
      const [locSel, setLocSel] = React.useState(() =>
        PQS.get('location') ? PQS.get('location').split('~~').filter(Boolean) : []); // [] = all locations
      const [rows, setRows] = React.useState(null);      // null = loading
      const [err, setErr] = React.useState(null);
      const [lessons, setLessons] = React.useState(null); // { n, rev } from the instructor-payout feed
      const [pdfLoading, setPdfLoading] = React.useState(false);
      React.useEffect(() => { if (isPrint) document.body.classList.add('print-mode'); }, []);

      function load(s, en) {
        const sd = s || start, ed = en || end;
        setRows(null); setErr(null);
        const tok = CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '';
        fetch('/' + CFG.slug + '/facilities/api/summary?start_date=' + sd + '&end_date=' + ed + tok)
          .then(r => r.json())
          .then(d => { if (d && d.error) { setErr(d.error); setRows([]); } else { setRows(refineRows((d && d.rows) || [])); } })
          .catch(er => { setErr(er.message); setRows([]); });
        // Instructor lessons happen on these same courts but book through the
        // Lessons product (programs pipeline) — they never appear as facility
        // reservations, so the Summary fetches them separately for the mix.
        setLessons(null);
        fetch('/' + CFG.slug + '/instructor-payout/api/data?start_date=' + sd + '&end_date=' + ed + tok)
          .then(r => r.json())
          .then(d => {
            const lrows = (d && d.rows) || [];
            const active = lrows.filter(r => String(r.booking_status || '').toLowerCase() !== 'canceled');
            setLessons({ n: active.length, rev: active.reduce((s, r) => s + (Number(r.amount_paid) || 0), 0) });
          })
          .catch(() => setLessons(null));
      }
      React.useEffect(() => { load(); }, []); // initial

      const runRange = (s, en) => { setStart(s); setEnd(en); load(s, en); };
      const setThisMonth = () => runRange(fmtDate(monthStart(now)), fmtDate(monthEnd(now)));
      const setLastMonth = () => { const d = new Date(now.getFullYear(), now.getMonth() - 1, 1); runRange(fmtDate(monthStart(d)), fmtDate(monthEnd(d))); };
      const setThisYear = () => runRange(fmtDate(new Date(now.getFullYear(), 0, 1)), fmtDate(new Date(now.getFullYear(), 11, 31)));

      const fmtRange = (s, en) => {
        const o = { year: 'numeric', month: 'long', day: 'numeric' };
        return new Date(s + 'T00:00:00').toLocaleDateString('en-US', o) + ' – ' + new Date(en + 'T00:00:00').toLocaleDateString('en-US', o);
      };
      const active = TABS.find(t => t.key === tab) || TABS[0];

      // All locations present in the feed (the filter's options).
      const allLocations = React.useMemo(
        () => rows ? Array.from(new Set(rows.map(r => r['Location']).filter(Boolean))).sort() : [],
        [rows]);
      // Location filter is a pre-filter on the shared rows: every rows-driven
      // view (Summary + the Golf/Aquatics/Ice vertical tabs) sees only the
      // selected locations, so their internals need no change. [] = all.
      const viewRows = React.useMemo(() => {
        if (!rows || !locSel.length) return rows;
        const set = new Set(locSel);
        return rows.filter(r => set.has(r['Location'] || ''));
      }, [rows, locSel]);

      // SF-style orgs name courts plainly ("Alice Marble — Court 1") with no
      // sport keyword; when nothing name-matches but court-type rows exist,
      // fall back to Site Type so the Racket tab shows the org's courts
      // instead of a false empty state.
      const racketFallback = !!(rows && rows.length && !rows.some(r => isRacketCourt(r['Facility'], r['Location'])) && rows.some(r => r['Site Type'] === 'court'));
      const racketRowMatch = r => racketFallback ? r['Site Type'] === 'court' : isRacketCourt(r['Facility'], r['Location']);
      // Per-vertical booking counts for the tab badges — computed from the
      // location-filtered rows so the badges track the location selection.
      const vertCounts = {};
      if (viewRows) {
        const ss = new Set(statusSel);
        Object.keys(VERT_CONFIG).forEach(k => {
          vertCounts[k] = viewRows.filter(r => r['Source'] !== 'Invoice' && vertRowMatch(r, k) && ss.has(lc(r['Status']))).length;
        });
        // Racket has no site type — courts are matched by name, same rule the
        // Racket Sports view uses to scope the feed.
        vertCounts.racket = viewRows.filter(r => r['Source'] !== 'Invoice' && racketRowMatch(r) && ss.has(lc(r['Status']))).length;
      }

      const bannerAgg = viewRows ? aggregate(viewRows, statusSel, typeSel) : null;
      // The toolbar readout is the SAME aggregate the banner and the KPI cards
      // use — it used to be counted separately off the raw rows, which is how it
      // could agree with a wrong number and disagree with a right one. Declared
      // here, below bannerAgg, not above it.
      // When the feed FAILED, the counts must read as unknown, not as zero. On
      // error the loader sets rows to [] (it cannot use null — that is the
      // loading state), so the aggregate honestly reports 0 of an empty array and
      // the toolbar said "0 bookings · 0 sites" next to a 502. Zero is a claim
      // about the campground; blank is the truth about our knowledge of it.
      const count = (err || !bannerAgg) ? null : bannerAgg.bookings;
      const siteCount = (err || !bannerAgg) ? 0 : bannerAgg.sites;

      // Exports mirror exactly what's on screen, like the other reports:
      // date range + status + site-type filters, and the active tab's scope
      // (vertical tabs export only their sites; racket matches courts by name).
      // PDF prints the current view, so it is view-scoped by construction.
      function exportExcel() {
        if (!viewRows || viewRows.length === 0 || typeof XLSX === 'undefined') return;
        const ts = new Set(typeSel), ss = new Set(statusSel);
        let scoped = viewRows.filter(r => (ts.size === 0 || ts.has(r['Site Type'])) && ss.has(lc(r['Status'])));
        let scopeLabel = 'Facility Bookings';
        if (tab === 'racket') {
          scoped = scoped.filter(r => racketRowMatch(r));
          scopeLabel = 'Racket Sports';
        } else if (VERT_CONFIG[tab]) {
          scoped = scoped.filter(r => vertRowMatch(r, tab));
          scopeLabel = VERT_CONFIG[tab].label;
        }
        if (scoped.length === 0) return;
        const cols = Object.keys(viewRows[0]);
        const ws = XLSX.utils.json_to_sheet(scoped, { header: cols });
        ws['!cols'] = cols.map(c => ({ wch: Math.min(32, Math.max(10, String(c).length + 4)) }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, scopeLabel.slice(0, 31));
        const tabSuffix = (tab !== 'summary' && tab !== 'utilization') ? '-' + tab : '';
        // Handed to a popup to save rather than written straight from here — a
        // download started by a sandboxed iframe is silently dropped. See open-pdf.js.
        saveWorkbookViaPopup(XLSX, wb, CFG.slug + '-facilities' + tabSuffix + '-' + start + '-to-' + end + '.xlsx');
      }
      // PDF: server-side Puppeteer render of this page in print mode with the
      // current filters — same mechanism as the Facility Rental Schedule report.
      function downloadPdf() {
        const qs = new URLSearchParams({ start_date: start, end_date: end });
        if (statusSel.length && statusSel.length < 3) qs.set('status', statusSel.join(','));
        if (typeSel.length) qs.set('site_type', typeSel.join(','));
        if (locSel.length) qs.set('location', locSel.join('~~'));
        if (tab && tab !== 'summary') qs.set('tab', tab);
        if (CFG.token) qs.set('token', CFG.token);
        // Opened in its own window rather than downloaded — a download started by
        // a sandboxed iframe is silently dropped. See open-pdf.js.
        openReportPdf('/' + CFG.slug + '/facilities/api/pdf?' + qs.toString(), { label: 'Facilities' });
      }

      // Lite export — a plain, print-first one-page revenue summary (no dashboard
      // chrome) built from the SAME aggregate that feeds the tiles, so its numbers
      // match the current view exactly and honor the active filters. Opens in a new
      // window; the user prints / saves as PDF (like the standalone Charged Revenue
      // Report). Mirrors the Charged / Collected / Outstanding / Refunds ladder.
      function exportLite() {
        const a = bannerAgg;
        if (!a) return;
        // Log the export to the Slack activity feed (fire-and-forget).
        try {
          const tok = CFG.token ? '&token=' + encodeURIComponent(CFG.token) : '';
          fetch('/' + CFG.slug + '/facilities/api/log?event=summary' + tok, { method: 'POST', keepalive: true }).catch(() => {});
        } catch (e) { /* never let logging break the export */ }
        const money = n => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const pct = (n, d) => d ? (n / d * 100).toFixed(1) + '%' : '0%';
        const charged = a.billed, inst = a.instRev, mgd = a.mgdRev;
        const collected = a.collected, outstanding = a.outstanding, refunded = a.refunded, net = collected - refunded;
        // Charges for bookings dated after today are contracted, not overdue —
        // called out here so the Outstanding line is not read as all past-due.
        const notYetDue = a.notYetDue || 0, dueNow = a.dueNow || 0;
        const org = CFG.displayName || CFG.slug || 'Parks & Recreation';
        const loc = locSel.length ? locSel.join(', ') : 'All locations';
        const genDate = now.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        const dueNote = notYetDue > 0
          ? ' Of that, ' + money(notYetDue) + ' covers bookings dated after ' + genDate + ' and is not yet due; ' + money(dueNow) + ' is due now.'
          : '';
        const range = fmtRange(start, end);
        const statusLabel = statusSel.length >= 3 ? 'All statuses' : statusSel.map(s => s.replace(/(^|[- ])\w/g, c => c.toUpperCase())).join(', ');
        const invNote = a.invoicedRev > 0
          ? ' Includes ' + money(a.invoicedRev) + ' billed through ' + a.invoicedN + ' manual invoice line' + (a.invoicedN === 1 ? '' : 's') + ' (no court reservation attached).'
          : '';
        const findings = [
          '<li><b>Instant Bookings (Customer Self-Service): ' + money(inst) + '</b> — ' + pct(inst, charged) + ' of all charged revenue, booked and paid directly through the online storefront.</li>',
          '<li><b>Admin-Initiated &amp; Managed Events: ' + money(mgd) + '</b> — ' + pct(mgd, charged) + ' of all charged revenue: admin-initiated rentals, managed events, leagues, and programs.' + invNote + '</li>',
          outstanding > 0 ? '<li><b>Outstanding balance: ' + money(outstanding) + '</b> — ' + pct(outstanding, charged) + ' of the amount charged is not yet collected (accounts receivable), typical for in-progress recurring bookings.' + dueNote + '</li>' : '',
          refunded > 0 ? '<li><b>Refunds: ' + money(refunded) + '</b> returned to customers during the period; net received after refunds is ' + money(net) + '.</li>' : '',
        ].join('');
        const css = ':root{--ink:#111;--rule:#111;--muted:#555;--faint:#888}*{box-sizing:border-box}'
          + "body{background:#fff;color:var(--ink);font:15px/1.5 Georgia,'Times New Roman',serif;max-width:760px;margin:0 auto;padding:40px 32px 64px}"
          + 'header{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}'
          + 'h1{font-size:20px;line-height:1.25;margin:.35em 0 .1em}h2{font-size:15px;margin:1.9em 0 .5em}'
          + 'h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:1.4em 0 .4em}'
          + '.lead{color:var(--muted);font-size:13px;margin:.2em 0 0}hr{border:0;border-top:1px solid var(--rule);margin:16px 0 0}'
          + 'table{width:100%;border-collapse:collapse;margin:.3em 0 .2em;font-size:14px}'
          + 'th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #ccc;vertical-align:top}'
          + 'th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1.5px solid var(--rule);font-weight:400}'
          + 'td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}'
          + 'tr.total td{border-top:1.5px solid var(--rule);border-bottom:none;font-weight:bold}'
          + 'ul{margin:.3em 0;padding-left:1.1em}li{margin:.35em 0}.details p{margin:.2em 0;font-size:13px}'
          + '.note{font-size:12px;color:var(--muted);margin:.5em 0 0;font-style:italic}'
          + '.foot{margin-top:2.4em;font-size:11px;color:var(--faint);border-top:1px solid #ddd;padding-top:8px}'
          + '.printbar{position:fixed;top:12px;right:12px}.printbar button{font:600 13px Georgia,serif;padding:8px 16px;border:1px solid #0d9488;background:#0d9488;color:#fff;border-radius:6px;cursor:pointer}'
          + '@media print{body{padding:0}.printbar{display:none}}';
        const doc = '<!doctype html><html><head><meta charset="utf-8"><title>' + org + ' — Charged Revenue</title><style>' + css + '</style></head><body>'
          + '<div class="printbar"><button onclick="window.print()">🖨️ Print / Save as PDF</button></div>'
          + '<header><span>' + org + '</span><span>Generated ' + genDate + '</span></header>'
          + '<h1>' + loc + ' — Charged Revenue Report</h1><hr>'
          + '<h2>Charged Revenue Report: ' + range + '</h2>'
          + '<h3>Executive Summary</h3><table><thead><tr><th>Metric</th><th class="num">Amount</th></tr></thead><tbody>'
          + '<tr><td>Grand Total Charged</td><td class="num">' + money(charged) + '</td></tr>'
          + '<tr><td>Instant Bookings (Customer Self-Service)</td><td class="num">' + money(inst) + '</td></tr>'
          + '<tr><td>Admin-Initiated &amp; Managed Events</td><td class="num">' + money(mgd) + '</td></tr>'
          + '<tr><td>Period</td><td class="num">' + range + '</td></tr>'
          + '<tr><td>Location</td><td class="num">' + loc + '</td></tr></tbody></table>'
          + '<h2>Revenue Breakdown</h2><h3>By Booking Type</h3>'
          + '<table><thead><tr><th>Booking Type</th><th class="num">Charged</th><th class="num">% of Total</th></tr></thead><tbody>'
          + '<tr><td>Instant Bookings</td><td class="num">' + money(inst) + '</td><td class="num">' + pct(inst, charged) + '</td></tr>'
          + '<tr><td>Admin-Initiated &amp; Managed Events</td><td class="num">' + money(mgd) + '</td><td class="num">' + pct(mgd, charged) + '</td></tr>'
          + '<tr class="total"><td>TOTAL</td><td class="num">' + money(charged) + '</td><td class="num">100%</td></tr></tbody></table>'
          + '<h3>By Payment Status</h3>'
          + '<table><thead><tr><th>Status</th><th class="num">Amount</th><th class="num">% of Charged</th></tr></thead><tbody>'
          + '<tr><td>Collected (received)</td><td class="num">' + money(collected) + '</td><td class="num">' + pct(collected, charged) + '</td></tr>'
          + '<tr><td>Outstanding (charged, not yet collected)</td><td class="num">' + money(outstanding) + '</td><td class="num">' + pct(outstanding, charged) + '</td></tr>'
          + (notYetDue > 0
              ? '<tr><td style="padding-left:20px;color:#555">— due now</td><td class="num">' + money(dueNow) + '</td><td class="num">' + pct(dueNow, charged) + '</td></tr>'
                + '<tr><td style="padding-left:20px;color:#555">— not yet due (bookings after ' + genDate + ')</td><td class="num">' + money(notYetDue) + '</td><td class="num">' + pct(notYetDue, charged) + '</td></tr>'
              : '')
          + '<tr class="total"><td>TOTAL CHARGED</td><td class="num">' + money(charged) + '</td><td class="num">100%</td></tr></tbody></table>'
          + '<h2>Refunds</h2><p class="lead">Amounts returned to customers during the reporting period. Refunds are paid back out of Collected revenue — shown separately and not subtracted from Charged or Collected above.</p>'
          + '<table><thead><tr><th>Booking Type</th><th class="num">Refunded</th></tr></thead><tbody>'
          + '<tr><td>Instant Bookings</td><td class="num">' + money(a.instRefund) + '</td></tr>'
          + '<tr><td>Admin-Initiated &amp; Managed Events</td><td class="num">' + money(a.mgdRefund) + '</td></tr>'
          + '<tr class="total"><td>TOTAL REFUNDED</td><td class="num">' + money(refunded) + '</td></tr></tbody></table>'
          + '<table><tbody><tr><td>Collected (gross)</td><td class="num">' + money(collected) + '</td></tr>'
          + '<tr><td>Less: Refunds</td><td class="num">−' + money(refunded) + '</td></tr>'
          + '<tr class="total"><td>Net Received (after refunds)</td><td class="num">' + money(net) + '</td></tr></tbody></table>'
          + (findings ? '<h2>Key Findings</h2><ul>' + findings + '</ul>' : '')
          + '<h2>What Each Metric Counts</h2><table><thead><tr><th>Metric</th><th>Definition</th></tr></thead><tbody>'
          + '<tr><td><b>Charged (Billed)</b></td><td>The full amount invoiced for court time and events during the period — every booking at its actual charged price, each session of a recurring booking counted separately. Included whether or not it has been paid. Canceled bookings excluded.</td></tr>'
          + '<tr><td><b>Instant Bookings</b></td><td>Reservations customers booked and paid for themselves through the online storefront.</td></tr>'
          + '<tr><td><b>Admin-Initiated &amp; Managed Events</b></td><td>Bookings created or managed by staff — rentals, leagues, programs, tournaments, events, and manual invoice line items.</td></tr>'
          + '<tr><td><b>Collected</b></td><td>Money actually received (confirmed payments) against these charges as of the report date.</td></tr>'
          + '<tr><td><b>Outstanding (A/R)</b></td><td>Charged amounts not yet collected — accounts receivable. Where the reporting period runs past today, this includes charges for bookings that have not happened yet, which are not yet due; those are shown on their own line. Normal for ongoing leagues and programs until each session is billed and paid.</td></tr>'
          + '<tr><td><b>Refunds</b></td><td>Amounts paid back to customers during the period. Shown separately and not subtracted from Charged or Collected.</td></tr>'
          + '<tr><td><b>Net Received</b></td><td>Collected minus Refunds — the cash retained after refunds.</td></tr></tbody></table>'
          + '<h2>Report Details</h2><div class="details">'
          + '<p><b>Scope:</b> ' + loc + '.</p>'
          + '<p><b>Time Period:</b> ' + range + '.</p>'
          + '<p><b>Booking Status:</b> ' + statusLabel + '.</p>'
          + '<p><b>Amount Basis:</b> Charged (the full amount billed), regardless of payment status.</p>'
          + '<p><b>Basis:</b> Each booking counted at its actual charged amount, per session for recurring bookings. Cancellations excluded from Charged. Collected reflects confirmed payments; Refunds reflect confirmed amounts returned; Outstanding is Charged less Collected.</p>'
          + '<p><b>Snapshot:</b> Figures reflect live records as of ' + genDate + ' and will move as bookings, payments, and refunds are processed.</p></div>'
          + '<div class="foot">' + org + ' · generated from the Rec facility report on ' + genDate + '.</div>'
          + '</body></html>';
        const w = window.open('', '_blank');
        if (!w) { alert('Please allow pop-ups to open the summary report.'); return; }
        w.document.write(doc);
        w.document.close();
      }

      return e(React.Fragment, null,
        isPrint ? null : e(Toolbar, { start, end, setStart, setEnd, thisMonth: setThisMonth, lastMonth: setLastMonth, thisYear: setThisYear, run: () => load(), loading: rows === null, count, sites: siteCount, onPdf: downloadPdf, onLite: exportLite, onExcel: exportExcel, pdfLoading, rows: viewRows }),
        rows !== null ? e('div', { id: 'report-ready', 'data-ready': 'true', style: { display: 'none' } }) : null,
        e('div', { className: 'page' },
          e('div', { className: 'report-header' },
            e('div', { className: 'report-header-left' },
              CFG.logoUrl ? e('img', { className: 'report-header-logo', src: CFG.logoUrl, alt: '', onError: ev => { ev.target.style.display = 'none'; } }) : null,
              e('div', null,
                e('div', { className: 'org-label' }, CFG.displayName || CFG.slug || 'Parks & Recreation'),
                e('div', { className: 'title' }, 'Facilities'),
              ),
            ),
            e('div', { className: 'report-header-right' },
              e('div', { className: 'rh-meta', style: { fontWeight: 600, marginBottom: 2 } }, fmtRange(start, end)),
            ),
          ),
          // A failed fetch is not "0 bookings" — say so and offer a retry
          // instead of letting the zero-state hero present itself as data.
          err ? e('div', { style: { background: '#fef2f2', border: '1px solid #fecaca', borderLeft: '3px solid #dc2626', color: '#991b1b', padding: '11px 15px', borderRadius: 6, margin: '0 0 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap', fontSize: 13 } },
            e('span', null, e('strong', null, "Couldn't load facility data"), ' — ' + err + '. The counts below are a loading failure, not real numbers.'),
            e('button', { onClick: () => load(), style: { padding: '6px 18px', border: 'none', background: '#dc2626', color: '#fff', borderRadius: 6, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit', fontSize: 12.5 } }, 'Retry'),
          ) : null,
          // Camping, Aquatics & Outdoor Events render their own dedicated
          // per-vertical banner with vertical-specific stats — so the
          // shared themed banner is suppressed there to avoid stacking two.
          // Activity-specific headers (ice / golf) are hidden when the org has
          // none of that type in view — no ice header for an org with no rinks,
          // matching the tab badge count. Summary & Court Utilization are
          // org-wide and always show.
          //
          // Racket is NOT in that list, deliberately. Its badge counts rows in
          // the hub's summary feed, but the tab itself reads the court feed,
          // which also carries league/program time that never appears as a
          // facility reservation — so a badge of 0 does not mean the tab is
          // empty. It used to render its own hero, which covered for that; now
          // that the duplicate hero is gone, suppressing the banner too would
          // leave the tab with no header at all over real data.
          (tab === 'aquatics' || tab === 'camping' || tab === 'outdoor' || tab === 'fields') ? null
            : ((tab === 'ice' || tab === 'golf') && vertCounts[tab] === 0) ? null
            : e(FacilitiesBanner, { a: bannerAgg, tab }),
          // Filters are context-aware: the site-type filter only makes sense on
          // the Summary (a vertical tab already fixes the type); Court Utilization
          // manages its own filters + dates inside the embed, so no hub filters.
          (tab === 'utilization' || tab === 'racket' || tab === 'camping' || tab === 'outdoor' || tab === 'fields') ? null : e('div', { className: 'filters' },
            e(StatusChips, { sel: statusSel, setSel: setStatusSel }),
            tab === 'summary' ? e('div', { className: 'filter-group' },
              e('span', { className: 'filter-lbl' }, 'Site type'),
              e(SiteTypeFilter, { sel: typeSel, setSel: setTypeSel }),
            ) : null,
            // Location filter — on the Summary and every vertical tab, so a
            // manager can scope to just their venue (e.g. the pickleball courts
            // vs the tennis center, both 'court' at different locations).
            allLocations.length > 1 ? e('div', { className: 'filter-group' },
              e('span', { className: 'filter-lbl' }, 'Location'),
              e(LocationFilter, { locations: allLocations, sel: locSel, setSel: setLocSel }),
            ) : null,
          ),
          e('div', { className: 'tabs' },
            TABS.map(t => {
              const badge = ((VERT_CONFIG[t.key] || t.key === 'racket') && vertCounts[t.key] != null) ? vertCounts[t.key] : null;
              return e('div', {
                key: t.key,
                className: 'tab' + (t.key === tab ? ' active' : ''),
                onClick: () => {
                  setTab(t.key);
                  const u = new URL(window.location); u.searchParams.set('tab', t.key); window.history.replaceState({}, '', u);
                },
              }, t.icon ? e('span', null, t.icon) : null, t.label,
                 badge != null ? e('span', { className: 'tab-badge' }, badge.toLocaleString()) : null);
            }),
          ),
          tab === 'summary'
            ? e(SummaryTab, { rows: viewRows, err, statusSel, typeSel, lessons, filtersActive: (locSel.length > 0 || typeSel.length > 0) })
            : tab === 'utilization'
              ? e(CourtUtilizationView, { start, end })
              : tab === 'racket'
                ? e(RacketSportsView, { start, end, fallback: racketFallback })
                : tab === 'camping'
                  ? e(CampingView, { start, end })
                : tab === 'outdoor'
                  ? e(OutdoorEventsView, { start, end })
                : tab === 'fields'
                  ? e(FieldsView, { start, end })
                : tab === 'aquatics'
                  ? e(AquaticsView, { rows: viewRows, err, statusSel, vert: Object.assign({ key: tab }, VERT_CONFIG[tab]), start: start, end: end })
                  : VERT_CONFIG[tab]
                    ? e(VerticalView, { rows: viewRows, err, statusSel, vert: Object.assign({ key: tab }, VERT_CONFIG[tab]) })
                    : e(SummaryTab, { rows: viewRows, err, statusSel, typeSel, lessons, filtersActive: (locSel.length > 0 || typeSel.length > 0) }),
        ),
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
  <!-- Early Access banner + Got Feedback + thumbs (same as every report page).
       Rendered once at the hub level; the Court Utilization embed hides its own. -->
  <script src="/feedback-widget.js" defer></script>
</body>
</html>
