                <div className="card-label">Expired</div>
                <div className="card-value amber">{summary.expired.toLocaleString()}</div>
                <div className="card-sub">purchased, term ended</div>
              </div>
              <div className="summary-card">
                <div className="card-label">Inactive</div>
                <div className="card-value">{summary.inactive.toLocaleString()}</div>
                <div className="card-sub">purchased, inactive</div>
              </div>
              <div className="summary-card">
                <div className="card-label">Auto-Renew</div>
                <div className="card-value pink">{summary.autoRenewCount.toLocaleString()}</div>
                <div className="card-sub">≈ {money(summary.mrrEstimate)} renewal value</div>
              </div>
              <div className="summary-card">
                <div className="card-label">Net Collected</div>
                <div className="card-value blue">{money(summary.totalNetCollected)}</div>
                <div className="card-sub">{money(summary.totalRevenue)} contract · by purchase date, all channels</div>
              </div>
            </div>

            {/* Resident vs non-resident. A FILTER shows one side at a time;

            {residencySplit && residencySplit.known > 0 && (
              <div className="summary-cards" data-mb-residency-split>
                <div className="summary-card" style={{borderLeft:'3px solid #0d6c78'}}>
                  <div className="card-label">Resident</div>
                  <div className="card-value" style={{color:'#0d6c78'}} data-mb-res-count={residencySplit.resident.n}>
                    {residencySplit.resident.n.toLocaleString()}
                  </div>
                  <div className="card-sub" data-mb-res-pct={residencySplit.residentPct == null ? '' : residencySplit.residentPct}>
                    {residencySplit.residentPct}% of the paid book · {money(residencySplit.resident.revenue)}
                  </div>
                </div>
                <div className="summary-card" style={{borderLeft:'3px solid #8a5c0c'}}>
                  <div className="card-label">Non-Resident</div>
                  <div className="card-value" style={{color:'#8a5c0c'}} data-mb-nonres-count={residencySplit.nonresident.n}>
                    {residencySplit.nonresident.n.toLocaleString()}
                  </div>
                  <div className="card-sub">
                    {residencySplit.residentPct == null ? '' : (Math.round((100 - residencySplit.residentPct) * 10) / 10) + '% of the paid book · '}
                    {money(residencySplit.nonresident.revenue)}
                  </div>
                </div>
                {residencySplit.free > 0 && (
                  <div className="summary-card">
                    <div className="card-label">Free Records</div>
                    <div className="card-value" data-mb-res-free={residencySplit.free}>
                      {residencySplit.free.toLocaleString()}
                    </div>
                    <div className="card-sub">
                      priced at $0 — mostly residency verification, so they are
                      counted here rather than in the split above
                    </div>
                  </div>
                )}
                {residencySplit.unknown.n > 0 && (
                  <div className="summary-card">
                    <div className="card-label">Residency Unknown</div>
                    <div className="card-value" data-mb-res-unknown={residencySplit.unknown.n}>
                      {residencySplit.unknown.n.toLocaleString()}
                    </div>
                    <div className="card-sub">
                      excluded from the split rather than filed as non-resident
                    </div>
                  </div>
                )}
              </div>
            )}



            <StaleCacheBanner meta={meta} />
            {/* Content */}
            <div className="content">
              {renderView()}
            </div>

            </React.Fragment>
          )}


            {/* Shared footer */}
            <div className="report-footer">
              <span>{orgName} — Memberships</span>
              <span>Run Date/Time: {runDate}</span>
            </div>

            {!loading && !error && <div id="report-ready" style={{display:'none'}} />}
          </div>
</React.Fragment>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
    <script src="/share-widget.js" defer></script>
    <script src="/feedback-widget.js" defer></script>
      <script src="/nav-breadcrumb.js" defer></script>
  </body>
</html>
