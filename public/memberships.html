<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memberships</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 12px;
      color: #1a1a1a;
      background: #f5f4f1;
      line-height: 1.35;
    }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: #2c2c2c;
      color: #eee;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .toolbar-title { font-weight: 600; margin-right: 8px; }
    .toolbar-spacer { flex: 1; }
    .toolbar input[type="text"], .toolbar input[type="search"] {
      padding: 5px 10px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      min-width: 200px;
    }
    .toolbar input[type="text"]:focus, .toolbar input[type="search"]:focus { border-color: #db2777; }
    .toolbar input::placeholder { color: rgba(255,255,255,.5); }
    .toolbar button {
      padding: 6px 14px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
    }
    .toolbar button:hover { background: rgba(255,255,255,.18); }
    .toolbar button.active { background: rgba(255,255,255,.22); border-color: rgba(255,255,255,.55); }
    .toolbar .btn-pdf { background: #3b82f6; border-color: #3b82f6; font-weight: 600; }
    .toolbar .btn-pdf:hover { background: #2563eb; }
    .toolbar .btn-pdf:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar .btn-excel { background: #16803c; border-color: #16803c; font-weight: 600; }
    .toolbar .btn-excel:hover { background: #15692f; }
    .toolbar .btn-excel:disabled { opacity: .5; cursor: not-allowed; }
    .toolbar input[type="date"] {
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      color-scheme: dark;
    }
    .toolbar input[type="date"]:focus { border-color: #db2777; }
    .toolbar input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1); cursor: pointer; opacity: .6;
    }
    .toolbar label { display: flex; align-items: center; gap: 4px; font-size: 11px; white-space: nowrap; }
    .toolbar .divider { width: 1px; height: 24px; background: rgba(255,255,255,.2); margin: 0 2px; }
    .btn-run {
      padding: 6px 14px !important;
      background: #22c55e !important;
      border-color: #22c55e !important;
      color: #fff !important;
      font-weight: 600 !important;
      transition: background .15s, box-shadow .15s;
    }
    .btn-run:hover { background: #16a34a !important; }
    .btn-run:disabled { opacity: .6; cursor: wait; }
    .btn-spinner {
      display: inline-block; width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-right: 6px; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .view-group { display: flex; gap: 0; }
    .view-group button {
      border-radius: 0;
      border-right: none;
    }
    .view-group button:first-child { border-radius: 4px 0 0 4px; }
    .view-group button:last-child  { border-radius: 0 4px 4px 0; border-right: 1px solid rgba(255,255,255,.25); }
    .view-group button.active { background: #db2777; border-color: #db2777; }

    /* multi-select dropdown */
    .ms-wrap { position: relative; }
    .ms-trigger {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 4px;
      background: rgba(255,255,255,.08);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .ms-trigger:hover { background: rgba(255,255,255,.18); }
    .ms-trigger .ms-badge {
      background: #f59e0b; color: #1a1a1a; font-weight: 600;
      padding: 1px 6px; border-radius: 8px; font-size: 11px;
    }
    .ms-trigger .ms-badge.all { background: rgba(255,255,255,.2); color: #fff; }
    .ms-panel {
      position: absolute; top: calc(100% + 4px); left: 0;
      background: #fff; color: #1a1a1a;
      border: 1px solid #ddd; border-radius: 6px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      min-width: 280px; max-width: 360px;
      z-index: 200;
      padding: 8px;
    }
    .ms-search {
      width: 100%; padding: 6px 10px;
      border: 1px solid #ddd; border-radius: 4px;
      font-size: 12px; font-family: inherit;
      margin-bottom: 6px;
    }
    .ms-actions {
      display: flex; gap: 6px; padding: 4px 0;
      border-bottom: 1px solid #eee; margin-bottom: 4px;
    }
    .ms-actions button {
      padding: 3px 8px; font-size: 11px;
      border: 1px solid #ddd; border-radius: 3px;
      background: #f7f7f7; color: #333;
      cursor: pointer;
    }
    .ms-actions button:hover { background: #ebebeb; }
    .ms-list { max-height: 280px; overflow-y: auto; }
    .ms-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 6px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
    }
    .ms-item:hover { background: #f5f4f1; }
    .ms-item input { cursor: pointer; }

    /* ── Page ── */
    .page {
      max-width: 1400px; margin: 16px auto; padding: 24px 28px;
      background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    /* ── Header ── */
    .report-header { display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #111; padding-bottom:10px; margin-bottom:18px; gap:16px; }
    .report-header-left { display:flex; align-items:center; gap:14px; }
    .report-header-logo { height:42px; max-width:140px; object-fit:contain; object-position:left center; }
    .report-header .org-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; color:#777; font-weight:600; }
    .report-header .title { font-size:17px; font-weight:700; margin-top:1px; color:#111827; }
    .report-header-right { text-align:right; }
    .report-header .rh-meta { font-size:11px; color:#666; }

    /* ── Animated header — the check-in line. Same construction as the other
       report banners: a CSS scene under a text overlay, no images, no
       interaction. mbb-/mbx- prefixes: fb- belongs to the feedback widget,
       mb- is already taken by the scope note below. ── */
    .mem-banner { position:relative; width:100%; height:168px; border-radius:12px; overflow:hidden;
      margin:0 0 18px; border:1px solid #bae6fd; box-shadow:0 3px 14px rgba(12,74,110,.16);
      background:linear-gradient(116deg,#0c2b45 0%,#0e5b6e 42%,#14887f 74%,#5ed0b6 100%); }
    .mem-banner .mbb-scene { position:absolute; inset:0; z-index:0; overflow:hidden; }
    .mem-banner .mbb-overlay { position:absolute; inset:0; padding:18px 26px 34px; display:flex; flex-direction:column;
      align-items:flex-start; justify-content:center; text-align:left; z-index:2; }
    .mem-banner .mbb-kicker { font-size:10.5px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,.92); text-shadow:0 1px 3px rgba(0,0,0,.45); }
    .mem-banner .mbb-title { font-size:30px; font-weight:800; color:#fff; text-shadow:0 2px 7px rgba(0,0,0,.45); line-height:1.04; margin-top:3px; }
    .mem-banner .mbb-sub { font-size:12.5px; color:rgba(255,255,255,.95); text-shadow:0 1px 4px rgba(0,0,0,.5); margin-top:6px; max-width:560px; }
    .mem-banner .mbb-pills { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .mem-banner .mbb-pill { background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.4); color:#fff; font-size:12px; font-weight:600; padding:4px 12px; border-radius:20px; text-shadow:0 1px 2px rgba(0,0,0,.35); }
    .mem-banner .mbb-pill b { font-weight:800; }

    /* Lobby: tiled floor, water light on the far wall, a desk and a scanner. */
    .mbx-water { position:absolute; left:0; right:0; bottom:36px; height:26px; opacity:.32;
      background:repeating-linear-gradient(115deg, rgba(255,255,255,.5) 0 2px, transparent 2px 16px);
      filter:blur(1.5px); animation:mbxRipple 9s linear infinite; }
    .mbx-floor { position:absolute; left:0; right:0; bottom:0; height:36px;
      background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 26px), linear-gradient(180deg,#0e4a55,#062b33);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.16); }
    .mbx-desk { position:absolute; right:6%; bottom:4px; width:86px; height:24px; border-radius:3px 3px 0 0;
      background:linear-gradient(180deg,#8fd3d8,#3d8b93); box-shadow:0 2px 6px rgba(0,0,0,.32); }
    .mbx-desk::before { content:''; position:absolute; left:-3px; right:-3px; top:-5px; height:6px; border-radius:3px; background:#cdeef0; }
    .mbx-staff { position:absolute; right:11%; bottom:24px; width:13px; }
    .mbx-staff .head { width:6px; height:6px; border-radius:50%; margin:0 auto 1px; background:#f6d6b3; }
    .mbx-staff .body { width:12px; height:12px; border-radius:4px 4px 2px 2px; background:#fdba74; }
    /* Card reader — flashes green as each member taps through. */
    .mbx-reader { position:absolute; right:24%; bottom:4px; width:9px; height:26px; border-radius:2px;
      background:linear-gradient(180deg,#cbd5e1,#475569); box-shadow:0 1px 3px rgba(0,0,0,.4); }
    .mbx-reader::after { content:''; position:absolute; left:1.5px; top:3px; width:6px; height:6px; border-radius:1px;
      background:#22c55e; animation:mbxBeep 2.2s steps(1,end) infinite; }
    .mbx-rope { position:absolute; bottom:16px; height:2px; border-radius:2px; background:rgba(255,255,255,.3); }
    .mbx-post { position:absolute; bottom:4px; width:2.5px; height:16px; border-radius:1px; background:rgba(255,255,255,.38); }
    /* Members filing in and tapping through. */
    .mbx-lane { position:absolute; left:-30px; animation:mbxWalk linear infinite; }
    .mbx-member { position:relative; width:11px; animation:mbxStep .52s ease-in-out infinite alternate; }
    .mbx-member i { display:block; }
    .mbx-member .head { width:5.5px; height:5.5px; border-radius:50%; margin:0 auto 1px; background:#f6d6b3; }
    .mbx-member .body { width:11px; height:12px; border-radius:4px 4px 2px 2px; background:var(--kit); box-shadow:0 1px 3px rgba(0,0,0,.32); }
    /* The badge each one is holding up. */
    .mbx-member .card { position:absolute; right:-3px; top:6px; width:4px; height:3px; border-radius:1px; background:#fde68a; }

    @keyframes mbxWalk   { to { transform:translateX(calc(100vw + 60px)); } }
    @keyframes mbxStep   { from { transform:translateY(0); } to { transform:translateY(-1.5px); } }
    @keyframes mbxRipple { to { background-position-x:64px; } }
    @keyframes mbxBeep   { 0%, 78% { background:#166534; } 79%, 100% { background:#4ade80; box-shadow:0 0 6px 2px rgba(74,222,128,.7); } }

    /* Decoration only — a reduced-motion reader gets the same scene, held still. */
    @media (prefers-reduced-motion: reduce) { .mem-banner * { animation:none !important; } }
    @media print { .mem-banner { display:none !important; } }
    body.print-mode .mem-banner { display:none !important; }

    /* ── Summary Cards ── */
    .summary-cards { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .summary-card {
      flex: 1; min-width: 120px; background: #f5f4f1;
      border: 1px solid #ddd; border-radius: 6px; padding: 10px 14px;
    }
    .summary-card .card-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.8px; color: #888; font-weight: 600; margin-bottom: 4px; }
    .summary-card .card-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: #111; }
    .summary-card .card-value.green  { color: #15803d; }
    .summary-card .card-value.red    { color: #b91c1c; }
    .summary-card .card-value.blue   { color: #2563eb; }
    .summary-card .card-value.purple { color: #7c3aed; }
    .summary-card .card-value.pink   { color: #db2777; }
    .summary-card .card-value.amber  { color: #d97706; }
    .summary-card .card-sub { font-size: 10px; color: #999; margin-top: 2px; }
    .mb-scope-note {
      background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 6px;
      padding: 9px 13px; margin-bottom: 12px; font-size: 12.5px; color: #0c4a6e;
    }
    .mb-scope-note strong { color: #075985; }
    .mb-scope-note .mb-scope-sub { display: block; margin-top: 3px; font-size: 11px; color: #3b6b8a; line-height: 1.4; }

    /* ── Footer ── */
    .report-footer {
      display: flex; justify-content: space-between;
      border-top: 2.5px solid #111; margin-top: 16px; padding-top: 6px;
      font-size: 10px; color: #777;
    }

    /* ── Content area ── */
    .content { padding: 0; }

    /* ── Table ── */
    table.report {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e5e5e5;
      font-size: 11px;
    }
    table.report th, table.report td {
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
    }
    table.report th {
      background: #2c2c2c;
      color: #fff;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .4px;
      font-size: 10px;
      position: sticky;
      top: 52px;
      z-index: 50;
      cursor: pointer;
      user-select: none;
    }
    table.report th:hover { background: #404040; }
    table.report th.sorted-asc::after  { content: ' ▲'; opacity: .7; }
    table.report th.sorted-desc::after { content: ' ▼'; opacity: .7; }
    table.report td.num, table.report th.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.report tr:hover { background: #fafaf7; }

    .status-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    .status-pill.active   { background: #dcfce7; color: #166534; }
    .status-pill.canceled { background: #fee2e2; color: #991b1b; }
    .status-pill.expired  { background: #fef3c7; color: #92400e; }
    .status-pill.inactive { background: #e2e8f0; color: #475569; }

    .renewal-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
    }
    .renewal-pill.auto    { background: #fce7f3; color: #9d174d; }
    .renewal-pill.onetime { background: #f1f5f9; color: #475569; }

    .empty-state {
      text-align: center;
      padding: 80px 40px;
      color: #999;
      background: #fff;
      border: 1px dashed #ddd;
      border-radius: 6px;
    }
    .error-state { color: #b91c1c; }
    .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
    .loading .spinner {
      position: relative; display: inline-block; width: 34px; height: 44px; margin: 0 auto; box-sizing: border-box;
      border: 2px solid #e07b1a; border-top-color: #f7b96b; border-radius: 4px 4px 14px 14px;
      background: rgba(255, 248, 240, 0.5); overflow: hidden; box-shadow: inset -4px 0 0 rgba(255, 255, 255, 0.35);
    }
    .loading .spinner::before {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 60%;
      background: linear-gradient(180deg, #ffb24d 0%, #ff8c1f 55%, #f2710a 100%);
      box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.45); animation: juice-fill 2s ease-in-out infinite;
    }
    .loading .spinner::after {
      content: ''; position: absolute; left: 50%; bottom: 6px; width: 3px; height: 3px; margin-left: -1.5px;
      border-radius: 50%; background: rgba(255, 255, 255, 0.85);
      box-shadow: -5px 7px 0 0 rgba(255, 255, 255, 0.65), 5px 12px 0 -0.5px rgba(255, 255, 255, 0.5);
      animation: juice-bubbles 2.2s ease-out infinite;
    }
    @keyframes juice-fill { 0% { height: 42%; } 50% { height: 80%; } 100% { height: 42%; } }
    @keyframes juice-bubbles { 0% { transform: translateY(2px) scale(0.5); opacity: 0; } 30% { opacity: 0.9; } 70% { opacity: 0.6; } 100% { transform: translateY(-22px) scale(1); opacity: 0; } }
    .juice-msg { position: relative; height: 1.4em; line-height: 1.4em; min-width: 190px; }
    .juice-msg span { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; animation: juice-phrase 10s infinite; }
    .juice-msg span:nth-child(1) { animation-delay: 0s; }
    .juice-msg span:nth-child(2) { animation-delay: 2s; }
    .juice-msg span:nth-child(3) { animation-delay: 4s; }
    .juice-msg span:nth-child(4) { animation-delay: 6s; }
    .juice-msg span:nth-child(5) { animation-delay: 8s; }
    @keyframes juice-phrase { 0% { opacity:0; transform:translateY(5px); } 2% { opacity:1; transform:translateY(0); } 18% { opacity:1; transform:translateY(0); } 20% { opacity:0; transform:translateY(-5px); } 100% { opacity:0; } }

    /* ── Chart container ── */
    .chart-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 18px 22px;
    }
    .chart-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 12px;
    }
    .chart-card canvas { max-width: 100%; }
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    @media (min-width: 1000px) {
      .chart-grid.two-col { grid-template-columns: 1fr 1fr; }
    }

    /* ── Print ── */
    @media print {
      .toolbar { display: none; }
      body { background: #fff; }
      .page { box-shadow: none; margin: 0; padding: 12px 16px; max-width: 100%; }
      .summary-card { break-inside: avoid; }
      .chart-card { break-inside: avoid; }
    }
    body.print-mode .toolbar { display: none !important; }
    body.print-mode { background: #fff; }
    body.print-mode .page { box-shadow: none; margin: 0; padding: 12px 16px; max-width: 100%; }
    /* ── Print-friendly table: hide non-essential columns, compact spacing ── */
    /* Cols: 1=Name 2=Email 3=Type 4=Status 5=Renewal 6=Price 7=Paid 8=Refunded 9=Net 10=Start 11=NextRenewal 12=LastUsed 13=Uses */
    body.print-mode table.report th:nth-child(2),
    body.print-mode table.report td:nth-child(2),
    body.print-mode table.report th:nth-child(7),
    body.print-mode table.report td:nth-child(7),
    body.print-mode table.report th:nth-child(8),
    body.print-mode table.report td:nth-child(8),
    body.print-mode table.report th:nth-child(12),
    body.print-mode table.report td:nth-child(12),
    body.print-mode table.report th:nth-child(13),
    body.print-mode table.report td:nth-child(13) { display: none; }
    body.print-mode table.report th,
    body.print-mode table.report td { font-size: 10px; padding: 3px 6px; }
    body.print-mode table.report { font-size: 10px; }
    body.print-mode .summary-cards { gap: 8px; }
    body.print-mode .summary-card { padding: 8px 10px; }
    body.print-mode .summary-card .card-value { font-size: 16px; }
    body.print-mode .insights-section { display: none; }
    body.print-mode .view-tabs { display: none; }
    body.print-mode .filter-bar { display: none; }

    /* ── AI Insights ── */
    .insights-section { margin: 0 0 16px; padding: 16px 0 0; }
    .insights-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .insights-btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; 
      position: relative; overflow: visible;
      box-shadow: 0 2px 12px rgba(99,102,241,.3);
    }
    .insights-btn:hover:not(:disabled) { background: linear-gradient(135deg, #4f46e5, #7c3aed); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,.4); filter: none; }
    .insights-btn:disabled { opacity: .6; cursor: wait; }
    .insights-btn .sparkle {
      position: absolute; pointer-events: none;
      font-size: 10px; opacity: 0;
      animation: sparkle-float 2.5s ease-in-out infinite;
    }
    .insights-btn .sparkle:nth-child(1) { top: -8px; left: 8%; animation-delay: 0s; }
    .insights-btn .sparkle:nth-child(2) { top: -6px; right: 12%; animation-delay: 0.7s; font-size: 8px; }
    .insights-btn .sparkle:nth-child(3) { bottom: -7px; left: 25%; animation-delay: 1.4s; font-size: 7px; }

<body>
  <div id="root"></div>

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.9/babel.min.js"></script>

  <script type="text/babel" data-presets="env,react">

    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    // ── Localstorage keys ──
    const LS_VIEW         = 'memberships.viewMode';
    const LS_STATUS       = 'memberships.statusFilter';
    const LS_RENEWAL      = 'memberships.renewalFilter';
    const LS_TYPES        = 'memberships.typeFilter';
    const LS_PRICEMIN     = 'memberships.priceMin';
    const LS_PRICEMAX     = 'memberships.priceMax';
    const LS_DATEFIELD    = 'memberships.dateField';
    const LS_SORTKEY      = 'memberships.sortKey';
    const LS_SORTDIR      = 'memberships.sortDir';
    const LS_STARTDATE    = 'memberships.startDate';
    const LS_ENDDATE      = 'memberships.endDate';

    // ── Helpers ──
    const safeNum = (v) => {
      const n = parseFloat(v);
      return Number.isFinite(n) ? n : 0;
    };
    const money = (v) => safeNum(v).toLocaleString('en-US', { style: 'currency', currency: 'USD' });
    const dateOnly = (s) => {
      if (!s) return '';
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) return s;
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    };
    const monthKey = (s) => {
      if (!s) return '';
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    };
    const daysSince = (s) => {
      if (!s) return null;
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) return null;
      return Math.floor((Date.now() - d.getTime()) / 86400000);
    };
    const daysUntil = (s) => {
      if (!s) return null;
      const d = new Date(s);
      if (Number.isNaN(d.getTime())) return null;
      return Math.floor((d.getTime() - Date.now()) / 86400000);
    };

    const toISO = (d) => {
      const dt = d instanceof Date ? d : new Date(d);
      return dt.toISOString().slice(0, 10);
    };

    function getParams() {
      const p = new URLSearchParams(window.location.search);
      return { start_date: p.get('start_date'), end_date: p.get('end_date'), _print: p.get('_print'),
               tab: p.get('tab'), ci_loc: p.get('ci_loc'), ci_rows: p.get('ci_rows') };
    }

    function defaultDates() {
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), 1);
      const end   = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      return { start: toISO(start), end: toISO(end) };
    }

    function StaleCacheBanner({ meta }) {
  if (!meta?.stale_cache) return null;
  const when = meta.cached_at ? new Date(meta.cached_at).toLocaleString() : 'recently';
  return (
    <div style={{background:'#fef3c7',borderBottom:'1px solid #f59e0b',padding:'8px 16px',textAlign:'center',fontSize:13,color:'#92400e'}}>
      ⚠️ Showing cached data from {when} — live data is temporarily unavailable
    </div>
  );
}

    // ── Check-in helpers ──────────────────────────────────────────────────
    // Module scope on purpose: the Check-Ins tab derives its charts inside render
    // IIFEs, and Babel compiles const→var, so anything they read has to be
    // declared above them rather than further down the component.
    const CI_DOW1 = ['S','M','T','W','T','F','S'];
    const CI_DOW3 = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    // "2026-08-24" through new Date() is UTC midnight, which formats as the 23rd
    // in every US timezone — build the date from its parts instead.
    function ciDow(v) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v == null ? '' : v));
      return m ? new Date(+m[1], +m[2] - 1, +m[3]).getDay() : null;
    }
    function ciIsWeekend(v) { var d = ciDow(v); return d === 0 || d === 6; }
    function ciHourShort(h) { var x = ((h % 24) + 24) % 24; return x === 0 ? '12a' : x === 12 ? '12p' : x > 12 ? (x - 12) + 'p' : x + 'a'; }
    function ciHourLong(h)  { var x = ((h % 24) + 24) % 24; return x === 0 ? '12am' : x === 12 ? '12pm' : x > 12 ? (x - 12) + 'pm' : x + 'am'; }
    function ciMonthKey(v)  { var m = /^(\d{4})-(\d{2})/.exec(String(v == null ? '' : v)); return m ? m[1] + '-' + m[2] : ''; }
    function ciMonthShort(mo) { var q = String(mo || '').split('-'); return q.length < 2 ? String(mo || '') : new Date(+q[0], +q[1] - 1, 1).toLocaleDateString('en-US', {month:'short'}); }
    function ciMonthLong(mo)  { var q = String(mo || '').split('-'); return q.length < 2 ? String(mo || '') : new Date(+q[0], +q[1] - 1, 1).toLocaleDateString('en-US', {month:'long', year:'numeric'}); }
    function ciDateLabel(v) {
      var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(v == null ? '' : v));
      if (!m) return String(v == null ? '' : v);
      return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', {month:'short', day:'numeric'});
    }
    // A member's Rec account. The check-in card emits BOTH ids: "Member ID" is
    // users.rec_id (the 6-character code staff read out at the desk) and "User
    // ID" is users.id, the uuid the admin URL takes. Only the uuid can be linked,
    // so the cell degrades to plain text rather than building a URL out of a
    // rec_id that would 404.
    function ciUserUrl(orgId, userId) {
      if (!orgId || !userId) return null;
      return 'https://www.rec.us/admin/o/' + orgId + '/users/' + userId;
    }

// A FAILED scan is not a check-in. Card 18151 also emits membership and pass
// check-in DENIALS, tagged `Status = 'Failed'` — they share the row shape of a
// successful scan, which is exactly the trap the facility Summary fell into when
// invoice fee lines arrived shaped like bookings and every row count silently
// became a booking count.
//
// A row with NO Status is a SUCCESS. The feed carried nothing but check-ins
// before this shipped and a 4-hour-old cache entry still does, so keying the test
// on 'Failed' — rather than on === 'Checked In' — is what stops the whole tab
// going blank against an older feed.
//
// At module scope, not inside the component, so a spec can RUN it rather than
// regex over it (the nightStateFrom lesson).
function ciIsFailed(r) { return !!(r && r['Status'] === 'Failed'); }

// Which set of rows the Recent Check-Ins list is showing: 'ok' (accepted scans,
// the default and what the tab has always shown) or 'failed' (refused scans).
//
// This scopes THE LIST ONLY, deliberately. Every aggregate on the tab —
// check-in counts, peak hour, avg per day, time of day, top members, desk
// counts — stays successes-only, because a refused scan is not attendance and
// folding one into those figures would report people who were turned away as
// having attended. That is the same class of error as the facility Summary
// counting invoice fee lines as bookings. So this is a per-panel view toggle,
// exactly like the All/Weekdays/Weekends slice already on the time-of-day
// chart, and the panel title names the set it is showing.
//
// A 'failed' selection must not survive a window or desk that has no failures:
// the toggle that got the reader there is hidden in that state, so holding the
// selection would strand them on an empty table with no way back. Resolved in
// one place, at module scope, so the render and the reset effect cannot
// disagree and a spec can RUN it rather than regex over the component.
//
// `loaded` IS LOAD-BEARING, and leaving it out was a real bug caught by the
// render check: ?ci_rows=failed is a shareable link, so the selection exists
// before the feed does. With no feed there are no failures YET — which is not
// the same fact as "this window has none" — and resolving on it flipped the
// link to the accepted list on mount, then wrote that back to the state, so the
// link could never work. A feed that has not answered is not an empty answer;
// see the permits column and the campmap's POS_OK for the same distinction.
function ciEffectiveRowSet(set, failCount, loaded, okCount) {
  if (!loaded) return set;                                    // hold the intent
  if (set === 'failed') return failCount > 0 ? 'failed' : 'ok';
  // Nothing was accepted, but scans WERE refused — the only rows in this window
  // are the refused ones. Defaulting to the accepted list here renders an empty
  // "Recent Check-Ins (0 total)" directly beneath a message saying N people were
  // turned away: the count-with-nowhere-to-go bug all over again.
  if (okCount === 0 && failCount > 0) return 'failed';
  return set;
}

// The Retention tab needs a long window — a cohort chart over four weeks has
// nothing to plot. Clicking the tab therefore widens the date range.
//
// IT MUST ONLY EVER WIDEN, and getting that wrong is what made the chart flash
// up and vanish. The old code was:
//
//     var start12 = new Date(now.getTime() - 30 * 86400000);   // 30 DAYS
//     if (startDate > s || endDate < e) { ...refetch... }
//
// Two bugs compounding. `start12` was 30 days despite its name and the comment
// above it saying 12 months. And the condition fired on `endDate < e` alone, so
// a window that ALREADY covered twelve months got replaced by a 31-day one the
// moment its end date sat a couple of days short of month-end. The pane renders
// from the previous `data` while the refetch is in flight, so the full cohort
// chart drew, then the narrow response landed and buildCohorts collapsed it.
//
// Returning the UNION of the current window and the wanted one makes narrowing
// structurally impossible, whatever the two dates are.
function mbRetentionWindow(startDate, endDate, now) {
  var d = now ? new Date(now) : new Date();
  // Twelve calendar months back, not 30 days.
  var want = { start: mbISODate(new Date(d.getFullYear(), d.getMonth() - 12, d.getDate())),
               end:   mbISODate(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  var start = startDate && startDate < want.start ? startDate : want.start;
  var end   = endDate   && endDate   > want.end   ? endDate   : want.end;
  return { start: start, end: end, changed: start !== startDate || end !== endDate };
}

// ISO date from local parts. Never toISOString() — that is UTC, so an evening
// in any US timezone rolls to tomorrow and the window silently shifts a day.
function mbISODate(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}

// Which tab a ?tab= link resolves to. At module scope so the spec can RUN it
// (the nightStateFrom lesson) and so the org card's tab chips and this page
// cannot drift about which tabs exist. An unknown value falls back to the
// default rather than rendering nothing.
var MB_URL_TABS = ['memberships', 'autorenew', 'salesmix', 'checkins', 'retention'];
function mbEffectiveTab(t) {
  var v = String(t == null ? '' : t);
  return MB_URL_TABS.indexOf(v) >= 0 ? v : 'memberships';
}

// ── Paid-book economics ────────────────────────────────────────────────
// All at module scope, not inside the component, so the spec can RUN them
// rather than regex over them (the nightStateFrom lesson).

// A membership is PAID if someone was charged for it. Tested against prod
// 2026-08-29: a membership reaches this feed if and only if finalCents > 0,
// with zero exceptions across 102,765 rows — so in practice every row here is
// already paid. The test stays explicit because that is a property of the
// materialized purchases view, not a promise, and a future feed change that
// let $0 residency records through must not silently fold 130,170 free
// records into a revenue figure.
function mbIsPaid(r) { return !!(r && r.price > 0); }

// What SHAPE of product this is, which is what separates "a season ended"
// from "a member left":
//   season  — the plan has one fixed end date, so every member's term ends on
//             the same day. Expiry is the season closing. NOT churn.
//   term    — a rolling fixed term (365d annual, 28d, …). Expires and must be
//             re-bought; today none of these can auto-renew.
//   open    — open-ended / subscription. The only shape auto-renew runs on.
//   unknown — a pre-v2 feed with no plan columns. Rendered as unknown, never
//             guessed: calling an unlabelled row "open" would put season
//             passes into the churn number, which is the exact error this
//             whole split exists to prevent.
function mbProductShape(r) {
  if (!r) return 'unknown';
  // A PASS IS ITS OWN PRODUCT and must be settled FIRST, before any test that
  // reads a term rule. This ordering is the whole fix for the v2 bug: a pass has
  // no `group`, so both plan-term columns are NULL, and "no season end and no
  // term days" then read as "open-ended subscription". Every day pass and gate
  // fee on the platform was classified as a subscription and offered as an
  // auto-renew conversion candidate — 10,669 of them at Norman alone.
  //
  // Absence of a group term rule is not evidence of a subscription. And a pass
  // cannot auto-renew whatever its terms say: the `pass` table has no
  // stripe_subscription_id and no next_renewal_at.
  if (r.productKind === 'pass') return 'pass';
  if (r.planSeasonEnd) return 'season';
  if (r.planTermDays != null && r.planTermDays > 0) return 'term';
  // Only a row we KNOW is a membership may be called open-ended. On a pre-v3
  // feed productKind is absent, so a pass would fall through to here — hence
  // the explicit membership test rather than a bare `hasPlanTerms`.
  if (r.hasPlanTerms && r.productKind === 'membership') return 'open';
  return 'unknown';
}

// The plan a row belongs to. ONE implementation because three surfaces now key
// on it — the per-plan table, the retention filter pills, and the filter itself.
// Two copies drift the first time the fallback order changes, and then a pill
// silently matches nothing and draws an empty chart.
function mbPlanKey(r) {
  return (r && (r.group || r.type)) || '\u2014';
}

// CAN this row carry auto-renew at all? The denominator question, and the one
// the tab got wrong twice.
//
// A rate is only meaningful over a base that can move. Measured on prod
// 2026-08-30, over ACTIVE PAID memberships:
//
//     shape     rows    on auto-renew
//     open     5,398    1,841
//     season   4,650        0
//     term       932        0
//     passes  13,802      n/a — the `pass` table has no subscription column
//
// So season and rolling-term plans are exactly like passes: not one of the
// 5,582 of them has ever carried a subscription, because the product ends on a
// date rather than recurring. Dividing by them told City of Norman it sits at
// 7.1% adoption across 2,887 memberships when it is really at 97.6% across 209,
// with two cash plans left to convert — and it filled the per-plan config table
// with 2,678 season passes reading "0%", which looks like a misconfiguration
// and is not one.
//
// TWO THINGS KEEP THIS HONEST:
//
//   · `unknown` is ELIGIBLE. On a pre-v3 feed we cannot tell a subscription
//     from a day pass, so nothing is excluded and the tab degrades to exactly
//     its old behaviour rather than quietly shrinking a denominator on a guess.
//   · A row that IS on auto-renew is eligible WHATEVER its shape. The zeros
//     above are measured, not a schema guarantee, so if a season plan ever does
//     carry a subscription it must show up here rather than vanish. This is the
//     one branch that makes the exclusion safe to apply at all.
function mbCanAutoRenew(r) {
  if (!r) return false;
  if (mbIsAutoRenew(r)) return true;          // measured zero today; never hide a real one
  var sh = mbProductShape(r);
  return sh === 'open' || sh === 'unknown';
}

// THE BILLING CYCLE IS A PROPERTY OF THE PLAN, NOT OF ONE ROW'S TIMESTAMPS.
//
// This is a correction. mbRenewalsSoFar originally divided by each row's own
// (next renewal − period start), which held at City of Norman and does NOT hold
// generally: on a membership whose renewal is imminent that gap is the time
// REMAINING in the period, not the period's length. Measured at Apex over 1,323
// auto-renewers — 8 rows have a "cycle" under a day (the smallest is 15 minutes)
// and 35 more under a week, and dividing a multi-year span by those produced
// 44,665 renewals on a monthly plan and dragged that plan's average to 228x.
//
// A plan bills on one cadence, so the MEDIAN across its members is the cadence,
// and a median is unmoved by a minority of corrupt rows. The same Apex row then
// reads 1,341 days / ~30 = 45 renewals, which matches its 2022 start date.
//
// Generalise it: I validated the per-row derivation against one org and shipped
// it platform-wide. A rule about "what these two columns mean" needs checking
// across orgs, because one org's data being clean is not evidence about the
// column.
function mbPlanCycles(rows) {
  var byPlan = {};
  (rows || []).forEach(function(r) {
    var c = mbCycleDays(r);
    // Only plausible billing cadences vote. A sub-day gap is not a cadence any
    // plan bills on; it is a row whose renewal is due imminently.
    if (c == null || c < 1) return;
    (byPlan[mbPlanKey(r)] = byPlan[mbPlanKey(r)] || []).push(c);
  });
  var out = {};
  Object.keys(byPlan).forEach(function(k) {
    var v = byPlan[k].sort(function(a, b){ return a - b; });
    out[k] = v[Math.floor(v.length / 2)];
  });
  return out;
}

// What the plan's cadence is called, so a rate can be reported in it. Dan:
// "always report the churn rate based on its renewal period" — a weekly plan's
// churn and a monthly plan's churn are not comparable as raw percentages, and
// naming the period is what makes each one readable on its own terms.
function mbCadence(days) {
  if (days == null) return null;
  if (days <= 10)  return { unit: 'week',    per: 'per week' };
  if (days <= 45)  return { unit: 'month',   per: 'per month' };
  if (days <= 120) return { unit: 'quarter', per: 'per quarter' };
  return { unit: 'year', per: 'per year' };
}

// HOW MANY TIMES HAS THIS MEMBERSHIP ACTUALLY RENEWED?
//
// There is no renewal-event history anywhere in the schema — `public.subscription`
// is a marketing opt-in table, and `membership` keeps only the CURRENT period. So
// this is derived: the distance from the original start to the current period
// start, divided by THE PLAN'S cycle (see mbPlanCycles for why not the row's).
//
// NULL, NEVER ZERO, when it cannot be derived — and null when the answer is
// implausible rather than shipping a confident 44,665. Reporting a cancelled
// membership as "0 renewals" would say a member who renewed six times and then
// left never renewed at all, and averaged into a plan it punishes that plan
// hardest for the members it kept billing longest.
function mbRenewalsSoFar(r, planCycle) {
  if (!r || !r.periodStart || !r.startDate) return null;
  var cyc = planCycle != null && planCycle >= 1 ? planCycle : null;
  if (cyc == null) return null;
  var a = Date.parse(r.startDate), b = Date.parse(r.periodStart);
  if (isNaN(a) || isNaN(b)) return null;
  var days = (b - a) / 86400000;
  if (days < 0) return null;
  var n = Math.round(days / cyc);
  // A membership cannot have renewed more times than the platform is old.
  // Belt and braces on top of the plan-median cycle: if this ever fires, the
  // dates are wrong and a number is worse than a dash.
  return n <= 600 ? n : null;
}

// CHURN PER RENEWAL PERIOD — the rate that is actually comparable.
//
// The tab used to show cancellations / everyone-ever-on-auto-renew, which is a
// LIFETIME-TO-DATE figure: at Apex that is 1,119 of 2,176 = 51%, over a book
// going back to 2022. Sitting in a KPI row it read as a churn rate and Dan read
// it as one ("those are crazy high"). Half a four-year-old subscription book
// having eventually cancelled is unremarkable; 51% a month would be a fire.
//
// This is the hazard rate instead: of all the renewal opportunities the book has
// been through, what share ended in a cancellation. Each member contributes its
// renewals as opportunities taken, plus one more if it cancelled. Expressed in
// the plan's OWN period, so a weekly plan reads per week and a monthly one per
// month rather than being silently compared.
function mbChurnPerCycle(renewals, canceled) {
  var opportunities = (renewals || 0) + (canceled || 0);
  if (!opportunities) return null;
  return canceled / opportunities;
}

// Has this membership been cancelled? Reads the DATE first and the status word
// second: `canceled_at` is the fact, while status vocabulary varies by product.
function mbIsCanceled(r) {
  if (!r) return false;
  if (r.canceledAt) return true;
  var st = String(r.status || '').toLowerCase();
  return st === 'canceled' || st === 'cancelled';
}

// A cancellation already booked for the end of the current period. THE ONLY
// FORWARD-LOOKING CHURN SIGNAL IN THIS SCHEMA — the membership is live, is
// counted in the book, is still billing, and will not renew. Norman has 126.
// `canceledAt` is the past; this is the future, and they must not be added
// together.
function mbCancelPending(r) {
  return !!(r && r.cancelScheduledAt && !mbIsCanceled(r));
}

// Presence, not count — the hasAbsent / ciHasStatus rule. On a pre-v4 feed the
// pending-cancellation card HIDES rather than rendering a 0, which would say
// "nobody is leaving" when the truth is "this feed cannot tell us".
function mbHasCancelSchedule(rows) {
  if (!rows || !rows.length) return false;
  for (var i = 0; i < rows.length; i++) if (rows[i] && rows[i].hasCancelSchedule) return true;
  return false;
}

// Is this membership genuinely on auto-renew?
//
// THE CACHE INVARIANT IS THE HARD PART. Feeds cache for 4 hours, so a pre-v2
// response (no "Auto Renew" column) and a v2 one are BOTH live at once. Both
// must resolve to the same answer or the report changes what it says about a
// member the moment a cache entry expires — the ftEffectiveStatus lesson.
//
// v2 carries stripe_subscription_id, which is the truth. v1 only had
// "Renewal Type", inferred from membership_next_renewal_at.
//
// MEASURED, because "they agree" was too strong when I first wrote it. Over
// ACTIVE memberships on prod 2026-08-29: 1,760 carry both signals, 88 carry a
// subscription with no renewal date, and NOT ONE carries a renewal date without
// a subscription. So the fallback undercounts by 88 (4.8%) and can never
// overcount — it degrades in the safe direction, which is why it is kept rather
// than hiding the number on a pre-v2 feed.
//
// The two diverge much further over a PURCHASE window, which is what this
// report is: next_renewal_at is cleared when a membership ends while the
// subscription id persists, so a May cohort at Norman reads 2 against 96. That
// is not a defect in either column — they answer different questions — and it
// is why every panel here is scoped to ACTIVE memberships before counting.
function mbIsAutoRenew(r) {
  if (!r) return false;
  if (r.autoRenew != null) return !!r.autoRenew;   // v2: the real thing
  return r.renewalType === 'Auto-renew';           // pre-v2 cache entry
}

// Billing cycle length in days, or null when the feed cannot say.
// NULL IS A REAL ANSWER and must stay null: a missing cycle is "we don't know
// how often this bills", not "monthly". Defaulting it would quietly turn a
// per-cycle charge into a fabricated monthly figure.
function mbCycleDays(r) {
  if (!r || !r.periodStart || !r.nextRenewal) return null;
  var a = Date.parse(r.periodStart), b = Date.parse(r.nextRenewal);
  if (isNaN(a) || isNaN(b)) return null;
  var d = (b - a) / 86400000;
  return d > 0 ? d : null;
}

// What this membership is worth per month. Null unless the cycle is known.
function mbMonthlyValue(r) {
  var d = mbCycleDays(r);
  if (d == null || !r || !(r.price > 0)) return null;
  return r.price * (30.44 / d);
}

// Does this feed carry the v2 economics columns at all?
//
// PRESENCE, NOT COUNT — the hasAbsent / ciHasStatus rule. A pre-v2 cache entry
// has no cycle on any row, and rendering "$0/mo" for that says "this org earns
// nothing from auto-renew" when the truth is "this feed cannot tell us". The
// panels hide instead. Gated on the COLUMN being present rather than on any
// row having a value, so an org that genuinely has no auto-renew still sees
// the panel and reads a real zero.
// Does this feed distinguish memberships from passes at all?
// PRESENCE, NOT COUNT. Without "Product Kind" nothing may be called open-ended
// (see mbProductShape), so the conversion list would read a confident 0 rather
// than an honest "cannot tell yet" — the same false-zero the economics gate
// exists to prevent, one field over.
function mbHasProductKind(rows) {
  if (!rows || !rows.length) return false;
  for (var i = 0; i < rows.length; i++) if (rows[i] && rows[i].productKind) return true;
  return false;
}

// PRESENCE, NOT COUNT — the mbHasProductKind rule. An org with no residency
// group gets NULL from the card, and a feed from before v5 has no column at
// all. Both must HIDE the residency surfaces rather than render "0% resident",
// which is a confident answer to a question the data cannot address.
// Deliberately keyed on the column, not on finding a 'Yes': an org where every
// member happens to be a non-resident still has a working residency setup and
// should keep its filter.
function mbHasResidency(rows) {
  if (!rows || !rows.length) return false;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i] && rows[i].hasResidency && rows[i].residency) return true;
  }
  return false;
}

// The row's residency as a filter key. Module scope so the spec can RUN it,
// and so the filter, the split panel and the table cannot each derive it
// differently — three surfaces reading one rule (the mbPlanKey lesson).
function mbResidencyKey(r) {
  if (!r || !r.hasResidency) return null;      // no column: unknowable
  if (r.residency === 'Yes') return 'resident';
  if (r.residency === 'No')  return 'nonresident';
  return null;                                  // org runs no residency group
}

function mbHasEconomics(rows) {
  if (!rows || !rows.length) return false;
  for (var i = 0; i < rows.length; i++) {
    if (rows[i] && rows[i].hasCycle && rows[i].hasPlanTerms) return true;
  }
  return false;
}

// Split a month-over-month revenue move into the part volume explains and the
// part price/mix explains. Answers "where am I losing money?" without implying
// churn: on the measured Norman case units rose 10.4% while revenue fell
// 74.9%, entirely because the $224 season pass stopped selling and $9 single
// passes replaced it. A revenue line alone reads as members leaving.
//
// Standard price-volume bridge, priced at the PRIOR average so the two parts
// sum exactly to the total move (any residual is mix, folded into price by
// construction and labelled that way on screen).
function mbDecompose(prev, cur) {
  if (!prev || !cur || !(prev.units > 0)) return null;
  var prevAvg = prev.revenue / prev.units;
  var volume = (cur.units - prev.units) * prevAvg;
  var total = cur.revenue - prev.revenue;
  return { volume: volume, price: total - volume, total: total };
}

function normalizeRow(raw) {
      return {
        userId:        raw['User ID'] || '',
        firstName:     raw['First Name'] || '',
        lastName:      raw['Last Name'] || '',
        email:         raw['Email'] || '',
        membershipId:  raw['Membership ID'] || '',
        type:          raw['Membership Type'] || '',
        group:         raw['Group / Plan'] || '',
        status:        (raw['Status'] || 'active').toLowerCase(),
        renewalType:   raw['Renewal Type'] || '',
        price:         safeNum(raw['Price']),
        paid:          safeNum(raw['Paid']),
        refunded:      safeNum(raw['Refunded']),
        netCollected:  safeNum(raw['Net Collected']),
        startDate:     raw['Start Date'] || '',
        endDate:       raw['End Date'] || '',
        nextRenewal:   raw['Next Renewal'] || '',
        canceledAt:    raw['Canceled At'] || '',
        createdAt:     raw['Created At'] || '',
        lastUsed:      raw['Last Used'] || '',
        usageCount:    safeNum(raw['Usage Count']),
        attendanceCount: safeNum(raw['Attendance Count']),
        // ── card 17301 v2 ──
        // `hasPlanTerms` records that the feed CARRIES the plan columns, which
        // is a different fact from a plan having no term rule (an open-ended
        // subscription legitimately has neither an end date nor a term length).
        // Without it, mbProductShape cannot tell "open-ended" from "pre-v2
        // feed" and would label every season pass on a warm cache entry as a
        // subscription.
        hasPlanTerms:  Object.prototype.hasOwnProperty.call(raw, 'Plan Season End'),
        // 'membership' | 'pass'. STATED, not inferred — see mbProductShape.
        productKind:   raw['Product Kind'] || '',
        // v4. Presence is tracked separately from the value, for the same
        // reason hasCycle is: '' is a legitimate value for a membership that
        // is not scheduled to cancel, so it cannot double as "column absent".
        hasCancelSchedule: Object.prototype.hasOwnProperty.call(raw, 'Cancel Scheduled At'),
        cancelScheduledAt: raw['Cancel Scheduled At'] || '',
        cancelReason:  raw['Cancel Reason'] || '',
        coverage:      raw['Coverage'] || '',
        planSeasonEnd: raw['Plan Season End'] || '',
        planTermDays:  raw['Plan Term Days'] == null ? null : safeNum(raw['Plan Term Days']),
        // Left undefined (not false) on a pre-v2 feed so mbIsAutoRenew can tell
        // "the column says no" from "there is no column".
        autoRenew:     Object.prototype.hasOwnProperty.call(raw, 'Auto Renew') ? !!raw['Auto Renew'] : undefined,
        hasCycle:      Object.prototype.hasOwnProperty.call(raw, 'Period Start'),
        periodStart:   raw['Period Start'] || '',
        // v5. Presence is tracked apart from the value for the same reason
        // hasCycle is: the card emits NULL for an org with no residency group
        // at all, and null must not read as "not a resident".
        hasResidency:  Object.prototype.hasOwnProperty.call(raw, 'Resident?'),
        // 'Yes' | 'No' | '' — '' means the org runs no residency group.
        residency:     raw['Resident?'] == null ? '' : String(raw['Resident?']),
      };
    }


    // ── Cohort retention computation ──
    function buildCohorts(rows) {
      var now = new Date();
      var cohortMap = {};
      rows.forEach(function(r) {
        if (!r.createdAt) return;
        var created = new Date(r.createdAt);
        if (isNaN(created.getTime())) return;
        var key = created.getFullYear() + '-' + String(created.getMonth()+1).padStart(2,'0');
        if (!cohortMap[key]) cohortMap[key] = [];
        var endMs;
        if (r.status === 'active') {
          endMs = now.getTime();
        } else if (r.canceledAt) {
          endMs = new Date(r.canceledAt).getTime();
          if (isNaN(endMs)) endMs = now.getTime();
        } else if (r.endDate) {
          endMs = new Date(r.endDate).getTime();
          if (isNaN(endMs)) endMs = now.getTime();
        } else {
          endMs = created.getTime();
        }
        var survivalMonths = Math.max(0, (endMs - created.getTime()) / (1000*60*60*24*30.44));
        cohortMap[key].push({ created: created, survivalMonths: survivalMonths, status: r.status });
      });

      var keys = Object.keys(cohortMap).sort();
      if (keys.length > 12) keys = keys.slice(-12);

      return keys.map(function(key) {
        var members = cohortMap[key];
        var size = members.length;
        var retention = [100];
        var monthsSinceStart = (now.getTime() - new Date(key + '-01').getTime()) / (1000*60*60*24*30.44);
        for (var m = 1; m <= 12; m++) {
          if (m > monthsSinceStart + 0.5) {
            retention.push(null);
          } else {
            var alive = members.filter(function(mb){ return mb.survivalMonths >= m; }).length;
            retention.push(Math.round(alive / size * 100));
          }
        }
        var parts = key.split('-');
        var label = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][parseInt(parts[1])-1] + ' ' + parts[0];
        return { key: key, label: label, size: size, retention: retention };
      });
    }

    // ── MultiSelect component (mirrors GL Locations pattern) ──
    function MultiSelect({ label, options, selected, onChange, allowAll = true }) {
      const [open, setOpen] = useState(false);
      const [search, setSearch] = useState('');
      const ref = useRef(null);

      useEffect(() => {
        function onDoc(e) {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, []);

      const filtered = useMemo(() => {
        const q = search.trim().toLowerCase();
        if (!q) return options;
        return options.filter(o => o.toLowerCase().includes(q));
      }, [options, search]);

      const allSelected = selected.length === options.length && options.length > 0;
      const noneSelected = selected.length === 0;
      const partial = !allSelected && !noneSelected;

      const toggle = (val) => {
        if (selected.includes(val)) onChange(selected.filter(v => v !== val));
        else onChange([...selected, val]);
      };

      const badge = allSelected
        ? <span className="ms-badge all">All ({options.length})</span>
        : noneSelected
          ? <span className="ms-badge" style={{background:'#94a3b8'}}>None</span>
          : <span className="ms-badge">{selected.length} / {options.length}</span>;

      return (
        <div className="ms-wrap" ref={ref}>
          <button className="ms-trigger" onClick={() => setOpen(!open)} type="button">
            <span>{label}</span>
            {badge}
            <span style={{opacity:.6}}>{open ? '▾' : '▸'}</span>
          </button>
          {open && (
            <div className="ms-panel">
              <input
                className="ms-search"
                type="search"
                placeholder={`Search ${label.toLowerCase()}…`}
                value={search}
                onChange={e => setSearch(e.target.value)}
              />
              <div className="ms-actions">
                <button onClick={() => onChange([...options])} type="button">Select All</button>
                <button onClick={() => onChange([])} type="button">Select None</button>
                {partial && <span style={{fontSize:11,color:'#777',padding:'3px 4px'}}>{selected.length} selected</span>}
              </div>
              <div className="ms-list">
                {filtered.map(opt => (
                  <label key={opt} className="ms-item">
                    <input
                      type="checkbox"
                      checked={selected.includes(opt)}
                      onChange={() => toggle(opt)}
                    />
                    <span>{opt}</span>
                  </label>
                ))}
                {filtered.length === 0 && <div style={{padding:'8px',color:'#999',fontSize:11}}>No matches</div>}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Chart wrapper ──
    function ChartView({ type, data, options, height = 320 }) {
      const ref = useRef(null);
      const instRef = useRef(null);
      useEffect(() => {
        if (!ref.current) return;
        if (instRef.current) instRef.current.destroy();
        instRef.current = new Chart(ref.current, { type, data, options });
        return () => {
          if (instRef.current) {
            instRef.current.destroy();
            instRef.current = null;
          }
        };
      }, [type, JSON.stringify(data), JSON.stringify(options)]);
      return (
        <div style={{ position: 'relative', height: `${height}px`, width: '100%' }}>
          <canvas ref={ref} />
        </div>
      );
    }

    // ── Sort helpers ──
    function sortRows(rows, key, dir) {
      if (!key) return rows;
      const mult = dir === 'desc' ? -1 : 1;
      const get = (r) => r[key];
      return [...rows].sort((a, b) => {
        const av = get(a), bv = get(b);
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * mult;
        return String(av || '').localeCompare(String(bv || '')) * mult;
      });
    }

    // ── Retention Chart Component ──
    var RET_COLORS = ['#e34948','#eb6834','#eda100','#008300','#1baf7a','#2a78d6','#4a3aa7','#e87ba4','#1d9e75','#d85a30','#d4537e','#639922'];

    function RetentionChart({ cohorts }) {
      var canvasRef = useRef(null);
      var chartRef = useRef(null);

      useEffect(function() {
        if (!canvasRef.current || !cohorts || cohorts.length === 0) return;
        if (chartRef.current) chartRef.current.destroy();

        var labels = ['0'];
        for (var i = 1; i <= 12; i++) labels.push(String(i));

        var datasets = cohorts.map(function(c, idx) {
          var color = RET_COLORS[idx % RET_COLORS.length];
          return {
            label: c.label + ' (' + c.size + ')',
            data: c.retention.map(function(v) { return v; }),
            borderColor: color,
            backgroundColor: color + '18',
            borderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            pointBackgroundColor: color,
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            tension: 0.3,
            fill: false,
            spanGaps: false,
          };
        });

        chartRef.current = new Chart(canvasRef.current, {
          type: 'line',
          data: { labels: labels, datasets: datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: true, position: 'bottom', labels: { boxWidth: 10, padding: 12, font: { size: 10 } } },
              tooltip: {
                callbacks: {
                  title: function(items) { return 'Month ' + items[0].label; },
                  label: function(item) { return item.dataset.label + ': ' + item.raw + '% retained'; }
                }
              }
            },
            scales: {
              y: {
                min: 0, max: 100,
                grid: { color: '#e1e0d9' },
                border: { color: '#e1e0d9' },
                ticks: { color: '#898781', font: { size: 10 }, callback: function(v) { return v + '%'; } }
              },
              x: {
                title: { display: true, text: 'Months since signup', color: '#898781', font: { size: 10 } },
                grid: { display: false },
                border: { color: '#e1e0d9' },
                ticks: { color: '#898781', font: { size: 10 } }
              }
            }
          }
        });

        return function() { if (chartRef.current) chartRef.current.destroy(); };
      }, [cohorts]);

      return <div style={{position:'relative',height:300,marginBottom:16}}><canvas ref={canvasRef}></canvas></div>;
    }

    function App() {
      const orgSlug    = useMemo(() => window.location.pathname.split('/').filter(Boolean)[0] || '', []);

      const isPrint    = useMemo(() => new URLSearchParams(window.location.search).get('_print') === '1', []);

      const params   = useMemo(() => getParams(), []);

      // Desk-location filter for the Check-Ins tab. Deliberately NOT persisted:

      const [ciLoc, setCiLoc] = useState(() => params.ci_loc || 'all');

      const [ciRowSet, setCiRowSet] = useState(() => params.ci_rows === 'failed' ? 'failed' : 'ok');

      // Residency scopes the WHOLE report. It is a DIMENSION, not a subject —

      const [sortDir, setSortDir] = useState(() => localStorage.getItem(LS_SORTDIR) || 'asc');
  const [insights, setInsights] = useState(null);

      // persist

      useEffect(() => { localStorage.setItem(LS_STARTDATE, startDate); }, [startDate]);
      useEffect(() => { localStorage.setItem(LS_ENDDATE,   endDate); }, [endDate]);

      // Clear insights when switching tabs so stale results don't carry over

      // Sync URL with loaded dates
      useEffect(() => {

        const qs = new URLSearchParams(window.location.search);
        qs.set('start_date', loadedStart);
        qs.set('end_date',   loadedEnd);
        if (activeTab === 'memberships') qs.delete('tab'); else qs.set('tab', activeTab);
        if (activeTab === 'checkins' && ciLoc !== 'all') qs.set('ci_loc', ciLoc); else qs.delete('ci_loc');
        if (activeTab === 'checkins' && ciRowSet === 'failed') qs.set('ci_rows', 'failed'); else qs.delete('ci_rows');
        const newUrl = window.location.pathname + '?' + qs.toString();
        window.history.replaceState(null, '', newUrl);
      }, [loadedStart, loadedEnd, activeTab, ciLoc, ciRowSet]);

      // ── Fetch ──
      const fetchData = useCallback((sd, ed) => {
        setLoading(true);
        setError(null);
        const qs = new URLSearchParams();
        if (sd) qs.set('start_date', sd);

        if (params._nocache === '1' || params._refresh === '1') qs.set('_nocache', '1');
        const qsStr = qs.toString();
        fetch(withToken(`/${orgSlug}/${reportType}/api/data${qsStr ? '?' + qsStr : ''}`))
          .then(r => {
            if (!r.ok) throw new Error(`Server returned ${r.status}`);
            return r.json();
          })
          .then(payload => {
            const rows = (payload.rows || payload.data || payload || []).map(normalizeRow);
            setData(rows);

          });
      }, [orgSlug]);

      useEffect(() => { fetchData(startDate, endDate); }, []);
      function fetchCheckins(sd, ed) {
        setCiLoading(true);
        setCiWin(sd + '|' + ed);
        fetch(withToken('/' + orgSlug + '/checkins/api/data?start_date=' + sd + '&end_date=' + ed))
          .then(function(r){ return r.json(); })
          .then(function(json) { setCiRows(json.rows || []); setCiMeta(json.meta || {}); setCiLoading(false); })
          .catch(function(e) { console.error('checkin fetch error', e); setCiLoading(false); });
      }

      const datesChanged = startDate !== loadedStart || endDate !== loadedEnd;

      // Fetch check-ins for a window only if they aren't already loaded for it —
      // keeps the Check-Ins tab in sync with the report's selected date range.
      function ensureCheckins(sd, ed) {
        if (!ciRows || ciWin !== (sd + '|' + ed)) fetchCheckins(sd, ed);
      }

      // Deep link straight to a tab (?tab=checkins), so a shared link lands where
      // the sender was looking instead of on Memberships.
      useEffect(() => { if (activeTab === 'checkins') fetchCheckins(startDate, endDate); }, []);

      // Activity pings for the Check-Ins tab. Fire-and-forget, and the event name
      // has to be in the log route's ALLOWED list or the beacon 400s silently.
      const ciBeacon = useCallback((event, extra) => {
        const qs = new URLSearchParams({ event: event });
        Object.keys(extra || {}).forEach(function(k){ if (extra[k] != null && extra[k] !== '') qs.set(k, String(extra[k])); });
        fetch(withToken('/' + orgSlug + '/' + reportType + '/api/log?' + qs.toString()),
              { method: 'POST', keepalive: true }).catch(function(){});
      }, [orgSlug]);

      // Successful check-ins, before the desk filter. Everything the tab has
      // always shown is built from this.
      const ciOk = useMemo(() => {
        if (!ciRows) return [];
        return ciRows.filter(function(r) { return !ciIsFailed(r); });
      }, [ciRows]);

      // Denied scans, before the desk filter.
      const ciFail = useMemo(() => {
        if (!ciRows) return [];
        return ciRows.filter(ciIsFailed);
      }, [ciRows]);

      // Does this feed know about Status at all? Until card 18151 ships the
      // column every row lacks it, and a Failed count of 0 would then read as
      // "nobody was turned away" rather than "we cannot see it yet". So the
      // failure figures are hidden, not zeroed, when the column is absent.
      const ciHasStatus = useMemo(() => {
        return !!(ciRows && ciRows.length && ciRows.some(function(r) { return r && r['Status'] !== undefined; }));
      }, [ciRows]);

      // The desk locations present in the loaded window, busiest first. Built from
      // the feed rather than a configured list, so a desk that stopped being used
      // drops out on its own and a new one appears without a deploy. Counts are
      // successful check-ins, so the number beside a desk matches what picking it
      // shows.
      const ciLocations = useMemo(() => {
        const n = {};
        ciOk.forEach(function(r) { const d = r['Desk Location'] || 'Unknown'; n[d] = (n[d] || 0) + 1; });
        return Object.keys(n).map(function(k){ return { name: k, n: n[k] }; })
                     .sort(function(a, b){ return b.n - a.n || a.name.localeCompare(b.name); });
      }, [ciOk]);

      // EVERY figure on the Check-Ins tab reads ciView, never ciRows — that is
      // what stops the filter from being applied to some panels and missed by
      // others (the bug the facility Summary chips had). It is now also what
      // stops a denied scan being counted as attendance.
      const ciView = useMemo(() => {
        if (!ciRows) return [];
        if (ciLoc === 'all') return ciOk;
        return ciOk.filter(function(r) { return (r['Desk Location'] || 'Unknown') === ciLoc; });
      }, [ciRows, ciOk, ciLoc]);

      // Failures scoped the same way, so the tile agrees with the desk filter
      // above it rather than quietly staying org-wide.
      const ciFailView = useMemo(() => {
        if (ciLoc === 'all') return ciFail;
        return ciFail.filter(function(r) { return (r['Desk Location'] || 'Unknown') === ciLoc; });
      }, [ciFail, ciLoc]);

      // A new window can contain no check-ins at the selected desk. Holding the
      // selection would show an empty tab with nothing saying why.
      useEffect(() => {
        if (ciLoc !== 'all' && ciRows && !ciLocations.some(function(l){ return l.name === ciLoc; })) setCiLoc('all');
      }, [ciRows, ciLocations, ciLoc]);

      // The row set actually in effect. Read this everywhere, never ciRowSet —
      // a window or desk with no failures resolves back to the accepted list,
      // so the reader is never left on an empty table whose toggle has gone.
      // `!!ciRows` is "the feed answered", which is what makes a zero count mean
      // "no refusals" rather than "nothing has arrived yet".
      const ciRowSetEff = ciEffectiveRowSet(ciRowSet, ciFailView.length, !!ciRows, ciView.length);

      // ...and put the state back, so the URL and the toggle agree with what is
      // on screen rather than remembering a selection that is not being honoured.
      // Gated on the feed having answered for the same reason: writing back
      // before it lands would destroy a ?ci_rows=failed link on mount.
      useEffect(() => {
        if (ciRows && ciRowSet !== ciRowSetEff) setCiRowSet(ciRowSetEff);
      }, [ciRows, ciRowSet, ciRowSetEff]);

      // The list the Recent Check-Ins panel renders. The ONLY place the failed
      // rows reach a panel.
      const ciListView = ciRowSetEff === 'failed' ? ciFailView : ciView;

      // The org uuid the member links are built from. AT COMPONENT SCOPE because
      // the check-in list reads it and that list is now a function declared above
      // the aggregate block — it used to be a `var` inside that block, which is
      // why extracting the list broke the tab with "recOrgId is not defined".
      // One copy, not two: the same value derived in two places drifts the first
      // time the feed's shape changes. See the coding rule in CLAUDE.md — define
      // derived values after everything they read, and never reach down the file.
      const recOrgId = ciMeta.org_id || meta.org_id || '';

      // Switch the list to the refused scans and take the reader to it. The KPI

      // The second caller is the reason it exists: a window where every scan was
      // refused has no successful check-ins, so the aggregate block below does not
      // render — and the reader was told "N scans were turned away" with no way to
      // see them, which is the exact gap this whole change is closing. A function
      // declaration, so it hoists (Babel turns const into var, and a helper below
      // its caller is then silently undefined rather than a throw naming it).
      function ciListPanel() {

              {ciHasStatus && ciFailView.length > 0 && ciView.length > 0 && (
                <div className="ci-slice-group" data-ci-rowset-toggle="1">
                  {[['ok','Accepted',ciView.length],['failed','Failed',ciFailView.length]].map(function(o){
                    return (
                      <button key={o[0]}
                              className={(ciRowSetEff === o[0] ? 'active' : '') + (o[0] === 'failed' ? ' ci-slice-fail' : '')}

                                if (o[0] === 'failed') showFailed(); else setCiRowSet('ok');
                              }}>
                        {o[1] + ' (' + o[2].toLocaleString() + ')'}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
            {/* The log records THAT a scan was refused and nothing about
                why: attendance_event.side_effects is [] on every denial,

            {ciRowSetEff === 'failed' && (
              <div style={{fontSize:11,color:'#9ca3af',marginBottom:8,marginTop:-2}} data-ci-failed-note="1">
                Scans refused at the desk. The check-in log records that a scan failed but not why,

              </div>
            )}
            <div style={{maxHeight:400,overflow:'auto'}}>
              <table className="ci-table"><thead><tr><th>Date</th><th>Time</th><th>Member</th><th>Member ID</th><th>Product</th><th>Type</th><th>Desk</th><th>Recorded By</th></tr></thead>
                <tbody>{ciListView.slice(0,200).map(function(r,i){
                  var nm = ((r['First Name']||'') + ' ' + (r['Last Name']||'')).trim();

                           onClick={function(){ ciBeacon('checkin-member'); }}
                           title={'Open ' + (nm || 'this member') + ' in Rec' + (r['Email'] ? ' · ' + r['Email'] : '')}
                           style={{color:'#1f2937',textDecoration:'none',borderBottom:'1px dotted #9ca3af'}}>
                          {nm || 'Unknown'}<span style={{fontSize:9,color:'#2563eb',marginLeft:3}}>↗</span>
                        </a>
                      : <span title={r['Email'] || ''}>{nm || 'Unknown'}</span>}</td>

                    <td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}} title={r['Product Name']}>{r['Product Name']}</td><td><span style={{fontSize:9,fontWeight:600,padding:'2px 6px',borderRadius:3,background:r['Check-In Type']==='membership'?'#dbeafe':'#ede9fe',color:r['Check-In Type']==='membership'?'#1e40af':'#5b21b6'}}>{r['Check-In Type']}</span></td><td>{r['Desk Location']}</td><td>{r['Recorded By']}</td></tr>
                );})}</tbody>
              </table>
              {ciListView.length > 200 && <div style={{textAlign:'center',padding:8,color:'#999',fontSize:11}}>Showing 200 of {ciListView.length.toLocaleString()}</div>}
            </div>
