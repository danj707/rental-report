        );
      }


      function handleRunReport() {
        fetchData(startDate, endDate);
        // Run refreshes check-ins for the new window whenever they're on screen
        // or already loaded, so switching back to the tab never shows a stale count.
        if (activeTab === 'checkins' || ciRows) fetchCheckins(startDate, endDate);
      }

      function setMonth(offset) {
        const now = new Date();
        const target = new Date(now.getFullYear(), now.getMonth() + offset, 1);
        const last   = new Date(target.getFullYear(), target.getMonth() + 1, 0);
        setStartDate(toISO(target));
        setEndDate(toISO(last));
        setActiveRange(offset === -1 ? 'last-month' : offset === 0 ? 'this-month' : 'next-month');
      }

      // ── Derived option lists ──
      const allTypes = useMemo(
        () => [...new Set(data.map(d => d.type).filter(Boolean))].sort(),
        [data]
      );
      const allStatuses = useMemo(
        () => [...new Set(data.map(d => d.status).filter(Boolean))].sort(),
        [data]
      );

      // initialize typeFilter once we know all types
      useEffect(() => {
        if (typeFilter === null && allTypes.length > 0) {
          setTypeFilter([...allTypes]);
        }
      }, [allTypes, typeFilter]);

      // ── Apply filters ──
      // Everything the toolbar asks for EXCEPT the status pill.
      //
      // A CHURN METRIC CANNOT BE COMPUTED OVER A VIEW THAT HIDES CHURN, and
      // `statusFilter` defaults to ['active'] — so a cancellation rate taken
      // from `filtered` is structurally 0.0% for every org, forever, and looks
      // like a healthy book rather than a broken number. Found by the render
      // check: the per-plan rate read 0% on a fixture built to make it 60%.
      //
      // The Auto-Renew tab reads THIS; every other panel reads `filtered`, so
      // the status pill keeps working exactly as before everywhere it means
      // something.
      const filteredAnyStatus = useMemo(() => {
        const q = search.trim().toLowerCase();
        const pMin = priceMin === '' ? null : parseFloat(priceMin);
        const pMax = priceMax === '' ? null : parseFloat(priceMax);
        return data.filter(r => {
          if (renewalFilter.length > 0 && !renewalFilter.includes(r.renewalType)) return false;
          if (typeFilter && typeFilter.length > 0 && !typeFilter.includes(r.type)) return false;
          // In filteredAnyStatus, so it scopes every panel — the Auto-Renew tab
          // reads this, everything else reads `filtered`, which derives from it.
          // A row whose residency is unknowable (no column, or an org with no
          // residency group) is never excluded: narrowing a book on a guess is
          // the denominator mistake this report has already made twice.
          if (residencyFilter) {
            const rk = mbResidencyKey(r);
            if (rk !== null && rk !== residencyFilter) return false;
          }
          if (pMin !== null && r.price < pMin) return false;
          if (pMax !== null && r.price > pMax) return false;
          if (q) {
            const blob = `${r.firstName} ${r.lastName} ${r.email} ${r.type} ${r.group}`.toLowerCase();
            if (!blob.includes(q)) return false;
          }
          return true;
        });
      }, [data, renewalFilter, typeFilter, priceMin, priceMax, search, residencyFilter]);

      const filtered = useMemo(
        () => (statusFilter.length > 0
          ? filteredAnyStatus.filter(r => statusFilter.includes(r.status))
          : filteredAnyStatus),
        [filteredAnyStatus, statusFilter]);

      // ── Resident vs non-resident ───────────────────────────────────────
      // Computed over filteredAnyStatus, NOT `filtered`: this panel is a
      // breakdown of the book, and the status filter defaults to ['active'],
      // so taking it from `filtered` would silently answer a different
      // question than the one the heading asks. (The same trap that made the
      // cancellation rate structurally 0.0% for every org.)
      //
      // It reads mbResidencyKey — the SAME predicate the toolbar filter reads,
      // so the panel and the filter cannot disagree about who is a resident.
      //
      // Deliberately shown even when a residency filter is active: it then
      // reports the slice you are looking at, which is what a reader expects
      // of a breakdown sitting under a scoped page.
      //
      // IT LEADS WITH THE PAID BOOK. A residency register is mostly FREE
      // verification records — El Segundo has 2,337 of 3,275 priced at $0, and
      // 1,989 of those are the resident side — so counting every record made
      // the panel read "73.2% of the book · $2,949": residents as 73% of the
      // book earning 22% of the money. Both figures were right and together
      // they read as a mistake. The share is now taken over records somebody
      // actually paid for, which is the question "resident vs non-resident"
      // is asked to answer, and the free records are stated beside it rather
      // than folded in or hidden.
      //
      // A $0 record is a real membership, just not a purchase — so `free` is
      // reported, never dropped. And an org with NO free records reads exactly
      // as it did before.
      const residencySplit = useMemo(() => {
        if (!mbHasResidency(data)) return null;
        const blank = () => ({ n: 0, revenue: 0, autoRenew: 0, free: 0 });
        const acc = { resident: blank(), nonresident: blank(), unknown: blank() };
        for (const r of filteredAnyStatus) {
          const k = mbResidencyKey(r) || 'unknown';
          const isPaid = (r.price || 0) > 0;
          if (isPaid) {
            acc[k].n++;
            acc[k].revenue += (r.netCollected || 0);
            if (mbIsAutoRenew(r)) acc[k].autoRenew++;
          } else {
            acc[k].free++;
          }
        }
        const known = acc.resident.n + acc.nonresident.n;
        const freeKnown = acc.resident.free + acc.nonresident.free;
        return {
          ...acc,
          known,
          free: freeKnown + acc.unknown.free,
          freeResident: acc.resident.free,
          residentPct: known > 0 ? Math.round(acc.resident.n / known * 1000) / 10 : null,
        };
      }, [data, filteredAnyStatus]);

      // ── Summary metrics ──
      const summary = useMemo(() => {
        const all = filtered;
        const byStatus = { active:0, canceled:0, expired:0, inactive:0 };
        let autoRenewCount = 0, mrrEstimate = 0;
        let totalRevenue = 0, totalNetCollected = 0;
        for (const r of all) {
          byStatus[r.status] = (byStatus[r.status] || 0) + 1;
          totalRevenue += r.price;
          totalNetCollected += r.netCollected;
          // Routed through the shared helper so this KPI and the Auto-Renew tab
          // cannot report different numbers for the same thing on the same page
          // — the disagreement trap the facility Summary already shipped once.
          // On a pre-v2 feed mbIsAutoRenew IS this test, so today's figure is
          // unchanged; on v2 it picks up the 88 memberships whose renewal date
          // has been cleared but whose subscription is live.
          if (r.status === 'active' && mbIsAutoRenew(r)) {
            autoRenewCount++;
            mrrEstimate += r.price;
          }
        }
        return {
          total: all.length,
          ...byStatus,
          autoRenewCount,
          mrrEstimate,
          totalRevenue,
          totalNetCollected,
        };
      }, [filtered]);

      // ── Sorted rows for table ──
      const sortedRows = useMemo(
        () => sortRows(filtered, sortKey, sortDir),
        [filtered, sortKey, sortDir]
      );

      // ── Auto-renew economics (card 17301 v2) ──
      // Scoped to ACTIVE PAID memberships: a cancelled or expired row has no
      // future charge, and a $0 residency record never had one.
      const arStats = useMemo(() => {
        const paidAll = filtered.filter(r => r.status === 'active' && mbIsPaid(r));
        // THE DENOMINATOR IS WHAT COULD AUTO-RENEW, not everything that is paid.
        // Passes, season plans and rolling terms all end on a date instead of
        // recurring, and not one of them on the platform carries a subscription
        // — see mbCanAutoRenew for the measurement. They are named and counted
        // in the scope note rather than silently dropped, because "excluded 2,678
        // season passes worth $317,180" is itself worth reading.
        const paid = paidAll.filter(mbCanAutoRenew);
        const excluded = { pass: [], season: [], term: [] };
        for (const r of paidAll) {
          if (mbCanAutoRenew(r)) continue;
          const sh = mbProductShape(r);
          if (excluded[sh]) excluded[sh].push(r);
        }
        const exGroup = k => ({ n: excluded[k].length,
                                value: excluded[k].reduce((s, r) => s + r.price, 0) });
        const on = paid.filter(mbIsAutoRenew);
        // ONE POPULATION FOR ALL THREE MONEY CARDS. They used to disagree: the
        // charge total covered every auto-renewer while the monthly figure
        // covered only those with a known billing cycle, so "$78,699 billed per
        // cycle, yet $69,043 monthly" looked like broken arithmetic. It was two
        // correct sums over different sets. At Apex only 2 of 1,030 lack a
        // cycle, so the cost of excluding them is small and the cost of the
        // cards not reconciling is that nobody trusts any of them.
        let perCycle = 0, monthly = 0, withCycle = 0, noCycle = 0, noCycleValue = 0;
        const cycles = [];
        for (const r of on) {
          const mv = mbMonthlyValue(r);
          if (mv != null) {
            perCycle += r.price; monthly += mv; withCycle++; cycles.push(mbCycleDays(r));
          } else {
            noCycle++; noCycleValue += r.price;
          }
        }
        cycles.sort((a, b) => a - b);
        // Candidates to CONVERT: a recurring-shaped product renewing by hand.
        // Season passes are excluded on purpose — a season pass expiring is the
        // season closing, not a member lapsing, and putting it here would send
        // an admin chasing churn that does not exist.
        const candidates = paid.filter(r => !mbIsAutoRenew(r) && mbProductShape(r) === 'open');
        return {
          count: on.length,
          paidActive: paid.length,
          paidAll: paidAll.length,
          excluded: { pass: exGroup('pass'), season: exGroup('season'), term: exGroup('term') },
          hasKind: mbHasProductKind(filtered),
          perCycle,
          monthly,
          withCycle,
          medianCycle: cycles.length ? cycles[Math.floor(cycles.length / 2)] : null,
          arpu: withCycle ? monthly / withCycle : null,
          avgCharge: withCycle ? perCycle / withCycle : 0,
          noCycle, noCycleValue,
          candidates: candidates.length,
          candidateValue: candidates.reduce((s, r) => s + r.price, 0),
          // WHICH plans, not just how many. "5" is a number to wonder about;
          // "4 on 1 Month Individual Cash, 1 on 1 Month Family" is the list an
          // admin works through. These are the rows that used to sit in the
          // table above at 0% pretending to be part of the auto-renew book.
          candidatePlans: Object.entries(candidates.reduce((acc, r) => {
            const k = mbPlanKey(r);
            acc[k] = (acc[k] || 0) + 1;
            return acc;
          }, {})).map(([plan, n]) => ({ plan, n })).sort((a, b) => b.n - a.n),
          hasEconomics: mbHasEconomics(filtered),
        };
      }, [filtered]);

      // Auto-renew adoption per plan. The finding this exists to surface: on
      // prod, 268 of 317 paid plans have ZERO members on auto-renew and 47 have
      // every member on it — it is a plan setting, not a member choice — so the
      // useful unit is the plan, not the member.
      // THIS TABLE IS THE AUTO-RENEW BOOK, and it answers the question Dan
      // actually asks of it: "which a/r memberships are working out the best,
      // which have a high cancellation rate."
      //
      // So a row is a PLAN, and the population is every membership on that plan
      // that has ever been on auto-renew in this window — cancelled ones very
      // much included, because a plan's cancellation rate is unmeasurable
      // without them. (The subscription id PERSISTS after cancellation, which
      // is what makes "ever on auto-renew" answerable at all; next_renewal_at
      // does not, which is why renewal counts are live-only.)
      //
      // Membership of the table is `on > 0` — a plan nobody auto-renews on is
      // not part of the book. That one rule subsumes every exclusion argued for
      // in earlier rounds: a pass, a season plan and a desk-paid cash plan all
      // have nobody enrolled and fall out together instead of as three special
      // cases. An eligible-but-unenrolled plan is a CANDIDATE, named on the
      // Could Convert card where it can be acted on.
      const arPlans = useMemo(() => {
        const m = new Map();
        // One pass first: the cadence each plan bills on. A row's own two
        // timestamps are not the cadence -- see mbPlanCycles.
        const cycles = mbPlanCycles(filteredAnyStatus.filter(r => mbIsPaid(r) && mbIsAutoRenew(r)));
        for (const r of filteredAnyStatus) {
          if (!mbIsPaid(r) || !mbIsAutoRenew(r)) continue;
          const k = mbPlanKey(r);
          if (!m.has(k)) m.set(k, { plan: k, n: 0, on: 0, canceled: 0, pending: 0,
                                    pendingRows: [],
                                    renewSum: 0, renewN: 0, maxRenew: 0,
                                    shape: mbProductShape(r), price: r.price });
          const e = m.get(k);
          e.n++;
          if (mbIsCanceled(r)) e.canceled++; else e.on++;
          // KEEP THE ROWS, not just a count. Dan: "can we add a drop
          // down/expansion option here to show WHO those two users are? Kinda
          // unhelpful otherwise." A count with nowhere to go is the same dead
          // end the Failed check-ins tile had.
          if (mbCancelPending(r)) { e.pending++; e.pendingRows.push(r); }
          const rn = mbRenewalsSoFar(r, cycles[k]);
          // Averaged over the memberships that CAN answer, not over the plan.
          // Folding a cancelled membership in as 0 would drag a healthy plan's
          // average down in proportion to how many people it has kept billing.
          if (rn != null) { e.renewSum += rn; e.renewN++; if (rn > e.maxRenew) e.maxRenew = rn; }
        }
        return Array.from(m.values())
          .filter(p => p.n > 0)
          .map(p => Object.assign(p, {
            // Kept as a sub-line, honestly labelled: this is everyone who has
            // EVER been on the plan, not a rate.
            everCancelled: p.n ? p.canceled / p.n : 0,
            avgRenewals: p.renewN ? p.renewSum / p.renewN : null,
            cycleDays: cycles[p.plan] != null ? cycles[p.plan] : null,
            cadence: mbCadence(cycles[p.plan]),
            churn: mbChurnPerCycle(p.renewSum, p.canceled),
          }))
          .sort((a, b) => b.n - a.n);
      }, [filteredAnyStatus]);

      // THREE PLAIN-LANGUAGE HIGHLIGHTS. Dan asked for the top plan by revenue and
      // the best and worst by churn — the answers a reader wants before reading a
      // twelve-row table.
      //
      // Best/worst are ranked ONLY over plans with enough members to mean
      // something: a 3-member plan at 0% is not "your best plan", it is three
      // people who have not left yet, and putting it on a headline card is how a
      // chart lies. The same 20-member floor the retention panel warns at.
      const AR_RANK_MIN = 20;
      const arHighlights = useMemo(() => {
        const rankable = arPlans.filter(p => p.n >= AR_RANK_MIN && p.churn != null);
        const byChurn = rankable.slice().sort((a, b) => a.churn - b.churn);
        // Revenue ranks over EVERY plan: a big plan is a big plan whatever its
        // size relative to the floor, and no rate is being asserted about it.
        const byRevenue = arPlans.slice().sort((a, b) => (b.n * b.price) - (a.n * a.price));
        return {
          topRevenue: byRevenue[0] || null,
          best:  byChurn[0] || null,
          worst: byChurn.length > 1 ? byChurn[byChurn.length - 1] : null,
          rankable: rankable.length,
          floor: AR_RANK_MIN,
        };
      }, [arPlans]);

      // The auto-renew book as one population, for the KPI row and the cohort
      // chart. Same predicate as the table, so a plan row and the header can
      // never disagree about who is in the book.
      const arBook = useMemo(() => {
        const book = filteredAnyStatus.filter(r => mbIsPaid(r) && mbIsAutoRenew(r));
        const cycles = mbPlanCycles(book);
        let renewals = 0, renewN = 0, canceled = 0, pending = 0;
        for (const r of book) {
          const rn = mbRenewalsSoFar(r, cycles[mbPlanKey(r)]);
          if (rn != null) { renewals += rn; renewN++; }
          if (mbIsCanceled(r)) canceled++;
          if (mbCancelPending(r)) pending++;
        }
        return {
          rows: book,
          size: book.length,
          renewals, renewN,
          avgRenewals: renewN ? renewals / renewN : null,
          canceled,
          // LIFETIME-TO-DATE, kept as context and labelled as such.
          everCancelled: book.length ? canceled / book.length : null,
          // The rate that is comparable: share of renewal opportunities that
          // ended in a cancellation, reported in the book's own cadence.
          churn: mbChurnPerCycle(renewals, canceled),
          // NO period label at book level, deliberately. The book mixes weekly,
          // monthly and annual plans, so "per month" would be false for some of
          // it — and "always report churn based on its renewal period" is
          // exactly what that would break. Per RENEWAL is unit-free and true
          // whatever the mix; the per-plan table names each plan's own cadence.
          cycleCount: Object.keys(cycles).length,
          pending,
          hasSchedule: mbHasCancelSchedule(filteredAnyStatus),
        };
      }, [filteredAnyStatus]);

      // ── Sales & mix: units AND revenue per month ──
      // Two series on purpose. They move in opposite directions twice a year at
      // a seasonal org, and either alone tells the wrong story.
      const salesMonths = useMemo(() => {
        const m = new Map();
        for (const r of filtered) {
          if (!mbIsPaid(r) || !r.createdAt) continue;
          const k = ciMonthKey(r.createdAt);
          if (!k) continue;
          if (!m.has(k)) m.set(k, { month: k, units: 0, revenue: 0 });
          const e = m.get(k);
          e.units++;
          e.revenue += r.price;
        }
        return Array.from(m.values())
          .sort((a, b) => a.month < b.month ? -1 : 1)
          .map(x => Object.assign(x, { avgPrice: x.units ? x.revenue / x.units : 0 }));
      }, [filtered]);

      // Plan mix with the PRICE beside the units — the only way "why is this
      // one unpopular" is answerable. On prod this is what shows an annual plan
      // priced at exactly 12x its own monthly, which nobody buys.
      const planMix = useMemo(() => {
        const m = new Map();
        for (const r of filtered) {
          if (!mbIsPaid(r)) continue;
          const k = mbPlanKey(r);
          if (!m.has(k)) m.set(k, { plan: k, units: 0, revenue: 0, on: 0, shape: mbProductShape(r) });
          const e = m.get(k);
          e.units++;
          e.revenue += r.price;
          if (mbIsAutoRenew(r)) e.on++;
        }
        return Array.from(m.values())
          .map(x => Object.assign(x, { price: x.units ? x.revenue / x.units : 0 }))
          .sort((a, b) => b.units - a.units);
      }, [filtered]);

      const onSort = (k) => {
        if (sortKey === k) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
        else { setSortKey(k); setSortDir('asc'); }
      };

    
  // ── AI Insights ──
  const buildInsightsBlob = useCallback(() => {
    if (activeTab === 'autorenew') {
      if (!arBook.size) return null;
      // Pre-computed and LABELLED, because the model must not mistake the
      // lifetime figure for churn or compare a weekly rate to a monthly one.
      // Every rate ships beside the cadence it is measured in.
      return {
        tab: 'autorenew',
        book: {
          onAutoRenew: arBook.size,
          stillActive: arBook.size - arBook.canceled,
          billedPerCycle: Math.round(arStats.perCycle),
          monthlyRevenue: Math.round(arStats.monthly),
          revenuePerMember: arStats.arpu == null ? null : Math.round(arStats.arpu),
          churnPerRenewalPct: arBook.churn == null ? null : Math.round(arBook.churn * 1000) / 10,
          everCancelledPct: arBook.everCancelled == null ? null : Math.round(arBook.everCancelled * 100),
          renewalsToDate: arBook.renewals,
          pendingCancel: arBook.hasSchedule ? arBook.pending : null,
        },
        candidates: {
          count: arStats.candidates,
          value: Math.round(arStats.candidateValue),
          plans: arStats.candidatePlans.slice(0, 8),
          note: 'auto-renew is only available on a credit card, so these need a card on file',
        },
        plans: arPlans.slice(0, 20).map(function(p) {
          return {
            plan: p.plan,
            onAutoRenew: p.n,
            stillActive: p.on,
            cancelled: p.canceled,
            price: p.price,
            cadence: p.cadence ? p.cadence.per : null,
            cycleDays: p.cycleDays == null ? null : Math.round(p.cycleDays),
            churnPerCyclePct: p.churn == null ? null : Math.round(p.churn * 1000) / 10,
            everCancelledPct: Math.round(p.everCancelled * 100),
            avgRenewals: p.avgRenewals == null ? null : Math.round(p.avgRenewals * 10) / 10,
            pendingCancel: p.pending,
            revenuePerCycle: Math.round(p.n * p.price),
            thin: p.n < 20,
          };
        }),
        // WHEN people leave, for the seasonality half of the question.
        cancellationsByMonth: (function() {
          var m = {};
          arBook.rows.forEach(function(r) {
            if (!r.canceledAt) return;
            var k = monthKey(r.canceledAt);
            if (k) m[k] = (m[k] || 0) + 1;
          });
          return m;
        })(),
      };
    }
    if (activeTab === 'checkins') {
      if (!ciView || !ciView.length) return null;
      var hourCts = {}; var dayCts = {}; var deskCts = {}; var prodCts = {}; var uniqM = new Set();
      ciView.forEach(function(r) {
        uniqM.add(r['Member ID']);
        var h = parseInt(r['Hour']); hourCts[h] = (hourCts[h]||0)+1;
        var dow = (r['Day of Week']||'').trim(); dayCts[dow] = (dayCts[dow]||0)+1;
        var desk = r['Desk Location']||'Unknown'; deskCts[desk] = (deskCts[desk]||0)+1;
        var prod = r['Product Name']||'Unknown'; prodCts[prod] = (prodCts[prod]||0)+1;
      });
      var memCt = ciView.filter(function(r){return r['Check-In Type']==='membership';}).length;
      var passCt = ciView.filter(function(r){return r['Check-In Type']==='pass';}).length;
      var uniqueDts = new Set(ciView.map(function(r){ return r['Date']; }));
      return { reportContext: 'check-ins', totalCheckIns: ciView.length, uniqueMembers: uniqM.size, days: uniqueDts.size,
        avgPerDay: uniqueDts.size > 0 ? Math.round(ciView.length / uniqueDts.size) : 0,
        membershipVsPass: { membership: memCt, pass: passCt },
        // Named so the model never describes one desk's numbers as the org's.
        deskLocationFilter: ciLoc === 'all' ? 'all locations' : ciLoc,
        byHour: hourCts, byDayOfWeek: dayCts, byDeskLocation: deskCts, byProduct: prodCts };
    }
    if (activeTab === 'retention') {
      if (!data || !data.length) return null;
      return { reportContext: 'retention', totalMembers: data.length, note: 'Retention cohort analysis tab' };
    }
    if (!data || !data.length) return null;
    const byStatus = {}; const byType = {};
    data.forEach(r => { byStatus[r.status||'unknown'] = (byStatus[r.status||'unknown']||0)+1;
      byType[r.membershipName||r.type||'unknown'] = (byType[r.membershipName||r.type||'unknown']||0)+1; });
    return { reportContext: 'memberships', totalMembers: data.length, byStatus, byType,
      sample: data.slice(0,20).map(r => ({ type: r.membershipName||r.type, status: r.status, revenue: r.revenue||r.amount })) };
  }, [data, ciView, ciLoc, activeTab]);

  const sendInsightsFeedback = useCallback((score) => {
    if (!insightsTraceId) return;
    fetch(withToken('/' + orgSlug + '/memberships' + '/api/insights/score'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ traceId: insightsTraceId, score, comment: score === 0 ? fbComment : '' }),
    }).catch(() => {});
    setFbSent(true); setFbMode(null);
  }, [insightsTraceId, fbComment]);

  const getInsights = useCallback(async () => {
    const blob = buildInsightsBlob();
    if (!blob) return;
    setInsightsLoading(true); setInsightsError(null);
    try {
      const path = activeTab === 'autorenew' ? '/api/autorenew-insights' : '/api/insights';
      const resp = await fetch(withToken('/' + orgSlug + '/memberships' + path), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(blob),
      });
      const json = await resp.json().catch(() => ({}));
      if (!resp.ok || !json.ok) throw new Error(json.error || 'Request failed');
      setInsights(json.insights || []);
      setInsightsTraceId(json.traceId || null);
      setFbSent(false); setFbMode(null); setFbComment('');
    } catch (err) {
      setInsightsError(err.message);
    } finally {
      setInsightsLoading(false);
    }
  }, [buildInsightsBlob, activeTab]);

  // ── Excel export ──
      function toXlDate(s) { if (!s) return ''; const p = String(s).split('T')[0].split('-'); return p.length === 3 ? new Date(+p[0], +p[1]-1, +p[2]) : s; }
      const exportExcel = () => {
        const rows = sortedRows.map(r => ({
          'User ID':        r.userId,
          'First Name':     r.firstName,
          'Last Name':      r.lastName,
          'Email':          r.email,
          'Membership ID':  r.membershipId,
          'Membership Type': r.type,
          'Group / Plan':   r.group,
          'Status':         r.status,
          'Renewal Type':   r.renewalType,
          'Price':          r.price,
          'Paid':           r.paid,
          'Refunded':       r.refunded,
          'Net Collected':  r.netCollected,
          'Start Date':     toXlDate(r.startDate),
          'End Date':       toXlDate(r.endDate),
          'Next Renewal':   toXlDate(r.nextRenewal),
          'Canceled At':    toXlDate(r.canceledAt),
          'Created At':     toXlDate(r.createdAt),
          'Last Used':      toXlDate(r.lastUsed),
          'Usage Count':    r.usageCount,
          'Attendance Count': r.attendanceCount,
          // '' rather than 'No' where residency is unknowable, so a spreadsheet
          // pivot cannot quietly file the unknown as non-resident.
          'Resident?':      mbResidencyKey(r) === 'resident' ? 'Yes' : mbResidencyKey(r) === 'nonresident' ? 'No' : '',
        }));
        // totals row
        rows.push({
          'User ID': '',
          'First Name': '',
          'Last Name': 'TOTAL',
          'Email': '',
          'Membership ID': '',
          'Membership Type': '',
          'Group / Plan': '',
          'Status': '',
          'Renewal Type': '',
          'Price': rows.reduce((s, x) => s + safeNum(x.Price), 0),
          'Paid': rows.reduce((s, x) => s + safeNum(x.Paid), 0),
          'Refunded': rows.reduce((s, x) => s + safeNum(x.Refunded), 0),
          'Net Collected': rows.reduce((s, x) => s + safeNum(x['Net Collected']), 0),
          'Resident?': '',
          'Start Date': '',
          'End Date': '',
          'Next Renewal': '',
          'Canceled At': '',
          'Created At': '',
          'Last Used': '',
          'Usage Count': rows.reduce((s, x) => s + safeNum(x['Usage Count']), 0),
          'Attendance Count': rows.reduce((s, x) => s + safeNum(x['Attendance Count']), 0),
        });
        const ws = XLSX.utils.json_to_sheet(rows, { cellDates: true });
        const dateCols = ['Start Date','End Date','Next Renewal','Canceled At','Created At','Last Used'];
        const hdr = Object.keys(rows[0] || {});
        const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
        for (let ri = 1; ri <= range.e.r; ri++) {
          dateCols.forEach(dc => {
            const ci = hdr.indexOf(dc); if (ci < 0) return;
            const addr = XLSX.utils.encode_cell({ r: ri, c: ci });
            if (ws[addr] && ws[addr].t === 'd') ws[addr].z = 'MM/DD/YY';
          });
        }
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Memberships');
        const fname = `${orgSlug}-memberships-${new Date().toISOString().slice(0,10)}.xlsx`;
        // Handed to a popup to save rather than written straight from here — a
        // download started by a sandboxed iframe is silently dropped. See open-pdf.js.
        saveWorkbookViaPopup(XLSX, wb, fname);
        // log
        fetch(withToken(`/${orgSlug}/${reportType}/api/log?event=excel`), { method: 'POST', keepalive: true }).catch(()=>{});
      };

      const printPage = () => {
        fetch(withToken(`/${orgSlug}/${reportType}/api/log?event=print`), { method: 'POST', keepalive: true }).catch(()=>{});
        window.print();
      };

      const [pdfLoading, setPdfLoading] = useState(false);
      const downloadPdf = () => {
        const qs = new URLSearchParams();
        if (loadedStart) qs.set('start_date', loadedStart);
        if (loadedEnd)   qs.set('end_date',   loadedEnd);
        qs.set('view', viewMode);
        const url = withToken(`/${orgSlug}/${reportType}/api/pdf?${qs.toString()}`);
        // Opened in its own window rather than downloaded — a download started by
        // a sandboxed iframe is silently dropped. See open-pdf.js.
        openReportPdf(url, { label: 'Memberships' });
      };

      // ── Status pill ──
      const StatusPill = ({ status }) => (
        <span className={`status-pill ${status}`}>{status}</span>
      );
      const RenewalPill = ({ type }) => (
        <span className={`renewal-pill ${type === 'Auto-renew' ? 'auto' : 'onetime'}`}>{type}</span>
      );

      // ── Render content ──
      const PDF_ROW_LIMIT = 500;

      function renderTable() {
        const displayRows = isPrint && sortedRows.length > PDF_ROW_LIMIT
          ? sortedRows.slice(0, PDF_ROW_LIMIT) : sortedRows;
        const isTruncated = isPrint && sortedRows.length > PDF_ROW_LIMIT;
        const cols = [
          { key: 'lastName',    label: 'Name' },
          { key: 'email',       label: 'Email' },
          { key: 'type',        label: 'Membership Type' },
          { key: 'status',      label: 'Status' },
          { key: 'renewalType', label: 'Renewal' },
          { key: 'price',       label: 'Price', num: true },
          { key: 'paid',        label: 'Paid', num: true },
          { key: 'refunded',    label: 'Refunded', num: true },
          { key: 'netCollected', label: 'Net Collected', num: true },
          { key: 'startDate',   label: 'Start' },
          { key: 'nextRenewal', label: 'Next Renewal' },
          { key: 'lastUsed',    label: 'Last Used' },
          { key: 'usageCount',  label: 'Uses', num: true },
        ];
        return (
          <React.Fragment>
          <table className="report">
            <thead>
              <tr>
                {cols.map(c => (
                  <th
                    key={c.key}
                    className={`${c.num ? 'num' : ''} ${sortKey === c.key ? 'sorted-' + sortDir : ''}`}
                    onClick={() => onSort(c.key)}
                  >
                    {c.label}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {displayRows.map((r, i) => (
                <tr key={r.membershipId + '-' + i}>
                  <td><strong>{r.lastName && r.firstName ? `${r.lastName}, ${r.firstName}` : r.lastName || r.firstName || '—'}</strong></td>
                  <td style={{color:'#666'}}>{r.email}</td>
                  <td>{r.type}</td>
                  <td><StatusPill status={r.status} /></td>
                  <td><RenewalPill type={r.renewalType} /></td>
                  <td className="num">{money(r.price)}</td>
                  <td className="num">{money(r.paid)}</td>
                  <td className="num" style={{color: r.refunded > 0 ? '#ef4444' : undefined}}>{money(r.refunded)}</td>
                  <td className="num" style={{fontWeight: 600}}>{money(r.netCollected)}</td>
                  <td>{r.startDate ? dateOnly(r.startDate) : <span style={{color:'#ccc'}}>—</span>}</td>
                  <td>{r.nextRenewal ? dateOnly(r.nextRenewal) : <span style={{color:'#ccc'}}>—</span>}</td>
                  <td>{r.lastUsed ? dateOnly(r.lastUsed) : <span style={{color:'#ccc'}}>—</span>}</td>
                  <td className="num">{r.usageCount}</td>
                </tr>
              ))}
            </tbody>
          </table>
          {isTruncated && (
            <div style={{textAlign:'center', padding:'12px 0', color:'#888', fontSize:11, borderTop:'1px solid #eee', marginTop:8}}>
              Showing first {PDF_ROW_LIMIT.toLocaleString()} of {sortedRows.length.toLocaleString()} memberships. Use Excel export for the full dataset.
            </div>
          )}
        </React.Fragment>
        );
      }

      function renderByType() {
        const counts = {};
        for (const r of filtered) {
          counts[r.type] = (counts[r.type] || 0) + 1;
        }
        const entries = Object.entries(counts).sort((a,b) => b[1] - a[1]);
        return (
          <div className="chart-card">
            <h3>Memberships by Type ({entries.length} types, {filtered.length} total)</h3>
            <ChartView
              type="bar"
              height={Math.min(900, Math.max(320, entries.length * 32))}
              data={{
                labels: entries.map(e => e[0]),
                datasets: [{
                  label: 'Count',
                  data: entries.map(e => e[1]),
                  backgroundColor: '#db2777',
                  borderRadius: 3,
                }]
              }}
              options={{
                indexAxis: 'y',
                plugins: { legend: { display: false } },
                scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } },
                maintainAspectRatio: false,
              }}
            />
          </div>
        );
      }

      function renderByStatus() {
        const counts = { active:0, canceled:0, expired:0, inactive:0 };
        for (const r of filtered) {
          counts[r.status] = (counts[r.status] || 0) + 1;
        }
        const labels = Object.keys(counts).filter(k => counts[k] > 0);
        const colors = { active:'#16a34a', canceled:'#ef4444', expired:'#f59e0b', inactive:'#94a3b8' };
        return (
          <div className="chart-card" style={{maxWidth:560, margin:'0 auto'}}>
            <h3>Memberships by Status</h3>
            <ChartView
              type="doughnut"
              height={320}
              data={{
                labels: labels.map(l => `${l} (${counts[l]})`),
                datasets: [{
                  data: labels.map(l => counts[l]),
                  backgroundColor: labels.map(l => colors[l]),
                  borderWidth: 2,
                  borderColor: '#fff',
                }]
              }}
              options={{
                plugins: { legend: { position: 'right' } },
                maintainAspectRatio: false,
              }}
            />
          </div>
        );
      }

      function renderRenewalMix() {
        let auto = 0, one = 0, autoRev = 0, oneRev = 0;
        for (const r of filtered) {
          if (r.renewalType === 'Auto-renew') { auto++; autoRev += r.netCollected; }
          else { one++; oneRev += r.netCollected; }
        }
        return (
          <div className="chart-grid two-col">
            <div className="chart-card">
              <h3>Renewal Mix — Count</h3>
              <ChartView
                type="doughnut"
                height={300}
                data={{
                  labels: [`Auto-renew (${auto})`, `One-time (${one})`],
                  datasets: [{
                    data: [auto, one],
                    backgroundColor: ['#db2777', '#94a3b8'],
                    borderWidth: 2,
                    borderColor: '#fff',
                  }]
                }}
                options={{
                  plugins: { legend: { position: 'right' } },
                  maintainAspectRatio: false,
                }}
              />
            </div>
            <div className="chart-card">
              <h3>Renewal Mix — Revenue</h3>
              <ChartView
                type="doughnut"
                height={300}
                data={{
                  labels: [`Auto-renew (${money(autoRev)})`, `One-time (${money(oneRev)})`],
                  datasets: [{
                    data: [autoRev, oneRev],
                    backgroundColor: ['#db2777', '#94a3b8'],
                    borderWidth: 2,
                    borderColor: '#fff',
                  }]
                }}
                options={{
                  plugins: {
                    legend: { position: 'right' },
                    tooltip: { callbacks: { label: (c) => `${c.label}: ${money(c.parsed)}` } },
                  },
                  maintainAspectRatio: false,
                }}
              />
            </div>
          </div>
        );
      }

      function renderRevenueByType() {
        const byType = {};
        for (const r of filtered) {
          if (!byType[r.type]) byType[r.type] = { active:0, canceled:0, expired:0, inactive:0 };
          byType[r.type][r.status] = (byType[r.type][r.status] || 0) + r.netCollected;
        }
        const entries = Object.entries(byType)
          .map(([k, v]) => ({ key: k, total: v.active + v.canceled + v.expired + v.inactive, ...v }))
          .sort((a,b) => b.total - a.total);
        return (
          <div className="chart-card">
            <h3>Revenue by Membership Type (stacked by status)</h3>
            <ChartView
              type="bar"
              height={Math.min(900, Math.max(320, entries.length * 34))}
              data={{
                labels: entries.map(e => e.key),
                datasets: [
                  { label: 'Active',   data: entries.map(e => e.active),   backgroundColor: '#16a34a' },
                  { label: 'Canceled', data: entries.map(e => e.canceled), backgroundColor: '#ef4444' },
                  { label: 'Expired',  data: entries.map(e => e.expired),  backgroundColor: '#f59e0b' },
                  { label: 'Inactive', data: entries.map(e => e.inactive), backgroundColor: '#94a3b8' },
                ]
              }}
              options={{
                indexAxis: 'y',
                plugins: {
                  legend: { position: 'top' },
                  tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${money(c.parsed.x)}` } },
                },
                scales: {
                  x: { stacked: true, beginAtZero: true, ticks: { callback: (v) => '$' + v.toLocaleString() } },
                  y: { stacked: true },
                },
                maintainAspectRatio: false,
              }}
            />
          </div>
        );
      }

      function renderMonthlyRevenue() {
        const byMonth = {};
        for (const r of filtered) {
          const m = monthKey(r.createdAt);
          if (!m) continue;
          byMonth[m] = (byMonth[m] || 0) + r.netCollected;
        }
        const sortedKeys = Object.keys(byMonth).sort();
        const labels = sortedKeys.map(k => {
          const [y,mo] = k.split('-');
          return new Date(parseInt(y), parseInt(mo)-1, 1)
            .toLocaleDateString('en-US', { year: 'numeric', month: 'short' });
        });
        return (
          <div className="chart-card">
            <h3>Net Collected by Month (based on Created Date)</h3>
            <ChartView
              type="bar"
              height={340}
              data={{
                labels,
                datasets: [{
                  label: 'Revenue',
                  data: sortedKeys.map(k => byMonth[k]),
                  backgroundColor: '#3b82f6',
                  borderRadius: 3,
                }]
              }}
              options={{
                plugins: {
                  legend: { display: false },
                  tooltip: { callbacks: { label: (c) => money(c.parsed.y) } },
                },
                scales: {
                  y: { beginAtZero: true, ticks: { callback: (v) => '$' + v.toLocaleString() } },
                },
                maintainAspectRatio: false,
              }}
            />
          </div>
        );
      }

      function renderUpcomingRenewals() {
        const buckets = { '7':0, '30':0, '60':0, '90':0, 'beyond':0 };
        const bucketRev = { '7':0, '30':0, '60':0, '90':0, 'beyond':0 };
        for (const r of filtered) {
          if (r.renewalType !== 'Auto-renew' || r.status !== 'active') continue;
          const d = daysUntil(r.nextRenewal);
          if (d === null || d < 0) continue;
          let key;
          if (d <= 7) key = '7';
          else if (d <= 30) key = '30';
          else if (d <= 60) key = '60';
          else if (d <= 90) key = '90';
          else key = 'beyond';
          buckets[key]++;
          bucketRev[key] += r.price;
        }
        const labels = ['Next 7 days', '8–30 days', '31–60 days', '61–90 days', 'Beyond 90 days'];
        const keys = ['7','30','60','90','beyond'];
        return (
          <div className="chart-card">
            <h3>Upcoming Auto-Renewals (active only)</h3>
            <ChartView
              type="bar"
              height={300}
              data={{
                labels,
                datasets: [{
                  label: 'Count',
                  data: keys.map(k => buckets[k]),
                  backgroundColor: '#db2777',
                  borderRadius: 3,
                }]
              }}
              options={{
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    callbacks: {
                      label: (c) => {
                        const k = keys[c.dataIndex];
                        return `${c.parsed.y} memberships · ${money(bucketRev[k])} renewal value`;
                      }
                    }
                  }
                },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
                maintainAspectRatio: false,
              }}
            />
          </div>
        );
      }

      function renderView() {
        if (loading) return <div className="loading"><div className="spinner" /><div className="juice-msg"><span>Squeezing the oranges…</span><span>Juicing!</span><span>Adding the pulp…</span><span>Chilling the glass…</span><span>Pouring it out…</span></div></div>;
        if (error)   return <div className="empty-state error-state" style={{textAlign:'center',padding:'3rem 1rem'}}><span style={{fontSize:'2.5rem'}}>😔</span><br/><span style={{fontSize:'1.1rem',color:'#666'}}>Looks like reporting has encountered an issue — try loading this report again later.</span><br/><span style={{fontSize:'0.8rem',color:'#b91c1c',marginTop:'0.5rem',fontFamily:'monospace',background:'#fef2f2',padding:'8px 14px',borderRadius:6,display:'inline-block',maxWidth:500,wordBreak:'break-word'}}>{error}</span></div>;
        if (filtered.length === 0) return <div className="empty-state">No memberships match the current filters.</div>;

        switch (viewMode) {
          case 'byType':           return renderByType();
          case 'byStatus':         return renderByStatus();
          case 'renewalMix':       return renderRenewalMix();
          case 'revenueByType':    return renderRevenueByType();
          case 'monthlyRevenue':   return renderMonthlyRevenue();
          case 'upcomingRenewals': return renderUpcomingRenewals();
          default:                 return renderByType();
        }
      }

      // ── View definitions ──
      const VIEWS = [
        { key: 'byType',           label: 'By Type' },
        { key: 'byStatus',         label: 'By Status' },
        { key: 'renewalMix',       label: 'Renewal Mix' },
        { key: 'revenueByType',    label: 'Revenue' },
        { key: 'monthlyRevenue',   label: 'Monthly' },
        { key: 'upcomingRenewals', label: 'Upcoming' },
      ];

      const orgName = meta.org_name || (meta.org_slug ? meta.org_slug.charAt(0).toUpperCase() + meta.org_slug.slice(1) : orgSlug);
      const logoUrl = meta.logo_url || null;
      const now = new Date();
      const runDate = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}/${now.getFullYear()} @ ${now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()}`;

      return (
        <React.Fragment>
          {!isPrint && (
            <div className="toolbar">
              <span className="toolbar-title">🎫 Memberships</span>
              <label>
                Start
                <input type="date" value={startDate} onChange={e => { setStartDate(e.target.value); setActiveRange(null); }} />
              </label>
              <label>
                End
                <input type="date" value={endDate} onChange={e => { setEndDate(e.target.value); setActiveRange(null); }} />
              </label>

              {[
                { key:'last-month',  label:'Last Month',  action:() => setMonth(-1) },
                { key:'this-month',  label:'This Month',  action:() => setMonth(0)  },
                { key:'next-month',  label:'Next Month',  action:() => setMonth(1)  },
              ].map(({ key, label, action }) => (
                <button
                  key={key}
                  onClick={action}
                  style={{
                    fontSize:11, padding:'4px 8px',
                    ...(activeRange === key ? {
                      background: '#f59e0b',
                      borderColor: '#f59e0b',
                      color: '#1a1a1a',
                      fontWeight: 600,
                    } : {}),
                  }}
                >{label}</button>
              ))}

              <button
                className="btn-run"
                onClick={handleRunReport}
                disabled={loading}
                style={datesChanged && !loading ? {boxShadow:'0 0 0 2px #4ade80'} : {}}
              >
                {loading ? <><span className="btn-spinner" />Loading…</> : '▶ Run Report'}
              </button>

              {(activeTab === 'memberships') && <React.Fragment>
              <div className="divider" />

              <MultiSelect
                label="Status"
                options={['active','canceled','expired','inactive']}
                selected={statusFilter}
                onChange={setStatusFilter}
              />

              <MultiSelect
                label="Renewal"
                options={['Auto-renew', 'One-time']}
                selected={renewalFilter}
                onChange={setRenewalFilter}
              />

              {allTypes.length > 0 && (
                <MultiSelect
                  label="Type"
                  options={allTypes}
                  selected={typeFilter || []}
                  onChange={setTypeFilter}
                />
              )}

              {/* ABSENT, not disabled, when the org runs no residency group or
                  the feed predates card 17301 v5 — a control that can only ever
                  answer "unknown" is a dead end. */}
              {mbHasResidency(data) && (
                <select data-mb-residency value={residencyFilter}
                  onChange={function(e) { setResidencyFilter(e.target.value); }}
                  title="Scopes the whole report — every tab, every total"
                  style={{padding:'5px 8px',border:'1px solid #d4d4d8',borderRadius:4,background:'#fff',fontSize:12,fontFamily:'inherit',outline:'none',cursor:'pointer'}}>
                  <option value="">All residency</option>
                  <option value="resident">Resident</option>
                  <option value="nonresident">Non-resident</option>
                </select>
              )}

              <input
                type="search"
                placeholder="Search name, email, or type…"
                value={search}
                onChange={e => setSearch(e.target.value)}
              />

              <span className="toolbar-spacer" />

              <div className="view-group">
                {VIEWS.map(v => (
                  <button
                    key={v.key}
                    className={viewMode === v.key ? 'active' : ''}
                    onClick={() => setViewMode(v.key)}
                  >
                    {v.label}
                  </button>
                ))}
              </div>
              </React.Fragment>}
              {activeTab === 'checkins' && ciLocations.length > 1 && (
                <label className="ci-loc-filter" title="Scope every figure on this tab to one desk location">
                  <span>Location</span>
                  <select id="ciLocPick" value={ciLoc} onChange={e => {
                    const v = e.target.value;
                    setCiLoc(v); setCiMonthSel(null);
                    const hit = ciLocations.filter(function(l){ return l.name === v; })[0];
                    if (v !== 'all') ciBeacon('checkin-loc', { location: v, n: hit ? hit.n : undefined });
                  }}>
                    <option value="all">{'All locations (' + ciOk.length.toLocaleString() + ')'}</option>
                    {ciLocations.map(function(l) {
                      return <option key={l.name} value={l.name}>{l.name + ' (' + l.n.toLocaleString() + ')'}</option>;
                    })}
                  </select>
                </label>
              )}
              {(activeTab === 'checkins' || activeTab === 'retention') && <span className="toolbar-spacer" />}

              <button onClick={printPage} title="Print">🖨️ Print</button>
              <button className="btn-pdf" onClick={downloadPdf} disabled={pdfLoading} title="PDF">{pdfLoading ? "Generating…" : "📄 PDF"}</button>
              <button className="btn-excel" onClick={exportExcel} title="Excel">📊 Excel</button>
            </div>
          )}

          <div className="page" style={(activeTab === 'memberships' && loading) ? {opacity:0.5,pointerEvents:'none'} : {}}>

            {/* Shared Report Header */}
            <div className="report-header">
              <div className="report-header-left">
                {logoUrl && <img src={logoUrl} alt="" className="report-header-logo" onError={e => e.target.style.display='none'} />}
                <div>
                  <div className="org-label">{orgName}</div>
                  <div className="title">Memberships</div>
                </div>
              </div>
              <div className="report-header-right">
                {loadedStart && loadedEnd && (
                  <div className="rh-meta" style={{fontWeight:600,marginBottom:2}}>
                    {new Date(loadedStart + 'T12:00:00').toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'})}
                    {' – '}
                    {new Date(loadedEnd + 'T12:00:00').toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'})}
                  </div>
                )}
                <div className="rh-meta">
                  {activeTab === 'memberships' && <span>{filtered.length.toLocaleString()} memberships · {summary.total.toLocaleString()} after filters</span>}
                  {activeTab === 'checkins' && ciRows && <span>{ciView.length.toLocaleString()} check-ins{ciLoc !== 'all' ? ' · ' + ciLoc : ''}</span>}
                  {activeTab === 'retention' && <span>Cohort retention analysis</span>}
                </div>
              </div>
            </div>

            {!isPrint && !loading && (
              <div className="mem-banner">
                <div className="mbb-scene" aria-hidden="true">
                  <div className="mbx-water" />
                  <div className="mbx-floor" />
                  <div className="mbx-rope" style={{left:'4%', width:'56%'}} />
                  {[6, 20, 34, 48, 60].map(l => <div key={'mp'+l} className="mbx-post" style={{left:l+'%'}} />)}
                  <div className="mbx-reader" />
                  <div className="mbx-desk" />
                  <div className="mbx-staff"><div className="head" /><div className="body" /></div>
                  {[
                    {kit:'#38bdf8', bottom:6,  dur:26, delay:0},
                    {kit:'#fbbf24', bottom:11, dur:33, delay:-5},
                    {kit:'#a3e635', bottom:4,  dur:29, delay:-11},
                    {kit:'#f472b6', bottom:9,  dur:37, delay:-17},
                    {kit:'#c4b5fd', bottom:7,  dur:31, delay:-23},
                    {kit:'#fca5a5', bottom:12, dur:41, delay:-28},
                  ].map((m, i) => (
                    <div key={'m'+i} className="mbx-lane" style={{bottom:m.bottom+'px', animationDuration:m.dur+'s', animationDelay:m.delay+'s'}}>
                      <div className="mbx-member" style={{'--kit':m.kit, animationDelay:(-i*0.13)+'s'}}>
                        <i className="head" /><i className="body" /><i className="card" />
                      </div>
                    </div>
                  ))}
                </div>

                    {(() => {
                      var hmHours = []; for (var hh=5; hh<=21; hh++) hmHours.push(hh);
                      var hmMax = 0;
                      dayOrd.forEach(function(d){ hmHours.forEach(function(h){ var v = (heatGrid[d]||{})[h]||0; if (v > hmMax) hmMax = v; }); });
                      function hmColor(v) {
                        if (!v || hmMax === 0) return '#f5f3ef';
                        var pct = v / hmMax;
                        if (pct < 0.15) return '#dbeafe';
                        if (pct < 0.3)  return '#93c5fd';
                        if (pct < 0.5)  return '#60a5fa';
                        if (pct < 0.7)  return '#3b82f6';
                        if (pct < 0.85) return '#2563eb';
                        return '#1d4ed8';
                      }
                      return (
                        <div className="ci-heatmap-wrap">
                          <div className="ci-chart-title">Peak Hours by Day of Week</div><div style={{fontSize:11,color:'#9ca3af',marginBottom:8,marginTop:-6}}>Heatmap showing which hours are busiest on each day.</div>
                          <div className="ci-heatmap" style={{gridTemplateColumns: '50px repeat(' + hmHours.length + ', 1fr)'}}>
                            <div className="ci-hm-header" />
                            {hmHours.map(function(h){ return <div key={h} className="ci-hm-header">{h===0?'12a':h===12?'12p':h>12?(h-12)+'p':h+'a'}</div>; })}
                            {dayOrd.map(function(d){
                              return <React.Fragment key={d}>
                                <div className="ci-hm-row-label">{d.slice(0,3)}</div>
                                {hmHours.map(function(h){
                                  var v = (heatGrid[d]||{})[h]||0;
                                  return <div key={h} className={'ci-hm-cell' + (v===0?' empty':'')} style={{background: hmColor(v)}} title={d.slice(0,3) + ' ' + (h===0?'12am':h===12?'12pm':h>12?(h-12)+'pm':h+'am') + ': ' + v + ' check-ins'}>{v||''}</div>;
                                })}
                              </React.Fragment>;
                            })}
                          </div>
                          <div className="ci-hm-legend">
                            <span>Fewer</span>
                            {['#f5f3ef','#dbeafe','#93c5fd','#60a5fa','#3b82f6','#2563eb','#1d4ed8'].map(function(c,i){ return <div key={i} className="ci-hm-legend-swatch" style={{background:c}} />; })}
                            <span>More</span>
                          </div>
                        </div>
                      );
                    })()}
                    {/* ── Daily Trend ── */}
                    {(() => {
                      var sortedDays = Object.entries(dailyCounts).sort(function(a,b){ return a[0].localeCompare(b[0]); });
                      if (sortedDays.length < 2) return null;
                      var maxDay = Math.max.apply(null, sortedDays.map(function(e){ return e[1]; }));
                      var W = 1060; var H = 182; var padL = 40; var padR = 10; var padT = 10; var padB = 46;
                      var plotW = W - padL - padR; var plotH = H - padT - padB;
                      var pts = sortedDays.map(function(e, i) {
                        var x = padL + (i / Math.max(sortedDays.length - 1, 1)) * plotW;
                        var y = padT + plotH - (e[1] / maxDay) * plotH;
                        return { x: x, y: y, date: e[0], count: e[1], dow: ciDow(e[0]) };
                      });
                      var line = pts.map(function(p){ return p.x + ',' + p.y; }).join(' ');
                      var area = padL + ',' + (padT + plotH) + ' ' + line + ' ' + pts[pts.length-1].x + ',' + (padT + plotH);
                      var yTicks = [0, Math.round(maxDay/2), maxDay];
                      var xLabels = sortedDays.length <= 14 ? sortedDays : sortedDays.filter(function(_,i){ return i % Math.ceil(sortedDays.length/10) === 0 || i === sortedDays.length-1; });
                      // Weekday letters go under every point while they still fit;
                      // past that the letters would overlap and say nothing, so the
                      // weekend shading carries the rhythm on its own.
                      var showDow = pts.length <= 45;
                      var halfStep = pts.length > 1 ? (pts[1].x - pts[0].x) / 2 : plotW / 2;
                      var weekendBands = pts.filter(function(p){ return p.dow === 0 || p.dow === 6; }).map(function(p) {
                        var x0 = Math.max(padL, p.x - halfStep), x1 = Math.min(W - padR, p.x + halfStep);
                        return { key: p.date, x: x0, w: Math.max(x1 - x0, 1) };
                      });
                      return (
                        <div className="ci-trend-wrap">
                          <div className="ci-chart-title">Daily Check-Ins</div><div style={{fontSize:11,color:'#9ca3af',marginBottom:8,marginTop:-6}}>Total check-ins per day for the selected date range. Weekends are shaded.</div>
                          <svg viewBox={'0 0 ' + W + ' ' + H} className="ci-trend-svg" style={{height: 200}}>
                            {weekendBands.map(function(b) {
                              return <rect key={'wb'+b.key} x={b.x} y={padT} width={b.w} height={plotH} fill="#f4f1ea" />;
                            })}
                            {yTicks.map(function(v) {
                              var y = padT + plotH - (v / maxDay) * plotH;
                              return <React.Fragment key={v}><line x1={padL} x2={W-padR} y1={y} y2={y} stroke="#e8e6e0" strokeWidth="1" /><text x={padL-4} y={y+3} textAnchor="end" fontSize="9" fill="#999">{v.toLocaleString()}</text></React.Fragment>;
                            })}
                            <polygon points={area} fill="rgba(59,130,246,0.12)" />
                            <polyline points={line} fill="none" stroke="#3b82f6" strokeWidth="2" strokeLinejoin="round" />
                            {pts.map(function(p, i) {
                              var isWe = p.dow === 0 || p.dow === 6;
                              return <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={isWe ? '#f59e0b' : '#3b82f6'} stroke="#fff" strokeWidth="1.5" style={{cursor:'default'}}>
                                <title>{(p.dow == null ? '' : CI_DOW3[p.dow] + ' ') + ciDateLabel(p.date) + ': ' + p.count.toLocaleString() + ' check-ins'}</title>
                              </circle>;
                            })}
                            {showDow && pts.map(function(p, i) {
                              if (p.dow == null) return null;
                              var isWe = p.dow === 0 || p.dow === 6;
                              return <text key={'d'+i} x={p.x} y={H - 20} textAnchor="middle" fontSize="9"
                                           fill={isWe ? '#b45309' : '#6b7280'} fontWeight={isWe ? 700 : 600}
                                           data-ci-dow={CI_DOW1[p.dow]}>{CI_DOW1[p.dow]}</text>;
                            })}
                            {xLabels.map(function(e) {
                              var idx = sortedDays.indexOf(e); var x = padL + (idx / Math.max(sortedDays.length - 1, 1)) * plotW;
                              return <text key={e[0]} x={x} y={H - 6} textAnchor="middle" fontSize="9" fill="#999">{ciDateLabel(e[0])}</text>;
                            })}
                          </svg>
                        </div>
                      );
                    })()}
                    {/* ── Top Members ── */}
                    {(() => {
                      var memberMap = {};
                      ciView.forEach(function(r) {
                        var mid = r['Member ID'];
                        if (!mid) return;
                        if (!memberMap[mid]) memberMap[mid] = { name: ((r['First Name']||'') + ' ' + (r['Last Name']||'')).trim(),
                          memberId: mid, userId: r['User ID'] || '', email: r['Email'] || '',
                          total: 0, products: {}, months: {}, type: r['Check-In Type']||'' };
                        // The uuid can arrive on any of a member's rows, so take the
                        // first one that has it rather than only the earliest row.
                        if (!memberMap[mid].userId && r['User ID']) memberMap[mid].userId = r['User ID'];
                        memberMap[mid].total++;
                        var prod = r['Product Name']||'Unknown';
                        memberMap[mid].products[prod] = (memberMap[mid].products[prod]||0)+1;
                        var mo = ciMonthKey(r['Date']);
                        if (mo) memberMap[mid].months[mo] = (memberMap[mid].months[mo]||0)+1;
                      });
                      var topList = Object.values(memberMap).sort(function(a,b){ return b.total - a.total; }).slice(0,15);
                      if (topList.length === 0) return null;
                      var allMo = {};
                      topList.forEach(function(m){ Object.keys(m.months).forEach(function(mo){ allMo[mo]=1; }); });
                      var moList = Object.keys(allMo).sort();
                      var sparkMax = 0;
                      topList.forEach(function(m){ moList.forEach(function(mo){ var v = m.months[mo]||0; if (v > sparkMax) sparkMax = v; }); });
                      topList.forEach(function(m){
                        var best = ''; var bestCt = 0;
                        Object.entries(m.products).forEach(function(e){ if (e[1] > bestCt) { best = e[0]; bestCt = e[1]; } });
                        m.topProduct = best;
                      });
                      var fmtMo = ciMonthShort;
                      // A selected month is only meaningful while it is on screen;
                      // a narrower date range or a location filter can take it away.
                      var selMo = ciMonthSel && moList.indexOf(ciMonthSel) !== -1 ? ciMonthSel : null;
                      var selTotal = 0, selMembers = 0;
                      if (selMo) topList.forEach(function(m){ var v = m.months[selMo] || 0; if (v) { selTotal += v; selMembers++; } });
                      var pickMo = function(mo) { setCiMonthSel(ciMonthSel === mo ? null : mo); };
                      return (
                        <div className="ci-heatmap-wrap">
                          <div className="ci-chart-title">Top Members</div>
                          <div style={{fontSize:11,color:'#9ca3af',marginBottom:10,marginTop:-6}}>Members with the most check-ins in the selected period. Bars show monthly activity.</div>
                          <div style={{overflowX:'auto'}}>
                            <table className="ci-table" style={{fontSize:12}}>
                              <thead>
                                <tr>
                                  <th style={{width:32,textAlign:'center'}}>#</th>

                                  <th style={{textAlign:'right',width:56}}>Visits</th>

                                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                                      <span>Monthly</span>
                                      <div style={{display:'flex',gap:2}}>
                                        {moList.map(function(mo) {
                                          var on = selMo === mo;
                                          return <button key={mo} type="button" data-ci-mo-head={mo} onClick={function(){ pickMo(mo); }}
                                            title={ciMonthLong(mo) + (on ? ' — click to clear' : ' — click to highlight')}
                                            className={'ci-mo-head' + (on ? ' on' : '')}>{fmtMo(mo).slice(0,1)}</button>;
                                        })}
                                      </div>
                                    </div>
                                  </th>
                                  <th style={{maxWidth:200}}>Membership / Pass</th>
                                </tr>
                              </thead>
                              <tbody>
                                {topList.map(function(m, idx) {
                                  var rankColors = ['#f59e0b','#94a3b8','#b45309'];
                                  var isTop3 = idx < 3;
                                  return (
                                    <tr key={idx} style={isTop3 ? {background:'#fefce8'} : {}}>
                                      <td style={{textAlign:'center'}}>
                                        {isTop3 ? <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:22,height:22,borderRadius:'50%',background:rankColors[idx],color:'#fff',fontWeight:700,fontSize:11}}>{idx+1}</span>
                                                 : <span style={{color:'#999',fontWeight:600,fontSize:11}}>{idx+1}</span>}
                                      </td>
                                      <td style={{fontWeight: isTop3 ? 700 : 400, fontSize: isTop3 ? 13 : 12}}>
                                        {(function() {

                                                    onClick={function(){ ciBeacon('checkin-member'); }}
                                                    title={'Open ' + (m.name || 'this member') + ' in Rec'}
                                                    style={{color:'inherit',textDecoration:'none',borderBottom:'1px dotted #9ca3af'}}>
                                            {m.name || 'Unknown'}<span style={{fontSize:10,color:'#2563eb',marginLeft:4}}>↗</span>
                                          </a>;
                                        })()}
                                      </td>
                                      <td style={{textAlign:'right',fontWeight:700,fontVariantNumeric:'tabular-nums',fontSize:14,color:'#111'}}>{m.total.toLocaleString()}</td>
                                      <td>
                                        <div style={{display:'flex',alignItems:'flex-end',gap:2,height:26,paddingTop:2}}>
                                          {moList.map(function(mo){
                                            var v = m.months[mo]||0;
                                            var h = sparkMax > 0 ? Math.max(v / sparkMax * 22, v > 0 ? 3 : 0) : 0;
                                            var base = m.type === 'pass' ? '#8b5cf6' : '#3b82f6';
                                            var dim = selMo && selMo !== mo;
                                            return <button key={mo} type="button" className="ci-mo-bar" data-ci-mo={mo}
                                              onClick={function(){ pickMo(mo); }}
                                              title={ciMonthLong(mo) + ': ' + v.toLocaleString() + ' check-in' + (v === 1 ? '' : 's') + ' · ' + (m.name || 'Unknown') + (selMo === mo ? ' — click to clear' : '')}
                                              style={{height: Math.max(h, 2), background: v > 0 ? base : '#eee',
                                                      opacity: dim ? 0.3 : 1,
                                                      outline: selMo === mo ? '2px solid #111' : 'none'}} />;
                                          })}
                                        </div>
                                      </td>
                                      <td style={{maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontSize:11}} title={m.topProduct}>
                                        <span style={{fontSize:9,fontWeight:600,padding:'2px 6px',borderRadius:3,marginRight:4,background:m.type==='membership'?'#dbeafe':'#ede9fe',color:m.type==='membership'?'#1e40af':'#5b21b6'}}>{m.type}</span>
                                        {m.topProduct.length > 22 ? m.topProduct.slice(0,20) + '…' : m.topProduct}
                                      </td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                          {selMo ? (
                            <div style={{marginTop:10,fontSize:11,color:'#374151',background:'#f9fafb',border:'1px solid #e8e6e0',borderRadius:4,padding:'6px 10px'}}>
                              <b>{ciMonthLong(selMo)}</b> highlighted · {selTotal.toLocaleString()} check-in{selTotal === 1 ? '' : 's'} from {selMembers} of these {topList.length} members ·{' '}
                              <a href="#" onClick={function(e){ e.preventDefault(); setCiMonthSel(null); }} style={{color:'#2563eb'}}>clear</a>
                            </div>
                          ) : (
                            <div style={{marginTop:8,fontSize:10,color:'#9ca3af'}}>Click a bar to highlight that month across every member.</div>
                          )}
                        </div>
                      );
                    })()}
                    <div className="ci-charts">
                      <div className="ci-chart-box">
                        <div className="ci-chart-title">Day of Week</div><div style={{fontSize:11,color:'#9ca3af',marginBottom:8,marginTop:-6}}>Total check-ins by day of the week.</div>
                        {dayOrd.map(function(d){ var c=dayCounts[d]||0; return (
                          <div key={d} className="ci-bar-row"><span className="ci-bar-label">{d.slice(0,3)}</span><div className="ci-bar-track"><div className="ci-bar-fill" style={{width:(c/maxDy*100)+'%',background:'#10b981'}}/></div><span className="ci-bar-val">{c||''}</span></div>
                        );})}
                      </div>
                      <div className="ci-chart-box">
                        <div className="ci-chart-title">Desk Locations</div>

                          {ciLoc === 'all' ? 'Check-ins by point-of-sale or entry location. Pick one in the Location filter to scope the whole tab to it.'
                                           : 'Filtered to ' + ciLoc + ' — one row, by definition.'}

                        {/* 48px of label is unreadable at Apex's 22 desks ("Apex …",
                            "Secres…" ×3), and the filter makes this the list someone

                        {Object.entries(deskCounts).sort(function(a,b){return b[1]-a[1];}).map(function(e){ return (
                          <div key={e[0]} className="ci-bar-row"><span className="ci-bar-label" style={{width:170}} title={e[0]}>{e[0].length > 26 ? e[0].slice(0,24) + '…' : e[0]}</span><div className="ci-bar-track"><div className="ci-bar-fill" style={{width:(e[1]/maxDk*100)+'%',background:'#f59e0b'}}/></div><span className="ci-bar-val">{e[1]}</span></div>
                        );})}
                      </div>
                      <div className="ci-chart-box" style={{gridColumn:'1 / -1'}}>
                        <div className="ci-chart-title">Top Membership / Pass Types</div><div style={{fontSize:11,color:'#9ca3af',marginBottom:8,marginTop:-6}}>Most frequently used membership and pass types at check-in.</div>
                        {Object.entries(prodCounts).sort(function(a,b){return b[1]-a[1];}).slice(0,10).map(function(e){ return (
                          <div key={e[0]} className="ci-bar-row"><span className="ci-bar-label" style={{width:180}} title={e[0]}>{e[0].length>28?e[0].slice(0,26)+'...':e[0]}</span><div className="ci-bar-track"><div className="ci-bar-fill" style={{width:(e[1]/maxPr*100)+'%',background:e[0].toLowerCase().indexOf('pass')!==-1?'#8b5cf6':'#06b6d4'}}/></div><span className="ci-bar-val">{e[1]}</span></div>
                        );})}
                      </div>
                    </div>
                    {ciListPanel()}
                  </React.Fragment>
                );
              })()}
              {!ciLoading && (!ciRows || ciRows.length === 0) && !ciLoading && <div style={{textAlign:'center',padding:40,color:'#999'}}>Click Run Report to load check-in data</div>}
            </div>
          )}

          {activeTab === 'retention' && (
            <div style={{maxWidth:1100,margin:'0 auto'}}>
              {(() => {
                var cohorts = buildCohorts(data);
                if (!cohorts || cohorts.length === 0) return <div style={{textAlign:'center',padding:40,color:'#999'}}>Loading membership data\u2026 The Retention tab needs 12+ months of data. Dates have been auto-expanded \u2014 click Run Report if data hasn\u2019t loaded.</div>;

                var retAt6 = cohorts.filter(function(c){ return c.retention[6] !== null; });
                var avg6 = retAt6.length > 0 ? Math.round(retAt6.reduce(function(s,c){ return s + c.retention[6]; }, 0) / retAt6.length) : null;
                var best6 = retAt6.length > 0 ? retAt6.reduce(function(a,b){ return (b.retention[6]||0) > (a.retention[6]||0) ? b : a; }) : null;
                var worst6 = retAt6.length > 0 ? retAt6.reduce(function(a,b){ return (b.retention[6]||0) < (a.retention[6]||0) ? b : a; }) : null;
                var m1drops = cohorts.filter(function(c){ return c.retention[1] !== null; });
                var avgM1drop = m1drops.length > 0 ? Math.round(m1drops.reduce(function(s,c){ return s + (100 - c.retention[1]); },0) / m1drops.length) : null;

                return (
                  <React.Fragment>
                    <div className="ret-kpis">

                      {best6 && <div className="ret-kpi"><div className="rl">Best cohort</div><div className="rv" style={{color:'#10b981'}}>{best6.label}</div><div className="rs">{best6.retention[6]}% at 6 months ({best6.size} members)</div></div>}
                      {worst6 && <div className="ret-kpi"><div className="rl">Worst cohort</div><div className="rv" style={{color:'#ef4444'}}>{worst6.label}</div><div className="rs">{worst6.retention[6]}% at 6 months ({worst6.size} members)</div></div>}
                      {avgM1drop !== null && <div className="ret-kpi"><div className="rl">Avg month-1 churn</div><div className="rv">{avgM1drop}%</div><div className="rs">Biggest drop-off window</div></div>}
                    </div>

                    <RetentionChart cohorts={cohorts} />

                    <div className="ret-table-wrap">

                        <tbody>
                          {cohorts.map(function(c) {
                            return (
                              <tr key={c.key}>
                                <td>{c.label}</td>
                                <td>{c.size.toLocaleString()}</td>

                                  var val = c.retention[i+1];

                                  if (val >= 70) { bg = '#dcfce7'; fg = '#166534'; }
                                  else if (val >= 50) { bg = '#dbeafe'; fg = '#1e40af'; }
                                  else if (val >= 30) { bg = '#fef3c7'; fg = '#92400e'; }
                                  else { bg = '#fee2e2'; fg = '#991b1b'; }
                                  return <td key={i} style={{background:bg,color:fg}}>{val}%</td>;
                                })}
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                    <div style={{fontSize:9,color:'#aaa',textAlign:'center',marginTop:6}}>Green = healthy retention · Blue = moderate · Amber = caution · Red = high churn</div>
                  </React.Fragment>
                );
              })()}
            </div>
          )}

          {activeTab === 'memberships' && (
            <React.Fragment>

            {/* Purchase-cohort scope note — these KPIs cover memberships/passes

            {(() => {

              const rangeLabel = (loadedStart && loadedEnd) ? (fmtD(loadedStart) + ' – ' + fmtD(loadedEnd)) : 'the selected date range';
              return (
                <div className="mb-scope-note">
                  🎫 Memberships &amp; passes <strong>purchased {rangeLabel}</strong>
                  <span className="mb-scope-sub">This is the purchase cohort for the selected dates. Active / Canceled / Expired show each purchase&rsquo;s <em>current</em> status — not an all-time member roster. Net Collected is attributed to purchase date, across all payment channels.</span>
                </div>
              );
            })()}

            {/* Summary cards */}
            <div className="summary-cards">
              <div className="summary-card">
                <div className="card-label">Active</div>
                <div className="card-value green">{summary.active.toLocaleString()}</div>
                <div className="card-sub">purchased &amp; active now</div>
              </div>
              <div className="summary-card">
                <div className="card-label">Canceled</div>
                <div className="card-value red">{summary.canceled.toLocaleString()}</div>
                <div className="card-sub">purchased, since canceled</div>
