<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --sand:#f4f2ef; --card:#ffffff; --card2:#fafaf9; --line:#e7e5e4; --line2:#d6d3d1;
  --ink:#1c1917; --ink2:#57534e; --ink3:#7c7570;
  --pine:#132219; --grass:#1b9849; --grass-ink:#157a3a;
  --bar:#23231f; --bar-ink:#f4f2ef; --bar-dim:#a8a29e;
  --ok:#15803d; --ok-bg:#e7fdef; --warn:#9a3412; --warn-bg:#fff3e2; --bad:#b91c1c; --bad-bg:#ffebeb;
  --info:#1d4ed8; --info-bg:#e6f1ff; --pass:#7e22ce; --pass-bg:#f3e8ff;
  --shadow:0 1px 2px rgba(28,25,23,.06),0 2px 8px rgba(28,25,23,.05);
  --r:12px; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--sand);color:var(--ink);font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}


/* The chrome is the one every other report wears (programs-schedule.html,
   facility.html): a full-width sticky dark toolbar, then a white page with
   the org logo and title in .report-header. The first build had its own
   rounded bar and a green hero, and read as a different product. */
.toolbar{position:sticky;top:var(--rec-banner-h,0px);z-index:100;display:flex;align-items:center;gap:10px;padding:8px 20px;background:#2c2c2c;color:#eee;font-size:13px;flex-wrap:wrap}
.toolbar-title{font-weight:600;margin-right:4px}
.toolbar-spacer{flex:1}
.toolbar button{padding:6px 14px;border:1px solid rgba(255,255,255,.25);border-radius:4px;background:rgba(255,255,255,.08);color:#fff;font-size:12px;cursor:pointer;white-space:nowrap}
.toolbar button:hover{background:rgba(255,255,255,.18)}
.toolbar button:disabled{opacity:.6;cursor:default}
.toolbar .btn-run{background:#16a34a;border-color:#16a34a;font-weight:600}
.toolbar .btn-run:hover{background:#15803d}
.toolbar .sync{font-size:11.5px;color:#aaa;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e}
.page{max-width:1400px;margin:16px auto;padding:24px 28px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.report-header{display:flex;justify-content:space-between;align-items:center;border-bottom:2.5px solid #111;padding-bottom:10px;margin-bottom:14px;gap:16px;flex-wrap:wrap}
.report-header-left{display:flex;align-items:center;gap:14px}
.report-header-logo{height:42px;max-width:140px;object-fit:contain;object-position:left center}
.report-header .org-label{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#777;font-weight:600}
.report-header .title{font-size:17px;font-weight:700;margin-top:1px;color:#111827}
.report-header-right{text-align:right}
.report-header .rh-meta{font-size:11px;color:#666}
.report-header .rh-sub{font-size:11px;color:#888;max-width:52ch;margin-top:2px}
@media (max-width:600px){.page{padding:16px;margin:12px 0}.report-header-right{text-align:left}}
@media print{.toolbar{display:none!important}body{background:#fff}.page{margin:0;padding:0;box-shadow:none;max-width:none}}

.kpis{display:flex;flex-wrap:wrap;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow),0 0 0 1px var(--line);margin:16px 0}
.kpi{flex:1 1 170px;background:var(--card);padding:14px 18px}
.kpi .l{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi .v{font-size:26px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.kpi.alert .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
button.kpi{border:0;text-align:left}
button.kpi:hover{background:var(--card2)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--grass)}
.tab .ct{background:var(--warn-bg);color:var(--warn);border-radius:99px;padding:1px 7px;font-size:11.5px;margin-left:5px}

.panel{background:var(--card);border-radius:var(--r);border:1px solid var(--line)}
.ph{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:15px;margin-right:auto}
.ph input[type=search]{border:1px solid var(--line2);background:var(--card2);border-radius:8px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 10px;font-size:12.5px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}

.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:860px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td[data-onhand]{white-space:nowrap}
tbody tr:hover{background:var(--card2)}
.iname{font-weight:600}
.isub{font-size:12px;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.low{background:var(--warn-bg);color:var(--warn)}
.chip.out{background:var(--bad-bg);color:var(--bad)}
.chip.pass{background:var(--pass-bg);color:var(--pass)}
.chip.info{background:var(--info-bg);color:var(--info)}
.nobar{color:var(--warn);font-size:12px;font-weight:600}
.meter{height:6px;border-radius:9px;background:var(--line);width:90px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.meter i{display:block;height:100%;border-radius:9px;background:var(--ok)}
.meter i.low{background:var(--warn)} .meter i.out{background:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--grass);border-color:var(--grass);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.link{border:0;background:none;color:var(--grass-ink);padding:5px 4px}

.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.pb{padding:16px}
.scanbox{border:2px dashed var(--line2);border-radius:12px;padding:18px;display:flex;gap:14px;align-items:center;background:var(--card2)}
.scanbox.hot{border-color:var(--grass);background:color-mix(in srgb,var(--grass) 7%,var(--card))}
.scanicon{width:46px;height:46px;flex:none;border-radius:10px;background:var(--ink);display:grid;place-items:center}
.scanicon svg{width:30px;height:30px}
.scanbox input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:9px;padding:11px 12px;background:var(--card);font-family:var(--mono);font-size:16px;letter-spacing:.06em}
.hint{font-size:12.5px;color:var(--ink3);margin-top:8px}
.sims{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sims button{border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:4px 10px;font-size:12px}
.result{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:16px}
.result h3{margin:0 0 2px;font-size:18px}
.bigcount{display:flex;gap:26px;margin:14px 0;flex-wrap:wrap}
.bigcount div .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.bigcount div .v{font-size:28px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qty{width:84px;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;background:var(--card);font-variant-numeric:tabular-nums}
select{border:1px solid var(--line2);border-radius:8px;padding:6px 9px;background:var(--card);max-width:100%}

.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:118px 1fr auto auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ledger li:last-child{border-bottom:0}
.ledger .when{color:var(--ink3);font-size:12px}
.ledger .d{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:44px}
.ledger .d.pos{color:var(--ok)} .ledger .d.neg{color:var(--ink2)} .ledger .d.set{color:var(--info)}
.ledger .bal{color:var(--ink3);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.lk{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.explain{font-size:12.5px;color:var(--ink2);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}

.email{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.email .eh{background:var(--card2);padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
.email .eh b{color:var(--ink)}
.email .eb{padding:14px;font-size:13.5px}
.email .eb table{min-width:0}
.email .eb td,.email .eb th{padding:6px 8px}
.alertlog{list-style:none;padding:0;margin:0}
.alertlog li{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.alertlog li:last-child{border-bottom:0}
.alertlog li .w{color:var(--ink3);font-size:12px;margin-left:auto}

.toggle{position:relative;display:inline-block;vertical-align:middle;width:36px;height:20px;flex:none}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:99px;background:var(--line2);transition:background .15s}
.toggle span::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle input:checked+span{background:var(--grass)}
.toggle input:checked+span::after{transform:translateX(16px)}
.toggle input:focus-visible+span{outline:2px solid var(--grass);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.field input[type=text],.field input[type=email]{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--card)}
.field .h{font-size:12.5px;color:var(--ink3)}

.modal-bg{position:fixed;inset:0;background:rgba(28,25,23,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--card);border-radius:14px;width:min(460px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.modal .mh{padding:16px 18px 6px}
.modal .mh h3{margin:0;font-size:18px}
.modal .mh p{margin:4px 0 0;color:var(--ink2);font-size:13px}
.modal .mb{padding:10px 18px 4px}
.modal .mf{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end}
.var{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin:12px 0}
.var div{background:var(--card2);padding:10px 12px}
.var .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.var .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.var .v.bad{color:var(--bad)} .var .v.good{color:var(--ok)}
.big-in{font-size:22px;width:120px;padding:8px 10px;border:1px solid var(--line2);border-radius:9px;background:var(--card);font-weight:700;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;max-width:calc(100% - 32px)}
.banner{border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:13.5px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--info-bg);color:var(--info)}
.chip.uncounted{background:var(--info-bg);color:var(--info)}
.chip.untracked{background:var(--line);color:var(--ink2)}
.empty{padding:30px 16px;text-align:center;color:var(--ink3)}
.note{font-size:12.5px;color:var(--ink3);padding:10px 16px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ── Variants: a parent row, its variants indented under it ─────────── */
tr.grp td{background:var(--card2);border-top:1px solid var(--line2)}
tr.grp .caret{border:0;background:none;padding:0 6px 0 0;color:var(--ink3);font-size:12px;vertical-align:middle}
tr.grp .vct{display:inline-block;margin-left:6px;border:1px solid #99d3b1;color:var(--grass-ink);border-radius:99px;padding:0 7px;font-size:11.5px;font-weight:700}
tr.vrow td:first-child{padding-left:38px}
tr.svrow td:nth-child(2){padding-left:30px}
tr.vrow .iname{font-weight:500}
.nc .iname{text-decoration:line-through;color:var(--ink3)}
.chip.notcarried{background:var(--line);color:var(--ink2)}
/* ── Sparkline: on hand over 30 days, one quiet ink line ──────────────── */
.spark{display:block}
.spark .ln{fill:none;stroke:var(--ink2);stroke-width:1.5;stroke-linejoin:round}
.spark .ro{stroke:var(--warn);stroke-width:1;stroke-dasharray:2 2;opacity:.7}
.spark .end{fill:var(--ink)}
/* ── Movement tab ─────────────────────────────────────────────────────── */
.mv-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media (max-width:860px){.mv-grid{grid-template-columns:1fr}}
.rank{list-style:none;margin:0;padding:6px 0}
.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) 110px 56px 76px;gap:8px;align-items:center;padding:6px 16px;cursor:pointer}
.rank li:hover{background:var(--card2)}
.rank .n{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rank .bar{height:8px;border-radius:0 4px 4px 0;background:var(--ink2);min-width:2px}
.rank .u{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rank .t{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rank .t.up{color:var(--ok)} .rank .t.dn{color:var(--bad)}
.rank li.on .nm::after{content:" \2022 on chart";color:var(--ink3);font-weight:500;font-size:11.5px}
.vchips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line)}
.vchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink)}
.vchip i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.vchip[aria-pressed="true"]{border-color:var(--ink2)}
.vchip .x{color:var(--ink3);font-weight:500}
.vchart{position:relative;padding:8px 8px 4px}
.vchart svg text{font:11.5px Inter,system-ui,sans-serif;fill:var(--ink3)}
.vchart .grid{stroke:var(--line);stroke-width:1}
.vchart .axis{stroke:var(--line2)}
.vchart .dl{fill:var(--ink);font-weight:600}
.vchart .dlv{fill:var(--ink2);font-weight:700}
.vtip{position:absolute;pointer-events:none;background:var(--card);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;min-width:170px;z-index:5}
.vtip .d{font-weight:700;margin-bottom:4px}
.vtip .r{display:flex;align-items:center;gap:6px;justify-content:space-between}
.vtip .r span{display:inline-flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:200px}
.vtip .r i{width:8px;height:8px;border-radius:50%;flex:none}
</style>

<body>
<div class="toolbar">
  <span class="toolbar-title">Inventory</span>
  <div class="toolbar-spacer"></div>
  <div class="sync"><span class="dot" id="syncDot"></span><span id="syncTxt">Loading…</span></div>
  <button id="syncBtn" type="button" class="btn-run">&#8635; Sync with Rec now</button>
</div>
<div class="page">
  <div class="report-header">
    <div class="report-header-left">
      <img id="orgLogo" class="report-header-logo" alt="" hidden>
      <div>
        <div class="org-label" id="orgName"></div>
        <div class="title">Snack Bar &amp; Merch Inventory</div>
      </div>
    </div>
    <div class="report-header-right">
      <div class="rh-meta" id="mastPill" style="font-weight:600"></div>
      <div class="rh-sub">Counts drop as Rec&rsquo;s item log records sales, and go back up for refunds, voids and deliveries. A physical count resets an item to what&rsquo;s on the shelf.</div>
    </div>
  </div>

  <div id="banner"></div>
  <div class="kpis" id="kpis"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-stock" aria-selected="true" data-tab="stock">Stock</button>
    <button class="tab" role="tab" id="t-move" aria-selected="false" data-tab="move">Movement</button>
    <button class="tab" role="tab" id="t-scan" aria-selected="false" data-tab="scan">Scan</button>
    <button class="tab" role="tab" id="t-alerts" aria-selected="false" data-tab="alerts">Reorder emails</button>
    <button class="tab" role="tab" id="t-setup" aria-selected="false" data-tab="setup">Items from Rec</button>
  </div>

  <section id="v-stock"></section>
  <section id="v-move" hidden></section>
  <section id="v-scan" hidden></section>
  <section id="v-alerts" hidden></section>
  <section id="v-setup" hidden></section>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
/* The inventory report. Vanilla JS on purpose, like programs-schedule.html:
   no JSX means no in-browser Babel, which is what turns a const read before
   its declaration into `undefined` two lines later instead of a throw.

   The page OWNS NO ARITHMETIC. On-hand, status, days-left and order-to-par
   all come from lib/inventory.js on the server via /api/state, so the stock
   table, the email and the hourly job cannot disagree about a number. */
var CFG = window.ORG_CONFIG || {};
var Q = new URLSearchParams(location.search);
var TOKEN = Q.get('token') || CFG.token || '';
var SLUG = CFG.slug || location.pathname.split('/').filter(Boolean)[0] || '';
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
var money = function(n){ return n == null ? '—' : '$' + Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); };
var STATUS_LABEL = { ok:'In stock', low:'Reorder', out:'Out', uncounted:'Needs a count', untracked:'Not tracked', notcarried:'Not carried' };

function api(path, body){
  var u = '/' + SLUG + '/inventory/api/' + path + '?token=' + encodeURIComponent(TOKEN);
  var opts = body ? { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) } : { cache:'no-store' };
  return fetch(u, opts).then(function(r){
    return r.json().catch(function(){ return { ok:false, error:'HTTP ' + r.status }; }).then(function(d){
      if (!r.ok || d.ok === false) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    });
  });
}

var S = { data:null, tab:'stock', filter:'all', q:'', scan:null, err:'', open:{}, mvDays:30, mvSel:null, mvQ:'', mvMore:false };
try { var t = localStorage.getItem('inv-tab'); if (t) S.tab = t; } catch(e){}
if (Q.get('tab')) S.tab = Q.get('tab');
// Who is doing the counting, remembered per browser. It goes on the ledger
// line, because "who counted 12 Snickers" is the first question a variance asks.
var BY = ''; try { BY = localStorage.getItem('inv-by') || ''; } catch(e){}

function toast(msg){ var r=$('#toastRoot'); r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>'; clearTimeout(toast._t); toast._t=setTimeout(function(){ r.innerHTML=''; },2800); }
function items(){ return (S.data && S.data.items) || []; }
function tracked(){ return items().filter(function(i){ return i.track && i.live && i.carried !== false; }); }
function byId(id){ return items().find(function(i){ return i.id === id; }); }
function when(ts){ if (!ts) return ''; var d=new Date(ts); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}).toLowerCase(); }

function load(){ return api('state').then(function(d){ S.data=d; S.err=''; render(); }).catch(function(e){ S.err=e.message; render(); }); }
function save(path, body, okMsg){
  return api(path, body).then(function(d){ S.data=d; closeModal(); render(); if (okMsg) toast(typeof okMsg==='function' ? okMsg(d) : okMsg); return d; })
    .catch(function(e){ var m=$('#mErr'); if (m){ m.textContent=e.message; m.hidden=false; } else toast(e.message); throw e; });
}

/* ── Chrome ─────────────────────────────────────────────────────────── */
function renderChrome(){
  $('#orgName').textContent = CFG.displayName || SLUG;
  var lg = $('#orgLogo'); if (CFG.logoUrl && lg.hidden){ lg.src = CFG.logoUrl; lg.hidden = false; }
  var d = S.data, ls = d && d.lastSync;
  $('#syncTxt').textContent = !d ? 'Loading…'
    : !d.configured ? 'Not connected to Rec yet'
    : !ls ? 'Not synced yet'
    : (ls.ok ? 'Synced with Rec ' + when(ls.ts) + ' · checks every hour' : 'Last sync failed ' + when(ls.ts));
  $('#syncDot').style.background = d && ls && !ls.ok ? 'var(--bad)' : '';
  var b = '';
  if (S.err) b = '<div class="banner bad">Could not load inventory: '+esc(S.err)+'</div>';
  else if (d && !d.configured) b = '<div class="banner warn">The inventory feed is not wired yet, so nothing can be pulled from Rec. Metabase card '+esc(d.cardId)+' needs a public link, set as <code>MB_INVENTORY_UUID</code>.</div>';
  else if (ls && !ls.ok) b = '<div class="banner bad">The last sync with Rec failed ('+esc(ls.error)+'). Counts below are as of the last good sync; the next hourly run will try again.</div>';
  else if (d && tracked().length && tracked().every(function(i){ return i.onHand === null; })) b = '<div class="banner info">First-time setup: do one physical count of each item (the Count button). Sales start counting down from that moment.</div>';
  $('#banner').innerHTML = b;

  var tr = tracked(), low = tr.filter(function(i){return i.status==='low';}), out = tr.filter(function(i){return i.status==='out';});
  var need = tr.filter(function(i){return i.status==='uncounted';});
  $('#mastPill').textContent = tr.length + ' items tracked · ' + (low.length+out.length) + ' need reordering';
  var counted = tr.filter(function(i){ return i.onHand !== null; });
  var withCost = counted.filter(function(i){ return i.cost != null; });
  var value = withCost.reduce(function(a,i){ return a + Math.max(0,i.onHand)*i.cost; },0);
  var units = tr.reduce(function(a,i){ return a + i.sold7; },0);
  var rev = tr.reduce(function(a,i){ return a + i.sold7*(i.price||0); },0);
  $('#kpis').innerHTML =
    '<div class="kpi"><div class="l">Items tracked</div><div class="v">'+tr.length+'</div><div class="s">'+(need.length ? need.length+' still need a first count' : 'of '+items().filter(function(i){return i.live;}).length+' Rec store items')+'</div></div>'+
    '<button type="button" class="kpi alert" data-go="low"><div class="l">At reorder point</div><div class="v">'+low.length+'</div><div class="s">Show them →</div></button>'+
    '<button type="button" class="kpi bad" data-go="out"><div class="l">Out of stock</div><div class="v">'+out.length+'</div><div class="s">Show them →</div></button>'+
    '<div class="kpi"><div class="l">Stock on hand, at cost</div><div class="v num">'+(withCost.length ? money(value) : '—')+'</div><div class="s">'+(withCost.length < counted.length ? withCost.length+' of '+counted.length+' items have a unit cost' : 'what’s on the shelf now')+'</div></div>'+
    '<div class="kpi"><div class="l">Sold, last 7 days</div><div class="v num">'+units+'</div><div class="s">'+money(rev)+' in sales, counted items only</div></div>';
  Array.prototype.forEach.call($('#kpis').querySelectorAll('[data-go]'), function(b){ b.onclick=function(){ S.filter=b.dataset.go; setTab('stock'); }; });
  var n = low.length + out.length;
  $('#t-stock').innerHTML = 'Stock' + (n ? '<span class="ct">'+n+'</span>' : '');
}

function setTab(t){
  if (['stock','move','scan','alerts','setup'].indexOf(t) < 0) t = 'stock';
  S.tab = t; try { localStorage.setItem('inv-tab', t); } catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.setAttribute('aria-selected', b.dataset.tab===t ? 'true':'false'); });
  ['stock','move','scan','alerts','setup'].forEach(function(k){ $('#v-'+k).hidden = k !== t; });
  render();
  if (t === 'scan') setTimeout(function(){ var i=$('#scanIn'); if (i) i.focus(); }, 0);
}
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.onclick=function(){ setTab(b.dataset.tab); }; });

/* ── Stock ──────────────────────────────────────────────────────────── */
// A variant's family, for grouping. Items with no parent stand alone.
var RANK = { out:0, low:1, uncounted:2, ok:3, notcarried:4, untracked:5 };
function worst(list){ return list.reduce(function(w,i){ return RANK[i.status] < RANK[w] ? i.status : w; }, 'untracked'); }
function families(list){
  var out = [], byP = {}, G = (S.data && S.data.groups) || {};
  list.forEach(function(i){ if (i.parentId) (byP[i.parentId] = byP[i.parentId] || []).push(i); else out.push({ item:i, st:i.status, name:i.name }); });
  Object.keys(byP).forEach(function(pid){
    var kids = byP[pid].sort(function(a,b){ return (a.variantName||'').localeCompare(b.variantName||'', undefined, {numeric:true}); });
    out.push({ group: G[pid] || { id:pid, name:kids[0].parentName }, kids: kids, st: worst(kids), name: kids[0].parentName || '' });
  });
  return out.sort(function(a,b){ return (RANK[a.st]-RANK[b.st]) || a.name.localeCompare(b.name); });
}
function matches(i, q){ return !q || i.name.toLowerCase().indexOf(q)>=0 || (i.upc||'').toLowerCase().indexOf(q)>=0 || (i.sku||'').toLowerCase().indexOf(q)>=0; }

// On hand over the last 30 days. A STEP line, because a balance does not
// glide between syncs — it holds, then drops. The dashed line is the reorder
// point, so "how close did it get" reads without a number.
function sparkSvg(i){
  var pts = i.spark;
  if (!pts || !pts.length) return '<span class="isub" title="No count yet, so nothing to draw">—</span>';
  var W = 96, H = 26, P = 3;
  var t0 = Date.parse(pts[0][0]), t1 = Date.parse(pts[pts.length-1][0]); if (!(t1 > t0)) t1 = t0 + 1;
  var vals = pts.map(function(p){ return p[1]; }); if (i.reorder != null) vals.push(i.reorder);
  var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max.apply(null, vals); if (hi <= lo) hi = lo + 1;
  var x = function(t){ return P + (Date.parse(t) - t0) / (t1 - t0) * (W - 2*P); };
  var y = function(v){ return H - P - (v - lo) / (hi - lo) * (H - 2*P); };
  var d = '';
  pts.forEach(function(p, k){ var X = x(p[0]).toFixed(1), Y = y(p[1]).toFixed(1); d += k ? ' H' + X + ' V' + Y : 'M' + X + ' ' + Y; });
  var last = pts[pts.length-1], first = pts[0];
  var ro = i.reorder != null ? '<line class="ro" x1="'+P+'" x2="'+(W-P)+'" y1="'+y(i.reorder).toFixed(1)+'" y2="'+y(i.reorder).toFixed(1)+'"/>' : '';
  return '<svg class="spark" width="'+W+'" height="'+H+'" role="img" data-spark="'+pts.length+'" aria-label="On hand over 30 days, '+first[1]+' to '+last[1]+'">'+
    '<title>On hand, last 30 days: '+first[1]+' → '+last[1]+(i.reorder!=null?' (reorder at '+i.reorder+')':'')+'</title>'+
    ro+'<path class="ln" d="'+d+'"/><circle class="end" r="2.2" cx="'+x(last[0]).toFixed(1)+'" cy="'+y(last[1]).toFixed(1)+'"/></svg>';
}

function stockRow(i, isVariant){
  var par = i.par || null, pct = i.onHand === null || !par ? 0 : Math.max(0, Math.min(100, i.onHand/par*100));
  var label = isVariant ? (i.variantName || i.name) : i.name;
  var sub = [isVariant && i.sku ? '<span class="mono">'+esc(i.sku)+'</span>' : '', money(i.price)].filter(Boolean).join(' · ');
  return '<tr data-inv-row="'+esc(i.id)+'" data-status="'+i.status+'"'+(isVariant?' class="vrow" data-parent="'+esc(i.parentId)+'"':'')+'>'+
    '<td><div class="iname">'+esc(label)+'</div><div class="isub">'+sub+'</div></td>'+
    '<td>'+(i.upc ? '<span class="mono">'+esc(i.upc)+'</span>' : '<span class="nobar">No barcode yet</span>')+'</td>'+
    '<td class="r num" data-onhand="'+(i.onHand===null?'':i.onHand)+'">'+(i.onHand===null ? '<span class="isub">—</span>' : '<b>'+i.onHand+'</b>'+(par ? '<span class="meter" title="'+i.onHand+' of '+par+' par"><i class="'+i.status+'" style="width:'+pct+'%"></i></span>' : ''))+'</td>'+
    '<td>'+sparkSvg(i)+'</td>'+
    '<td class="r num">'+(i.reorder==null?'<span class="isub">set</span>':i.reorder)+'</td>'+
    '<td><span class="chip '+i.status+'">'+STATUS_LABEL[i.status]+'</span></td>'+
    '<td class="r num">'+i.sold7+'</td>'+
    '<td class="r num">'+(i.onHand===null ? '—' : i.onHand<=0 ? '<span style="color:var(--bad)">now</span>' : i.daysLeft===null ? '—' : i.daysLeft+' days')+'</td>'+
    '<td><div class="acts"><button type="button" class="btn" data-hist="'+esc(i.id)+'">History</button><button type="button" class="btn'+(i.onHand===null?' pri':'')+'" data-count="'+esc(i.id)+'">Count</button>'+(i.onHand===null?'':'<button type="button" class="btn pri" data-recv="'+esc(i.id)+'">Receive</button>')+'</div></td>'+
  '</tr>';
}
function groupRow(f, open){
  var g = f.group, low = f.kids.filter(function(i){ return i.status==='low'||i.status==='out'; }).length;
  var unc = f.kids.filter(function(i){ return i.status==='uncounted'; }).length;
  var sold = f.kids.reduce(function(a,i){ return a + i.sold7; }, 0);
  var oh = f.kids.filter(function(i){ return i.onHand !== null; });
  var sum = oh.reduce(function(a,i){ return a + Math.max(0,i.onHand); }, 0);
  return '<tr class="grp" data-inv-group="'+esc(g.id)+'" data-open="'+(open?'1':'0')+'">'+
    '<td colspan="2"><button type="button" class="caret" data-toggle="'+esc(g.id)+'" aria-expanded="'+open+'" aria-label="'+(open?'Collapse':'Expand')+' '+esc(f.name)+'">'+(open?'&#9662;':'&#9656;')+'</button>'+
      '<span class="iname">'+esc(f.name)+'</span><span class="vct">'+f.kids.length+' variant'+(f.kids.length===1?'':'s')+'</span>'+
      '<div class="isub" style="padding-left:18px">'+(low ? low+' at or below reorder point' : unc ? unc+' still need a count' : 'All variants stocked')+'</div></td>'+
    '<td class="r num" data-group-onhand="'+(oh.length?sum:'')+'">'+(oh.length ? '<b>'+sum+'</b>'+(unc?'<div class="isub">+'+unc+' uncounted</div>':'') : '<span class="isub">—</span>')+'</td>'+
    '<td></td><td></td><td><span class="chip '+f.st+'">'+STATUS_LABEL[f.st]+'</span></td>'+
    '<td class="r num">'+sold+'</td><td></td><td></td></tr>';
}
function renderStock(){
  if (!S.data){ $('#v-stock').innerHTML='<div class="panel"><div class="empty">Loading…</div></div>'; return; }
  var q = S.q.toLowerCase();
  var rows = tracked().filter(function(i){ return (S.filter === 'all' || i.status === S.filter) && (matches(i, q) || (q && (i.parentName||'').toLowerCase().indexOf(q) >= 0)); });
  var seg = [['all','All'],['low','At reorder point'],['out','Out'],['uncounted','Needs a count'],['ok','In stock']].map(function(x){ return '<button type="button" data-f="'+x[0]+'" aria-pressed="'+(S.filter===x[0])+'">'+x[1]+'</button>'; }).join('');
  // A family opens on its own when a filter or a search is narrowing the
  // view — otherwise its matching variants would be hidden under a caret.
  var narrowed = S.filter !== 'all' || !!q;
  var body = families(rows).map(function(f){
    if (f.item) return stockRow(f.item, false);
    var open = narrowed || !!S.open[f.group.id];
    return groupRow(f, open) + (open ? f.kids.map(function(i){ return stockRow(i, true); }).join('') : '');
  }).join('');
  var empty = !tracked().length ? 'No items are tracked yet. Turn on the ones you stock under <b>Items from Rec</b>.' : 'Nothing matches this filter.';
  $('#v-stock').innerHTML = '<div class="panel"><div class="ph"><h2>On hand</h2><input type="search" id="q" placeholder="Search name, SKU or UPC" value="'+esc(S.q)+'" aria-label="Search items"><div class="seg">'+seg+'</div></div>'+
    '<div class="tscroll"><table><thead><tr><th>Item</th><th>UPC</th><th class="r">On hand</th><th>Last 30 days</th><th class="r">Reorder at</th><th>Status</th><th class="r">Sold 7d</th><th class="r">Runs out in</th><th></th></tr></thead><tbody>'+
    (body || '<tr><td colspan="9"><div class="empty">'+empty+'</div></td></tr>')+'</tbody></table></div>'+
    '<div class="note">On hand = last physical count, minus sales from Rec’s item log, plus refunds, voids and deliveries received. "Runs out in" uses the last 7 days’ pace. An item with variants is counted per variant; its row adds up the counted ones.</div></div>';
  Array.prototype.forEach.call($('#v-stock').querySelectorAll('[data-f]'), function(b){ b.onclick=function(){ S.filter=b.dataset.f; render(); }; });
  Array.prototype.forEach.call($('#v-stock').querySelectorAll('[data-toggle]'), function(b){ b.onclick=function(){ var id=b.dataset.toggle; S.open[id]=!S.open[id]; renderStock(); }; });
  var qi = $('#q'); qi.oninput = function(){ S.q=qi.value; var p=qi.selectionStart; renderStock(); var n=$('#q'); n.focus(); n.setSelectionRange(p,p); };
  wireRowActions($('#v-stock'));
}
function wireRowActions(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-count]'), function(b){ b.onclick=function(){ openCount(byId(b.dataset.count)); }; });
  Array.prototype.forEach.call(root.querySelectorAll('[data-recv]'), function(b){ b.onclick=function(){ openReceive(byId(b.dataset.recv)); }; });
  Array.prototype.forEach.call(root.querySelectorAll('[data-hist]'), function(b){ b.onclick=function(){ openHistory(byId(b.dataset.hist)); }; });
}

/* ── Movement: what sells, what sits, and how fast ──────────────────── */
// Series are items and whole families ("Candy Bars, all variants"). Every
// figure is units per day from the server's daily tally, which records every
// sale whether or not the shelf has been counted — so a product's velocity
// does not start on the day somebody first counted it.
var MV_MAX = 8;
function mvSeries(){
  var out = [], G = (S.data && S.data.groups) || {};
  items().filter(function(i){ return i.live && i.type === 'product' && i.daily; }).forEach(function(i){
    out.push({ id:i.id, name:i.name, daily:i.daily, onHand:i.onHand, track:i.track && i.carried !== false, item:i });
  });
  Object.keys(G).forEach(function(pid){ var g = G[pid]; if (g.daily) out.push({ id:'g:'+pid, name:g.name+' (all variants)', daily:g.daily, onHand:g.onHand, family:true, track:g.tracked > 0 }); });
  return out;
}
function sumLast(a, n, skip){ var t = 0, e = a.length - (skip||0); for (var k = Math.max(0, e-n); k < e; k++) t += a[k] || 0; return t; }
// A colour belongs to the SERIES, handed out in the order it was added and
// held until it is removed — so adding a fourth product never repaints the
// three already on the chart.
function mvColor(id){ var pal = window.RECESS_CAT || ['#57534e']; var k = (S.mvSel||[]).indexOf(id); return k < 0 ? null : pal[S.mvSlot[id] % pal.length]; }
function mvAdd(id){
  S.mvSel = S.mvSel || []; S.mvSlot = S.mvSlot || {};
  if (S.mvSel.indexOf(id) >= 0){ S.mvSel = S.mvSel.filter(function(x){ return x !== id; }); delete S.mvSlot[id]; return; }
  if (S.mvSel.length >= MV_MAX){ toast('Up to '+MV_MAX+' lines at once — remove one first'); return; }
  var used = Object.keys(S.mvSlot).map(function(k){ return S.mvSlot[k]; }), slot = 0; while (used.indexOf(slot) >= 0) slot++;
  S.mvSel.push(id); S.mvSlot[id] = slot;
}
function renderMove(){
  var root = $('#v-move');
  if (!S.data){ root.innerHTML = ''; return; }
  var N = S.mvDays, all = mvSeries();
  var ranked = all.filter(function(x){ return !x.family; }).map(function(x){
    var u = sumLast(x.daily, N), prev = N * 2 <= x.daily.length ? sumLast(x.daily, N, N) : null;
    return { s:x, units:u, prev:prev };
  });
  var hot = ranked.filter(function(r){ return r.units > 0; }).sort(function(a,b){ return b.units - a.units || a.s.name.localeCompare(b.s.name); }).slice(0, 10);
  // Slowest is about what is SITTING on the shelf: tracked items only, the
  // ones selling least first, and among equals the one holding most stock.
  var slow = ranked.filter(function(r){ return r.s.track; }).sort(function(a,b){ return a.units - b.units || ((b.s.onHand||0) - (a.s.onHand||0)) || a.s.name.localeCompare(b.s.name); }).slice(0, 10);
  if (S.mvSel === null){ S.mvSel = []; S.mvSlot = {}; hot.slice(0, 3).forEach(function(r){ mvAdd(r.s.id); }); }
  var maxU = hot.length ? hot[0].units : 1;
  var trend = function(r){
    if (r.prev === null) return '<span class="t">—</span>';
    if (!r.prev) return r.units ? '<span class="t up" title="Nothing sold the '+N+' days before">new</span>' : '<span class="t">—</span>';
    var pct = Math.round((r.units - r.prev) / r.prev * 100);
    return '<span class="t '+(pct>0?'up':pct<0?'dn':'')+'" title="vs the '+N+' days before ('+r.prev+')">'+(pct>0?'▲ ':pct<0?'▼ ':'')+Math.abs(pct)+'%</span>';
  };
  var li = function(r, k, isHot){
    var on = S.mvSel.indexOf(r.s.id) >= 0;
    return '<li data-mv-rank="'+esc(r.s.id)+'" class="'+(on?'on':'')+'" title="Click to '+(on?'remove from':'add to')+' the chart"><span class="n">'+(k+1)+'</span><span class="nm">'+esc(r.s.name)+'</span>'+
      (isHot ? '<span><span class="bar" style="display:block;width:'+Math.max(2, r.units/maxU*100)+'%"></span></span>'
             : '<span class="isub">'+(r.s.onHand===null ? 'not counted' : r.s.onHand+' on hand')+'</span>')+
      '<span class="u">'+r.units+'</span>'+(isHot ? trend(r) : '<span class="t">'+(r.units ? (r.units/N).toFixed(1)+'/day' : 'none sold')+'</span>')+'</li>';
  };
  var seg = [[7,'7 days'],[30,'30 days'],[90,'90 days']].map(function(x){ return '<button type="button" data-mvd="'+x[0]+'" aria-pressed="'+(N===x[0])+'">'+x[1]+'</button>'; }).join('');
  var q = S.mvQ.toLowerCase();
  var pool = all.filter(function(x){ return S.mvSel.indexOf(x.id) < 0 && (!q || x.name.toLowerCase().indexOf(q) >= 0); })
    .sort(function(a,b){ return sumLast(b.daily,N) - sumLast(a.daily,N) || a.name.localeCompare(b.name); });
  var shown = S.mvMore || q ? pool.slice(0, 60) : pool.slice(0, 10);
  var chip = function(x){ var c = mvColor(x.id), on = !!c;
    return '<button type="button" class="vchip" data-mv-chip="'+esc(x.id)+'" aria-pressed="'+on+'"><i style="'+(on?'background:'+c:'')+'"></i>'+esc(x.name)+
      ' <span class="x">'+sumLast(x.daily,N)+'</span>'+(on?'<span class="x" aria-hidden="true">×</span>':'')+'</button>'; };
  var selChips = S.mvSel.map(function(id){ return all.find(function(x){ return x.id === id; }); }).filter(Boolean);
  root.innerHTML =
    '<div class="panel" style="margin-bottom:14px"><div class="ph"><h2>Velocity</h2><span class="isub">units sold per day'+(N>7?', 7-day average':'')+' · click a product to add or remove its line</span><div class="seg">'+seg+'</div></div>'+
    '<div class="vchips">'+selChips.map(chip).join('')+shown.map(chip).join('')+
      (!q && !S.mvMore && pool.length > shown.length ? '<button type="button" class="vchip" id="mvMore">+'+(pool.length-shown.length)+' more</button>' : '')+
      '<input type="search" id="mvQ" placeholder="Find a product…" value="'+esc(S.mvQ)+'" aria-label="Find a product" style="margin-left:auto;border:1px solid var(--line2);border-radius:99px;padding:4px 11px;min-width:0;width:200px;max-width:100%"></div>'+
    '<div class="vchart" id="vchart"></div>'+
    '<div class="note">Refunds and voids come off the day they happened. Sales come from Rec’s item log every hour, whether or not the shelf has been counted.</div></div>'+
    '<div class="mv-grid">'+
      '<div class="panel"><div class="ph"><h2>Hottest</h2><span class="isub">most units sold, last '+N+' days</span></div><ul class="rank" data-mv-list="hot">'+(hot.length ? hot.map(function(r,k){ return li(r,k,true); }).join('') : '<li class="isub" style="display:block;cursor:default">Nothing sold in the last '+N+' days.</li>')+'</ul></div>'+
      '<div class="panel"><div class="ph"><h2>Slowest</h2><span class="isub">tracked items selling least, last '+N+' days</span></div><ul class="rank" data-mv-list="slow">'+(slow.length ? slow.map(function(r,k){ return li(r,k,false); }).join('') : '<li class="isub" style="display:block;cursor:default">Track some items first, under Items from Rec.</li>')+'</ul></div>'+
    '</div>';
  Array.prototype.forEach.call(root.querySelectorAll('[data-mvd]'), function(b){ b.onclick = function(){ S.mvDays = +b.dataset.mvd; renderMove(); }; });
  Array.prototype.forEach.call(root.querySelectorAll('[data-mv-chip],[data-mv-rank]'), function(b){ b.onclick = function(){ mvAdd(b.dataset.mvChip || b.dataset.mvRank); renderMove(); }; });
  var mm = $('#mvMore'); if (mm) mm.onclick = function(){ S.mvMore = true; renderMove(); };
  var mq = $('#mvQ'); mq.oninput = function(){ S.mvQ = mq.value; var p = mq.selectionStart; renderMove(); var n = $('#mvQ'); n.focus(); n.setSelectionRange(p,p); };
  drawVelocity(selChips.map(function(x){ return { id:x.id, name:x.name, daily:x.daily, color:mvColor(x.id) }; }), N);
}

  var fam = families(list).sort(function(a,b){
    var ta = a.item ? a.item.type : 'product', tb = b.item ? b.item.type : 'product';
    return (ta==='product'?0:1)-(tb==='product'?0:1) || a.name.localeCompare(b.name);
  });
  var rows = fam.map(function(f){
    if (f.item) return setupRow(f.item, false);
    var carried = f.kids.filter(function(i){ return i.carried !== false; }), on = carried.filter(function(i){ return i.track; }).length;
    var open = !!S.open['s:'+f.group.id];
    return '<tr class="grp" data-setup-group="'+esc(f.group.id)+'"><td><label class="toggle" title="Track every variant Rec says you carry"><input type="checkbox" data-gtk="'+esc(f.group.id)+'" '+(on && on===carried.length?'checked':'')+' aria-label="Track all '+esc(f.name)+'"><span></span></label></td>'+
      '<td colspan="6"><button type="button" class="caret" data-stoggle="'+esc(f.group.id)+'" aria-expanded="'+open+'">'+(open?'&#9662;':'&#9656;')+'</button><span class="iname">'+esc(f.name)+'</span><span class="vct">'+f.kids.length+' variants</span>'+
      '<span class="isub" style="margin-left:8px">'+on+' of '+carried.length+' tracked'+(f.kids.length > carried.length ? ' · '+(f.kids.length-carried.length)+' not carried' : '')+'</span></td></tr>'+
      (open ? f.kids.map(function(i){ return setupRow(i, true); }).join('') : '');
  }).join('');
  $('#v-setup').innerHTML = '<div class="grid2"><div class="panel"><div class="ph"><h2>Store items pulled from Rec</h2><span class="isub">'+list.length+' items</span></div>'+
    '<div class="tscroll"><table style="min-width:760px"><thead><tr><th>Track</th><th>Item</th><th>Type</th><th>Reorder at</th><th>Par</th><th>Unit cost</th><th>UPC</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7"><div class="empty">No store items came back from Rec yet.</div></td></tr>')+'</tbody></table></div>'+
    '<div class="note">Passes, memberships, fees and gift cards come in switched off, so a punch pass never shows up as stock. So does a variant Rec marks not carried; an item’s own switch tracks every variant it carries. Unit cost is optional and only feeds the stock-value figure.</div></div>'+
    '<div class="panel pb"><h2 style="margin:0 0 12px;font-size:15px">Reorder emails</h2>'+
    '<div class="field"><label for="rcpt">Send to</label><input id="rcpt" type="email" multiple value="'+esc(S.data.recipients||'')+'" placeholder="name@city.gov, other@city.gov"><span class="h">Comma-separated. Anyone who places orders.</span></div>'+
    '<div class="row"><button type="button" class="btn pri" id="saveRcpt">Save</button></div>'+
    '<div class="field" style="margin-top:18px"><label>Checks Rec for sales</label><div>Every hour</div><span class="h">Sales, refunds and voids from Rec’s item log.</span></div>'+
    '<div class="field"><label>First-time setup</label><div>Turn on the items you stock, do one physical count of each, set a reorder point, then scan each product once to link its barcode.</div></div></div></div>';
  var root = $('#v-setup');
  Array.prototype.forEach.call(root.querySelectorAll('[data-stoggle]'), function(b){ b.onclick=function(){ var k='s:'+b.dataset.stoggle; S.open[k]=!S.open[k]; renderSetup(); }; });
  Array.prototype.forEach.call(root.querySelectorAll('[data-gtk]'), function(c){ c.onchange=function(){ var g=(S.data.groups||{})[c.dataset.gtk]||{name:''}; save('group',{parentId:c.dataset.gtk,track:c.checked}, function(d){ return (c.checked?'Tracking ':'Stopped tracking ')+(d.changed||0)+' '+g.name+' variant'+(d.changed===1?'':'s'); }).catch(function(){ c.checked=!c.checked; }); }; });
  Array.prototype.forEach.call(root.querySelectorAll('[data-tk]'), function(c){ c.onchange=function(){ var it=byId(c.dataset.tk); save('item',{id:it.id,track:c.checked}, it.name+(c.checked?' is now tracked':' is no longer tracked')).catch(function(){ c.checked=!c.checked; }); }; });
  var bind = function(attr, key){ Array.prototype.forEach.call(root.querySelectorAll('['+attr+']'), function(c){ c.onchange=function(){ var o={id:c.getAttribute(attr)}; o[key]=c.value===''?null:c.value; save('item',o,'Saved').catch(function(){}); }; }); };
  bind('data-ro','reorder'); bind('data-par','par'); bind('data-cost','cost');
  Array.prototype.forEach.call(root.querySelectorAll('[data-unlink]'), function(b){ b.onclick=function(){ save('item',{id:b.dataset.unlink,upc:''},'Barcode removed').catch(function(){}); }; });
  $('#saveRcpt').onclick = function(){ save('prefs',{recipients:$('#rcpt').value}, function(d){ return d.recipients ? 'Reorder emails go to '+d.recipients : 'No valid addresses — reorder emails are off'; }).catch(function(){}); };
}

function render(){ renderChrome(); ({stock:renderStock, move:renderMove, scan:renderScan, alerts:renderAlerts, setup:renderSetup})[S.tab](); }

$('#syncBtn').onclick = function(){
  var b=$('#syncBtn'); b.disabled=true; b.textContent='Syncing…';
  api('sync',{}).then(function(d){ S.data=d; render(); var l=d.lastSync||{}; toast('Pulled '+(l.sales||0)+' sales, '+(l.refunds||0)+' refunds and '+(l.voids||0)+' voids from Rec'); })
    .catch(function(e){ toast('Sync failed: '+e.message); load(); })
    .then(function(){ b.disabled=false; b.innerHTML='&#8635; Sync with Rec now'; });
};
setTab(S.tab);
load();
})();
</script>

<script src="/feedback-widget.js" defer></script>
<script src="/nav-breadcrumb.js" defer></script>
