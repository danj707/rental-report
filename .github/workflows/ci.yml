name: CI

# Fast pre-deploy validation. Railway's "Wait for CI" gates production
# deploys on this passing, so a syntax error can't reach prod (see the
# boot-crash incidents this was added to prevent).
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    # The render check used to live in this job and the two together outgrew a
    # 10-minute budget: on 2026-09-01 CI was CANCELLED mid-render with every
    # assertion green, which reads exactly like a failure and blocks the merge.
    # They are separate jobs now, so each has its own budget and they run at the
    # same time.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check root JS (node --check)
        run: |
          shopt -s nullglob
          for f in *.js; do echo "→ node --check $f"; node --check "$f"; done

      # The boot check needs the real modules — server.js requires
      # @opentelemetry/sdk-node and friends at the top. Puppeteer's Chromium is
      # skipped: it is ~150MB and every require("puppeteer") in server.js is
      # lazy, inside the function that renders a PDF, so booting never needs it.
      # `npm install`, not `npm ci`: package-lock.json is gitignored in this
      # repo, and npm ci requires a lockfile.
      - name: Install dependencies (for the boot check)
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Boot the server and confirm it answers
        run: node scripts/ci-boot-check.js

      - name: Install @babel/standalone (for JSX parse check)
        run: npm install --no-save @babel/standalone@7.23.9

      - name: Validate public/*.html JSX blocks
        run: node scripts/ci-check-html.js

      - name: PDF export helper spec (popup, not a sandboxed download)
        run: node scripts/open-pdf.spec.js

      - name: Feed error message spec
        run: node scripts/feed-error-message.spec.js

      - name: Saved-view helpers spec (one date mirror; offered ranges are storable; per-report allowlists)
        run: node scripts/saved-views.spec.js

      - name: Delete-org source surgery spec (never push an unparseable server.js)
        run: node scripts/delete-org.spec.js

      - name: Breaking schema-drift spec (dropped tables/columns, no noise)
        run: node scripts/schema-break.spec.js

      - name: Card-drift spec (probe the served card; catch a Date tag reset to Text)
        run: node scripts/card-drift.spec.js

      # Saving a card in Metabase regenerates its parameter ids, and the app
      # caches those for an hour — so for that hour every org's request carried
      # the pre-save id and a REQUIRED tag failed the query outright. It took the
      # Waitlist report down platform-wide on 2026-09-01 and self-healed on the
      # TTL, which is the worst shape a bug can have.
      - name: Metabase parameter ids (a stale id is re-resolved, a timeout is not re-queried)
        run: node scripts/mb-param-ids.spec.js

      - name: Report-activity spec (only alert on reports someone actually uses)
        run: node scripts/report-activity.spec.js
      - name: Feedback metrics on Platform Usage (six rating surfaces, three field names)
        run: node scripts/feedback-metrics.spec.js

      - name: Dead-link alert spec (a tokened 404 is a broken link, a bare one is a bot)
        run: node scripts/deadlink-alert.spec.js

      - name: Watchdog switches spec (OFF means off everywhere)
        run: node scripts/watchdog-flags.spec.js

      - name: Campmap beacon spec (routes registered before the generic ones; events recorded)
        run: node scripts/campmap-beacons.spec.js

      - name: Campmap stay spec (checkout night is free; arrivals capped, checkouts not)
        run: node scripts/campmap-stay.spec.js

      - name: Campmap nightly window spec (the feed's date range)
        run: node scripts/campmap-nightly-window.spec.js

      - name: Campmap activity spec (this org's map traffic only; no rate on a thin denominator)
        run: node scripts/campmap-activity.spec.js

      - name: Facility summary KPI spec (a fee line is money, not a booking or a site)
        run: node scripts/facility-summary.spec.js

      - name: Fast Track heat spec (capacity share keeps the majority; the cold end stays quiet)
        run: node scripts/fasttrack-heat.spec.js

      - name: Fast Track date spec (calendar dates keep their date; early access counts as go-live)
        run: node scripts/fasttrack-dates.spec.js

      - name: Event log cache spec (fresh on append; never re-parses the whole log)
        run: node scripts/event-cache.spec.js

      - name: Fast Track conversion spec (measured against the spots open to FT, not all holds)
        run: node scripts/fasttrack-conv.spec.js

      - name: Fast Track triage spec (a section that has not opened outranks a capacity warning)
        run: node scripts/fasttrack-launching-soon.spec.js

      # Pins that the capacity headline reads Over Demand and never Left on
      # Table (opposite fixes), and that a section in EARLY ACCESS reaches the
      # Conversions tab while a DRAFT never does — promoting drafts took Smyrna's
      # post-registration set from 127 sections to 1,522.
      - name: Fast Track missed-revenue spec (over-demand, not pending value; early access counts as launched)
        run: node scripts/fasttrack-missed-revenue.spec.js

      # Card 17300 v18 emits 'early-access' as its own Reg Status. A pre-v18
      # response — and every warm 4-hour cache entry holding one — still says
      # 'pipeline' with an open early window, so BOTH shapes are live at once and
      # must resolve identically, or the report changes what it says about a
      # section when a cache expires. Also pins that early access still counts as
      # post-registration (one helper, so the tab and its badge cannot drift).
      - name: Fast Track early-access spec (its own phase; both feed shapes agree)
        run: node scripts/fasttrack-early-access.spec.js

      # Railway PR previews inherit the service's SLACK_WEBHOOK_URL and get their
      # own volume, so each one posted its own daily digest into the live feed —
      # three contradictory "Daily activity" messages in one morning. Pins the
      # gate, and pins that it FAILS OPEN off-Railway (a silently dead activity
      # feed is worse than a duplicate).
      - name: Slack posts only from production (previews muted)
        run: node scripts/slack-production-only.spec.js

      - name: Outdoor events hour spec (hours covered, not hours started; multi-day excluded)
        run: node scripts/outdoor-hours.spec.js

      # "Pools can be courts, but courts can never be pools" (Dan). The page used
      # to RECOVER court-typed swim lanes with a regex over the site name and the
      # location — a guess that had to be right about every org from one pattern.
      # It is per-org configuration now, and this pins that the guess cannot come
      # back and that all five aquatics surfaces scope through one predicate.
      - name: Aquatics scope (pools by default; extra site types are configured, never guessed)
        run: node scripts/aquatics-scope.spec.js

      - name: Chart data is downloadable (panel CSV + workbook sheets)
        run: node scripts/panel-csv.spec.js

      - name: Programs location filter (one funnel; a stale ?loc= cannot empty the report)
        run: node scripts/programs-location.spec.js

      - name: Programs season filter (multi-select; one funnel scopes both dimensions)
        run: node scripts/programs-season.spec.js

      - name: Programs auto-pay share (dollars vs registrations; no plan money is null, never 0%)
        run: node scripts/programs-autopay.spec.js

      - name: Programs instructor filter + by-month panel (one picker, three dimensions, no date parsing)
        run: node scripts/programs-instructor.spec.js
      - name: Programs summary — the revenue labels and Total Refunds
        run: node scripts/programs-revenue-labels.spec.js

      # Laurel at Shrewsbury: cancelled sections on the report, and a season
      # picker that only existed once a 31-second load had finished. Plus the
      # bugs found the same afternoon — the Top Programs bars scaled to the
      # first row rather than the largest, three noisy bands above the numbers
      # people come for, and every report's toolbar pinned UNDERNEATH the
      # early-access banner.
      - name: Programs summary — cancellations, seasons before the rows, pills, sticky toolbar
        run: node scripts/programs-summary.spec.js

      # Card 17295's only date filter was the [[ ]] pair at the very bottom, so
      # every CTE above it ran over the org's whole history and was then thrown
      # away. Watertown, Sep 2026: item_tx 14.0s over 9,194 order items, 0.08s
      # over 890 once scoped. v9 lifts that same predicate to the top and leaves
      # the bottom clauses in place as the authority.
      - name: Card 17295 v9 — the window is applied before the work, not after
        run: node scripts/programs-card-window.spec.js

      # Card 19273 inferred a claim from a timestamp that really marked the
      # EXPIRY SWEEP — of 5,371 grants it called claimed, 5,371 were already
      # expired and ZERO were still open. Conversion read 63% where the truth
      # was 42.5%. Pins the registration-based definition and the rate floor.
      - name: Waitlist invite conversion (a claim is a registration, not a timestamp shape)
        run: node scripts/waitlist-conversion.spec.js

      - name: Fast Track CSV export (one row per participant; the beacon records, not just 200s)
        run: node scripts/fasttrack-export.spec.js

      - name: Facilities hub beacons (hub log route above the generic one; 200 AND a logged row)
        run: node scripts/facilities-beacons.spec.js

      - name: Fields classifiers (sport precedence; lights never fall out of their family)
        run: node scripts/fields-classify.spec.js

      - name: Send Test (typed filters reach the send; saved subscription still wins)
        run: node scripts/test-send.spec.js

      - name: Director's Report site slices (server hour math == the tab's; coverage, not start times)
        run: node scripts/directors-facilities.spec.js

      - name: Check-Ins tab (dates read local; every panel reads the filtered rows; link uses the uuid)
        run: node scripts/checkins-view.spec.js

      - name: Memberships beacons (event in the query string; 200 AND a logged row)
        run: node scripts/checkin-beacons.spec.js

      - name: Add-ons in the note line, Forms link (the add-on money survives its column)
        run: node scripts/facility-addons-forms.spec.js

      - name: Retired reports (overview + annual-report off, and they page nobody)
        run: node scripts/retired-reports.spec.js

      - name: Report Wizard disabled (cannot see it, cannot click it, and it pages nobody)
        run: node scripts/wizard-disabled.spec.js

      - name: GL code multi-select (unmapped money is an option; None sticks; one menu)
        run: node scripts/gl-code-filter.spec.js

      - name: Report settings (one cache-key builder; a setting seeds and never overrides; TTL floor)
        run: node scripts/report-settings.spec.js

      - name: Report settings unlock (the prompt is not the gate; throttled; refusals marked deliberate)
        run: node scripts/report-settings-unlock.spec.js

      - name: Tab chips (a chip never lands on a tab the page will not honour)
        run: node scripts/report-tabs.spec.js

      - name: Memberships paid book (season re-buy is not churn; auto-renew is a plan setting)
        run: node scripts/memberships-revenue.spec.js

      - name: ePACT export (her five columns, her DISTINCT, cancellations out; 14-day default)
        run: node scripts/roster-epact.spec.js

      - name: Absent / Failed statuses (latest mark wins; a denial is not a check-in)
        run: node scripts/checkin-status.spec.js

      - name: Report Wizard activity (runs and thumbs reach Slack; the beacon has its own route)
        run: node scripts/wizard-activity.spec.js

      - name: Report Wizard write-up (no invented figures; one grain map; row counts measured)
        run: node scripts/wizard-narrative.spec.js

      # Was never in CI and had been dead for months: notifySlack() references
      # alertEnabled, which is declared above the extracted block, so the spec
      # threw ReferenceError before asserting anything.
      - name: Slack notification formatting + debounce keys
        run: node scripts/email-slack-notify.spec.js

      - name: Admin dashboard JS (inline blocks parse; every on*= handler resolves)
        run: node scripts/ci-check-admin-js.js

  # The browser half. Split out on 2026-09-01: 223 render cases at ~2.8s each is
  # over ten minutes on its own, and it must never be the reason the spec suite
  # gets squeezed. Raise this budget when the case count grows, never the case
  # count to fit the budget — a render case is the only check in this repo that
  # can see a blank page.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      # The runner image already ships Google Chrome, so this normally prints a
      # path and stops. The fallback is here so the check can never be skipped
      # for want of a browser — that would defeat its entire purpose.
      - name: Ensure a browser for the render check
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /usr/bin/chromium /usr/bin/chromium-browser; do
            if [ -x "$c" ]; then echo "CHROME_PATH=$c" >> "$GITHUB_ENV"; echo "using $c"; exit 0; fi
          done
          echo "no system Chrome — installing puppeteer's"
          npx puppeteer browsers install chrome

      - name: Page render check (real browser; a blank page fails the build)
        run: node scripts/ci-check-render.js

      # A failed load must never become a published layout of seed defaults. Runs
      # after the render check because it drives a real browser and reuses the
      # CDN cache that check populates.
      - name: Campmap pin persistence spec (a blip must not overwrite the layout)
        run: node scripts/campmap-pin-persistence.spec.js
